challenges:
  - id: ch-a-001
    title: The full path of every category
    difficulty: hard
    dataset: shop
    module: m09
    tags: [cte, recursive, hierarchy]
    prompt: |
      The catalog team wants a breadcrumb for every category, like `Electronics > Computers > Laptops`.

      Show each category's `category_id` and its full `path`. The top-level category comes first and the category itself comes last. Put ` > ` (a space, a greater-than sign, a space) between the names.

      Sort the result by `category_id`.
    solution: |
      WITH RECURSIVE tree AS (
          SELECT category_id, name::text AS path
          FROM categories
          WHERE parent_id IS NULL
          UNION ALL
          SELECT c.category_id, t.path || ' > ' || c.name
          FROM categories c
          JOIN tree t ON c.parent_id = t.category_id
      )
      SELECT category_id, path
      FROM tree
      ORDER BY category_id;
    ordered: true
    hints:
      - "A recursive CTE has two parts: the top-level rows first, then the child rows that are added again and again."
      - "Start with the categories whose parent_id IS NULL. In the second part, join each category to the row above it through parent_id, and add its name to the end of the path."
      - "WITH RECURSIVE tree AS (SELECT ... WHERE parent_id IS NULL UNION ALL SELECT ... JOIN tree ...) SELECT category_id, path FROM tree ORDER BY category_id;"
    explanation: |
      A **recursive CTE** calls itself. The first `SELECT` gives the starting rows (the six top-level departments). The second `SELECT` adds the children of the rows found so far, one level at a time, until nothing new appears.

      Building the `path` while you go is the trick: each child takes its parent's path and adds ` > ` and its own name.

  - id: ch-a-002
    title: Everyone in the VP's organisation
    difficulty: hard
    dataset: company
    module: m09
    tags: [cte, recursive, hierarchy, depth]
    prompt: |
      The VP of Engineering (employee 3) wants a list of everyone in their organisation, including the VP. Include people who have left the company too.

      Show `emp_id`, `full_name` (first name, a space, then last name), `job_title` and `depth`. The VP has depth `0`, the VP's direct reports have depth `1`, their reports have depth `2`, and so on.

      Sort by `depth`, then by `emp_id`.
    solution: |
      WITH RECURSIVE org AS (
          SELECT emp_id, first_name, last_name, job_title, 0 AS depth
          FROM employees
          WHERE emp_id = 3
          UNION ALL
          SELECT e.emp_id, e.first_name, e.last_name,
                 e.job_title, o.depth + 1
          FROM employees e
          JOIN org o ON e.manager_id = o.emp_id
      )
      SELECT emp_id,
             first_name || ' ' || last_name AS full_name,
             job_title,
             depth
      FROM org
      ORDER BY depth, emp_id;
    ordered: true
    hints:
      - "Start with the VP's own row, then repeatedly add the people whose manager_id is already in the result."
      - "Keep a depth column: the anchor row has 0, and each recursive step adds 1 to the depth of the manager row."
      - "WITH RECURSIVE org AS (SELECT ... WHERE emp_id = 3 UNION ALL SELECT ... JOIN org o ON e.manager_id = o.emp_id) SELECT ... FROM org;"
    explanation: |
      This is the classic **org chart** query. Each employee points to a manager through `manager_id`, so walking "down" the chart means finding the rows whose `manager_id` is one of the people you already have.

      Counting the depth on every step tells you how many levels below the VP each person sits. Recursive CTEs stop by themselves once no new rows are found, so there is no endless loop here.

  - id: ch-a-003
    title: Days with no orders
    difficulty: hard
    dataset: shop
    module: m09
    tags: [cte, recursive, date, left-join]
    prompt: |
      The shop wants to find quiet days. Show every day from 1 March 2024 to 15 March 2024 (both days included), with the number of orders placed on that day.

      Days with no orders must still appear, with `0` as the count.

      Show `order_day` and `orders`, sorted by `order_day`.
    solution: |
      WITH RECURSIVE days AS (
          SELECT DATE '2024-03-01' AS order_day
          UNION ALL
          SELECT order_day + 1
          FROM days
          WHERE order_day < DATE '2024-03-15'
      )
      SELECT d.order_day,
             COUNT(o.order_id) AS orders
      FROM days d
      LEFT JOIN orders o ON o.order_date = d.order_day
      GROUP BY d.order_day
      ORDER BY d.order_day;
    ordered: true
    hints:
      - "First build a list of dates. A recursive CTE can add one day at a time."
      - "Then LEFT JOIN that list to orders. A LEFT JOIN keeps the days that have no orders."
      - "Count the order_id column, not *, so that a day with no orders counts as 0."
    explanation: |
      A **date spine** is a list of every date in a period. It makes "no sales" visible. If you started from the `orders` table alone, the quiet days would simply be missing from the result.

      `COUNT(o.order_id)` returns 0 for a day with no matching order, but `COUNT(*)` would return 1 for that day because the LEFT JOIN still produces one row.

  - id: ch-a-004
    title: High-value customers
    difficulty: hard
    dataset: shop
    module: m09
    tags: [cte, join, aggregation, having]
    prompt: |
      Finance wants a list of high-value customers. Use only **delivered** orders. Find every customer whose total spending is more than $5,000.00.

      Show `customer_id`, `full_name` (first name, a space, then last name) and `total_spent`, rounded to 2 decimals.

      Sort by `total_spent` from highest to lowest, then by `customer_id`.
    solution: |
      WITH delivered_lines AS (
          SELECT o.customer_id,
                 i.quantity * i.unit_price * (1 - i.discount) AS line_total
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
      ),
      customer_totals AS (
          SELECT customer_id,
                 ROUND(SUM(line_total), 2) AS total_spent
          FROM delivered_lines
          GROUP BY customer_id
      )
      SELECT c.customer_id,
             c.first_name || ' ' || c.last_name AS full_name,
             t.total_spent
      FROM customer_totals t
      JOIN customers c ON c.customer_id = t.customer_id
      WHERE t.total_spent > 5000
      ORDER BY t.total_spent DESC, c.customer_id;
    ordered: true
    hints:
      - "Each order line costs quantity times unit_price, minus the discount. The discount is a fraction, so use (1 - discount)."
      - "Use one CTE for the line totals, a second CTE to add them up per customer, and then filter and join to customers."
      - "WITH lines AS (...), totals AS (SELECT customer_id, SUM(...) AS total_spent FROM lines GROUP BY customer_id) SELECT ... FROM totals WHERE total_spent > 5000;"
    explanation: |
      A **chain of CTEs** reads like a recipe: step one makes line totals, step two adds them up per customer, and step three filters and adds names. Each CTE can be tested on its own, which is why this style is easier to debug than one long nested query.

      Notice that the filter `total_spent > 5000` happens after the grouping. A `WHERE` clause cannot test a total, because the total does not exist yet at that point.

  - id: ch-a-005
    title: Star product in each category
    difficulty: hard
    dataset: shop
    module: m10
    tags: [window, row-number, top-n]
    prompt: |
      Each category needs one star product for the homepage: its most expensive **active** product (`is_active` is TRUE). If two active products in the same category cost exactly the same, pick the one with the lower `product_id`.

      Show `category_id`, `product_id`, `name` and `price` for every category that has at least one active product.

      Sort by `category_id`.
    solution: |
      SELECT category_id, product_id, name, price
      FROM (
          SELECT category_id, product_id, name, price,
                 ROW_NUMBER() OVER (
                     PARTITION BY category_id
                     ORDER BY price DESC, product_id
                 ) AS rn
          FROM products
          WHERE is_active
      ) ranked
      WHERE rn = 1
      ORDER BY category_id;
    ordered: true
    hints:
      - "Give each product a number inside its own category, starting from the most expensive."
      - "Use ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY price DESC, product_id). The PARTITION BY restarts the numbering for each category."
      - "Wrap the numbered rows in a subquery and keep only the rows where rn = 1."
    explanation: |
      `ROW_NUMBER()` gives every row a number inside its group. Putting the numbering in a subquery and then filtering on `rn = 1` is the standard **top-1 per group** pattern.

      The second column in `ORDER BY` (`product_id`) is a **tie-breaker**. Without it, two products with the same price could swap places from one run to the next.

  - id: ch-a-006
    title: The second-highest salary
    difficulty: hard
    dataset: company
    module: m10
    tags: [window, dense-rank, interview]
    prompt: |
      HR is checking the pay bands. Look only at employees who are still with the company (their `terminated_on` is empty).

      What is the second-highest **distinct** salary? If two people share the highest salary, that salary counts only once.

      Show one row with one column, named `second_highest_salary`.
    solution: |
      SELECT DISTINCT salary AS second_highest_salary
      FROM (
          SELECT salary,
                 DENSE_RANK() OVER (ORDER BY salary DESC) AS salary_rank
          FROM employees
          WHERE terminated_on IS NULL
      ) ranked
      WHERE salary_rank = 2;
    columnNames: true
    hints:
      - "DENSE_RANK gives equal salaries the same number, and the next different salary the next number."
      - "Number the salaries from the highest down, then keep the rows whose number is 2."
      - "SELECT DISTINCT salary AS second_highest_salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS salary_rank FROM employees WHERE ___) ranked WHERE salary_rank = 2;"
    explanation: |
      This is one of the most asked SQL interview questions. `DENSE_RANK()` is the right tool because it does not skip numbers after a tie. With `RANK()`, two people tied for first would push the second-highest salary down to rank 3.

      Using `DISTINCT` keeps the answer to one row if two people share the second-highest salary.

  - id: ch-a-007
    title: Running balance for one quarter
    difficulty: hard
    dataset: bank
    module: m10
    tags: [window, running-total, sum-over]
    prompt: |
      Account 46 is being reviewed for the first quarter of 2024. Show a running balance for every transaction on that account from 1 January 2024 up to, but not including, 1 April 2024.

      Show `txn_time`, `txn_id`, `amount` and `balance`. The `balance` is the total of all amounts up to and including that row.

      Sort by `txn_time`, then by `txn_id`.
    solution: |
      SELECT txn_time,
             txn_id,
             amount,
             SUM(amount) OVER (
                 ORDER BY txn_time, txn_id
             ) AS balance
      FROM transactions
      WHERE account_id = 46
        AND txn_time >= '2024-01-01'
        AND txn_time < '2024-04-01'
      ORDER BY txn_time, txn_id;
    ordered: true
    hints:
      - "A running total adds up the rows in order, one row at a time. Put ORDER BY inside OVER to make it run."
      - "Use SUM(amount) OVER (ORDER BY txn_time, txn_id). The txn_id breaks ties when two transactions share a time."
      - "SELECT txn_time, txn_id, amount, SUM(amount) OVER (ORDER BY ___) AS balance FROM transactions WHERE account_id = 46 AND ___ ORDER BY ___;"
    explanation: |
      A **running total** uses `SUM(...) OVER (ORDER BY ...)`. Each row gets the sum of its own amount and every amount before it.

      Accounts start 2024 at zero, so the balance on the last row of March is the balance at the end of the quarter. Adding `txn_id` to the `ORDER BY` makes the order certain even when two transactions share the same time.

  - id: ch-a-008
    title: Days between a customer's orders
    difficulty: hard
    dataset: shop
    module: m10
    tags: [window, lag, date]
    prompt: |
      Customer 6 (Noor Haddad) is one of the shop's best customers. Show the history of her orders, with the number of days since her previous order.

      Show `order_id`, `order_date` and `days_since_previous`. For her first order, `days_since_previous` stays empty.

      Include every order she placed, whatever its status. Sort by `order_date`, then by `order_id`.
    solution: |
      SELECT order_id,
             order_date,
             order_date - LAG(order_date) OVER (
                 ORDER BY order_date, order_id
             ) AS days_since_previous
      FROM orders
      WHERE customer_id = 6
      ORDER BY order_date, order_id;
    ordered: true
    hints:
      - "LAG() looks back at the row before the current one. Here, that means the customer's previous order."
      - "Subtract the previous order_date from the current one. The result is a number of days."
      - "SELECT order_id, order_date, order_date - LAG(order_date) OVER (ORDER BY ___) AS days_since_previous FROM orders WHERE ___;"
    explanation: |
      `LAG(column)` returns the value from the previous row in the window, and `NULL` for the very first row. Subtracting two dates in PostgreSQL gives the number of days between them.

      The `WHERE customer_id = 6` filter runs before the window function, so `LAG` only looks at her orders. Filtering after the window would have mixed in other customers.

  - id: ch-a-009
    title: Smoothing the monthly revenue
    difficulty: hard
    dataset: shop
    module: m11
    tags: [window, moving-average, rows-frame]
    prompt: |
      Monthly sales go up and down, so the shop looks at a three-month moving average. Use **delivered** orders only, and decide each order's month from its `order_date`.

      For every month from January 2023 to December 2024, show:

      - `month`: the month as text, like `2024-03`
      - `revenue`: that month's revenue, rounded to 2 decimals (an order line's revenue is quantity × unit_price × (1 - discount))
      - `moving_avg_3`: the average of that month's revenue and the revenue of the month before and the month after, rounded to 2 decimals

      For the first and last months, average only the months that exist. January 2023 averages January and February 2023. December 2024 averages November and December 2024.

      Sort by `month`.
    solution: |
      WITH monthly AS (
          SELECT to_char(o.order_date, 'YYYY-MM') AS month,
                 ROUND(SUM(i.quantity * i.unit_price
                           * (1 - i.discount)), 2) AS revenue
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY 1
      )
      SELECT month,
             revenue,
             ROUND(AVG(revenue) OVER (
                 ORDER BY month
                 ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING
             ), 2) AS moving_avg_3
      FROM monthly
      ORDER BY month;
    ordered: true
    hints:
      - "First make one row per month with the month's revenue. Then look at neighbouring rows with a window function."
      - "A frame of ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING covers the row before, the current row and the row after."
      - "WITH monthly AS (SELECT to_char(order_date, 'YYYY-MM') AS month, ... GROUP BY 1) SELECT month, revenue, AVG(revenue) OVER (ORDER BY month ROWS BETWEEN ___ AND ___) FROM monthly;"
    explanation: |
      A **moving average** smooths out noise by averaging each value with its neighbours. The **frame** clause `ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING` says which rows are included for each row.

      At the start and end of the series, the frame has fewer rows, so the average uses only the months that exist. That is what the prompt asks for, and it is worth stating clearly in any report.

  - id: ch-a-010
    title: Typical film length per genre
    difficulty: hard
    dataset: movies
    module: m11
    tags: [percentile, median, group-by, join]
    prompt: |
      FlickNest wants to know how long a typical film runs in each genre. For every genre, show:

      - `genre`: the genre name
      - `movies`: how many movies belong to the genre
      - `median_minutes`: the median `duration_min` of those movies, rounded to 1 decimal

      A film with two genres counts once for each of its genres.

      Sort by `genre`.
    solution: |
      SELECT g.name AS genre,
             COUNT(*) AS movies,
             ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (
                 ORDER BY m.duration_min
             )::numeric, 1) AS median_minutes
      FROM genres g
      JOIN movie_genres mg ON mg.genre_id = g.genre_id
      JOIN movies m ON m.movie_id = mg.movie_id
      GROUP BY g.genre_id, g.name
      ORDER BY g.name;
    ordered: true
    hints:
      - "The median is the middle value. PostgreSQL has a function for it, called a percentile."
      - "PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY duration_min) gives the median of each group."
      - "SELECT g.name, COUNT(*), PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY m.duration_min) FROM genres g JOIN ... GROUP BY ___;"
    explanation: |
      The **median** is the value in the middle when the numbers are sorted. An average can be pulled up by a few very long films, but the median is more typical.

      `PERCENTILE_CONT(0.5)` interpolates between two middle values when the count is even, so the result can have a decimal part. The `::numeric` cast lets `ROUND` take a number of decimal places.

  - id: ch-a-011
    title: The last transaction of the year
    difficulty: hard
    dataset: bank
    module: m11
    tags: [window, frame, last-value]
    prompt: |
      Account 122 is being reconciled. For each of its transactions, show the `txn_id`, the `txn_time`, the `amount`, and `last_amount`. The `last_amount` is the amount of the account's **last** transaction of the year, ordered by `txn_time` and then `txn_id`.

      Show every transaction of account 122. Sort by `txn_time`, then by `txn_id`.
    solution: |
      SELECT txn_id,
             txn_time,
             amount,
             LAST_VALUE(amount) OVER (
                 ORDER BY txn_time, txn_id
                 ROWS BETWEEN UNBOUNDED PRECEDING
                          AND UNBOUNDED FOLLOWING
             ) AS last_amount
      FROM transactions
      WHERE account_id = 122
      ORDER BY txn_time, txn_id;
    ordered: true
    hints:
      - "Without a frame, LAST_VALUE only looks as far as the current row. That gives the wrong answer."
      - "Make the frame cover every row of the account, from the first row to the last one."
      - "LAST_VALUE(amount) OVER (ORDER BY txn_time, txn_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)"
    explanation: |
      This is the most common **LAST_VALUE trap**. When you give a window an `ORDER BY`, its default frame stops at the current row, so `LAST_VALUE` returns the current row's own value.

      Writing the frame explicitly as `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING` makes the window cover the whole account. Always check the frame when you use `FIRST_VALUE` or `LAST_VALUE`.

  - id: ch-a-012
    title: Where each engineer sits in the pay range
    difficulty: hard
    dataset: company
    module: m11
    tags: [window, percent-rank, distribution]
    prompt: |
      HR wants to see where each Engineering employee sits in the pay range. Use the current employees (`terminated_on` is empty) in department 2 (Engineering) only.

      For each of them, show:

      - `emp_id`
      - `salary`
      - `pay_percentile`: the `PERCENT_RANK` of the salary among these employees, rounded to 2 decimals

      `PERCENT_RANK` is 0 for the lowest salary and 1 for the highest. Sort by `emp_id`.
    solution: |
      SELECT emp_id,
             salary,
             ROUND(PERCENT_RANK() OVER (
                 ORDER BY salary
             )::numeric, 2) AS pay_percentile
      FROM employees
      WHERE dept_id = 2
        AND terminated_on IS NULL
      ORDER BY emp_id;
    ordered: true
    hints:
      - "PERCENT_RANK compares each row with the other rows in its window, as a fraction from 0 to 1."
      - "Filter to the current Engineering employees first, then use PERCENT_RANK() OVER (ORDER BY salary)."
      - "SELECT emp_id, salary, ROUND(PERCENT_RANK() OVER (ORDER BY ___)::numeric, 2) FROM employees WHERE ___ ORDER BY emp_id;"
    explanation: |
      `PERCENT_RANK()` is a **distribution** function. It gives the position of a row as a fraction: `(rank - 1) / (rows - 1)`. Equal salaries get the same value.

      Filtering first matters. If you filtered after the window, the leavers would still be counted in the percentages.

  - id: ch-a-013
    title: Phone numbers with exactly ten digits
    difficulty: hard
    dataset: messy
    module: m18
    tags: [data-cleaning, regex, string]
    prompt: |
      Messy Data Co. wants to call its customers, but the phone numbers were typed in many formats: brackets, dashes, dots, spaces and plus signs.

      Keep only the rows of `raw_customers` whose phone number has exactly **10 digits** once you remove everything that is not a digit. For each of these rows, show:

      - `row_id`
      - `phone_digits`: the phone number with only the digits left

      Show the first 10 rows, sorted by `row_id`.
    solution: |
      SELECT row_id,
             REGEXP_REPLACE(phone, '\D', '', 'g') AS phone_digits
      FROM raw_customers
      WHERE LENGTH(REGEXP_REPLACE(phone, '\D', '', 'g')) = 10
      ORDER BY row_id
      LIMIT 10;
    ordered: true
    hints:
      - 'REGEXP_REPLACE can remove every character that matches a pattern. The pattern \D means any character that is not a digit.'
      - "Put the REGEXP_REPLACE in a WHERE clause with LENGTH(...) = 10 to keep only the 10-digit numbers."
      - "SELECT row_id, REGEXP_REPLACE(phone, ___, '', 'g') AS phone_digits FROM raw_customers WHERE LENGTH(___) = 10 ORDER BY row_id LIMIT 10;"
    explanation: |
      Real data is rarely tidy. Removing everything except digits gives you one standard form that you can compare, count and join. The `'g'` flag means "global": replace every match, not just the first one.

      Empty and missing phones end up with a length of 0 or NULL, so they are filtered out automatically.

  - id: ch-a-014
    title: Removing duplicate orders
    difficulty: hard
    dataset: messy
    module: m18
    tags: [data-cleaning, row-number, deduplicate]
    prompt: |
      The order export has duplicate rows and different spellings of the same order number. Clean up orders 1001 to 1010.

      An order number is the `order_ref` with dashes and spaces removed and all letters in capitals. So `ORD-1001`, `ord-1001` and `ORD1001` are all `ORD1001`.

      For each order number from `ORD1001` to `ORD1010`, keep only the row with the **smallest `row_id`**. Show:

      - `order_no`: the cleaned order number
      - `row_id`
      - `amount`: exactly as typed

      Sort by `order_no`.
    solution: |
      SELECT order_no, row_id, amount
      FROM (
          SELECT UPPER(REPLACE(REPLACE(order_ref, '-', ''), ' ', ''))
                     AS order_no,
                 row_id,
                 amount,
                 ROW_NUMBER() OVER (
                     PARTITION BY UPPER(REPLACE(REPLACE(
                         order_ref, '-', ''), ' ', ''))
                     ORDER BY row_id
                 ) AS rn
          FROM raw_orders
      ) cleaned
      WHERE rn = 1
        AND order_no BETWEEN 'ORD1001' AND 'ORD1010'
      ORDER BY order_no;
    ordered: true
    hints:
      - "First clean the order number, then number the rows that share the same cleaned number."
      - "Use ROW_NUMBER() OVER (PARTITION BY cleaned_number ORDER BY row_id). Row 1 in each group is the one with the smallest row_id."
      - "Wrap the numbered rows in a subquery, then keep rn = 1 and the order numbers in the range."
    explanation: |
      Duplicates that differ only in spelling are the hardest kind to remove. The trick is to **clean the key first**, then number the rows inside each cleaned group.

      Ordering by `row_id` decides which copy survives, so the result is the same every time you run it. Always decide your tie-break rule before you delete anything.

  - id: ch-a-015
    title: Monthly sales in one row per product
    difficulty: hard
    dataset: messy
    module: m18
    tags: [pivot, case, aggregation]
    prompt: |
      The sales report is stored in long form, with one row per product and month. The finance team reads it in wide form, with one row per product and one column per month.

      Build a wide table of the revenue for January, February and March from the `monthly_sales_long` table. The month names are stored in its `month` column as `Jan`, `Feb` and `Mar`.

      Show `product`, `jan`, `feb` and `mar`. Sort by `product`.
    solution: |
      SELECT product,
             SUM(CASE WHEN month = 'Jan' THEN revenue END) AS jan,
             SUM(CASE WHEN month = 'Feb' THEN revenue END) AS feb,
             SUM(CASE WHEN month = 'Mar' THEN revenue END) AS mar
      FROM monthly_sales_long
      GROUP BY product
      ORDER BY product;
    ordered: true
    hints:
      - "A pivot turns the values of one column into several columns. Each new column needs its own condition."
      - "Inside SUM, use CASE WHEN month = 'Jan' THEN revenue END. The CASE gives NULL for the other months."
      - "SELECT product, SUM(CASE WHEN month = 'Jan' THEN revenue END) AS jan, ... FROM monthly_sales_long GROUP BY ___;"
    explanation: |
      This is a **pivot** built with conditional aggregation. Each `CASE` keeps only the rows for one month, and `SUM` adds up the single value that is left for each product.

      Because a `CASE` without an `ELSE` gives `NULL`, `SUM` ignores the rows it does not want. The `FILTER` clause is an alternative: `SUM(revenue) FILTER (WHERE month = 'Jan')`.

  - id: ch-a-016
    title: Ten percent rise for the phones
    difficulty: hard
    dataset: shop
    module: m12
    tags: [dml, update, check]
    prompt: |
      The phone category is getting a price rise. Raise the price of every **active** product in category 8 (Phones) by 10%.

      Round each new price to 2 decimals. Leave the inactive products and the other categories unchanged.

      Write only your `UPDATE` statement. The app then shows the products in category 8 with their prices, sorted by `product_id`, so you do not need a `SELECT`.
    solution: |
      UPDATE products
      SET price = ROUND(price * 1.10, 2)
      WHERE category_id = 8
        AND is_active;
    check: |
      SELECT product_id, price
      FROM products
      WHERE category_id = 8
      ORDER BY product_id;
    ordered: true
    hints:
      - "An UPDATE changes existing rows. Write the column you want to change after SET."
      - "Multiply the old price by 1.10, round it to 2 decimals and limit the change to active products in category 8."
      - "UPDATE products SET price = ROUND(price * ___, 2) WHERE category_id = 8 AND ___;"
    explanation: |
      Always put a `WHERE` on an `UPDATE`. Without one, every row in the table would change. Test the rows you plan to change with a `SELECT ... WHERE` first, then turn it into an `UPDATE`.

      The check query prints the category afterwards, so you can see that inactive products kept their old prices.

  - id: ch-a-017
    title: Remove duplicate cart lines
    difficulty: hard
    dataset: blank
    module: m12
    tags: [dml, delete, using, duplicates]
    setup: |
      CREATE TABLE cart_items (
          id INTEGER PRIMARY KEY,
          customer_id INTEGER NOT NULL,
          product_id INTEGER NOT NULL,
          qty INTEGER NOT NULL
      );
      INSERT INTO cart_items (id, customer_id, product_id, qty) VALUES
          (1, 6, 10, 1),
          (2, 6, 10, 1),
          (3, 6, 11, 2),
          (4, 7, 10, 1),
          (5, 6, 10, 3),
          (6, 7, 10, 1);
    prompt: |
      A bug in the cart import added the same item to a cart more than once. The table `cart_items` holds the copies.

      Two rows are duplicates when they have the same `customer_id`, `product_id` and `qty`. Delete the duplicates, and keep only the row with the **smallest `id`** in each group.

      Write only your `DELETE` statement. The app then shows the whole `cart_items` table sorted by `id`, so you do not need a `SELECT`.
    solution: |
      DELETE FROM cart_items a
      USING cart_items b
      WHERE a.customer_id = b.customer_id
        AND a.product_id = b.product_id
        AND a.qty = b.qty
        AND a.id > b.id;
    check: |
      SELECT id, customer_id, product_id, qty
      FROM cart_items
      ORDER BY id;
    ordered: true
    hints:
      - "Find a matching row with the same customer, product and quantity, but a smaller id."
      - "DELETE ... USING lets you join the table to itself. Compare a.id > b.id so that the smallest id always survives."
      - "DELETE FROM cart_items a USING cart_items b WHERE a.customer_id = b.customer_id AND ___ AND a.id > b.id;"
    explanation: |
      `DELETE ... USING` deletes rows from one copy of a table and matches them against another copy, which here is the same table. Comparing `a.id > b.id` means "delete me if an older copy exists".

      This works the same way in every database that has a row id. Writing the same rule as a `SELECT` first is a good habit: check which rows would go before you run a `DELETE`.

  - id: ch-a-018
    title: The latest rating of each user
    difficulty: hard
    dataset: movies
    module: m16
    tags: [distinct-on, postgres, group-wise]
    prompt: |
      For users 1 to 10, show each user's most recent rating. Show `user_id`, `movie_id`, `stars` and `rated_at`, with one row per user.

      "Most recent" means the largest `rated_at`. Users who have not rated anything do not appear.

      Sort by `user_id`.
    solution: |
      SELECT DISTINCT ON (user_id)
             user_id, movie_id, stars, rated_at
      FROM ratings
      WHERE user_id <= 10
      ORDER BY user_id, rated_at DESC;
    ordered: true
    hints:
      - "DISTINCT ON keeps only the first row for each value you list in brackets. The first row depends on the ORDER BY."
      - "Sort the ratings so that the newest one comes first for each user, then use DISTINCT ON (user_id)."
      - "SELECT DISTINCT ON (user_id) user_id, movie_id, stars, rated_at FROM ratings WHERE user_id <= 10 ORDER BY user_id, ___ DESC;"
    explanation: |
      `DISTINCT ON (column)` is a PostgreSQL feature that keeps one row per value. Which row you keep is decided by `ORDER BY`, which must begin with the same column.

      The same result can be written with `ROW_NUMBER()`. `DISTINCT ON` is shorter, but it works only in PostgreSQL.

  - id: ch-a-019
    title: Films per age rating, with a grand total
    difficulty: hard
    dataset: movies
    module: m16
    tags: [grouping-sets, rollup, aggregation]
    prompt: |
      The catalog team wants the number of films for each age rating, plus one grand total line for the whole catalog.

      Show `age_rating` and `films`. On the grand total line, `age_rating` shows the text `All`.

      Sort the age ratings from A to Z, and put the grand total last.
    solution: |
      SELECT COALESCE(age_rating, 'All') AS age_rating,
             COUNT(*) AS films
      FROM movies
      GROUP BY ROLLUP (age_rating)
      ORDER BY GROUPING(age_rating), age_rating;
    ordered: true
    hints:
      - "ROLLUP adds subtotal rows and a grand total row. The total row has NULL in the grouped column."
      - "Use COALESCE(age_rating, 'All') to give the total row a label."
      - "SELECT COALESCE(age_rating, 'All'), COUNT(*) FROM movies GROUP BY ___ (age_rating) ORDER BY GROUPING(age_rating), age_rating;"
    explanation: |
      `GROUP BY ROLLUP (age_rating)` runs the aggregation twice: once per age rating and once for everything together. `GROUPING(age_rating)` returns 1 on the grand total row and 0 on the others, which is a clean way to put the total last.

      `GROUPING SETS` and `CUBE` are the more general versions of the same idea.

  - id: ch-a-020
    title: Subscribers who never started a workout
    difficulty: hard
    dataset: app
    module: m07
    tags: [exists, anti-join, subquery]
    prompt: |
      The growth team wants to find users who have a subscription but who have never started a workout.

      Show each such user's `user_id` and `country`, one row per user. A user has a subscription if they have at least one row in `subscriptions`. They have never started a workout if they have no `workout_started` event at all.

      Sort by `user_id`.
    solution: |
      SELECT u.user_id, u.country
      FROM users u
      WHERE EXISTS (
          SELECT 1
          FROM subscriptions s
          WHERE s.user_id = u.user_id
      )
        AND NOT EXISTS (
          SELECT 1
          FROM events e
          WHERE e.user_id = u.user_id
            AND e.event_name = 'workout_started'
      )
      ORDER BY u.user_id;
    ordered: true
    hints:
      - "Use two conditions on users: one that finds a matching subscription, and one that finds no matching workout event."
      - "EXISTS checks whether a matching row exists. NOT EXISTS checks that no matching row exists."
      - "SELECT u.user_id, u.country FROM users u WHERE EXISTS (SELECT 1 FROM subscriptions s WHERE ___) AND NOT EXISTS (SELECT 1 FROM events e WHERE ___);"
    explanation: |
      This is an **anti-join**: keep the rows of one table that have no match in another. `NOT EXISTS` is the safest way to write it, because it still works when the other table contains NULLs.

      Each `EXISTS` only has to find one matching row, so a user with a hundred workouts is no different from a user with one.

  - id: ch-a-021
    title: The richest account in each branch
    difficulty: hard
    dataset: bank
    module: m10
    tags: [window, top-n, join, aggregation]
    prompt: |
      Each Harbor Bank branch wants to know which of its accounts holds the most money at the end of 2024.

      The balance of an account is the total of all its `transactions` amounts. Use only accounts that have at least one transaction.

      For each branch, show the account with the highest balance. If two accounts have the same balance, show the one with the lower `account_id`.

      Show `branch_id`, `branch_name` (the branch `name`), `account_id` and `balance`, rounded to 2 decimals. Sort by `branch_id`.
    solution: |
      WITH balances AS (
          SELECT a.branch_id,
                 a.account_id,
                 SUM(t.amount) AS balance
          FROM accounts a
          JOIN transactions t ON t.account_id = a.account_id
          GROUP BY a.branch_id, a.account_id
      ),
      ranked AS (
          SELECT branch_id, account_id, balance,
                 ROW_NUMBER() OVER (
                     PARTITION BY branch_id
                     ORDER BY balance DESC, account_id
                 ) AS rn
          FROM balances
      )
      SELECT r.branch_id,
             b.name AS branch_name,
             r.account_id,
             ROUND(r.balance, 2) AS balance
      FROM ranked r
      JOIN branches b ON b.branch_id = r.branch_id
      WHERE r.rn = 1
      ORDER BY r.branch_id;
    ordered: true
    hints:
      - "First work out each account's balance and its branch. Then find the top account in each branch."
      - "Use ROW_NUMBER() OVER (PARTITION BY branch_id ORDER BY balance DESC, account_id), and keep the rows where the number is 1."
      - "WITH balances AS (SELECT branch_id, account_id, SUM(amount) ... GROUP BY ___), ranked AS (SELECT ..., ROW_NUMBER() OVER (...) AS rn FROM balances) SELECT ... FROM ranked WHERE rn = 1;"
    explanation: |
      This is a **top-N per group** problem with a twist: the value you rank by, the balance, is itself an aggregate. So the work is split into steps: one CTE for the balances, one for the ranks, and a final filter.

      Joining the branch table at the very end keeps the ranking logic simple.

  - id: ch-a-022
    title: Employees two levels below the CEO
    difficulty: hard
    dataset: company
    module: m06
    tags: [self-join, join, hierarchy]
    prompt: |
      The CEO wants to know which teams report to the executive team. Find every employee whose manager reports directly to the CEO (the CEO is employee 1).

      Show `emp_id`, `employee` (first name, a space, then last name), `manager` (the manager's name in the same format) and `manager_title` (the manager's `job_title`).

      Sort by `emp_id`.
    solution: |
      SELECT e.emp_id,
             e.first_name || ' ' || e.last_name AS employee,
             m.first_name || ' ' || m.last_name AS manager,
             m.job_title AS manager_title
      FROM employees e
      JOIN employees m ON m.emp_id = e.manager_id
      WHERE m.manager_id = 1
      ORDER BY e.emp_id;
    ordered: true
    hints:
      - "Join the employees table to itself: one copy is the employee and the other copy is their manager."
      - "The manager's own manager_id tells you who the manager reports to. Compare it with 1, the CEO."
      - "SELECT e.emp_id, ... FROM employees e JOIN employees m ON m.emp_id = e.manager_id WHERE m.___ = 1 ORDER BY e.emp_id;"
    explanation: |
      A **self join** joins a table to itself. Give each copy a different alias (`e` and `m`) so you can say which one you mean.

      Here the manager is also an employee, so the manager's row answers the question "who does my manager report to?". Two levels of a hierarchy can be checked with one self join. Deeper levels need a recursive CTE, which you met earlier.

  - id: ch-a-023
    title: Ratings in the last 30 days
    difficulty: hard
    dataset: movies
    module: m11
    tags: [window, range, interval, frame]
    prompt: |
      User 13 rates films at different times. For each of their ratings, show the `rated_at`, `movie_id`, `stars` and `ratings_last_30_days`.

      `ratings_last_30_days` counts user 13's ratings, including this one, that were made in the 30 days before this rating or at the same moment. A rating made exactly 30 days earlier does count.

      Sort by `rated_at`.
    solution: |
      SELECT rated_at, movie_id, stars,
             COUNT(*) OVER (
                 ORDER BY rated_at
                 RANGE BETWEEN INTERVAL '30 days' PRECEDING
                           AND CURRENT ROW
             ) AS ratings_last_30_days
      FROM ratings
      WHERE user_id = 13
      ORDER BY rated_at;
    ordered: true
    hints:
      - "A ROWS frame counts a fixed number of rows. A RANGE frame counts rows by the value in the ORDER BY column."
      - "Use RANGE BETWEEN INTERVAL '30 days' PRECEDING AND CURRENT ROW so the window follows the calendar."
      - "COUNT(*) OVER (ORDER BY rated_at RANGE BETWEEN INTERVAL '30 days' PRECEDING AND CURRENT ROW)"
    explanation: |
      A **RANGE frame** with an interval is what you want when the rows are not evenly spaced in time. Two ratings on the same day and none for a month give very different numbers from ratings spread evenly.

      `ROWS` would count the last 30 rows, which is a different question. Choose the frame based on the question you are asking.

  - id: ch-a-024
    title: Second-highest salary in each department
    difficulty: hard
    dataset: company
    module: m10
    tags: [window, dense-rank, ties]
    prompt: |
      Each department wants to know its second-highest salary among the people who are still with the company. Use only current employees (their `terminated_on` is empty) who have a department (`dept_id` is not empty).

      Show every person whose salary is the department's second-highest **distinct** salary. If two people share that salary, show both of them.

      Show `dept_id`, `emp_id` and `salary`. Sort by `dept_id`, then by `emp_id`.
    solution: |
      SELECT dept_id, emp_id, salary
      FROM (
          SELECT dept_id, emp_id, salary,
                 DENSE_RANK() OVER (
                     PARTITION BY dept_id
                     ORDER BY salary DESC
                 ) AS salary_rank
          FROM employees
          WHERE terminated_on IS NULL
            AND dept_id IS NOT NULL
      ) ranked
      WHERE salary_rank = 2
      ORDER BY dept_id, emp_id;
    ordered: true
    hints:
      - "Rank the salaries inside each department, from the highest down. Keep the rows whose rank is 2."
      - "DENSE_RANK() gives equal salaries the same number. ROW_NUMBER() would pick only one of two tied people, so do not use it here."
      - "SELECT dept_id, emp_id, salary FROM (SELECT ..., DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS salary_rank FROM employees WHERE ___) ranked WHERE salary_rank = 2;"
    explanation: |
      `DENSE_RANK()` gives tied salaries the same number and does not skip the next number. That is what you want for "the second-highest salary": everyone tied for second appears together.

      `RANK()` skips a number after each tie. If two people tied for first, both would be rank 1, and the next salary would be rank 3, so a filter on rank 2 would find nobody. Always check which kind of ranking your question needs.

  - id: ch-a-025
    title: Products that out-earn the average product
    difficulty: hard
    dataset: shop
    module: m09
    tags: [cte, aggregation, cross-join, filter]
    prompt: |
      Which products earn more than the average product? Use **delivered** orders only. For each product, the revenue is the total of quantity × unit_price × (1 - discount) over its order lines.

      Compare each product's revenue with the **average revenue of all the products that appear in delivered orders**. Keep only the products whose revenue is above that average.

      Show `product_id`, `name` and `revenue`, with `revenue` rounded to 2 decimals. Sort by `revenue` from highest to lowest, then by `product_id`.
    solution: |
      WITH product_revenue AS (
          SELECT i.product_id,
                 SUM(i.quantity * i.unit_price
                     * (1 - i.discount)) AS revenue
          FROM order_items i
          JOIN orders o ON o.order_id = i.order_id
          WHERE o.status = 'delivered'
          GROUP BY i.product_id
      ),
      average_revenue AS (
          SELECT AVG(revenue) AS avg_revenue
          FROM product_revenue
      )
      SELECT p.product_id,
             p.name,
             ROUND(r.revenue, 2) AS revenue
      FROM product_revenue r
      CROSS JOIN average_revenue a
      JOIN products p ON p.product_id = r.product_id
      WHERE r.revenue > a.avg_revenue
      ORDER BY revenue DESC, p.product_id;
    ordered: true
    hints:
      - "Use one CTE for the revenue of each product, and a second CTE with one row holding the average of those revenues."
      - "CROSS JOIN joins every row to the single average row, so each product can be compared with it."
      - "WITH product_revenue AS (SELECT product_id, SUM(...) AS revenue FROM ... GROUP BY ___), average_revenue AS (SELECT AVG(revenue) AS avg_revenue FROM product_revenue) SELECT ... WHERE revenue > avg_revenue;"
    explanation: |
      Comparing each row with a single overall number is a common pattern. A CTE that returns one row can be joined with `CROSS JOIN` to give that number to every row.

      Doing the same thing with a subquery in `WHERE` works too: `WHERE revenue > (SELECT AVG(revenue) FROM product_revenue)`. The CTE version is easier to read and to test.

  - id: ch-a-026
    title: Reading four date styles
    difficulty: expert
    dataset: messy
    module: m18
    tags: [data-cleaning, dates, case, regex]
    prompt: |
      The old CRM exported `signup_date` as **text**. The same column holds four styles:

      - `2024-03-15` (year, month, day)
      - `03/15/2024` (month first, then day, then year)
      - `15-Mar-2024` (day, month name, year)
      - `2024/3/5` (year, month, day, with no leading zeros)

      Some rows have a NULL, an empty value or the word `unknown`. Leave those rows out.

      Count the signups per year. Show `signup_year` (a whole number) and `signups`, sorted by `signup_year`.
    solution: |
      WITH parsed AS (
          SELECT CASE
                     WHEN signup_date ~ '^\d{4}-\d{2}-\d{2}$'
                         THEN signup_date::date
                     WHEN signup_date ~ '^\d{2}/\d{2}/\d{4}$'
                         THEN to_date(signup_date, 'MM/DD/YYYY')
                     WHEN signup_date ~ '^\d{2}-[A-Za-z]{3}-\d{4}$'
                         THEN to_date(signup_date, 'DD-Mon-YYYY')
                     WHEN signup_date ~ '^\d{4}/\d{1,2}/\d{1,2}$'
                         THEN to_date(signup_date, 'YYYY/FMMM/FMDD')
                 END AS signup
          FROM raw_customers
      )
      SELECT EXTRACT(YEAR FROM signup)::int AS signup_year,
             COUNT(*) AS signups
      FROM parsed
      WHERE signup IS NOT NULL
      GROUP BY EXTRACT(YEAR FROM signup)
      ORDER BY signup_year;
    ordered: true
    hints:
      - "Each value is one of four shapes. Decide which shape a value has before you try to read it as a date."
      - "Use CASE with a regular expression (`~`) for each shape. For the other two shapes, TO_DATE(text, format) reads the text. The format for 15-Mar-2024 is 'DD-Mon-YYYY'."
      - "Put the CASE in a CTE called parsed. Then GROUP BY EXTRACT(YEAR FROM signup) and leave out the rows where signup IS NULL."
    explanation: |
      Text dates are the most common mess in real exports. You cannot cast `'unknown'::date`; the query fails. So you first **recognise the shape** of each value with a regular expression, and only then convert it.

      `CASE` returns NULL when no `WHEN` matches, which takes care of the NULL, empty and `unknown` rows. `FM` in `'YYYY/FMMM/FMDD'` tells `TO_DATE` that the month and day may have no leading zero. When a file mixes `03/04/2024` styles, always agree on one rule (here: month first) and write it down.

  - id: ch-a-027
    title: Customers who appear twice
    difficulty: expert
    dataset: messy
    module: m18
    tags: [data-cleaning, group-by, having, duplicates]
    prompt: |
      Some customers were typed into the old system twice, with different spelling. Clean each email first: remove the spaces at the start and end, and make every letter lowercase. Ignore rows where the email is NULL or blank.

      Show each cleaned email that appears in **more than one row**, with three columns:

      - `clean_email`: the cleaned email
      - `rows_found`: how many rows have that email
      - `first_row_id`: the lowest `row_id` among those rows

      Sort by `clean_email`.
    solution: |
      SELECT LOWER(TRIM(email)) AS clean_email,
             COUNT(*) AS rows_found,
             MIN(row_id) AS first_row_id
      FROM raw_customers
      WHERE NULLIF(TRIM(email), '') IS NOT NULL
      GROUP BY LOWER(TRIM(email))
      HAVING COUNT(*) > 1
      ORDER BY clean_email;
    ordered: true
    hints:
      - "Compare emails only after cleaning them. TRIM removes spaces at the start and end; LOWER makes every letter small."
      - "GROUP BY the cleaned email. HAVING COUNT(*) > 1 keeps only the emails that appear in more than one row."
      - "NULLIF(TRIM(email), '') IS NOT NULL skips the blank and NULL emails. Group by the cleaned expression, not the raw email column."
    explanation: |
      Grouping by the raw `email` column would miss these duplicates, because `' Camila.Castillo@example.com'` and `'camila.castillo@example.com'` are different text to the database. **Clean first, then group.**

      `WHERE` removes rows before grouping, and `HAVING` filters the groups afterwards. `MIN(row_id)` keeps one row id per person, which is handy when you decide which copy to keep.

  - id: ch-a-028
    title: Three headcount summaries in one query
    difficulty: expert
    dataset: company
    module: m16
    tags: [grouping-sets, aggregation, subtotals, nulls]
    prompt: |
      The HR team wants the current headcount in three views inside one result:

      - one row for each department (the employment type is empty)
      - one row for each employment type (the department is empty)
      - one grand total row (the department and the employment type are both empty)

      Count only **current** employees (their `terminated_on` is empty) who belong to a department. Show `department`, `employment_type` and `headcount`. Leave a cell empty (NULL) when the row is not about that column.
    solution: |
      SELECT d.name AS department,
             e.employment_type,
             COUNT(*) AS headcount
      FROM employees e
      JOIN departments d ON d.dept_id = e.dept_id
      WHERE e.terminated_on IS NULL
      GROUP BY GROUPING SETS ((d.name), (e.employment_type), ());
    hints:
      - "One GROUP BY can produce several summaries at once. Each summary is a set of columns to group by."
      - "Write each summary as its own group in brackets: (d.name) is one, (e.employment_type) is another. The empty bracket () makes the grand total."
      - "GROUP BY GROUPING SETS ((d.name), (e.employment_type), ())"
    explanation: |
      `GROUPING SETS` runs one aggregate and gives you several levels of totals. The columns that are not part of a level come back as NULL, which is why the subtotal rows have an empty department or employment type.

      The same result could be built with three queries joined by `UNION ALL`, but that repeats the joins three times. `ROLLUP` and `CUBE` are shortcuts for common sets of levels. A real NULL in the data also looks empty, so `GROUPING(d.name) = 1` is the reliable way to spot a subtotal row.

  - id: ch-a-029
    title: The two best-rated films in every genre
    difficulty: expert
    dataset: movies
    module: m16
    tags: [lateral, top-n, join, aggregation]
    prompt: |
      The FlickNest programming team wants the two best-rated films in each genre.

      - Use only films with **at least 10 ratings**.
      - A film's score is the average of its `stars`, rounded to 2 decimals.
      - A film with two genres counts in both genres.

      Show `genre`, `title`, `avg_stars` (the rounded average) and `ratings_count` (how many ratings the film has). Show the 2 highest-scoring films in each genre. Sort by `genre`, then by `avg_stars` (highest first), then by `title`.
    solution: |
      WITH film_scores AS (
          SELECT m.movie_id, m.title, g.name AS genre,
                 ROUND(AVG(r.stars), 2) AS avg_stars,
                 COUNT(*) AS ratings_count
          FROM movies m
          JOIN movie_genres mg ON mg.movie_id = m.movie_id
          JOIN genres g ON g.genre_id = mg.genre_id
          JOIN ratings r ON r.movie_id = m.movie_id
          GROUP BY m.movie_id, m.title, g.name
          HAVING COUNT(*) >= 10
      )
      SELECT f.genre, f.title, f.avg_stars, f.ratings_count
      FROM genres g
      CROSS JOIN LATERAL (
          SELECT fs.genre, fs.title, fs.avg_stars, fs.ratings_count
          FROM film_scores fs
          WHERE fs.genre = g.name
          ORDER BY fs.avg_stars DESC, fs.title
          LIMIT 2
      ) f
      ORDER BY f.genre, f.avg_stars DESC, f.title;
    ordered: true
    hints:
      - "First build one row per film and genre, with its average stars and its number of ratings. Keep only films with at least 10 ratings."
      - "You need a separate top 2 for each genre. A LATERAL subquery runs once for every row of the genres table, so it can say WHERE genre = that row's name."
      - "CROSS JOIN LATERAL (SELECT ... WHERE fs.genre = g.name ORDER BY avg_stars DESC, title LIMIT 2) f"
    explanation: |
      "Top N in each group" is one of the most asked questions in analysis. `LATERAL` lets a subquery look at the current row of the outer query, so each genre gets its own `ORDER BY ... LIMIT 2`.

      A window function (`ROW_NUMBER() OVER (PARTITION BY genre ...)`, keeping rows 1 and 2) gives the same answer. Adding `title` to the `ORDER BY` is a tie-breaker: without it, two films with the same score could swap places from one run to the next.

  - id: ch-a-030
    title: Products that sell together
    difficulty: expert
    dataset: shop
    module: m19
    tags: [market-basket, self-join, pairs, aggregation]
    prompt: |
      The marketing team wants to run "customers who bought X also bought Y" campaigns. Find pairs of products that were in the **same order** at least 15 times. Count every order, whatever its status.

      - List each pair only once. `product_a` is the product with the **lower** `product_id`, and `product_b` is the other one.
      - Show `product_a` (its name), `product_b` (its name) and `orders_together` (how many orders contain both).
      - Sort by `orders_together` (highest first), then by `product_a`, then by `product_b`.
    solution: |
      SELECT p1.name AS product_a,
             p2.name AS product_b,
             COUNT(*) AS orders_together
      FROM order_items a
      JOIN order_items b
        ON b.order_id = a.order_id
       AND b.product_id > a.product_id
      JOIN products p1 ON p1.product_id = a.product_id
      JOIN products p2 ON p2.product_id = b.product_id
      GROUP BY p1.name, p2.name
      HAVING COUNT(*) >= 15
      ORDER BY orders_together DESC, product_a, product_b;
    ordered: true
    hints:
      - "Join order_items to itself on the same order_id. One copy stands for product A and the other copy for product B."
      - "To list each pair once, keep only the pairs where the second product_id is higher than the first: b.product_id > a.product_id."
      - "Join products twice to get both names, GROUP BY both names and keep the groups with HAVING COUNT(*) >= 15."
    explanation: |
      This is **market basket analysis**, the idea behind "frequently bought together". A **self join** pairs every row of a table with other rows of the same table.

      The `>` condition is the trick. Without it you would get every pair twice (A with B, and B with A), plus pairs of a product with itself. Each order holds a product at most once, so `COUNT(*)` counts orders correctly.

  - id: ch-a-031
    title: The longest run of step-tracking days
    difficulty: expert
    dataset: app
    module: m19
    tags: [gaps-and-islands, window, streak, date]
    prompt: |
      FitTrack's coaches reward users who track their steps every day. A **streak** is a run of days in a row that each have a row in `daily_steps`. A day with no row breaks the streak.

      For each user, find their **longest** streak. If a user has two streaks of the same length, use the one that starts first.

      Keep only the users whose longest streak is at least **30 days**. Show `user_id`, `streak_start`, `streak_end` and `days` (the number of days in the streak). Sort by `days` (longest first), then by `user_id`.
    solution: |
      WITH numbered AS (
          SELECT user_id, day,
                 day - (ROW_NUMBER() OVER (
                            PARTITION BY user_id
                            ORDER BY day))::int AS island
          FROM daily_steps
      ),
      runs AS (
          SELECT user_id,
                 MIN(day) AS streak_start,
                 MAX(day) AS streak_end,
                 COUNT(*) AS days
          FROM numbered
          GROUP BY user_id, island
      ),
      best AS (
          SELECT DISTINCT ON (user_id)
                 user_id, streak_start, streak_end, days
          FROM runs
          ORDER BY user_id, days DESC, streak_start
      )
      SELECT user_id, streak_start, streak_end, days
      FROM best
      WHERE days >= 30
      ORDER BY days DESC, user_id;
    ordered: true
    hints:
      - "Consecutive days share the same 'island' value. Subtract the row number from the day: consecutive days give the same result."
      - "day - (ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day))::int stays the same while the days follow each other. Group by that value to get one row per streak."
      - "After you have one row per streak, keep the longest one per user with DISTINCT ON (user_id) ... ORDER BY user_id, days DESC, streak_start, then filter days >= 30."
    explanation: |
      This is the **gaps and islands** pattern. The islands are the streaks of consecutive days; the gaps are the missing days between them.

      The trick: if the day numbers go up by one each row, then `day` minus the row number is constant inside an island. Grouping on that constant value separates the islands. It works for any "one step at a time" sequence: days, ids, or event numbers.

  - id: ch-a-032
    title: Customers who used every card category
    difficulty: expert
    dataset: bank
    module: m19
    tags: [relational-division, not-exists, anti-join, subquery]
    prompt: |
      Harbor Bank wants to send a "Spending Champion" letter to customers who have paid by card in **every** spending category the bank records.

      - The categories are the different `category` values of the `card_payment` transactions. Count the card payments on all of a customer's accounts together.
      - A customer qualifies only if no category is missing from their card payments.

      Show `customer_id` and `full_name`, sorted by `customer_id`.
    solution: |
      SELECT c.customer_id, c.full_name
      FROM customers c
      WHERE NOT EXISTS (
          SELECT 1
          FROM (
              SELECT DISTINCT category
              FROM transactions
              WHERE txn_type = 'card_payment'
          ) cat
          WHERE NOT EXISTS (
              SELECT 1
              FROM accounts a
              JOIN transactions t ON t.account_id = a.account_id
              WHERE a.customer_id = c.customer_id
                AND t.txn_type = 'card_payment'
                AND t.category = cat.category
          )
      )
      ORDER BY c.customer_id;
    ordered: true
    hints:
      - "Think of it as 'for all': a customer qualifies when there is no category for which they have no card payment."
      - "Two NOT EXISTS work together. The inner one checks that the customer has a card payment in one category. The outer one checks that there is no category left out."
      - "NOT EXISTS (SELECT 1 FROM (SELECT DISTINCT category ...) cat WHERE NOT EXISTS (SELECT 1 FROM accounts a JOIN transactions t ... WHERE t.category = cat.category))"
    explanation: |
      Questions with the word "every" or "all" are called **relational division**. SQL has no `FOR ALL` keyword, so you rewrite "all" as "there is no ... that is missing". Reading it aloud helps: *there is no category for which there is no card payment*.

      A shorter way is `GROUP BY customer_id HAVING COUNT(DISTINCT category) = 7`. It works here, but it hard-codes the number 7. The double `NOT EXISTS` version still works when the list of categories changes.

  - id: ch-a-033
    title: Week-one retention by signup month
    difficulty: expert
    dataset: app
    module: m19
    tags: [cohort, retention, date, filter]
    prompt: |
      The product team wants to know how many new users come back in their first full week. Group the users by the **month they signed up** (`signup_date`).

      A user is **retained in week 1** when they have at least one event on the 7th to the 13th day after their signup date (the signup day itself is day 0). Use the day of `event_time`, not the exact time.

      For each signup month, show:

      - `cohort_month`: the month as `YYYY-MM`
      - `signed_up`: how many users signed up that month (count all of them, including users with no events)
      - `retained_week_1`: how many of them were retained in week 1
      - `retention_pct`: `retained_week_1` divided by `signed_up`, times 100, rounded to 1 decimal place

      Sort by `cohort_month`.
    solution: |
      WITH cohort AS (
          SELECT user_id,
                 to_char(signup_date, 'YYYY-MM') AS cohort_month,
                 signup_date
          FROM users
      )
      SELECT c.cohort_month,
             COUNT(*) AS signed_up,
             COUNT(*) FILTER (
                 WHERE EXISTS (
                     SELECT 1
                     FROM events e
                     WHERE e.user_id = c.user_id
                       AND e.event_time::date - c.signup_date
                           BETWEEN 7 AND 13
                 )
             ) AS retained_week_1,
             ROUND(100.0 * COUNT(*) FILTER (
                 WHERE EXISTS (
                     SELECT 1
                     FROM events e
                     WHERE e.user_id = c.user_id
                       AND e.event_time::date - c.signup_date
                           BETWEEN 7 AND 13
                 )
             ) / COUNT(*), 1) AS retention_pct
      FROM cohort c
      GROUP BY c.cohort_month
      ORDER BY c.cohort_month;
    ordered: true
    hints:
      - "Start with one row per user that has the cohort month. Then decide for each user whether any of their events falls in days 7 to 13."
      - "e.event_time::date - u.signup_date gives the number of days between the event and the signup. Compare that number with BETWEEN 7 AND 13."
      - "Use EXISTS for the 'any event' test and COUNT(*) FILTER (WHERE EXISTS (...)) to count the retained users. Users without events must still be in signed_up."
    explanation: |
      A **cohort** is a group of users who share something, here the signup month. Retention asks: *of the people in this cohort, how many came back at a later point?* Because `signed_up` counts every user, a user with no events lowers the percentage, which is the honest answer.

      `EXISTS` answers "is there at least one matching event?" without multiplying rows. Counting the users with `COUNT(*) FILTER (WHERE ...)` keeps one row per user. This is the building block for a full week-by-week retention table.

  - id: ch-a-034
    title: The in-order workout funnel by platform
    difficulty: expert
    dataset: app
    module: m19
    tags: [funnel, aggregation, filter, min]
    prompt: |
      The growth team wants a funnel per platform. A user moves through three steps, **in this order**:

      1. the user opens the app (`app_open`)
      2. the user starts a workout after that (`workout_started`)
      3. the user completes a workout after the start (`workout_completed`)

      Use each user's **first** event of each type. Users whose first `workout_started` happened before their first `app_open` do not count as step 2. Use the same rule for step 3.

      Show `platform` (from `users`), `opened` (users who opened the app), `started_after_open` (users who passed step 2) and `completed_after_start` (users who passed step 3). Only users who opened the app are in the funnel. Sort by `platform`.
    solution: |
      WITH first_times AS (
          SELECT u.user_id, u.platform,
                 MIN(e.event_time) FILTER (
                     WHERE e.event_name = 'app_open') AS t_open,
                 MIN(e.event_time) FILTER (
                     WHERE e.event_name = 'workout_started') AS t_start,
                 MIN(e.event_time) FILTER (
                     WHERE e.event_name = 'workout_completed') AS t_done
          FROM users u
          LEFT JOIN events e ON e.user_id = u.user_id
          GROUP BY u.user_id, u.platform
      )
      SELECT platform,
             COUNT(t_open) AS opened,
             COUNT(*) FILTER (WHERE t_start > t_open) AS started_after_open,
             COUNT(*) FILTER (
                 WHERE t_done > t_start AND t_start > t_open
             ) AS completed_after_start
      FROM first_times
      WHERE t_open IS NOT NULL
      GROUP BY platform
      ORDER BY platform;
    ordered: true
    hints:
      - "Find each user's first time for each event type. MIN(event_time) FILTER (WHERE event_name = '...') does this in one pass."
      - "Compare the times: a step counts only when its time is later than the previous step's time. Put those comparisons in WHERE inside COUNT(*) FILTER."
      - "Group the users by platform at the end. Only users with an app_open are in the funnel, so filter with t_open IS NOT NULL."
    explanation: |
      A **funnel** shows how many people reach each step. The important word is "in order": a user who started a workout *before* opening the app is a data quirk, not a successful funnel step.

      `MIN(...) FILTER (WHERE ...)` picks the first time of one event type per user, and the comparisons `t_start > t_open` enforce the order. Real funnel tools also limit how long a user has to finish a step, which you can add as one more condition.

  - id: ch-a-035
    title: Family-night films with two genres
    difficulty: expert
    dataset: movies
    module: m16
    tags: [array, many-to-many, aggregation, string]
    prompt: |
      A family-night playlist needs films from 2000 onwards that are tagged **both** `Animation` and `Family`. A film can have other genres too.

      Show these columns:

      - `title`
      - `release_year`
      - `genre_list`: all the film's genres in alphabetical order, separated by `, ` (a comma and a space). Example: `Animation, Comedy, Family`

      Sort by `release_year`, then by `title`.
    solution: |
      WITH film_genres AS (
          SELECT mg.movie_id,
                 ARRAY_AGG(g.name ORDER BY g.name) AS genres
          FROM movie_genres mg
          JOIN genres g ON g.genre_id = mg.genre_id
          GROUP BY mg.movie_id
      )
      SELECT m.title,
             m.release_year,
             ARRAY_TO_STRING(fg.genres, ', ') AS genre_list
      FROM movies m
      JOIN film_genres fg ON fg.movie_id = m.movie_id
      WHERE fg.genres @> ARRAY['Animation', 'Family']
        AND m.release_year >= 2000
      ORDER BY m.release_year, m.title;
    ordered: true
    hints:
      - "Each film has one row per genre in movie_genres. First gather the genre names of each film into one list."
      - "ARRAY_AGG(g.name ORDER BY g.name) builds a sorted list per film. The @> operator checks that an array contains all the values of another array."
      - "WHERE genres @> ARRAY['Animation', 'Family'] AND release_year >= 2000, and ARRAY_TO_STRING(genres, ', ') for the text."
    explanation: |
      An **array** is a list stored in one column. `ARRAY_AGG` collapses many rows into one list, which lets you test a film's genres as a single value.

      `@>` means "contains all of". `ARRAY['Animation', 'Family']` asks for films whose genre list has both names, while a join would need two copies of the genre table. `ARRAY_TO_STRING` turns the list back into text for the report.

  - id: ch-a-036
    title: A reusable payroll function
    difficulty: expert
    dataset: company
    module: m17
    tags: [plpgsql, function, aggregation, variables]
    prompt: |
      The finance team asks the same question about different departments all the time: "What does this department pay per year?" Instead of rewriting the query, write a **PL/pgSQL function** that answers it.

      Write one statement: `CREATE FUNCTION dept_payroll(...)`.

      - It takes one argument, an integer department id, named `p_dept_id`.
      - It returns `numeric`: the total yearly `salary` of the **current** employees (`terminated_on` is empty) in that department.
      - If the department has no current employees, it returns `0`, not NULL.
      - Write the body in `LANGUAGE plpgsql`, with a `DECLARE` section for a variable named `total`.

      The app then runs a query that calls your function for every department.
    solution: |
      CREATE FUNCTION dept_payroll(p_dept_id integer)
      RETURNS numeric
      LANGUAGE plpgsql
      AS $$
      DECLARE
          total numeric;
      BEGIN
          SELECT COALESCE(SUM(salary), 0)
          INTO total
          FROM employees
          WHERE dept_id = p_dept_id
            AND terminated_on IS NULL;
          RETURN total;
      END;
      $$;
    check: |
      SELECT d.dept_id,
             dept_payroll(d.dept_id) AS payroll
      FROM departments d
      ORDER BY d.dept_id;
    ordered: true
    hints:
      - "A function is a named piece of code you can call like a built-in function. Its body sits between $$ and $$."
      - "Inside the body, SELECT ... INTO total FROM employees ... stores a query result in a variable. COALESCE(SUM(salary), 0) turns an empty department into 0."
      - "CREATE FUNCTION dept_payroll(p_dept_id integer) RETURNS numeric LANGUAGE plpgsql AS $$ DECLARE total numeric; BEGIN ... RETURN total; END; $$;"
    explanation: |
      **PL/pgSQL** is PostgreSQL's own programming language. It lets you store logic in the database: variables, `IF` and loops around SQL queries. A function written once can be used in every query, report and app that connects to the database.

      Two details matter. The `p_` prefix keeps the parameter name apart from the column `dept_id`, so the database never has to guess which one you mean. And `COALESCE` gives `0` for a department with nobody on the payroll, instead of NULL.

  - id: ch-a-037
    title: The longest silent period per account
    difficulty: expert
    dataset: bank
    module: m19
    tags: [gaps, lag, window, date]
    prompt: |
      The bank's dormant-account review looks for accounts that go quiet for a long time. For each account, find the **longest gap** between two consecutive transactions. The gap is measured in **days** between the dates of the two transactions (use the date part of `txn_time`).

      Keep only accounts whose longest gap is at least **90 days**. Show `account_id`, `transactions` (how many transactions the account has in total) and `longest_gap_days`.

      Sort by `longest_gap_days` (longest first), then by `account_id`.
    solution: |
      WITH gaps AS (
          SELECT account_id,
                 txn_time::date AS txn_day,
                 LAG(txn_time::date) OVER (
                     PARTITION BY account_id
                     ORDER BY txn_time, txn_id
                 ) AS prev_day
          FROM transactions
      )
      SELECT account_id,
             COUNT(*) + 1 AS transactions,
             MAX(txn_day - prev_day) AS longest_gap_days
      FROM gaps
      WHERE prev_day IS NOT NULL
      GROUP BY account_id
      HAVING MAX(txn_day - prev_day) >= 90
      ORDER BY longest_gap_days DESC, account_id;
    ordered: true
    hints:
      - "Compare each transaction with the one before it on the same account. LAG(...) OVER (PARTITION BY account_id ORDER BY txn_time) gives you that previous row."
      - "Subtracting two dates gives the number of days between them. Take the maximum of those differences for each account."
      - "Count the transactions in the same query. The first row of an account has no previous row, so COUNT(*) on the filtered rows is one less than the total. Use COUNT(*) + 1, or count the rows before filtering."
    explanation: |
      A **gap** is a silence between two events. `LAG` looks back one row inside a window (here, one account's history) so you can compare each row with the one before it.

      Ordering by `txn_time, txn_id` makes the order fixed even when two transactions share the same timestamp. Without a second sort key, the database could pick either order and the gap would change between runs.

  - id: ch-a-038
    title: Large debits in quick succession
    difficulty: expert
    dataset: bank
    module: m19
    tags: [fraud, lag, window, filter]
    prompt: |
      The fraud team flags a possible account takeover when several **large debits** happen one after another, very quickly. In this task:

      - A **large debit** is a transaction with an `amount` of `-500` or less.
      - A large debit is a **quick repeat** when it happens no more than **10 minutes** after the previous large debit on the same account. Use only the large debits to find the previous one.

      For each account with at least one quick repeat, show `account_id`, `quick_repeats` (how many quick repeats it has) and `first_quick_repeat` (the `txn_time` of its earliest quick repeat).

      Sort by `quick_repeats` (highest first), then by `account_id`.
    solution: |
      WITH large_debits AS (
          SELECT account_id, txn_id, txn_time,
                 LAG(txn_time) OVER (
                     PARTITION BY account_id
                     ORDER BY txn_time, txn_id
                 ) AS prev_time
          FROM transactions
          WHERE amount <= -500
      )
      SELECT account_id,
             COUNT(*) AS quick_repeats,
             MIN(txn_time) AS first_quick_repeat
      FROM large_debits
      WHERE txn_time - prev_time <= INTERVAL '10 minutes'
      GROUP BY account_id
      ORDER BY quick_repeats DESC, account_id;
    ordered: true
    hints:
      - "Filter to the large debits first (amount <= -500). Then look at the previous large debit of the same account."
      - "LAG(txn_time) OVER (PARTITION BY account_id ORDER BY txn_time, txn_id) gives the previous time. Subtracting two timestamps gives an interval you can compare with INTERVAL '10 minutes'."
      - "Put the LAG in a CTE, keep rows where txn_time - prev_time <= INTERVAL '10 minutes', then GROUP BY account_id with COUNT(*) and MIN(txn_time)."
    explanation: |
      Fraud checks are often **velocity rules**: "too many of the same thing in too short a time". The key is to decide the rows *before* you look back. Filtering to large debits first makes `LAG` compare only those debits, so small purchases between them do not hide the pattern.

      Accounts 46 and 10 look like this in the data. Real fraud teams use the same idea with more signals (location, merchant, device), but the window function is the core of it.

  - id: ch-a-039
    title: Satisfaction scores from messy survey answers
    difficulty: expert
    dataset: messy
    module: m18
    tags: [data-cleaning, case, aggregation, regex]
    prompt: |
      The survey team needs the average satisfaction score for each kind of respondent. The data is messy, so you must clean two columns first.

      **Respondent kind** (from the `respondent` column):

      - contains an `@` sign: `email`
      - starts with `cust-`: `customer code`
      - is exactly `anonymous`: `anonymous`
      - is NULL: `no name`
      - anything else: `first name`

      **Score** (from the `q1_satisfaction` column). Remove spaces at the start and end first. A digit `1` to `5` is its own score. The lowercase words `one` to `five` count as `1` to `5`. Every other answer (for example `0`, `11`, `4/5` or NULL) is not a valid score and is skipped.

      For each respondent kind, show `respondent_kind`, `valid_answers` (how many valid scores it has) and `avg_score` (the average score, rounded to 2 decimals). Sort by `respondent_kind`.
    solution: |
      WITH answers AS (
          SELECT CASE
                     WHEN respondent LIKE '%@%' THEN 'email'
                     WHEN respondent LIKE 'cust-%' THEN 'customer code'
                     WHEN respondent = 'anonymous' THEN 'anonymous'
                     WHEN respondent IS NULL THEN 'no name'
                     ELSE 'first name'
                 END AS respondent_kind,
                 CASE
                     WHEN btrim(q1_satisfaction) ~ '^[1-5]$'
                         THEN btrim(q1_satisfaction)::int
                     WHEN btrim(q1_satisfaction) = 'one' THEN 1
                     WHEN btrim(q1_satisfaction) = 'two' THEN 2
                     WHEN btrim(q1_satisfaction) = 'three' THEN 3
                     WHEN btrim(q1_satisfaction) = 'four' THEN 4
                     WHEN btrim(q1_satisfaction) = 'five' THEN 5
                 END AS score
          FROM survey_responses
      )
      SELECT respondent_kind,
             COUNT(score) AS valid_answers,
             ROUND(AVG(score), 2) AS avg_score
      FROM answers
      GROUP BY respondent_kind
      ORDER BY respondent_kind;
    ordered: true
    hints:
      - "Build the respondent kind and the score in two CASE expressions inside one CTE. Then group by the kind."
      - "For the score, first remove the spaces with btrim(...). Then test the text with ~ '^[1-5]$' for digits, or compare it with 'one' ... 'five' for words."
      - "COUNT(score) counts only the rows where the score is not NULL. ROUND(AVG(score), 2) gives the average to 2 decimals."
    explanation: |
      Real survey data arrives as text, with several spellings for the same answer. A cleaning step should **turn every spelling into one standard value** before you calculate anything. Writing the rules as `CASE` branches keeps each rule visible.

      `COUNT(score)` ignores the rows that became NULL, which is exactly how the invalid answers are skipped. `COUNT(*)` would have counted them too. Always check how many rows the average is based on.

  - id: ch-a-040
    title: Binge sessions per viewer
    difficulty: expert
    dataset: movies
    module: m19
    tags: [sessionization, lag, window, running-sum]
    prompt: |
      FlickNest wants to know how often its heaviest viewers binge. A **binge session** is a run of plays by the same user where each play starts no more than **30 minutes** after the previous play of that user. A play that starts more than 30 minutes after the previous one begins a new session. The very first play of a user also begins a session.

      Keep only users with at least **30 sessions**. Show `user_id`, `sessions` (how many binge sessions they have), `plays` (how many rows they have in `watch_history`) and `minutes_watched` (the sum of `minutes_watched`).

      Sort by `sessions` (highest first), then by `user_id`.
    solution: |
      WITH plays AS (
          SELECT user_id, started_at, minutes_watched,
                 LAG(started_at) OVER (
                     PARTITION BY user_id
                     ORDER BY started_at, watch_id
                 ) AS prev_at
          FROM watch_history
      ),
      flagged AS (
          SELECT user_id, minutes_watched,
                 CASE
                     WHEN prev_at IS NULL
                          OR started_at - prev_at > INTERVAL '30 minutes'
                         THEN 1
                     ELSE 0
                 END AS new_session
          FROM plays
      )
      SELECT user_id,
             SUM(new_session) AS sessions,
             COUNT(*) AS plays,
             SUM(minutes_watched) AS minutes_watched
      FROM flagged
      GROUP BY user_id
      HAVING SUM(new_session) >= 30
      ORDER BY sessions DESC, user_id;
    ordered: true
    hints:
      - "Use LAG to find each play's previous start time for the same user. Ordering by started_at makes the order clear."
      - "Flag a play as a new session (1) when it has no previous play, or when the gap is more than 30 minutes. Otherwise flag it 0."
      - "Adding up the flags per user gives the number of sessions. Keep the users with HAVING SUM(new_session) >= 30."
    explanation: |
      **Sessionization** means cutting a long stream of events into sessions. The usual recipe has three steps: look back with `LAG`, flag the rows that start a new session, and add the flags up (a running `SUM` gives each session its own number).

      The 30 minutes is a rule you choose, not a law. In this data the binge clusters are far apart, so any cut-off between 30 minutes and about 5 hours gives the same sessions. Always test how sensitive your result is to the rule.

  - id: ch-a-041
    title: Which details each event records
    difficulty: expert
    dataset: app
    module: m16
    tags: [jsonb, lateral, json-keys, aggregation]
    prompt: |
      Every event in FitTrack stores its extra details in the `properties` column. This column is `jsonb`, and each kind of event uses different keys.

      For each `event_name` and each key in `properties`, count the events that have that key. Show these three columns:

      - `event_name`
      - `detail` (the name of the key)
      - `events` (how many events have that key)

      Sort by `event_name`, then by `detail`.
    solution: |
      SELECT e.event_name,
             k.detail,
             COUNT(*) AS events
      FROM events e
      CROSS JOIN LATERAL jsonb_object_keys(e.properties) AS k(detail)
      GROUP BY e.event_name, k.detail
      ORDER BY e.event_name, k.detail;
    ordered: true
    hints:
      - "jsonb_object_keys(some_jsonb) returns the key names of one JSON object, one key per row."
      - "A function that takes a value from the current row needs LATERAL: CROSS JOIN LATERAL jsonb_object_keys(e.properties) AS k(detail)."
      - "After the join, GROUP BY e.event_name, k.detail and COUNT(*)."
    explanation: |
      **JSONB** stores flexible documents inside one column. Different rows can hold different keys, so a fixed set of columns would not fit. Functions such as `jsonb_object_keys` turn a document back into rows so you can count, filter and join them like a table.

      `LATERAL` lets the function read `e.properties` from the same row, which is why `CROSS JOIN LATERAL` is needed. Keys that a row does not have are simply absent, so they are not counted.

  - id: ch-a-042
    title: Month-over-month growth in 2024
    difficulty: expert
    dataset: shop
    module: m19
    tags: [growth, lag, window, date]
    prompt: |
      The CFO wants to see how fast revenue grows from one month to the next.

      Use only **delivered** orders. For each month (by `order_date`), the revenue is the sum of `quantity * unit_price * (1 - discount)` over its order lines, rounded to 2 decimals.

      For each month of **2024**, show:

      - `month`: the month as `YYYY-MM`
      - `revenue`: the monthly revenue
      - `growth_pct`: the change from the previous month, as a percentage: (this month's revenue minus the previous month's revenue) divided by the previous month's revenue, times 100, rounded to 2 decimals

      January 2024 compares with December 2023, so use the 2023 months to find the previous month. Sort by `month`.
    solution: |
      WITH monthly AS (
          SELECT DATE_TRUNC('month', o.order_date)::date AS month_start,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY DATE_TRUNC('month', o.order_date)
      ),
      with_previous AS (
          SELECT month_start, revenue,
                 LAG(revenue) OVER (ORDER BY month_start) AS previous_revenue
          FROM monthly
      )
      SELECT TO_CHAR(month_start, 'YYYY-MM') AS month,
             revenue,
             ROUND(100.0 * (revenue - previous_revenue) / previous_revenue, 2) AS growth_pct
      FROM with_previous
      WHERE month_start >= DATE '2024-01-01'
      ORDER BY month_start;
    ordered: true
    hints:
      - "First make one row per month with its delivered revenue. Round it to 2 decimals as the prompt says."
      - "LAG(revenue) OVER (ORDER BY month_start) gives the previous month's revenue. Add it as a column in a separate step."
      - "Filter to 2024 after the LAG. If you filter before it, January 2024 has no previous month."
    explanation: |
      Growth metrics are a staple of analytics. The pattern is always the same: aggregate to the period you care about, then use `LAG` to reach the previous period, then compute the change.

      The order of steps matters. If you filter to 2024 *before* `LAG`, January has nothing to compare with. Filtering after the window function keeps the 2023 months available as the "previous" values.

  - id: ch-a-043
    title: The biggest raises over the years
    difficulty: expert
    dataset: company
    module: m11
    tags: [first-value, last-value, window, frame]
    prompt: |
      HR wants to see how much each long-serving employee's salary has grown since their first salary.

      Look at employees with at least **5 rows** in `salary_history` (the hire salary plus at least 4 changes). For each of them, show:

      - `emp_id`
      - `first_salary`: the salary on their earliest `effective_date`
      - `latest_salary`: the salary on their latest `effective_date`
      - `increase_pct`: (latest salary minus first salary) divided by first salary, times 100, rounded to 1 decimal

      Sort by `increase_pct` (highest first), then by `emp_id`.
    solution: |
      WITH ranked AS (
          SELECT s.emp_id,
                 FIRST_VALUE(s.salary) OVER w AS first_salary,
                 LAST_VALUE(s.salary) OVER w AS latest_salary
          FROM salary_history s
          WINDOW w AS (
              PARTITION BY s.emp_id
              ORDER BY s.effective_date
              ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
          )
      )
      SELECT emp_id,
             MAX(first_salary) AS first_salary,
             MAX(latest_salary) AS latest_salary,
             ROUND(100.0 * (MAX(latest_salary) - MAX(first_salary))
                   / MAX(first_salary), 1) AS increase_pct
      FROM ranked
      GROUP BY emp_id
      HAVING COUNT(*) >= 5
      ORDER BY increase_pct DESC, emp_id;
    ordered: true
    hints:
      - "FIRST_VALUE and LAST_VALUE are window functions. Sort each employee's rows by effective_date, then take the first and the last salary."
      - "LAST_VALUE has a trap. Its default frame stops at the current row, so it returns the current salary. Add ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING to see the whole history."
      - "Use a named window: WINDOW w AS (PARTITION BY s.emp_id ORDER BY s.effective_date ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)."
    explanation: |
      `FIRST_VALUE` and `LAST_VALUE` return a value from the start or the end of a window. Without an explicit frame, a window with an `ORDER BY` covers "everything up to the current row", so `LAST_VALUE` simply returns the current row's value. That is the most common mistake with this function.

      Specifying the frame as `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING` fixes it. A `MAX` over each group also works, since the first and last values are the minimum and maximum date, but the window version shows the frame idea clearly.

  - id: ch-a-044
    title: An automatic price-change log
    difficulty: expert
    dataset: shop
    module: m17
    tags: [trigger, plpgsql, audit, dml]
    setup: |
      CREATE TABLE price_audit (
          product_id integer NOT NULL,
          old_price numeric(10,2) NOT NULL,
          new_price numeric(10,2) NOT NULL
      );
    prompt: |
      Finance wants a history of every price change, written by the database itself, so nobody can forget to log one. The table `price_audit` already exists. It has the columns `product_id`, `old_price` and `new_price`.

      Write two statements:

      1. A function named `log_price_change()` that returns `trigger`. When the price of a product really changes, it inserts one row into `price_audit` with the product's id, the old price and the new price. A change to other columns (such as `stock_qty`) must not write a row.
      2. A trigger named `products_price_audit` that runs **after** each `UPDATE` on `products`, **for each row**, and calls `log_price_change()`.

      The app then updates two product prices and one stock quantity, and shows the `price_audit` table.
    solution: |
      CREATE FUNCTION log_price_change()
      RETURNS trigger
      LANGUAGE plpgsql
      AS $$
      BEGIN
          IF NEW.price IS DISTINCT FROM OLD.price THEN
              INSERT INTO price_audit (product_id, old_price, new_price)
              VALUES (NEW.product_id, OLD.price, NEW.price);
          END IF;
          RETURN NEW;
      END;
      $$;

      CREATE TRIGGER products_price_audit
      AFTER UPDATE ON products
      FOR EACH ROW
      EXECUTE FUNCTION log_price_change();
    check: |
      UPDATE products SET price = price + 10 WHERE product_id IN (1, 2);
      UPDATE products SET stock_qty = stock_qty + 5 WHERE product_id = 1;
      SELECT product_id, old_price, new_price
      FROM price_audit
      ORDER BY product_id;
    ordered: true
    hints:
      - "A trigger runs a trigger function automatically. Inside the function, NEW holds the row after the change and OLD holds the row before it."
      - "IF NEW.price IS DISTINCT FROM OLD.price THEN ... END IF; checks for a real change. Put the INSERT inside that IF."
      - "CREATE TRIGGER products_price_audit AFTER UPDATE ON products FOR EACH ROW EXECUTE FUNCTION log_price_change();"
    explanation: |
      A **trigger** is code the database runs by itself when rows change. Here the rule is "log every real price change", so the logging can never be skipped by a careless query.

      Two details matter. `IS DISTINCT FROM` compares values safely even with NULLs. And the check on `price` stops stock updates from writing audit rows. Triggers run once per row when you use `FOR EACH ROW`, and `NEW` / `OLD` give access to the values.

  - id: ch-a-045
    title: When each account first went below zero
    difficulty: expert
    dataset: bank
    module: m11
    tags: [running-total, window, rows-frame, tie-breaker]
    prompt: |
      Harbor Bank wants to know when each account first became overdrawn. Work out a **running balance** for every account:

      - add up the account's transactions in time order, from its first transaction up to the current one
      - order by `txn_time`, and by `txn_id` when two transactions have the same time

      The **first** transaction that makes the running balance negative (below 0) is the answer for that account. Show these columns:

      - `account_id`
      - `first_negative_time`: the `txn_time` of that transaction
      - `balance_after`: the running balance after that transaction

      Sort by `account_id`.
    solution: |
      WITH running AS (
          SELECT t.account_id, t.txn_id, t.txn_time,
                 SUM(t.amount) OVER (
                     PARTITION BY t.account_id
                     ORDER BY t.txn_time, t.txn_id
                     ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
                 ) AS balance
          FROM transactions t
      )
      SELECT DISTINCT ON (account_id)
             account_id,
             txn_time AS first_negative_time,
             balance AS balance_after
      FROM running
      WHERE balance < 0
      ORDER BY account_id, txn_time, txn_id;
    ordered: true
    hints:
      - "A running balance is a SUM with ORDER BY inside OVER. It adds each row to the rows before it."
      - "Use ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, and put txn_id in the ORDER BY so that rows with the same time keep one fixed order."
      - "Keep the rows where the running balance is below 0, then use DISTINCT ON (account_id) ORDER BY account_id, txn_time, txn_id to keep the first one."
    explanation: |
      A running balance is one of the most common window function tasks in finance. The frame matters: `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` means each row adds itself to the total, one at a time.

      Many transactions share a time in this data. A `RANGE` frame (the default with `ORDER BY`) would give all rows with the same time the same total, so the "first" negative row could be the wrong one. Adding `txn_id` to the sort makes the answer repeatable.

  - id: ch-a-046
    title: Each product's best month
    difficulty: expert
    dataset: messy
    module: m18
    tags: [unpivot, lateral, values, window]
    prompt: |
      The table `product_sales_wide` stores the revenue of each product in one column per month. It is hard to compare months that way.

      Turn it into one row per product and month. Use these columns:

      - `product`
      - `month_name` (the three-letter month: `Jan`, `Feb`, `Mar`, `Apr`, `May` or `Jun`)
      - `revenue`

      Then keep only each product's **best month**, the row with the highest `revenue`. Show `product`, `month_name` and `revenue`, sorted by `product`.
    solution: |
      WITH monthly AS (
          SELECT w.product, m.month_name, m.revenue
          FROM product_sales_wide w
          CROSS JOIN LATERAL (
              VALUES ('Jan', w.jan), ('Feb', w.feb), ('Mar', w.mar),
                     ('Apr', w.apr), ('May', w.may), ('Jun', w.jun)
          ) AS m(month_name, revenue)
      )
      SELECT product, month_name, revenue
      FROM (
          SELECT product, month_name, revenue,
                 ROW_NUMBER() OVER (
                     PARTITION BY product
                     ORDER BY revenue DESC
                 ) AS rn
          FROM monthly
      ) x
      WHERE rn = 1
      ORDER BY product;
    ordered: true
    hints:
      - "Unpivoting turns columns into rows. A VALUES list can hold one row per month: ('Jan', w.jan), ('Feb', w.feb), ..."
      - "CROSS JOIN LATERAL (VALUES ...) AS m(month_name, revenue) gives six rows for each product. LATERAL lets the VALUES list read the current product's columns."
      - "Then number the rows of each product by revenue, highest first, with ROW_NUMBER() OVER (PARTITION BY product ORDER BY revenue DESC), and keep row 1."
    explanation: |
      Moving data from wide (one column per month) to long (one row per month) is called **unpivoting**. Long tables are easier to filter, group and join, so most analysis is done in long form.

      `VALUES` with `LATERAL` is a neat way to unpivot a few columns. A `UNION ALL` of six `SELECT`s gives the same rows. The best-month step is a classic "top 1 per group" with `ROW_NUMBER()`.

  - id: ch-a-047
    title: Typical workout length by type
    difficulty: expert
    dataset: app
    module: m19
    tags: [percentile, median, json, aggregation]
    prompt: |
      The coaches want to know how long a typical workout lasts, for each workout type. Use the **completed** workouts (`workout_completed` events). Their length is stored in `properties` as `duration_min`.

      For each `workout_type` show these columns:

      - `workout_type` (from `properties`)
      - `completed` (how many completed workouts there are)
      - `median_minutes`: the median `duration_min`, rounded to 1 decimal
      - `p90_minutes`: the 90th percentile of `duration_min`, rounded to 1 decimal

      Use the continuous percentile (`PERCENTILE_CONT`). Sort by `workout_type`.
    solution: |
      SELECT properties->>'workout_type' AS workout_type,
             COUNT(*) AS completed,
             ROUND((PERCENTILE_CONT(0.5) WITHIN GROUP (
                 ORDER BY (properties->>'duration_min')::numeric))::numeric, 1) AS median_minutes,
             ROUND((PERCENTILE_CONT(0.9) WITHIN GROUP (
                 ORDER BY (properties->>'duration_min')::numeric))::numeric, 1) AS p90_minutes
      FROM events
      WHERE event_name = 'workout_completed'
      GROUP BY properties->>'workout_type'
      ORDER BY workout_type;
    ordered: true
    hints:
      - "properties->>'duration_min' returns the value as text. Cast it to a number with ::numeric before you calculate."
      - "PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY value) gives the median. Use 0.9 for the 90th percentile."
      - "The result of PERCENTILE_CONT is a double value, so cast it to numeric before ROUND(..., 1)."
    explanation: |
      Averages can be misleading when a few very long workouts pull them up. **Percentiles** describe the spread: the median is the middle workout, and the 90th percentile is the length that 90 out of 100 workouts stay under.

      `PERCENTILE_CONT` interpolates between two values when the position falls between them. `PERCENTILE_DISC` always returns a value from the data instead. Both are valid; the choice should be stated in every report.
