id: m09
order: 9
title: "CTEs: Readable & Recursive Queries"
subtitle: Give your subqueries names, then teach them to loop
icon: "🧩"
level: advanced
description: |
  Long queries get messy fast. In this module you learn the **CTE** (Common Table Expression): a way to
  give a subquery a name and build your answer in tidy, top-to-bottom steps.

  Then comes the magic trick. A **recursive CTE** can repeat itself, which lets SQL count, walk down an
  org chart, climb a family tree, and even find routes through a network, all in one query.
dataset: shop
lessons:
  - id: m09-l01
    title: "WITH basics: naming a subquery"
    summary: Give a subquery a name with WITH so your query reads top to bottom.
    minutes: 22
    steps:
      - type: read
        title: Your manager has a question
        md: |
          Your manager stops by your desk: *"How many orders does the average customer place?"*

          You can already answer this. Count the orders per customer in a **subquery**, then average those counts. It works, but a subquery stuck in the middle of a query is read *inside-out*, like opening a set of Russian dolls.

          Today you learn a tidier way. A **CTE** (Common Table Expression) is a subquery that you give a **name** and write *first*, so the whole query reads from top to bottom.

          > [!ANALOGY]
          > Think of a cooking show. Before cooking, the chef chops the onions and puts them in a bowl labelled "onions". The main recipe then simply says "add the onions". A CTE is that labelled bowl: you prepare a result once, give it a name, and use the name in the main query.

      - type: example
        title: "Before: a subquery in FROM"
        md: Here is the answer the way you already know it. Press **Run**.
        sql: |
          SELECT ROUND(AVG(order_count), 2) AS avg_orders
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS per_customer;
        after: |
          One row: about **6.43** orders per customer (counting only customers who ordered at least once).

          The counting query is buried inside the parentheses, so you have to read from the inside out.

      - type: example
        title: "After: the same answer with WITH"
        md: Now the very same counting query, moved to the top and given the name `per_customer`.
        sql: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT ROUND(AVG(order_count), 2) AS avg_orders
          FROM per_customer;
        after: |
          The same **6.43**, but it now reads like a story: first make `per_customer`, then average it.

          Compare the two versions. The counting query is identical; we only moved it up and gave it a name.

      - type: read
        title: The recipe for a CTE
        md: |
          Every CTE query has the same three parts:

          ```sql
          WITH nickname AS (
              SELECT ...        -- any SELECT query
          )
          SELECT ...            -- the main query
          FROM nickname;
          ```

          1. `WITH` announces: "I am about to name something."
          2. `nickname AS ( ... )` is the name, followed by its query in parentheses.
          3. The **main query** comes last and uses the nickname exactly like a table.

          > [!TIP]
          > Choose names that say what is inside: `per_customer`, `order_totals`, `delivered_orders`. Names like `x` or `temp1` force you to re-read the code to remember what they hold.

      - type: stepper
        title: Build a report in three moves
        md: |
          Let's find what share of all orders sits in each status. Click through the stages and run each one.
        stages:
          - label: "1. Prep bowl"
            md: First run the counting query on its own. This is the result we are about to name.
            sql: |
              SELECT status, COUNT(*) AS n
              FROM orders
              GROUP BY status;
          - label: "2. Name it"
            md: Wrap it in `WITH status_counts AS ( ... )` and select from the name. Same five rows, but now they have a name.
            sql: |
              WITH status_counts AS (
                  SELECT status, COUNT(*) AS n
                  FROM orders
                  GROUP BY status
              )
              SELECT *
              FROM status_counts;
          - label: "3. Use it"
            md: |
              Add a percentage. The CTE is used **twice**: once in `FROM`, and once inside the parentheses to get the grand total. You can use a CTE as often as you like within one query.
            sql: |
              WITH status_counts AS (
                  SELECT status, COUNT(*) AS n
                  FROM orders
                  GROUP BY status
              )
              SELECT
                  status,
                  n,
                  ROUND(100.0 * n / (SELECT SUM(n) FROM status_counts), 1) AS pct
              FROM status_counts
              ORDER BY n DESC;

      - type: example
        title: Join a CTE to a real table
        md: A CTE behaves like a table, so you can join it. Who are our most loyal customers (15 orders or more)?
        sql: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT c.first_name, c.last_name, p.order_count
          FROM per_customer AS p
          JOIN customers AS c ON c.customer_id = p.customer_id
          WHERE p.order_count >= 15
          ORDER BY p.order_count DESC, c.customer_id;
        after: |
          11 customers, with five of them tied at 23 orders. The CTE did the counting; the main query only joined and filtered.

      - type: quiz
        id: m09-l01-q1
        question: Which statement about a CTE is true?
        options:
          - It is saved in the database, so you can use it again tomorrow
          - It exists only while the one statement that defines it is running
          - You must create it with CREATE TABLE first
          - You can only use it once inside a query
        answer: 1
        explanation: |
          A CTE is a *temporary name* for one statement. Once the statement finishes, the name is gone. And within that statement you may use it as many times as you like.

      - type: example
        title: Naming the columns in the header
        md: |
          You can list column names right after the CTE name. This is handy when the inner query calculates a column and you want to give it a tidy name in one place.
        sql: |
          WITH order_totals (order_id, total) AS (
              SELECT order_id, SUM(quantity * unit_price * (1 - discount))
              FROM order_items
              GROUP BY order_id
          )
          SELECT o.order_id, o.order_date, ROUND(t.total, 2) AS total
          FROM orders AS o
          JOIN order_totals AS t ON t.order_id = o.order_id
          WHERE t.total > 1500
          ORDER BY t.total DESC;
        after: |
          The 20 orders worth more than $1,500, biggest first. There is no "total" column in the `orders` table, so the CTE builds one for us: quantity times unit price, minus the discount, added up per order.

          The names in `(order_id, total)` are matched to the inner query's columns **by position**.

      - type: read
        title: A CTE lives for one statement only
        md: |
          > [!MISTAKE]
          > A CTE is **not saved** anywhere. It exists only while its own statement runs. If you use the name in a *second* statement, PostgreSQL says `relation "..." does not exist`. If you need it again, repeat the `WITH` at the top of the new query.

          Next you will see exactly that error, so you recognise it when it happens to you.

      - type: example
        title: "The name has vanished (expected error)"
        md: The first statement works. The second one tries to reuse the name. Run it and read the message.
        expectError: true
        sql: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT COUNT(*) FROM per_customer;

          SELECT * FROM per_customer;
        after: |
          The first query counted 140 customers. The second one failed with `relation "per_customer" does not exist`, because the name only lived inside the first statement.

          The fix is simple: put the `WITH` clause at the top of the second query too.

      - type: exercise
        id: m09-l01-e1
        title: How many busy customers?
        prompt: |
          The starter already has the CTE `per_customer`, which counts the orders of every customer.

          Finish the main query so it shows **how many customers have placed at least 10 orders** (one number).
        starter: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT COUNT(*)
          FROM per_customer;
        solution: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT COUNT(*)
          FROM per_customer
          WHERE order_count >= 10;
        hints:
          - The CTE already does the hard part. You only need to change the main query at the bottom.
          - Keep only the customers whose `order_count` is at least 10 by adding a WHERE clause to the main query.
          - "SELECT COUNT(*) FROM per_customer WHERE order_count ___ 10;"
        explanation: |
          27 customers have ordered 10 times or more. `WHERE` filters the CTE's rows exactly as it would filter a real table.

          Pitfall: "at least 10" means `>= 10`, not `> 10`.
        difficulty: 1

      - type: predict
        id: m09-l01-p1
        question: |
          How many rows does this query return? (Remember: the shop has 150 customers and 900 orders.)
        sql: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT COUNT(*)
          FROM per_customer;
        options:
          - "1 row, with the value 900"
          - "1 row, with the value 150"
          - "1 row, with the value 140"
          - "140 rows"
        answer: 2
        explanation: |
          The CTE has **one row per customer who has at least one order**. Ten customers have never ordered, so 150 - 10 = **140** rows. The main query then counts those rows and returns a single row holding 140.

      - type: exercise
        id: m09-l01-e2
        title: Big categories
        prompt: |
          The starter has a CTE `category_counts` that counts products per category.

          Write the main query that joins it to `categories` and shows each category's `name` and `product_count`, only for categories with **5 or more** products. Show the biggest categories first; break ties alphabetically by `name`.
        starter: |
          WITH category_counts AS (
              SELECT category_id, COUNT(*) AS product_count
              FROM products
              GROUP BY category_id
          )
          SELECT
        solution: |
          WITH category_counts AS (
              SELECT category_id, COUNT(*) AS product_count
              FROM products
              GROUP BY category_id
          )
          SELECT c.name, cc.product_count
          FROM category_counts AS cc
          JOIN categories AS c ON c.category_id = cc.category_id
          WHERE cc.product_count >= 5
          ORDER BY cc.product_count DESC, c.name;
        ordered: true
        hints:
          - The CTE has only ids and counts. Where do the category names live?
          - JOIN `categories` to `category_counts` on category_id, then filter with WHERE and sort with ORDER BY.
          - "SELECT c.name, cc.product_count FROM category_counts AS cc JOIN categories AS c ON ___ WHERE ___ ORDER BY ___ DESC, c.name;"
        explanation: |
          Seven categories qualify: Kitchen, Peripherals and Phones (8 products each), then Books, Toys, Furniture and Laptops.

          A CTE joins like any table: give it an alias (`cc`) if you want shorter column references.
        difficulty: 1

      - type: fill
        id: m09-l01-f1
        prompt: Fill in the blanks to turn this query into a CTE and use it.
        template: |
          ___ status_counts ___ (
              SELECT status, COUNT(*) AS n
              FROM orders
              GROUP BY status
          )
          SELECT status, n
          FROM ___
          ORDER BY n DESC;
        answers:
          - ["WITH"]
          - ["AS"]
          - ["status_counts"]
        explanation: |
          `WITH name AS ( ... )` defines the CTE, and the main query selects `FROM` that same name.

      - type: exercise
        id: m09-l01-e3
        title: Average delivered order
        prompt: |
          There is no "order total" column, so build one. The total of an order is the sum of `quantity * unit_price * (1 - discount)` over its rows in `order_items`.

          Write a CTE `order_totals` (one row per order: `order_id`, `total`) and use it to find the **average total of delivered orders**, rounded to 2 decimals. Return one column called `avg_total`.
        starter: |
          WITH order_totals AS (
              -- your inner query here
          )
          SELECT
        solution: |
          WITH order_totals AS (
              SELECT order_id,
                     SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          )
          SELECT ROUND(AVG(t.total), 2) AS avg_total
          FROM order_totals AS t
          JOIN orders AS o ON o.order_id = t.order_id
          WHERE o.status = 'delivered';
        hints:
          - You need two things per order, a total (from order_items) and a status (from orders).
          - Put the SUM in the CTE with GROUP BY order_id. In the main query, JOIN orders, filter on status, and take AVG(total).
          - "WITH order_totals AS (SELECT order_id, SUM(___) AS total FROM order_items GROUP BY order_id) SELECT ROUND(AVG(t.total), 2) AS avg_total FROM order_totals AS t JOIN orders AS o ON ___ WHERE ___;"
        explanation: |
          The average delivered order is worth **$352.99**.

          Pitfall: filter by status in the *main* query (or inside the CTE with a join); `order_items` itself has no status column.
        difficulty: 2

      - type: exercise
        id: m09-l01-e4
        title: Fix the bug
        prompt: |
          This query should count the orders whose total is more than $500 *before* discounts (`quantity * unit_price`), but it crashes with a syntax error.

          Fix it so it returns one number.
        starter: |
          WITH order_totals AS
              SELECT order_id, SUM(quantity * unit_price) AS total
              FROM order_items
              GROUP BY order_id
          SELECT COUNT(*)
          FROM order_totals
          WHERE total > 500;
        solution: |
          WITH order_totals AS (
              SELECT order_id, SUM(quantity * unit_price) AS total
              FROM order_items
              GROUP BY order_id
          )
          SELECT COUNT(*)
          FROM order_totals
          WHERE total > 500;
        hints:
          - 'The error says "syntax error at or near SELECT". Look at what comes right after `AS`.'
          - The query inside a CTE must be wrapped in parentheses.
          - "Add ( after AS and ) after GROUP BY order_id."
        explanation: |
          203 orders are above $500 before discounts. The parentheses tell PostgreSQL where the CTE's query starts and ends. Forgetting them is the most common CTE typo.
        difficulty: 2

      - type: parsons
        id: m09-l01-o1
        prompt: Put the lines in order to count how many delivered orders there are, using a CTE.
        lines:
          - WITH delivered_orders AS (
          - "    SELECT order_id, customer_id"
          - "    FROM orders"
          - "    WHERE status = 'delivered'"
          - )
          - SELECT COUNT(*)
          - FROM delivered_orders;
        distractors:
          - CREATE delivered_orders AS (
        explanation: |
          The CTE comes first (`WITH ... AS ( ... )`), then the main query. The answer is 650 delivered orders.

      - type: exercise
        id: m09-l01-e5
        title: Above-average customers
        prompt: |
          How many customers have placed **more** orders than the average customer?

          Count the orders per customer in a CTE named `per_customer`, then compare each count with the average of that same CTE. Return one number.
        solution: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT COUNT(*)
          FROM per_customer
          WHERE order_count > (SELECT AVG(order_count) FROM per_customer);
        hints:
          - You need the average order count first, then compare each customer against it.
          - A CTE can be used twice, once in FROM and once inside a scalar subquery in WHERE.
          - "SELECT COUNT(*) FROM per_customer WHERE order_count > (SELECT ___ FROM per_customer);"
        explanation: |
          48 of the 140 customers are above the average of 6.43. Using the CTE twice means the counting logic is written only once.

          Without a CTE you would have to repeat the whole GROUP BY query inside the WHERE clause.
        difficulty: 2

      - type: quiz
        id: m09-l01-q2
        question: Which TWO are real benefits of using a CTE instead of a nested subquery?
        options:
          - The query reads from top to bottom, with a meaningful name for each step
          - It always runs ten times faster
          - You can refer to the same named result more than once in the query
          - The result is saved permanently in the database
        answer: [0, 2]
        explanation: |
          CTEs make queries **readable** and let you **reuse** a named result inside one statement. They do not automatically make a query faster, and they never save anything permanently.

      - type: exercise
        id: m09-l01-e6
        title: Orders per customer, by segment
        prompt: |
          Customers belong to a `segment` (Consumer, Corporate or Home Office).

          Using a CTE `per_customer` (orders per customer), show for each segment the **average number of orders per customer**, rounded to 2 decimals. Only customers with at least one order are in the CTE. Show `segment` and `avg_orders`, sorted by `segment`.
        solution: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT c.segment,
                 ROUND(AVG(p.order_count), 2) AS avg_orders
          FROM per_customer AS p
          JOIN customers AS c ON c.customer_id = p.customer_id
          GROUP BY c.segment
          ORDER BY c.segment;
        ordered: true
        hints:
          - 'This is an "average of counts": first count per customer (the CTE), then average per segment.'
          - Join `per_customer` to `customers` to get the segment, then GROUP BY segment.
          - "SELECT c.segment, ROUND(AVG(p.order_count), 2) AS avg_orders FROM per_customer AS p JOIN customers AS c ON ___ GROUP BY ___ ORDER BY c.segment;"
        explanation: |
          Home Office customers order most often (7.52 on average), Corporate customers least (5.00).

          This is the classic "aggregate of an aggregate" pattern: one GROUP BY inside the CTE, a second GROUP BY outside.
        difficulty: 3
    cheatsheet:
      - title: CTE skeleton
        sql: |
          WITH name AS (
              SELECT ...
          )
          SELECT ...
          FROM name;
        note: The name works like a table, but only inside this one statement.
      - title: Name the columns in the header
        sql: |
          WITH order_totals (order_id, total) AS (
              SELECT order_id, SUM(quantity * unit_price)
              FROM order_items
              GROUP BY order_id
          )
          SELECT * FROM order_totals;
        note: The names in parentheses are matched to the inner query's columns by position.
      - title: Use a CTE twice
        sql: |
          WITH c AS (SELECT customer_id, COUNT(*) AS n FROM orders GROUP BY customer_id)
          SELECT * FROM c
          WHERE n > (SELECT AVG(n) FROM c);
        note: Write the logic once, refer to it as often as you like.
  - id: m09-l02
    title: "Chaining CTEs: build a pipeline"
    summary: Write several CTEs in a row, each one building on the one above.
    minutes: 25
    steps:
      - type: read
        title: One big question, many small steps
        md: |
          The finance team asks: *"Who are our best customers? Please sort them into Gold, Silver and Bronze."*

          That is too big to answer in one go. So split it up, just like you would on paper:

          1. Work out the **total of every order**.
          2. Add those totals up **per customer**.
          3. Put each customer into a **tier**.

          In SQL you can write each step as its own CTE. Each CTE may use the CTEs written *above* it.

          > [!ANALOGY]
          > Picture a factory assembly line. Station 1 makes order totals and puts them on the conveyor belt. Station 2 picks them up and adds them per customer. Station 3 stamps a tier on each customer. Every station only cares about the belt in front of it.

          ```sql
          WITH station_one AS (
              SELECT ...
          ),
          station_two AS (
              SELECT ... FROM station_one
          )
          SELECT ... FROM station_two;
          ```

      - type: stepper
        title: Customer tiers, one station at a time
        md: |
          Click through the stages. Each stage adds one more CTE to the pipeline, and shows what the belt carries at that point.
        stages:
          - label: "Station 1: order totals"
            md: |
              The first CTE adds up each order's lines. We peek at five rows to check it works.
            sql: |
              WITH order_totals AS (
                  SELECT
                      order_id,
                      SUM(quantity * unit_price * (1 - discount)) AS total
                  FROM order_items
                  GROUP BY order_id
              )
              SELECT *
              FROM order_totals
              ORDER BY order_id
              LIMIT 5;
          - label: "Station 2: spend per customer"
            md: |
              Add a **comma** and a second CTE. It uses `order_totals` from above, joins `orders` to get the customer, and keeps delivered orders only.
            sql: |
              WITH order_totals AS (
                  SELECT
                      order_id,
                      SUM(quantity * unit_price * (1 - discount)) AS total
                  FROM order_items
                  GROUP BY order_id
              ),
              customer_spend AS (
                  SELECT o.customer_id, COUNT(*) AS orders, SUM(t.total) AS spent
                  FROM orders AS o
                  JOIN order_totals AS t ON t.order_id = o.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY o.customer_id
              )
              SELECT customer_id, orders, ROUND(spent, 2) AS spent
              FROM customer_spend
              ORDER BY spent DESC
              LIMIT 5;
          - label: "Station 3: tiers"
            md: |
              A third CTE stamps a tier with `CASE`. The main query then counts customers per tier: 10 Gold, 29 Silver and 98 Bronze.
            sql: |
              WITH order_totals AS (
                  SELECT
                      order_id,
                      SUM(quantity * unit_price * (1 - discount)) AS total
                  FROM order_items
                  GROUP BY order_id
              ),
              customer_spend AS (
                  SELECT o.customer_id, COUNT(*) AS orders, SUM(t.total) AS spent
                  FROM orders AS o
                  JOIN order_totals AS t ON t.order_id = o.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY o.customer_id
              ),
              tiers AS (
                  SELECT
                      customer_id,
                      spent,
                      CASE
                          WHEN spent >= 5000 THEN 'Gold'
                          WHEN spent >= 2000 THEN 'Silver'
                          ELSE 'Bronze'
                      END AS tier
                  FROM customer_spend
              )
              SELECT tier, COUNT(*) AS customers, ROUND(AVG(spent), 2) AS avg_spent
              FROM tiers
              GROUP BY tier
              ORDER BY avg_spent DESC;

      - type: read
        title: Three rules for chaining
        md: |
          1. Write **one** `WITH` at the very top. Separate the CTEs with a **comma**.
          2. Put **no comma** after the last CTE. The main query follows its closing parenthesis directly.
          3. A CTE can use any CTE written **above** it, but never one written below it.

          > [!MISTAKE]
          > Two classic typos: writing `WITH` a second time before the next CTE, and leaving a comma after the last CTE (`), SELECT ...`). Both give `syntax error at or near ...`.

          > [!TIP]
          > To debug a long pipeline, temporarily change the main query to `SELECT * FROM some_step LIMIT 5;`. You can look at what any station is carrying, just like the stepper above.

      - type: example
        title: Two CTEs side by side
        md: |
          CTEs don't have to be in a straight line. Here two independent CTEs each summarise a different date column, and the main query lines them up: how many orders were *placed* and how many were *shipped* in each month of 2024?
        sql: |
          WITH placed AS (
              SELECT DATE_TRUNC('month', order_date)::date AS month,
                     COUNT(*) AS placed
              FROM orders
              WHERE order_date >= '2024-01-01'
              GROUP BY month
          ),
          shipped AS (
              SELECT DATE_TRUNC('month', shipped_date)::date AS month,
                     COUNT(*) AS shipped
              FROM orders
              WHERE shipped_date >= '2024-01-01'
              GROUP BY month
          )
          SELECT p.month, p.placed, s.shipped
          FROM placed AS p
          JOIN shipped AS s ON s.month = p.month
          ORDER BY p.month;
        after: |
          Twelve rows, one per month. The two columns usually differ: cancelled orders are never shipped, and an order placed on the 31st may ship next month. In November, for example, 91 orders were placed but 60 shipped.

          Neither CTE uses the other; both are used by the main query.

      - type: example
        title: "Order matters (expected error)"
        md: |
          Here `second` tries to use `first`, but `first` is written *below* it. Run it and read the hint.
        expectError: true
        sql: |
          WITH second AS (
              SELECT n + 1 AS n FROM first
          ),
          first AS (
              SELECT 1 AS n
          )
          SELECT * FROM second;
        after: |
          PostgreSQL reads the CTEs from top to bottom, so at the moment it reads `second`, it has never heard of `first`. The error is `relation "first" does not exist`.

          The hint mentions `WITH RECURSIVE`. Ignore that for now (you meet it later in this module). The simple fix is to **swap the order**: `first` goes on top.

      - type: quiz
        id: m09-l02-q1
        question: |
          Look at this skeleton:

          ```sql
          WITH a AS ( ... ),
          b AS ( ... FROM a ... ),
          c AS ( ... FROM b ... )
          SELECT ... FROM c;
          ```

          Which CTEs is `b` allowed to use?
        options:
          - Only a
          - a and c
          - Only c
          - None of them
        answer: 0
        explanation: |
          A CTE can look **upwards** only. `b` can see `a` (above it) but not `c` (below it). The main query at the bottom can see all of them.

      - type: exercise
        id: m09-l02-e1
        title: The five biggest spenders
        prompt: |
          The starter already has `order_totals`.

          Add a second CTE `customer_spend` with one row per customer: `customer_id` and `spent`, the sum of the totals of that customer's **delivered** orders, rounded to 2 decimals.

          Then show the **5 customers who spent the most** (columns `customer_id`, `spent`), biggest first.
        starter: |
          WITH order_totals AS (
              SELECT
                  order_id,
                  SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          )
          SELECT *
          FROM order_totals;
        solution: |
          WITH order_totals AS (
              SELECT
                  order_id,
                  SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          ),
          customer_spend AS (
              SELECT o.customer_id, ROUND(SUM(t.total), 2) AS spent
              FROM orders AS o
              JOIN order_totals AS t ON t.order_id = o.order_id
              WHERE o.status = 'delivered'
              GROUP BY o.customer_id
          )
          SELECT customer_id, spent
          FROM customer_spend
          ORDER BY spent DESC
          LIMIT 5;
        ordered: true
        hints:
          - After the closing parenthesis of `order_totals`, type a comma and start the next CTE.
          - "`customer_spend` joins `orders` to `order_totals` on order_id, keeps status = 'delivered', and groups by customer_id."
          - "..., customer_spend AS (SELECT o.customer_id, ROUND(SUM(t.total), 2) AS spent FROM orders AS o JOIN order_totals AS t ON ___ WHERE ___ GROUP BY ___) SELECT customer_id, spent FROM customer_spend ORDER BY spent DESC LIMIT 5;"
        explanation: |
          Customer 6 leads with $8,458.40, followed by customers 10, 39, 91 and 44. The pipeline reads naturally: totals, then spend, then top 5.

          The 6th customer spends $6,029.44, so there is no tie at the cut-off.
        difficulty: 1

      - type: predict
        id: m09-l02-p1
        question: |
          Follow the belt! What single value does this query return?
        sql: |
          WITH nums AS (
              SELECT 1 AS n
              UNION ALL SELECT 2
              UNION ALL SELECT 3
          ),
          doubled AS (
              SELECT n * 2 AS n FROM nums
          ),
          plus_ten AS (
              SELECT n + 10 AS n FROM doubled
          )
          SELECT SUM(n) FROM plus_ten;
        options: ["6", "12", "30", "42"]
        answer: 3
        explanation: |
          `nums` holds 1, 2, 3. `doubled` turns them into 2, 4, 6. `plus_ten` turns those into 12, 14, 16. The sum is 12 + 14 + 16 = **42**.

          Tracing a pipeline station by station is the best way to understand any long query.

      - type: exercise
        id: m09-l02-e2
        title: Orders and money by month
        prompt: |
          For each month of **2024**, show how many orders were placed and how much money was received in payments.

          Use two CTEs: `orders_per_month` (from `orders`, by `order_date`) and `payments_per_month` (from `payments`, by `paid_at`). Then join them in the main query.

          Show three columns: `month` (the first day of the month as a date), `orders` (number of orders) and `collected` (sum of `amount`, rounded to 2 decimals). Sort by `month`.
        solution: |
          WITH orders_per_month AS (
              SELECT DATE_TRUNC('month', order_date)::date AS month,
                     COUNT(*) AS orders
              FROM orders
              WHERE order_date >= '2024-01-01'
              GROUP BY month
          ),
          payments_per_month AS (
              SELECT DATE_TRUNC('month', paid_at)::date AS month,
                     ROUND(SUM(amount), 2) AS collected
              FROM payments
              WHERE paid_at >= '2024-01-01'
              GROUP BY month
          )
          SELECT o.month, o.orders, p.collected
          FROM orders_per_month AS o
          JOIN payments_per_month AS p ON p.month = o.month
          ORDER BY o.month;
        ordered: true
        hints:
          - It is the same shape as the "placed vs shipped" example, but the second CTE reads from a different table.
          - "Each CTE: DATE_TRUNC('month', ...)::date AS month, an aggregate, WHERE the date is in 2024, GROUP BY month. Join the two on month."
          - "WITH orders_per_month AS (SELECT DATE_TRUNC('month', order_date)::date AS month, COUNT(*) AS orders FROM orders WHERE ___ GROUP BY month), payments_per_month AS (___) SELECT o.month, o.orders, p.collected FROM orders_per_month AS o JOIN payments_per_month AS p ON ___ ORDER BY o.month;"
        explanation: |
          The 2024 data runs from January to December, so you get 12 rows. December 2024 was the best month for money received: $27,587.81 from 86 orders.

          Both CTEs end at the same grain (one row per month), which is why a simple join on `month` works.
        difficulty: 2

      - type: fill
        id: m09-l02-f1
        prompt: Complete the pipeline. Remember the comma rule and let the second CTE use the first.
        template: |
          WITH order_totals AS (
              SELECT order_id, SUM(quantity * unit_price) AS total
              FROM order_items
              GROUP BY order_id
          )___
          big_orders AS (
              SELECT order_id, total
              FROM ___
              WHERE total > 1000
          )
          SELECT COUNT(*)
          FROM big_orders;
        answers:
          - [","]
          - ["order_totals"]
        explanation: |
          A comma goes between CTEs (right after the closing parenthesis of the first one), and `big_orders` reads `FROM order_totals`, the CTE above it.

      - type: example
        title: Two CTEs feeding one main query
        md: |
          Which products have been sold but **never reviewed**? One CTE lists sold products, another lists reviewed products, and the main query keeps the sold ones that are missing from the reviewed list (an anti-join with `LEFT JOIN ... IS NULL`).
        sql: |
          WITH sold AS (
              SELECT DISTINCT product_id
              FROM order_items
          ),
          reviewed AS (
              SELECT DISTINCT product_id
              FROM reviews
          )
          SELECT p.product_id, p.name
          FROM sold AS s
          JOIN products AS p ON p.product_id = s.product_id
          LEFT JOIN reviewed AS r ON r.product_id = s.product_id
          WHERE r.product_id IS NULL
          ORDER BY p.product_id;
        after: |
          Three products were sold but never reviewed: a laptop stand, an atlas and a face serum. A marketing team could use this list to ask buyers for reviews.

          Notice the shape: two CTEs side by side, both used by the main query.

      - type: exercise
        id: m09-l02-e3
        title: The three best categories
        prompt: |
          Which **3 categories** earned the most revenue from **delivered** orders?

          Build it in stages: a CTE `product_revenue` (revenue per product: sum of `quantity * unit_price * (1 - discount)` over delivered order lines), then a CTE `category_revenue` (revenue per category, using `products.category_id`), then join `categories` for the names.

          Show `name` and `revenue` (rounded to 2 decimals), biggest first.
        solution: |
          WITH product_revenue AS (
              SELECT
                  i.product_id,
                  SUM(i.quantity * i.unit_price * (1 - i.discount)) AS revenue
              FROM order_items AS i
              JOIN orders AS o ON o.order_id = i.order_id
              WHERE o.status = 'delivered'
              GROUP BY i.product_id
          ),
          category_revenue AS (
              SELECT p.category_id, SUM(pr.revenue) AS revenue
              FROM product_revenue AS pr
              JOIN products AS p ON p.product_id = pr.product_id
              GROUP BY p.category_id
          )
          SELECT c.name, ROUND(cr.revenue, 2) AS revenue
          FROM category_revenue AS cr
          JOIN categories AS c ON c.category_id = cr.category_id
          ORDER BY cr.revenue DESC
          LIMIT 3;
        ordered: true
        hints:
          - 'Think of two stations: "revenue per product", then "revenue per category".'
          - "order_items has the money, orders has the status, products has the category_id, categories has the name."
          - "WITH product_revenue AS (... GROUP BY i.product_id), category_revenue AS (SELECT p.category_id, SUM(pr.revenue) AS revenue FROM product_revenue AS pr JOIN products AS p ON ___ GROUP BY ___) SELECT c.name, ROUND(cr.revenue, 2) AS revenue FROM category_revenue AS cr JOIN categories AS c ON ___ ORDER BY cr.revenue DESC LIMIT 3;"
        explanation: |
          Phones ($60,548.25), Laptops ($46,914.56) and Kitchen ($30,832.58) lead the way. Peripherals is 4th with $21,787.82, so there is no tie at the cut-off.

          Pitfall: use `order_items.unit_price`, not `products.price`. Prices change over time, and the order line remembers what the customer actually paid.
        difficulty: 2

      - type: exercise
        id: m09-l02-e4
        title: Fix the bug
        prompt: |
          This query should count how many customers have at least one **delivered** order. It fails with a syntax error.

          Fix it so it returns one number.
        starter: |
          WITH delivered AS (
              SELECT order_id, customer_id
              FROM orders
              WHERE status = 'delivered'
          )
          WITH delivered_customers AS (
              SELECT DISTINCT customer_id
              FROM delivered
          )
          SELECT COUNT(*)
          FROM delivered_customers;
        solution: |
          WITH delivered AS (
              SELECT order_id, customer_id
              FROM orders
              WHERE status = 'delivered'
          ),
          delivered_customers AS (
              SELECT DISTINCT customer_id
              FROM delivered
          )
          SELECT COUNT(*)
          FROM delivered_customers;
        hints:
          - 'The error is "syntax error at or near WITH". How many WITH keywords does a chained query need?'
          - Only one. Replace the second WITH with a comma placed after the first CTE's closing parenthesis.
          - "WITH delivered AS ( ... ), delivered_customers AS ( ... ) SELECT COUNT(*) FROM delivered_customers;"
        explanation: |
          137 customers have at least one delivered order (13 of the 150 have none). One `WITH` starts the whole list, and commas separate the CTEs.
        difficulty: 2

      - type: parsons
        id: m09-l02-o1
        prompt: Arrange the lines into a two-step pipeline that counts the orders worth more than $1,000.
        lines:
          - WITH order_totals AS (
          - "    SELECT order_id, SUM(quantity * unit_price) AS total"
          - "    FROM order_items GROUP BY order_id"
          - "),"
          - big_orders AS (
          - "    SELECT order_id FROM order_totals WHERE total > 1000"
          - )
          - SELECT COUNT(*)
          - FROM big_orders;
        distractors:
          - WITH big_orders AS (
        explanation: |
          Station 1 (`order_totals`) comes first and ends with `),`. Station 2 (`big_orders`) uses it and ends with `)` and no comma, because the main query follows.

      - type: exercise
        id: m09-l02-e5
        title: Who brings in the money?
        prompt: |
          Sort customers into tiers by what they spent on **delivered** orders: **Gold** if they spent 5000 or more, **Silver** if 2000 or more (but under 5000), **Bronze** otherwise.

          Show for each tier the total `revenue` (rounded to 2 decimals) and `pct`, that tier's share of all delivered revenue in percent (rounded to 1 decimal). Columns: `tier`, `revenue`, `pct`. Biggest revenue first.

          Build it as a pipeline of CTEs: order totals, spend per customer, tiers, revenue per tier.
        solution: |
          WITH order_totals AS (
              SELECT
                  order_id,
                  SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          ),
          customer_spend AS (
              SELECT o.customer_id, SUM(t.total) AS spent
              FROM orders AS o
              JOIN order_totals AS t ON t.order_id = o.order_id
              WHERE o.status = 'delivered'
              GROUP BY o.customer_id
          ),
          tiers AS (
              SELECT
                  customer_id,
                  spent,
                  CASE
                      WHEN spent >= 5000 THEN 'Gold'
                      WHEN spent >= 2000 THEN 'Silver'
                      ELSE 'Bronze'
                  END AS tier
              FROM customer_spend
          ),
          tier_revenue AS (
              SELECT tier, SUM(spent) AS revenue
              FROM tiers
              GROUP BY tier
          )
          SELECT
              tier,
              ROUND(revenue, 2) AS revenue,
              ROUND(100.0 * revenue /
                  (SELECT SUM(revenue) FROM tier_revenue), 1) AS pct
          FROM tier_revenue
          ORDER BY revenue DESC;
        ordered: true
        hints:
          - You already built the first three stations in the stepper. You only need a fourth CTE and a new main query.
          - "tier_revenue groups the tiers CTE by tier and sums spent. For the percentage, divide each revenue by (SELECT SUM(revenue) FROM tier_revenue)."
          - "..., tier_revenue AS (SELECT tier, SUM(spent) AS revenue FROM tiers GROUP BY tier) SELECT tier, ROUND(revenue, 2) AS revenue, ROUND(100.0 * revenue / (SELECT ___ FROM tier_revenue), 1) AS pct FROM tier_revenue ORDER BY revenue DESC;"
        explanation: |
          Surprise: Gold customers (only 10 people) bring in 27.1% of the revenue, while the 29 Silver customers bring in 38.8% and the 98 Bronze customers 34.1%. The middle tier matters most!

          Four CTEs, four clear steps, and each one can be tested on its own.
        difficulty: 3

      - type: quiz
        id: m09-l02-q2
        question: |
          You write three CTEs in this order: `sales`, `costs`, `profit`, followed by a main query. Where do the commas go?
        options:
          - After every closing parenthesis, including the one after profit
          - Between the CTEs only, none after the last one
          - Only after the first CTE
          - Commas are not needed because each CTE has AS
        answer: 1
        explanation: |
          Commas **separate** CTEs: one after `sales )` and one after `costs )`. The last CTE (`profit`) is followed directly by the main `SELECT`, with no comma.

      - type: exercise
        id: m09-l02-e6
        title: Review outreach list
        prompt: |
          Marketing wants to ask valuable customers for a review. Find customers who spent **at least 1000** on delivered orders but have **never written a review**.

          Show `customer_id`, `first_name`, `last_name` and `spent` (rounded to 2 decimals), biggest spender first.

          Hint on the shape: one CTE for spend per customer, one CTE for the customers who did review, and a main query that combines them.
        solution: |
          WITH order_totals AS (
              SELECT
                  order_id,
                  SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          ),
          customer_spend AS (
              SELECT o.customer_id, SUM(t.total) AS spent
              FROM orders AS o
              JOIN order_totals AS t ON t.order_id = o.order_id
              WHERE o.status = 'delivered'
              GROUP BY o.customer_id
          ),
          reviewers AS (
              SELECT DISTINCT customer_id
              FROM reviews
          )
          SELECT
              c.customer_id,
              c.first_name,
              c.last_name,
              ROUND(s.spent, 2) AS spent
          FROM customer_spend AS s
          JOIN customers AS c ON c.customer_id = s.customer_id
          LEFT JOIN reviewers AS r ON r.customer_id = s.customer_id
          WHERE s.spent >= 1000
            AND r.customer_id IS NULL
          ORDER BY s.spent DESC;
        ordered: true
        hints:
          - You need three ingredients, spend per customer, the set of reviewers, and customer names.
          - Use the anti-join pattern from the products example, LEFT JOIN the reviewers CTE and keep rows where it is NULL.
          - "..., reviewers AS (SELECT DISTINCT customer_id FROM reviews) SELECT c.customer_id, c.first_name, c.last_name, ROUND(s.spent, 2) AS spent FROM customer_spend AS s JOIN customers AS c ON ___ LEFT JOIN reviewers AS r ON ___ WHERE s.spent >= 1000 AND ___ IS NULL ORDER BY s.spent DESC;"
        explanation: |
          Four customers qualify (52, 125, 16 and 98). Anti-joins (`LEFT JOIN ... WHERE x IS NULL`) are the standard way to say "but never...".

          Real analysts build exactly this kind of list every week: "valuable customers who haven't done X yet".
        difficulty: 3
    cheatsheet:
      - title: Chain several CTEs
        sql: |
          WITH step_one AS (
              SELECT ...
          ),
          step_two AS (
              SELECT ... FROM step_one
          )
          SELECT ... FROM step_two;
        note: One WITH, a comma between CTEs, no comma after the last one.
      - title: Peek at any step
        sql: |
          WITH a AS (...), b AS (...)
          SELECT * FROM a LIMIT 5;
        note: Temporarily select from an earlier CTE to debug a long pipeline.
      - title: Order matters
        sql: |
          -- b can use a, but a cannot use b
          WITH a AS (...), b AS (SELECT * FROM a)
          SELECT * FROM b;
        note: A CTE can only see CTEs written above it.
  - id: m09-l03
    title: "Refactoring: from nested to named"
    summary: Untangle a nested query into tidy CTEs, and learn what MATERIALIZED means.
    minutes: 25
    steps:
      - type: read
        title: Sam's monster query
        md: |
          Your colleague Sam has moved to another team. He left you one query and a sticky note: *"It works. Please don't touch it!"*

          You open the query and your eyes cross. There are subqueries inside subqueries, and one of them even appears **twice**. Nobody dares to change it, because nobody can read it.

          Today you learn to **refactor**: to rewrite a query so it is easier to read, **without changing the answer**. CTEs are the perfect tool for it.

          > [!ANALOGY]
          > Refactoring is like tidying a messy desk. You put the same papers into labelled folders. Nothing is thrown away, and every paper is still there. It is just easy to find things now.

      - type: example
        title: The monster
        md: |
          This query finds the products that sold **more units than the average product** (delivered orders only). Press **Run**, then try to explain it in one sentence.
        sql: |
          SELECT p.name, u.units
          FROM (
              SELECT i.product_id, SUM(i.quantity) AS units
              FROM order_items AS i
              JOIN orders AS o ON o.order_id = i.order_id
              WHERE o.status = 'delivered'
              GROUP BY i.product_id
          ) AS u
          JOIN products AS p ON p.product_id = u.product_id
          WHERE u.units > (
              SELECT AVG(units)
              FROM (
                  SELECT SUM(i.quantity) AS units
                  FROM order_items AS i
                  JOIN orders AS o ON o.order_id = i.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY i.product_id
              ) AS x
          )
          ORDER BY u.units DESC, p.name;
        after: |
          18 products beat the average, which is about 44.49 units per product. Vitamin C Moisturizer is the champion with 145 units.

          The answer is fine. The problem is the shape: the *same* counting query is written out **twice** (once in `FROM`, once inside `WHERE`). If Sam ever changes one copy and forgets the other, the report quietly breaks.

      - type: read
        title: The refactoring recipe
        md: |
          Follow these four moves, and run the query again after each one:

          1. **Spot** a subquery you can name. A repeated one is the best candidate.
          2. **Cut** it out and paste it at the top as `WITH nickname AS ( ... )`.
          3. **Replace** each original spot with the nickname.
          4. **Compare**: the new query must return exactly the same rows as the old one.

          > [!TIP]
          > Move one subquery at a time, and run the query after each move. If the result changes, you know which move caused it.

      - type: stepper
        title: Untangling the monster in three moves
        md: |
          Click through the stages and run each one. All three return the **same 18 rows**. Only the shape changes.
        stages:
          - label: "1. Before"
            md: This is Sam's original query, with the counting query written twice.
            sql: |
              SELECT p.name, u.units
              FROM (
                  SELECT i.product_id, SUM(i.quantity) AS units
                  FROM order_items AS i
                  JOIN orders AS o ON o.order_id = i.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY i.product_id
              ) AS u
              JOIN products AS p ON p.product_id = u.product_id
              WHERE u.units > (
                  SELECT AVG(units)
                  FROM (
                      SELECT SUM(i.quantity) AS units
                      FROM order_items AS i
                      JOIN orders AS o ON o.order_id = i.order_id
                      WHERE o.status = 'delivered'
                      GROUP BY i.product_id
                  ) AS x
              )
              ORDER BY u.units DESC, p.name;
          - label: "2. Name the first copy"
            md: |
              The first counting query becomes the CTE `units_sold`. The `FROM` part is already much easier to read. The second copy is still hiding inside `WHERE`.
            sql: |
              WITH units_sold AS (
                  SELECT i.product_id, SUM(i.quantity) AS units
                  FROM order_items AS i
                  JOIN orders AS o ON o.order_id = i.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY i.product_id
              )
              SELECT p.name, u.units
              FROM units_sold AS u
              JOIN products AS p ON p.product_id = u.product_id
              WHERE u.units > (
                  SELECT AVG(units)
                  FROM (
                      SELECT SUM(i.quantity) AS units
                      FROM order_items AS i
                      JOIN orders AS o ON o.order_id = i.order_id
                      WHERE o.status = 'delivered'
                      GROUP BY i.product_id
                  ) AS x
              )
              ORDER BY u.units DESC, p.name;
          - label: "3. Reuse the name"
            md: |
              The second copy is the same query, so it can simply say `FROM units_sold`. The long block disappears.
            sql: |
              WITH units_sold AS (
                  SELECT i.product_id, SUM(i.quantity) AS units
                  FROM order_items AS i
                  JOIN orders AS o ON o.order_id = i.order_id
                  WHERE o.status = 'delivered'
                  GROUP BY i.product_id
              )
              SELECT p.name, u.units
              FROM units_sold AS u
              JOIN products AS p ON p.product_id = u.product_id
              WHERE u.units > (SELECT AVG(units) FROM units_sold)
              ORDER BY u.units DESC, p.name;

      - type: quiz
        id: m09-l03-q1
        question: |
          You have refactored a query into CTEs. What is the best way to check you did not break anything?
        options:
          - Check that the new query is shorter than the old one
          - Check that it runs without an error message
          - Run both versions and check that they return exactly the same rows
          - Check that every CTE has a nice name
        answer: 2
        explanation: |
          Refactoring means *same answer, better shape*. A shorter query can still be wrong, and a query that runs without an error can still return different rows. Always compare the results of the old and the new version.

      - type: read
        title: Another favourite refactoring
        md: |
          A **correlated subquery** (a subquery that peeks at the outer row) runs once per row, and it is hard to read. A classic example: *products that cost more than 1.5 times the average price of their own category.*

          ```sql
          SELECT p.name, p.price
          FROM products AS p
          WHERE p.price > 1.5 * (
              SELECT AVG(p2.price)
              FROM products AS p2
              WHERE p2.category_id = p.category_id
          );
          ```

          The tidy version moves the averages into a CTE (one row per category) and **joins** it. Run it on the next step.

      - type: example
        title: Correlated subquery, now a CTE and a join
        md: Same question, same 9 products, and as a bonus we can show the category average too.
        sql: |
          WITH category_avg AS (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          )
          SELECT
              p.name,
              p.price,
              ROUND(a.avg_price, 2) AS category_avg
          FROM products AS p
          JOIN category_avg AS a ON a.category_id = p.category_id
          WHERE p.price > 1.5 * a.avg_price
          ORDER BY p.price DESC, p.name;
        after: |
          9 products, from the Lumio Phone S5 Plus ($899.99, in a category that averages $245.62) down to the Atlas of Hidden Cities.

          The CTE calculated each category's average **once**. And because `a.avg_price` is a normal column now, we could easily put it in the `SELECT` list, which the old correlated version could not do.

      - type: exercise
        id: m09-l03-e1
        title: The most loyal customers
        prompt: |
          Here is a nested query that finds the customers with the **highest number of orders**. The counting query is written twice:

          ```sql
          SELECT customer_id, order_count
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS t
          WHERE order_count = (
              SELECT MAX(order_count)
              FROM (
                  SELECT customer_id, COUNT(*) AS order_count
                  FROM orders
                  GROUP BY customer_id
              ) AS u
          );
          ```

          Refactor it: write the counting query **once** as a CTE named `per_customer`, and use it twice. Return `customer_id` and `order_count` for every customer with the top count.
        starter: |
          WITH per_customer AS (
              -- the counting query, written once
          )
          SELECT customer_id, order_count
          FROM per_customer
          WHERE order_count = (
              -- what goes here?
          );
        solution: |
          WITH per_customer AS (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          )
          SELECT customer_id, order_count
          FROM per_customer
          WHERE order_count = (SELECT MAX(order_count) FROM per_customer);
        hints:
          - Cut one copy of the counting query and paste it between the parentheses of the CTE.
          - The bracket after `=` becomes a short scalar subquery that reads `FROM per_customer`.
          - "WHERE order_count = (SELECT MAX(___) FROM per_customer);"
        explanation: |
          Five customers are tied at the top with 23 orders each: 6, 14, 39, 44 and 64. That is why we compare with `= MAX(...)` instead of using `LIMIT 1`, which would pick only one of them.

          The refactored query is half as long, and the counting logic exists in exactly one place.
        difficulty: 1

      - type: predict
        id: m09-l03-p1
        question: |
          Careful: the CTE below has the same name as a real table. How many rows does the last line count?
        sql: |
          WITH orders AS (
              SELECT *
              FROM orders
              WHERE status = 'cancelled'
          )
          SELECT COUNT(*)
          FROM orders;
        options:
          - "1 row, with the value 900"
          - "1 row, with the value 127"
          - "1 row, with the value 0"
          - "An error: the name orders is already taken"
        answer: 1
        explanation: |
          Inside this statement the CTE **hides** the real table of the same name, so `FROM orders` in the main query means "the 127 cancelled orders". The inner `FROM orders` (inside the parentheses) still reads the real table, because a normal CTE cannot see itself.

          > [!MISTAKE]
          > Never give a CTE the name of a real table. It works, but it is a trap for the next reader (and for you). Pick a name that describes the content, like `cancelled_orders`.

      - type: exercise
        id: m09-l03-e2
        title: Disappointing reviews
        prompt: |
          Sam also left this correlated query. It finds reviews whose rating is **at least 2 stars below the average rating of the same product**:

          ```sql
          SELECT r.review_id, r.product_id, r.rating
          FROM reviews AS r
          WHERE r.rating <= (
              SELECT AVG(r2.rating)
              FROM reviews AS r2
              WHERE r2.product_id = r.product_id
          ) - 2;
          ```

          Refactor it with a CTE `product_avg` (average rating per product) joined to `reviews`. Show `review_id`, `product_id`, `rating` and `avg_rating` (the product's average, rounded to 2 decimals).
        starter: |
          WITH product_avg AS (
              SELECT product_id, AVG(rating) AS avg_rating
              FROM reviews
              GROUP BY product_id
          )
          SELECT
          FROM reviews AS r
        solution: |
          WITH product_avg AS (
              SELECT product_id, AVG(rating) AS avg_rating
              FROM reviews
              GROUP BY product_id
          )
          SELECT
              r.review_id,
              r.product_id,
              r.rating,
              ROUND(a.avg_rating, 2) AS avg_rating
          FROM reviews AS r
          JOIN product_avg AS a ON a.product_id = r.product_id
          WHERE r.rating <= a.avg_rating - 2;
        hints:
          - The CTE is ready for you. Join it to `reviews` on the product.
          - Join on `product_id`, then keep the rows where the rating is at least 2 below the average, using the CTE's column.
          - "JOIN product_avg AS a ON a.product_id = r.product_id WHERE r.rating <= a.avg_rating - ___;"
        explanation: |
          Seven reviews qualify. For example, review 194 gave product 59 just 1 star, while that product averages 3.95 stars.

          The CTE computes one average per product, and the join hands that number to every review of the product, which is the same thing the correlated subquery did row by row.
        difficulty: 2

      - type: read
        title: "MATERIALIZED and NOT MATERIALIZED"
        md: |
          One more word you will meet: **materialized**. It describes *how* PostgreSQL runs a CTE. The answer never changes, only the speed might.

          - **Materialized** means: calculate the CTE once, keep the rows in memory, and read them from there.
          - **Not materialized** (also called *inlined*) means: paste the CTE's query into the main query, as if you had written a plain subquery.

          Since PostgreSQL 12, PostgreSQL decides for you. A simple CTE that is used **once** is inlined. A CTE used **more than once** is materialized, so the work is done only once. (Before version 12, every CTE was materialized.)

          You can override the choice:

          ```sql
          WITH name AS MATERIALIZED (...)      -- calculate once
          WITH name AS NOT MATERIALIZED (...)  -- merge into the main query
          ```

          > [!NOTE]
          > Most of the time you should not touch this. Write a clear query first, and only add `MATERIALIZED` or `NOT MATERIALIZED` if you have measured a slow query and know why.

      - type: example
        title: "Peek inside: a CTE used once (preview of EXPLAIN)"
        md: |
          `EXPLAIN` shows the plan PostgreSQL will follow, without running the query. You learn to read it fully in a later module. For now, just look for the words **CTE Scan**.
        sql: |
          EXPLAIN
          WITH delivered AS (
              SELECT order_id, customer_id
              FROM orders
              WHERE status = 'delivered'
          )
          SELECT COUNT(*)
          FROM delivered;
        after: |
          The plan reads `orders` directly, and there is **no CTE Scan**. PostgreSQL inlined the CTE: it treated it like a plain subquery, because the name is used only once.

      - type: example
        title: "Peek inside: forcing MATERIALIZED"
        md: Same query, with one extra word after `AS`.
        sql: |
          EXPLAIN
          WITH delivered AS MATERIALIZED (
              SELECT order_id, customer_id
              FROM orders
              WHERE status = 'delivered'
          )
          SELECT COUNT(*)
          FROM delivered;
        after: |
          Now the plan has a line `CTE delivered` (the CTE is calculated) and a `CTE Scan on delivered` (the main query reads the stored rows). Same result as before, a slightly different route.

          If you wrote `NOT MATERIALIZED` for a CTE that is used twice, PostgreSQL would paste the query in at both places instead of storing it.

      - type: fill
        id: m09-l03-f1
        prompt: |
          Complete both queries. The first CTE must be calculated **once and stored**. The second must be **merged into the main query**.
        template: |
          WITH a AS ___ (SELECT 1 AS n)
          SELECT * FROM a;

          WITH b AS ___ (SELECT 2 AS n)
          SELECT * FROM b;
        answers:
          - ["MATERIALIZED"]
          - ["NOT MATERIALIZED"]
        explanation: |
          `AS MATERIALIZED` forces PostgreSQL to compute the CTE once and store it. `AS NOT MATERIALIZED` asks it to inline the CTE. Both queries return the same kind of result, because these keywords change only the *how*, never the *what*.

      - type: exercise
        id: m09-l03-e3
        title: Fix the lost filter
        prompt: |
          A teammate refactored Sam's monster, but the numbers look too big. The original counted **delivered orders only**, and this version counts every order, including cancelled and returned ones. The filter got lost on the way.

          Fix the CTE so that only units from **delivered** orders are counted. It must return the same 18 rows as Sam's original (`name`, `units`, biggest first, ties by `name`).
        starter: |
          WITH units_sold AS (
              SELECT i.product_id, SUM(i.quantity) AS units
              FROM order_items AS i
              GROUP BY i.product_id
          )
          SELECT p.name, u.units
          FROM units_sold AS u
          JOIN products AS p ON p.product_id = u.product_id
          WHERE u.units > (SELECT AVG(units) FROM units_sold)
          ORDER BY u.units DESC, p.name;
        solution: |
          WITH units_sold AS (
              SELECT i.product_id, SUM(i.quantity) AS units
              FROM order_items AS i
              JOIN orders AS o ON o.order_id = i.order_id
              WHERE o.status = 'delivered'
              GROUP BY i.product_id
          )
          SELECT p.name, u.units
          FROM units_sold AS u
          JOIN products AS p ON p.product_id = u.product_id
          WHERE u.units > (SELECT AVG(units) FROM units_sold)
          ORDER BY u.units DESC, p.name;
        ordered: true
        hints:
          - "`order_items` has no status column. Which table knows whether an order was delivered?"
          - Inside the CTE, JOIN `orders` on order_id and add a WHERE on the status.
          - "FROM order_items AS i JOIN orders AS o ON ___ WHERE o.status = ___ GROUP BY i.product_id"
        explanation: |
          With the filter restored you get the original 18 products again. This is the most common refactoring accident: when you move a subquery, **take its WHERE clause and its JOINs with it**.

          That is why the last move of the recipe says *compare*.
        difficulty: 2

      - type: exercise
        id: m09-l03-e4
        title: Average order value by status
        prompt: |
          Another nested query from Sam's folder:

          ```sql
          SELECT status, ROUND(AVG(total), 2) AS avg_total
          FROM (
              SELECT o.status, x.total
              FROM orders AS o
              JOIN (
                  SELECT order_id,
                         SUM(quantity * unit_price * (1 - discount)) AS total
                  FROM order_items
                  GROUP BY order_id
              ) AS x ON x.order_id = o.order_id
          ) AS y
          GROUP BY status;
          ```

          Rewrite it as a pipeline of **two CTEs**: `order_totals` (one row per order with its `total`) and `with_status` (each order's `status` and `total`). Return `status` and `avg_total`, sorted by `status`.
        solution: |
          WITH order_totals AS (
              SELECT order_id,
                     SUM(quantity * unit_price * (1 - discount)) AS total
              FROM order_items
              GROUP BY order_id
          ),
          with_status AS (
              SELECT o.status, t.total
              FROM orders AS o
              JOIN order_totals AS t ON t.order_id = o.order_id
          )
          SELECT status, ROUND(AVG(total), 2) AS avg_total
          FROM with_status
          GROUP BY status
          ORDER BY status;
        ordered: true
        hints:
          - Work from the inside out. The innermost query becomes the first CTE.
          - "The middle query (orders joined to the totals) becomes the second CTE. The main query is then just the GROUP BY on top."
          - "WITH order_totals AS (...), with_status AS (SELECT o.status, t.total FROM orders AS o JOIN order_totals AS t ON ___) SELECT status, ROUND(AVG(total), 2) AS avg_total FROM with_status GROUP BY status ORDER BY status;"
        explanation: |
          Delivered orders average $352.99, cancelled ones $351.88, and the 7 processing orders $275.61.

          The rule of thumb: **innermost subquery first**. Each layer of nesting turns into one CTE, and the layers line up in the order you would explain them to a friend.

      - type: quiz
        id: m09-l03-q2
        question: |
          One CTE is used **twice** in a query, and you did not write MATERIALIZED or NOT MATERIALIZED. What does PostgreSQL 18 do by default?
        options:
          - It calculates the CTE once and reuses the stored rows
          - It refuses to run the query
          - It calculates the CTE separately at each place it is used
          - It only allows the first use and ignores the second
        answer: 0
        explanation: |
          When a CTE is referenced more than once, PostgreSQL materializes it: the work is done once and the rows are reused. A CTE used only once is inlined into the main query.

      - type: parsons
        id: m09-l03-o1
        prompt: Arrange the lines to list the order statuses that have more orders than the average status.
        lines:
          - WITH status_counts AS (
          - "    SELECT status, COUNT(*) AS n"
          - "    FROM orders"
          - "    GROUP BY status"
          - )
          - SELECT status, n
          - FROM status_counts
          - WHERE n > (SELECT AVG(n) FROM status_counts);
        distractors:
          - WHERE n > AVG(n);
        explanation: |
          Only `delivered` (650 orders) beats the average of 180 orders per status. The CTE is used **twice**: once for the rows and once inside the scalar subquery for the average.

          The distractor fails because an aggregate such as `AVG(n)` cannot be used directly in `WHERE`.

      - type: exercise
        id: m09-l03-e5
        title: Categories above the average
        prompt: |
          Which categories earn **more delivered revenue than the average category**?

          Build a CTE `product_revenue` (revenue per product on delivered order lines: `quantity * unit_price * (1 - discount)`), then a CTE `category_revenue` (revenue per `products.category_id`). The second CTE is used **twice**: once for the rows and once to calculate the average.

          Show `name` and `revenue` (rounded to 2 decimals), biggest revenue first. Categories that sold nothing are not part of the average.
        solution: |
          WITH product_revenue AS (
              SELECT
                  i.product_id,
                  SUM(i.quantity * i.unit_price * (1 - i.discount))
                      AS revenue
              FROM order_items AS i
              JOIN orders AS o ON o.order_id = i.order_id
              WHERE o.status = 'delivered'
              GROUP BY i.product_id
          ),
          category_revenue AS (
              SELECT p.category_id, SUM(pr.revenue) AS revenue
              FROM product_revenue AS pr
              JOIN products AS p ON p.product_id = pr.product_id
              GROUP BY p.category_id
          )
          SELECT c.name, ROUND(cr.revenue, 2) AS revenue
          FROM category_revenue AS cr
          JOIN categories AS c ON c.category_id = cr.category_id
          WHERE cr.revenue > (SELECT AVG(revenue) FROM category_revenue)
          ORDER BY cr.revenue DESC;
        ordered: true
        hints:
          - This is the two-station pipeline from the previous lesson, plus an "above average" filter at the end.
          - The average comes from a scalar subquery on `category_revenue`, placed in the WHERE of the main query.
          - "... WHERE cr.revenue > (SELECT AVG(___) FROM category_revenue) ORDER BY cr.revenue DESC;"
        explanation: |
          Five categories beat the average of about $20,858: Phones, Laptops, Kitchen, Peripherals and Computers. Computers is only a hair above ($21,238.89).

          Because `category_revenue` is a CTE, the average is calculated from exactly the same rows that you display. With nested subqueries you would have to copy the whole pipeline a second time.
        difficulty: 3
    cheatsheet:
      - title: Refactor nested to named
        sql: |
          -- 1. cut the subquery out of FROM / WHERE
          -- 2. paste it on top
          WITH nickname AS (
              SELECT ...
          )
          -- 3. use the nickname where it used to be
          SELECT ... FROM nickname;
        note: Move one subquery at a time, and compare the results of the old and the new query.
      - title: Correlated subquery to CTE + JOIN
        sql: |
          WITH category_avg AS (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          )
          SELECT p.name
          FROM products AS p
          JOIN category_avg AS a ON a.category_id = p.category_id
          WHERE p.price > a.avg_price;
        note: One group-by CTE joined back replaces a subquery that runs once per row.
      - title: MATERIALIZED / NOT MATERIALIZED
        sql: |
          WITH big AS MATERIALIZED (SELECT ...)      -- compute once
          SELECT ... FROM big;

          WITH big AS NOT MATERIALIZED (SELECT ...)  -- merge into query
          SELECT ... FROM big;
        note: By default PostgreSQL inlines a CTE used once and materializes one used twice. The answer never changes.
  - id: m09-l04
    title: "Recursive CTEs: a query that repeats itself"
    summary: Use WITH RECURSIVE to count, grow numbers and build date calendars, with a safe stop rule.
    minutes: 28
    steps:
      - type: read
        title: The missing days
        md: |
          Lena from marketing asks: *"Please show me the number of orders for each day of the first two weeks of January 2024. I need **every** day in the list, even the days when nobody ordered."*

          You try `GROUP BY order_date`, but days with no orders have no rows, so they simply vanish from your result. You would need a list of *all* the dates first. There is no such table in the shop database.

          This is where the most magical tool in SQL helps: a **recursive CTE**. It is a CTE that can **refer to itself**, so it can repeat a step again and again and *create* rows out of thin air. Counting is the easiest way to see how it works.

          > [!ANALOGY]
          > Counting aloud has three parts. You start somewhere ("1"). You repeat one rule ("say the previous number plus one"). And you know when to stop ("when I reach 5"). A recursive CTE has exactly these three parts.

      - type: example
        title: Count from 1 to 5
        md: This is the smallest recursive query you can write. Press **Run** and watch the numbers appear.
        sql: |
          WITH RECURSIVE counter(n) AS (
              SELECT 1
              UNION ALL
              SELECT n + 1
              FROM counter
              WHERE n < 5
          )
          SELECT n
          FROM counter;
        after: |
          Five rows: 1, 2, 3, 4, 5. There is no table with these numbers anywhere. The query **made them up**.

          Look closely at the middle: `FROM counter` reads the very CTE that is being defined. That is what makes it recursive.

      - type: read
        title: The three parts of a recursive CTE
        md: |
          ```sql
          WITH RECURSIVE counter(n) AS (
              SELECT 1              -- 1. anchor: where to start
              UNION ALL
              SELECT n + 1          -- 2. recursive part: make
              FROM counter          --    the next row from the
              WHERE n < 5           --    previous one
          )                         -- 3. the WHERE is the stop rule
          SELECT n FROM counter;
          ```

          1. The **anchor** runs once. It gives the first row(s).
          2. The **recursive part** reads the rows from the *previous round* and builds the next ones.
          3. The **stop rule** (usually a `WHERE`) makes a round produce *no new rows*. When that happens, the loop is over.

          `UNION ALL` glues the anchor and the recursive part together. The word `RECURSIVE` after `WITH` is required, and `counter(n)` gives the columns their names.

      - type: stepper
        title: Watch the loop, round by round
        md: |
          Each stage runs the same counter with a different cap on the number of rounds (`round_no`), so you can see the result **grow one row per round**.
        stages:
          - label: "Round 0: anchor"
            md: |
              The anchor runs once and produces the first row, `n = 1`. In this stage we cap the loop at zero rounds, so nothing else is added.
            sql: |
              WITH RECURSIVE counter(n, round_no) AS (
                  SELECT 1, 0
                  UNION ALL
                  SELECT n + 1, round_no + 1
                  FROM counter
                  WHERE round_no < 0
              )
              SELECT * FROM counter;
          - label: "Round 1"
            md: |
              The recursive part reads the last row (`n = 1`) and builds `n = 2`. Round 1 has produced one new row.
            sql: |
              WITH RECURSIVE counter(n, round_no) AS (
                  SELECT 1, 0
                  UNION ALL
                  SELECT n + 1, round_no + 1
                  FROM counter
                  WHERE round_no < 1
              )
              SELECT * FROM counter;
          - label: "Round 2"
            md: |
              Now it reads only the newest row (`n = 2`) and builds `n = 3`. Each round starts from the rows the previous round made.
            sql: |
              WITH RECURSIVE counter(n, round_no) AS (
                  SELECT 1, 0
                  UNION ALL
                  SELECT n + 1, round_no + 1
                  FROM counter
                  WHERE round_no < 2
              )
              SELECT * FROM counter;
          - label: "Round 3"
            md: One more round, one more row. We are at `n = 4`.
            sql: |
              WITH RECURSIVE counter(n, round_no) AS (
                  SELECT 1, 0
                  UNION ALL
                  SELECT n + 1, round_no + 1
                  FROM counter
                  WHERE round_no < 3
              )
              SELECT * FROM counter;
          - label: "Round 4: stop"
            md: |
              Round 4 builds `n = 5`. In round 5 the recursive part looks at `n = 5`, the rule `n < 5` is false, **no row is produced**, and the loop ends. This is the real query with the real stop rule.
            sql: |
              WITH RECURSIVE counter(n, round_no) AS (
                  SELECT 1, 0
                  UNION ALL
                  SELECT n + 1, round_no + 1
                  FROM counter
                  WHERE n < 5
              )
              SELECT * FROM counter;

      - type: quiz
        id: m09-l04-q1
        question: |
          What makes a recursive CTE stop repeating?
        options:
          - PostgreSQL stops after exactly 100 rounds
          - A round in which the recursive part produces no new rows
          - The anchor part runs out of rows
          - It never stops on its own; only a LIMIT can stop it
        answer: 1
        explanation: |
          The loop continues as long as each round creates at least one row. Your `WHERE` stop rule is what makes a round come back empty. There is no automatic limit of 100 rounds, which is why *you* must always write a stop rule.

      - type: example
        title: Growing numbers, step by step
        md: |
          The recursive part can calculate anything. Suppose you save $1,000 and earn 5% interest per year. This table shows the balance for 10 years (year 0 is today).
        sql: |
          WITH RECURSIVE growth(year, balance) AS (
              SELECT 0, 1000.00
              UNION ALL
              SELECT year + 1, ROUND(balance * 1.05, 2)
              FROM growth
              WHERE year < 10
          )
          SELECT year, balance
          FROM growth;
        after: |
          11 rows, from $1,000.00 in year 0 to **$1,628.91** in year 10.

          Notice that the recursive part updates **two** columns at once: the year goes up by one, and the balance grows by 5%. The stop rule watches the `year` column.

      - type: exercise
        id: m09-l04-e1
        title: Count to ten
        prompt: |
          Write a recursive CTE called `counter` that makes the numbers **1 to 10**, and select them. Return one column called `n`.
        starter: |
          WITH RECURSIVE counter(n) AS (
              SELECT 1
              UNION ALL
              -- the recursive part
          )
          SELECT n
          FROM counter;
        solution: |
          WITH RECURSIVE counter(n) AS (
              SELECT 1
              UNION ALL
              SELECT n + 1
              FROM counter
              WHERE n < 10
          )
          SELECT n
          FROM counter;
        hints:
          - It is almost the same as the example. Only the end point changes.
          - "The recursive part is `SELECT n + 1 FROM counter WHERE ...`. Which number should the stop rule mention?"
          - "SELECT n + 1 FROM counter WHERE n < ___"
        explanation: |
          Ten rows. The rule `n < 10` lets the loop create row 10 (from 9) and then stops, because 10 is not less than 10.

          Pitfall: if you wrote `n <= 10` you would get 11 rows. The stop rule decides about the *next* row, so think "should I create another row from this one?".
        difficulty: 1

      - type: read
        title: Two classic mistakes
        md: |
          > [!MISTAKE]
          > **Forgetting the stop rule.** Without a `WHERE`, every round creates another row and the loop never ends. The shop database would keep counting until it is stopped (this app cancels runaway queries after about 20 seconds, but on a real server such a query can eat memory and disk until someone cancels it). **Always write a stop rule first.**

          > [!MISTAKE]
          > **Forgetting the word RECURSIVE.** Then PostgreSQL does not allow the CTE to refer to itself. Try it on the next step.

      - type: example
        title: "Forgot RECURSIVE (expected error)"
        md: This is the counter again, but the word `RECURSIVE` is missing. Run it and read the hint.
        expectError: true
        sql: |
          WITH counter(n) AS (
              SELECT 1
              UNION ALL
              SELECT n + 1
              FROM counter
              WHERE n < 5
          )
          SELECT n
          FROM counter;
        after: |
          The error says `relation "counter" does not exist`, and the hint tells you the cure: **use WITH RECURSIVE**. Without that word, a CTE cannot see its own name.

          The fix is one word: `WITH RECURSIVE counter(n) AS ( ... )`.

      - type: predict
        id: m09-l04-p1
        question: |
          Which number does this query return?
        sql: |
          WITH RECURSIVE c(n) AS (
              SELECT 1
              UNION ALL
              SELECT n + 2
              FROM c
              WHERE n < 10
          )
          SELECT COUNT(*)
          FROM c;
        options: ["5", "6", "10", "It never stops"]
        answer: 1
        explanation: |
          The rows are 1, 3, 5, 7, 9 and **11**. When n is 9, the rule `n < 10` is still true, so the loop builds 11. Then 11 is not less than 10, and the loop stops.

          So the *last row can go past the limit*. The rule is checked on the row you already have, before the next one is made.

      - type: example
        title: A safety net while you experiment
        md: |
          Here is a counter with **no stop rule at all**. It would run forever, except that the main query asks for only `LIMIT 5` rows. Press **Run**.
        sql: |
          WITH RECURSIVE runaway(n) AS (
              SELECT 1
              UNION ALL
              SELECT n + 1
              FROM runaway
          )
          SELECT n
          FROM runaway
          LIMIT 5;
        after: |
          PostgreSQL produced rows only until the main query had its 5. A `LIMIT` is a handy **seat belt** when you are testing a new recursive query.

          But it is not a real stop rule. It does not work if the main query sorts or joins the rows first, because then PostgreSQL needs all of them. Always add a proper stop rule inside the CTE.

      - type: example
        title: A calendar of dates
        md: |
          Dates work too: in PostgreSQL, `date + 1` is the next day. This builds the first week of December 2024, with the weekday name.
        sql: |
          WITH RECURSIVE week(day) AS (
              SELECT DATE '2024-12-01'
              UNION ALL
              SELECT day + 1
              FROM week
              WHERE day < DATE '2024-12-07'
          )
          SELECT day, TO_CHAR(day, 'Dy') AS weekday
          FROM week;
        after: |
          Seven rows, Sunday 1 December to Saturday 7 December.

          We wrote `DATE '2024-12-01'` on purpose. A bare text like `'2024-12-01'` would be treated as text, and `text + 1` is an error. State the type of the anchor clearly.

      - type: example
        title: Fill the gaps in a report
        md: |
          Back to Lena's question. We build a calendar for 1 to 14 January 2024 and `LEFT JOIN` the orders to it, so empty days stay in the list.
        sql: |
          WITH RECURSIVE calendar(day) AS (
              SELECT DATE '2024-01-01'
              UNION ALL
              SELECT day + 1
              FROM calendar
              WHERE day < DATE '2024-01-14'
          )
          SELECT
              c.day,
              TO_CHAR(c.day, 'Dy') AS weekday,
              COUNT(o.order_id) AS orders
          FROM calendar AS c
          LEFT JOIN orders AS o ON o.order_date = c.day
          GROUP BY c.day
          ORDER BY c.day;
        after: |
          All 14 days appear. Five of them (4, 5, 9, 10 and 14 January) have **0 orders**. A plain `GROUP BY order_date` on the orders table would have shown only the 9 days with orders.

          Pattern to remember: *calendar first, then LEFT JOIN the data*. Use `COUNT(o.order_id)`, not `COUNT(*)`, so that empty days count as 0 instead of 1.

      - type: exercise
        id: m09-l04-e2
        title: Countdown
        prompt: |
          Make a countdown from **10 down to 1** with a recursive CTE called `countdown`. Return one column `n`, with the rows in order from 10 down to 1.
        starter: |
          WITH RECURSIVE countdown(n) AS (
              SELECT 10
              UNION ALL
              SELECT
              FROM countdown
              WHERE
          )
          SELECT n
          FROM countdown
          ORDER BY n DESC;
        solution: |
          WITH RECURSIVE countdown(n) AS (
              SELECT 10
              UNION ALL
              SELECT n - 1
              FROM countdown
              WHERE n > 1
          )
          SELECT n
          FROM countdown
          ORDER BY n DESC;
        ordered: true
        hints:
          - The rule goes the other way now. Each row is one less than the row before.
          - "Use `n - 1` in the recursive part, and a stop rule that keeps going while n is still bigger than 1."
          - "SELECT n - 1 FROM countdown WHERE n > ___"
        explanation: |
          Ten rows, from 10 to 1. With `n > 1` the loop builds 1 (from 2) and stops, because 1 is not greater than 1.

          A countdown is the mirror image of the counter: change `+` to `-`, and `<` to `>`.
        difficulty: 1

      - type: exercise
        id: m09-l04-e3
        title: Doubling
        prompt: |
          A coin doubles in value every day. Make a table with the columns `day` (0, 1, 2 ...) and `value` (1, 2, 4, 8 ...), starting with day 0 and value 1, and **stop at the first row where the value reaches 1024 or more**.

          That is 11 rows (day 0 to day 10). Name the CTE `doubling`.
        starter: |
          WITH RECURSIVE doubling(day, value) AS (
              SELECT 0, 1
              UNION ALL
              -- double the value, add one day
          )
          SELECT day, value
          FROM doubling;
        solution: |
          WITH RECURSIVE doubling(day, value) AS (
              SELECT 0, 1
              UNION ALL
              SELECT day + 1, value * 2
              FROM doubling
              WHERE value < 1024
          )
          SELECT day, value
          FROM doubling;
        hints:
          - Two columns change in every round. Write both in the SELECT of the recursive part.
          - "The recursive part is `SELECT day + 1, value * 2 FROM doubling WHERE ...`. Keep going while the value is still below 1024."
          - "SELECT day + 1, value * 2 FROM doubling WHERE value < ___"
        explanation: |
          After 10 days the coin is worth 1024. The row with 1024 is created from 512 (which is below 1024), and then the loop stops.

          Growth like this is why recursion needs a stop rule: doubling passes a billion after only 30 rounds.
        difficulty: 2

      - type: fill
        id: m09-l04-f1
        prompt: Fill in the blanks to count down from 5 to 1.
        template: |
          WITH ___ countdown(n) AS (
              SELECT 5
              ___ ALL
              SELECT n - 1
              FROM countdown
              WHERE n > ___
          )
          SELECT n
          FROM countdown;
        answers:
          - ["RECURSIVE"]
          - ["UNION"]
          - ["1"]
        explanation: |
          `WITH RECURSIVE` allows the CTE to refer to itself, `UNION ALL` joins the anchor to the recursive part, and `n > 1` is the stop rule: it lets the loop build 1 from 2 and then stops.

      - type: exercise
        id: m09-l04-e4
        title: Fix the bug, the price rise
        prompt: |
          A subscription costs $20.00 today (year 0), and the price rises by 10% each year, rounded to 2 decimals. This query should show years 0 to 5, but it crashes with a type error.

          Fix it so that it returns 6 rows with the columns `year` and `price`.
        starter: |
          WITH RECURSIVE prices(year, price) AS (
              SELECT 0, 20
              UNION ALL
              SELECT year + 1, ROUND(price * 1.10, 2)
              FROM prices
              WHERE year < 5
          )
          SELECT year, price
          FROM prices;
        solution: |
          WITH RECURSIVE prices(year, price) AS (
              SELECT 0, 20.00
              UNION ALL
              SELECT year + 1, ROUND(price * 1.10, 2)
              FROM prices
              WHERE year < 5
          )
          SELECT year, price
          FROM prices;
        hints:
          - 'The error says the column "has type integer in non-recursive term but type numeric overall".'
          - The anchor's `20` is a whole number, but `ROUND(price * 1.10, 2)` is a decimal number. Both parts of a recursive CTE must produce the same type in each column.
          - "Write the anchor value as a decimal: SELECT 0, 20.00 (or 20::numeric)."
        explanation: |
          The price goes 20.00, 22.00, 24.20, 26.62, 29.28, 32.21.

          In a recursive CTE the **type of each column is fixed by the anchor**. If the recursive part produces a different type, PostgreSQL complains. The cure is to write the anchor in the final type: `20.00`, `DATE '...'`, or an explicit cast such as `20::numeric`.
        difficulty: 2

      - type: exercise
        id: m09-l04-e5
        title: Every Monday of the first quarter
        prompt: |
          List **every Monday from 2024-01-01 up to 2024-03-31** (inclusive). 1 January 2024 is a Monday, so start there and add 7 days each round.

          Use a CTE `mondays` with one column `day`. The last Monday must not be after 31 March. Return the column `day`, sorted by `day`.
        starter: |
          WITH RECURSIVE mondays(day) AS (
              SELECT DATE '2024-01-01'
              UNION ALL
              SELECT day + 7
              FROM mondays
              WHERE
          )
          SELECT day
          FROM mondays
          ORDER BY day;
        solution: |
          WITH RECURSIVE mondays(day) AS (
              SELECT DATE '2024-01-01'
              UNION ALL
              SELECT day + 7
              FROM mondays
              WHERE day + 7 <= DATE '2024-03-31'
          )
          SELECT day
          FROM mondays
          ORDER BY day;
        ordered: true
        hints:
          - The stop rule decides whether the *next* Monday is still inside the quarter.
          - "If you write `WHERE day < '2024-03-31'`, the loop builds one Monday too many (2024-04-01). Check the next date instead: `day + 7`."
          - "WHERE day + 7 <= DATE '2024-03-31'"
        explanation: |
          13 Mondays, from 1 January to 25 March. The next Monday (1 April) would be past the end of the quarter, so the rule `day + 7 <= 31 March` stops the loop before it is created.

          This is the boundary lesson from the "n + 2" predict: when the step is bigger than 1, test the *next* value, not the current one.
        difficulty: 2

      - type: parsons
        id: m09-l04-o1
        prompt: Arrange the lines to list the powers of ten from 1 up to 100000.
        lines:
          - WITH RECURSIVE tens(n) AS (
          - "    SELECT 1"
          - "    UNION ALL"
          - "    SELECT n * 10"
          - "    FROM tens"
          - "    WHERE n < 100000"
          - )
          - SELECT n
          - FROM tens;
        distractors:
          - WITH tens(n) AS (
        explanation: |
          Six rows: 1, 10, 100, 1000, 10000 and 100000. The anchor comes first, then `UNION ALL`, then the recursive part with its stop rule.

          The distractor is missing the word `RECURSIVE`, so PostgreSQL would reject the self-reference.

      - type: quiz
        id: m09-l04-q2
        question: |
          One of these recursive CTEs would run **forever** (do not run it!). Which one?

          ```
          A: start 1, next = n + 1, keep going WHERE n < 100
          B: start 1, next = n + 2, keep going WHERE n <> 10
          C: start 1, next = n * 2, keep going WHERE n < 1000
          D: start 5, next = n - 1, keep going WHERE n > 0
          ```
        options:
          - A
          - B
          - C
          - D
        answer: 1
        explanation: |
          B counts 1, 3, 5, 7, 9, 11 ... and jumps *over* 10, so the rule `n <> 10` is never false. A, C and D all end, because their rules (`<`, `<`, `>`) become false sooner or later.

          Safer habit: use `<`, `<=` or `>` for stop rules, not `<>`, so a number that skips past the limit still stops.

      - type: exercise
        id: m09-l04-e6
        title: Orders per day, with zero days
        prompt: |
          Marketing wants the last 12 days of 2024 in one report, **including days without orders**.

          Build a calendar CTE `calendar(day)` from `2024-12-20` to `2024-12-31`, then `LEFT JOIN` the `orders` (match `order_date`). Return `day` and `orders` (the number of orders), sorted by `day`.
        solution: |
          WITH RECURSIVE calendar(day) AS (
              SELECT DATE '2024-12-20'
              UNION ALL
              SELECT day + 1
              FROM calendar
              WHERE day < DATE '2024-12-31'
          )
          SELECT c.day, COUNT(o.order_id) AS orders
          FROM calendar AS c
          LEFT JOIN orders AS o ON o.order_date = c.day
          GROUP BY c.day
          ORDER BY c.day;
        ordered: true
        hints:
          - Two parts, a recursive calendar and a LEFT JOIN to the orders, like the January example.
          - Count `o.order_id` (not `*`) so that days without a matching order show 0.
          - "... SELECT c.day, COUNT(o.order_id) AS orders FROM calendar AS c LEFT JOIN orders AS o ON ___ GROUP BY c.day ORDER BY c.day;"
        explanation: |
          12 rows. The busiest day is 20 December with 6 orders, and 26 and 28 December had none (they would be missing without the calendar).

          Because `COUNT(o.order_id)` ignores NULLs, a day with no match counts 0. `COUNT(*)` would wrongly say 1.
        difficulty: 3

      - type: exercise
        id: m09-l04-e7
        title: Savings goal
        prompt: |
          You have $1,000 and want to reach **$3,000**. Every month the balance earns 1% interest, then you add $200. Calculate each new balance as `ROUND(balance * 1.01 + 200, 2)`.

          Build a CTE `savings(month, balance)` that starts with month 0 and balance `1000.00`, and **stops after the first month where the balance is 3000 or more**. Select `month` and `balance` for all rows.
        solution: |
          WITH RECURSIVE savings(month, balance) AS (
              SELECT 0, 1000.00
              UNION ALL
              SELECT month + 1, ROUND(balance * 1.01 + 200, 2)
              FROM savings
              WHERE balance < 3000
          )
          SELECT month, balance
          FROM savings;
        hints:
          - The stop rule watches the balance, not the month.
          - "Keep building new rows WHERE balance < 3000. The last row can be above 3000, because the check happens on the row before it."
          - "SELECT month + 1, ROUND(balance * 1.01 + 200, 2) FROM savings WHERE balance < ___"
        explanation: |
          It takes 10 months (11 rows including month 0). At month 9 the balance is $2,967.39, still below 3,000, so the loop makes month 10 with **$3,197.06** and then stops.

          This is a real pattern: loop until a business condition is met (a goal, a limit, a threshold), without knowing in advance how many rounds it will take.
        difficulty: 3
    cheatsheet:
      - title: Recursive counter
        sql: |
          WITH RECURSIVE counter(n) AS (
              SELECT 1                 -- anchor
              UNION ALL
              SELECT n + 1             -- recursive part
              FROM counter
              WHERE n < 10             -- stop rule
          )
          SELECT n FROM counter;
        note: Needs the word RECURSIVE. A round that produces no rows ends the loop.
      - title: Date series
        sql: |
          WITH RECURSIVE days(day) AS (
              SELECT DATE '2024-01-01'
              UNION ALL
              SELECT day + 1
              FROM days
              WHERE day < DATE '2024-01-31'
          )
          SELECT day FROM days;
        note: Start with DATE '...' so the type is right. Then LEFT JOIN your data to fill gaps.
      - title: Safety rules
        sql: |
          -- 1. always write a stop rule (use <, <= or >)
          -- 2. anchor and recursive part: same column types
          -- 3. while testing, add LIMIT as a seat belt
          SELECT n FROM counter LIMIT 20;
        note: A CTE that never stops runs until it is cancelled (this app stops it after about 20 seconds).
  - id: m09-l05
    title: "Recursive hierarchies: org charts and category trees"
    summary: Walk down (or up) an org chart or a category tree of any depth, with levels and path strings.
    minutes: 30
    dataset: company
    steps:
      - type: read
        title: Who is on Layla's team?
        md: |
          Priya from HR asks: *"Please list everyone in Layla Khan's organisation. And I mean **everyone** below her, not only the people who report to her directly."*

          In the `employees` table, every person has a `manager_id` that points to the `emp_id` of their boss. That is a **hierarchy**: a tree where each person has one boss. Layla's part of the tree looks like this:

          ```
          Layla Khan (Director)
          +-- Jun Zhang (Frontend Team Lead)
          |   +-- Vikram Kumar
          |   +-- Pierre Popov
          |   +-- Noah Thompson
          |   +-- Kwame Diallo
          +-- Evelyn Cooper (Mobile Team Lead)
              +-- Sipho Adeyemi
              +-- Vikram Boateng
          ```

          A self join (module 6) can look **one** level down. How many levels are there? You cannot know in advance, and that is exactly the job for a recursive CTE.

          > [!ANALOGY]
          > Imagine asking: "Who reports to Layla?" You get two names. Then you ask the same question about each of them, and then about each of *their* answers, until you hear "nobody". That repeated question is the recursive part.

      - type: example
        title: One level only
        md: A plain query finds Layla's direct reports. Her `emp_id` is 9.
        sql: |
          SELECT emp_id, first_name, last_name, job_title
          FROM employees
          WHERE manager_id = 9;
        after: |
          Only two people: Jun Zhang and Evelyn Cooper. But they have teams of their own, and those people are missing from the answer.

      - type: read
        title: The recipe for walking down a tree
        md: |
          Some words first. The top of the tree is the **root**. People with no one below them are **leaves**. The **depth** (or **level**) says how many steps a person is from where you started.

          The recursive recipe has two parts:

          1. **Anchor**: the starting person, for example `WHERE emp_id = 9`. Depth 0.
          2. **Recursive part**: "find employees whose manager is somebody already in my list", and add 1 to the depth.

          ```sql
          SELECT e.emp_id, ..., t.depth + 1
          FROM employees AS e
          JOIN team AS t ON e.manager_id = t.emp_id
          ```

          Read the join aloud: *the employee's manager is the team member.* That sentence walks one step **down**.

          > [!TIP]
          > The loop stops by itself. When none of the newest people manage anyone, the join finds nothing, the round is empty, and the recursion ends. No extra stop rule needed (as long as your data is a proper tree).

      - type: example
        title: Layla's whole organisation
        md: The anchor is Layla (depth 0). Each round adds the next level of people.
        sql: |
          WITH RECURSIVE team(emp_id, name, job_title, depth) AS (
              SELECT emp_id,
                     first_name || ' ' || last_name,
                     job_title,
                     0
              FROM employees
              WHERE emp_id = 9
              UNION ALL
              SELECT e.emp_id,
                     e.first_name || ' ' || e.last_name,
                     e.job_title,
                     t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT emp_id, name, job_title, depth
          FROM team
          ORDER BY depth, emp_id;
        after: |
          Nine people: Layla (depth 0), her 2 team leads (depth 1), and 6 engineers (depth 2). That is what Priya asked for.

          The `depth` column counts the steps from Layla. It is a number we carry along and add 1 to in every round.

      - type: stepper
        title: The tree is discovered level by level
        md: |
          Each stage lets the loop run one more round, using a cap on the depth. Watch the team grow downwards.
        stages:
          - label: "Round 0: Layla"
            md: The anchor gives one row, Layla, at depth 0. No rounds yet.
            sql: |
              WITH RECURSIVE team(emp_id, name, depth) AS (
                  SELECT emp_id, first_name || ' ' || last_name, 0
                  FROM employees
                  WHERE emp_id = 9
                  UNION ALL
                  SELECT e.emp_id, e.first_name || ' ' || e.last_name,
                         t.depth + 1
                  FROM employees AS e
                  JOIN team AS t ON e.manager_id = t.emp_id
                  WHERE t.depth < 0
              )
              SELECT * FROM team ORDER BY depth, emp_id;
          - label: "Round 1: team leads"
            md: |
              The recursive part finds everyone whose manager is Layla: Jun Zhang and Evelyn Cooper, at depth 1.
            sql: |
              WITH RECURSIVE team(emp_id, name, depth) AS (
                  SELECT emp_id, first_name || ' ' || last_name, 0
                  FROM employees
                  WHERE emp_id = 9
                  UNION ALL
                  SELECT e.emp_id, e.first_name || ' ' || e.last_name,
                         t.depth + 1
                  FROM employees AS e
                  JOIN team AS t ON e.manager_id = t.emp_id
                  WHERE t.depth < 1
              )
              SELECT * FROM team ORDER BY depth, emp_id;
          - label: "Round 2: engineers"
            md: |
              Now it looks only at the newest rows (the two team leads) and finds their six reports at depth 2.
            sql: |
              WITH RECURSIVE team(emp_id, name, depth) AS (
                  SELECT emp_id, first_name || ' ' || last_name, 0
                  FROM employees
                  WHERE emp_id = 9
                  UNION ALL
                  SELECT e.emp_id, e.first_name || ' ' || e.last_name,
                         t.depth + 1
                  FROM employees AS e
                  JOIN team AS t ON e.manager_id = t.emp_id
                  WHERE t.depth < 2
              )
              SELECT * FROM team ORDER BY depth, emp_id;
          - label: "Round 3: nobody"
            md: |
              No engineer manages anyone, so round 3 finds no rows and the recursion ends by itself. This is the real query with no cap at all, and it returns the same nine people.
            sql: |
              WITH RECURSIVE team(emp_id, name, depth) AS (
                  SELECT emp_id, first_name || ' ' || last_name, 0
                  FROM employees
                  WHERE emp_id = 9
                  UNION ALL
                  SELECT e.emp_id, e.first_name || ' ' || e.last_name,
                         t.depth + 1
                  FROM employees AS e
                  JOIN team AS t ON e.manager_id = t.emp_id
              )
              SELECT * FROM team ORDER BY depth, emp_id;

      - type: quiz
        id: m09-l05-q1
        question: |
          Which join condition walks **down** the chart (from a manager to the people who report to them)? Here `t` is the CTE and `e` is `employees`.
        options:
          - ON e.manager_id = t.emp_id
          - ON e.emp_id = t.manager_id
          - ON e.emp_id = t.emp_id
          - ON e.manager_id = t.manager_id
        answer: 0
        explanation: |
          "The employee's manager is a team member" means `e.manager_id = t.emp_id`: it finds the **reports** of the people already found. The second option does the opposite and walks **up** to the bosses (you will use it in a minute).

      - type: exercise
        id: m09-l05-e1
        title: Oscar's organisation
        prompt: |
          Oscar Lewis (`emp_id` 11, Director of Sales, Americas) wants to know who is in his organisation.

          List Oscar himself (depth 0) and everyone below him. Show `emp_id`, `name` (first name, a space, last name) and `depth`, sorted by `depth`, then `emp_id`.
        starter: |
          WITH RECURSIVE team(emp_id, name, depth) AS (
              SELECT emp_id, first_name || ' ' || last_name, 0
              FROM employees
              WHERE emp_id = 11
              UNION ALL
              -- find the people who report to someone in team
          )
          SELECT emp_id, name, depth
          FROM team
          ORDER BY depth, emp_id;
        solution: |
          WITH RECURSIVE team(emp_id, name, depth) AS (
              SELECT emp_id, first_name || ' ' || last_name, 0
              FROM employees
              WHERE emp_id = 11
              UNION ALL
              SELECT e.emp_id,
                     e.first_name || ' ' || e.last_name,
                     t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT emp_id, name, depth
          FROM team
          ORDER BY depth, emp_id;
        ordered: true
        hints:
          - It is the same shape as Layla's query. Only the anchor person is different, and the anchor is already written for you.
          - "The recursive part joins `employees AS e` to `team AS t` on e.manager_id = t.emp_id, and adds 1 to the depth."
          - "SELECT e.emp_id, e.first_name || ' ' || e.last_name, t.depth + 1 FROM employees AS e JOIN team AS t ON e.manager_id = ___"
        explanation: |
          Eight people: Oscar, two team leads (Mei Nakamura and Arthur Jackson) and five people below them (four account executives and a business consultant).

          The recursion followed the chain on its own: Oscar, then his reports, then their reports.
        difficulty: 1

      - type: exercise
        id: m09-l05-e2
        title: The top of the chart
        prompt: |
          The CEO wants a one-page chart showing only the **first three levels** of Acme Corp: the CEO (level 1), the people reporting to the CEO (level 2) and their direct reports (level 3).

          Start at the person with no manager (`manager_id IS NULL`). Show `emp_id`, `name` (first and last name with a space) and `level`, sorted by `level`, then `emp_id`. Add a stop rule so the recursion does not go deeper than level 3.
        starter: |
          WITH RECURSIVE chart(emp_id, name, level) AS (
              SELECT emp_id, first_name || ' ' || last_name, 1
              FROM employees
              WHERE manager_id IS NULL
              UNION ALL
              SELECT
              FROM employees AS e
              JOIN chart AS c ON e.manager_id = c.emp_id
          )
          SELECT emp_id, name, level
          FROM chart
          ORDER BY level, emp_id;
        solution: |
          WITH RECURSIVE chart(emp_id, name, level) AS (
              SELECT emp_id, first_name || ' ' || last_name, 1
              FROM employees
              WHERE manager_id IS NULL
              UNION ALL
              SELECT e.emp_id,
                     e.first_name || ' ' || e.last_name,
                     c.level + 1
              FROM employees AS e
              JOIN chart AS c ON e.manager_id = c.emp_id
              WHERE c.level < 3
          )
          SELECT emp_id, name, level
          FROM chart
          ORDER BY level, emp_id;
        ordered: true
        hints:
          - You need a WHERE in the recursive part that stops the loop once you reach level 3.
          - The WHERE looks at the level of the row you already have (c.level). Keep going while it is below 3.
          - "... JOIN chart AS c ON e.manager_id = c.emp_id WHERE c.level < ___"
        explanation: |
          16 people: 1 CEO, 6 people at level 2, and 9 at level 3.

          When you want only part of a tree, a stop rule on the depth is perfect. Check the **current** level (`c.level < 3`): a row at level 3 is kept, but it does not create level 4.
        difficulty: 2

      - type: example
        title: "Path strings: who is above you?"
        md: |
          Carry a text along! The `path` column starts with a name and adds ` > ` and the next name each round. Sorting by the path puts every person right under their boss.
        sql: |
          WITH RECURSIVE team(emp_id, path, depth) AS (
              SELECT emp_id, last_name, 0
              FROM employees
              WHERE emp_id = 9
              UNION ALL
              SELECT e.emp_id,
                     t.path || ' > ' || e.last_name,
                     t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT path
          FROM team
          ORDER BY path;
        after: |
          The nine people are listed in tree order: Khan first, then Cooper with her two engineers, then Zhang with his four. Each row shows the whole chain from Layla down to that person.

          Sorting text puts "Khan" before "Khan > Cooper", so a boss always appears right before their team.

      - type: predict
        id: m09-l05-p1
        question: |
          Oops, someone forgot the `WHERE` in the anchor. The company has 55 employees. How many rows does this return?
        sql: |
          WITH RECURSIVE team(emp_id, depth) AS (
              SELECT emp_id, 1
              FROM employees
              UNION ALL
              SELECT e.emp_id, t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT COUNT(*)
          FROM team;
        options: ["55", "223", "5", "It never stops"]
        answer: 1
        explanation: |
          Every employee becomes a starting point. So each person appears once for themselves, and again for **every boss above them**. A level-5 engineer appears 5 times, a level-4 team lead 4 times, and so on. 1 + 6x2 + 9x3 + 12x4 + 27x5 = **223** rows.

          > [!MISTAKE]
          > If your tree result has duplicate people, check the anchor first. It should name exactly the person (or people) you want to start from.

      - type: exercise
        id: m09-l05-e3
        title: Org chart paths for Marketing
        prompt: |
          Isaac King (`emp_id` 5) is the VP of Marketing. Build the path of **last names** for everyone in his organisation, starting with Isaac himself (so the first path is just `King`).

          Show `emp_id` and `path` (last names joined with `' > '`), sorted by `path`.
        solution: |
          WITH RECURSIVE team(emp_id, path) AS (
              SELECT emp_id, last_name
              FROM employees
              WHERE emp_id = 5
              UNION ALL
              SELECT e.emp_id, t.path || ' > ' || e.last_name
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT emp_id, path
          FROM team
          ORDER BY path;
        ordered: true
        hints:
          - Start from the example with Layla and change the anchor to emp_id 5.
          - "The recursive part builds the path with `t.path || ' > ' || e.last_name`."
          - "SELECT e.emp_id, t.path || ' > ' || ___ FROM employees AS e JOIN team AS t ON e.manager_id = t.emp_id"
        explanation: |
          Nine rows, for example `King > Jones > Wu > Hill`. Isaac has two direct reports: Oliver Jones (who manages two leads with two people each) and Xin Pham (who has no team).

          A path is a handy way to show the whole chain in one cell, and `ORDER BY path` gives you the tree in reading order.
        difficulty: 2

      - type: example
        title: Going up instead of down
        md: |
          Swap the join and you walk **up** the chart. This lists the chain of command above Vikram Boateng (`emp_id` 36): himself, his boss, his boss's boss, and so on.
        sql: |
          WITH RECURSIVE chain(emp_id, job_title, manager_id, steps_up) AS (
              SELECT emp_id, job_title, manager_id, 0
              FROM employees
              WHERE emp_id = 36
              UNION ALL
              SELECT e.emp_id, e.job_title, e.manager_id,
                     c.steps_up + 1
              FROM employees AS e
              JOIN chain AS c ON e.emp_id = c.manager_id
          )
          SELECT steps_up, emp_id, job_title
          FROM chain
          ORDER BY steps_up;
        after: |
          Five rows: Android Engineer, Mobile Team Lead, Director of Product Engineering, VP of Engineering and Chief Executive Officer.

          The join is now `e.emp_id = c.manager_id`: "the employee is the manager of somebody in my list". The CEO's `manager_id` is NULL, so no row matches, and the loop ends at the top.

      - type: exercise
        id: m09-l05-e4
        title: Chain of command
        prompt: |
          Lily Horvat (`emp_id` 49) is an Accountant. Show her chain of command: herself and everyone above her up to the CEO.

          Return `steps_up` (0 for Lily, 1 for her boss, ...), `emp_id` and `job_title`, sorted by `steps_up`.
        solution: |
          WITH RECURSIVE chain(emp_id, job_title, manager_id, steps_up) AS (
              SELECT emp_id, job_title, manager_id, 0
              FROM employees
              WHERE emp_id = 49
              UNION ALL
              SELECT e.emp_id, e.job_title, e.manager_id,
                     c.steps_up + 1
              FROM employees AS e
              JOIN chain AS c ON e.emp_id = c.manager_id
          )
          SELECT steps_up, emp_id, job_title
          FROM chain
          ORDER BY steps_up;
        ordered: true
        hints:
          - You walk upwards, so the join is the opposite of the "team" one.
          - Carry `manager_id` in the CTE, and join `employees` on e.emp_id = c.manager_id.
          - "... FROM employees AS e JOIN chain AS c ON e.emp_id = c.___"
        explanation: |
          Five rows: Accountant, Senior Accountant, Controller, VP of Finance and the CEO.

          Going up always ends at the root: the CEO has no manager, so there is nothing more to join.
        difficulty: 2

      - type: fill
        id: m09-l05-f1
        prompt: Fill in the blanks to list Olivia's team (`emp_id` 8) and everyone below her.
        template: |
          WITH ___ team(emp_id, depth) AS (
              SELECT emp_id, 0
              FROM employees
              WHERE emp_id = 8
              UNION ALL
              SELECT e.emp_id, t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.___ = t.___
          )
          SELECT emp_id, depth
          FROM team;
        answers:
          - ["RECURSIVE"]
          - ["manager_id"]
          - ["emp_id"]
        explanation: |
          `WITH RECURSIVE` allows the self-reference. The join `e.manager_id = t.emp_id` says "the employee's manager is somebody already in the team", which walks down one level per round.

      - type: exercise
        id: m09-l05-e5
        title: Fix the bug, upside-down chart
        prompt: |
          This query should list Olivia Brooks's organisation (`emp_id` 8) and everyone **below** her, with `emp_id`, `first_name` and `depth`. But it shows her bosses instead.

          Fix the join so the query walks **down**, and sort it by `depth`, then `emp_id`.
        starter: |
          WITH RECURSIVE team(emp_id, first_name, manager_id, depth) AS (
              SELECT emp_id, first_name, manager_id, 0
              FROM employees
              WHERE emp_id = 8
              UNION ALL
              SELECT e.emp_id, e.first_name, e.manager_id, t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.emp_id = t.manager_id
          )
          SELECT emp_id, first_name, depth
          FROM team
          ORDER BY depth, emp_id;
        solution: |
          WITH RECURSIVE team(emp_id, first_name, manager_id, depth) AS (
              SELECT emp_id, first_name, manager_id, 0
              FROM employees
              WHERE emp_id = 8
              UNION ALL
              SELECT e.emp_id, e.first_name, e.manager_id, t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT emp_id, first_name, depth
          FROM team
          ORDER BY depth, emp_id;
        ordered: true
        hints:
          - Run it and look at the rows. Are those the people below Olivia, or the people above her?
          - The join condition is written for walking up. Swap which side holds `manager_id`.
          - "Use ON e.manager_id = t.emp_id"
        explanation: |
          The fixed query returns 7 rows: Olivia, her two team leads (Paola Cruz and Amina Mwangi) and four engineers.

          Remember the two sentences: **down** = "their manager is in my list" (`e.manager_id = t.emp_id`); **up** = "they are the manager of someone in my list" (`e.emp_id = t.manager_id`).
        difficulty: 2

      - type: example
        title: A category tree in the shop
        md: |
          Trees are everywhere. In the shop database, `categories` points to its parent with `parent_id` (top-level categories have `NULL`). Let's build the path of every category.
        dataset: shop
        sql: |
          WITH RECURSIVE tree(category_id, path, depth) AS (
              SELECT category_id, name, 1
              FROM categories
              WHERE parent_id IS NULL
              UNION ALL
              SELECT c.category_id,
                     t.path || ' > ' || c.name,
                     t.depth + 1
              FROM categories AS c
              JOIN tree AS t ON c.parent_id = t.category_id
          )
          SELECT category_id, path, depth
          FROM tree
          ORDER BY path;
        after: |
          All 14 categories, in tree order, with depths 1 to 3, such as `Electronics > Computers > Laptops`.

          Same recipe as the org chart: the anchor is the root(s) (`parent_id IS NULL`), and the recursive part joins on `parent_id = category_id`. Only the names of the columns changed.

      - type: exercise
        id: m09-l05-e6
        title: Products in every category
        dataset: shop
        prompt: |
          Using the path idea, show every category with the number of products that sit **directly** in it.

          Return `path` (like `Electronics > Computers`) and `products` (count of products whose `category_id` is that category, 0 if none), sorted by `path`.
        solution: |
          WITH RECURSIVE tree(category_id, path) AS (
              SELECT category_id, name
              FROM categories
              WHERE parent_id IS NULL
              UNION ALL
              SELECT c.category_id, t.path || ' > ' || c.name
              FROM categories AS c
              JOIN tree AS t ON c.parent_id = t.category_id
          )
          SELECT t.path, COUNT(p.product_id) AS products
          FROM tree AS t
          LEFT JOIN products AS p ON p.category_id = t.category_id
          GROUP BY t.path
          ORDER BY t.path;
        ordered: true
        hints:
          - Build the `tree` CTE as in the example, then join `products` to it.
          - Use a LEFT JOIN so categories without products still appear, and count `p.product_id`.
          - "... SELECT t.path, COUNT(p.product_id) AS products FROM tree AS t LEFT JOIN products AS p ON ___ GROUP BY t.path ORDER BY t.path;"
        explanation: |
          14 rows. Electronics, Home and Sports have **0** products directly in them, because products live in the sub-categories (Phones has 8, Kitchen has 8, Laptops has 5, and so on).

          That is correct, but not what a manager means by "how many products do we have in Electronics?". The next exercise rolls the numbers up.
        difficulty: 2

      - type: exercise
        id: m09-l05-e7
        title: Roll up to the departments
        dataset: shop
        prompt: |
          The category manager wants to know how many products belong to each **top-level category**, counting everything in its sub-categories too (Electronics includes Computers, Laptops, Peripherals and Phones).

          Hint: let every row of the tree remember the name of its top-level category (`root_name`). It starts as the category's own name in the anchor and is simply copied down in the recursive part.

          Return `root_name` and `products` (all products below or at that top-level category), biggest first, ties by `root_name`.
        solution: |
          WITH RECURSIVE tree(category_id, root_name) AS (
              SELECT category_id, name
              FROM categories
              WHERE parent_id IS NULL
              UNION ALL
              SELECT c.category_id, t.root_name
              FROM categories AS c
              JOIN tree AS t ON c.parent_id = t.category_id
          )
          SELECT t.root_name, COUNT(p.product_id) AS products
          FROM tree AS t
          LEFT JOIN products AS p ON p.category_id = t.category_id
          GROUP BY t.root_name
          ORDER BY products DESC, t.root_name;
        ordered: true
        hints:
          - Carry a column that never changes while you go down, the name of the root.
          - "Anchor: SELECT category_id, name ... WHERE parent_id IS NULL. Recursive part: SELECT c.category_id, t.root_name (just copy it)."
          - "Then LEFT JOIN products ON category_id, GROUP BY root_name, COUNT(p.product_id)."
        explanation: |
          Electronics 24 products, Home 13, Books 7, Sports 7, Toys 6, Beauty 3 (they add up to all 60 products).

          Carrying a value down the tree ("which root do I belong to?") is the secret behind most roll-up reports. The same trick works for the org chart: carry the VP's id down to count each VP's organisation.
        difficulty: 3

      - type: parsons
        id: m09-l05-o1
        prompt: Arrange the lines to count how many people (directly or indirectly) report to the VP of Finance (`emp_id` 6).
        lines:
          - WITH RECURSIVE team(emp_id, depth) AS (
          - "    SELECT emp_id, 0"
          - "    FROM employees"
          - "    WHERE emp_id = 6"
          - "    UNION ALL"
          - "    SELECT e.emp_id, t.depth + 1"
          - "    FROM employees AS e"
          - "    JOIN team AS t ON e.manager_id = t.emp_id"
          - )
          - SELECT COUNT(*)
          - FROM team
          - WHERE depth > 0;
        distractors:
          - "    JOIN team AS t ON e.emp_id = t.manager_id"
        explanation: |
          4 people report to the VP of Finance (the Controller, the Senior Accountant, an Accountant and a Financial Analyst). `WHERE depth > 0` leaves out the VP herself.

          The distractor walks up instead of down (and `team` has no `manager_id` column, so it would fail).

      - type: quiz
        id: m09-l05-q2
        question: |
          You want a list of everyone **above** an employee, up to the CEO. What does the anchor look like?
        options:
          - "WHERE manager_id IS NULL (start at the CEO)"
          - "WHERE emp_id = <that employee> (start at the employee)"
          - "No WHERE at all"
          - "WHERE depth = 0"
        answer: 1
        explanation: |
          Walking up starts at **the employee** and moves to the boss, then the boss's boss. Walking down from the CEO would start at `manager_id IS NULL`. The anchor is always the place where the walk begins.
    cheatsheet:
      - title: Everyone below a manager
        sql: |
          WITH RECURSIVE team(emp_id, depth) AS (
              SELECT emp_id, 0 FROM employees WHERE emp_id = 9
              UNION ALL
              SELECT e.emp_id, t.depth + 1
              FROM employees AS e
              JOIN team AS t ON e.manager_id = t.emp_id
          )
          SELECT * FROM team;
        note: Anchor = the boss. Join = "their manager is already in my list". Depth 0 is the boss.
      - title: Chain of command (walk up)
        sql: |
          WITH RECURSIVE chain(emp_id, manager_id) AS (
              SELECT emp_id, manager_id FROM employees WHERE emp_id = 36
              UNION ALL
              SELECT e.emp_id, e.manager_id
              FROM employees AS e
              JOIN chain AS c ON e.emp_id = c.manager_id
          )
          SELECT * FROM chain;
        note: The join is flipped. It ends at the root, whose manager_id is NULL.
      - title: Carry a path or a root
        sql: |
          -- anchor:    SELECT id, name AS path ...
          -- recursive: SELECT c.id, t.path || ' > ' || c.name ...
          SELECT path FROM tree ORDER BY path;
        note: A text column that grows each round shows the whole chain, and sorting it gives tree order.
  - id: m09-l06
    title: "Graphs and cycles: networks that loop back"
    summary: Search a network of stops and links, stop the search from going round in circles, and find the fastest route.
    minutes: 35
    dataset: shop
    steps:
      - type: read
        title: A network can loop back
        md: |
          Marta runs the delivery vans for a small town. Every van starts at the **Harbor** depot. Her question today is simple: *"Which depots can a van reach from Harbor, and how many minutes does each trip take?"*

          In the last lesson the org chart was a **tree**. Each person had exactly one boss, and nobody reported back up to someone below them. Roads are different. Two roads can form a circle, so a van can drive round in a loop and arrive back where it started. A network like this is called a **graph**.

          These are the words we need:

          - A **node** is a place. Here each depot is a node, which we also call a **stop**.
          - An **edge** is a link between two nodes, such as a road. Our roads are **one-way**, so each edge has a start and an end.
          - A **cycle** is a loop: you leave a place and come back to it.

          ```
          Harbor -> Mill -> Oakvale -> Hilltop -> Mill -> Oakvale -> ...
          ```

          A van on that route would go round forever. This is the danger of graphs.

          > [!ANALOGY]
          > A tree is like a family tree: you only move down the generations. A graph is like a town map with one-way streets, where you can end up back at a corner you have already passed.

      - type: example
        title: The links as a table
        md: |
          A graph is stored in a table too. Each row is one link. This example creates a small `edges` table with 7 links. Every example in this lesson builds its own copy of `edges`, so each one runs on its own.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          SELECT *
          FROM edges
          ORDER BY from_stop, to_stop;
        after: |
          Each row is one one-way link. `from_stop` is where the van starts, `to_stop` is where it arrives and `minutes` is the drive time. Look at the Hilltop row that points to Mill: that link closes the loop Mill, Oakvale, Hilltop, Mill.

      - type: read
        title: The same recipe, and a new danger
        md: |
          You already know the recipe from the org chart lesson. It has an **anchor** (the starting row) and a **recursive part** that joins the table to the rows found so far. This time the anchor is Harbor, and each round follows the links that **leave** the last stop:

          ```sql
          SELECT e.to_stop, r.hops + 1
          FROM edges AS e
          JOIN reach AS r ON e.from_stop = r.stop
          ```

          Read the join aloud: *the link starts where my last stop is.* Each round moves one link further from Harbor, and `hops` counts those links.

          In a tree the search ends by itself. In a graph it may not. Each round adds a new hop count, so a loop always has something new to offer. You must write your own **stop rule**.

      - type: example
        title: Hop by hop, with a stop rule
        md: The stop rule `WHERE r.hops < 3` lets only rows with fewer than 3 hops create new rows. The search therefore reaches at most 3 hops.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          WITH RECURSIVE reach(stop, hops) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop, r.hops + 1
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
              WHERE r.hops < 3
          )
          SELECT stop, hops
          FROM reach
          ORDER BY hops, stop;
        after: |
          Eight rows. Harbor is at 0 hops, and Mill and Riverside are 1 hop away. Look at **Mill** and **Hilltop**: each appears twice, at different hop counts. The van has gone round the loop. The stop rule ended the search at 3 hops, so the query finished.

      - type: stepper
        title: Watch the loop go round
        md: |
          Each stage raises the stop rule by one hop. Click through the stages and watch which stops join the result in each round.
        stages:
          - label: "Round 0: the start"
            md: The anchor gives one row, Harbor at 0 hops. The rule `r.hops < 0` lets no new rows in.
            sql: |
              CREATE TABLE edges (from_stop text, to_stop text, minutes int);
              INSERT INTO edges VALUES
                  ('Harbor', 'Mill', 10), ('Harbor', 'Riverside', 25),
                  ('Mill', 'Oakvale', 15), ('Oakvale', 'Hilltop', 20),
                  ('Hilltop', 'Mill', 5), ('Riverside', 'Hilltop', 10),
                  ('Hilltop', 'Station', 30);
              WITH RECURSIVE reach(stop, hops) AS (
                  SELECT 'Harbor', 0
                  UNION ALL
                  SELECT e.to_stop, r.hops + 1
                  FROM edges AS e
                  JOIN reach AS r ON e.from_stop = r.stop
                  WHERE r.hops < 0
              )
              SELECT stop, hops FROM reach ORDER BY hops, stop;
          - label: "Round 1: one link"
            md: Round 1 follows the links out of Harbor and adds **Mill** and **Riverside**. Three rows so far.
            sql: |
              CREATE TABLE edges (from_stop text, to_stop text, minutes int);
              INSERT INTO edges VALUES
                  ('Harbor', 'Mill', 10), ('Harbor', 'Riverside', 25),
                  ('Mill', 'Oakvale', 15), ('Oakvale', 'Hilltop', 20),
                  ('Hilltop', 'Mill', 5), ('Riverside', 'Hilltop', 10),
                  ('Hilltop', 'Station', 30);
              WITH RECURSIVE reach(stop, hops) AS (
                  SELECT 'Harbor', 0
                  UNION ALL
                  SELECT e.to_stop, r.hops + 1
                  FROM edges AS e
                  JOIN reach AS r ON e.from_stop = r.stop
                  WHERE r.hops < 1
              )
              SELECT stop, hops FROM reach ORDER BY hops, stop;
          - label: "Round 2: two links"
            md: Round 2 follows the links out of Mill and Riverside. It adds **Oakvale** (from Mill) and **Hilltop** (from Riverside). Five rows so far.
            sql: |
              CREATE TABLE edges (from_stop text, to_stop text, minutes int);
              INSERT INTO edges VALUES
                  ('Harbor', 'Mill', 10), ('Harbor', 'Riverside', 25),
                  ('Mill', 'Oakvale', 15), ('Oakvale', 'Hilltop', 20),
                  ('Hilltop', 'Mill', 5), ('Riverside', 'Hilltop', 10),
                  ('Hilltop', 'Station', 30);
              WITH RECURSIVE reach(stop, hops) AS (
                  SELECT 'Harbor', 0
                  UNION ALL
                  SELECT e.to_stop, r.hops + 1
                  FROM edges AS e
                  JOIN reach AS r ON e.from_stop = r.stop
                  WHERE r.hops < 2
              )
              SELECT stop, hops FROM reach ORDER BY hops, stop;
          - label: "Round 3: back to Mill"
            md: Round 3 follows the links out of Oakvale and Hilltop. It adds **Hilltop** again, **Mill** again and **Station**. Eight rows, and Mill is back where it was.
            sql: |
              CREATE TABLE edges (from_stop text, to_stop text, minutes int);
              INSERT INTO edges VALUES
                  ('Harbor', 'Mill', 10), ('Harbor', 'Riverside', 25),
                  ('Mill', 'Oakvale', 15), ('Oakvale', 'Hilltop', 20),
                  ('Hilltop', 'Mill', 5), ('Riverside', 'Hilltop', 10),
                  ('Hilltop', 'Station', 30);
              WITH RECURSIVE reach(stop, hops) AS (
                  SELECT 'Harbor', 0
                  UNION ALL
                  SELECT e.to_stop, r.hops + 1
                  FROM edges AS e
                  JOIN reach AS r ON e.from_stop = r.stop
                  WHERE r.hops < 3
              )
              SELECT stop, hops FROM reach ORDER BY hops, stop;

      - type: read
        title: What happens with no stop rule?
        md: |
          Remove the stop rule and the search never finishes. This is the query that would go round the loop forever. **Do not press Run** on it.

          ```sql
          WITH RECURSIVE reach(stop, hops) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop, r.hops + 1
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
          )
          SELECT stop, hops
          FROM reach
          ORDER BY hops, stop;
          ```

          > [!MISTAKE]
          > Every round creates new rows, because `hops` keeps growing, so the search never runs out of work. The app cancels queries that run for about 20 seconds, but a query like this can freeze the page first. Always write the stop rule before you press Run.

      - type: read
        title: Keep a list of the stops visited
        md: |
          There is a second way to stop a loop. Instead of counting hops, keep a **path**: the list of stops the van has already visited on this trip. PostgreSQL can store a list in one column, called an **array**. Four small pieces make the trick work:

          - `ARRAY['Harbor']` makes a list with one stop in it.
          - `r.path || e.to_stop` adds a new stop to the end of the list.
          - `e.to_stop = ANY(r.path)` asks: *is the new stop already in the list?*
          - `NOT (...)` turns the answer around, so only **new** stops are allowed.

          > [!ANALOGY]
          > It works like a guest list at the door. Before a new stop joins the trip, check the list. If it is already there, skip it.

      - type: example
        title: Only simple routes
        md: |
          A **simple route** visits each stop at most once. This query finds every simple route from Harbor and how many minutes it takes. The guard `WHERE NOT (e.to_stop = ANY(r.path))` makes a loop impossible, so the query always finishes.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          )
          SELECT stop,
                 array_to_string(path, ' > ') AS route,
                 minutes
          FROM routes
          ORDER BY minutes, route;
        after: |
          Ten rows, one for each simple route. The first row is the trivial route that stays at Harbor. Look at `Harbor > Riverside > Hilltop > Mill > Oakvale` (55 minutes). It is allowed, because Mill and Oakvale are not on the route yet. The step from Oakvale back to Hilltop is blocked, because Hilltop is already on that route.

      - type: quiz
        id: m09-l06-q1
        question: |
          In the guard `WHERE NOT (e.to_stop = ANY(r.path))`, what does `e.to_stop = ANY(r.path)` check?
        options:
          - Whether the new stop is already in the route so far
          - Whether the link is one-way
          - Whether this route is the fastest one
          - Whether the route has exactly three stops
        answer: 0
        explanation: |
          `= ANY(list)` is TRUE when the value equals at least one item in the list. With `NOT` in front, any stop that is already on the route is blocked. That is what stops the loop.

      - type: exercise
        id: m09-l06-e1
        title: Hilltop's direct links
        prompt: |
          A table called `edges` is already loaded for you. It has the same seven links as the first example, with the columns `from_stop`, `to_stop` and `minutes`.

          Show the `to_stop` and `minutes` of every link that **starts at Hilltop**. Sort the result by `to_stop`.
        starter: |
          SELECT
          FROM edges
          WHERE from_stop = 'Hilltop';
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          SELECT to_stop, minutes
          FROM edges
          WHERE from_stop = 'Hilltop'
          ORDER BY to_stop;
        ordered: true
        columnNames: true
        hints:
          - Start from `edges` and keep only the rows where `from_stop` is `'Hilltop'`.
          - Name the two columns after `SELECT`, and sort by `to_stop`.
          - "SELECT ___, ___ FROM edges WHERE from_stop = 'Hilltop' ORDER BY ___;"
        explanation: |
          Hilltop has two outgoing links: Mill (5 minutes) and Station (30 minutes). A link only works in the direction it points, so the links that arrive at Hilltop are not shown.
        difficulty: 1

      - type: exercise
        id: m09-l06-e2
        title: Two hops is enough
        prompt: |
          Search from Harbor with a hop counter, as in the example. This time stop the search **after 2 hops**.

          Show each `stop` and its `hops`. Sort by `hops`, then by `stop`. Use the column names `stop` and `hops`.
        starter: |
          WITH RECURSIVE reach(stop, hops) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop, r.hops + 1
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
              WHERE r.hops < 0
          )
          SELECT stop, hops
          FROM reach
          ORDER BY hops, stop;
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          WITH RECURSIVE reach(stop, hops) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop, r.hops + 1
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
              WHERE r.hops < 2
          )
          SELECT stop, hops
          FROM reach
          ORDER BY hops, stop;
        ordered: true
        columnNames: true
        hints:
          - The starter has the right shape, but its stop rule is far too strict.
          - Only rows with fewer than 2 hops may create new rows. Change the number in the stop rule.
          - "WHERE r.hops < ___"
        explanation: |
          Five stops are reached within 2 hops: Harbor (0), Mill and Riverside (1), then Oakvale and Hilltop (2). Hilltop is reached at 2 hops from Riverside, and it only appears once because its second visit is at 3 hops.
        difficulty: 2

      - type: predict
        id: m09-l06-p1
        question: |
          How many rows does this query return?
        sql: |
          WITH RECURSIVE edges(from_stop, to_stop, minutes) AS (
              VALUES
                  ('Harbor', 'Mill', 10),
                  ('Harbor', 'Riverside', 25),
                  ('Mill', 'Oakvale', 15),
                  ('Oakvale', 'Hilltop', 20),
                  ('Hilltop', 'Mill', 5),
                  ('Riverside', 'Hilltop', 10),
                  ('Hilltop', 'Station', 30)
          ),
          reach(stop, hops) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop, r.hops + 1
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
              WHERE r.hops < 1
          )
          SELECT stop, hops
          FROM reach;
        options: ["2", "3", "5", "It never ends"]
        answer: 1
        explanation: |
          Harbor is found first. In the next round only Harbor has fewer than 1 hop, so Mill and Riverside are added. Now no row has fewer than 1 hop, nothing new is added, and the search stops with 3 rows.

      - type: exercise
        id: m09-l06-e3
        title: Find the bug in the route search
        prompt: |
          A colleague wrote this route search, but it fails with an error. Fix the bug.

          The goal is to show every **simple route** from Harbor, **except** the trivial route that stays at Harbor. Show three columns, named `stop`, `route` and `minutes`:

          - `route` is the list of stops joined with ` > ` (a space, a greater-than sign, a space).

          Sort by `minutes`, then by `route`.
        starter: |
          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.stop))
          )
          SELECT stop,
                 array_to_string(path, ' > ') AS route,
                 minutes
          FROM routes
          WHERE stop <> 'Harbor'
          ORDER BY minutes, route;
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          )
          SELECT stop,
                 array_to_string(path, ' > ') AS route,
                 minutes
          FROM routes
          WHERE stop <> 'Harbor'
          ORDER BY minutes, route;
        ordered: true
        columnNames: true
        hints:
          - Read the error message. It says the right side of `ANY` must be an array.
          - Which column holds the list of stops visited so far? It is not `stop`.
          - "WHERE NOT (e.to_stop = ANY(r.___))"
        explanation: |
          `ANY` needs a list on its right side. `r.stop` is a single stop name, not a list, so PostgreSQL refuses the query. `r.path` holds the list. The outer `WHERE stop <> 'Harbor'` removes the trivial route, which leaves nine routes.
        difficulty: 2

      - type: read
        title: "Let PostgreSQL watch for loops: CYCLE"
        md: |
          Since PostgreSQL 14, a recursive CTE can end with a **`CYCLE` clause**. You name the column to watch (here `stop`), a flag column to create (here `is_cycle`) and a column that PostgreSQL uses to remember the route (here `visited_path`).

          PostgreSQL then checks each route for you. When a stop comes up a second time on the same route, that row is marked `is_cycle = true`, and the search does not keep going round that loop.

          The `CYCLE` clause goes right after the closing parenthesis of the CTE and before the main `SELECT`.

          > [!TIP]
          > You do not need to read `visited_path`. The clause just needs a name for it.

      - type: example
        title: The same 10 routes, shorter query
        md: This query finds the same simple routes as the guard example, without the route text. PostgreSQL does the loop check, so we keep only the rows where `is_cycle` is false.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          WITH RECURSIVE reach(stop, minutes) AS (
              SELECT 'Harbor', 0
              UNION ALL
              SELECT e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
          )
          CYCLE stop SET is_cycle USING visited_path
          SELECT stop, minutes
          FROM reach
          WHERE NOT is_cycle
          ORDER BY minutes, stop;
        after: |
          Ten rows, the same routes as before. Behind the scenes PostgreSQL also found two loops, one back to Mill after 50 minutes and one back to Hilltop after 75 minutes, and marked them `is_cycle = true`. The `WHERE NOT is_cycle` removed them.

      - type: read
        title: UNION can stop a loop too
        md: |
          You met `UNION` in the set operations module. It removes **duplicate rows**. Inside a recursive CTE it can also stop a loop, because a row that already exists is not added again.

          The catch is that the repeated rows must be **exactly the same**. The next example keeps only the stop name, so a stop found again is an exact repeat.

      - type: example
        title: UNION stops when no new stop appears
        md: This query lists every stop that Harbor can reach, with no minutes and no hop counter. Because it uses `UNION`, a stop already in the result is dropped, and the search ends when no new stop appears.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          WITH RECURSIVE reach(stop) AS (
              SELECT 'Harbor'
              UNION
              SELECT e.to_stop
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
          )
          SELECT stop
          FROM reach
          ORDER BY stop;
        after: |
          Six stops, each listed once. Mill and Hilltop were reached more than once inside the loop, but `UNION` dropped the repeats, so the search finished.

      - type: read
        title: The hop counter breaks UNION
        md: |
          Now add a counter, such as `hops`, to the recursive CTE. Every row becomes different, because the number keeps growing. `UNION` then removes nothing, and the loop never ends.

          > [!MISTAKE]
          > A `UNION` loop is only safe when the rows repeat exactly. As soon as you carry `minutes` or `hops`, use the `path` guard or the `CYCLE` clause instead.

      - type: exercise
        id: m09-l06-e4
        title: Routes that do not loop
        prompt: |
          The `edges` table is already loaded for you. Count the routes from Harbor to each stop, **without going round any loop**. Use the `CYCLE` clause.

          Show `stop` and `route_count` (the number of loop-free routes that end at that stop). Leave out Harbor itself. Sort by `stop`.
        starter: |
          WITH RECURSIVE reach(stop) AS (
              SELECT 'Harbor'
              UNION ALL
              SELECT e.to_stop
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
          )
          CYCLE stop SET is_cycle USING visited_path
          SELECT stop, COUNT(*) AS route_count
          FROM reach
          GROUP BY stop
          ORDER BY stop;
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          WITH RECURSIVE reach(stop) AS (
              SELECT 'Harbor'
              UNION ALL
              SELECT e.to_stop
              FROM edges AS e
              JOIN reach AS r ON e.from_stop = r.stop
          )
          CYCLE stop SET is_cycle USING visited_path
          SELECT stop, COUNT(*) AS route_count
          FROM reach
          WHERE NOT is_cycle AND stop <> 'Harbor'
          GROUP BY stop
          ORDER BY stop;
        ordered: true
        columnNames: true
        hints:
          - The `CYCLE` clause goes after the CTE, as in the last example.
          - Only rows where `is_cycle` is false count as routes.
          - "SELECT stop, COUNT(*) AS route_count FROM reach WHERE NOT is_cycle AND ___ GROUP BY ___ ORDER BY ___;"
        explanation: |
          Hilltop, Mill, Oakvale and Station each have 2 loop-free routes, and Riverside has 1. Each row of the CTE is one route, so `COUNT(*)` per stop counts routes. Harbor is left out, as the prompt asked.
        difficulty: 2

      - type: fill
        id: m09-l06-f1
        prompt: |
          Fill in the two building blocks of the route search. The first blank adds a stop to the end of a list. The second blank checks whether a stop is already in a list.
        template: |
          SELECT ARRAY['Harbor'] ___ CAST('Mill' AS text) AS route,
                 'Mill' = ___(ARRAY['Harbor', 'Mill']) AS already_there;
        answers:
          - ["||"]
          - ["ANY"]
        explanation: |
          `||` joins two things, and with an array on the left it adds the new item to the end. `= ANY(list)` is TRUE when the value matches at least one item in the list. The route search uses both: `r.path || e.to_stop` and `NOT (e.to_stop = ANY(r.path))`.

      - type: read
        title: The fastest way to each stop
        md: |
          Marta's last question: *"What is the quickest way to reach each stop?"*

          The simple routes already give every trip time. For each stop we want the **smallest** `minutes` among its routes. That is `MIN(minutes)` with `GROUP BY stop`, just like the aggregation module.

          We also want the **route** that is fastest, not only its time. The trick is to find the fastest time per stop in a second CTE, and then **join back** to the routes, so only the matching rows remain.

          > [!REAL-WORLD]
          > Real route planners handle maps with millions of roads and use smarter methods than this. The core idea is the same, though: keep track of where you have been, and compare the totals.

      - type: example
        title: The fastest route to every stop
        md: The `fastest` CTE finds the lowest time for each stop. The final join keeps the route whose minutes match that lowest time.
        sql: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);

          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          ),
          fastest AS (
              SELECT stop, MIN(minutes) AS best
              FROM routes
              GROUP BY stop
          )
          SELECT r.stop,
                 array_to_string(r.path, ' > ') AS route,
                 r.minutes
          FROM routes AS r
          JOIN fastest AS f
            ON r.stop = f.stop
           AND r.minutes = f.best
          ORDER BY r.minutes, r.stop;
        after: |
          Six stops. Oakvale and Riverside are both 25 minutes away, so they are sorted by minutes and then by stop name. Station's fastest route is `Harbor > Riverside > Hilltop > Station` (65 minutes), not the 75-minute route through Mill.

      - type: parsons
        id: m09-l06-o1
        prompt: |
          Put the lines of the recursive `routes` CTE in the right order. These are the lines **inside** the parentheses, without the `WITH` line. The first line is the anchor, the row that starts at Harbor.
        lines:
          - SELECT 'Harbor', ARRAY['Harbor'], 0
          - UNION ALL
          - SELECT e.to_stop, r.path || e.to_stop, r.minutes + e.minutes
          - FROM edges AS e
          - JOIN routes AS r ON e.from_stop = r.stop
          - WHERE NOT (e.to_stop = ANY(r.path))
        distractors:
          - WHERE NOT (e.to_stop = ANY(r.stop))
        runnable: false
        explanation: |
          The anchor comes first, then `UNION ALL`, then the recursive part. The recursive part follows each link out of the last stop, adds the stop to the path and adds the minutes. The guard must check `r.path`, because `r.stop` is a single name, not a list.

      - type: exercise
        id: m09-l06-e5
        title: Fastest route, with the route text
        prompt: |
          The `edges` table is already loaded for you. Find the fastest route from Harbor to each stop. Harbor itself counts, with the route `Harbor` and 0 minutes.

          Show three columns, named exactly `stop`, `route` and `minutes`:

          - `route` is the stops on the fastest route, joined with ` > ` (a space, a greater-than sign, a space).

          Sort by `minutes`, then by `stop`.
        starter: |
          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          )
          SELECT stop, path, minutes
          FROM routes
          ORDER BY minutes, stop;
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          ),
          fastest AS (
              SELECT stop, MIN(minutes) AS best
              FROM routes
              GROUP BY stop
          )
          SELECT r.stop,
                 array_to_string(r.path, ' > ') AS route,
                 r.minutes
          FROM routes AS r
          JOIN fastest AS f
            ON r.stop = f.stop
           AND r.minutes = f.best
          ORDER BY r.minutes, r.stop;
        ordered: true
        columnNames: true
        hints:
          - Build all the simple routes first, as in the fastest-route example. Then keep only the fastest one per stop.
          - Put `MIN(minutes)` in a second CTE, grouped by `stop`.
          - "FROM routes AS r JOIN fastest AS f ON r.stop = f.stop AND r.minutes = ___"
        explanation: |
          Oakvale and Riverside tie at 25 minutes, but they are different stops, so each keeps its own fastest route. Every stop has only one route with its lowest time here, so the join returns exactly one row per stop. If two routes tied for the same stop, both would appear.
        difficulty: 3

      - type: exercise
        id: m09-l06-e6
        title: Two-way roads
        prompt: |
          In real life many roads can be driven in **both** directions. Pretend that every link in `edges` also works in reverse, with the same minutes. The `edges` table is already loaded for you.

          Find the fastest time from Harbor to each stop, using both directions. Show `stop` and `fastest` (the lowest minutes), sorted by `stop`.
        starter: |
          WITH RECURSIVE routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT e.to_stop,
                     r.path || e.to_stop,
                     r.minutes + e.minutes
              FROM edges AS e
              JOIN routes AS r ON e.from_stop = r.stop
              WHERE NOT (e.to_stop = ANY(r.path))
          )
          SELECT stop, MIN(minutes) AS fastest
          FROM routes
          GROUP BY stop
          ORDER BY stop;
        setup: |
          CREATE TABLE edges (
              from_stop text,
              to_stop text,
              minutes int
          );

          INSERT INTO edges VALUES
              ('Harbor', 'Mill', 10),
              ('Harbor', 'Riverside', 25),
              ('Mill', 'Oakvale', 15),
              ('Oakvale', 'Hilltop', 20),
              ('Hilltop', 'Mill', 5),
              ('Riverside', 'Hilltop', 10),
              ('Hilltop', 'Station', 30);
        solution: |
          WITH RECURSIVE roads AS (
              SELECT from_stop, to_stop, minutes
              FROM edges
              UNION ALL
              SELECT to_stop, from_stop, minutes
              FROM edges
          ),
          routes(stop, path, minutes) AS (
              SELECT 'Harbor', ARRAY['Harbor'], 0
              UNION ALL
              SELECT r2.to_stop,
                     r.path || r2.to_stop,
                     r.minutes + r2.minutes
              FROM roads AS r2
              JOIN routes AS r ON r2.from_stop = r.stop
              WHERE NOT (r2.to_stop = ANY(r.path))
          )
          SELECT stop, MIN(minutes) AS fastest
          FROM routes
          GROUP BY stop
          ORDER BY stop;
        ordered: true
        columnNames: true
        hints:
          - Start by building a `roads` CTE that holds every link **and** its reverse, joined with `UNION ALL`.
          - The `roads` CTE is not recursive, but it still goes in the `WITH RECURSIVE` list, next to `routes`.
          - "FROM roads AS r2 JOIN routes AS r ON r2.from_stop = r.stop"
        explanation: |
          With two-way roads, Hilltop can be reached in 15 minutes: Harbor to Mill (10), then Mill to Hilltop (5), using the reverse of the Hilltop to Mill link. The guard still stops every route from revisiting a stop, so the search always finishes.
        difficulty: 3

    cheatsheet:
      - title: Stop a loop with a path list
        sql: |
          WHERE NOT (e.to_stop = ANY(r.path))
        note: "In the recursive part, add `r.path || e.to_stop` to the columns so each route remembers its stops."
      - title: Stop a loop with CYCLE
        sql: |
          WITH RECURSIVE reach(stop) AS (
              ...
          )
          CYCLE stop SET is_cycle USING visited_path
          SELECT stop
          FROM reach
          WHERE NOT is_cycle;
        note: "PostgreSQL 14 and later. `is_cycle` is true on the row that would repeat a stop."
      - title: Fastest time per stop
        sql: |
          SELECT stop, MIN(minutes) AS fastest
          FROM routes
          GROUP BY stop;
        note: "To keep the matching route as well, join `routes` back to this result on `stop` and `minutes`."
testPool:
  - type: quiz
    id: m09-t01
    lesson: m09-l01
    difficulty: 1
    question: After you write `WITH big_orders AS (SELECT ...)`, what is `big_orders` in the main query?
    options:
      - A temporary named result that exists only for this one statement
      - A permanent table that is saved in the database
      - A new column added to the orders table
      - A copy of the whole database
    answer: 0
    explanation: |
      A CTE is a named, temporary result. It disappears when the statement ends, so nothing is saved.

  - type: exercise
    id: m09-t02
    lesson: m09-l01
    difficulty: 1
    prompt: |
      Use a CTE named `category_prices` to show the average product price in each category. Show `category_id` and `avg_price` (the average `price`, rounded to 2 decimals). Sort by `category_id`.
    starter: |
      WITH category_prices AS (
          SELECT category_id
          FROM products
      )
      SELECT category_id, avg_price
      FROM category_prices
      ORDER BY category_id;
    solution: |
      WITH category_prices AS (
          SELECT category_id,
                 ROUND(AVG(price), 2) AS avg_price
          FROM products
          GROUP BY category_id
      )
      SELECT category_id, avg_price
      FROM category_prices
      ORDER BY category_id;
    ordered: true
    columnNames: true
    hints:
      - A CTE is written as `WITH name AS ( ... )` before the main `SELECT`.
      - Inside the CTE, use `AVG(price)` and `GROUP BY category_id`.
      - "SELECT category_id, ROUND(AVG(price), 2) AS avg_price FROM products GROUP BY ___;"
    explanation: |
      The CTE does the grouping, and the main query only picks and sorts the two columns. Eleven categories have products.

  - type: fill
    id: m09-t03
    lesson: m09-l01
    difficulty: 2
    prompt: |
      Name the CTE `order_counts` in the `WITH` line, then use that same name in the `FROM` line. Fill in both blanks.
    template: |
      WITH ___ AS (
          SELECT customer_id, COUNT(*) AS order_count
          FROM orders
          GROUP BY customer_id
      )
      SELECT COUNT(*) AS loyal_customers
      FROM ___
      WHERE order_count >= 10;
    answers:
      - ["order_counts"]
      - ["order_counts"]
    explanation: |
      You choose a CTE's name. The main query must use exactly the same name in its `FROM` line, so both blanks take `order_counts`.

  - type: exercise
    id: m09-t04
    lesson: m09-l02
    difficulty: 2
    prompt: |
      Use two CTEs. The first, `order_totals`, adds up what each customer has spent: for every order, `quantity` times `unit_price` from `order_items`, summed per `customer_id`. Call the total `total_spent`. The second CTE, `big_spenders`, keeps only the customers whose `total_spent` is **above 6000**.

      Show `customer_id` and `total_spent` for those customers. Sort by `total_spent` from highest to lowest, then by `customer_id`.
    starter: |
      WITH order_totals AS (
          SELECT o.customer_id
          FROM orders AS o
          JOIN order_items AS oi ON oi.order_id = o.order_id
      )
      SELECT customer_id, total_spent
      FROM order_totals;
    solution: |
      WITH order_totals AS (
          SELECT o.customer_id,
                 SUM(oi.quantity * oi.unit_price) AS total_spent
          FROM orders AS o
          JOIN order_items AS oi ON oi.order_id = o.order_id
          GROUP BY o.customer_id
      ),
      big_spenders AS (
          SELECT customer_id, total_spent
          FROM order_totals
          WHERE total_spent > 6000
      )
      SELECT customer_id, total_spent
      FROM big_spenders
      ORDER BY total_spent DESC, customer_id;
    ordered: true
    columnNames: true
    hints:
      - You need two CTEs separated by a comma. The second one reads the first.
      - Group the order items by customer with `GROUP BY o.customer_id`, and use `SUM(oi.quantity * oi.unit_price)`.
      - "WHERE total_spent > ___"
    explanation: |
      Each CTE is one step. `order_totals` makes one row per customer, and `big_spenders` filters that result. Nine customers spend more than 6000, and the biggest total is about 13,600.

  - type: predict
    id: m09-t05
    lesson: m09-l02
    difficulty: 1
    question: What single number does this query return?
    sql: |
      WITH pricey AS (
          SELECT category_id
          FROM products
          WHERE price > 100
      ),
      pricey_categories AS (
          SELECT DISTINCT category_id
          FROM pricey
      )
      SELECT COUNT(*) AS n
      FROM pricey_categories;
    options: ["3", "7", "11", "An error"]
    answer: 1
    explanation: |
      The first CTE keeps the category of every product priced above 100. The second removes repeats with `DISTINCT`, so each category counts once. Seven different categories have such a product.

  - type: quiz
    id: m09-t06
    lesson: m09-l02
    difficulty: 2
    question: |
      What happens when you run this query?

      ```sql
      WITH first_step AS (
          SELECT * FROM second_step
      ),
      second_step AS (
          SELECT 1 AS n
      )
      SELECT * FROM first_step;
      ```
    options:
      - An error, because first_step uses second_step before it is defined
      - It returns the number 1
      - It returns no rows
      - It works, because PostgreSQL reads all the CTEs before running them
    answer: 0
    explanation: |
      In a plain `WITH`, each CTE can only use the CTEs written above it. Put `second_step` first and the query works. This is the "order matters" rule from the chaining lesson.

  - type: quiz
    id: m09-t07
    lesson: m09-l03
    difficulty: 1
    question: What does `MATERIALIZED` do in `WITH cheap AS MATERIALIZED (SELECT ...)`?
    options:
      - It runs the CTE once and keeps its rows, so the main query reads the saved result
      - It turns the CTE into a permanent table
      - It doubles the rows that the CTE returns
      - It stops the CTE from being used more than once
    answer: 0
    explanation: |
      `MATERIALIZED` tells PostgreSQL to compute the CTE on its own, once, and keep the result for the main query. Without it, PostgreSQL may merge a CTE that is used only once into the main query. `NOT MATERIALIZED` asks for that merge.

