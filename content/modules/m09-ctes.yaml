      SELECT COUNT(*) AS cheap_products
      FROM cheap;
    answers:
      - ["MATERIALIZED"]
    explanation: |
      `AS MATERIALIZED (...)` forces the CTE to run on its own before the main query. Without the keyword, PostgreSQL decides for itself, and for a CTE used only once it may merge it into the main query.

  - type: exercise
    id: m09-t10
    lesson: m09-l04
    difficulty: 1
    prompt: |
      Use a recursive CTE named `nums` to produce the whole numbers from 1 to 12. Show one column named `n`, sorted from 1 to 12.
    starter: |
      WITH RECURSIVE nums(n) AS (
          SELECT 1
      )
      SELECT n
      FROM nums;
    solution: |
      WITH RECURSIVE nums(n) AS (
          SELECT 1
          UNION ALL
          SELECT n + 1
          FROM nums
          WHERE n < 12
      )
      SELECT n
      FROM nums
      ORDER BY n;
    ordered: true
    columnNames: true
    hints:
      - A recursive CTE starts with an anchor, such as `SELECT 1`.
      - The recursive part adds 1 to the last number, joined with `UNION ALL`.
      - "WHERE n < ___ (the rule that stops the loop)"
    explanation: |
      The anchor gives 1. Each round adds 1 while the last number is below 12. The row for 12 is made from 11, and then the rule `n < 12` fails for 12, so the loop stops.

  - type: predict
    id: m09-t11
    lesson: m09-l04
    difficulty: 2
    question: What single number does this query return?
    sql: |
      WITH RECURSIVE by_three(n) AS (
          SELECT 0
          UNION ALL
          SELECT n + 3
          FROM by_three
          WHERE n < 10
      )
      SELECT COUNT(*) AS rows_made
      FROM by_three;
    options: ["4", "5", "10", "An error"]
    answer: 1
    explanation: |
      The values are 0, 3, 6, 9 and 12. The rule `n < 10` lets 9 create 12, and then 12 fails the rule, so the loop stops. That makes five rows.

  - type: quiz
    id: m09-t12
    lesson: m09-l04
    difficulty: 1
    question: |
      A recursive CTE has no stop rule (no `WHERE` in its recursive part), and the main query has no `LIMIT`. What happens?
    options:
      - It keeps adding rows until the app cancels the query
      - It stops after one round
      - It returns only the anchor row
      - It returns an error straight away
    answer: 0
    explanation: |
      Without a stop rule, every round can add another row, so the loop never ends by itself. This app cancels runaway queries after about 20 seconds, but you should always write the stop rule yourself.

  - type: parsons
    id: m09-t13
    lesson: m09-l04
    difficulty: 2
    prompt: |
      Put the lines of a countdown from 5 to 1 in the right order. The script must run and show the numbers 5 down to 1, one per row.
    lines:
      - WITH RECURSIVE countdown(n) AS (
      - SELECT 5
      - UNION ALL
      - SELECT n - 1
      - FROM countdown
      - WHERE n > 1
      - ")"
      - SELECT n
      - FROM countdown
      - ORDER BY n DESC;
    distractors:
      - WHERE n < 1
    explanation: |
      The anchor (`SELECT 5`) starts the list. Each round takes one away, and `WHERE n > 1` is the stop rule. The final `SELECT` reads the rows and sorts them from 5 down to 1 with `DESC`.

  - type: exercise
    id: m09-t14
    lesson: m09-l05
    difficulty: 2
    dataset: company
    prompt: |
      Acme's VP of Sales is Amina Nkosi (`emp_id` 4). Using a recursive CTE, list **everyone** in her organisation, at every level. Include Amina herself and people who have left the company.

      Show `emp_id`, `name` (the first name and last name joined with one space) and `depth` (0 for Amina, 1 for her direct reports, and so on). Sort by `depth`, then by `emp_id`.
    starter: |
      WITH RECURSIVE team(emp_id, depth) AS (
          SELECT emp_id, 0
          FROM employees
          WHERE emp_id = 4
      )
      SELECT emp_id, depth
      FROM team;
    solution: |
      WITH RECURSIVE team(emp_id, name, depth) AS (
          SELECT emp_id,
                 first_name || ' ' || last_name,
                 0
          FROM employees
          WHERE emp_id = 4
          UNION ALL
          SELECT e.emp_id,
                 e.first_name || ' ' || e.last_name,
                 t.depth + 1
          FROM employees AS e
          JOIN team AS t ON e.manager_id = t.emp_id
      )
      SELECT emp_id, name, depth
      FROM team
      ORDER BY depth, emp_id;
    ordered: true
    columnNames: true
    hints:
      - This is the same pattern as the Layla example. Start with an anchor row, then join `employees` to the team found so far.
      - Join each employee to the team with `e.manager_id = t.emp_id`, and add 1 to `depth`.
      - "JOIN team AS t ON e.manager_id = ___"
    explanation: |
      Thirteen people in total. Amina is at depth 0, Oscar Lewis and James Miller are at depth 1, and seven people are at depth 3, the deepest level. Mariana Hernandez has left the company, but she is still in the data, so she appears too.

  - type: quiz
    id: m09-t15
    lesson: m09-l05
    difficulty: 1
    dataset: company
    question: |
      In a recursive query that walks **down** an org chart, which join finds the people who report to someone already in the team list?
    options:
      - "JOIN team AS t ON e.emp_id = t.manager_id"
      - "JOIN team AS t ON e.manager_id = t.emp_id"
      - "JOIN team AS t ON e.dept_id = t.dept_id"
      - "JOIN team AS t ON e.salary > t.salary"
    answer: 1
    explanation: |
      `e.manager_id = t.emp_id` means "this employee's manager is a person already in the team". The first option walks up the chart instead, from the employee to their boss.

  - type: predict
    id: m09-t16
    lesson: m09-l05
    difficulty: 3
    dataset: company
    question: What single number does this query return?
    sql: |
      WITH RECURSIVE team(emp_id, depth) AS (
          SELECT emp_id, 0
          FROM employees
          WHERE emp_id = 4
          UNION ALL
          SELECT e.emp_id, t.depth + 1
          FROM employees AS e
          JOIN team AS t ON e.manager_id = t.emp_id
          WHERE t.depth < 2
      )
      SELECT COUNT(*)
      FROM team;
    options: ["3", "6", "7", "13"]
    answer: 1
    explanation: |
      The rule `t.depth < 2` lets rows at depth 0 and 1 create new rows, so the search reaches depth 2 and stops there. That is Amina (1 person), her 2 direct reports and their 3 reports at depth 2: six people. The 7 people at depth 3 are cut off.

  - type: exercise
    id: m09-t17
    lesson: m09-l05
    difficulty: 3
    dataset: company
    prompt: |
      Noor Rahman (`emp_id` 29) wants to see her chain of command, all the way up to the CEO.

      Show `emp_id`, `name` (the first name and last name joined with one space) and `depth`, where depth 0 is Noor herself, depth 1 is her manager, and so on up to the CEO. Sort by `depth`.
    starter: |
      WITH RECURSIVE chain(emp_id, manager_id, depth) AS (
          SELECT emp_id, manager_id, 0
          FROM employees
          WHERE emp_id = 29
      )
      SELECT emp_id, manager_id, depth
      FROM chain;
    solution: |
      WITH RECURSIVE chain(emp_id, name, manager_id, depth) AS (
          SELECT emp_id,
                 first_name || ' ' || last_name,
                 manager_id,
                 0
          FROM employees
          WHERE emp_id = 29
          UNION ALL
          SELECT e.emp_id,
                 e.first_name || ' ' || e.last_name,
                 e.manager_id,
                 c.depth + 1
          FROM employees AS e
          JOIN chain AS c ON e.emp_id = c.manager_id
      )
      SELECT emp_id, name, depth
      FROM chain
      ORDER BY depth;
    ordered: true
    columnNames: true
    hints:
      - Walk up instead of down. Start at Noor, then join to the boss of each row.
      - The join is flipped. Match the employee whose `emp_id` equals the current row's `manager_id`.
      - "JOIN chain AS c ON e.emp_id = c.___"
    explanation: |
      Noor reports to Paola Cruz, who reports to Olivia Brooks, then Thiago Rodriguez, then the CEO, Diego Adeyemi. The CEO's `manager_id` is NULL, so the join finds no boss and the search stops by itself.

  - type: parsons
    id: m09-t18
    lesson: m09-l05
    difficulty: 2
    dataset: company
    prompt: |
      Put the lines of a query that lists everyone in Oscar Lewis's team (`emp_id` 11), with each person's depth, in the right order. The query must run.
    lines:
      - WITH RECURSIVE team(emp_id, name, depth) AS (
      - SELECT emp_id, first_name || ' ' || last_name, 0
      - FROM employees
      - WHERE emp_id = 11
      - UNION ALL
      - SELECT e.emp_id, e.first_name || ' ' || e.last_name, t.depth + 1
      - FROM employees AS e
      - JOIN team AS t ON e.manager_id = t.emp_id
      - ")"
      - SELECT name, depth
      - FROM team
      - ORDER BY depth, name;
    distractors:
      - WHERE e.manager_id = t.depth
    explanation: |
      The anchor (Oscar, depth 0) comes first, then `UNION ALL`, then the recursive part, which joins employees whose manager is already in the team. The last lines are the main query, which sorts by depth and then by name. Oscar's team has eight people.

  - type: exercise
    id: m09-t19
    lesson: m09-l06
    difficulty: 1
    setup: |
      CREATE TABLE edges (
          from_stop text,
          to_stop text,
          minutes int
      );

      INSERT INTO edges VALUES
          ('Harbor', 'Mill', 10),
          ('Harbor', 'Riverside', 25),
          ('Mill', 'Oakvale', 15),
          ('Oakvale', 'Hilltop', 20),
          ('Hilltop', 'Mill', 5),
          ('Riverside', 'Hilltop', 10),
          ('Hilltop', 'Station', 30);
    prompt: |
      The `edges` table is already loaded for you. It has the same seven links as the first example in this lesson.

      Show `from_stop`, `to_stop` and `minutes` for every link that takes **more than 10 minutes**. Sort by `minutes` from longest to shortest.
    starter: |
      SELECT from_stop, to_stop, minutes
      FROM edges
      WHERE minutes > 100;
    solution: |
      SELECT from_stop, to_stop, minutes
      FROM edges
      WHERE minutes > 10
      ORDER BY minutes DESC;
    ordered: true
    columnNames: true
    hints:
      - Keep only the rows where `minutes` is bigger than 10.
      - Use `ORDER BY minutes DESC` to put the longest link first.
      - "WHERE minutes > ___ ORDER BY ___ DESC;"
    explanation: |
      Four links take longer than 10 minutes: Hilltop to Station (30), Harbor to Riverside (25), Oakvale to Hilltop (20) and Mill to Oakvale (15). Links of exactly 10 minutes are left out, because `>` means strictly greater than.

  - type: predict
    id: m09-t20
    lesson: m09-l06
    difficulty: 2
    question: What single number of rows does this query return?
    sql: |
      WITH RECURSIVE edges(from_stop, to_stop) AS (
          VALUES ('Ash', 'Birch'), ('Birch', 'Ash'), ('Ash', 'Cedar')
      ),
      reach(stop) AS (
          SELECT 'Ash'
          UNION
          SELECT e.to_stop
          FROM edges AS e
          JOIN reach AS r ON e.from_stop = r.stop
      )
      SELECT stop
      FROM reach;
    options: ["2", "3", "4", "It never ends"]
    answer: 1
    explanation: |
      Ash leads to Birch and Cedar. Birch leads back to Ash, which is already in the result, so `UNION` drops it. The search ends with three stops: Ash, Birch and Cedar.

  - type: quiz
    id: m09-t21
    lesson: m09-l06
    difficulty: 3
    question: Why does a loop in a recursive CTE need a stop rule when the query uses `UNION ALL`?
    options:
      - UNION ALL keeps every repeated row, so each round can add rows forever unless a stop rule or a cycle check ends the search
      - UNION ALL sorts the rows, which takes forever on a loop
      - UNION ALL is not allowed in a recursive CTE, so the query fails
      - UNION ALL only works on tables, not on CTEs
    answer: 0
    explanation: |
      `UNION ALL` never removes repeated rows. In a loop the same stops come back again and again, so only a stop rule (a `WHERE` on a counter, a path check or the `CYCLE` clause) can end the search. `UNION` would remove exact repeats, but only when the rows are identical.

  - type: exercise
    id: m09-t22
    lesson: m09-l06
    difficulty: 2
    setup: |
      CREATE TABLE edges (
          from_stop text,
          to_stop text,
          minutes int
      );

      INSERT INTO edges VALUES
          ('Harbor', 'Mill', 10),
          ('Harbor', 'Riverside', 25),
          ('Mill', 'Oakvale', 15),
          ('Oakvale', 'Hilltop', 20),
          ('Hilltop', 'Mill', 5),
          ('Riverside', 'Hilltop', 10),
          ('Hilltop', 'Station', 30);
    prompt: |
      The `edges` table is already loaded for you. Start at **Oakvale** and follow the links, counting hops. Stop the search at **2 hops**.

      Show `stop` and `hops` for every stop reached. Sort by `hops`, then by `stop`.
    starter: |
      WITH RECURSIVE reach(stop, hops) AS (
          SELECT 'Harbor', 0
          UNION ALL
          SELECT e.to_stop, r.hops + 1
          FROM edges AS e
          JOIN reach AS r ON e.from_stop = r.stop
          WHERE r.hops < 0
      )
      SELECT stop, hops
      FROM reach
      ORDER BY hops, stop;
    solution: |
      WITH RECURSIVE reach(stop, hops) AS (
          SELECT 'Oakvale', 0
          UNION ALL
          SELECT e.to_stop, r.hops + 1
          FROM edges AS e
          JOIN reach AS r ON e.from_stop = r.stop
          WHERE r.hops < 2
      )
      SELECT stop, hops
      FROM reach
      ORDER BY hops, stop;
    ordered: true
    columnNames: true
    hints:
      - Change the start from Harbor to Oakvale, and change the stop rule.
      - "Only rows with fewer than 2 hops may create new rows: WHERE r.hops < ___"
      - "SELECT 'Oakvale', 0 UNION ALL SELECT e.to_stop, r.hops + 1 ... WHERE r.hops < ___"
    explanation: |
      Oakvale is 0 hops away and Hilltop is 1 hop away. Mill and Station are 2 hops away. Their links would lead to 3 hops, which the stop rule does not allow, so the search ends.

  - type: exercise
    id: m09-t23
    lesson: m09-l06
    difficulty: 3
    setup: |
      CREATE TABLE edges (
          from_stop text,
          to_stop text,
          minutes int
      );

      INSERT INTO edges VALUES
          ('Harbor', 'Mill', 10),
          ('Harbor', 'Riverside', 25),
          ('Mill', 'Oakvale', 15),
          ('Oakvale', 'Hilltop', 20),
          ('Hilltop', 'Mill', 5),
          ('Riverside', 'Hilltop', 10),
          ('Hilltop', 'Station', 30);
    prompt: |
      The `edges` table is already loaded for you. Look at the simple routes from Harbor. A simple route never visits a stop twice. The trivial route that stays at Harbor does **not** count.

      Find the stops that have **more than one** simple route. Show `stop` and `route_count` (the number of simple routes that end at that stop), sorted by `stop`.
    starter: |
      WITH RECURSIVE routes(stop, path) AS (
          SELECT 'Harbor', ARRAY['Harbor']
          UNION ALL
          SELECT e.to_stop, r.path || e.to_stop
          FROM edges AS e
          JOIN routes AS r ON e.from_stop = r.stop
          WHERE NOT (e.to_stop = ANY(r.path))
      )
      SELECT stop, COUNT(*) AS route_count
      FROM routes
      WHERE stop <> 'Harbor'
      GROUP BY stop
      ORDER BY stop;
    solution: |
      WITH RECURSIVE routes(stop, path) AS (
          SELECT 'Harbor', ARRAY['Harbor']
          UNION ALL
          SELECT e.to_stop, r.path || e.to_stop
          FROM edges AS e
          JOIN routes AS r ON e.from_stop = r.stop
          WHERE NOT (e.to_stop = ANY(r.path))
      )
      SELECT stop, COUNT(*) AS route_count
      FROM routes
      WHERE stop <> 'Harbor'
      GROUP BY stop
      HAVING COUNT(*) > 1
      ORDER BY stop;
    ordered: true
    columnNames: true
    hints:
      - Start with the simple-route search from the lesson, then count its rows per stop.
      - After `GROUP BY stop`, a `HAVING` clause filters the groups, just as `WHERE` filters rows.
      - "... GROUP BY stop HAVING COUNT(*) ___ 1 ORDER BY stop;"
    explanation: |
      Four stops can be reached by two different simple routes: Hilltop, Mill, Oakvale and Station. Riverside has only one route, and Harbor is left out. `HAVING` keeps the groups with more than one route, after `GROUP BY` has counted them.

  - type: fill
    id: m09-t24
    lesson: m09-l06
    difficulty: 3
    prompt: |
      Fill in the two blanks in the simple-route search. The first blank adds the new stop to the end of the path. The second blank checks the path, so a stop is never visited twice.
    template: |
      WITH RECURSIVE edges(from_stop, to_stop) AS (
          VALUES ('Ash', 'Birch'), ('Birch', 'Ash'), ('Ash', 'Cedar')
      ),
      routes(stop, path) AS (
          SELECT 'Ash', ARRAY['Ash']
          UNION ALL
          SELECT e.to_stop, r.path ___ e.to_stop
          FROM edges AS e
          JOIN routes AS r ON e.from_stop = r.stop
          WHERE NOT (e.to_stop = ANY(r.___))
      )
      SELECT stop
      FROM routes;
    answers:
      - ["||"]
      - ["path"]
    explanation: |
      `r.path || e.to_stop` adds the new stop to the list, and `NOT (e.to_stop = ANY(r.path))` blocks any stop that is already on it. Without the guard, Birch would lead back to Ash and the search would loop forever.

  - type: exercise
    id: m09-t25
    lesson: m09-l02
    difficulty: 3
    prompt: |
      Use two CTEs to find the busiest categories. The first CTE, `product_counts`, counts the products in each category (`category_id` and `product_count`). The second CTE, `busy`, keeps only the categories with **at least 3** products.

      Show the category `name` (from `categories`) and `product_count` for the busy categories. Sort by `product_count` from highest to lowest, then by `name`.
    starter: |
      WITH product_counts AS (
          SELECT category_id, COUNT(*) AS product_count
          FROM products
          GROUP BY category_id
      )
      SELECT category_id, product_count
      FROM product_counts
      ORDER BY product_count DESC;
    solution: |
      WITH product_counts AS (
          SELECT category_id, COUNT(*) AS product_count
          FROM products
          GROUP BY category_id
      ),
      busy AS (
          SELECT category_id, product_count
          FROM product_counts
          WHERE product_count >= 3
      )
      SELECT c.name, b.product_count
      FROM busy AS b
      JOIN categories AS c ON c.category_id = b.category_id
      ORDER BY b.product_count DESC, c.name;
    ordered: true
    columnNames: true
    hints:
      - Each CTE is one step. The second CTE can read the first one.
      - Keep the rows where `product_count` is at least 3, then join to `categories` to get the name.
      - "FROM busy AS b JOIN categories AS c ON c.category_id = ___"
    explanation: |
      Eleven categories have at least three products. Kitchen, Peripherals and Phones tie at 8, so the name decides their order. The CTE `busy` reads `product_counts`, which is why the order of the two CTEs matters.

project:
  id: m09-proj
  title: Org Chart Explorer
  icon: "🌳"
  dataset: company
  md: |
    Acme Corp's HR team is building an **Org Chart Explorer**: a small set of queries that answers the questions managers ask every week. Priya from HR gives you the questions one at a time:

    - Who manages the most people?
    - Who is in Thiago's organisation, at every level?
    - Who sits above a given person, all the way up to the CEO?
    - How big is each team, counting everyone below a manager?
    - What does each team cost in salaries?

    The tasks build on each other. The last question combines the ideas from the whole module: CTEs, a recursive walk down, a recursive walk up, and aggregation.

    > [!TIP]
    > Build a recursive query in two steps. First run the anchor alone and check its row. Then add the recursive part and check the row count before you move on.

  tasks:
    - type: exercise
      id: m09-proj-1
      title: Priya's first list, the busy managers
      prompt: |
        Priya wants the managers with **at least 3 direct reports**. A direct report is an employee whose `manager_id` is that manager's `emp_id`. Count everyone listed under a manager, including people who have left.

        Show the manager's `name` (first name and last name joined with one space) and `direct_reports` (the count). Sort by `direct_reports` from highest to lowest, then by `name`.
      starter: |
        WITH direct_counts AS (
            SELECT manager_id, COUNT(*) AS direct_reports
            FROM employees
            GROUP BY manager_id
        )
        SELECT manager_id, direct_reports
        FROM direct_counts
        ORDER BY direct_reports DESC;
      solution: |
        WITH direct_counts AS (
            SELECT manager_id, COUNT(*) AS direct_reports
            FROM employees
            WHERE manager_id IS NOT NULL
            GROUP BY manager_id
        )
        SELECT e.first_name || ' ' || e.last_name AS name,
               dc.direct_reports
        FROM direct_counts AS dc
        JOIN employees AS e ON e.emp_id = dc.manager_id
        WHERE dc.direct_reports >= 3
        ORDER BY dc.direct_reports DESC, name;
      ordered: true
      columnNames: true
      hints:
        - The first CTE counts employees per `manager_id`. Leave out the CEO, whose `manager_id` is NULL.
        - Join the CTE back to `employees` on the manager's `emp_id` to get the name.
        - "WHERE dc.direct_reports >= ___"
      explanation: |
        Diego Adeyemi, the CEO, has six direct reports. Jun Zhang has four, and Mei Nakamura and Thiago Rodriguez have three each. Ties are sorted by name. The `WHERE` filters the count from the CTE, not the raw employee rows.
      difficulty: 1

    - type: exercise
      id: m09-proj-2
      title: Everyone under Thiago, at every level
      prompt: |
        Thiago Rodriguez (`emp_id` 3, VP of Engineering) asks: *"Who is in my organisation, at every level?"* Use a recursive CTE to list Thiago and everyone below him, including people who have left.

        Show `emp_id`, `name` (first name and last name joined with one space) and `depth` (0 for Thiago, 1 for his direct reports, and so on). Sort by `depth`, then by `emp_id`.
      starter: |
        WITH RECURSIVE team(emp_id, depth) AS (
            SELECT emp_id, 0
            FROM employees
            WHERE emp_id = 3
        )
        SELECT emp_id, depth
        FROM team;
      solution: |
        WITH RECURSIVE team(emp_id, name, depth) AS (
            SELECT emp_id,
                   first_name || ' ' || last_name,
                   0
            FROM employees
            WHERE emp_id = 3
            UNION ALL
            SELECT e.emp_id,
                   e.first_name || ' ' || e.last_name,
                   t.depth + 1
            FROM employees AS e
            JOIN team AS t ON e.manager_id = t.emp_id
        )
        SELECT emp_id, name, depth
        FROM team
        ORDER BY depth, emp_id;
      ordered: true
      columnNames: true
      hints:
        - "Use the same pattern as the lesson: an anchor row for Thiago, then a recursive part."
        - "Join `employees` to the team on `e.manager_id = t.emp_id`, and add 1 to `depth`."
        - "JOIN team AS t ON e.manager_id = ___"
      explanation: |
        The team has 21 people in total: Thiago himself and the 20 people below him. The recursive part stops by itself once the newest rows have nobody reporting to them.
      difficulty: 1

    - type: exercise
      id: m09-proj-3
      title: Vikram's chain of command
      prompt: |
        Vikram Kumar (`emp_id` 33, Frontend Engineer) must be copied on a message to everyone above him. Walk **up** the chart from Vikram to the CEO.

        Show `emp_id`, `name` (first name and last name joined with one space) and `depth` (0 for Vikram, 1 for his manager, and so on up to the CEO). Sort by `depth`.
      starter: |
        WITH RECURSIVE chain(emp_id, manager_id, depth) AS (
            SELECT emp_id, manager_id, 0
            FROM employees
            WHERE emp_id = 33
        )
        SELECT emp_id, manager_id, depth
        FROM chain;
      solution: |
        WITH RECURSIVE chain(emp_id, name, manager_id, depth) AS (
            SELECT emp_id,
                   first_name || ' ' || last_name,
                   manager_id,
                   0
            FROM employees
            WHERE emp_id = 33
            UNION ALL
            SELECT e.emp_id,
                   e.first_name || ' ' || e.last_name,
                   e.manager_id,
                   c.depth + 1
            FROM employees AS e
            JOIN chain AS c ON e.emp_id = c.manager_id
        )
        SELECT emp_id, name, depth
        FROM chain
        ORDER BY depth;
      ordered: true
      columnNames: true
      hints:
        - "Walking up flips the join. Find the employee whose `emp_id` equals the current row's `manager_id`."
        - "The CEO's `manager_id` is NULL, so the search ends there by itself."
        - "JOIN chain AS c ON e.emp_id = c.___"
      explanation: |
        Vikram reports to Jun Zhang, who reports to Layla Khan, who reports to Thiago Rodriguez, who reports to the CEO, Diego Adeyemi. That makes five rows, one per level.
      difficulty: 2

    - type: exercise
      id: m09-proj-4
      title: Reporting lines as text
      prompt: |
        Jun Zhang (`emp_id` 19) wants a readable reporting line for each person in his team. Build a `path` text that starts with Jun's name and adds each name below him, joined with ` > ` (a space, a greater-than sign, a space).

        Show only the `path` column, including Jun's own row. Sort by `path`.
      starter: |
        WITH RECURSIVE tree(emp_id, path) AS (
            SELECT emp_id, first_name || ' ' || last_name
            FROM employees
            WHERE emp_id = 19
        )
        SELECT path
        FROM tree;
      solution: |
        WITH RECURSIVE tree(emp_id, path) AS (
            SELECT emp_id, first_name || ' ' || last_name
            FROM employees
            WHERE emp_id = 19
            UNION ALL
            SELECT e.emp_id,
                   t.path || ' > ' || e.first_name || ' ' || e.last_name
            FROM employees AS e
            JOIN tree AS t ON e.manager_id = t.emp_id
        )
        SELECT path
        FROM tree
        ORDER BY path;
      ordered: true
      columnNames: true
      hints:
        - "Each round adds one name to the end of the text, so the anchor's `path` is just Jun's name."
        - "Build the new text with `||`, and put ` > ` between the old text and the new name."
        - "SELECT e.emp_id, t.path || ' > ' || e.first_name ___ e.last_name FROM employees AS e JOIN tree AS t ON ___"
      explanation: |
        The anchor is Jun alone. Each round appends ` > ` and one more name, so the text grows downwards. Sorting by `path` keeps each person's line together, and each name appears after the lead it belongs to.
      difficulty: 2

    - type: exercise
      id: m09-proj-5
      title: How big is each team?
      prompt: |
        Priya's next question: *"How many people sit below each manager, at any level?"* This time the team counts everyone below the manager, not just direct reports, and includes people who have left.

        Show the manager's `name` (first name and last name joined with one space) and `team_size` for every manager with **at least 4** people below them. Sort by `team_size` from highest to lowest, then by `name`.
      starter: |
        SELECT e.first_name || ' ' || e.last_name AS name,
               COUNT(*) AS team_size
        FROM employees AS e
        GROUP BY e.emp_id, e.first_name, e.last_name
        ORDER BY team_size DESC;
      solution: |
        WITH RECURSIVE above(emp_id, boss_id) AS (
            SELECT emp_id, manager_id
            FROM employees
            WHERE manager_id IS NOT NULL
            UNION ALL
            SELECT a.emp_id, e.manager_id
            FROM above AS a
            JOIN employees AS e ON e.emp_id = a.boss_id
            WHERE e.manager_id IS NOT NULL
        )
        SELECT b.first_name || ' ' || b.last_name AS name,
               COUNT(*) AS team_size
        FROM above AS a
        JOIN employees AS b ON b.emp_id = a.boss_id
        GROUP BY b.emp_id, b.first_name, b.last_name
        HAVING COUNT(*) >= 4
        ORDER BY team_size DESC, name;
      ordered: true
      columnNames: true
      hints:
        - "Start with one row for each person and their direct manager. Call the second column `boss_id`."
        - "In the recursive part, move the boss up one level: join `employees` on `e.emp_id = a.boss_id`, and take that person's `manager_id`."
        - "Count the rows for each boss with `COUNT(*)`, then keep the big teams with `HAVING COUNT(*) >= 4`."
      explanation: |
        This is a new twist on the recursive pattern. The search starts from every employee and walks **up**, and each boss it passes gets one row. Counting rows per boss gives the team size at every level. Diego Adeyemi, the CEO, has 54 people below him: everyone except himself.
      difficulty: 3

    - type: exercise
      id: m09-proj-6
      title: The team payroll report
      prompt: |
        Final task. Priya wants a payroll report for each manager's team. Use the same method as the last task, but count **only people who are still employed** (their `terminated_on` is empty). The team is still everyone below the manager, at any level.

        Show `manager` (first name and last name joined with one space), `team_size` (the number of current people below them) and `team_payroll` (the sum of their `salary`). Keep only managers whose `team_size` is at least 5. Sort by `team_payroll` from highest to lowest, then by `manager`.
      starter: |
        SELECT e.first_name || ' ' || e.last_name AS manager,
               COUNT(*) AS team_size
        FROM employees AS e
        WHERE e.terminated_on IS NULL
        GROUP BY e.emp_id, e.first_name, e.last_name
        ORDER BY team_size DESC;
      solution: |
        WITH RECURSIVE above(emp_id, boss_id) AS (
            SELECT emp_id, manager_id
            FROM employees
            WHERE manager_id IS NOT NULL
            UNION ALL
            SELECT a.emp_id, e.manager_id
            FROM above AS a
            JOIN employees AS e ON e.emp_id = a.boss_id
            WHERE e.manager_id IS NOT NULL
        )
        SELECT b.first_name || ' ' || b.last_name AS manager,
               COUNT(*) AS team_size,
               SUM(e.salary) AS team_payroll
        FROM above AS a
        JOIN employees AS e ON e.emp_id = a.emp_id
        JOIN employees AS b ON b.emp_id = a.boss_id
        WHERE e.terminated_on IS NULL
        GROUP BY b.emp_id, b.first_name, b.last_name
        HAVING COUNT(*) >= 5
        ORDER BY team_payroll DESC, manager;
      ordered: true
      columnNames: true
      hints:
        - "Keep the same recursive part as the last task. Then join `above` to `employees` on the person (`a.emp_id`), so you can read their `salary` and `terminated_on`."
        - "Keep only people who are still employed with `WHERE e.terminated_on IS NULL`. This filter applies to the people below the manager, not to the manager."
        - "SUM(e.salary) AS team_payroll ... HAVING COUNT(*) >= ___"
      explanation: |
        Diego's current team has 49 people, and their salaries add up to $6,329,000.00. Thiago Rodriguez's team has 18 current people. The filter applies to the people below each manager, and `HAVING` keeps only the teams with at least five current people.
      difficulty: 3
