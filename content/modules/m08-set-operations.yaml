id: m08
order: 8
title: "Set Operations — Stacking & Comparing Results"
subtitle: UNION, INTERSECT and EXCEPT combine, overlap and subtract lists
icon: "📚"
level: intermediate
description: |
  A **join** puts tables *side by side*. But sometimes you need the opposite: two lists stacked
  **one on top of the other**, or a comparison like "who is on list A but **not** on list B?".

  In this module you learn the four **set operations**. `UNION` and `UNION ALL` stack results.
  `INTERSECT` finds what two lists have in common. `EXCEPT` finds what is on one list but not the other.
  You will build contact lists, spot missing data, add a TOTAL row to a report, and learn the
  rules that stop these queries from crashing.
dataset: shop
lessons:
  - id: m08-l01
    title: UNION & UNION ALL
    summary: Stack the rows of two queries into one result, and choose whether duplicates stay.
    minutes: 25
    dataset: cafe
    steps:
      - type: read
        title: Maria's party list
        md: |
          Maria, the café manager, is planning the holiday party. She wants **name tags** for everyone
          who is invited: the loyalty-program customers **and** the café staff.

          There is a catch. Customers live in one table and staff live in another. A `JOIN` puts tables
          **side by side** (more columns). Maria needs the opposite: **one long list**, with the second
          group written underneath the first.

          That is what a **set operation** does. `UNION` takes the rows of one query and stacks the rows
          of a second query underneath them.

          > [!ANALOGY]
          > Two stacks of name cards sit on a table: one for customers, one for staff. `UNION` picks up the
          > staff stack and puts it on top of the customer stack. Now there is just one pile.

          A join adds **columns**. A union adds **rows**. There are two flavours:

          - `UNION ALL` keeps every card.
          - `UNION` also throws away cards that are exact copies of each other.

      - type: example
        title: Stack two lists with UNION ALL
        md: |
          Staff names are stored as one piece of text, like `'Maria Santos'`. `SPLIT_PART(name, ' ', 1)`
          cuts out the first word (module 4), so we can compare it with the customers' `first_name`.

          Press **Run** to stack the Boston customers and the cashiers.
        sql: |
          SELECT first_name
          FROM customers
          WHERE city = 'Boston'
          UNION ALL
          SELECT SPLIT_PART(name, ' ', 1)
          FROM staff
          WHERE role = 'Cashier';
        after: |
          **10 rows**: 7 Boston customers plus 3 cashiers. Look closely: **Chloe** appears twice. One is the
          customer Chloe King, the other is the cashier Chloe Dubois. Two different people, same first name.

          `UNION ALL` never removes anything. The column is called `first_name` because the **first**
          query decides the names. (Without `ORDER BY` the row order is never guaranteed.)

      - type: example
        title: Remove the copies with UNION
        md: |
          Same two queries, but the keyword is now plain `UNION`.
        sql: |
          SELECT first_name
          FROM customers
          WHERE city = 'Boston'
          UNION
          SELECT SPLIT_PART(name, ' ', 1)
          FROM staff
          WHERE role = 'Cashier';
        after: |
          **9 rows** this time. The two Chloes were identical rows (the same text), so `UNION` kept only one.

          Remember: `UNION` = stack **and** remove duplicates. It judges the *whole row*, so with
          several columns two rows only count as copies if **every** column matches.

      - type: viz
        viz: set-ops
        title: Watch UNION and UNION ALL work
        md: |
          Here are two tiny lists, like the Boston customers and the cashiers. Click **UNION ALL** and
          then **UNION** and watch what happens to Chloe (pink = on both lists). The other two buttons
          are for the next lesson.
        config:
          a: { name: boston_customers, values: [Chloe, Naledi, Pavel, Hugo] }
          b: { name: cashiers, values: [Omar, Chloe, Lena] }

      - type: predict
        id: m08-l01-p1
        question: |
          The same query is stacked on top of itself with `UNION`. How many rows does it return?
        sql: |
          SELECT city
          FROM customers
          UNION
          SELECT city
          FROM customers;
        options: ["28 rows", "56 rows", "5 rows", "An error"]
        answer: 2
        explanation: |
          `UNION` removes duplicates in the **whole** result, not only between the two lists. There are 28
          customers but only 5 different cities, so you get 5 rows. With `UNION ALL` you would get 56 (28 + 28).

      - type: exercise
        id: m08-l01-e1
        title: Customers and bakers
        prompt: |
          Show one list called `first_name` with the first name of every customer who lives in
          **Portland**, followed by the first name of every staff member whose `role` is **'Baker'**.
          Keep every row (use `UNION ALL`).
        starter: |
          SELECT first_name
          FROM customers
          WHERE city = 'Portland'
          ___
          SELECT SPLIT_PART(name, ' ', 1)
          FROM staff
          WHERE role = 'Baker';
        solution: |
          SELECT first_name
          FROM customers
          WHERE city = 'Portland'
          UNION ALL
          SELECT SPLIT_PART(name, ' ', 1)
          FROM staff
          WHERE role = 'Baker';
        hints:
          - It is the Boston-and-cashiers example again, with a different city and a different role.
          - The keyword that stacks two queries and keeps every row is `UNION ALL`.
          - "SELECT first_name FROM customers WHERE city = 'Portland' UNION ___ SELECT SPLIT_PART(name, ' ', 1) FROM staff WHERE role = 'Baker';"
        explanation: |
          8 Portland customers plus 2 bakers (Aiko and Hannah) give 10 rows. Nobody shares a first name here,
          so `UNION` would return the same rows. The keyword you choose only matters when copies exist.
        difficulty: 1

      - type: read
        title: UNION or UNION ALL?
        md: |
          Both stack lists. The difference is what happens to **identical rows**:

          | | `UNION ALL` | `UNION` |
          |---|---|---|
          | Duplicates | kept | removed |
          | Speed | fast | slower (it must compare rows) |
          | Use it for | counting, adding up, "show me everything" | a clean unique list |

          Maria's name tags are a clean list, so `UNION` fits. A report that adds up numbers needs `UNION ALL`.

          > [!MISTAKE]
          > Using `UNION` when you are going to **count or add up** the result. If two different orders look
          > identical in the selected columns, `UNION` merges them into one row and your totals come out too
          > small, with no error message. When in doubt, use `UNION ALL`.

      - type: example
        title: Maria's complete party list
        md: |
          Now the real thing: every customer and every staff member, each first name once, A to Z.
          `ORDER BY` goes **once, at the very end**, and sorts the whole stacked list.
        sql: |
          SELECT first_name
          FROM customers
          UNION
          SELECT SPLIT_PART(name, ' ', 1)
          FROM staff
          ORDER BY first_name;
        after: |
          **35 name tags.** Stacking all 28 customers and all 10 staff would give 38 rows, but 3 cards were
          copies: Chloe and Hannah (one customer and one staff member each) and Dmitri (two customers
          share that first name). `UNION` kept one card for each.

      - type: exercise
        id: m08-l01-e2
        title: Last names, each once
        prompt: |
          Show one column called `last_name` with every different last name among the **Portland
          customers** and **all staff members** (a staff member's last name is the **second** word of
          `name`). Each last name must appear once. Sort A to Z.
        starter: |
          SELECT last_name
          FROM customers
          WHERE city = 'Portland'
          ___
          SELECT SPLIT_PART(name, ' ', 2)
          FROM staff
          ORDER BY last_name;
        solution: |
          SELECT last_name
          FROM customers
          WHERE city = 'Portland'
          UNION
          SELECT SPLIT_PART(name, ' ', 2)
          FROM staff
          ORDER BY last_name;
        ordered: true
        hints:
          - Two people can share a last name, and the prompt wants each name only once.
          - The keyword that removes duplicates is plain `UNION`.
          - "... WHERE city = 'Portland' UNION SELECT SPLIT_PART(name, ' ', 2) FROM staff ORDER BY last_name;"
        explanation: |
          16 rows: 8 Portland customers plus 10 staff would be 18, minus 2 shared last names (Carter and
          Fischer). Because `UNION` compares whole rows, each name survives once. All 16 names are
          different, so the A to Z order is exact.
        difficulty: 2

      - type: read
        title: The rules that keep UNION from crashing
        md: |
          For two queries to stack neatly, they must agree on three things:

          1. **Same number of columns.** Three columns on top, three columns below.
          2. **Compatible types, column by column.** Text with text, numbers with numbers, dates with dates.
          3. **Same order.** Columns are matched by **position** (1st with 1st, 2nd with 2nd), never by name.

          The column **names** in the result come from the **first** query. The second query's names are ignored.

          > [!MISTAKE]
          > Forgetting that columns are matched by *position*. If both columns are text, PostgreSQL will not
          > warn you when you swap them. You just get a quietly wrong list. We will see this in a moment.

      - type: example
        title: A different number of columns
        md: |
          The top query has two columns and the bottom query has one. Run it and read the message.
        sql: |
          SELECT first_name, last_name
          FROM customers
          UNION
          SELECT name
          FROM staff;
        expectError: true
        after: |
          PostgreSQL says: *each UNION query must have the same number of columns*. The fix is to make both
          sides the same shape: either build one column on the customer side (with `||`), or split the staff
          name into two columns (with `SPLIT_PART`).

      - type: exercise
        id: m08-l01-e3
        title: Fix the crash
        prompt: |
          This query should list the **full names** of the Denver customers and the bakers in one column
          called `full_name`, but it crashes. Fix it by making both queries return **one** column.
        starter: |
          SELECT first_name, last_name
          FROM customers
          WHERE city = 'Denver'
          UNION ALL
          SELECT name
          FROM staff
          WHERE role = 'Baker';
        solution: |
          SELECT first_name || ' ' || last_name AS full_name
          FROM customers
          WHERE city = 'Denver'
          UNION ALL
          SELECT name
          FROM staff
          WHERE role = 'Baker';
        columnNames: true
        hints:
          - The top query has two columns, the bottom query has one. They must match.
          - "Join `first_name` and `last_name` with `||` and a space between them, and give the result the alias `full_name`."
          - "SELECT first_name || ' ' || last_name AS ___ FROM customers WHERE city = 'Denver' UNION ALL SELECT name FROM staff WHERE role = 'Baker';"
        explanation: |
          4 rows: Rosa Mendoza and Carlos Santos (Denver customers), then Aiko Tanaka and Hannah Weiss (bakers).
          The alias goes on the **first** query, because that is where the result takes its column name from.
        difficulty: 1

      - type: example
        title: Text and numbers do not mix
        md: |
          Now the types do not match: `first_name` is text, `hourly_rate` is a number.
        sql: |
          SELECT first_name
          FROM customers
          UNION
          SELECT hourly_rate
          FROM staff;
        expectError: true
        after: |
          PostgreSQL says: *UNION types text and numeric cannot be matched*. Columns in the same position must
          be compatible. Different kinds of numbers mix fine (a whole number and a decimal become a decimal),
          and so do text with text and date with date. If you really must stack a number with text, convert
          the number first, for example `hourly_rate::text`.

      - type: quiz
        id: m08-l01-q1
        question: Which of these pairs of queries can be stacked with `UNION`? (Choose all that apply.)
        options:
          - "SELECT name, role FROM staff   +   SELECT first_name FROM customers"
          - "SELECT name FROM staff   +   SELECT price FROM menu_items"
          - "SELECT hired_on FROM staff   +   SELECT joined_on FROM customers"
          - "SELECT quantity FROM orders   +   SELECT price FROM menu_items"
        answer: [2, 3]
        explanation: |
          The first pair has 2 columns against 1. The second pair stacks text with a number. The third pair is
          date with date, and the fourth is a whole number with a decimal number, which PostgreSQL can mix.

      - type: example
        title: The quiet mix-up
        md: |
          Both queries return two **text** columns, so there is no error. But look at the second column.
        sql: |
          SELECT first_name, city
          FROM customers
          WHERE city = 'Denver'
          UNION ALL
          SELECT role, name
          FROM staff
          WHERE role = 'Baker';
        after: |
          No error, yet the list is a mess. The second column holds a **city** for the customers but a
          **name** for the bakers, and the first column holds a first name for customers but a role for bakers.
          PostgreSQL matched the columns by position and had no way to know that was not what you meant.

          Habit: write the two `SELECT` lists next to each other in your head and check they line up.

      - type: fill
        id: m08-l01-f1
        prompt: |
          Complete the query to list every date on which a customer **joined** or a staff member was
          **hired**, with no duplicate dates.
        template: |
          SELECT joined_on
          FROM customers
          ___
          SELECT ___
          FROM staff;
        answers:
          - ["UNION"]
          - ["hired_on"]
        explanation: |
          `UNION` removes duplicate dates (Ben Carter and Aiko Tanaka were hired on the same day). The second
          query must also return a date, so it uses `hired_on`.

      - type: exercise
        id: m08-l01-e4
        title: Newcomer days in 2024
        prompt: |
          Show one column called `day` with every date in **2024 or later** on which a customer **joined**
          (`joined_on`) or a staff member was **hired** (`hired_on`). Each date once, oldest first.
        starter: |
          SELECT joined_on AS day
          FROM customers
          WHERE joined_on >= '2024-01-01'
          ___
          SELECT hired_on
          FROM staff
          WHERE hired_on >= '2024-01-01'
          ORDER BY day;
        solution: |
          SELECT joined_on AS day
          FROM customers
          WHERE joined_on >= '2024-01-01'
          UNION
          SELECT hired_on
          FROM staff
          WHERE hired_on >= '2024-01-01'
          ORDER BY day;
        ordered: true
        columnNames: true
        hints:
          - Both columns are dates, so they are allowed to be stacked.
          - Use `UNION` and sort with `ORDER BY` at the very end.
          - "SELECT joined_on AS day FROM customers WHERE joined_on >= '2024-01-01' UNION SELECT hired_on FROM staff WHERE hired_on >= '2024-01-01' ORDER BY ___;"
        explanation: |
          10 dates: 7 customers joined and 3 staff members were hired in 2024, and no two share a date. The
          alias `day` is written once, on the first query, and `ORDER BY day` sorts the whole stacked list.
        difficulty: 2

      - type: parsons
        id: m08-l01-o1
        prompt: |
          Put the lines in order to list the first names of the **staff first**, then the customers, as one
          list **without duplicates**, sorted A to Z.
        lines:
          - SELECT SPLIT_PART(name, ' ', 1) AS first_name
          - FROM staff
          - UNION
          - SELECT first_name
          - FROM customers
          - ORDER BY first_name;
        distractors:
          - UNION ALL
        explanation: |
          `UNION` (not `UNION ALL`) removes the copies. The alias on the first query names the column, and the
          single `ORDER BY` closes the whole statement.

      - type: exercise
        id: m08-l01-e5
        title: A two-column directory
        prompt: |
          Build a small phone-book style list with two columns, `first_name` and `last_name`, for every
          **Portland customer** and every staff member whose `role` is **'Cashier'** (a staff member's first
          name is the first word of `name`, the last name is the second word). Keep every row. Sort by
          `last_name`, then `first_name`.
        starter: |
          SELECT first_name, last_name
          FROM customers
          WHERE city = 'Portland'
          UNION ALL
          SELECT ___
          FROM staff
          WHERE role = 'Cashier'
          ORDER BY last_name, first_name;
        solution: |
          SELECT first_name, last_name
          FROM customers
          WHERE city = 'Portland'
          UNION ALL
          SELECT SPLIT_PART(name, ' ', 1),
                 SPLIT_PART(name, ' ', 2)
          FROM staff
          WHERE role = 'Cashier'
          ORDER BY last_name, first_name;
        ordered: true
        hints:
          - The top query returns two columns, so the bottom query needs two columns too, in the same order.
          - "Use `SPLIT_PART(name, ' ', 1)` for the first name and `SPLIT_PART(name, ' ', 2)` for the last name."
          - "SELECT SPLIT_PART(name, ' ', ___), SPLIT_PART(name, ' ', ___) FROM staff WHERE role = 'Cashier' ..."
        explanation: |
          11 rows (8 customers and 3 cashiers). Two people share the last name Fischer, Dmitri and Lena, so the
          second sort column, `first_name`, settles that tie. Both halves of a stacked query can be built with
          completely different expressions, as long as the columns line up.
        difficulty: 2

      - type: exercise
        id: m08-l01-e6
        title: Everyone on Christmas Eve
        prompt: |
          Show one column called `person` with the full names of **everyone connected to the orders placed on
          2024-12-24**: the customers who placed them (`first_name` and `last_name` with a space between) and
          the staff members who served them (`staff.name`). Each person once, sorted A to Z.

          Use `order_time` to find the day. Remember that it is a timestamp, not a date.
        starter: |
          SELECT c.first_name || ' ' || c.last_name AS person
          FROM orders AS o
          JOIN customers AS c ON c.customer_id = o.customer_id
          WHERE o.order_time >= '2024-12-24'
            AND o.order_time < '2024-12-25'
          ___
          SELECT ___
          FROM orders AS o
          JOIN staff AS s ON s.staff_id = o.staff_id
          WHERE o.order_time >= '2024-12-24'
            AND o.order_time < '2024-12-25'
          ORDER BY person;
        solution: |
          SELECT c.first_name || ' ' || c.last_name AS person
          FROM orders AS o
          JOIN customers AS c ON c.customer_id = o.customer_id
          WHERE o.order_time >= '2024-12-24'
            AND o.order_time < '2024-12-25'
          UNION
          SELECT s.name
          FROM orders AS o
          JOIN staff AS s ON s.staff_id = o.staff_id
          WHERE o.order_time >= '2024-12-24'
            AND o.order_time < '2024-12-25'
          ORDER BY person;
        ordered: true
        columnNames: true
        hints:
          - Each half of the union is an ordinary join query. Think of them as two separate questions first.
          - "One query joins orders to customers, the other joins orders to staff. Both return one text column."
          - "... UNION SELECT s.name FROM orders AS o JOIN staff AS s ON s.staff_id = o.staff_id WHERE ... ORDER BY person;"
        explanation: |
          4 people: the customers Hugo Jones and Camila Flores, and the staff members Diego Alvarez and Ben
          Carter (two orders were placed that day). Each half of a union can be as complex as you like (joins,
          filters, even `GROUP BY`) as long as the columns agree.
        difficulty: 3

    cheatsheet:
      - title: Stack and keep every row
        sql: |
          SELECT first_name FROM customers
          UNION ALL
          SELECT SPLIT_PART(name, ' ', 1) FROM staff;
        note: UNION ALL puts the second result under the first and removes nothing. It is the fastest choice.
      - title: Stack and remove duplicates
        sql: |
          SELECT city FROM customers
          UNION
          SELECT city FROM customers
          ORDER BY city;
        note: UNION also removes copies inside each list. ORDER BY goes once, at the very end.
      - title: The three rules
        sql: |
          -- 1. same number of columns
          -- 2. compatible types (text/text, number/number, date/date)
          -- 3. matched by position; names come from the first query
          SELECT joined_on AS day FROM customers
          UNION
          SELECT hired_on FROM staff;
        note: Break a rule and you get an error, or worse, a quietly wrong list when the types happen to match.

  - id: m08-l02
    title: INTERSECT & EXCEPT
    summary: Keep the rows two lists share, or subtract one list from another.
    minutes: 25
    dataset: school
    steps:
      - type: read
        title: Two clubs, one question
        md: |
          Mr. Okafor, the school's activities coordinator, wants to give a **Club Champions** award to
          students who belong to **both** the Chess Club and the Book Club.

          Then he needs a second list: the Chess Club students who are **not** in the Book Club, so he can
          invite them to a special chess evening.

          Both questions compare two lists. In the last lesson you stacked lists with `UNION`. Now you will
          meet two more set operations:

          - `INTERSECT` keeps only the rows that appear in **both** results.
          - `EXCEPT` keeps the rows of the **first** result that do **not** appear in the second.

          > [!ANALOGY]
          > Think of two guest lists for two parties. `INTERSECT` finds the people invited to **both** parties.
          > `EXCEPT` finds the people invited to the first party who were **not** invited to the second.

      - type: example
        title: Students in both clubs
        md: |
          Each club is a list of names. Three tables work together here: `clubs` gives the club's name,
          `club_members` says who joined which club, and `students` has each person's name.

          Press **Run**.
        sql: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          INTERSECT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Book Club'
          ORDER BY student;
        after: |
          **4 students**: Aiko Park, Benjamin Kelly, Nora Taylor and Stefan Lindqvist. They are the only
          names that appear on **both** lists.

          Only the first query names the column (`AS student`). The second query just has to return the same
          kind of value, one text column, in the same position.

      - type: viz
        viz: set-ops
        title: See INTERSECT and EXCEPT with two small lists
        md: |
          These are two small sample lists of club members, so you can see the idea at a glance.
          Click **INTERSECT**, then **EXCEPT**, and watch which names survive.
        config:
          a: { name: chess_club, values: [Aiko Park, Amit Lin, Benjamin Kelly, Nora Taylor, Stefan Lindqvist] }
          b: { name: book_club, values: [Aiko Park, Benjamin Kelly, Felix Reed, Nora Taylor, Stefan Lindqvist] }

      - type: example
        title: Chess Club students who are not in the Book Club
        md: |
          Only one word changes: `INTERSECT` becomes `EXCEPT`.
        sql: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          EXCEPT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Book Club'
          ORDER BY student;
        after: |
          **10 students**: the 14 Chess Club members minus the 4 who are also in the Book Club. Aiko Park and
          Nora Taylor are gone, because `EXCEPT` removes every name found on the **second** list.

      - type: example
        title: Flip the two sides
        md: |
          Now swap the clubs: Book Club first, Chess Club second. Everything else stays the same.
        sql: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Book Club'
          EXCEPT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          ORDER BY student;
        after: |
          Again **10 rows**, but the names are different. These are the Book Club members who are **not** in
          the Chess Club, such as Aisha Ali and Felix Reed.

          `INTERSECT` does not care which list comes first. `EXCEPT` does. Before you write one, ask yourself:
          "Which list am I starting from?"

      - type: read
        title: Three ways to combine two lists
        md: |
          `UNION`, `INTERSECT` and `EXCEPT` all compare **whole rows**, and all of them remove copies.
          Pick the one that matches your question:

          | Keyword | Keeps | Question it answers |
          |---|---|---|
          | `UNION` | rows from either list | Who is in **any** club? |
          | `INTERSECT` | rows on **both** lists | Who is in **both** clubs? |
          | `EXCEPT` | rows on the first list but **not** the second | Who is in the Chess Club but **not** the Book Club? |

          PostgreSQL also has `INTERSECT ALL` and `EXCEPT ALL`, which keep copies. For example, a row that
          appears twice on both sides is kept twice by `INTERSECT ALL`. You will rarely need them.

          > [!MISTAKE]
          > Getting the order of an `EXCEPT` wrong. `A EXCEPT B` and `B EXCEPT A` can return the same **number**
          > of rows with completely different names. Always ask: "Which list am I starting from?"

      - type: example
        title: Sort at the very end
        md: |
          Each `SELECT` is a complete question, but `ORDER BY` belongs at the **very end** of the whole
          statement. Run this to see what happens when it sits in the middle.
        sql: |
          SELECT first_name
          FROM students
          WHERE grade_level = 12
          ORDER BY first_name
          EXCEPT
          SELECT first_name
          FROM students
          WHERE grade_level = 9;
        expectError: true
        after: |
          PostgreSQL says `syntax error at or near "EXCEPT"`. The `ORDER BY` ends the first query early, so the
          database does not understand the `EXCEPT` that follows. Move `ORDER BY first_name` to the bottom of
          the statement. (Lesson 3 shows how to sort each part on its own, using parentheses.)

      - type: exercise
        id: m08-l02-e1
        title: Robotics and Yearbook
        prompt: |
          Show one column called `student` with the full name of every student who is in **both** the
          **Robotics Club** and the **Yearbook Committee**. Sort A to Z.
        starter: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Robotics Club'
          ___
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Yearbook Committee'
          ORDER BY student;
        solution: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Robotics Club'
          INTERSECT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Yearbook Committee'
          ORDER BY student;
        ordered: true
        columnNames: true
        hints:
          - "It is the Chess and Book Club example again, with two different clubs."
          - "The keyword that keeps only the names found on both lists is `INTERSECT`."
          - "SELECT ... WHERE cl.name = 'Robotics Club' ___ SELECT ... WHERE cl.name = 'Yearbook Committee' ORDER BY student;"
        explanation: |
          **4 students**: Daichi Jones, Hassan Haddad, Layla Hussain and Marta King. The `ORDER BY student` at the
          very end sorts the whole result. The column name comes from the first query, so `AS student` goes there.
        difficulty: 1

      - type: quiz
        id: m08-l02-q1
        question: |
          You have two lists, **A** and **B**. Which keyword returns the rows that are on list **A** but **not**
          on list **B**?
        options: ["INTERSECT", "UNION", "EXCEPT", "UNION ALL"]
        answer: 2
        explanation: |
          `EXCEPT` subtracts. It starts with the first list and removes anything that also appears in the
          second. `INTERSECT` is the opposite idea: it keeps only the rows that both lists share.

      - type: exercise
        id: m08-l02-e2
        title: Chess Club, but not the Debate Team
        prompt: |
          Show one column called `student` with the full name of every student who is in the **Chess Club**
          but **not** in the **Debate Team**. Sort A to Z.
        starter: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          ___
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Debate Team'
          ORDER BY student;
        solution: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          EXCEPT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Debate Team'
          ORDER BY student;
        ordered: true
        columnNames: true
        hints:
          - "Start with the Chess Club list, then remove anyone who is also on the Debate Team list."
          - "The keyword that subtracts the second list from the first is `EXCEPT`."
          - "SELECT ... WHERE cl.name = 'Chess Club' ___ SELECT ... WHERE cl.name = 'Debate Team' ORDER BY student;"
        explanation: |
          **13 students.** The Chess Club has 14 members, and Elif Russo is also in the Debate Team, so she is the
          only name removed. The Chess Club must be the first query, because `EXCEPT` starts from the first list.
        difficulty: 2

      - type: read
        title: What about NULL?
        md: |
          You met `NULL` in the earlier modules: it means "no value". In a `WHERE` clause, `NULL = NULL` is never
          true. Set operations work differently: **two NULLs count as the same value**.

          So `INTERSECT` keeps a single NULL row when both sides have one. Try to predict it in the next question.

      - type: predict
        id: m08-l02-p1
        question: |
          How many rows does this query return?
        sql: |
          SELECT NULL
          INTERSECT
          SELECT NULL;
        options: ["0 rows", "1 row", "2 rows", "An error"]
        answer: 1
        explanation: |
          `INTERSECT` treats two NULLs as the same value, so one NULL row survives. This surprises most people,
          because `NULL = NULL` is never true inside a `WHERE` clause. Set operations are the exception.

      - type: fill
        id: m08-l02-f1
        prompt: |
          Complete the query so it lists the `student_id`s that have an enrollment in **2024-Fall** **and** in
          **2025-Spring**.
        template: |
          SELECT student_id
          FROM enrollments
          WHERE term = '2024-Fall'
          ___
          SELECT student_id
          FROM enrollments
          WHERE term = '2025-Spring';
        answers:
          - ["INTERSECT"]
        explanation: |
          `INTERSECT` keeps only the ids that are on both lists. The result has 108 ids, one per student, because
          `INTERSECT` also removes copies.

      - type: exercise
        id: m08-l02-e3
        title: Fall but not spring
        prompt: |
          Show the `first_name` and `last_name` of every student who was enrolled in a **2024-Fall** course but has
          **no** enrollment in **2025-Spring**. Sort by `last_name`, then by `first_name`.
        starter: |
          SELECT first_name, last_name
          FROM students
          WHERE student_id IN (
              SELECT student_id
              FROM enrollments
              WHERE term = '2024-Fall'
              ___
              SELECT student_id
              FROM enrollments
              WHERE term = '2025-Spring'
          )
          ORDER BY last_name, first_name;
        solution: |
          SELECT first_name, last_name
          FROM students
          WHERE student_id IN (
              SELECT student_id
              FROM enrollments
              WHERE term = '2024-Fall'
              EXCEPT
              SELECT student_id
              FROM enrollments
              WHERE term = '2025-Spring'
          )
          ORDER BY last_name, first_name;
        ordered: true
        hints:
          - "First find the student ids in the fall list that are not in the spring list, then look up their names."
          - "`IN (...)` accepts a list of values from a subquery, and `EXCEPT` removes one list from another."
          - "... WHERE term = '2024-Fall' ___ SELECT student_id FROM enrollments WHERE term = '2025-Spring' ..."
        explanation: |
          **9 students**, such as Marta King and Ruby Robinson. The 108 students who appear in both terms are
          removed. Sorting by last name, then first name, gives a total order, because no two students in this
          list share both names.
        difficulty: 2

      - type: parsons
        id: m08-l02-o1
        prompt: |
          Put the lines in order to list the student ids that are in the **2025-Spring** enrollments but **not**
          in the **2024-Fall** enrollments. Sort by student id.
        lines:
          - SELECT student_id
          - FROM enrollments
          - WHERE term = '2025-Spring'
          - EXCEPT
          - SELECT student_id
          - FROM enrollments
          - WHERE term = '2024-Fall'
          - ORDER BY student_id;
        distractors:
          - INTERSECT
        explanation: |
          `EXCEPT` goes between the two halves, and the spring list is the first one, because it is the list you
          are starting from. `INTERSECT` is the wrong keyword for "not in".

      - type: exercise
        id: m08-l02-e4
        title: In exactly one of the two clubs
        prompt: |
          Show one column called `student` with the full name of every student who is in **exactly one** of the
          **Chess Club** and the **Book Club**, but not both. Sort A to Z.

          The starter below runs without an error, but it gives the wrong answer. Fix it.
        starter: |
          SELECT s.first_name || ' ' || s.last_name AS student
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          EXCEPT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Book Club'
          UNION
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Book Club'
          EXCEPT
          SELECT s.first_name || ' ' || s.last_name
          FROM club_members AS cm
          JOIN clubs AS cl ON cl.club_id = cm.club_id
          JOIN students AS s ON s.student_id = cm.student_id
          WHERE cl.name = 'Chess Club'
          ORDER BY student;
        solution: |
          (SELECT s.first_name || ' ' || s.last_name AS student
           FROM club_members AS cm
           JOIN clubs AS cl ON cl.club_id = cm.club_id
           JOIN students AS s ON s.student_id = cm.student_id
           WHERE cl.name = 'Chess Club'
           EXCEPT
           SELECT s.first_name || ' ' || s.last_name
           FROM club_members AS cm
           JOIN clubs AS cl ON cl.club_id = cm.club_id
           JOIN students AS s ON s.student_id = cm.student_id
           WHERE cl.name = 'Book Club')
          UNION
          (SELECT s.first_name || ' ' || s.last_name
           FROM club_members AS cm
           JOIN clubs AS cl ON cl.club_id = cm.club_id
           JOIN students AS s ON s.student_id = cm.student_id
           WHERE cl.name = 'Book Club'
           EXCEPT
           SELECT s.first_name || ' ' || s.last_name
           FROM club_members AS cm
           JOIN clubs AS cl ON cl.club_id = cm.club_id
           JOIN students AS s ON s.student_id = cm.student_id
           WHERE cl.name = 'Chess Club')
          ORDER BY student;
        ordered: true
        columnNames: true
        hints:
          - "The starter stacks two EXCEPT queries. Think about the order in which PostgreSQL reads them."
          - "`UNION` and `EXCEPT` are read from left to right, so the starter does not do what you want. Wrap each EXCEPT in parentheses."
          - "(SELECT ... WHERE cl.name = 'Chess Club' EXCEPT SELECT ... WHERE cl.name = 'Book Club') ___ (SELECT ... EXCEPT SELECT ...) ORDER BY student;"
        explanation: |
          **20 students**: 10 who are only in the Chess Club, and 10 who are only in the Book Club. Without
          parentheses, PostgreSQL reads `A EXCEPT B UNION B EXCEPT A` from left to right. It first combines
          (A minus B) with B, then removes A. That leaves only the 10 Book Club names. Parentheses make each
          `EXCEPT` a complete unit. The same left-to-right rule applies to `UNION`.
        difficulty: 3

    cheatsheet:
      - title: Keep the rows both lists share
        sql: |
          SELECT name FROM list_a
          INTERSECT
          SELECT name FROM list_b;
        note: INTERSECT keeps only the rows found on both sides, and removes copies.
      - title: Keep the rows of the first list only
        sql: |
          SELECT name FROM list_a
          EXCEPT
          SELECT name FROM list_b;
        note: The first query is your starting list. Swapping the two queries gives different rows.
      - title: Rows on exactly one of two lists
        sql: |
          (SELECT name FROM list_a EXCEPT SELECT name FROM list_b)
          UNION
          (SELECT name FROM list_b EXCEPT SELECT name FROM list_a);
        note: Wrap each EXCEPT in parentheses. Without them, the left-to-right order gives the wrong rows.

  - id: m08-l03
    title: Set operations in practice
    summary: Label each part of a combined report, compare two lists, and sort or limit each part on its own.
    minutes: 30
    dataset: shop
    steps:
      - type: read
        title: Priya's quarterly review
        md: |
          Priya works on the numbers for ShopSmart. Every quarter she sends the owner a short review: which
          products need attention, which customers were lost, and one summary with a total.

          Her review is built from several small questions, and each question gives a list. The set
          operations stack those lists together. Three habits keep her reviews clear:

          1. **Label every part.** A column such as `reason` or `movement` tells the reader where each row came from.
          2. **Sort once, at the very end**, unless one part needs its own sort. Then wrap that part in parentheses.
          3. **Check that the two sides line up**: the same number of columns, the same kinds of values, in the same order.

          > [!REAL-WORLD]
          > Analysts build reports like this all the time. A stacked report with a clear label on each row is
          > easy to check, and easy for the next person to change.

      - type: example
        title: Label each row with its source
        md: |
          A literal (a value written directly in the query, such as `'Discontinued'`) can be a column too. It
          gives every row of its part the same label.

          Press **Run** to stack the discontinued products on top of the cheap ones.
        sql: |
          SELECT 'Discontinued' AS reason, name
          FROM products
          WHERE is_active = false
          UNION ALL
          SELECT 'Under $15', name
          FROM products
          WHERE price < 15
          ORDER BY reason, name;
        after: |
          **8 rows**: the 4 discontinued products, then the 4 products under $15. Now every row says why it is
          in the list.

          `ORDER BY reason, name` puts 'Discontinued' first (D comes before U), then sorts the names inside each
          group. Two sort columns with no ties make the order total.

      - type: example
        title: Find the products nobody has bought
        md: |
          Here you compare two tables. The product catalog lists every product, and `order_items` lists the
          products that were sold. `EXCEPT` keeps the catalog names that never appear in a sale.

          The `JOIN` gives the order lines their product names (module 6).
        sql: |
          SELECT name
          FROM products
          EXCEPT
          SELECT p.name
          FROM order_items AS oi
          JOIN products AS p ON p.product_id = oi.product_id
          ORDER BY name;
        after: |
          **5 products** have never been sold: Mysteries of the Deep Sea, Natural Bamboo Hairbrush, Science Lab
          Starter Kit, Standing Desk 140cm and Zephyr Gaming Laptop X. This is a short list Priya can act on.

      - type: fill
        id: m08-l03-f1
        prompt: |
          Complete the query so it lists the customers who ordered in **2024** but **never** before 2024.
          Keep only the `customer_id`s.
        template: |
          SELECT customer_id
          FROM orders
          WHERE order_date >= '2024-01-01'
          ___
          SELECT customer_id
          FROM orders
          WHERE order_date < '2024-01-01';
        answers:
          - ["EXCEPT"]
        explanation: |
          `EXCEPT` removes every customer who had an order before 2024. In this data that leaves **49 new
          customers**. Using `UNION` here would add the old customers back in.

      - type: viz
        viz: set-ops
        title: Which buyers were lost, and which are new?
        md: |
          These two small lists are made up for illustration: buyers in one year and buyers in the next. Click
          each button and watch which names survive. Then ask yourself: which list does `EXCEPT` start from?
        config:
          a: { name: buyers_2023, values: [Ana, Ben, Chen, Dee] }
          b: { name: buyers_2024, values: [Ben, Dee, Eli] }

      - type: example
        title: Combine two summary lines
        md: |
          Each part of a `UNION ALL` can be a whole question of its own. Here each part counts customers, so
          the stacked result is a two-line summary. A sub-query in `FROM` (module 7) holds each `EXCEPT`.
        sql: |
          SELECT 'Ordered in 2023 only' AS report,
                 COUNT(*) AS customers
          FROM (
              SELECT customer_id FROM orders
              WHERE order_date < '2024-01-01'
              EXCEPT
              SELECT customer_id FROM orders
              WHERE order_date >= '2024-01-01'
          ) AS only_2023
          UNION ALL
          SELECT 'Ordered in 2024 only',
                 COUNT(*)
          FROM (
              SELECT customer_id FROM orders
              WHERE order_date >= '2024-01-01'
              EXCEPT
              SELECT customer_id FROM orders
              WHERE order_date < '2024-01-01'
          ) AS only_2024;
        after: |
          **2 rows**: 6 customers ordered in 2023 and never came back in 2024, and 49 customers are new in 2024.
          Each line of the report is a complete question, and `UNION ALL` stacks the answers with their labels.

      - type: example
        title: Each part with its own LIMIT
        md: |
          Priya also wants the two cheapest and the two most expensive products, each group labelled. Each
          part needs its own `ORDER BY` and `LIMIT`, so each part goes in **parentheses**.
        sql: |
          (SELECT 'Cheapest' AS group_name, name, price
           FROM products
           ORDER BY price ASC
           LIMIT 2)
          UNION ALL
          (SELECT 'Priciest', name, price
           FROM products
           ORDER BY price DESC
           LIMIT 2)
          ORDER BY price;
        after: |
          **4 rows**, sorted by price: Screen Protector 3-Pack at $9.99 and Natural Bamboo Hairbrush at $12.49
          are the Cheapest. Zephyr Gaming Laptop X at $1,299.99 and Aurora 16-inch Pro Laptop at $1,499.99
          are the Priciest.

          The single `ORDER BY price` at the bottom sorts the whole stacked list.

      - type: read
        title: Which parts need parentheses?
        md: |
          Use plain `ORDER BY` or `LIMIT` in the middle of a set operation, and PostgreSQL stops with a syntax
          error. Wrap that part in parentheses and the error goes away.

          Set operations also have a precedence rule (which operator runs first). `INTERSECT` runs **before**
          `UNION` and `EXCEPT`, even though the query is read from left to right.

          > [!MISTAKE]
          > Assuming that `1 UNION 2 INTERSECT 2` is read from left to right. It is not: `INTERSECT` runs
          > first. Wrap any part you are unsure about in parentheses, and the order is clear to the next reader.

      - type: predict
        id: m08-l03-p1
        question: |
          `INTERSECT` runs before `UNION`. How many rows does this query return?
        sql: |
          SELECT 1 AS n
          UNION
          SELECT 2
          INTERSECT
          SELECT 2;
        options: ["1 row", "2 rows", "3 rows", "An error"]
        answer: 1
        explanation: |
          First `2 INTERSECT 2` gives 2. Then `UNION` stacks 1 on top of it, so you get 1 and 2: **2 rows**.
          If you read from left to right, `1 UNION 2` comes first, and `INTERSECT 2` then leaves only 1 row.

      - type: quiz
        id: m08-l03-q1
        question: |
          You want the 2 cheapest and the 2 most expensive products, stacked in one list, with each group labelled.
          Which query is correct?
        options:
          - "SELECT name, price FROM products ORDER BY price LIMIT 2 UNION ALL SELECT name, price FROM products ORDER BY price DESC LIMIT 2"
          - "(SELECT name, price FROM products ORDER BY price LIMIT 2) UNION ALL (SELECT name, price FROM products ORDER BY price DESC LIMIT 2)"
          - "SELECT name, price FROM products UNION ALL SELECT name, price FROM products ORDER BY price LIMIT 4"
        answer: 1
        explanation: |
          Only option 2 wraps each part in parentheses. Option 1 fails with a syntax error, because `LIMIT` sits in
          the middle. Option 3 gives the wrong rows: one `LIMIT 4` at the end keeps the first four rows of the
          whole list, not two from each side.

      - type: example
        title: Count the rows from each source
        md: |
          Wrap a stacked list in a sub-query, then use `GROUP BY` (module 5) on the label. This counts how many
          rows each source contributed. Use `UNION ALL`: `UNION` would drop a row that matches another row
          exactly.
        sql: |
          SELECT reason, COUNT(*) AS items
          FROM (
              SELECT 'Discontinued' AS reason, name
              FROM products
              WHERE is_active = false
              UNION ALL
              SELECT 'Under $15', name
              FROM products
              WHERE price < 15
              UNION ALL
              SELECT 'Over $1,000', name
              FROM products
              WHERE price > 1000
          ) AS review
          GROUP BY reason
          ORDER BY reason;
        after: |
          **3 rows**: Discontinued 4, Over $1,000 3, Under $15 4. Nothing is counted twice, because no product
          is in two groups.

      - type: parsons
        id: m08-l03-o1
        prompt: |
          Put the lines in order to count how many rows each source contributes. Sort by the source label.
        lines:
          - SELECT reason, COUNT(*) AS items
          - FROM (
          - SELECT 'Discontinued' AS reason, name
          - FROM products
          - WHERE is_active = false
          - UNION ALL
          - SELECT 'Under $15', name
          - FROM products
          - WHERE price < 15
          - ) AS review
          - GROUP BY reason
          - ORDER BY reason;
        distractors:
          - UNION
        explanation: |
          `UNION ALL` joins the two sources and keeps every row, so the counts are correct. `UNION` would be the
          wrong choice when you are counting.

      - type: exercise
        id: m08-l03-e1
        title: A labelled stack
        prompt: |
          Show two columns, `reason` and `name`. First list the **discontinued** products, labelled
          `'Discontinued'`. Then list the products priced **above $1,000**, labelled `'Premium'`. Keep every
          row. Sort by `reason`, then by `name`.
        starter: |
          SELECT 'Discontinued' AS reason, name
          FROM products
          WHERE is_active = false
          ___
          SELECT 'Premium', name
          FROM products
          WHERE price > 1000
          ORDER BY reason, name;
        solution: |
          SELECT 'Discontinued' AS reason, name
          FROM products
          WHERE is_active = false
          UNION ALL
          SELECT 'Premium', name
          FROM products
          WHERE price > 1000
          ORDER BY reason, name;
        ordered: true
        columnNames: true
        hints:
          - "It is the labelled-stack example again, with a different label and a different price filter."
          - "You must keep every row, so use the keyword that stacks without removing copies."
          - "SELECT 'Discontinued' AS reason, name FROM products WHERE is_active = false ___ SELECT 'Premium', name FROM products WHERE price > 1000 ORDER BY reason, name;"
        explanation: |
          **7 rows**: 4 discontinued products, then 3 premium products (the laptops priced above $1,000). Because
          'Discontinued' comes before 'Premium' in the alphabet, the discontinued rows come first.
        difficulty: 1

      - type: exercise
        id: m08-l03-e2
        title: Customers lost after 2023
        prompt: |
          Show the `first_name` and `last_name` of every customer who ordered in **2023** but has **no** order in
          **2024**. Sort by `last_name`, then by `first_name`.
        starter: |
          SELECT first_name, last_name
          FROM customers
          WHERE customer_id IN (
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2023-01-01'
                AND order_date < '2024-01-01'
              ___
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2024-01-01'
                AND order_date < '2025-01-01'
          )
          ORDER BY last_name, first_name;
        solution: |
          SELECT first_name, last_name
          FROM customers
          WHERE customer_id IN (
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2023-01-01'
                AND order_date < '2024-01-01'
              EXCEPT
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2024-01-01'
                AND order_date < '2025-01-01'
          )
          ORDER BY last_name, first_name;
        ordered: true
        hints:
          - "Find the customer ids from 2023 first, then remove the ones that also appear in 2024."
          - "The keyword that removes one list from another is `EXCEPT`. The `IN (...)` looks up the names."
          - "SELECT customer_id FROM orders WHERE order_date >= '2023-01-01' AND order_date < '2024-01-01' ___ SELECT customer_id FROM orders WHERE ... ;"
        explanation: |
          **6 customers**, from Samuel Anderson to Diya Rao. `EXCEPT` removes every customer who also ordered in
          2024, and `IN` then looks up their names. Sorting by last name and then first name gives an order with
          no ties.
        difficulty: 2

      - type: exercise
        id: m08-l03-e3
        title: A report with a total row
        prompt: |
          Build a three-row report with two columns, `report` and `customers`:

          1. `'Ordered in 2023'`: the number of different customers with at least one order in 2023.
          2. `'Ordered in 2024'`: the number of different customers with at least one order in 2024.
          3. `'TOTAL (either year)'`: the number of different customers with an order in 2023 **or** 2024.

          Any row order is fine.
        starter: |
          SELECT 'Ordered in 2023' AS report,
                 COUNT(DISTINCT customer_id) AS customers
          FROM orders
          WHERE order_date >= '2023-01-01'
            AND order_date < '2024-01-01'
          UNION ALL
          SELECT 'Ordered in 2024',
                 COUNT(DISTINCT customer_id)
          FROM orders
          WHERE order_date >= '2024-01-01'
            AND order_date < '2025-01-01'
          ___
          SELECT 'TOTAL (either year)', COUNT(*)
          FROM (
              SELECT customer_id FROM orders
              WHERE order_date >= '2023-01-01'
                AND order_date < '2024-01-01'
              UNION
              SELECT customer_id FROM orders
              WHERE order_date >= '2024-01-01'
                AND order_date < '2025-01-01'
          ) AS either_year;
        solution: |
          SELECT 'Ordered in 2023' AS report,
                 COUNT(DISTINCT customer_id) AS customers
          FROM orders
          WHERE order_date >= '2023-01-01'
            AND order_date < '2024-01-01'
          UNION ALL
          SELECT 'Ordered in 2024',
                 COUNT(DISTINCT customer_id)
          FROM orders
          WHERE order_date >= '2024-01-01'
            AND order_date < '2025-01-01'
          UNION ALL
          SELECT 'TOTAL (either year)', COUNT(*)
          FROM (
              SELECT customer_id FROM orders
              WHERE order_date >= '2023-01-01'
                AND order_date < '2024-01-01'
              UNION
              SELECT customer_id FROM orders
              WHERE order_date >= '2024-01-01'
                AND order_date < '2025-01-01'
          ) AS either_year;
        columnNames: true
        hints:
          - "Each of the first two lines is a single query that counts different customers. The third line is the tricky one."
          - "For the total, a `UNION` of the two years removes the customers who ordered in both years, so counting its rows gives the number of different customers."
          - "... ___ SELECT 'TOTAL (either year)', COUNT(*) FROM ( SELECT customer_id FROM orders WHERE ... UNION SELECT customer_id FROM orders WHERE ... ) AS either_year;"
        explanation: |
          **91 customers ordered in 2023, 134 in 2024, and 140 in either year.** The total is less than 91 + 134,
          because 85 customers ordered in both years. `UNION` removes that overlap, so the total row counts each
          customer once.
        difficulty: 2

      - type: exercise
        id: m08-l03-e4
        title: Products that changed
        prompt: |
          Show two columns, `movement` and `product`. List the products that were sold **only in 2023**, labelled
          `'Dropped'`, and the products that were sold **only in 2024**, labelled `'New'`. Each product appears
          once. Sort by `movement`, then by `product`.

          A product was sold in a year if it appears in an order line for an order placed in that year.
        starter: |
          SELECT 'Dropped' AS movement, product
          FROM (
              SELECT p.name AS product
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2023-01-01'
                AND o.order_date < '2024-01-01'
              EXCEPT
              SELECT p.name
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
          ) AS dropped
          ___
          SELECT 'New', product
          FROM (
              SELECT p.name AS product
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
              EXCEPT
              SELECT p.name
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2023-01-01'
                AND o.order_date < '2024-01-01'
          ) AS added
          ORDER BY movement, product;
        solution: |
          SELECT 'Dropped' AS movement, product
          FROM (
              SELECT p.name AS product
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2023-01-01'
                AND o.order_date < '2024-01-01'
              EXCEPT
              SELECT p.name
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
          ) AS dropped
          UNION ALL
          SELECT 'New', product
          FROM (
              SELECT p.name AS product
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
              EXCEPT
              SELECT p.name
              FROM order_items AS oi
              JOIN orders AS o ON o.order_id = oi.order_id
              JOIN products AS p ON p.product_id = oi.product_id
              WHERE o.order_date >= '2023-01-01'
                AND o.order_date < '2024-01-01'
          ) AS added
          ORDER BY movement, product;
        ordered: true
        columnNames: true
        hints:
          - "Solve two smaller questions first: which products were sold only in 2023, and which only in 2024. Each one is an EXCEPT."
          - "Put each question in its own sub-query, then stack the two results with a keyword that keeps every row."
          - "SELECT 'Dropped' AS movement, product FROM (... EXCEPT ...) AS dropped ___ SELECT 'New', product FROM (... EXCEPT ...) AS added ORDER BY movement, product;"
        explanation: |
          **11 rows**: 2 dropped products (Desk Mat XL and Plush Dragon, Large) and 9 new products. Each half is an
          `EXCEPT` in its own sub-query, and `UNION ALL` stacks the two labelled halves. The ORDER BY puts
          'Dropped' before 'New', then sorts by product name.
        difficulty: 3

      - type: exercise
        id: m08-l03-e5
        title: Budget and flagship picks
        prompt: |
          Show two columns, `label` and `name`. Include the **2 cheapest** products, labelled `'Budget'`, and the
          **1 most expensive** product, labelled `'Flagship'`. Sort by `label`, then by `name`.
        starter: |
          (SELECT 'Budget' AS label, name
           FROM products
           ORDER BY price
           LIMIT 2)
          ___
          (SELECT 'Flagship', name
           FROM products
           ORDER BY price DESC
           LIMIT 1)
          ORDER BY label, name;
        solution: |
          (SELECT 'Budget' AS label, name
           FROM products
           ORDER BY price
           LIMIT 2)
          UNION ALL
          (SELECT 'Flagship', name
           FROM products
           ORDER BY price DESC
           LIMIT 1)
          ORDER BY label, name;
        ordered: true
        columnNames: true
        hints:
          - "Each part needs its own ORDER BY and LIMIT, so each part goes in parentheses, as in the cheapest and priciest example."
          - "Use the keyword that stacks two results and keeps every row."
          - "(SELECT 'Budget' AS label, name FROM products ORDER BY price LIMIT 2) ___ (SELECT 'Flagship', name FROM products ORDER BY price DESC LIMIT 1) ORDER BY label, name;"
        explanation: |
          **3 rows**: Natural Bamboo Hairbrush and Screen Protector 3-Pack as Budget, then Aurora 16-inch Pro Laptop
          as Flagship. The prices at the cut-off are all different, so the picks are not ambiguous.
        difficulty: 2

    cheatsheet:
      - title: Label each part of a stacked report
        sql: |
          SELECT 'Discontinued' AS reason, name
          FROM products
          WHERE is_active = false
          UNION ALL
          SELECT 'Under $15', name
          FROM products
          WHERE price < 15
          ORDER BY reason, name;
        note: A literal value in the SELECT list labels every row of its part.
      - title: Compare two lists
        sql: |
          SELECT name FROM products
          EXCEPT
          SELECT p.name
          FROM order_items AS oi
          JOIN products AS p ON p.product_id = oi.product_id;
        note: EXCEPT shows the names that never appear in the second list.
      - title: Sort or limit each part on its own
        sql: |
          (SELECT name, price FROM products
           ORDER BY price LIMIT 2)
          UNION ALL
          (SELECT name, price FROM products
           ORDER BY price DESC LIMIT 2)
          ORDER BY price;
        note: Wrap each part in parentheses. The last ORDER BY sorts the whole stacked result.

