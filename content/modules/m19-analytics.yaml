id: m19
order: 19
title: "Analytics Patterns: The Pro Toolbox"
subtitle: Growth, streaks, sessions, funnels, cohorts and anomalies
icon: "🧰"
level: expert
description: |
  You can already write queries that answer questions. In this module you learn the **patterns** that working analysts use again and again: comparing this month with last year, finding streaks, cutting a stream of events into sessions, measuring a funnel, and tracking customers who came back.

  Every lesson starts with a real business question. You will build the answer one clause at a time with **CTEs** (named helper queries you met in module 9), then practise the same pattern on new data. Most lessons use the **FitTrack** app, the **Harbor Bank** and the **ShopSmart** store, and one uses **FlickNest** movies.

  Take your time. Each pattern looks hard the first time, and becomes ordinary once you have built it yourself.
dataset: app
lessons:
  - id: m19-l01
    title: "Growth metrics: is the business growing?"
    summary: Compare each month with the month before and with the same month last year.
    minutes: 30
    dataset: shop
    steps:
      - type: read
        title: Are we growing?
        md: |
          Mia runs ShopSmart, an online store. She is preparing her quarterly review, and she has one question: **"Are we growing?"**

          Looking at one month on its own does not answer that. December 2024 brought in $30,195.03. Is that good? It depends on what you compare it with.

          This lesson teaches two comparisons:

          - **Month-over-month (MoM):** this month against the month before.
          - **Year-over-year (YoY):** this month against the same month last year.

          We count **revenue** as the money from every order line: `quantity * unit_price * (1 - discount)`. Cancelled orders do not count.

          > [!ANALOGY]
          > A single lap time tells a runner very little. Comparing lap two with lap one tells you whether she is getting faster.

      - type: example
        title: Revenue for each month
        md: |
          First, add up the revenue of every month. `DATE_TRUNC('month', ...)` moves each date to the first day of its month, so every order placed in March 2024 gets the value `2024-03-01`.
        sql: |
          SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          WHERE o.status <> 'cancelled'
          GROUP BY month
          ORDER BY month;
        after: |
          You get one row per month, from January 2023 to December 2024: 24 rows. `<>` means "not equal to", so the `WHERE` clause leaves cancelled orders out.

          Notice that some months are much bigger than others. A single month can go up or down a lot, which is why we need comparisons.

      - type: read
        title: Looking back with LAG
        md: |
          A **window function** works on a row and also looks at other rows. `LAG(revenue)` means "the revenue from the row **before** this one". The `OVER (ORDER BY month)` part says what "before" means: the earlier month.

          `LAG` returns **NULL** (SQL's word for "no value") when there is no earlier row, such as on the very first month.

          > [!ANALOGY]
          > Picture people standing in a bus queue. `LAG` asks each person who is standing just in front of them.

      - type: example
        title: Month-over-month change
        md: |
          The query below first makes the monthly table with a **CTE** called `monthly`. Then it adds the previous month and the percentage change.
        sql: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_prev AS (
              SELECT month,
                     revenue,
                     LAG(revenue) OVER (ORDER BY month) AS prev_month
              FROM monthly
          )
          SELECT month,
                 revenue,
                 prev_month,
                 ROUND(100.0 * (revenue - prev_month) / prev_month, 1) AS mom_pct
          FROM with_prev
          ORDER BY month;
        after: |
          The percentage change is `(new - old) / old * 100`. February 2023 was 38.8% lower than January 2023 (`-38.8`). The first month, January 2023, shows NULL in `prev_month` and `mom_pct`, because nothing came before it.

      - type: quiz
        id: m19-l01-q1
        question: |
          What does `LAG(revenue) OVER (ORDER BY month)` return on the **first** row of the result?
        options:
          - "0"
          - "The revenue of the same row"
          - "NULL, because there is no earlier row"
          - "The total revenue of all rows"
        answer: 2
        explanation: |
          `LAG` looks at the row before the current one. The first row has no row before it, so the answer is NULL. Dividing by NULL gives NULL too, which is why the first month has no growth figure.

      - type: read
        title: Filter after the window, not before
        md: |
          Suppose Mia only wants to see 2024. It is tempting to add `WHERE month >= '2024-01-01'` to the same query.

          That is a trap. The `WHERE` clause runs **before** window functions. The rows it removes are gone, so `LAG` cannot look at them.

          > [!MISTAKE]
          > If you filter in the same `SELECT` as `LAG`, the window only sees the rows that survived the filter. Put window functions in a CTE first, then filter in the query that reads the CTE.

      - type: example
        title: "The trap: filtering too early"
        md: |
          This query is valid SQL and runs without an error. Look closely at the `prev_month` value on the 2024-01 row.
        sql: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          )
          SELECT month,
                 revenue,
                 LAG(revenue) OVER (ORDER BY month) AS prev_month
          FROM monthly
          WHERE month >= '2024-01-01'
          ORDER BY month;
        after: |
          January 2024 shows `prev_month` = NULL. Its real previous month is December 2023 (18,929.69), but the `WHERE` removed that row before `LAG` ran. The next lesson step shows the fix.

      - type: predict
        id: m19-l01-p1
        question: |
          This query keeps only months with revenue above 15,000. What is the `prev_month` value on the **2024-08** row?
        sql: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          )
          SELECT month,
                 revenue,
                 LAG(revenue) OVER (ORDER BY month) AS prev_month
          FROM monthly
          WHERE revenue > 15000
          ORDER BY month;
        options: ["NULL", "12914.95", "18929.69", "15162.30"]
        answer: 2
        explanation: |
          The filter removes every month with revenue of 15,000 or less, so July 2024 disappears. The row before 2024-08 that is still left is December 2023 (18,929.69). Filters run before window functions, so `LAG` jumps straight to that row.

      - type: read
        title: Same month last year
        md: |
          For a **year-over-year** comparison, `LAG(revenue, 12)` looks **12 rows back** instead of one.

          That works because the monthly table has exactly one row per month. Twelve rows back is twelve months back. If a month were missing from the data, the number 12 would point to the wrong month, so keep this in mind.

          > [!TIP]
          > Analysts usually prefer YoY to MoM for businesses with seasons. Christmas sales, for example, make December look huge every year.

      - type: example
        title: Year-over-year growth for 2024
        md: |
          Compute the windows in CTEs first, then keep only 2024 in the last query.
        sql: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_last_year AS (
              SELECT month,
                     revenue,
                     LAG(revenue, 12) OVER (ORDER BY month) AS last_year
              FROM monthly
          )
          SELECT month,
                 revenue,
                 last_year,
                 ROUND(100.0 * (revenue - last_year) / last_year, 1) AS yoy_pct
          FROM with_last_year
          WHERE month >= '2024-01-01'
          ORDER BY month;
        after: |
          In May 2024 revenue was 14,219.49, against 3,146.56 in May 2023. That is `yoy_pct` = 351.9, so revenue grew by almost 352%. In June 2024 the growth was only 9.2%, which is worth asking about.

      - type: exercise
        id: m19-l01-e1
        title: 2024 month by month
        prompt: |
          Show the `month` and the `revenue` of every month in **2024**, oldest month first.

          Leave out cancelled orders. Round `revenue` to 2 decimal places.
        starter: |
          SELECT
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id;
        solution: |
          SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          WHERE o.status <> 'cancelled'
            AND o.order_date >= '2024-01-01'
            AND o.order_date < '2025-01-01'
          GROUP BY month
          ORDER BY month;
        ordered: true
        columnNames: true
        hints:
          - Start from the example. The month comes from `DATE_TRUNC('month', order_date)`.
          - Add a `WHERE` with `status <> 'cancelled'` and the two date limits for 2024, then `GROUP BY month`.
          - "SELECT DATE_TRUNC('month', o.order_date)::date AS month, ROUND(SUM(___), 2) AS revenue FROM ... GROUP BY ___ ORDER BY ___;"
        explanation: |
          You get twelve rows, January to December 2024. The two date limits (`>= '2024-01-01'` and `< '2025-01-01'`) capture the whole year, so you never need to know the last day of each month.
        difficulty: 1

      - type: exercise
        id: m19-l01-e2
        title: Compared with the month before
        prompt: |
          For each month of **2024**, show the `month`, its `revenue` and `prev_month_revenue` (the revenue of the month before). January 2024 must be compared with **December 2023**.

          Leave out cancelled orders, round `revenue` to 2 decimal places and order by `month`.
        starter: |
          SELECT month, revenue
          FROM monthly
          WHERE month >= '2024-01-01';
        solution: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_prev AS (
              SELECT month,
                     revenue,
                     LAG(revenue) OVER (ORDER BY month) AS prev_month_revenue
              FROM monthly
          )
          SELECT month,
                 revenue,
                 prev_month_revenue
          FROM with_prev
          WHERE month >= '2024-01-01'
          ORDER BY month;
        ordered: true
        columnNames: true
        hints:
          - Build the monthly revenue for **all** months first. Filter 2024 at the very end.
          - Put `LAG(revenue) OVER (ORDER BY month)` in a second CTE.
          - "WITH monthly AS (...), with_prev AS (SELECT month, revenue, LAG(revenue) OVER (ORDER BY month) AS ___ FROM monthly) SELECT ... FROM with_prev WHERE month >= '2024-01-01' ORDER BY ___;"
        explanation: |
          If you filter 2024 inside the first CTE, January 2024 has no earlier row and its previous revenue becomes NULL. Filtering in the last query keeps December 2023 in the window, so January is compared correctly.
        difficulty: 2

      - type: exercise
        id: m19-l01-e3
        title: Year-over-year for 2024
        prompt: |
          For each month of **2024**, show `month`, `revenue` and `yoy_pct`. The `yoy_pct` is the percentage change from the same month of 2023, rounded to 1 decimal place.

          Leave out cancelled orders, round `revenue` to 2 decimal places and order by `month`.
        starter: |
          SELECT month, revenue
          FROM monthly
          WHERE month >= '2024-01-01';
        solution: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_last_year AS (
              SELECT month,
                     revenue,
                     LAG(revenue, 12) OVER (ORDER BY month) AS last_year
              FROM monthly
          )
          SELECT month,
                 revenue,
                 ROUND(100.0 * (revenue - last_year) / last_year, 1) AS yoy_pct
          FROM with_last_year
          WHERE month >= '2024-01-01'
          ORDER BY month;
        ordered: true
        columnNames: true
        hints:
          - The same month last year is 12 rows back, so use `LAG(revenue, 12)`.
          - Use the same two CTEs as the year-over-year example, then filter 2024 in the last query.
          - "100.0 * (revenue - ___) / ___"
        explanation: |
          The percentage change is `(this year - last year) / last year * 100`. Because the monthly table has one row per month, `LAG(revenue, 12)` is exactly the same month of the year before.
        difficulty: 2

      - type: exercise
        id: m19-l01-e4
        title: The months that fell
        prompt: |
          List the months of **2024** in which revenue **fell** compared with the month before. January 2024 is compared with December 2023.

          Show the `month` and the `mom_pct` (the month-over-month percentage change, rounded to 1 decimal place). Show the oldest month first. Leave out cancelled orders.
        starter: |
          SELECT month, revenue
          FROM monthly
          WHERE revenue < 0;
        solution: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_prev AS (
              SELECT month,
                     revenue,
                     LAG(revenue) OVER (ORDER BY month) AS prev_revenue
              FROM monthly
          ),
          changes AS (
              SELECT month,
                     ROUND(100.0 * (revenue - prev_revenue) / prev_revenue, 1) AS mom_pct
              FROM with_prev
          )
          SELECT month,
                 mom_pct
          FROM changes
          WHERE month >= '2024-01-01'
            AND mom_pct < 0
          ORDER BY month;
        ordered: true
        columnNames: true
        hints:
          - You need the month-over-month change first, then a filter on it.
          - Compute `mom_pct` in a CTE, then use `WHERE mom_pct < 0 AND month >= '2024-01-01'` in the last query.
          - "WITH monthly AS (...), with_prev AS (... LAG(revenue) OVER (ORDER BY month) AS prev_revenue ...), changes AS (...) SELECT month, mom_pct FROM changes WHERE ___ ORDER BY ___;"
        explanation: |
          Four months fell: January, February, June and September 2024. A "fell" test is only a `WHERE` on the percentage, but the percentage has to be finished in a CTE before you can filter it.
        difficulty: 2

      - type: stepper
        title: Building the year-over-year report
        md: |
          Mia's report is long, so let's build it one stage at a time. Click through the stages and watch the columns grow.
        stages:
          - label: Monthly revenue
            md: Start from one row per month.
            sql: |
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
              ORDER BY month;
          - label: Same month last year
            md: "`LAG(revenue, 12)` adds the value from twelve rows back. The first twelve months have no match, so they show NULL."
            sql: |
              WITH monthly AS (
                  SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                         ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
                  FROM orders AS o
                  JOIN order_items AS i
                    ON i.order_id = o.order_id
                  WHERE o.status <> 'cancelled'
                  GROUP BY month
              )
              SELECT month,
                     revenue,
                     LAG(revenue, 12) OVER (ORDER BY month) AS last_year
              FROM monthly
              ORDER BY month;
          - label: Percentage change
            md: Now turn the two numbers into a percentage.
            sql: |
              WITH monthly AS (
                  SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                         ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
                  FROM orders AS o
                  JOIN order_items AS i
                    ON i.order_id = o.order_id
                  WHERE o.status <> 'cancelled'
                  GROUP BY month
              ),
              with_last_year AS (
                  SELECT month,
                         revenue,
                         LAG(revenue, 12) OVER (ORDER BY month) AS last_year
                  FROM monthly
              )
              SELECT month,
                     revenue,
                     ROUND(100.0 * (revenue - last_year) / last_year, 1) AS yoy_pct
              FROM with_last_year
              ORDER BY month;
          - label: Only 2024
            md: Filter last, after the window has seen all the months.
            sql: |
              WITH monthly AS (
                  SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                         ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
                  FROM orders AS o
                  JOIN order_items AS i
                    ON i.order_id = o.order_id
                  WHERE o.status <> 'cancelled'
                  GROUP BY month
              ),
              with_last_year AS (
                  SELECT month,
                         revenue,
                         LAG(revenue, 12) OVER (ORDER BY month) AS last_year
                  FROM monthly
              )
              SELECT month,
                     revenue,
                     ROUND(100.0 * (revenue - last_year) / last_year, 1) AS yoy_pct
              FROM with_last_year
              WHERE month >= '2024-01-01'
              ORDER BY month;

      - type: read
        title: Running totals
        md: |
          A **running total** (also called a **cumulative** total) adds up every row so far. You write it with `SUM(...) OVER (ORDER BY ...)`. It is the same window idea as `LAG`, but `SUM` adds the values from the first row up to the current row.

          Mia likes to know how far the year has got: "How much have we sold so far this year?"

      - type: example
        title: Revenue so far in 2024
        md: |
          Here the `WHERE` clause **should** run first, because we want the total to start in January 2024.
        sql: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          year_2024 AS (
              SELECT month, revenue
              FROM monthly
              WHERE month >= '2024-01-01'
          )
          SELECT month,
                 revenue,
                 SUM(revenue) OVER (ORDER BY month) AS running_total
          FROM year_2024
          ORDER BY month;
        after: |
          By December 2024 the running total is 170,226.77, which is the whole year's revenue. Each row shows the total up to and including that month.

      - type: example
        title: Each category's share of revenue
        md: |
          A **contribution %** (share) tells you how big each slice is. Divide each category's revenue by the grand total. The `SUM(revenue) OVER ()` with empty brackets adds up **all** the rows, so it gives the grand total.
        sql: |
          WITH lines AS (
              SELECT c.name AS category,
                     i.quantity * i.unit_price * (1 - i.discount) AS line_total
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              JOIN categories AS c
                ON c.category_id = p.category_id
              WHERE o.status <> 'cancelled'
                AND o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
          ),
          by_category AS (
              SELECT category, SUM(line_total) AS revenue
              FROM lines
              GROUP BY category
          )
          SELECT category,
                 ROUND(revenue, 2) AS revenue,
                 ROUND(100.0 * revenue / SUM(revenue) OVER (), 1) AS share_pct
          FROM by_category
          ORDER BY share_pct DESC
          LIMIT 3;
        after: |
          Phones are the biggest slice at 26.9% of 2024 revenue, then Laptops (17.0%) and Kitchen (12.7%). All the shares of all categories add up to 100.

      - type: exercise
        id: m19-l01-e5
        title: Who makes the money?
        prompt: |
          For **2024** (cancelled orders excluded), show each product category's `category` name and its `share_pct`. The `share_pct` is the category's revenue as a percentage of the total 2024 revenue, rounded to 1 decimal place.

          Order by `share_pct` from largest to smallest, then by `category` A to Z.
        starter: |
          SELECT c.name AS category
          FROM categories AS c;
        solution: |
          WITH lines AS (
              SELECT c.name AS category,
                     i.quantity * i.unit_price * (1 - i.discount) AS line_total
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              JOIN categories AS c
                ON c.category_id = p.category_id
              WHERE o.status <> 'cancelled'
                AND o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
          ),
          by_category AS (
              SELECT category, SUM(line_total) AS revenue
              FROM lines
              GROUP BY category
          )
          SELECT category,
                 ROUND(100.0 * revenue / SUM(revenue) OVER (), 1) AS share_pct
          FROM by_category
          ORDER BY share_pct DESC, category;
        ordered: true
        columnNames: true
        hints:
          - Start from the example. Remove the `LIMIT` and keep only the two columns asked for.
          - The share is `100.0 * revenue / SUM(revenue) OVER ()`.
          - "... ROUND(100.0 * ___ / SUM(___) OVER (), 1) AS share_pct FROM by_category ORDER BY share_pct DESC, ___;"
        explanation: |
          There are eleven categories with sales. Phones (26.9%) come first, Beauty (1.7%) last, and the shares add up to 100. The category name is a tie-breaker, so the order is always the same.
        difficulty: 3

      - type: fill
        id: m19-l01-f1
        prompt: Complete the window function that reads the previous month's revenue.
        template: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          )
          SELECT month,
                 revenue,
                 ___(revenue) OVER (ORDER BY month) AS prev_month
          FROM monthly
          ORDER BY month;
        answers:
          - ["LAG", "lag"]
        explanation: "`LAG` looks back one row. `LEAD` does the opposite and looks forward. Both need an `OVER (ORDER BY ...)` to say what 'before' and 'after' mean."

      - type: exercise
        id: m19-l01-e6
        title: The biggest jump in 2024
        prompt: |
          Find the single month of **2024** with the **highest** year-over-year growth. Show its `month` and its `yoy_pct`, rounded to 1 decimal place.

          Cancelled orders are excluded, and each month is compared with the same month of 2023.
        starter: |
          SELECT DATE_TRUNC('month', order_date)::date AS month
          FROM orders
          LIMIT 1;
        solution: |
          WITH monthly AS (
              SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY month
          ),
          with_last_year AS (
              SELECT month,
                     revenue,
                     LAG(revenue, 12) OVER (ORDER BY month) AS last_year
              FROM monthly
          ),
          growth AS (
              SELECT month,
                     ROUND(100.0 * (revenue - last_year) / last_year, 1) AS yoy_pct
              FROM with_last_year
          )
          SELECT month,
                 yoy_pct
          FROM growth
          WHERE month >= '2024-01-01'
          ORDER BY yoy_pct DESC
          LIMIT 1;
        columnNames: true
        hints:
          - Use the YoY CTEs from the stepper, then keep one row.
          - Filter the months to 2024 and sort by `yoy_pct` from highest to lowest.
          - "... FROM growth WHERE month >= '2024-01-01' ORDER BY ___ DESC LIMIT ___;"
        explanation: |
          May 2024 grew the most against May 2023: 351.9%. It is a stretch exercise because it combines a window function, a CTE chain, a filter placed after the window and a `LIMIT`. Every step you practised in this lesson is in it.
        difficulty: 3

    cheatsheet:
      - title: Previous row with LAG
        sql: LAG(revenue) OVER (ORDER BY month)
        note: "NULL on the first row. Use LAG(revenue, 12) for the same month last year."
      - title: Percentage change
        sql: ROUND(100.0 * (new_value - old_value) / old_value, 1)
        note: "Write 100.0 with a decimal point, so the division is not rounded down to a whole number."
      - title: Running total
        sql: SUM(revenue) OVER (ORDER BY month)
        note: "Adds up every row so far, from the first row to the current one."
      - title: Filter after window functions
        sql: |
          WITH x AS (SELECT ..., LAG(...) OVER (...) FROM ...)
          SELECT ... FROM x WHERE ...;
        note: "WHERE runs before window functions, so put the window in a CTE and filter in the outer query."

  - id: m19-l02
    title: "Gaps and islands: streaks and missing days"
    summary: Find unbroken runs of days (streaks) and the missing days between them.
    minutes: 30
    dataset: app
    steps:
      - type: read
        title: Streaks, gaps and islands
        md: |
          FitTrack gives users a badge for a **streak**: days in a row with step data from a connected tracker. Coach Priya wants three answers:

          - Which users have the longest streaks?
          - Where did each user's data stop?
          - Which breaks are long enough to need a follow-up message?

          Each row of `daily_steps` is one day with data. A **missing day** means the tracker sent nothing that day.

          In SQL language, a streak is an **island**: an unbroken run of consecutive days. The **gap** is the run of missing days between two islands.

          > [!ANALOGY]
          > Picture a map of the sea. Each island is land with no water in between. The water between two islands is the gap.

      - type: example
        title: The raw days for user 2
        md: |
          Start by looking at the data for one user. The 12 rows below are sorted by day.
        sql: |
          SELECT user_id,
                 day,
                 steps
          FROM daily_steps
          WHERE user_id = 2
          ORDER BY day
          LIMIT 12;
        after: |
          Days 1 to 6 (March 1 to 6) are consecutive. Then the dates jump from March 6 straight to March 14. Those missing days (March 7 to 13) are the gap.

      - type: read
        title: "The trick: subtract the row number"
        md: |
          We need a label that is **the same for every day in one island** and different for the next island. The trick is to subtract a row number from the day. Look at this small example:

          | day | row number | day minus row number |
          |---|---|---|
          | 1 | 1 | 0 |
          | 2 | 2 | 0 |
          | 3 | 3 | 0 |
          | 5 | 4 | 1 |
          | 6 | 5 | 1 |

          Inside an island, the day goes up by one and the row number also goes up by one, so the difference stays the same. When day 4 is missing, the day jumps by two but the row number only moves by one. The difference changes, and so the label changes.

          > [!TIP]
          > The label looks like a strange date, such as `2024-02-29`. It is only a key. You use it to group, and nobody reads it.

      - type: example
        title: Labelling each day with its island key
        md: |
          `ROW_NUMBER() OVER (...)` numbers the rows, one, two, three and so on. The `PARTITION BY user_id` restarts the numbering for each user.
        sql: |
          SELECT user_id,
                 day,
                 ROW_NUMBER() OVER (
                     PARTITION BY user_id
                     ORDER BY day
                 ) AS rn,
                 day - (ROW_NUMBER() OVER (
                     PARTITION BY user_id
                     ORDER BY day
                 ))::int AS island_key
          FROM daily_steps
          WHERE user_id = 2
          ORDER BY day
          LIMIT 12;
        after: |
          Days 1 to 6 all share the key `2024-02-29`. Days 7 to 12 share the key `2024-03-07`. The key is not a real date with a meaning. It is just a label that stays the same while the days keep running on.

      - type: example
        title: The islands of user 2
        md: |
          Now group by the label. Each group is one island, so `COUNT(*)` counts its days.
        sql: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          )
          SELECT user_id,
                 MIN(day) AS start_day,
                 MAX(day) AS end_day,
                 COUNT(*) AS days
          FROM numbered
          WHERE user_id = 2
          GROUP BY user_id, day - rn::int
          ORDER BY start_day;
        after: |
          User 2 has four streaks: 6 days, then 46 days, then 28 days, then 2 days. Notice that you never wrote a condition about "consecutive". The grouping did that work for you.

      - type: quiz
        id: m19-l02-q1
        question: |
          Why does `day - ROW_NUMBER()` give the **same** value for every day in one island?
        options:
          - Because the database sorts the days alphabetically.
          - Because the day and the row number both go up by one inside an unbroken run, so their difference stays the same.
          - Because `GROUP BY` removes duplicate values.
          - Because `ROW_NUMBER` restarts at 1 for every island.
        answer: 1
        explanation: |
          Inside an island, each new day is one day later and one row further down, so the two increases cancel out. A gap makes the day jump by more than the row number does, so the label changes. `ROW_NUMBER` restarts for each user, not for each island.

      - type: example
        title: The longest streaks in FitTrack
        md: |
          Remove the `WHERE` clause and sort all streaks by length.
        sql: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          )
          SELECT user_id,
                 MIN(day) AS start_day,
                 MAX(day) AS end_day,
                 COUNT(*) AS days
          FROM numbered
          GROUP BY user_id, day - rn::int
          ORDER BY days DESC, user_id
          LIMIT 3;
        after: |
          Users 38 and 84 both have a 92-day streak: every day from March 1 to May 31, 2024. That is a **tie**. The second column in `ORDER BY`, `user_id`, decides which one comes first. Without a tie-breaker, the order could change between runs.

      - type: read
        title: Finding the gaps
        md: |
          A **gap** is the space between the end of one island and the start of the next. To see the next island, use `LEAD`. It is the opposite of `LAG`: it looks at the row **after** the current one.

          Once you have the next start, the gap is easy:

          - `gap_start` = the end of this island + 1 day
          - `gap_end` = the start of the next island - 1 day
          - `missing_days` = the next start - the end of this island - 1

          > [!MISTAKE]
          > Forgetting `PARTITION BY user_id` is a classic error. Without it, the row numbers run across **all** users, so the islands of different users get mixed together and the counts are wrong.

      - type: example
        title: The gaps of user 2
        md: |
          The first CTE finds the islands. The second CTE looks at the next island with `LEAD`. The final query turns the two dates into the gap.
        sql: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          ),
          islands AS (
              SELECT user_id,
                     MIN(day) AS start_day,
                     MAX(day) AS end_day
              FROM numbered
              GROUP BY user_id, day - rn::int
          ),
          with_next AS (
              SELECT user_id,
                     end_day,
                     LEAD(start_day) OVER (PARTITION BY user_id ORDER BY start_day) AS next_start
              FROM islands
          )
          SELECT user_id,
                 end_day + 1 AS gap_start,
                 next_start - 1 AS gap_end,
                 next_start - end_day - 1 AS missing_days
          FROM with_next
          WHERE user_id = 2
            AND next_start IS NOT NULL
          ORDER BY gap_start;
        after: |
          User 2 has three gaps: 7 missing days in March, 2 in late April and 1 at the end of May. The last island has no `next_start`, so the `IS NOT NULL` check removes it. A gap is only counted between two islands.

      - type: predict
        id: m19-l02-p1
        question: |
          The query below labels each day of user 2 with its island key. What is the `island_key` on the **2024-03-14** row?
        sql: |
          SELECT day,
                 day - (ROW_NUMBER() OVER (
                     PARTITION BY user_id
                     ORDER BY day
                 ))::int AS island_key
          FROM daily_steps
          WHERE user_id = 2
            AND day BETWEEN '2024-03-05' AND '2024-03-16'
          ORDER BY day;
        options: ["2024-03-14", "2024-03-07", "2024-02-29", "7"]
        answer: 1
        explanation: |
          March 14 is the seventh row of user 2 (days 1 to 6 are March 1 to 6). Its key is `2024-03-14 - 7 = 2024-03-07`. The day in the first column is still the real date; only the label is computed.

      - type: fill
        id: m19-l02-f1
        prompt: Complete the window function that numbers each user's days. It is the first step of the island trick.
        template: |
          SELECT user_id,
                 day,
                 day - (___() OVER (PARTITION BY user_id ORDER BY day))::int AS island_key
          FROM daily_steps
          WHERE user_id = 2
          ORDER BY day
          LIMIT 8;
        answers:
          - ["ROW_NUMBER", "row_number"]
        explanation: "`ROW_NUMBER()` gives 1, 2, 3 and so on. Inside `OVER`, the `PARTITION BY` restarts the count for each user and the `ORDER BY` says in which order to count."

      - type: stepper
        title: Building user 2's streak report
        md: |
          Let's build the streak report for user 2, one stage at a time. Click through the stages. Each one runs, and you can see what it adds.
        stages:
          - label: Number the days
            md: Give each day a row number, from the first day of data.
            sql: |
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (
                         PARTITION BY user_id
                         ORDER BY day
                     ) AS rn
              FROM daily_steps
              WHERE user_id = 2
              ORDER BY day
              LIMIT 8;
          - label: Make the island key
            md: Subtract the row number from the day. Days in the same run now share a key.
            sql: |
              SELECT user_id,
                     day,
                     day - (ROW_NUMBER() OVER (
                         PARTITION BY user_id
                         ORDER BY day
                     ))::int AS island_key
              FROM daily_steps
              WHERE user_id = 2
              ORDER BY day
              LIMIT 8;
          - label: Count each island
            md: Group by the key and count the days in each group.
            sql: |
              WITH numbered AS (
                  SELECT user_id,
                         day,
                         ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
                  FROM daily_steps
                  WHERE user_id = 2
              )
              SELECT MIN(day) AS start_day,
                     MAX(day) AS end_day,
                     COUNT(*) AS days
              FROM numbered
              GROUP BY day - rn::int
              ORDER BY start_day;
          - label: Only long streaks
            md: Keep only the streaks of at least 30 days, using HAVING.
            sql: |
              WITH numbered AS (
                  SELECT user_id,
                         day,
                         ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
                  FROM daily_steps
                  WHERE user_id = 2
              )
              SELECT MIN(day) AS start_day,
                     MAX(day) AS end_day,
                     COUNT(*) AS days
              FROM numbered
              GROUP BY day - rn::int
              HAVING COUNT(*) >= 30
              ORDER BY start_day;

      - type: exercise
        id: m19-l02-e1
        title: One user's streaks
        prompt: |
          For **user 23**, list each unbroken run of step-tracking days, with `start_day`, `end_day` and `days`. Show the oldest run first.
        starter: |
          SELECT
          FROM daily_steps
          WHERE user_id = 23;
        solution: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          )
          SELECT MIN(day) AS start_day,
                 MAX(day) AS end_day,
                 COUNT(*) AS days
          FROM numbered
          WHERE user_id = 23
          GROUP BY day - rn::int
          ORDER BY start_day;
        ordered: true
        columnNames: true
        hints:
          - Use the same CTE as the user 2 example, and change the user id.
          - Put the `WHERE user_id = 23` in the last query. The row numbers already restart for each user.
          - "SELECT MIN(day) AS start_day, MAX(day) AS end_day, COUNT(*) AS days FROM numbered WHERE user_id = ___ GROUP BY day - ___;"
        explanation: |
          User 23 has three runs: 67 days, then 6 days, then 10 days. The `WHERE` in the last query is safe here because the numbering was already done for each user.
        difficulty: 1

      - type: exercise
        id: m19-l02-e2
        title: The three longest streaks
        prompt: |
          Find the **three longest streaks** in FitTrack, across all users. Show `user_id`, `start_day`, `end_day` and `days`.

          Order by `days` from longest to shortest, then by `user_id` from smallest to largest.
        starter: |
          SELECT user_id, day
          FROM daily_steps
          ORDER BY day
          LIMIT 3;
        solution: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          )
          SELECT user_id,
                 MIN(day) AS start_day,
                 MAX(day) AS end_day,
                 COUNT(*) AS days
          FROM numbered
          GROUP BY user_id, day - rn::int
          ORDER BY days DESC, user_id
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - The example "longest streaks" is almost the answer.
          - Keep the `ORDER BY days DESC, user_id` and the `LIMIT 3`.
          - "... GROUP BY user_id, day - rn::int ORDER BY ___ DESC, ___ LIMIT ___;"
        explanation: |
          Users 38 and 84 tie with 92 days, so the smaller `user_id` (38) comes first. The third place is user 54 with 83 days. Ties at the cut-off would make the answer unclear, so always check that the boundary is not a tie.
        difficulty: 2

      - type: exercise
        id: m19-l02-e3
        title: Users with many streaks
        prompt: |
          Show each user who has **at least 10 separate streaks**, with `user_id` and `streaks` (the number of streaks that user has).

          Order by `streaks` from most to fewest, then by `user_id` from smallest to largest.
        starter: |
          SELECT user_id, COUNT(*) AS streaks
          FROM daily_steps
          GROUP BY user_id;
        solution: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          ),
          islands AS (
              SELECT user_id
              FROM numbered
              GROUP BY user_id, day - rn::int
          )
          SELECT user_id,
                 COUNT(*) AS streaks
          FROM islands
          GROUP BY user_id
          HAVING COUNT(*) >= 10
          ORDER BY streaks DESC, user_id;
        ordered: true
        columnNames: true
        hints:
          - First make one row per island, using the same `GROUP BY` as before.
          - Then count the rows per user in the last query.
          - "... islands AS (SELECT user_id FROM numbered GROUP BY user_id, ___) SELECT user_id, COUNT(*) AS streaks FROM islands GROUP BY user_id HAVING ___;"
        explanation: |
          Each row of `islands` is one streak, so `COUNT(*)` per user counts streaks. User 29 has the most with 14. Users 12 and 76 both have 12 and are ordered by `user_id`.
        difficulty: 2

      - type: exercise
        id: m19-l02-e4
        title: The breaks in user 12's data
        prompt: |
          For **user 12**, show every gap between two streaks: `gap_start`, `gap_end` and `missing_days`. Show the earliest gap first.

          Do not count days before the first streak or after the last one.
        starter: |
          SELECT user_id, day
          FROM daily_steps
          WHERE user_id = 12
          ORDER BY day;
        solution: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          ),
          islands AS (
              SELECT user_id,
                     MIN(day) AS start_day,
                     MAX(day) AS end_day
              FROM numbered
              GROUP BY user_id, day - rn::int
          ),
          with_next AS (
              SELECT user_id,
                     end_day,
                     LEAD(start_day) OVER (PARTITION BY user_id ORDER BY start_day) AS next_start
              FROM islands
          )
          SELECT end_day + 1 AS gap_start,
                 next_start - 1 AS gap_end,
                 next_start - end_day - 1 AS missing_days
          FROM with_next
          WHERE user_id = 12
            AND next_start IS NOT NULL
          ORDER BY gap_start;
        ordered: true
        columnNames: true
        hints:
          - Use the three CTEs from the gaps example, with `user_id = 12`.
          - A gap exists only when `next_start` is not NULL.
          - "end_day + 1 AS gap_start, next_start - 1 AS gap_end, next_start - end_day - 1 AS missing_days"
        explanation: |
          User 12 has eleven breaks. The longest is 10 missing days, at the end of March 2024. Notice that `LEAD` returns NULL for the last island, so the `IS NOT NULL` check keeps the results honest.
        difficulty: 2

      - type: parsons
        id: m19-l02-o1
        prompt: |
          Put the lines in the right order to list one row per streak for **every** user, with the earliest streak of each user first.
        lines:
          - WITH numbered AS (
          - SELECT user_id, day,
          - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
          - FROM daily_steps
          - )
          - SELECT user_id,
          - MIN(day) AS start_day, MAX(day) AS end_day, COUNT(*) AS days
          - FROM numbered
          - GROUP BY user_id, day - rn::int
          - ORDER BY user_id, start_day;
        distractors:
          - GROUP BY user_id;

      - type: exercise
        id: m19-l02-e5
        title: Long breaks (stretch)
        prompt: |
          Find the users who have at least one **break of 7 or more missing days** between two streaks. Show `user_id` and `longest_gap`, the number of days in their longest break.

          Order by `longest_gap` from largest to smallest, then by `user_id` from smallest to largest.
        starter: |
          SELECT user_id
          FROM daily_steps
          GROUP BY user_id;
        solution: |
          WITH numbered AS (
              SELECT user_id,
                     day,
                     ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
              FROM daily_steps
          ),
          islands AS (
              SELECT user_id,
                     MIN(day) AS start_day,
                     MAX(day) AS end_day
              FROM numbered
              GROUP BY user_id, day - rn::int
          ),
          with_next AS (
              SELECT user_id,
                     end_day,
                     LEAD(start_day) OVER (PARTITION BY user_id ORDER BY start_day) AS next_start
              FROM islands
          ),
          gaps AS (
              SELECT user_id,
                     next_start - end_day - 1 AS missing_days
              FROM with_next
              WHERE next_start IS NOT NULL
          )
          SELECT user_id,
                 MAX(missing_days) AS longest_gap
          FROM gaps
          GROUP BY user_id
          HAVING MAX(missing_days) >= 7
          ORDER BY longest_gap DESC, user_id;
        ordered: true
        columnNames: true
        hints:
          - Build the gaps as in the previous exercise, then take the maximum per user.
          - Use `HAVING MAX(missing_days) >= 7` to keep the users with a long break.
          - "... GROUP BY user_id HAVING MAX(___) >= 7 ORDER BY longest_gap DESC, user_id;"
        explanation: |
          Six users have a break of at least 7 days. User 88 has the longest, at 19 days. Users 2, 21 and 76 all have a longest break of exactly 7 days, so `user_id` decides their order.
        difficulty: 3

    cheatsheet:
      - title: Label each island
        sql: "day - (ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day))::int"
        note: "Days in one unbroken run share the same value. Use it in GROUP BY."
      - title: Streak length and dates
        sql: |
          SELECT MIN(day), MAX(day), COUNT(*)
          FROM numbered
          GROUP BY user_id, day - rn::int;
        note: "MIN and MAX give the first and last day, COUNT gives the length."
      - title: Next island with LEAD
        sql: "LEAD(start_day) OVER (PARTITION BY user_id ORDER BY start_day)"
        note: "LEAD looks at the next row. It returns NULL for the last island."
      - title: Missing days between islands
        sql: "next_start - end_day - 1"
        note: "Date minus date gives the number of days between them."

  - id: m19-l03
    title: "Sessionization: cutting events into visits"
    summary: Split a stream of events into sessions using a 30-minute gap rule.
    minutes: 30
    dataset: app
    steps:
      - type: read
        title: The event log has no visits
        md: |
          Omar runs product at FitTrack. He asks: "How long does someone spend in the app each time they open it?"

          The event log has one row per tap, with no column called "session". A **session** is a *visit*: a group of events that happen close together. We have to create the sessions ourselves.

          The rule we will use is simple:

          > A new session starts when a user's next event comes **more than 30 minutes** after their previous event.

          The first event a user ever sends also starts a session, because there is no previous event to be close to.

          > [!ANALOGY]
          > Imagine a coffee shop. If you sit down, order, and leave the table for less than half an hour, you are still in the same visit. If you come back after an hour, it is a new visit.

      - type: example
        title: The gap between events
        md: |
          `LAG` (from the last module) looks at the previous event of the **same user**. Subtracting it from the current time gives the **gap**.
        sql: |
          SELECT user_id,
                 event_time,
                 event_name,
                 event_time - LAG(event_time) OVER (
                     PARTITION BY user_id
                     ORDER BY event_time
                 ) AS gap
          FROM events
          WHERE user_id = 3
          ORDER BY event_time;
        after: |
          User 3 has four events. The first one has no previous event, so its gap is NULL. The second event came less than two minutes after the first. The third came about 16 days after the second, which is clearly a new visit.

      - type: read
        title: Flag the new visits, then number them
        md: |
          Two steps turn gaps into sessions:

          1. **Flag** each event that starts a new session: `1` if the gap is NULL (the first event) or bigger than 30 minutes, otherwise `0`.
          2. **Number** the sessions with a running total of the flags: `SUM(new_session) OVER (PARTITION BY user_id ORDER BY event_time)`.

          The running total goes up by one every time a new session starts, so every event gets the number of its session. You have met the running-total idea in the last lesson.

      - type: example
        title: Session numbers for user 3
        md: |
          Here are the two steps together. Each event now carries its session number.
        sql: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE
                         WHEN gap IS NULL
                           OR gap > INTERVAL '30 minutes'
                         THEN 1
                         ELSE 0
                     END AS new_session
              FROM gaps
          )
          SELECT user_id,
                 event_time,
                 SUM(new_session) OVER (
                     PARTITION BY user_id
                     ORDER BY event_time
                 ) AS session_no
          FROM flagged
          WHERE user_id = 3
          ORDER BY event_time;
        after: |
          The first two events are session 1, because they are less than 30 minutes apart. The next two events are sessions 2 and 3, each a visit on its own.

      - type: quiz
        id: m19-l03-q1
        question: |
          What does the `gap` column show for a user's **first** event?
        options:
          - "0"
          - "NULL, because there is no previous event"
          - "The time of day when the event happened"
          - "An error"
        answer: 1
        explanation: |
          `LAG` returns NULL when there is no earlier row, so the gap is NULL too. The flag checks `gap IS NULL` on purpose, so that the very first event of every user always starts a session.

      - type: example
        title: One row per session
        md: |
          Now summarize each session of user 94. The `GROUP BY session_no` makes one row for each visit.
        sql: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     event_time,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          )
          SELECT session_no,
                 MIN(event_time) AS started_at,
                 MAX(event_time) AS ended_at,
                 COUNT(*) AS events
          FROM numbered
          WHERE user_id = 94
          GROUP BY session_no
          ORDER BY session_no;
        after: |
          User 94 had twelve visits in 2024. Some visits were a single event, such as the app being opened once, and others had two events a few minutes apart.

      - type: read
        title: How long was a session?
        md: |
          The **length** of a session is the time between its first and last event: `MAX(event_time) - MIN(event_time)`.

          A session with one event has a length of zero. That is correct: the user opened the app and did nothing else before the 30 minutes ran out.

          > [!MISTAKE]
          > Always put `PARTITION BY user_id` in the window. Without it, the gap between the last event of one user and the first event of the next user would be counted, and visits would run across people.

          > [!TIP]
          > The 30-minute rule is a convention. Many web analytics tools use it by default. For FitTrack's data, any rule between 30 minutes and about 3 hours gives exactly the same sessions, because the gaps are either short or very long.

      - type: predict
        id: m19-l03-p1
        question: |
          This query uses a **2-hour** rule. How many sessions does it count?
        sql: |
          WITH gaps AS (
              SELECT user_id,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          )
          SELECT COUNT(*) AS sessions
          FROM gaps
          WHERE gap IS NULL
             OR gap > INTERVAL '2 hours';
        options: ["4122", "7010", "280", "1"]
        answer: 0
        explanation: |
          Every event is either within 30 minutes of the one before it, or more than 3 hours after it. A 2-hour rule therefore splits the events in exactly the same places as a 30-minute rule. The 280 is the number of users who have events, which is a common wrong guess.

      - type: stepper
        title: Building user 94's visits step by step
        md: |
          Let's build the visit list for user 94, one stage at a time. Click through the stages to see each column appear.
        stages:
          - label: The gaps
            md: Find the time since the previous event of the same user.
            sql: |
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
              WHERE user_id = 94
              ORDER BY event_time;
          - label: The new-visit flag
            md: "A `1` marks each event that starts a new visit."
            sql: |
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM (
                  SELECT user_id,
                         event_time,
                         event_time - LAG(event_time) OVER (
                             PARTITION BY user_id
                             ORDER BY event_time
                         ) AS gap
                  FROM events
                  WHERE user_id = 94
              ) AS g
              ORDER BY event_time;
          - label: The visit number
            md: A running total of the flags gives each event its visit number.
            sql: |
              WITH gaps AS (
                  SELECT user_id,
                         event_time,
                         event_time - LAG(event_time) OVER (
                             PARTITION BY user_id
                             ORDER BY event_time
                         ) AS gap
                  FROM events
                  WHERE user_id = 94
              ),
              flagged AS (
                  SELECT user_id,
                         event_time,
                         CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                              THEN 1 ELSE 0 END AS new_session
                  FROM gaps
              )
              SELECT event_time,
                     SUM(new_session) OVER (ORDER BY event_time) AS session_no
              FROM flagged
              ORDER BY event_time;
          - label: One row per visit
            md: Group by the visit number to see start, end and size.
            sql: |
              WITH gaps AS (
                  SELECT user_id,
                         event_time,
                         event_time - LAG(event_time) OVER (
                             PARTITION BY user_id
                             ORDER BY event_time
                         ) AS gap
                  FROM events
                  WHERE user_id = 94
              ),
              flagged AS (
                  SELECT event_time,
                         CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                              THEN 1 ELSE 0 END AS new_session
                  FROM gaps
              ),
              numbered AS (
                  SELECT event_time,
                         SUM(new_session) OVER (ORDER BY event_time) AS session_no
                  FROM flagged
              )
              SELECT session_no,
                     MIN(event_time) AS started_at,
                     COUNT(*) AS events
              FROM numbered
              GROUP BY session_no
              ORDER BY session_no;

      - type: example
        title: The totals for all of FitTrack
        md: |
          The same idea works for the whole table. Count the events, count the new visits, and divide.
        sql: |
          WITH gaps AS (
              SELECT user_id,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          )
          SELECT COUNT(*) AS events,
                 SUM(new_session) AS sessions,
                 ROUND(COUNT(*)::numeric / SUM(new_session), 2)
                     AS events_per_session
          FROM flagged;
        after: |
          The 7,010 events make 4,122 sessions, about 1.70 events per session. Most visits are a single tap or two, because many people open the app, check one thing, and leave.

      - type: fill
        id: m19-l03-f1
        prompt: Complete the gap rule. A gap longer than 30 minutes starts a new session.
        template: |
          WITH gaps AS (
              SELECT user_id,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          )
          SELECT COUNT(*) AS new_sessions
          FROM gaps
          WHERE gap IS NULL
             OR gap > INTERVAL '___ minutes';
        answers:
          - ["30"]
        explanation: "`INTERVAL '30 minutes'` is a length of time. Compare a gap with it using `>`. The result is the same 4,122 sessions as before, because the first event of each user is counted through `gap IS NULL`."

      - type: parsons
        id: m19-l03-o1
        prompt: |
          Put the lines in the right order to number the visits of user 3, one row per event.
        lines:
          - WITH gaps AS (
          - SELECT user_id, event_time,
          - event_time - LAG(event_time) OVER (PARTITION BY user_id ORDER BY event_time) AS gap
          - FROM events
          - )
          - SELECT user_id, event_time,
          - SUM(CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes' THEN 1 ELSE 0 END)
          -   OVER (PARTITION BY user_id ORDER BY event_time) AS session_no
          - FROM gaps
          - WHERE user_id = 3
          - ORDER BY event_time;
        distractors:
          - GROUP BY user_id;

      - type: exercise
        id: m19-l03-e1
        title: Visits of one user
        prompt: |
          For **user 3**, list each visit with `session_no`, `started_at` (the time of its first event) and `events` (how many events it has).

          Order by `session_no`.
        starter: |
          SELECT session_no
          FROM events
          WHERE user_id = 3;
        solution: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     event_time,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          )
          SELECT session_no,
                 MIN(event_time) AS started_at,
                 COUNT(*) AS events
          FROM numbered
          WHERE user_id = 3
          GROUP BY session_no
          ORDER BY session_no;
        ordered: true
        columnNames: true
        hints:
          - Start from the session summary example and change the user id to 3.
          - Keep `MIN(event_time)` and `COUNT(*)`. Drop the `MAX` column.
          - "... FROM numbered WHERE user_id = ___ GROUP BY ___ ORDER BY session_no;"
        explanation: |
          User 3 has three visits: two events on 1 January, then one event on 17 January and one on 18 January. Each visit starts with its own `session_no`.
        difficulty: 1

      - type: exercise
        id: m19-l03-e2
        title: Your most active users
        prompt: |
          Find the users who have at least **50 visits** in total. Show `user_id` and `sessions` (the number of visits of that user).

          Order by `sessions` from most to fewest, then by `user_id` from smallest to largest.
        starter: |
          SELECT user_id, COUNT(*) AS sessions
          FROM events
          GROUP BY user_id;
        solution: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          )
          SELECT user_id,
                 COUNT(DISTINCT session_no) AS sessions
          FROM numbered
          GROUP BY user_id
          HAVING COUNT(DISTINCT session_no) >= 50
          ORDER BY sessions DESC, user_id;
        ordered: true
        columnNames: true
        hints:
          - Each visit has a unique number per user, so count the distinct session numbers.
          - "COUNT(DISTINCT session_no) counts visits."
          - "... GROUP BY user_id HAVING COUNT(DISTINCT session_no) >= ___ ORDER BY ___ DESC, user_id;"
        explanation: |
          Nine users have 50 or more visits. User 157 leads with 83, and users 42 and 69 tie at 55, so `user_id` puts 42 before 69. A `DISTINCT` count is the clean way to count visits when each visit has its own number.
        difficulty: 2

      - type: exercise
        id: m19-l03-e3
        title: The average visit
        prompt: |
          What is the **average length of a visit**, in minutes, across all visits of all users? Show it as `avg_minutes`, rounded to 1 decimal place.

          The length of a visit is the time from its first event to its last event.
        starter: |
          SELECT AVG(event_time)
          FROM events;
        solution: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     event_time,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          ),
          visits AS (
              SELECT MIN(event_time) AS started,
                     MAX(event_time) AS ended
              FROM numbered
              GROUP BY user_id, session_no
          )
          SELECT ROUND(AVG(EXTRACT(EPOCH FROM (ended - started)) / 60), 1)
                 AS avg_minutes
          FROM visits;
        columnNames: true
        hints:
          - Build one row per visit, with its start and end, using the visit numbers from the earlier examples.
          - "The length in minutes is `EXTRACT(EPOCH FROM (ended - started)) / 60`."
          - "SELECT ROUND(AVG(EXTRACT(EPOCH FROM (ended - started)) / 60), 1) AS avg_minutes FROM visits;"
        explanation: |
          An average over 4,122 visits is about 5.5 minutes. Most visits are very short, so the average is pulled down by all the single-event visits, which last zero minutes.
        difficulty: 2

      - type: exercise
        id: m19-l03-e4
        title: Visit length by platform
        prompt: |
          For each `platform` (from the `users` table), show the number of visits as `sessions` and the average visit length in minutes as `avg_minutes`, rounded to 1 decimal place.

          Order by `platform` A to Z.
        starter: |
          SELECT platform, COUNT(*) AS sessions
          FROM users
          GROUP BY platform;
        solution: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     event_time,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          ),
          visits AS (
              SELECT user_id,
                     MIN(event_time) AS started,
                     MAX(event_time) AS ended
              FROM numbered
              GROUP BY user_id, session_no
          )
          SELECT u.platform,
                 COUNT(*) AS sessions,
                 ROUND(AVG(EXTRACT(EPOCH FROM (v.ended - v.started)) / 60), 1)
                     AS avg_minutes
          FROM visits AS v
          JOIN users AS u
            ON u.user_id = v.user_id
          GROUP BY u.platform
          ORDER BY u.platform;
        ordered: true
        columnNames: true
        hints:
          - Build one row per visit first, then join it to `users` to get the platform.
          - "JOIN users AS u ON u.user_id = v.user_id"
          - "... GROUP BY u.platform ORDER BY ___;"
        explanation: |
          iOS visits last longest on average (6.3 minutes), Android visits are shortest (4.6 minutes), and web is in between at 5.3. Joining the visits to `users` after you have built them keeps the logic clear.
        difficulty: 2

      - type: exercise
        id: m19-l03-e5
        title: Did the visit include a workout? (stretch)
        prompt: |
          How many visits include at least one `workout_completed` event? Show `sessions_with_workout` and `share_pct`, the percentage of all visits that include one, rounded to 1 decimal place.
        starter: |
          SELECT COUNT(*) AS sessions_with_workout
          FROM events
          WHERE event_name = 'workout_completed';
        solution: |
          WITH gaps AS (
              SELECT user_id,
                     event_time,
                     event_name,
                     event_time - LAG(event_time) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS gap
              FROM events
          ),
          flagged AS (
              SELECT user_id,
                     event_time,
                     event_name,
                     CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                          THEN 1 ELSE 0 END AS new_session
              FROM gaps
          ),
          numbered AS (
              SELECT user_id,
                     event_name,
                     SUM(new_session) OVER (
                         PARTITION BY user_id
                         ORDER BY event_time
                     ) AS session_no
              FROM flagged
          ),
          visits AS (
              SELECT BOOL_OR(event_name = 'workout_completed') AS has_workout
              FROM numbered
              GROUP BY user_id, session_no
          )
          SELECT COUNT(*) FILTER (WHERE has_workout) AS sessions_with_workout,
                 ROUND(100.0 * COUNT(*) FILTER (WHERE has_workout) / COUNT(*), 1)
                     AS share_pct
          FROM visits;
        columnNames: true
        hints:
          - Build one row per visit, and mark each visit with `BOOL_OR(event_name = 'workout_completed')`.
          - Count the marked visits with `COUNT(*) FILTER (WHERE has_workout)`, and divide by the total number of visits.
          - "... ROUND(100.0 * COUNT(*) FILTER (WHERE ___) / COUNT(*), 1) AS share_pct FROM visits;"
        explanation: |
          There are 4,122 visits, and 868 of them include a finished workout, about 21.1%. Counting the events alone (923 `workout_completed` events) would give a different answer, because one visit can hold several events and the question asks about visits.
        difficulty: 3

    cheatsheet:
      - title: Gap since the previous event
        sql: "event_time - LAG(event_time) OVER (PARTITION BY user_id ORDER BY event_time)"
        note: "NULL for each user's first event."
      - title: Start a new visit
        sql: "CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes' THEN 1 ELSE 0 END"
        note: "1 marks the first event of a visit."
      - title: Number the visits
        sql: "SUM(new_session) OVER (PARTITION BY user_id ORDER BY event_time)"
        note: "A running total of the flags. Each visit gets its own number."
      - title: Length of a visit
        sql: "MAX(event_time) - MIN(event_time)"
        note: "GROUP BY user_id, session_no first. Use EXTRACT(EPOCH FROM ...) / 60 for minutes."

  - id: m19-l04
    title: "Funnels: how many users reach the end?"
    summary: Measure how many users reach each step, in order, and where they drop off.
    minutes: 30
    dataset: app
    steps:
      - type: read
        title: Where do users drop off?
        md: |
          Priya, the growth lead at FitTrack, has one big question: **"Of the people who download the app, how many become paying subscribers, and where do we lose the others?"**

          A **funnel** is a list of steps that a user is expected to take, in order. Here the steps are:

          1. Open the app (`app_open`)
          2. Start a workout (`workout_started`)
          3. Complete a workout (`workout_completed`)
          4. Start a subscription (`subscription_started`)

          Two numbers matter at every step:

          - **Users reaching the step:** how many people did it at least once.
          - **Conversion:** the share of the previous step's users who made it to this step. The rest are the **drop-off**.

          > [!ANALOGY]
          > A funnel for water works the same way: a lot goes in at the top, and less and less comes out at the bottom. The narrow part shows where the leaks are.

      - type: example
        title: How many users reached each step?
        md: |
          Count the **distinct** users for each event. The `CASE` numbers the steps, and `LAG` and `FIRST_VALUE` compare each step with the one before and with the first step.
        sql: |
          WITH per_step AS (
              SELECT CASE event_name
                         WHEN 'app_open' THEN 1
                         WHEN 'workout_started' THEN 2
                         WHEN 'workout_completed' THEN 3
                         WHEN 'subscription_started' THEN 4
                     END AS step_no,
                     event_name,
                     COUNT(DISTINCT user_id) AS users
              FROM events
              WHERE event_name IN (
                  'app_open', 'workout_started',
                  'workout_completed', 'subscription_started'
              )
              GROUP BY event_name
          )
          SELECT step_no,
                 event_name,
                 users,
                 ROUND(100.0 * users / LAG(users) OVER (ORDER BY step_no), 1)
                     AS pct_of_previous,
                 ROUND(100.0 * users / FIRST_VALUE(users) OVER (ORDER BY step_no), 1)
                     AS pct_of_start
          FROM per_step
          ORDER BY step_no;
        after: |
          280 users opened the app, 156 of them started a workout (55.7% of the opening users), 133 completed one, and 102 subscribed. Only 36.4% of all users who opened the app ever subscribed.

          Be careful: this counts users who did each event **at some point**, in any order. The next step checks the order.

      - type: read
        title: The order matters
        md: |
          Suppose a user subscribes **before** they ever finish a workout. Did they go through the funnel? Depends on what you are measuring. Priya wants to know whether the **path** works, so each step must happen **after** the step before it.

          To check the order, we first find each user's **first** time for every step, using `MIN(event_time) FILTER (WHERE ...)`. Then we compare those times.

          > [!MISTAKE]
          > `COUNT(*)` counts taps, not users. A user who opens the app 8 times is counted 8 times. For funnels, always count `DISTINCT user_id`.

      - type: example
        title: The ordered funnel, user by user
        md: |
          For each user we keep the time of the first event of each type. Then each step is only counted when it happened **after** the step before it.
        sql: |
          WITH firsts AS (
              SELECT user_id,
                     MIN(event_time) FILTER (WHERE event_name = 'app_open')
                         AS opened,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                         AS started,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                         AS completed,
                     MIN(event_time) FILTER (WHERE event_name = 'subscription_started')
                         AS subscribed
              FROM events
              GROUP BY user_id
          )
          SELECT COUNT(opened) AS opened,
                 COUNT(*) FILTER (WHERE started > opened) AS started,
                 COUNT(*) FILTER (WHERE started > opened
                                  AND completed > started) AS completed,
                 COUNT(*) FILTER (WHERE started > opened
                                  AND completed > started
                                  AND subscribed > completed) AS subscribed
          FROM firsts;
        after: |
          The first three steps give the same numbers as before: 280, 156, 133. But only **42** users subscribed after they had completed a workout. The other 60 subscribers either subscribed before finishing a workout or never finished one. So the path "workout, then subscription" is much rarer than the bare numbers suggested.

      - type: quiz
        id: m19-l04-q1
        question: |
          Why does the funnel use `COUNT(DISTINCT user_id)` instead of `COUNT(*)`?
        options:
          - Because `DISTINCT` makes the query run faster.
          - Because one user can trigger the same event many times, and a funnel counts people, not taps.
          - Because `COUNT(*)` cannot be used with `FILTER`.
          - Because the events table has no `user_id` column.
        answer: 1
        explanation: |
          A funnel answers "how many people reached this step?". One user can tap `app_open` hundreds of times, so `COUNT(*)` would overstate the number of people. `DISTINCT` counts each user once.

      - type: example
        title: The funnel for each platform
        md: |
          Join the events to `users` and count distinct users per platform. Each row is one platform's funnel.
        sql: |
          SELECT u.platform,
                 COUNT(DISTINCT e.user_id)
                     FILTER (WHERE e.event_name = 'app_open') AS opened,
                 COUNT(DISTINCT e.user_id)
                     FILTER (WHERE e.event_name = 'workout_started') AS started,
                 COUNT(DISTINCT e.user_id)
                     FILTER (WHERE e.event_name = 'workout_completed') AS completed
          FROM events AS e
          JOIN users AS u
            ON u.user_id = e.user_id
          GROUP BY u.platform
          ORDER BY u.platform;
        after: |
          iOS has the most users at every step: 127 opened the app, 71 started a workout and 63 completed one.

          Big groups always look bigger, though. To compare platforms fairly, divide by the users who opened the app. Android starts a workout at 56.0% (56 of 100), iOS at 55.9% (71 of 127) and web at 54.7% (29 of 53). The **rates** are what you compare.

      - type: example
        title: Users who never started a workout
        md: |
          The drop-off between two steps is often easiest to see by looking for the people who did **not** continue. `NOT EXISTS` finds users who have no matching `workout_started` event.
        sql: |
          SELECT COUNT(*) AS opened_never_started
          FROM users AS u
          WHERE EXISTS (
                SELECT 1
                FROM events AS e
                WHERE e.user_id = u.user_id
                  AND e.event_name = 'app_open'
              )
            AND NOT EXISTS (
                SELECT 1
                FROM events AS e
                WHERE e.user_id = u.user_id
                  AND e.event_name = 'workout_started'
              );
        after: |
          124 users opened the app and never started a workout. That is the biggest leak in the funnel: 280 - 156 = 124, the number of users who fell out at step 2.

      - type: predict
        id: m19-l04-p1
        question: |
          This query lists users with **no** `workout_started` event at all, including users who never opened the app. How many rows does it return?
        sql: |
          SELECT u.user_id
          FROM users AS u
          LEFT JOIN events AS e
            ON e.user_id = u.user_id
           AND e.event_name = 'workout_started'
          WHERE e.event_id IS NULL;
        options: ["124", "144", "20", "300"]
        answer: 1
        explanation: |
          There are 300 users and 156 of them started a workout, so 144 have no `workout_started` event. That includes the 20 users who never did anything in the app. The 124 is the number who opened the app but never started a workout, which is a stricter question.

      - type: read
        title: Reading a funnel
        md: |
          When you read a funnel, always ask three things:

          - Is the denominator right? "55.7% of users started a workout" means 156 out of 280 users who opened the app.
          - Is the order right? A user who subscribed before a workout still reached the subscription step, but did not follow the path.
          - Are the groups the same size? Compare rates, not only raw counts.

      - type: stepper
        title: Building the ordered funnel
        md: |
          Let's build the ordered funnel, one stage at a time. Click through the stages and watch the numbers shrink.
        stages:
          - label: First time per step
            md: For each user, find the first time of each of the four events.
            sql: |
              SELECT user_id,
                     MIN(event_time) FILTER (WHERE event_name = 'app_open')
                         AS opened,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                         AS started,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                         AS completed,
                     MIN(event_time) FILTER (WHERE event_name = 'subscription_started')
                         AS subscribed
              FROM events
              GROUP BY user_id
              ORDER BY user_id
              LIMIT 6;
          - label: Check the order
            md: A step counts only if it happened after the step before it. `NULL` means the user never did that step.
            sql: |
              WITH firsts AS (
                  SELECT user_id,
                         MIN(event_time) FILTER (WHERE event_name = 'app_open')
                             AS opened,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                             AS started,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                             AS completed
                  FROM events
                  GROUP BY user_id
              )
              SELECT user_id,
                     started > opened AS in_order_2,
                     completed > started AS in_order_3
              FROM firsts
              ORDER BY user_id
              LIMIT 6;
          - label: Count each step
            md: Count the users who reached each step in order.
            sql: |
              WITH firsts AS (
                  SELECT user_id,
                         MIN(event_time) FILTER (WHERE event_name = 'app_open')
                             AS opened,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                             AS started,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                             AS completed,
                         MIN(event_time) FILTER (WHERE event_name = 'subscription_started')
                             AS subscribed
                  FROM events
                  GROUP BY user_id
              )
              SELECT COUNT(opened) AS opened,
                     COUNT(*) FILTER (WHERE started > opened) AS started,
                     COUNT(*) FILTER (WHERE started > opened
                                      AND completed > started) AS completed,
                     COUNT(*) FILTER (WHERE started > opened
                                      AND completed > started
                                      AND subscribed > completed) AS subscribed
              FROM firsts;
          - label: Percent of the start
            md: Divide each count by the users who opened the app. Use the same ordered logic.
            sql: |
              WITH firsts AS (
                  SELECT user_id,
                         MIN(event_time) FILTER (WHERE event_name = 'app_open')
                             AS opened,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                             AS started,
                         MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                             AS completed,
                         MIN(event_time) FILTER (WHERE event_name = 'subscription_started')
                             AS subscribed
                  FROM events
                  GROUP BY user_id
              ),
              counts AS (
                  SELECT COUNT(opened) AS opened,
                         COUNT(*) FILTER (WHERE started > opened) AS started,
                         COUNT(*) FILTER (WHERE started > opened
                                          AND completed > started) AS completed,
                         COUNT(*) FILTER (WHERE started > opened
                                          AND completed > started
                                          AND subscribed > completed) AS subscribed
                  FROM firsts
              )
              SELECT ROUND(100.0 * started / opened, 1) AS pct_started,
                     ROUND(100.0 * completed / opened, 1) AS pct_completed,
                     ROUND(100.0 * subscribed / opened, 1) AS pct_subscribed
              FROM counts;

      - type: fill
        id: m19-l04-f1
        prompt: Complete the query so that each platform counts **users**, not taps.
        template: |
          SELECT u.platform,
                 COUNT(___ e.user_id)
                     FILTER (WHERE e.event_name = 'app_open') AS opened_users
          FROM events AS e
          JOIN users AS u
            ON u.user_id = e.user_id
          GROUP BY u.platform
          ORDER BY u.platform;
        answers:
          - ["DISTINCT", "distinct"]
        explanation: "`COUNT(DISTINCT e.user_id)` counts each user once, however many times they opened the app. Without `DISTINCT`, heavy app users would be counted many times."

      - type: parsons
        id: m19-l04-o1
        prompt: |
          Put the lines in the right order to count the users who started a workout **after** opening the app.
        lines:
          - WITH firsts AS (
          - SELECT user_id,
          - MIN(event_time) FILTER (WHERE event_name = 'app_open') AS opened,
          - MIN(event_time) FILTER (WHERE event_name = 'workout_started') AS started
          - FROM events
          - GROUP BY user_id
          - )
          - SELECT COUNT(*) FILTER (WHERE started > opened) AS started_after_open
          - FROM firsts;
        distractors:
          - GROUP BY event_name;

      - type: exercise
        id: m19-l04-e1
        title: Users who did each step
        prompt: |
          For each of the four funnel events (`app_open`, `workout_started`, `workout_completed` and `subscription_started`), count the **distinct users** who did it at least once.

          Show the `event_name` and the `users`, in step order: `app_open` first, then the others in the order listed.
        starter: |
          SELECT event_name, COUNT(*) AS users
          FROM events
          GROUP BY event_name;
        solution: |
          SELECT event_name,
                 COUNT(DISTINCT user_id) AS users
          FROM events
          WHERE event_name IN (
              'app_open', 'workout_started',
              'workout_completed', 'subscription_started'
          )
          GROUP BY event_name
          ORDER BY CASE event_name
                       WHEN 'app_open' THEN 1
                       WHEN 'workout_started' THEN 2
                       WHEN 'workout_completed' THEN 3
                       ELSE 4
                   END;
        ordered: true
        columnNames: true
        hints:
          - Start from the first example. Keep only the four events and count distinct users.
          - The rows must come out in step order, so a `CASE` in `ORDER BY` helps.
          - "SELECT event_name, COUNT(DISTINCT ___) AS users FROM events WHERE event_name IN (...) GROUP BY event_name ORDER BY CASE ... END;"
        explanation: |
          `workout_completed` has 133 users, and `subscription_started` 102. The `CASE` in `ORDER BY` puts the steps in the funnel's order, which a plain alphabetical sort would not do.
        difficulty: 1

      - type: exercise
        id: m19-l04-e2
        title: How much is left at each step?
        prompt: |
          Using the four funnel events, show each step's `event_name`, its `users` (distinct users who did it at least once) and `pct_of_start`, the share of the `app_open` users, rounded to 1 decimal place.

          Show the steps in funnel order.
        starter: |
          SELECT event_name, COUNT(DISTINCT user_id) AS users
          FROM events
          GROUP BY event_name;
        solution: |
          WITH per_step AS (
              SELECT CASE event_name
                         WHEN 'app_open' THEN 1
                         WHEN 'workout_started' THEN 2
                         WHEN 'workout_completed' THEN 3
                         WHEN 'subscription_started' THEN 4
                     END AS step_no,
                     event_name,
                     COUNT(DISTINCT user_id) AS users
              FROM events
              WHERE event_name IN (
                  'app_open', 'workout_started',
                  'workout_completed', 'subscription_started'
              )
              GROUP BY event_name
          )
          SELECT event_name,
                 users,
                 ROUND(100.0 * users / FIRST_VALUE(users) OVER (ORDER BY step_no), 1)
                     AS pct_of_start
          FROM per_step
          ORDER BY step_no;
        ordered: true
        columnNames: true
        hints:
          - Build the four counts with `CASE` numbers, as in the first example.
          - Use `FIRST_VALUE(users) OVER (ORDER BY step_no)` to get the `app_open` count on every row.
          - "ROUND(100.0 * users / FIRST_VALUE(___) OVER (ORDER BY ___), 1) AS pct_of_start"
        explanation: |
          The app_open row is 100.0 by definition. Only 36.4% of users who opened the app ever subscribed, and 47.5% completed a workout. Dividing by the **first** step, not the previous one, shows the overall reach of the funnel.
        difficulty: 2

      - type: exercise
        id: m19-l04-e3
        title: Opened but never started
        prompt: |
          For each `referral_source` (from `users`), count the users who **opened the app** but **never started a workout**. Show `referral_source` and `never_started`.

          Order by `never_started` from largest to smallest, then by `referral_source` A to Z.
        starter: |
          SELECT referral_source, COUNT(*) AS never_started
          FROM users
          GROUP BY referral_source;
        solution: |
          SELECT u.referral_source,
                 COUNT(*) AS never_started
          FROM users AS u
          WHERE EXISTS (
                SELECT 1
                FROM events AS e
                WHERE e.user_id = u.user_id
                  AND e.event_name = 'app_open'
              )
            AND NOT EXISTS (
                SELECT 1
                FROM events AS e
                WHERE e.user_id = u.user_id
                  AND e.event_name = 'workout_started'
              )
          GROUP BY u.referral_source
          ORDER BY never_started DESC, u.referral_source;
        ordered: true
        columnNames: true
        hints:
          - Start from the "Users who never started a workout" example, then group by `referral_source`.
          - "Both conditions go in the WHERE clause: one for opened (EXISTS) and one for not started (NOT EXISTS)."
          - "... FROM users AS u WHERE EXISTS (...) AND NOT EXISTS (...) GROUP BY ___ ORDER BY never_started DESC, ___;"
        explanation: |
          Organic users have the biggest group that never started a workout (50). The rule for finding them is always the same: EXISTS for "did the first step", NOT EXISTS for "never did the next one".
        difficulty: 2

      - type: exercise
        id: m19-l04-e4
        title: The ordered funnel per platform
        prompt: |
          For each `platform` (from `users`), count the users in the **ordered** funnel:

          - `opened`: the user has an `app_open` event
          - `started`: their first `workout_started` came after their first `app_open`
          - `completed`: their first `workout_completed` came after their first `workout_started` (which must also be after the opening)

          Show `platform`, `opened`, `started` and `completed`, ordered by `platform` A to Z.
        starter: |
          SELECT u.platform, COUNT(*) AS opened
          FROM users AS u
          GROUP BY u.platform;
        solution: |
          WITH firsts AS (
              SELECT user_id,
                     MIN(event_time) FILTER (WHERE event_name = 'app_open')
                         AS opened,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_started')
                         AS started,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                         AS completed
              FROM events
              GROUP BY user_id
          )
          SELECT u.platform,
                 COUNT(f.opened) AS opened,
                 COUNT(*) FILTER (WHERE f.started > f.opened) AS started,
                 COUNT(*) FILTER (WHERE f.started > f.opened
                                  AND f.completed > f.started) AS completed
          FROM firsts AS f
          JOIN users AS u
            ON u.user_id = f.user_id
          GROUP BY u.platform
          ORDER BY u.platform;
        ordered: true
        columnNames: true
        hints:
          - Build the first time per user per step, then count with `FILTER` and the order checks.
          - Join to `users` after the `firsts` CTE to get the platform.
          - "... COUNT(*) FILTER (WHERE f.started > f.opened AND f.completed > ___) ..."
        explanation: |
          Android has 100 users who opened the app, and 56 of them started a workout after opening. Each step is counted only when it follows the step before it, so every count is the same as or smaller than the count above it.
        difficulty: 3

      - type: exercise
        id: m19-l04-e5
        title: Where do users get stuck? (stretch)
        prompt: |
          For the countries with **at least 10 users who opened the app**, find the three countries with the highest share of opened users who **never completed a workout** (`workout_completed`).

          Show `country`, `opened_users` and `not_completed_pct` (the percentage, rounded to 1 decimal place). Order by `not_completed_pct` from highest to lowest, then by `country`.
        starter: |
          SELECT u.country, COUNT(*) AS opened_users
          FROM users AS u
          GROUP BY u.country
          LIMIT 3;
        solution: |
          WITH firsts AS (
              SELECT user_id,
                     MIN(event_time) FILTER (WHERE event_name = 'app_open')
                         AS opened,
                     MIN(event_time) FILTER (WHERE event_name = 'workout_completed')
                         AS completed
              FROM events
              GROUP BY user_id
          ),
          by_country AS (
              SELECT u.country,
                     COUNT(f.opened) AS opened_users,
                     COUNT(f.opened) - COUNT(f.completed) AS not_completed
              FROM firsts AS f
              JOIN users AS u
                ON u.user_id = f.user_id
              GROUP BY u.country
              HAVING COUNT(f.opened) >= 10
          )
          SELECT country,
                 opened_users,
                 ROUND(100.0 * not_completed / opened_users, 1) AS not_completed_pct
          FROM by_country
          ORDER BY not_completed_pct DESC, country
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Count the opened users and the completers per country, then subtract.
          - Use `HAVING COUNT(f.opened) >= 10` to keep countries with enough users.
          - "ROUND(100.0 * ___ / ___, 1) ... ORDER BY not_completed_pct DESC, country LIMIT 3"
        explanation: |
          Brazil is at the top: 71.4% of its 21 opened users never completed a workout, followed by Mexico (70.0%) and France (66.7%). Small countries can swing a lot, which is why the rule of at least 10 users matters.
        difficulty: 3

    cheatsheet:
      - title: Count distinct users
        sql: "COUNT(DISTINCT user_id) FILTER (WHERE event_name = 'app_open')"
        note: "A funnel counts people, not taps."
      - title: First time per user and step
        sql: "MIN(event_time) FILTER (WHERE event_name = 'workout_started')"
        note: "One row per user, with the first time of each step. NULL means the step never happened."
      - title: Conversion from the start
        sql: "ROUND(100.0 * users / FIRST_VALUE(users) OVER (ORDER BY step_no), 1)"
        note: "Divide each step by the first one to see the overall reach."
      - title: Users with no matching event
        sql: "WHERE NOT EXISTS (SELECT 1 FROM events e WHERE e.user_id = u.user_id)"
        note: "NOT EXISTS keeps users with no match. It is the drop-off finder."

  - id: m19-l05
    title: "Cohort retention: do new users come back?"
    summary: Group users by signup month and measure how many return in each week after signing up.
    minutes: 35
    dataset: app
    steps:
      - type: read
        title: Groups of users who started together
        md: |
          Priya's next question is: **"Do the people who joined in January still use the app? And do the people who joined in June do better or worse?"**

          To compare fairly, group users by when they **signed up**. Each group is a **cohort**: all the users who joined in the same month. Then ask, for each cohort: how many came back in week 1, in week 2, and so on?

          The share of a cohort that is active in a given week is called **retention**.

          > [!ANALOGY]
          > Think of a school class that starts together in September. Each term you count how many of the original students are still coming to class. That is cohort retention.

      - type: example
        title: The size of each cohort
        md: |
          `DATE_TRUNC('month', signup_date)` moves each signup date to the first day of its month. Users with the same value belong to the same cohort.
        sql: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month,
                 COUNT(*) AS users
          FROM users
          GROUP BY cohort_month
          ORDER BY cohort_month;
        after: |
          Six cohorts, one per month from January to June 2024. January is the biggest with 57 users, February the smallest with 38. These 300 users are the **denominator** for every retention figure in this lesson.

      - type: read
        title: Counting weeks since signup
        md: |
          Each user has a **week number** for every event: how many whole weeks have passed since the signup day.

          - Week 0 is the signup week: days 0 to 6 after signup.
          - Week 1 is days 7 to 13, week 2 is days 14 to 20, and so on.

          Subtracting two dates gives a whole number of days. Dividing that by 7 gives the week. In SQL, dividing a whole number by a whole number **throws away the decimals**, so `10 / 7` is `1`. That is exactly what we want.

          > [!MISTAKE]
          > Retention must be divided by the **cohort size**, not by the number of users who were active. If you divide by the active users, every cohort looks like it has 100% retention in week 0 and you learn nothing.

      - type: example
        title: The weeks one user came back in
        md: |
          `SELECT DISTINCT` gives one row per user and week. The same user can have many events in one week, but each week is counted once.
        sql: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT user_id,
                 week_no
          FROM weeks
          WHERE user_id = 3
          ORDER BY week_no;
        after: |
          User 3 was active in week 0 (the signup week) and then again in week 2. Nothing happened in week 1, so there is no row for it. That gap is normal: people come back in irregular patterns.

      - type: example
        title: How many users were active each week?
        md: |
          Count the distinct users in each cohort and each week. Use a `LEFT JOIN` from `users` so that users with no events at all are still counted in the cohort size.
        sql: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                 COUNT(DISTINCT u.user_id) AS cohort_size,
                 COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 0) AS w0,
                 COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 1) AS w1,
                 COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 2) AS w2,
                 COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 3) AS w3
          FROM users AS u
          LEFT JOIN weeks AS w
            ON w.user_id = u.user_id
          GROUP BY cohort_month
          ORDER BY cohort_month;
        after: |
          The January cohort has 57 users, and 31 of them were active in week 1. Across all cohorts, 280 users were active in week 0, 163 in week 1, 132 in week 2 and 104 in week 3. These are raw counts, so they are hard to compare between cohorts of different sizes.

      - type: quiz
        id: m19-l05-q1
        question: |
          Why must the retention denominator be the **whole cohort**, rather than only the users who were active in week 0?
        options:
          - Because active users are always more than the cohort size.
          - Because retention asks what share of the people who signed up came back, so people who never came back must be counted.
          - Because a `LEFT JOIN` requires the whole table.
          - Because the denominator must be a multiple of 7.
        answer: 1
        explanation: |
          If you only count the people who showed up, you cannot see the users who left. Retention is a share of everyone who started, so the denominator is the whole cohort.

      - type: example
        title: Retention as a percentage
        md: |
          Divide each count by the cohort size. Multiply by 100.0 for a percentage, and round to 1 decimal place.
        sql: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 0)
                       / COUNT(DISTINCT u.user_id), 1) AS w0_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 1)
                       / COUNT(DISTINCT u.user_id), 1) AS w1_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 2)
                       / COUNT(DISTINCT u.user_id), 1) AS w2_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 3)
                       / COUNT(DISTINCT u.user_id), 1) AS w3_pct
          FROM users AS u
          LEFT JOIN weeks AS w
            ON w.user_id = u.user_id
          GROUP BY cohort_month
          ORDER BY cohort_month;
        after: |
          This is a **retention matrix**: one row per cohort, one column per week. Read across a row to see how one group behaves over time, and down a column to compare cohorts in the same week.

          The February cohort is special: all 38 users were active in their signup week (100.0%). Week 1 is then 63.2% for February, but only 49.0% for March.

      - type: predict
        id: m19-l05-p1
        question: |
          This query divides the number of days between two dates by 7. What does it return?
        sql: |
          SELECT (DATE '2024-01-11' - DATE '2024-01-01') / 7 AS week_no;
        options: ["1", "1.43", "1.4", "10"]
        answer: 0
        explanation: |
          The gap between the dates is 10 days (a whole number). Dividing a whole number by a whole number in PostgreSQL gives a whole number, so the decimals are removed and the answer is 1. That is why 10 days after signup falls in week 1.

      - type: stepper
        title: Building the retention matrix
        md: |
          Let's build the matrix one stage at a time. Click through the stages and watch the table take shape.
        stages:
          - label: Weeks per user
            md: One row per user and week, with no repeats.
            sql: |
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
              ORDER BY e.user_id, week_no
              LIMIT 8;
          - label: Add the cohort
            md: Join to `users` and label each row with the signup month.
            sql: |
              SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                     w.user_id,
                     w.week_no
              FROM (
                  SELECT DISTINCT e.user_id,
                         (e.event_time::date - u2.signup_date) / 7 AS week_no
                  FROM events AS e
                  JOIN users AS u2
                    ON u2.user_id = e.user_id
              ) AS w
              JOIN users AS u
                ON u.user_id = w.user_id
              ORDER BY w.user_id, w.week_no
              LIMIT 8;
          - label: Count per cohort and week
            md: Count the distinct users in each cohort and week, for weeks 0 and 1.
            sql: |
              WITH weeks AS (
                  SELECT DISTINCT e.user_id,
                         (e.event_time::date - u.signup_date) / 7 AS week_no
                  FROM events AS e
                  JOIN users AS u
                    ON u.user_id = e.user_id
              )
              SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                     COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 0) AS w0,
                     COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 1) AS w1
              FROM users AS u
              LEFT JOIN weeks AS w
                ON w.user_id = u.user_id
              GROUP BY cohort_month
              ORDER BY cohort_month;
          - label: Turn counts into percentages
            md: Divide by the cohort size, and show weeks 0 and 1 as percentages.
            sql: |
              WITH weeks AS (
                  SELECT DISTINCT e.user_id,
                         (e.event_time::date - u.signup_date) / 7 AS week_no
                  FROM events AS e
                  JOIN users AS u
                    ON u.user_id = e.user_id
              )
              SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                     ROUND(100.0 * COUNT(DISTINCT w.user_id)
                           FILTER (WHERE w.week_no = 0)
                           / COUNT(DISTINCT u.user_id), 1) AS w0_pct,
                     ROUND(100.0 * COUNT(DISTINCT w.user_id)
                           FILTER (WHERE w.week_no = 1)
                           / COUNT(DISTINCT u.user_id), 1) AS w1_pct
              FROM users AS u
              LEFT JOIN weeks AS w
                ON w.user_id = u.user_id
              GROUP BY cohort_month
              ORDER BY cohort_month;

      - type: fill
        id: m19-l05-f1
        prompt: Complete the expression that turns the number of days since signup into a week number.
        template: |
          SELECT DISTINCT e.user_id,
                 (e.event_time::date - u.signup_date) ___ 7 AS week_no
          FROM events AS e
          JOIN users AS u
            ON u.user_id = e.user_id
          WHERE e.user_id = 3
          ORDER BY week_no;
        answers:
          - ["/"]
        explanation: "`/` between two whole numbers gives a whole number in PostgreSQL. Day 13 is 13 / 7 = 1, so it falls in week 1, while day 14 is 14 / 7 = 2."

      - type: parsons
        id: m19-l05-o1
        prompt: |
          Put the lines in the right order to count how many users were active in each week since signup, for all users.
        lines:
          - WITH weeks AS (
          - SELECT DISTINCT e.user_id,
          - (e.event_time::date - u.signup_date) / 7 AS week_no
          - FROM events AS e
          - JOIN users AS u
          - ON u.user_id = e.user_id
          - )
          - SELECT week_no,
          - COUNT(*) AS active_users
          - FROM weeks
          - GROUP BY week_no
          - ORDER BY week_no;
        distractors:
          - WHERE week_no = 0;

      - type: exercise
        id: m19-l05-e1
        title: Who was active in their signup week?
        prompt: |
          For each signup month (`cohort_month`), count the users who were active in **week 0**, their signup week. Count each user once.

          Show `cohort_month` and `active_week0`, oldest cohort first. Leave out cohorts with no week 0 users.
        starter: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month
          FROM users
          GROUP BY cohort_month;
        solution: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                 COUNT(DISTINCT w.user_id) AS active_week0
          FROM users AS u
          JOIN weeks AS w
            ON w.user_id = u.user_id
          WHERE w.week_no = 0
          GROUP BY cohort_month
          ORDER BY cohort_month;
        ordered: true
        columnNames: true
        hints:
          - Use the example "How many users were active each week?" and keep only week 0.
          - An inner `JOIN` is enough here, because you only want users with a week 0 row.
          - "... FROM users AS u JOIN weeks AS w ON ... WHERE w.week_no = ___ GROUP BY cohort_month ORDER BY cohort_month;"
        explanation: |
          The January cohort has 54 users active in their signup week, out of 57 who signed up. Counting distinct users matters, because one user can have many events on the signup day.
        difficulty: 1

      - type: exercise
        id: m19-l05-e2
        title: The week 1 comeback rate
        prompt: |
          For each signup month, show `cohort_month` and `week1_pct`: the percentage of the cohort that was active in **week 1**, rounded to 1 decimal place.

          The denominator is the **whole cohort**, including users with no events. Oldest cohort first.
        starter: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month
          FROM users
          GROUP BY cohort_month;
        solution: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 1)
                       / COUNT(DISTINCT u.user_id), 1) AS week1_pct
          FROM users AS u
          LEFT JOIN weeks AS w
            ON w.user_id = u.user_id
          GROUP BY cohort_month
          ORDER BY cohort_month;
        ordered: true
        columnNames: true
        hints:
          - Build the `weeks` CTE, then `LEFT JOIN` it from `users`.
          - Count the users in week 1 with `FILTER`, and divide by the count of all cohort users.
          - "ROUND(100.0 * COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = ___) / COUNT(DISTINCT u.user_id), 1)"
        explanation: |
          February has the best week 1 comeback rate at 63.2%, and March the lowest at 49.0%. The `LEFT JOIN` is essential: an inner join would drop the users with no events and make the denominator too small.
        difficulty: 2

      - type: exercise
        id: m19-l05-e3
        title: Came back in week 1 and week 2
        prompt: |
          For each signup month, what percentage of the cohort was active in **both** week 1 **and** week 2? Show `cohort_month` and `both_pct`, rounded to 1 decimal place.

          Use the whole cohort as the denominator, and order by `cohort_month`.
        starter: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month
          FROM users
          GROUP BY cohort_month;
        solution: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          ),
          per_user AS (
              SELECT u.user_id,
                     DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                     BOOL_OR(w.week_no = 1) AS back_week1,
                     BOOL_OR(w.week_no = 2) AS back_week2
              FROM users AS u
              LEFT JOIN weeks AS w
                ON w.user_id = u.user_id
              GROUP BY u.user_id, cohort_month
          )
          SELECT cohort_month,
                 ROUND(100.0 * COUNT(*) FILTER (WHERE back_week1 AND back_week2)
                       / COUNT(*), 1) AS both_pct
          FROM per_user
          GROUP BY cohort_month
          ORDER BY cohort_month;
        ordered: true
        columnNames: true
        hints:
          - Make one row per user first, with a `TRUE` or `FALSE` for week 1 and for week 2.
          - "BOOL_OR(w.week_no = 1) tells you whether a user has any week 1 row."
          - "Count the users where both flags are TRUE with FILTER (WHERE back_week1 AND back_week2)."
        explanation: |
          Returning in two different weeks is a stronger sign of habit than a single return. February is the strongest cohort: 16 of its 38 users (42.1%) came back in both week 1 and week 2. January is the weakest at 17.5%, with 10 of 57. Every cohort is measured against its full size.
        difficulty: 2

      - type: exercise
        id: m19-l05-e4
        title: The full matrix
        prompt: |
          Build the retention matrix for weeks 0 to 3. For each signup month, show `cohort_month`, then `w0_pct`, `w1_pct`, `w2_pct` and `w3_pct`: the percentage of the cohort active in that week, rounded to 1 decimal place.

          Oldest cohort first.
        starter: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month
          FROM users
          GROUP BY cohort_month;
        solution: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          )
          SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 0)
                       / COUNT(DISTINCT u.user_id), 1) AS w0_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 1)
                       / COUNT(DISTINCT u.user_id), 1) AS w1_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 2)
                       / COUNT(DISTINCT u.user_id), 1) AS w2_pct,
                 ROUND(100.0 * COUNT(DISTINCT w.user_id)
                       FILTER (WHERE w.week_no = 3)
                       / COUNT(DISTINCT u.user_id), 1) AS w3_pct
          FROM users AS u
          LEFT JOIN weeks AS w
            ON w.user_id = u.user_id
          GROUP BY cohort_month
          ORDER BY cohort_month;
        ordered: true
        columnNames: true
        hints:
          - The example "Retention as a percentage" has almost all of it. Write it yourself and check each column name.
          - Each column uses the same pattern, with a different week number.
          - "ROUND(100.0 * COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = ___) / COUNT(DISTINCT u.user_id), 1) AS ___"
        explanation: |
          Read the matrix row by row for one cohort and column by column for one week. The February cohort holds up best in week 2, at 60.5%, while the April cohort falls sharply in week 3, to 24.5%.
        difficulty: 3

      - type: exercise
        id: m19-l05-e5
        title: The cohort that stays longest (stretch)
        prompt: |
          Which signup month has the **highest week 3 retention**? Show `cohort_month` and `w3_pct` (the percentage of the cohort active in week 3, rounded to 1 decimal place). Show only that one row.
        starter: |
          SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month
          FROM users
          GROUP BY cohort_month;
        solution: |
          WITH weeks AS (
              SELECT DISTINCT e.user_id,
                     (e.event_time::date - u.signup_date) / 7 AS week_no
              FROM events AS e
              JOIN users AS u
                ON u.user_id = e.user_id
          ),
          matrix AS (
              SELECT DATE_TRUNC('month', u.signup_date)::date AS cohort_month,
                     ROUND(100.0 * COUNT(DISTINCT w.user_id)
                           FILTER (WHERE w.week_no = 3)
                           / COUNT(DISTINCT u.user_id), 1) AS w3_pct
              FROM users AS u
              LEFT JOIN weeks AS w
                ON w.user_id = u.user_id
              GROUP BY cohort_month
          )
          SELECT cohort_month,
                 w3_pct
          FROM matrix
          ORDER BY w3_pct DESC
          LIMIT 1;
        columnNames: true
        hints:
          - Build the week 3 percentage per cohort, as in the previous exercise.
          - Sort it from the highest to the lowest, then keep one row.
          - "... ORDER BY w3_pct ___ LIMIT 1;"
        explanation: |
          February has the highest week 3 retention at 44.7%. Its week 0 was 100.0%, so nobody in the cohort had missed the signup week. Other cohorts lose more of their users by week 3.
        difficulty: 3

    cheatsheet:
      - title: Signup cohort
        sql: "DATE_TRUNC('month', signup_date)::date AS cohort_month"
        note: "Users with the same month belong to the same cohort."
      - title: Week since signup
        sql: "(e.event_time::date - u.signup_date) / 7"
        note: "Whole days divided by 7. Whole-number division drops the decimals."
      - title: Retention percentage
        sql: "ROUND(100.0 * COUNT(DISTINCT w.user_id) FILTER (WHERE w.week_no = 1) / COUNT(DISTINCT u.user_id), 1)"
        note: "The denominator is the whole cohort. Use LEFT JOIN so users with no events count."

  - id: m19-l06
    title: "Moving averages and Pareto: smoothing and ranking"
    summary: Smooth noisy daily numbers with a moving average, and find the few products that bring most of the money.
    minutes: 35
    dataset: shop
    steps:
      - type: read
        title: Daily numbers jump around
        md: |
          Mia's dashboard shows revenue for each day, and the line zig-zags wildly. Some days are £0 because nobody ordered, and one day can be ten times the day before.

          Two classic analyst tools help:

          - A **moving average** (also called a rolling average) takes the average of the last few days. It smooths the noise so the trend shows.
          - A **Pareto analysis** sorts items from biggest to smallest and adds up a **running total**. It shows which few items bring most of the money. This is the "80/20 rule": often about 80% of the result comes from about 20% of the items.

          > [!ANALOGY]
          > A moving average is like a car's fuel gauge, which shows the average of recent kilometres instead of the reading for one second.

      - type: example
        title: Every day needs a row
        md: |
          A moving average needs **one row per day**. Days with no orders have no row in `orders`, so we first build a calendar of every day and join the sales to it. A day with no sales becomes `0`.
        sql: |
          WITH daily AS (
              SELECT o.order_date AS day,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                         AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY o.order_date
          ),
          calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-12-31',
                                   INTERVAL '1 day') AS g(day)
          )
          SELECT c.day,
                 COALESCE(d.revenue, 0) AS revenue
          FROM calendar AS c
          LEFT JOIN daily AS d
            ON d.day = c.day
          WHERE c.day BETWEEN '2024-01-01' AND '2024-01-10'
          ORDER BY c.day;
        after: |
          Two days in January had no orders at all (January 4 and 5), and they show `0`. Without the calendar, those two days would simply be missing, and a moving average would quietly skip them.

          `generate_series` builds a list of dates for you. The whole year has 366 days, and 265 of them had at least one sale.

      - type: read
        title: The window of seven days
        md: |
          A **window** frame chooses which rows a window function looks at. `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW` means "this row and the six rows before it", so seven days in total.

          `AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)` gives the average over those seven days, for every day.

          > [!MISTAKE]
          > The `WHERE` clause runs before window functions. If you filter to January 7 onwards in the same query, the window cannot see January 1 to 6, so the early averages are wrong. Build the window in a CTE, then filter in the outer query.

      - type: example
        title: A 7-day moving average
        md: |
          The moving average is built in its own CTE, with the window over every day of the year. The final `WHERE` keeps two weeks of days.
        sql: |
          WITH daily AS (
              SELECT o.order_date AS day,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                         AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY o.order_date
          ),
          calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-12-31',
                                   INTERVAL '1 day') AS g(day)
          ),
          filled AS (
              SELECT c.day,
                     COALESCE(d.revenue, 0) AS revenue
              FROM calendar AS c
              LEFT JOIN daily AS d
                ON d.day = c.day
          ),
          moving AS (
              SELECT day,
                     revenue,
                     ROUND(AVG(revenue) OVER (
                         ORDER BY day
                         ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
                     ), 2) AS avg7
              FROM filled
          )
          SELECT day,
                 revenue,
                 avg7
          FROM moving
          WHERE day BETWEEN '2024-01-07' AND '2024-01-20'
          ORDER BY day;
        after: |
          On January 13, the average of the seven days from January 7 to 13 was 341.54. It is a lot steadier than the daily numbers, which range from 0 to about 1,044 in the same two weeks.

      - type: example
        title: DISTINCT does not work in a window
        md: |
          A natural idea is "count the different customers in the last seven days" with `COUNT(DISTINCT ...)` over a window. PostgreSQL does not allow it.
        sql: |
          SELECT order_date,
                 COUNT(DISTINCT customer_id) OVER (
                     ORDER BY order_date
                 ) AS customers_so_far
          FROM orders
          LIMIT 5;
        expectError: true
        after: |
          The error says `DISTINCT is not implemented for window functions`. The next example shows the standard fix: a small subquery for each day.

      - type: example
        title: Rolling 7-day active customers
        md: |
          For each day, a **subquery** counts the different customers whose order date falls in the seven days ending on that day. The `c.day - 6` is the first day of the window.
        sql: |
          WITH calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-01-14',
                                   INTERVAL '1 day') AS g(day)
          )
          SELECT c.day,
                 (
                     SELECT COUNT(DISTINCT o.customer_id)
                     FROM orders AS o
                     WHERE o.order_date BETWEEN c.day - 6 AND c.day
                       AND o.status <> 'cancelled'
                 ) AS active_7d
          FROM calendar AS c
          WHERE c.day >= '2024-01-07'
          ORDER BY c.day;
        after: |
          On January 7 and 8, eight different customers ordered during the previous seven days. On January 10, only four did, which is a dip worth investigating.

      - type: quiz
        id: m19-l06-q1
        question: |
          Why do we need a row for every day, including days with no sales, before we take a 7-day moving average?
        options:
          - Because the window needs exactly seven rows, and days without a row would make it shorter, so the average would be taken over the wrong days.
          - Because the database cannot store days without sales.
          - Because `COALESCE` works only with dates.
          - Because a moving average is always taken over the whole year.
        answer: 0
        explanation: |
          A window frame counts rows, not calendar days. If a quiet day has no row, the seven rows reach back to a day that is earlier than seven calendar days, so the average covers the wrong period. A calendar with a `0` for every quiet day keeps the window honest.

      - type: read
        title: "Pareto: which few products matter most?"
        md: |
          For a Pareto analysis, sort products from the biggest revenue to the smallest and keep a **running total** of the share:

          1. Find each product's revenue.
          2. Sort the products from biggest to smallest.
          3. Add up a running total, as a percentage of all revenue.

          The point where the running total passes 80% tells you how many products make most of the money.

      - type: example
        title: The top 10 products and their running share
        md: |
          `SUM(revenue) OVER (ORDER BY revenue DESC, product_id ROWS UNBOUNDED PRECEDING)` adds up every product from the top down to the current one. The `product_id` at the end breaks ties, so the order is always the same.
        sql: |
          WITH rev AS (
              SELECT p.product_id,
                     p.name,
                     SUM(i.quantity * i.unit_price * (1 - i.discount))
                         AS revenue
              FROM order_items AS i
              JOIN orders AS o
                ON o.order_id = i.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              WHERE o.status <> 'cancelled'
              GROUP BY p.product_id, p.name
          ),
          ranked AS (
              SELECT product_id,
                     name,
                     revenue,
                     SUM(revenue) OVER (
                         ORDER BY revenue DESC, product_id
                         ROWS UNBOUNDED PRECEDING
                     ) AS running,
                     SUM(revenue) OVER () AS total
              FROM rev
          )
          SELECT ROW_NUMBER() OVER (
                     ORDER BY revenue DESC, product_id
                 ) AS rank_no,
                 name,
                 ROUND(100.0 * running / total, 1) AS cum_pct
          FROM ranked
          ORDER BY revenue DESC, product_id
          LIMIT 10;
        after: |
          The top product, Lumio Phone S5, brings in about 12.9% of all revenue. The top three products bring in 26.5%, and the top ten reach 58.4%.

      - type: example
        title: How many products make 80% of revenue?
        md: |
          Count the products whose running total **before** them is still below 80%. Each of those products is needed to reach 80%.
        sql: |
          WITH rev AS (
              SELECT p.product_id,
                     SUM(i.quantity * i.unit_price * (1 - i.discount))
                         AS revenue
              FROM order_items AS i
              JOIN orders AS o
                ON o.order_id = i.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              WHERE o.status <> 'cancelled'
              GROUP BY p.product_id
          ),
          ranked AS (
              SELECT product_id,
                     revenue,
                     SUM(revenue) OVER (
                         ORDER BY revenue DESC, product_id
                         ROWS UNBOUNDED PRECEDING
                     ) AS running,
                     SUM(revenue) OVER () AS total
              FROM rev
          )
          SELECT COUNT(*) AS products_with_sales,
                 COUNT(*) FILTER (WHERE running - revenue < 0.8 * total)
                     AS products_for_80pct
          FROM ranked;
        after: |
          55 products sold something, and 23 of them bring in 80% of revenue. That is 42% of the products, not 20%. The 80/20 rule is a useful rule of thumb, not a law, so always check the real numbers.

      - type: predict
        id: m19-l06-p1
        question: |
          This query averages each row with the two rows before it. What is `avg3` on the fourth row (day 4)?
        sql: |
          SELECT d,
                 AVG(v) OVER (
                     ORDER BY d
                     ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
                 ) AS avg3
          FROM (VALUES (1, 10), (2, 20), (3, 30), (4, 40)) AS t(d, v)
          ORDER BY d;
        options: ["25", "30", "35", "40"]
        answer: 1
        explanation: |
          Day 4 uses days 2, 3 and 4 (the current row and two before it): (20 + 30 + 40) / 3 = 30. The `VALUES` list is a small table built inside the query, which is handy for practice.

      - type: stepper
        title: Building the moving average, stage by stage
        md: |
          Let's build the 7-day moving average for the first ten days of 2024. Click through the stages.
        stages:
          - label: The sales days
            md: Start from the days that have sales.
            sql: |
              SELECT o.order_date AS day,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                         AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
                AND o.order_date BETWEEN '2024-01-01' AND '2024-01-10'
              GROUP BY o.order_date
              ORDER BY day;
          - label: Add the missing days
            md: Build the calendar and turn the missing days into 0.
            sql: |
              WITH daily AS (
                  SELECT o.order_date AS day,
                         ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                             AS revenue
                  FROM orders AS o
                  JOIN order_items AS i
                    ON i.order_id = o.order_id
                  WHERE o.status <> 'cancelled'
                  GROUP BY o.order_date
              ),
              calendar AS (
                  SELECT g.day::date AS day
                  FROM generate_series(DATE '2024-01-01', DATE '2024-01-10',
                                       INTERVAL '1 day') AS g(day)
              )
              SELECT c.day,
                     COALESCE(d.revenue, 0) AS revenue
              FROM calendar AS c
              LEFT JOIN daily AS d
                ON d.day = c.day
              ORDER BY c.day;
          - label: Add the 7-day window
            md: Average each day with the six days before it.
            sql: |
              WITH daily AS (
                  SELECT o.order_date AS day,
                         ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                             AS revenue
                  FROM orders AS o
                  JOIN order_items AS i
                    ON i.order_id = o.order_id
                  WHERE o.status <> 'cancelled'
                  GROUP BY o.order_date
              ),
              calendar AS (
                  SELECT g.day::date AS day
                  FROM generate_series(DATE '2024-01-01', DATE '2024-01-10',
                                       INTERVAL '1 day') AS g(day)
              ),
              filled AS (
                  SELECT c.day,
                         COALESCE(d.revenue, 0) AS revenue
                  FROM calendar AS c
                  LEFT JOIN daily AS d
                    ON d.day = c.day
              )
              SELECT day,
                     revenue,
                     ROUND(AVG(revenue) OVER (
                         ORDER BY day
                         ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
                     ), 2) AS avg7
              FROM filled
              ORDER BY day;

      - type: fill
        id: m19-l06-f1
        prompt: Complete the window frame so that each day is averaged with the six days before it.
        template: |
          WITH calendar AS (
              SELECT g.day::date AS day,
                     (g.day::date - DATE '2024-01-01') + 100 AS amount
              FROM generate_series(DATE '2024-01-01', DATE '2024-01-05',
                                   INTERVAL '1 day') AS g(day)
          )
          SELECT day,
                 AVG(amount) OVER (
                     ORDER BY day
                     ROWS BETWEEN ___ PRECEDING AND CURRENT ROW
                 ) AS avg7
          FROM calendar
          ORDER BY day;
        answers:
          - ["6"]
        explanation: "`ROWS BETWEEN 6 PRECEDING AND CURRENT ROW` covers seven rows: the current day and the six before it. Use `6` for a 7-day window and `2` for a 3-day window."

      - type: parsons
        id: m19-l06-o1
        prompt: |
          Put the lines in the right order to compute a 7-day moving average for a small table of sales days. The table has very few rows, so only the last rows show a full window.
        lines:
          - WITH sales(day, revenue) AS (VALUES
          - (DATE '2024-01-01', 100), (DATE '2024-01-02', 0),
          - (DATE '2024-01-03', 50), (DATE '2024-01-04', 0),
          - (DATE '2024-01-05', 150), (DATE '2024-01-06', 0),
          - (DATE '2024-01-07', 70), (DATE '2024-01-08', 30)
          - )
          - SELECT day, revenue,
          - AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS avg7
          - FROM sales
          - ORDER BY day;
        distractors:
          - ORDER BY revenue DESC;

      - type: exercise
        id: m19-l06-e1
        title: Every day of the first week
        prompt: |
          Show the revenue for **each day** from 2024-01-01 to 2024-01-10, including the days with no orders. Show `day` and `revenue`, with days with no orders shown as `0`. Round `revenue` to 2 decimal places, oldest day first.

          Leave out cancelled orders.
        starter: |
          SELECT o.order_date AS day,
                 SUM(i.quantity * i.unit_price) AS revenue
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          GROUP BY o.order_date;
        solution: |
          WITH daily AS (
              SELECT o.order_date AS day,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                         AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY o.order_date
          ),
          calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-01-10',
                                   INTERVAL '1 day') AS g(day)
          )
          SELECT c.day,
                 COALESCE(d.revenue, 0) AS revenue
          FROM calendar AS c
          LEFT JOIN daily AS d
            ON d.day = c.day
          ORDER BY c.day;
        ordered: true
        columnNames: true
        hints:
          - Build the calendar of ten days first, as in the first example.
          - Join the daily revenue to the calendar with a `LEFT JOIN`, and use `COALESCE`.
          - "... LEFT JOIN daily AS d ON d.day = c.day ... SELECT c.day, COALESCE(d.revenue, ___) AS revenue"
        explanation: |
          Four days show 0, including January 4 and 5, which had no orders. Discounts are included in the revenue. Without the calendar these days would be missing entirely.
        difficulty: 1

      - type: exercise
        id: m19-l06-e2
        title: The moving average in January
        prompt: |
          Compute the 7-day moving average of daily revenue for each day from **2024-01-07** to **2024-01-14**. Show `day` and `avg7`, rounded to 2 decimal places, oldest day first.

          The average for each day uses that day and the six days before it, with a `0` for days with no sales. Leave out cancelled orders.
        starter: |
          SELECT o.order_date AS day,
                 AVG(i.unit_price) AS avg7
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          GROUP BY o.order_date
          ORDER BY day
          LIMIT 8;
        solution: |
          WITH daily AS (
              SELECT o.order_date AS day,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                         AS revenue
              FROM orders AS o
              JOIN order_items AS i
                ON i.order_id = o.order_id
              WHERE o.status <> 'cancelled'
              GROUP BY o.order_date
          ),
          calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-01-14',
                                   INTERVAL '1 day') AS g(day)
          ),
          filled AS (
              SELECT c.day,
                     COALESCE(d.revenue, 0) AS revenue
              FROM calendar AS c
              LEFT JOIN daily AS d
                ON d.day = c.day
          ),
          moving AS (
              SELECT day,
                     ROUND(AVG(revenue) OVER (
                         ORDER BY day
                         ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
                     ), 2) AS avg7
              FROM filled
          )
          SELECT day,
                 avg7
          FROM moving
          WHERE day BETWEEN '2024-01-07' AND '2024-01-14'
          ORDER BY day;
        ordered: true
        columnNames: true
        hints:
          - Follow the first-example structure, with CTEs `daily`, `calendar` and `filled`.
          - Put the window in its own CTE, then filter the dates in the outer query.
          - "AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)"
        explanation: |
          The window reaches back into the days before January 7, so the calendar starts on January 1 and every average uses the right days. January 9 and 10 average down because they had no sales, which is the zero days doing their job.
        difficulty: 2

      - type: exercise
        id: m19-l06-e3
        title: How many products reach half the revenue?
        prompt: |
          How many products do you need, starting from the best seller, to reach **at least 50%** of the total revenue? Cancelled orders are excluded.

          Show the answer as one value named `products_to_50`.
        starter: |
          SELECT COUNT(*) AS products_to_50
          FROM products;
        solution: |
          WITH rev AS (
              SELECT p.product_id,
                     SUM(i.quantity * i.unit_price * (1 - i.discount)) AS revenue
              FROM order_items AS i
              JOIN orders AS o
                ON o.order_id = i.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              WHERE o.status <> 'cancelled'
              GROUP BY p.product_id
          ),
          ranked AS (
              SELECT product_id,
                     revenue,
                     SUM(revenue) OVER (
                         ORDER BY revenue DESC, product_id
                         ROWS UNBOUNDED PRECEDING
                     ) AS running,
                     SUM(revenue) OVER () AS total
              FROM rev
          )
          SELECT COUNT(*) FILTER (WHERE running - revenue < 0.5 * total)
                     AS products_to_50
          FROM ranked;
        columnNames: true
        hints:
          - Compute each product's revenue, then the running total in descending order.
          - A product is needed if the running total **before** it is still below half of the total.
          - "COUNT(*) FILTER (WHERE running - revenue < 0.5 * ___)"
        explanation: |
          Eight products reach half of the revenue. The eighth product is the one that crosses the 50% line, and the count includes it because the total before it is still under half.
        difficulty: 2

      - type: exercise
        id: m19-l06-e4
        title: A 3-day rolling count of customers
        prompt: |
          For each day from **2024-01-07** to **2024-01-14**, count the **different** customers who placed an order (not cancelled) in that day and the **two** days before it. That is a 3-day window.

          Show `day` and `active_3d`, oldest day first.
        starter: |
          SELECT order_date AS day, COUNT(DISTINCT customer_id) AS active_3d
          FROM orders
          GROUP BY order_date
          ORDER BY day;
        solution: |
          WITH calendar AS (
              SELECT g.day::date AS day
              FROM generate_series(DATE '2024-01-01', DATE '2024-01-14',
                                   INTERVAL '1 day') AS g(day)
          )
          SELECT c.day,
                 (
                     SELECT COUNT(DISTINCT o.customer_id)
                     FROM orders AS o
                     WHERE o.order_date BETWEEN c.day - 2 AND c.day
                       AND o.status <> 'cancelled'
                 ) AS active_3d
          FROM calendar AS c
          WHERE c.day >= '2024-01-07'
          ORDER BY c.day;
        ordered: true
        columnNames: true
        hints:
          - Use the rolling example, but change the seven days to three.
          - "BETWEEN c.day - 2 AND c.day gives the current day and the two before it."
          - "SELECT COUNT(DISTINCT o.customer_id) FROM orders AS o WHERE o.order_date BETWEEN c.day - ___ AND c.day ..."
        explanation: |
          A 3-day window is the same subquery as the 7-day one, with `- 2` instead of `- 6`. Subqueries like this are the standard answer to `COUNT(DISTINCT)` in a moving window.
        difficulty: 2

      - type: exercise
        id: m19-l06-e5
        title: The product that crosses 25% (stretch)
        prompt: |
          Using the same ranking of products by revenue (highest first, ties broken by `product_id`, cancelled orders excluded), find the **first** product at which the running share reaches **more than 25%** of the total.

          Show `name` and `cum_pct`, the running share including this product, rounded to 1 decimal place.
        starter: |
          SELECT p.name
          FROM products AS p;
        solution: |
          WITH rev AS (
              SELECT p.product_id,
                     p.name,
                     SUM(i.quantity * i.unit_price * (1 - i.discount)) AS revenue
              FROM order_items AS i
              JOIN orders AS o
                ON o.order_id = i.order_id
              JOIN products AS p
                ON p.product_id = i.product_id
              WHERE o.status <> 'cancelled'
              GROUP BY p.product_id, p.name
          ),
          ranked AS (
              SELECT product_id,
                     name,
                     revenue,
                     SUM(revenue) OVER (
                         ORDER BY revenue DESC, product_id
                         ROWS UNBOUNDED PRECEDING
                     ) AS running,
                     SUM(revenue) OVER () AS total
              FROM rev
          )
          SELECT name,
                 ROUND(100.0 * running / total, 1) AS cum_pct
          FROM ranked
          WHERE running / total > 0.25
          ORDER BY running
          LIMIT 1;
        ordered: true
        columnNames: true
        hints:
          - Build the running share as in the top-10 example.
          - Keep the rows where the running share is above 25%, then sort by the running total and keep one row.
          - "... WHERE running / total > ___ ORDER BY running LIMIT 1;"
        explanation: |
          The Aurora 16-inch Pro Laptop is the first product to take the running share above 25%, at 26.5%. The filter comes after the window, so every product above it has already been counted.
        difficulty: 3

    cheatsheet:
      - title: Moving average over 7 days
        sql: "AVG(revenue) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)"
        note: "Works on one row per day. Build a calendar and use COALESCE(..., 0) first."
      - title: Calendar of days
        sql: "SELECT g.day::date FROM generate_series(DATE '2024-01-01', DATE '2024-12-31', INTERVAL '1 day') AS g(day)"
        note: "Creates one row for every day, so quiet days are not missing."
      - title: Rolling distinct count
        sql: "(SELECT COUNT(DISTINCT customer_id) FROM orders WHERE order_date BETWEEN c.day - 6 AND c.day)"
        note: "COUNT(DISTINCT) is not allowed in a window, so use a subquery."
      - title: Running share
        sql: "SUM(revenue) OVER (ORDER BY revenue DESC, product_id ROWS UNBOUNDED PRECEDING)"
        note: "A running total from the top. Add a tie-breaker so the order is fixed."

  - id: m19-l07
    title: "Percentiles and histograms: beyond the average"
    summary: Use medians and percentiles to describe typical values, and bins to see the shape of the data.
    minutes: 30
    dataset: movies
    steps:
      - type: read
        title: The average can mislead
        md: |
          Lena works on the FlickNest product team. A report says viewers watch an average of **58.18 minutes** per play. Is that a typical viewer?

          Not necessarily. A few very long films, or a few very short taps, pull the average. The better questions are:

          - What is the **median**? It is the middle value: half the plays are shorter and half are longer.
          - What is the **90th percentile** (p90)? It is the value that 90% of plays stay below. It shows how long the longest plays run.

          > [!ANALOGY]
          > Imagine nine people who earn 20,000 a year and one who earns 1,000,000. The average is around 108,000, which describes nobody. The median is 20,000, which describes almost everybody.

      - type: example
        title: The summary of all plays
        md: |
          `percentile_cont(0.5)` is the median, and `percentile_cont(0.9)` is the 90th percentile. The `WITHIN GROUP (ORDER BY ...)` part says which column to measure.
        sql: |
          SELECT COUNT(*) AS plays,
                 ROUND(AVG(minutes_watched), 1) AS avg_min,
                 ROUND(percentile_cont(0.5)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS median_min,
                 ROUND(percentile_cont(0.9)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS p90_min,
                 MAX(minutes_watched) AS longest_min
          FROM watch_history;
        after: |
          There are 3,654 plays. The average is 58.2 minutes, but the median is 43.5 minutes, so half the plays are shorter than 44 minutes. Nine in ten plays end by about 117 minutes.

      - type: read
        title: Percentile cont or disc?
        md: |
          There are two kinds of percentile in PostgreSQL:

          - `percentile_cont` (continuous) **calculates** a value between two neighbours when the middle falls in the gap. For four numbers, the median sits halfway between the second and third.
          - `percentile_disc` (discrete) returns **a real value** from the data: the first one at or above the percentile.

          For large tables the difference is tiny. For small tables it can be big. The next example shows it.

      - type: example
        title: Continuous or discrete on four numbers
        md: |
          `VALUES` builds a tiny table in the query, so you can see the effect clearly.
        sql: |
          SELECT percentile_cont(0.5)
                 WITHIN GROUP (ORDER BY x) AS cont_median,
                 percentile_disc(0.5)
                 WITHIN GROUP (ORDER BY x) AS disc_median
          FROM (VALUES (1), (2), (3), (4)) AS t(x);
        after: |
          The continuous median is 2.5, halfway between 2 and 3. The discrete median is 2, which is a value that really exists in the list. Both are valid medians; which one you choose depends on whether you want a value that exists.

      - type: example
        title: The median and p90 for each device
        md: |
          Put `GROUP BY device` next to the percentile, exactly like a normal aggregate.
        sql: |
          SELECT device,
                 COUNT(*) AS plays,
                 ROUND(percentile_cont(0.5)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS median_min,
                 ROUND(percentile_cont(0.9)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS p90_min
          FROM watch_history
          GROUP BY device
          ORDER BY device;
        after: |
          TVs have the most plays (1,400) and a median of 45 minutes. Web plays have the highest median at 48.5 minutes. The p90 values are close to 117 minutes on every device, so the long plays are similar everywhere.

      - type: quiz
        id: m19-l07-q1
        question: |
          Which statement about the 90th percentile is true?
        options:
          - It is the average of the top 10% of values.
          - It is the value that 90% of the values are at or below.
          - It is always 90% of the largest value.
          - It is the number of values above 90.
        answer: 1
        explanation: |
          The 90th percentile is a cut-off. If the p90 of plays is 117 minutes, then about 90% of plays end by 117 minutes, and the top 10% run longer.

      - type: predict
        id: m19-l07-p1
        question: |
          What does this query return?
        sql: |
          SELECT percentile_cont(0.5)
                 WITHIN GROUP (ORDER BY x) AS median_x
          FROM (VALUES (5), (10), (20), (40)) AS t(x);
        options: ["10", "15", "20", "12.5"]
        answer: 1
        explanation: |
          With four numbers, the continuous median is halfway between the second and third values: (10 + 20) / 2 = 15. The discrete version would return 10 instead.

      - type: read
        title: "Histograms: counting values in bins"
        md: |
          A **histogram** shows how many values fall into each **bin** (a range of values). For watch time, a 15-minute bin counts the plays from 0 to 14 minutes, 15 to 29, and so on.

          To put each play in its bin, round its minutes down to a multiple of the bin size: `FLOOR(minutes_watched / 15) * 15`. A play of 47 minutes gives `FLOOR(3.13) * 15 = 45`, so it lands in the 45 bin.

          > [!TIP]
          > Use `FLOOR` for bins that start at a clear number, like 0, 15, 30. It is the simplest way to build a histogram.

      - type: example
        title: A histogram with 15-minute bins
        md: |
          Group by the bin start and count the plays in each bin.
        sql: |
          SELECT FLOOR(minutes_watched / 15) * 15 AS bin_start,
                 COUNT(*) AS plays
          FROM watch_history
          GROUP BY bin_start
          ORDER BY bin_start;
        after: |
          Most plays are short: 961 plays are under 15 minutes and 790 are between 15 and 29. There is a second cluster between 75 and 119 minutes, the length of a typical film. Only five plays reached 150 minutes.

      - type: read
        title: "width_bucket counts for you"
        md: |
          `width_bucket(value, low, high, count)` does the same job with a fixed number of bins between `low` and `high`. It returns `1` to `count`, and it puts values **below** `low` in bucket `0` and values **at or above** `high` in bucket `count + 1`.

          > [!MISTAKE]
          > The top edge is not part of the last bucket. Here `high` is 150, so the 5 plays of exactly 150 minutes land in bucket 11, an extra bucket that you may not expect. If you want them in the last bin, use a slightly larger `high`, such as 151.

      - type: example
        title: The same histogram with width_bucket
        md: |
          Ten buckets from 0 to 150 minutes, each 15 minutes wide.
        sql: |
          SELECT width_bucket(minutes_watched, 0, 150, 10) AS bucket,
                 COUNT(*) AS plays
          FROM watch_history
          GROUP BY bucket
          ORDER BY bucket;
        after: |
          Bucket 1 is the same as the 0-14 minute bin (961 plays), bucket 2 the same as 15-29, and so on. Bucket 11 holds the five plays that lasted exactly 150 minutes, the top edge that the buckets do not include.

      - type: stepper
        title: Building a histogram with a bar chart
        md: |
          Let's build a histogram of watch time, one stage at a time. The last stage draws a bar for each bin, so the shape is easy to see.
        stages:
          - label: Each play gets a bin
            md: Round each play down to its 30-minute bin.
            sql: |
              SELECT minutes_watched,
                     FLOOR(minutes_watched / 30) * 30 AS bin_start
              FROM watch_history
              ORDER BY watch_id
              LIMIT 8;
          - label: Count per bin
            md: Count the plays in each bin.
            sql: |
              SELECT FLOOR(minutes_watched / 30) * 30 AS bin_start,
                     COUNT(*) AS plays
              FROM watch_history
              GROUP BY bin_start
              ORDER BY bin_start;
          - label: Share of all plays
            md: Turn the counts into a share of the total, as a percentage.
            sql: |
              SELECT FLOOR(minutes_watched / 30) * 30 AS bin_start,
                     COUNT(*) AS plays,
                     ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct
              FROM watch_history
              GROUP BY bin_start
              ORDER BY bin_start;
          - label: A bar for each bin
            md: "`REPEAT('#', n)` writes the character `#` n times. One `#` stands for 100 plays."
            sql: |
              SELECT FLOOR(minutes_watched / 30) * 30 AS bin_start,
                     COUNT(*) AS plays,
                     REPEAT('#', (COUNT(*) / 100)::int) AS bar
              FROM watch_history
              GROUP BY bin_start
              ORDER BY bin_start;

      - type: fill
        id: m19-l07-f1
        prompt: Complete the percentile so that the query returns the 90th percentile of watch time.
        template: |
          SELECT ROUND(percentile_cont(___)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                 AS p90_min
          FROM watch_history;
        answers:
          - ["0.9", "0.90"]
        explanation: "The argument is a fraction between 0 and 1. `0.9` means the 90th percentile, `0.5` the median and `0.25` the first quartile."

      - type: parsons
        id: m19-l07-o1
        prompt: |
          Put the lines in the right order to count the plays in each 30-minute bin.
        lines:
          - SELECT FLOOR(minutes_watched / 30) * 30 AS bin_start,
          - COUNT(*) AS plays
          - FROM watch_history
          - GROUP BY bin_start
          - ORDER BY bin_start;
        distractors:
          - HAVING COUNT(*) > 1000;

      - type: exercise
        id: m19-l07-e1
        title: The typical play
        prompt: |
          For all plays, show the `median_min` (the median of `minutes_watched`) and the `p90_min` (the 90th percentile), each rounded to 1 decimal place.

          Show one row.
        starter: |
          SELECT AVG(minutes_watched) AS median_min
          FROM watch_history;
        solution: |
          SELECT ROUND(percentile_cont(0.5)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                 AS median_min,
                 ROUND(percentile_cont(0.9)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                 AS p90_min
          FROM watch_history;
        columnNames: true
        hints:
          - Start from the summary example, but leave out the average and the count.
          - Each percentile needs its own `WITHIN GROUP (ORDER BY minutes_watched)`.
          - "ROUND(percentile_cont(___) WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)"
        explanation: |
          The median is 43.5 minutes and the 90th percentile is 117 minutes. The average is 58.2, which is higher than the median, because a long tail of very long plays pulls it up.
        difficulty: 1

      - type: exercise
        id: m19-l07-e2
        title: The median per device
        prompt: |
          For each `device`, show the number of plays as `plays` and the median watch time as `median_min`, rounded to 1 decimal place.

          Order by `device` A to Z.
        starter: |
          SELECT device, COUNT(*) AS plays
          FROM watch_history
          GROUP BY device;
        solution: |
          SELECT device,
                 COUNT(*) AS plays,
                 ROUND(percentile_cont(0.5)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS median_min
          FROM watch_history
          GROUP BY device
          ORDER BY device;
        ordered: true
        columnNames: true
        hints:
          - Use the device example, and keep only `plays` and `median_min`.
          - Add `GROUP BY device` and an `ORDER BY device`.
          - "SELECT device, COUNT(*) AS plays, ROUND(percentile_cont(0.5) WITHIN GROUP (ORDER BY ___)::numeric, 1) ... GROUP BY device ORDER BY device;"
        explanation: |
          Web has the highest median (48.5 minutes) and tablet the lowest (35.0). Because the median ignores the very long plays, it is a fair way to compare typical behaviour between devices.
        difficulty: 2

      - type: exercise
        id: m19-l07-e3
        title: A 30-minute histogram
        prompt: |
          Build a histogram of watch time with bins of 30 minutes. For each bin, show `bin_start` (the lowest minute of the bin) and `plays` (the number of plays in it).

          Show the bins in order from the lowest.
        starter: |
          SELECT minutes_watched AS bin_start, COUNT(*) AS plays
          FROM watch_history
          GROUP BY minutes_watched;
        solution: |
          SELECT FLOOR(minutes_watched / 30) * 30 AS bin_start,
                 COUNT(*) AS plays
          FROM watch_history
          GROUP BY bin_start
          ORDER BY bin_start;
        ordered: true
        columnNames: true
        hints:
          - Use the 15-minute example, but change the bin size to 30.
          - Round each play down to a multiple of 30 with `FLOOR(minutes_watched / 30) * 30`.
          - "SELECT FLOOR(minutes_watched / ___) * ___ AS bin_start, COUNT(*) AS plays FROM watch_history GROUP BY bin_start ORDER BY bin_start;"
        explanation: |
          There are six bins from 0 to 150. The 0 bin holds 1,751 plays, the 90 bin 1,014 and the 150 bin only 5. The counts add up to all 3,654 plays, so no play was missed.
        difficulty: 2

      - type: exercise
        id: m19-l07-e4
        title: How active is a typical viewer?
        prompt: |
          First count the plays of each user. Then find the **75th percentile** of those counts (the value that 75% of users stay below), rounded to 1 decimal place.

          Show one row with the value named `p75_plays`.
        starter: |
          SELECT COUNT(*) AS p75_plays
          FROM watch_history;
        solution: |
          WITH per_user AS (
              SELECT user_id,
                     COUNT(*) AS plays
              FROM watch_history
              GROUP BY user_id
          )
          SELECT ROUND(percentile_cont(0.75)
                       WITHIN GROUP (ORDER BY plays)::numeric, 1)
                 AS p75_plays
          FROM per_user;
        columnNames: true
        hints:
          - The first step is one row per user with the count of plays.
          - The percentile is taken over those counts, not over the plays.
          - "... percentile_cont(0.75) WITHIN GROUP (ORDER BY ___) ... FROM per_user;"
        explanation: |
          Three in four users have watched 20 plays or fewer. The percentile of the counts describes the typical user, while the heaviest user watched 224 times. Two steps are needed because the percentile must be taken over one number per user.
        difficulty: 3

      - type: exercise
        id: m19-l07-e5
        title: The longest movies (stretch)
        prompt: |
          Among movies with **at least 30 plays**, find the three movies with the highest median watch time. Show `movie_id`, `plays` and `median_min` (rounded to 1 decimal place).

          Order by `median_min` from highest to lowest, then by `movie_id` from smallest to largest.
        starter: |
          SELECT movie_id, COUNT(*) AS plays
          FROM watch_history
          GROUP BY movie_id
          HAVING COUNT(*) >= 30;
        solution: |
          SELECT movie_id,
                 COUNT(*) AS plays,
                 ROUND(percentile_cont(0.5)
                       WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
                     AS median_min
          FROM watch_history
          GROUP BY movie_id
          HAVING COUNT(*) >= 30
          ORDER BY median_min DESC, movie_id
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Group by `movie_id` and use the median per movie.
          - Filter the groups with `HAVING COUNT(*) >= 30`.
          - "... GROUP BY movie_id HAVING COUNT(*) >= 30 ORDER BY median_min DESC, movie_id LIMIT 3;"
        explanation: |
          Movie 70 has the highest median at 101.0 minutes, followed by 56 (99.0) and 30 (93.0). A high median shows a movie that people usually watch to the end, which matters more than the raw number of plays for a long film.
        difficulty: 3

    cheatsheet:
      - title: Median and p90
        sql: "percentile_cont(0.5) WITHIN GROUP (ORDER BY minutes_watched)"
        note: "0.5 is the median, 0.9 the 90th percentile. Cast to numeric before ROUND."
      - title: Histogram bins with FLOOR
        sql: "FLOOR(minutes_watched / 15) * 15 AS bin_start"
        note: "Rounds each value down to its bin. Group by the bin, then COUNT(*)."
      - title: Equal-width buckets
        sql: "width_bucket(minutes_watched, 0, 150, 10)"
        note: "Returns 1 to 10. The top edge (150) falls in an extra bucket 11."

  - id: m19-l08
    title: "Market basket: products bought together"
    summary: Find which products appear in the same order, and measure how strong the link is.
    minutes: 30
    dataset: shop
    steps:
      - type: read
        title: What do people buy together?
        md: |
          Mia is designing the product page. She wants a box that says **"Frequently bought together"**, and she asks: "Which products appear in the same order again and again?"

          This is called **market basket analysis**. Each order is a basket, and each pair of products in the same basket is a small piece of evidence. You do not need to know why people buy them together. You only count how often it happens.

          > [!ANALOGY]
          > Think of a supermarket receipt. If "pasta" and "pasta sauce" appear on the same receipt again and again, a shop puts them next to each other.

      - type: example
        title: What is in one basket?
        md: |
          Each row of `order_items` is one product in one order. Ask for every product in order 10, with its quantity.
        sql: |
          SELECT product_id,
                 quantity
          FROM order_items
          WHERE order_id = 10
          ORDER BY product_id;
        after: |
          Order 10 has five different products. Every row is one **line** of the order. The same product cannot appear twice in one order, because the table has one row per product per order.

      - type: read
        title: Pairing products with a self-join
        md: |
          To find pairs, join `order_items` **to itself** on the same order. Each row of the first copy is matched with every row of the second copy, so you get every pair of products in one basket.

          There are two traps:

          - A product paired with itself, such as `(9, 9)`.
          - The same pair twice, once as `(9, 11)` and once as `(11, 9)`.

          The condition `b.product_id > a.product_id` avoids both. It keeps each pair once, in order from the smaller product id.

          > [!MISTAKE]
          > Using `<>` instead of `>` gives every pair twice, which doubles all your counts. Use `>` whenever you only need pairs.

      - type: example
        title: The pairs bought most often
        md: |
          Count the orders that contain each pair. Cancelled orders are left out, and ties are broken by the product ids so the order is fixed.
        sql: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          )
          SELECT a.product_id AS product_a,
                 b.product_id AS product_b,
                 COUNT(*) AS together
          FROM valid AS a
          JOIN valid AS b
            ON b.order_id = a.order_id
           AND b.product_id > a.product_id
          GROUP BY a.product_id, b.product_id
          ORDER BY together DESC, product_a, product_b
          LIMIT 4;
        after: |
          The most common pair is products 39 and 59, which were in the same order 19 times. Products 28 and 59 come next with 18. The 15-order pairs (28 and 39, 39 and 47) are tied, and the ids decide their order. The fourth row is the last one before the count drops to 13, so the cut-off is clear.

      - type: read
        title: Support and lift
        md: |
          Two numbers describe the strength of a pair:

          - **Support** is the share of all orders that contain both products. If 19 of 773 orders have both, the support is 2.46%.
          - **Lift** asks: is this pair more common than chance? It divides the support of the pair by what you would expect if the two products were unrelated. A lift of **1.0** means no link. Above 1.0 means the products are bought together more than chance would suggest.

          The "chance" is the support of product A times the support of product B. Lift is a good way to catch pairs that are only frequent because both products are very popular.

      - type: example
        title: Support and lift for the top pairs
        md: |
          The `prod` CTE counts the orders for each product. The lift divides the observed share by the expected share.
        sql: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          ),
          total AS (
              SELECT COUNT(DISTINCT order_id) AS n
              FROM valid
          ),
          prod AS (
              SELECT product_id,
                     COUNT(DISTINCT order_id) AS c
              FROM valid
              GROUP BY product_id
          ),
          pairs AS (
              SELECT a.product_id AS p1,
                     b.product_id AS p2,
                     COUNT(*) AS together
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              GROUP BY a.product_id, b.product_id
          )
          SELECT pa.p1 AS product_a,
                 pa.p2 AS product_b,
                 pa.together,
                 ROUND(100.0 * pa.together / t.n, 2) AS support_pct,
                 ROUND((1.0 * pa.together / t.n)
                       / ((1.0 * pp1.c / t.n) * (1.0 * pp2.c / t.n)), 2) AS lift
          FROM pairs AS pa
          CROSS JOIN total AS t
          JOIN prod AS pp1
            ON pp1.product_id = pa.p1
          JOIN prod AS pp2
            ON pp2.product_id = pa.p2
          ORDER BY pa.together DESC, product_a, product_b
          LIMIT 4;
        after: |
          The pair 39 and 59 has a support of 2.46% and a lift of 1.19. The pair 28 and 39 has a lift of 1.26, which is a stronger link even though it occurred fewer times. Lift makes pairs of very popular products comparable with pairs of smaller ones.

      - type: example
        title: What sells with the Lumio Phone S5?
        md: |
          Pick one product, here product 17, and find the products that appear in the same orders as it.
        sql: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          )
          SELECT b.product_id,
                 p.name,
                 COUNT(*) AS times
          FROM valid AS a
          JOIN valid AS b
            ON b.order_id = a.order_id
           AND b.product_id <> a.product_id
          JOIN products AS p
            ON p.product_id = b.product_id
          WHERE a.product_id = 17
          GROUP BY b.product_id, p.name
          ORDER BY times DESC, b.product_id
          LIMIT 4;
        after: |
          Customers who bought the Lumio Phone S5 most often also bought product 59 (the Vitamin C Moisturizer, 10 times), product 47 (Learn SQL in 30 Days, 8 times), product 39 (7 times) and product 54 (6 times). Here the `<>` is used on purpose, because you want every partner of product 17 and not just the bigger ids.

      - type: quiz
        id: m19-l08-q1
        question: |
          A pair has a **lift of 1.0**. What does that mean?
        options:
          - The two products are never bought together.
          - The products are bought together exactly as often as chance would predict, so there is no link.
          - The pair is bought together in every order.
          - The pair has a support of 100%.
        answer: 1
        explanation: |
          A lift of 1.0 means the observed share equals the expected share. Above 1.0 there is a positive link, and below 1.0 the products are bought together less often than chance would suggest.

      - type: predict
        id: m19-l08-p1
        question: |
          Order 2 has four products. How many rows does this query return for order 2?
        sql: |
          SELECT a.product_id AS product_a,
                 b.product_id AS product_b
          FROM order_items AS a
          JOIN order_items AS b
            ON b.order_id = a.order_id
           AND b.product_id > a.product_id
          WHERE a.order_id = 2;
        options: ["4", "6", "8", "12"]
        answer: 1
        explanation: |
          Four products give six different pairs: each product pairs with each product that comes after it in the list. With `<>` instead of `>`, each pair would appear twice, giving 12 rows.

      - type: stepper
        title: Building the pair counts
        md: |
          Let's build the pair counts one stage at a time. The last stage adds the support.
        stages:
          - label: Items in each order
            md: The valid lines, sorted by order.
            sql: |
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
              ORDER BY oi.order_id, oi.product_id
              LIMIT 8;
          - label: Pairs inside one order
            md: Join the lines to themselves, with `>` so each pair appears once. Orders 1 to 5 only.
            sql: |
              WITH valid AS (
                  SELECT oi.order_id,
                         oi.product_id
                  FROM order_items AS oi
                  JOIN orders AS o
                    ON o.order_id = oi.order_id
                  WHERE o.status <> 'cancelled'
              )
              SELECT a.order_id,
                     a.product_id AS product_a,
                     b.product_id AS product_b
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              WHERE a.order_id <= 5
              ORDER BY a.order_id, product_a, product_b;
          - label: Count each pair
            md: Count the orders in which each pair appears.
            sql: |
              WITH valid AS (
                  SELECT oi.order_id,
                         oi.product_id
                  FROM order_items AS oi
                  JOIN orders AS o
                    ON o.order_id = oi.order_id
                  WHERE o.status <> 'cancelled'
              )
              SELECT a.product_id AS product_a,
                     b.product_id AS product_b,
                     COUNT(*) AS together
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              GROUP BY a.product_id, b.product_id
              ORDER BY together DESC, product_a, product_b
              LIMIT 4;
          - label: Add the support
            md: Divide each count by the number of valid orders, and show it as a percentage.
            sql: |
              WITH valid AS (
                  SELECT oi.order_id,
                         oi.product_id
                  FROM order_items AS oi
                  JOIN orders AS o
                    ON o.order_id = oi.order_id
                  WHERE o.status <> 'cancelled'
              )
              SELECT a.product_id AS product_a,
                     b.product_id AS product_b,
                     COUNT(*) AS together,
                     ROUND(100.0 * COUNT(*)
                           / (SELECT COUNT(*)
                              FROM orders
                              WHERE status <> 'cancelled'), 2) AS support_pct
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              GROUP BY a.product_id, b.product_id
              ORDER BY together DESC, product_a, product_b
              LIMIT 4;

      - type: fill
        id: m19-l08-f1
        prompt: Complete the join condition so that each pair of products appears only once.
        template: |
          SELECT a.product_id AS product_a,
                 b.product_id AS product_b
          FROM order_items AS a
          JOIN order_items AS b
            ON b.order_id = a.order_id
           AND b.product_id ___ a.product_id
          WHERE a.order_id = 2
          ORDER BY product_a, product_b;
        answers:
          - [">"]
        explanation: "`>` keeps only the pairs where the second product id is bigger. That removes the self-pairs and the mirror copies in one step."

      - type: parsons
        id: m19-l08-o1
        prompt: |
          Put the lines in the right order to count how often each pair of products is bought together, and keep the four most frequent pairs.
        lines:
          - SELECT a.product_id AS product_a,
          - b.product_id AS product_b,
          - COUNT(*) AS together
          - FROM order_items AS a
          - JOIN order_items AS b
          -   ON b.order_id = a.order_id
          -   AND b.product_id > a.product_id
          - GROUP BY a.product_id, b.product_id
          - ORDER BY together DESC, product_a, product_b
          - LIMIT 4;
        distractors:
          - WHERE a.product_id = b.product_id;

      - type: exercise
        id: m19-l08-e1
        title: How big is each basket?
        prompt: |
          For orders 1 to 5, show `order_id` and `lines`, the number of order lines (different products) in that order. Cancelled orders are included.

          Show the orders in order of `order_id`.
        starter: |
          SELECT order_id, SUM(quantity) AS lines
          FROM order_items
          GROUP BY order_id;
        solution: |
          SELECT order_id,
                 COUNT(*) AS lines
          FROM order_items
          WHERE order_id BETWEEN 1 AND 5
          GROUP BY order_id
          ORDER BY order_id;
        ordered: true
        columnNames: true
        hints:
          - Each row of `order_items` is one line, so count the rows per order.
          - Use `COUNT(*)`, not the `quantity` column, which counts the number of units.
          - "SELECT order_id, COUNT(*) AS lines FROM order_items WHERE order_id BETWEEN 1 AND 5 GROUP BY ___ ORDER BY ___;"
        explanation: |
          Order 2 has four lines, the biggest basket here. The quantities are a different number: an order can have one line with a quantity of four. Counting rows counts products in the basket.
        difficulty: 1

      - type: exercise
        id: m19-l08-e2
        title: Bought with product 47
        prompt: |
          Find the four products that appear most often in the same order as **product 47**. Show `partner_id` (the other product's id) and `times` (the number of orders they share). Cancelled orders are excluded.

          Order by `times` from most to least, then by `partner_id` from smallest to largest.
        starter: |
          SELECT product_id AS partner_id
          FROM order_items
          WHERE product_id = 47;
        solution: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          )
          SELECT b.product_id AS partner_id,
                 COUNT(*) AS times
          FROM valid AS a
          JOIN valid AS b
            ON b.order_id = a.order_id
           AND b.product_id <> a.product_id
          WHERE a.product_id = 47
          GROUP BY b.product_id
          ORDER BY times DESC, partner_id
          LIMIT 4;
        ordered: true
        columnNames: true
        hints:
          - Use the "Lumio Phone S5" example, and change the product id to 47.
          - The result is the partner, so you group by the partner id `b.product_id`.
          - "... WHERE a.product_id = ___ GROUP BY b.product_id ORDER BY times DESC, partner_id LIMIT 4;"
        explanation: |
          Product 39 is the most common partner of product 47, in 15 orders, followed by 59 (13), 54 (12) and 45 (10). Each partner is counted once per order because the join works line by line.
        difficulty: 2

      - type: exercise
        id: m19-l08-e3
        title: How many frequent pairs?
        prompt: |
          How many different pairs of products were bought together in **at least 10** orders? Cancelled orders are excluded.

          Show the answer as one value named `frequent_pairs`.
        starter: |
          SELECT COUNT(*) AS frequent_pairs
          FROM order_items;
        solution: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          ),
          pairs AS (
              SELECT a.product_id AS product_a,
                     b.product_id AS product_b,
                     COUNT(*) AS together
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              GROUP BY a.product_id, b.product_id
          )
          SELECT COUNT(*) AS frequent_pairs
          FROM pairs
          WHERE together >= 10;
        columnNames: true
        hints:
          - First make one row per pair with its count, as in the "pairs bought most often" example.
          - Keep only the pairs with `together >= 10`, then count the rows.
          - "... FROM pairs WHERE together >= ___;"
        explanation: |
          Fourteen pairs were bought together in at least 10 orders. Counting the pairs (rows), not the orders, is what the question asks for. The `>` in the join makes sure each pair is counted only once.
        difficulty: 2

      - type: exercise
        id: m19-l08-e4
        title: Support and lift for one pair
        prompt: |
          For the pair of products **28** and **59**, show `together` (the number of valid orders with both), `support_pct` (the share of all valid orders, rounded to 2 decimals) and `lift`, rounded to 2 decimals.

          Show one row. Cancelled orders are excluded.
        starter: |
          SELECT COUNT(*) AS together
          FROM order_items
          WHERE product_id IN (28, 59);
        solution: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          ),
          total AS (
              SELECT COUNT(DISTINCT order_id) AS n
              FROM valid
          ),
          prod AS (
              SELECT product_id,
                     COUNT(DISTINCT order_id) AS c
              FROM valid
              GROUP BY product_id
          ),
          pair AS (
              SELECT COUNT(*) AS together
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id = 59
              WHERE a.product_id = 28
          )
          SELECT pair.together,
                 ROUND(100.0 * pair.together / t.n, 2) AS support_pct,
                 ROUND((1.0 * pair.together / t.n)
                       / ((1.0 * p1.c / t.n) * (1.0 * p2.c / t.n)), 2) AS lift
          FROM pair
          CROSS JOIN total AS t
          JOIN prod AS p1
            ON p1.product_id = 28
          JOIN prod AS p2
            ON p2.product_id = 59;
        columnNames: true
        hints:
          - Count the orders that contain both products, then divide by the number of valid orders.
          - Lift is `support of the pair / (support of 28 * support of 59)`.
          - "ROUND(100.0 * together / total, 2) and ROUND((together / total) / ((c28 / total) * (c59 / total)), 2)"
        explanation: |
          Products 28 and 59 share 18 orders (2.33% of all orders) and their lift is 1.12. A small positive lift like this one means a weak link, which is worth knowing before you put them in a bundle.
        difficulty: 3

      - type: exercise
        id: m19-l08-e5
        title: The strongest partners of product 59 (stretch)
        prompt: |
          Among the pairs that include **product 59** and were bought together in **at least 5** orders, find the three with the highest **lift**.

          Show `product_a`, `product_b`, `together` and `lift` (rounded to 2 decimals), with the highest lift first. Use `product_a` (the smaller id) and `product_b` as the tie-breakers.
        starter: |
          SELECT product_id, COUNT(*) AS orders
          FROM order_items
          WHERE product_id = 59
          GROUP BY product_id;
        solution: |
          WITH valid AS (
              SELECT oi.order_id,
                     oi.product_id
              FROM order_items AS oi
              JOIN orders AS o
                ON o.order_id = oi.order_id
              WHERE o.status <> 'cancelled'
          ),
          total AS (
              SELECT COUNT(DISTINCT order_id) AS n
              FROM valid
          ),
          prod AS (
              SELECT product_id,
                     COUNT(DISTINCT order_id) AS c
              FROM valid
              GROUP BY product_id
          ),
          pairs AS (
              SELECT a.product_id AS product_a,
                     b.product_id AS product_b,
                     COUNT(*) AS together
              FROM valid AS a
              JOIN valid AS b
                ON b.order_id = a.order_id
               AND b.product_id > a.product_id
              GROUP BY a.product_id, b.product_id
              HAVING COUNT(*) >= 5
          )
          SELECT pa.product_a,
                 pa.product_b,
                 pa.together,
                 ROUND((1.0 * pa.together / t.n)
                       / ((1.0 * pp1.c / t.n) * (1.0 * pp2.c / t.n)), 2) AS lift
          FROM pairs AS pa
          CROSS JOIN total AS t
          JOIN prod AS pp1
            ON pp1.product_id = pa.product_a
          JOIN prod AS pp2
            ON pp2.product_id = pa.product_b
          WHERE 59 IN (pa.product_a, pa.product_b)
          ORDER BY lift DESC, pa.product_a, pa.product_b
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Compute the lift for every pair with at least 5 orders, as in the lift example.
          - Keep only the pairs where product 59 is one of the two products.
          - "... WHERE 59 IN (pa.product_a, pa.product_b) ORDER BY lift DESC, product_a, product_b LIMIT 3;"
        explanation: |
          Product 1 (Aurora 14-inch Laptop) has the highest lift with 59, at 2.00, followed by product 27 (1.80) and product 44 (1.68). A high lift with a small count (6 orders) is less reliable than a high lift with many orders, so check the counts too.
        difficulty: 3

    cheatsheet:
      - title: Pairs in the same order
        sql: "JOIN order_items AS b ON b.order_id = a.order_id AND b.product_id > a.product_id"
        note: "The > keeps each pair once and removes self-pairs."
      - title: Support
        sql: "ROUND(100.0 * COUNT(*) / total_orders, 2)"
        note: "The share of all orders that contain both products."
      - title: Lift
        sql: "(pair / total) / ((product_a / total) * (product_b / total))"
        note: "Above 1 means bought together more often than chance. Below 1 means less often."

  - id: m19-l09
    title: "Relational division: customers who bought every product"
    summary: Answer "for all" questions, such as who bought every product in a category, with counting or with a double NOT EXISTS.
    minutes: 35
    dataset: shop
    steps:
      - type: read
        title: The "for all" question
        md: |
          Mia wants to launch the **Outdoor Explorer** badge. A customer earns it by buying **every** product in the Outdoor category.

          Questions with the word "every" or "all" are the hardest to write in SQL. Mathematicians call this **relational division**: you divide the customers' purchases by the full list of products, and ask which customers cover the whole list.

          > [!ANALOGY]
          > Think of a collector's album of stamps. You only get the prize when every slot is filled. One missing stamp means no prize.

      - type: example
        title: The whole list of products
        md: |
          Before you can check "every product", you need the full list. Here it is for the Outdoor category.
        sql: |
          SELECT product_id,
                 name
          FROM products
          WHERE category_id = 11
          ORDER BY product_id;
        after: |
          There are three Outdoor products: the Trail Running Backpack, the Insulated Water Bottle and the Yoga Mat. A customer has completed the badge when they have bought all three.

      - type: read
        title: Two ways to ask "every"
        md: |
          There are two standard methods.

          **Method 1: count.** Count how many *different* Outdoor products each customer has bought. If that number equals the number of Outdoor products, they have bought all of them.

          **Method 2: double NOT EXISTS.** Read the question backwards. "A customer bought every Outdoor product" means "there is **no** Outdoor product that this customer has **not** bought". Two `NOT EXISTS` in a row say exactly that.

          > [!MISTAKE]
          > In the counting method, count **different** products with `COUNT(DISTINCT ...)`. A customer who bought the water bottle three times has three order lines for one product. Plain `COUNT(*)` would say they bought three things, and the badge would be handed out too early.

      - type: example
        title: "Method 1: count the products each customer bought"
        md: |
          Count the distinct Outdoor products for each customer. Keep the customers whose count equals the total number of Outdoor products.
        sql: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          JOIN orders AS o
            ON o.customer_id = c.customer_id
          JOIN order_items AS oi
            ON oi.order_id = o.order_id
          JOIN products AS p
            ON p.product_id = oi.product_id
          WHERE o.status <> 'cancelled'
            AND p.category_id = 11
          GROUP BY c.customer_id, c.first_name, c.last_name
          HAVING COUNT(DISTINCT oi.product_id) = (
              SELECT COUNT(*)
              FROM products
              WHERE category_id = 11
          )
          ORDER BY c.customer_id;
        after: |
          Five customers bought all three Outdoor products: Jia Tran, Zainab Hussain, Ingrid Cooper, Kofi Yilmaz and Javier Oliveira. The total of three comes from the `products` table, not from the orders. If the category gets a new product, the badge rule updates itself.

      - type: example
        title: "Method 2: double NOT EXISTS"
        md: |
          Read it as: a customer qualifies if there is no Outdoor product that they have not bought.
        sql: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          WHERE NOT EXISTS (
              SELECT 1
              FROM products AS p
              WHERE p.category_id = 11
                AND NOT EXISTS (
                    SELECT 1
                    FROM orders AS o
                    JOIN order_items AS oi
                      ON oi.order_id = o.order_id
                    WHERE o.customer_id = c.customer_id
                      AND oi.product_id = p.product_id
                      AND o.status <> 'cancelled'
                )
          )
          ORDER BY c.customer_id;
        after: |
          The result is the same five customers. The inner `NOT EXISTS` finds an Outdoor product the customer has not bought. The outer `NOT EXISTS` says that no such product exists. Two negatives make the "every" in plain English.

      - type: quiz
        id: m19-l09-q1
        question: |
          Why does the double NOT EXISTS method work for "bought every product"?
        options:
          - Because `NOT EXISTS` is always faster than `COUNT`.
          - Because "there is no product the customer did not buy" is the same as "the customer bought every product".
          - Because `EXISTS` cannot be used with `products`.
          - Because it counts the orders instead of the products.
        answer: 1
        explanation: |
          The two methods are logically the same. The double NOT EXISTS says "there is no missing product", which is exactly what "every product" means. It works even if there are no orders, because the empty list of missing products is still empty.

      - type: predict
        id: m19-l09-p1
        question: |
          This query counts the customers who bought **at least two** different Outdoor products. What does it return?
        sql: |
          SELECT COUNT(*) AS customers
          FROM (
              SELECT o.customer_id
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = oi.product_id
              WHERE o.status <> 'cancelled'
                AND p.category_id = 11
              GROUP BY o.customer_id
              HAVING COUNT(DISTINCT oi.product_id) >= 2
          ) AS x;
        options: ["5", "21", "26", "76"]
        answer: 2
        explanation: |
          Five customers bought all three products, and 21 bought exactly two. Together that is 26. The 76 is the number of customers who bought any Outdoor product, which is a common wrong guess.

      - type: read
        title: Asking for "at least some" is different
        md: |
          Changing `= 3` to `>= 2` turns "every" into "at least two". That is much easier to write, and it shows how the same counting method answers different questions.

          With the double NOT EXISTS, "at least two" is harder to express. That is why counting is usually the better tool for "at least N of these".

      - type: stepper
        title: Building the badge list step by step
        md: |
          Let's build the Outdoor Explorer list one stage at a time.
        stages:
          - label: The Outdoor products
            md: Start from the category's products.
            sql: |
              SELECT product_id, name
              FROM products
              WHERE category_id = 11
              ORDER BY product_id;
          - label: What each customer bought
            md: Keep the distinct Outdoor products each customer has bought.
            sql: |
              SELECT DISTINCT o.customer_id,
                     oi.product_id
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = oi.product_id
              WHERE o.status <> 'cancelled'
                AND p.category_id = 11
              ORDER BY o.customer_id, oi.product_id
              LIMIT 10;
          - label: How many each customer has
            md: Count the distinct products per customer.
            sql: |
              SELECT o.customer_id,
                     COUNT(DISTINCT oi.product_id) AS outdoor_items
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = oi.product_id
              WHERE o.status <> 'cancelled'
                AND p.category_id = 11
              GROUP BY o.customer_id
              HAVING COUNT(DISTINCT oi.product_id) >= 2
              ORDER BY outdoor_items DESC, o.customer_id;
          - label: Compare with the total
            md: Keep only the customers whose count equals the number of products.
            sql: |
              SELECT o.customer_id,
                     COUNT(DISTINCT oi.product_id) AS outdoor_items
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = oi.product_id
              WHERE o.status <> 'cancelled'
                AND p.category_id = 11
              GROUP BY o.customer_id
              HAVING COUNT(DISTINCT oi.product_id) = (
                  SELECT COUNT(*)
                  FROM products
                  WHERE category_id = 11
              )
              ORDER BY o.customer_id;

      - type: fill
        id: m19-l09-f1
        prompt: Complete the condition that keeps only the customers who bought all the products in the category.
        template: |
          SELECT o.customer_id
          FROM orders AS o
          JOIN order_items AS oi
            ON oi.order_id = o.order_id
          JOIN products AS p
            ON p.product_id = oi.product_id
          WHERE o.status <> 'cancelled'
            AND p.category_id = 11
          GROUP BY o.customer_id
          HAVING COUNT(DISTINCT oi.product_id) ___ (
              SELECT COUNT(*)
              FROM products
              WHERE category_id = 11
          )
          ORDER BY o.customer_id;
        answers:
          - ["="]
        explanation: "`=` keeps the customers whose count of different products equals the total. `>=` would keep customers who bought some of them, which is a different question."

      - type: parsons
        id: m19-l09-o1
        prompt: |
          Put the lines in the right order to find the customers who bought every product in the Computers category (category 7).
        lines:
          - SELECT c.customer_id, c.first_name, c.last_name
          - FROM customers AS c
          - JOIN orders AS o ON o.customer_id = c.customer_id
          - JOIN order_items AS oi ON oi.order_id = o.order_id
          - JOIN products AS p ON p.product_id = oi.product_id
          - WHERE p.category_id = 7
          - GROUP BY c.customer_id, c.first_name, c.last_name
          - HAVING COUNT(DISTINCT oi.product_id) = (SELECT COUNT(*) FROM products WHERE category_id = 7);
        distractors:
          - HAVING COUNT(*) > 1;

      - type: exercise
        id: m19-l09-e1
        title: Anyone in the Outdoor category
        prompt: |
          How many different customers bought **at least one** product from the Outdoor category? Cancelled orders are excluded.

          Show the answer as one value named `outdoor_buyers`.
        starter: |
          SELECT COUNT(*) AS outdoor_buyers
          FROM products
          WHERE category_id = 11;
        solution: |
          SELECT COUNT(DISTINCT o.customer_id) AS outdoor_buyers
          FROM orders AS o
          JOIN order_items AS oi
            ON oi.order_id = o.order_id
          JOIN products AS p
            ON p.product_id = oi.product_id
          WHERE o.status <> 'cancelled'
            AND p.category_id = 11;
        columnNames: true
        hints:
          - You do not need "every" here. Any one product is enough.
          - Join the three tables, filter the category and the status, then count distinct customers.
          - "SELECT COUNT(DISTINCT o.___) AS outdoor_buyers FROM orders AS o JOIN order_items AS oi ... WHERE ...;"
        explanation: |
          76 customers bought at least one Outdoor product. This is the "some" question, which is much simpler than the "every" question because it needs no comparison with the total.
        difficulty: 1

      - type: exercise
        id: m19-l09-e2
        title: Completed the Computers set
        prompt: |
          Which customers bought **every** product in the Computers category (category 7)? Cancelled orders are excluded.

          Show `customer_id`, `first_name` and `last_name`, ordered by `customer_id`.
        starter: |
          SELECT customer_id, first_name, last_name
          FROM customers
          LIMIT 3;
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          JOIN orders AS o
            ON o.customer_id = c.customer_id
          JOIN order_items AS oi
            ON oi.order_id = o.order_id
          JOIN products AS p
            ON p.product_id = oi.product_id
          WHERE o.status <> 'cancelled'
            AND p.category_id = 7
          GROUP BY c.customer_id, c.first_name, c.last_name
          HAVING COUNT(DISTINCT oi.product_id) = (
              SELECT COUNT(*)
              FROM products
              WHERE category_id = 7
          )
          ORDER BY c.customer_id;
        ordered: true
        columnNames: true
        hints:
          - Use the counting method from the example, but change the category to 7.
          - Count the distinct products per customer and compare with the number of Computers products.
          - "HAVING COUNT(DISTINCT oi.product_id) = (SELECT COUNT(*) FROM products WHERE category_id = ___)"
        explanation: |
          Only one customer, number 10, has bought all three Computers products. Computers has three products, and the same check on another category would give a different answer, so always count the products in the category you are testing.
        difficulty: 2

      - type: exercise
        id: m19-l09-e3
        title: Bought at least two of the Outdoor set
        prompt: |
          How many customers bought **at least two** different Outdoor products? Cancelled orders are excluded.

          Show the answer as one value named `two_or_more`.
        starter: |
          SELECT COUNT(*) AS two_or_more
          FROM products
          WHERE category_id = 11;
        solution: |
          SELECT COUNT(*) AS two_or_more
          FROM (
              SELECT o.customer_id
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              JOIN products AS p
                ON p.product_id = oi.product_id
              WHERE o.status <> 'cancelled'
                AND p.category_id = 11
              GROUP BY o.customer_id
              HAVING COUNT(DISTINCT oi.product_id) >= 2
          ) AS x;
        columnNames: true
        hints:
          - This is the same query as the predict question, which is a good place to start.
          - Use `>= 2` in the `HAVING`, and count the rows of the result in an outer query.
          - "SELECT COUNT(*) FROM (SELECT o.customer_id ... HAVING COUNT(DISTINCT oi.product_id) >= ___) AS x;"
        explanation: |
          26 customers bought at least two of the three. Five of them bought all three, and 21 bought exactly two. Counting in an outer query lets you count the groups that the `HAVING` kept.
        difficulty: 2

      - type: exercise
        id: m19-l09-e4
        title: The 2024 badge
        prompt: |
          Which customers bought **every** Outdoor product **during 2024** only? An order counts when its `order_date` is in 2024 and it is not cancelled.

          Use the double NOT EXISTS method. Show `customer_id`, `first_name` and `last_name`, ordered by `customer_id`.
        starter: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE customer_id = 14;
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          WHERE NOT EXISTS (
              SELECT 1
              FROM products AS p
              WHERE p.category_id = 11
                AND NOT EXISTS (
                    SELECT 1
                    FROM orders AS o
                    JOIN order_items AS oi
                      ON oi.order_id = o.order_id
                    WHERE o.customer_id = c.customer_id
                      AND oi.product_id = p.product_id
                      AND o.status <> 'cancelled'
                      AND o.order_date >= '2024-01-01'
                      AND o.order_date < '2025-01-01'
                )
          )
          ORDER BY c.customer_id;
        ordered: true
        columnNames: true
        hints:
          - Copy the double NOT EXISTS from the example.
          - Add the two date conditions to the innermost `WHERE`, so they apply to the orders.
          - "AND o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'"
        explanation: |
          Three customers bought every Outdoor product in 2024: 14, 39 and 62. Two of the five customers from the all-time badge did not buy the full set this year. Putting the date filter in the innermost query keeps the logic correct: a product bought in 2023 does not count.
        difficulty: 3

      - type: exercise
        id: m19-l09-e5
        title: Full sets in every category (stretch)
        prompt: |
          For each category that has at least one customer who bought every product in it, show the category `name` and `full_buyers`, the number of such customers. Cancelled orders are excluded.

          Order by `name` A to Z.
        starter: |
          SELECT name, COUNT(*) AS full_buyers
          FROM categories
          GROUP BY name;
        solution: |
          WITH bought AS (
              SELECT DISTINCT o.customer_id,
                     oi.product_id
              FROM orders AS o
              JOIN order_items AS oi
                ON oi.order_id = o.order_id
              WHERE o.status <> 'cancelled'
          ),
          full_sets AS (
              SELECT p.category_id,
                     b.customer_id
              FROM bought AS b
              JOIN products AS p
                ON p.product_id = b.product_id
              GROUP BY p.category_id, b.customer_id
              HAVING COUNT(DISTINCT b.product_id) = (
                  SELECT COUNT(*)
                  FROM products AS p2
                  WHERE p2.category_id = p.category_id
              )
          )
          SELECT c.name,
                 COUNT(*) AS full_buyers
          FROM full_sets AS f
          JOIN categories AS c
            ON c.category_id = f.category_id
          GROUP BY c.name
          ORDER BY c.name;
        ordered: true
        columnNames: true
        hints:
          - Build the full sets per category first, as in the stepper, with `GROUP BY category_id, customer_id`.
          - Inside the `HAVING`, the total must be the number of products in the **same** category, so use a correlated subquery.
          - "... JOIN categories AS c ON c.category_id = f.category_id GROUP BY c.name ORDER BY c.name;"
        explanation: |
          Two categories have at least one full buyer: Computers (1 customer) and Outdoor (5 customers). Categories without any product, such as Electronics, are not in the output at all, because nothing ever matches them.
        difficulty: 3

    cheatsheet:
      - title: Count distinct products
        sql: "HAVING COUNT(DISTINCT oi.product_id) = (SELECT COUNT(*) FROM products WHERE category_id = 11)"
        note: "Equal to the total means the customer bought every product."
      - title: Double NOT EXISTS
        sql: |
          WHERE NOT EXISTS (
              SELECT 1 FROM products p
              WHERE p.category_id = 11 AND NOT EXISTS (...))
        note: "Reads as: there is no product in the category that the customer did not buy."
      - title: At least N
        sql: "HAVING COUNT(DISTINCT oi.product_id) >= 2"
        note: "Use >= for at least N of the items instead of every item."

testPool:
  # ---------------------------------------------------------- l01 Growth
  - type: exercise
    id: m19-t01
    lesson: m19-l01
    difficulty: 2
    prompt: |
      For each quarter of **2024**, show the `quarter`, its `revenue` and `qoq_pct`: the percentage change from the quarter before, rounded to 1 decimal place. The first quarter of 2024 is compared with the fourth quarter of 2023.

      Leave out cancelled orders, round `revenue` to 2 decimal places and order by `quarter`.
    starter: |
      SELECT DATE_TRUNC('quarter', order_date)::date AS quarter
      FROM orders;
    solution: |
      WITH quarterly AS (
          SELECT DATE_TRUNC('quarter', o.order_date)::date AS quarter,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          WHERE o.status <> 'cancelled'
          GROUP BY quarter
      ),
      with_prev AS (
          SELECT quarter,
                 revenue,
                 LAG(revenue) OVER (ORDER BY quarter) AS prev_revenue
          FROM quarterly
      )
      SELECT quarter,
             revenue,
             ROUND(100.0 * (revenue - prev_revenue) / prev_revenue, 1) AS qoq_pct
      FROM with_prev
      WHERE quarter >= '2024-01-01'
      ORDER BY quarter;
    ordered: true
    columnNames: true
    hints:
      - Group by quarter instead of month. `DATE_TRUNC('quarter', ...)` does that.
      - Put the `LAG` in a CTE, then filter 2024 in the last query.
      - "... LAG(revenue) OVER (ORDER BY ___) AS prev_revenue ... ROUND(100.0 * (revenue - ___) / ___, 1) ..."
    explanation: |
      Q1 2024 fell 36.6% from Q4 2023, then the business rebounded and Q4 2024 was 79.2% above Q3. Quarters smooth out some of the noise you see in single months.
  # ---------------------------------------------------------- l01 Growth
  - type: quiz
    id: m19-t02
    lesson: m19-l01
    difficulty: 1
    question: |
      Which statement about `LAG` is true?
    options:
      - It looks forward to the next row.
      - It returns the value from a row before the current one, one row back by default.
      - It only works when the query has a GROUP BY.
      - It always returns 0 on the first row.
    answer: 1
    explanation: |
      `LAG` looks back. `LAG(x)` goes one row back and `LAG(x, 12)` goes twelve rows back. On the first row there is nothing to look back at, so the result is NULL, not 0.
  # ---------------------------------------------------------- l01 Growth
  - type: predict
    id: m19-t03
    lesson: m19-l01
    difficulty: 2
    question: |
      What is the `running_total` on the **2024-03-01** row?
    sql: |
      WITH monthly AS (
          SELECT DATE_TRUNC('month', o.order_date)::date AS month,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id
          WHERE o.status <> 'cancelled'
          GROUP BY month
      )
      SELECT month,
             SUM(revenue) OVER (ORDER BY month) AS running_total
      FROM monthly
      WHERE month IN ('2024-01-01', '2024-03-01')
      ORDER BY month;
    options: ["9728.21", "14240.17", "18666.72", "An error"]
    answer: 2
    explanation: |
      The `WHERE` keeps only January and March 2024, so February is not in the running total. January (8,938.51) plus March (9,728.21) gives 18,666.72. Filters run before window functions, so the window only sees the two months that were kept.
  # ---------------------------------------------------------- l02 Gaps & islands
  - type: exercise
    id: m19-t04
    lesson: m19-l02
    difficulty: 2
    prompt: |
      Show each user whose **longest** streak is at least 60 days. Show `user_id` and `longest_streak` (the number of days in that user's longest streak).

      Order by `longest_streak` from largest to smallest, then by `user_id` from smallest to largest.
    starter: |
      SELECT user_id, COUNT(*) AS longest_streak
      FROM daily_steps
      GROUP BY user_id;
    solution: |
      WITH numbered AS (
          SELECT user_id,
                 day,
                 ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
          FROM daily_steps
      ),
      streaks AS (
          SELECT user_id,
                 COUNT(*) AS days
          FROM numbered
          GROUP BY user_id, day - rn::int
      )
      SELECT user_id,
             MAX(days) AS longest_streak
      FROM streaks
      GROUP BY user_id
      HAVING MAX(days) >= 60
      ORDER BY longest_streak DESC, user_id;
    ordered: true
    columnNames: true
    hints:
      - First count the days of each streak, then take the largest count per user.
      - Use `HAVING MAX(...) >= 60` to keep only the long ones.
      - "... streaks AS (SELECT user_id, COUNT(*) AS days FROM numbered GROUP BY user_id, ___) ..."
    explanation: |
      Six users have a streak of 60 days or more. Users 23 and 107 both have 67 days, so `user_id` decides that they are listed in order 23, then 107.
  # ---------------------------------------------------------- l02 Gaps & islands
  - type: quiz
    id: m19-t05
    lesson: m19-l02
    difficulty: 1
    question: |
      Two days of the same user have the **same** island key. What does that tell you?
    options:
      - They are in the same unbroken run of days for that user.
      - They fall on the same day of the week.
      - They have the same number of steps.
      - They belong to two different users.
    answer: 0
    explanation: |
      Days that share a key are in the same island, which is an unbroken streak. The key says nothing about the weekday or the steps, and it is computed per user, so two users can share a key without any link between them.
  # ---------------------------------------------------------- l02 Gaps & islands
  - type: fill
    id: m19-t06
    lesson: m19-l02
    difficulty: 2
    prompt: Complete the query so that each streak is one group. The island key is the day minus the row number.
    template: |
      WITH numbered AS (
          SELECT user_id,
                 day,
                 ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS rn
          FROM daily_steps
      )
      SELECT user_id,
             MIN(day) AS start_day,
             MAX(day) AS end_day
      FROM numbered
      GROUP BY user_id, day - ___::int
      ORDER BY user_id, start_day;
    answers:
      - ["rn"]
    explanation: "Subtracting the row number `rn` from the day gives one key per streak. Grouping by that key returns one row per streak."
  # ---------------------------------------------------------- l03 Sessions
  - type: exercise
    id: m19-t07
    lesson: m19-l03
    difficulty: 2
    prompt: |
      How many visits **started** in March 2024, across all users? A visit starts at its first event.

      Show the answer as one value named `march_visits`.
    starter: |
      SELECT COUNT(*) AS march_visits
      FROM events
      WHERE event_time >= '2024-03-01';
    solution: |
      WITH gaps AS (
          SELECT user_id,
                 event_time,
                 event_time - LAG(event_time) OVER (
                     PARTITION BY user_id
                     ORDER BY event_time
                 ) AS gap
          FROM events
      ),
      flagged AS (
          SELECT user_id,
                 event_time,
                 CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                      THEN 1 ELSE 0 END AS new_session
          FROM gaps
      ),
      numbered AS (
          SELECT user_id,
                 event_time,
                 SUM(new_session) OVER (
                     PARTITION BY user_id
                     ORDER BY event_time
                 ) AS session_no
          FROM flagged
      ),
      visits AS (
          SELECT MIN(event_time) AS started
          FROM numbered
          GROUP BY user_id, session_no
      )
      SELECT COUNT(*) AS march_visits
      FROM visits
      WHERE started >= '2024-03-01'
        AND started < '2024-04-01';
    columnNames: true
    hints:
      - Build one row per visit, with its first event time, as in the earlier examples.
      - Keep the visits whose start is on or after 1 March and before 1 April 2024.
      - "... FROM visits WHERE started >= '2024-03-01' AND started < ___;"
    explanation: |
      Counting visits by their start time gives a different answer from counting events. Use the first event time of each visit, and the half-open range `>= 1 March` and `< 1 April` keeps every time on 31 March.
  # ---------------------------------------------------------- l03 Sessions
  - type: quiz
    id: m19-t08
    lesson: m19-l03
    difficulty: 2
    question: |
      User 3's first two events are 1 minute 50 seconds apart, so today they form one visit. Which change would split them into **two** visits?
    options:
      - Use a rule that starts a new visit after more than 1 minute of quiet time.
      - Use a rule that starts a new visit after more than 3 hours of quiet time.
      - Add `PARTITION BY event_name` to the window.
      - Count the events instead of the visits.
    answer: 0
    explanation: |
      The visit rule is "a gap bigger than the threshold starts a new visit". A 1-minute threshold is smaller than the 1 minute 50 seconds between the two events, so they are split. A 3-hour threshold would join more events, and the other two changes do not affect the gap rule at all.
  # ---------------------------------------------------------- l03 Sessions
  - type: predict
    id: m19-t09
    lesson: m19-l03
    difficulty: 3
    question: |
      This query numbers the new visits, but it **leaves out** `PARTITION BY user_id`. What is `session_no` on the very last event (the one with the latest `event_time`)?
    sql: |
      WITH gaps AS (
          SELECT user_id,
                 event_time,
                 event_time - LAG(event_time) OVER (
                     PARTITION BY user_id
                     ORDER BY event_time
                 ) AS gap
          FROM events
      ),
      flagged AS (
          SELECT event_time,
                 CASE WHEN gap IS NULL OR gap > INTERVAL '30 minutes'
                      THEN 1 ELSE 0 END AS new_session
          FROM gaps
      )
      SELECT event_time,
             SUM(new_session) OVER (ORDER BY event_time) AS session_no
      FROM flagged
      ORDER BY event_time DESC
      LIMIT 1;
    options: ["4122", "280", "7010", "1"]
    answer: 0
    explanation: |
      Without a partition, the running total counts every new visit of every user, in one long line. The last event therefore carries the total of all 4,122 visits. The correct version restarts the count for each user, which is why it is the one you should write.
  # ---------------------------------------------------------- l04 Funnels
  - type: exercise
    id: m19-t10
    lesson: m19-l04
    difficulty: 2
    prompt: |
      How many **different** users on the `web` platform ever did a `share` event? Count each user once.

      Show the answer as one value named `web_sharers`.
    starter: |
      SELECT COUNT(*) AS web_sharers
      FROM events AS e
      JOIN users AS u
        ON u.user_id = e.user_id
      WHERE u.platform = 'web';
    solution: |
      SELECT COUNT(DISTINCT e.user_id) AS web_sharers
      FROM events AS e
      JOIN users AS u
        ON u.user_id = e.user_id
      WHERE u.platform = 'web'
        AND e.event_name = 'share';
    columnNames: true
    hints:
      - Join `events` to `users` to get the platform, then filter on `share`.
      - A user who shared five times is still one user, so use `DISTINCT`.
      - "SELECT COUNT(DISTINCT e.___) AS web_sharers FROM events AS e JOIN users AS u ON ... WHERE ... AND e.event_name = 'share';"
    explanation: |
      Five different web users shared something. The `COUNT(*)` in the starter counts every share and every other event too, so it is far larger. Using `DISTINCT user_id` is the funnel habit that gives you people instead of taps.
  # ---------------------------------------------------------- l04 Funnels
  - type: quiz
    id: m19-t11
    lesson: m19-l04
    difficulty: 1
    question: |
      In a funnel table with one row per step, why use `FIRST_VALUE(users) OVER (ORDER BY step_no)`?
    options:
      - It removes duplicate steps.
      - It puts the first step's user count on every row, so each step can be divided by it.
      - It sorts the steps alphabetically.
      - It counts the number of steps.
    answer: 1
    explanation: |
      `FIRST_VALUE` returns the value from the first row of the window on every row. With `ORDER BY step_no`, the first row is the opening step, so each row can show its percentage of that starting number.
  # ---------------------------------------------------------- l04 Funnels
  - type: predict
    id: m19-t12
    lesson: m19-l04
    difficulty: 2
    question: |
      This query counts `app_open` events for users on the `web` platform. What number does it return?
    sql: |
      SELECT COUNT(*) AS web_opens
      FROM events AS e
      JOIN users AS u
        ON u.user_id = e.user_id
      WHERE u.platform = 'web'
        AND e.event_name = 'app_open';
    options: ["53", "730", "5", "100"]
    answer: 1
    explanation: |
      `COUNT(*)` counts every `app_open` tap, and web users opened the app 730 times. The number of different web users who opened it is 53, which is what you would get with `COUNT(DISTINCT e.user_id)`. Check which one a question is asking for.
  # ---------------------------------------------------------- l05 Retention
  - type: exercise
    id: m19-t13
    lesson: m19-l05
    difficulty: 2
    prompt: |
      How many **different** users who signed up in **March 2024** had an event in **week 2** after their signup (days 14 to 20 after signup)?

      Show the answer as one value named `march_week2`.
    starter: |
      SELECT COUNT(*) AS march_week2
      FROM users
      WHERE signup_date >= '2024-03-01'
        AND signup_date < '2024-04-01';
    solution: |
      WITH weeks AS (
          SELECT DISTINCT e.user_id,
                 (e.event_time::date - u.signup_date) / 7 AS week_no
          FROM events AS e
          JOIN users AS u
            ON u.user_id = e.user_id
      )
      SELECT COUNT(DISTINCT w.user_id) AS march_week2
      FROM users AS u
      JOIN weeks AS w
        ON w.user_id = u.user_id
      WHERE u.signup_date >= '2024-03-01'
        AND u.signup_date < '2024-04-01'
        AND w.week_no = 2;
    columnNames: true
    hints:
      - Build the `weeks` CTE, then keep only the users who signed up in March.
      - Week 2 means `week_no = 2`, which is 14 to 20 days after signup.
      - "... WHERE u.signup_date >= '2024-03-01' AND u.signup_date < '2024-04-01' AND w.week_no = ___;"
    explanation: |
      Twenty-four March users were active in week 2, which matches the March cohort's week 2 count in the retention matrix. The starter counts March signups, not their activity, so it does not match.
  # ---------------------------------------------------------- l05 Retention
  - type: quiz
    id: m19-t14
    lesson: m19-l05
    difficulty: 1
    question: |
      A user signed up on 1 May 2024 and had an event on 15 May 2024. Using `(event date - signup date) / 7`, which week number is that event in?
    options: ["0", "1", "2", "14"]
    answer: 2
    explanation: |
      From 1 May to 15 May is 14 days. 14 divided by 7 is 2, so the event is in week 2. Week 0 is days 0 to 6, week 1 is days 7 to 13, and week 2 is days 14 to 20.
  # ---------------------------------------------------------- l05 Retention
  - type: predict
    id: m19-t15
    lesson: m19-l05
    difficulty: 2
    question: |
      How many users are in the **March 2024** signup cohort?
    sql: |
      SELECT DATE_TRUNC('month', signup_date)::date AS cohort_month,
             COUNT(*) AS users
      FROM users
      GROUP BY cohort_month
      ORDER BY cohort_month;
    options: ["47", "51", "53", "25"]
    answer: 1
    explanation: |
      The March row of the cohort table has 51 users. The cohort is defined by the signup date alone, so a user who never opened the app still counts as part of it.
  # ---------------------------------------------------------- l06 Moving & Pareto
  - type: exercise
    id: m19-t16
    lesson: m19-l06
    difficulty: 2
    prompt: |
      How many days in the first quarter of 2024 (from 1 January to 31 March, both included) had **no sales**? Cancelled orders do not count as sales.

      Show the answer as one value named `quiet_days`.
    starter: |
      SELECT COUNT(*) AS quiet_days
      FROM orders
      WHERE order_date BETWEEN '2024-01-01' AND '2024-03-31';
    solution: |
      WITH daily AS (
          SELECT DISTINCT o.order_date AS day
          FROM orders AS o
          WHERE o.status <> 'cancelled'
      ),
      calendar AS (
          SELECT g.day::date AS day
          FROM generate_series(DATE '2024-01-01', DATE '2024-03-31',
                               INTERVAL '1 day') AS g(day)
      )
      SELECT COUNT(*) AS quiet_days
      FROM calendar AS c
      LEFT JOIN daily AS d
        ON d.day = c.day
      WHERE d.day IS NULL;
    columnNames: true
    hints:
      - Build the calendar of the quarter, then find the days with no matching sale.
      - A day with no sales has no match in the `daily` list, so the join gives `NULL` in that column.
      - "... LEFT JOIN daily AS d ON d.day = c.day WHERE d.day ___;"
    explanation: |
      The quarter has 91 days. 48 of them had at least one sale, so 43 had none. Counting the rows of `orders` would be wrong, because it only shows the days that have an order and never shows the empty days.
  # ---------------------------------------------------------- l06 Moving & Pareto
  - type: quiz
    id: m19-t17
    lesson: m19-l06
    difficulty: 2
    question: |
      What does the window frame `ROWS BETWEEN 2 PRECEDING AND 1 FOLLOWING` cover for each row?
    options:
      - The two rows after the current row and the row before it.
      - Two rows before the current row, the current row, and one row after it.
      - Only the current row and the row after it.
      - All rows from the start of the table to the current row.
    answer: 1
    explanation: |
      The frame starts two rows before the current row and ends one row after it, so each window has four rows: two before, the current row and one after. `UNBOUNDED PRECEDING` is the option that means "from the very start".
  # ---------------------------------------------------------- l06 Moving & Pareto
  - type: predict
    id: m19-t18
    lesson: m19-l06
    difficulty: 3
    question: |
      The query counts the products whose **running total, including themselves,** is below 80% of revenue. How many products does it count?
    sql: |
      WITH rev AS (
          SELECT p.product_id,
                 SUM(i.quantity * i.unit_price * (1 - i.discount)) AS revenue
          FROM order_items AS i
          JOIN orders AS o
            ON o.order_id = i.order_id
          JOIN products AS p
            ON p.product_id = i.product_id
          WHERE o.status <> 'cancelled'
          GROUP BY p.product_id
      ),
      ranked AS (
          SELECT product_id,
                 SUM(revenue) OVER (
                     ORDER BY revenue DESC, product_id
                     ROWS UNBOUNDED PRECEDING
                 ) AS running,
                 SUM(revenue) OVER () AS total
          FROM rev
      )
      SELECT COUNT(*) AS below_80pct
      FROM ranked
      WHERE running < 0.8 * total;
    options: ["22", "23", "55", "0"]
    answer: 0
    explanation: |
      Product 23 is the first one whose running total goes above 80%, so the 22 products before it are below the line. The version in the lesson subtracts the product's own revenue to find the products needed to reach 80%, and that count is 23. The difference is one product, which is why the question wording matters.
  # ---------------------------------------------------------- l07 Percentiles
  - type: exercise
    id: m19-t19
    lesson: m19-l07
    difficulty: 2
    prompt: |
      For plays on the `web` device only, find the **first quartile** of `minutes_watched`: the value that 25% of plays stay below. Round it to 1 decimal place.

      Show one row, named `q1_min`.
    starter: |
      SELECT AVG(minutes_watched) AS q1_min
      FROM watch_history
      WHERE device = 'web';
    solution: |
      SELECT ROUND(percentile_cont(0.25)
                   WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)
             AS q1_min
      FROM watch_history
      WHERE device = 'web';
    columnNames: true
    hints:
      - A quartile is a percentile with a fraction of 0.25.
      - Put the `WHERE device = 'web'` next to the percentile, as in the device example.
      - "ROUND(percentile_cont(___) WITHIN GROUP (ORDER BY minutes_watched)::numeric, 1)"
    explanation: |
      A quarter of web plays last 14 minutes or less. The first quartile, the median and the third quartile split the plays into four equal groups, and they describe the spread better than the average does.
  # ---------------------------------------------------------- l07 Percentiles
  - type: quiz
    id: m19-t20
    lesson: m19-l07
    difficulty: 1
    question: |
      Which fraction do you give to `percentile_cont` to get the **median**?
    options: ["0.25", "0.5", "0.9", "1.0"]
    answer: 1
    explanation: |
      The median is the 50th percentile, so the fraction is 0.5. The 0.25 is the first quartile, 0.9 is the 90th percentile, and 1.0 is the maximum.
  # ---------------------------------------------------------- l07 Percentiles
  - type: predict
    id: m19-t21
    lesson: m19-l07
    difficulty: 2
    question: |
      What does this query return?
    sql: |
      SELECT percentile_disc(0.75)
             WITHIN GROUP (ORDER BY x) AS p75
      FROM (VALUES (1), (2), (3), (4)) AS t(x);
    options: ["2", "3", "3.25", "4"]
    answer: 1
    explanation: |
      `percentile_disc` returns a value that exists in the list. The first value at or above the 75th percentile position is 3. The continuous version would interpolate to 3.25, which is why the two versions give different answers on small tables.
  # ---------------------------------------------------------- l08 Market basket
  - type: exercise
    id: m19-t22
    lesson: m19-l08
    difficulty: 2
    prompt: |
      How many different orders that are **not cancelled** contain product **17**? Count each order once.

      Show the answer as one value named `orders_with_17`.
    starter: |
      SELECT COUNT(*) AS orders_with_17
      FROM order_items
      WHERE product_id = 17;
    solution: |
      SELECT COUNT(DISTINCT oi.order_id) AS orders_with_17
      FROM order_items AS oi
      JOIN orders AS o
        ON o.order_id = oi.order_id
      WHERE oi.product_id = 17
        AND o.status <> 'cancelled';
    columnNames: true
    hints:
      - Join `order_items` to `orders` to check the status.
      - Filter on `product_id = 17` and on the status not being cancelled.
      - "SELECT COUNT(DISTINCT oi.___) AS orders_with_17 FROM order_items AS oi JOIN orders AS o ON ... WHERE ...;"
    explanation: |
      48 valid orders contain product 17. The question asks for orders, not lines, so `COUNT(DISTINCT order_id)` counts each order once, however many lines of product 17 it has. Cancelled orders are removed by the join's `WHERE`.
  # ---------------------------------------------------------- l08 Market basket
  - type: quiz
    id: m19-t23
    lesson: m19-l08
    difficulty: 2
    question: |
      In a market basket query, why do we write `b.product_id > a.product_id` in the join?
    options:
      - It makes the query faster by using an index.
      - It keeps each pair of products once and removes a product paired with itself.
      - It removes orders that contain only one product.
      - It sorts the pairs from highest to lowest.
    answer: 1
    explanation: |
      Without the condition, `(9, 11)` and `(11, 9)` would both be counted, and every product would also pair with itself. Requiring the second id to be bigger keeps one copy of each pair.
  # ---------------------------------------------------------- l08 Market basket
  - type: predict
    id: m19-t24
    lesson: m19-l08
    difficulty: 3
    question: |
      Order 2 has four products. This query uses `<>` instead of `>`. How many rows does it return for order 2?
    sql: |
      SELECT a.product_id AS product_a,
             b.product_id AS product_b
      FROM order_items AS a
      JOIN order_items AS b
        ON b.order_id = a.order_id
       AND b.product_id <> a.product_id
      WHERE a.order_id = 2;
    options: ["6", "8", "12", "16"]
    answer: 2
    explanation: |
      Each of the four products pairs with the other three, which gives 4 times 3 = 12 rows. Each pair appears twice, once in each direction. The `>` version gives six rows, one per pair, which is why it is the right choice for counting pairs.
  # ---------------------------------------------------------- l09 Division
  - type: exercise
    id: m19-t25
    lesson: m19-l09
    difficulty: 1
    prompt: |
      How many different customers bought **at least one** product from the **Computers** category (category 7)? Cancelled orders are excluded.

      Show the answer as one value named `computer_buyers`.
    starter: |
      SELECT COUNT(*) AS computer_buyers
      FROM customers;
    solution: |
      SELECT COUNT(DISTINCT o.customer_id) AS computer_buyers
      FROM orders AS o
      JOIN order_items AS oi
        ON oi.order_id = o.order_id
      JOIN products AS p
        ON p.product_id = oi.product_id
      WHERE o.status <> 'cancelled'
        AND p.category_id = 7;
    columnNames: true
    hints:
      - "This is the \"some\" question, so you do not need a total from the products table."
      - Join the orders, lines and products, then filter on category 7 and on the status.
      - "SELECT COUNT(DISTINCT o.customer_id) AS computer_buyers FROM orders AS o JOIN ... WHERE ...;"
    explanation: |
      48 customers bought at least one Computers product. Compared with the single customer who bought all three, that shows how much stricter the "every" question is.
  # ---------------------------------------------------------- l09 Division
  - type: predict
    id: m19-t26
    lesson: m19-l09
    difficulty: 3
    question: |
      The category 1 (Electronics) has **no products** at all. This query uses the double NOT EXISTS. How many customers does it return?
    sql: |
      SELECT COUNT(*) AS customers_returned
      FROM customers AS c
      WHERE NOT EXISTS (
          SELECT 1
          FROM products AS p
          WHERE p.category_id = 1
            AND NOT EXISTS (
                SELECT 1
                FROM orders AS o
                JOIN order_items AS oi
                  ON oi.order_id = o.order_id
                WHERE o.customer_id = c.customer_id
                  AND oi.product_id = p.product_id
                  AND o.status <> 'cancelled'
            )
      );
    options: ["0", "1", "14", "150"]
    answer: 3
    explanation: |
      With no products in the category, there is no "missing product" for anyone, so every customer passes the test. This is a known trap: "bought every product" is true for everybody when the list is empty. The counting method would return nobody here, so check your edge cases before trusting a badge rule.
