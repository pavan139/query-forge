id: m15
order: 15
title: "Views, Indexes & Performance"
subtitle: Reuse your best queries and make slow ones fast
icon: "⚡"
level: advanced
description: |
  Until now you made queries give the *right* answer. In this module you make them give it **fast**, and
  you learn to save your best queries so nobody has to rewrite them.

  You will create **views** (saved queries) and **materialized views** (saved results), learn how an
  **index** lets PostgreSQL jump straight to a row, read **EXPLAIN** plans like an X-ray, design smarter
  indexes, write queries the database can run quickly, and peek under the hood at how joins, statistics and
  `VACUUM` work.

  The shop is small, so for the speed experiments you will build bigger practice tables with one line of
  SQL, right inside the examples. Your timing numbers will differ a little from the ones in the lessons,
  but the *shape* of every plan stays the same.
dataset: shop
lessons:
  - id: m15-l01
    title: "Views: saved queries"
    summary: Give a query a name with CREATE VIEW and reuse it like a table.
    minutes: 25
    steps:
      - type: read
        title: The copy-and-paste problem
        md: |
          Mia, the ShopSmart manager, has a problem. Six different reports all start with the same eight lines of SQL: join orders to their items and work out each order's **total**. Last week an analyst pasted the query and forgot one line of the discount calculation. Two reports showed different revenue and nobody knew which one was right.

          What Mia wants is **one official copy** of that query, with a name, that everybody can use. SQL has exactly that: a **view**.

          A **view** is a *saved query* with a name. After you create it, you can use it in `FROM` just like a table.

          > [!ANALOGY]
          > A view is like a **saved search** in your email app. The search does not copy your emails anywhere. Each time you click it, the app looks through your mailbox again and shows what matches *right now*.

      - type: example
        title: Your first view
        md: |
          The syntax is `CREATE VIEW name AS` followed by any `SELECT`. Press **Run**. The first statement saves the view, and the second one reads from it.
        sql: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;

          SELECT name, price
          FROM active_products
          ORDER BY price DESC
          LIMIT 5;
        after: |
          You just treated `active_products` like a table: you chose columns, sorted and limited it. But there is no `active_products` data anywhere. PostgreSQL swapped the name for the saved `SELECT` and ran it on the `products` table.

          Only the **56 products that are still for sale** appear, because the view's `WHERE` was saved with it.

      - type: read
        title: A view stores the question, not the answer
        md: |
          This is the most important idea of the lesson:

          - A view stores **the text of a query**. It stores **no rows**.
          - Every time you read from a view, PostgreSQL runs that query on the **current** data.
          - So a view is always fresh, and it takes almost no space.

          That also means a view is **not faster** than the query inside it. It is a shortcut for *typing*, not a shortcut for *speed*. (For speed, you will meet materialized views in the next lesson.)

          > [!TIP]
          > Look at the schema panel next to the editor. Views are listed next to the tables, so you can find them and see their columns.

      - type: quiz
        id: m15-l01-q1
        question: |
          What does PostgreSQL actually **store** when you run `CREATE VIEW cheap_items AS SELECT ...`?
        options:
          - "A copy of the rows the SELECT returns"
          - "The text of the SELECT query, under the name cheap_items"
          - "An index on the table"
          - "A backup of the whole table"
        answer: 1
        explanation: |
          A view is a **named query**. No rows are copied. Each time you use the view, the stored `SELECT` runs again on the live tables, which is why a view is never out of date.

      - type: exercise
        id: m15-l01-e1
        title: Your own view
        prompt: |
          Create a view called `cheap_products` that shows `product_id`, `name` and `price` (in that order) of every product that costs **less than 20**.

          After the `CREATE VIEW` you can add a `SELECT * FROM cheap_products;` to look at it. The check only needs the view to exist.
        starter: |
          CREATE VIEW cheap_products AS
          SELECT
        solution: |
          CREATE VIEW cheap_products AS
          SELECT product_id, name, price
          FROM products
          WHERE price < 20;
        check: |
          SELECT * FROM cheap_products ORDER BY product_id;
        hints:
          - A view is just `CREATE VIEW some_name AS` followed by a normal SELECT query.
          - "The query needs three columns from `products` and a `WHERE price < 20`."
          - "CREATE VIEW cheap_products AS SELECT product_id, ___, price FROM products WHERE ___;"
        explanation: |
          Eight products cost less than 20, from the 9.99 screen protectors to the 19.99 jigsaw puzzle. If you later change a price in `products`, this view changes with it, because it re-runs its query every time.
        difficulty: 1

      - type: stepper
        title: Building the order_totals view
        md: |
          Mia's official "order total" query is long, so let's build it one clause at a time before we save it. Click through the stages. Each one runs and shows its result.
        stages:
          - "label: Orders"
            md: Start with the orders themselves.
            sql: |
              SELECT order_id, customer_id, order_date, status
              FROM orders
              ORDER BY order_id
              LIMIT 5;
          - "label: Join items"
            md: Each order has one or more lines in `order_items`. Join them.
            sql: |
              SELECT o.order_id, i.quantity, i.unit_price, i.discount
              FROM orders o
              JOIN order_items i ON i.order_id = o.order_id
              ORDER BY o.order_id
              LIMIT 6;
          - "label: Line totals"
            md: A line is worth quantity times unit price, minus its discount.
            sql: |
              SELECT o.order_id,
                     i.quantity * i.unit_price * (1 - i.discount) AS line_total
              FROM orders o
              JOIN order_items i ON i.order_id = o.order_id
              ORDER BY o.order_id
              LIMIT 6;
          - "label: Group"
            md: Add the lines up with `SUM`, one row per order.
            sql: |
              SELECT o.order_id, o.customer_id, o.order_date, o.status,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
              FROM orders o
              JOIN order_items i ON i.order_id = o.order_id
              GROUP BY o.order_id, o.customer_id, o.order_date, o.status
              ORDER BY o.order_id
              LIMIT 5;
          - "label: Save it"
            md: Put `CREATE VIEW order_totals AS` in front. The query inside has no `LIMIT` or `ORDER BY`, because the view should hold *all* orders.
            sql: |
              CREATE VIEW order_totals AS
              SELECT o.order_id, o.customer_id, o.order_date, o.status,
                     ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
              FROM orders o
              JOIN order_items i ON i.order_id = o.order_id
              GROUP BY o.order_id, o.customer_id, o.order_date, o.status;

              SELECT * FROM order_totals ORDER BY order_id LIMIT 5;

      - type: read
        title: One definition, many users
        md: |
          Now every analyst can skip the join and the maths. "The biggest delivered orders of 2024" shrinks from a dozen lines to five:

          ```sql
          SELECT order_id, order_date, total
          FROM order_totals
          WHERE status = 'delivered'
            AND order_date >= '2024-01-01'
          ORDER BY total DESC
          LIMIT 5;
          ```

          The tricky discount maths lives in **one** place. If Mia ever changes the definition of "total", she changes the view once and every report follows.

          That is the biggest reason views exist: **one definition, many users**. You will use the view in a minute.

      - type: predict
        id: m15-l01-p1
        question: |
          The view `cheap_products` lists products under 20 (8 products right now). Then one product's price is changed to 25. How many rows does the **last** query return?
        sql: |
          CREATE VIEW cheap_products AS
          SELECT product_id, name, price
          FROM products
          WHERE price < 20;

          UPDATE products SET price = 25 WHERE product_id = 13;

          SELECT COUNT(*) FROM cheap_products;
        options: ["8", "7", "0", "An error"]
        answer: 1
        explanation: |
          **7**. The view has no stored rows, so when the price of product 13 (Desk Mat XL) goes up to 25, the next read of the view simply no longer matches it. A view is always as fresh as the tables underneath.

      - type: exercise
        id: m15-l01-e2
        title: Query a view
        prompt: |
          The view `order_totals` has already been created for you. It has the columns `order_id`, `customer_id`, `order_date`, `status` and `total`.

          Show the `order_id` and `total` of the **5 biggest delivered orders placed in 2024** (order_date from `2024-01-01`). Biggest total first, ties broken by `order_id`.
        setup: |
          CREATE VIEW order_totals AS
          SELECT o.order_id, o.customer_id, o.order_date, o.status,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          GROUP BY o.order_id, o.customer_id, o.order_date, o.status;
        starter: |
          SELECT order_id, total
          FROM order_totals;
        solution: |
          SELECT order_id, total
          FROM order_totals
          WHERE status = 'delivered'
            AND order_date >= '2024-01-01'
          ORDER BY total DESC, order_id
          LIMIT 5;
        ordered: true
        hints:
          - You can treat `order_totals` exactly like a table. Add the filters you know.
          - "Filter with `WHERE status = 'delivered' AND order_date >= '2024-01-01'`, then `ORDER BY total DESC, order_id` and `LIMIT 5`."
          - "SELECT order_id, total FROM order_totals WHERE status = ___ AND order_date >= ___ ORDER BY total DESC, order_id LIMIT 5;"
        explanation: |
          Order 419 comes first with a total of 1,982.96, then 667, 482, 508 and 412. Notice you did not write a single `JOIN`: the view hid it.
        difficulty: 1

      - type: exercise
        id: m15-l01-e3
        title: A summary view
        prompt: |
          Create a view called `category_stats` with three columns, in this order:

          - "`category`: the category name (`categories.name`)"
          - "`products`: how many products are in that category"
          - "`avg_price`: the average product price, rounded to 2 decimals"

          Only categories that have at least one product will appear.
        starter: |
          CREATE VIEW category_stats AS
          SELECT
        solution: |
          CREATE VIEW category_stats AS
          SELECT c.name AS category,
                 COUNT(*) AS products,
                 ROUND(AVG(p.price), 2) AS avg_price
          FROM categories c
          JOIN products p ON p.category_id = c.category_id
          GROUP BY c.name;
        check: |
          SELECT * FROM category_stats ORDER BY category;
        columnNames: true
        hints:
          - You need to join `categories` to `products`, then group by the category name.
          - "Use `COUNT(*)` and `ROUND(AVG(p.price), 2)`, and give all three columns aliases."
          - "CREATE VIEW category_stats AS SELECT c.name AS category, COUNT(*) AS products, ROUND(AVG(___), 2) AS avg_price FROM categories c JOIN products p ON ___ GROUP BY c.name;"
        explanation: |
          The view returns 11 rows, one per category that has products. A view can hold any query you like, including joins and `GROUP BY`. The column names come from your aliases.
        difficulty: 2

      - type: read
        title: Changing and renaming a view
        md: |
          Your view needs a new column? You can rewrite it with **`CREATE OR REPLACE VIEW`**. It creates the view if it is missing and replaces it if it exists.

          There is one rule: the new query must keep all the old columns, **same names, same order, same types**. You may only add new columns at the **end**.

          > [!MISTAKE]
          > Trying to reorder, rename or remove columns with `CREATE OR REPLACE VIEW` fails with an error such as `cannot change name of view column`. To rename a column use `ALTER VIEW ... RENAME COLUMN`. To make bigger changes, `DROP VIEW` the old one first and create it again.

      - type: example
        title: CREATE OR REPLACE VIEW
        md: |
          We create `active_products` with four columns, then replace it with a version that has a fifth column, `category_id`, added at the end.
        sql: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;

          CREATE OR REPLACE VIEW active_products AS
          SELECT product_id, name, price, stock_qty, category_id
          FROM products
          WHERE is_active = true;

          SELECT * FROM active_products ORDER BY product_id LIMIT 3;
        after: |
          The new column is at the end, so PostgreSQL accepts the replacement. Anyone who already used the old four columns keeps working, which is why this rule exists.

      - type: example
        title: When REPLACE says no
        md: |
          This time the new version swaps the order of `name` and `price`. Run it and read the error.
        sql: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;

          CREATE OR REPLACE VIEW active_products AS
          SELECT product_id, price, name, stock_qty
          FROM products
          WHERE is_active = true;
        expectError: true
        after: |
          PostgreSQL says `cannot change name of view column "name" to "price"`. Position 2 used to be `name` and now would be `price`, which could break reports that were reading the old view.

          The fix is to keep the old order and add new columns last, or to `DROP VIEW` and create it again.

      - type: exercise
        id: m15-l01-e4
        title: Add a column
        prompt: |
          The view `active_products` already exists with the columns `product_id`, `name` and `price`.

          Use `CREATE OR REPLACE VIEW` to add a fourth column, `stock_qty`, **at the end**. Keep the same `WHERE is_active = true` filter.
        setup: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price
          FROM products
          WHERE is_active = true;
        starter: |
          CREATE OR REPLACE VIEW active_products AS
          SELECT product_id, name, price
          FROM products
          WHERE is_active = true;
        solution: |
          CREATE OR REPLACE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;
        check: |
          SELECT * FROM active_products ORDER BY product_id LIMIT 5;
        hints:
          - You only need to repeat the whole query with one more column.
          - New columns must go after the existing ones, so `stock_qty` goes after `price`.
          - "CREATE OR REPLACE VIEW active_products AS SELECT product_id, name, price, ___ FROM products WHERE is_active = true;"
        explanation: |
          Because `stock_qty` was added last, PostgreSQL accepted the replacement. The starter just repeats the old definition, so it changes nothing yet.
        difficulty: 2

      - type: read
        title: Can you change data through a view?
        md: |
          Sometimes, yes. A **simple view** (one table, no `GROUP BY`, no `DISTINCT`, no aggregates) is **updatable**: `UPDATE`, `INSERT` and `DELETE` on the view change the real table underneath.

          For a view that groups, joins or calculates, PostgreSQL cannot know which table row you mean, so it refuses.

          > [!NOTE]
          > Changing data through views is useful but rare. Most of the time views are for **reading**. When in doubt, update the real table.

      - type: example
        title: Updating through a simple view
        md: |
          We raise a price through the view and then look at the real `products` table. We also try to change an inactive product (13, Desk Mat XL) which the view's `WHERE` hides.
        sql: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;

          UPDATE active_products SET price = 24.99 WHERE product_id = 4;
          UPDATE active_products SET price = 1.00 WHERE product_id = 13;

          SELECT product_id, name, price
          FROM products
          WHERE product_id IN (4, 13)
          ORDER BY product_id;
        after: |
          Product 4 now costs 24.99 in the **real table**, so the first `UPDATE` worked. Product 13 still costs 19.99: it is inactive, so the view cannot see it, and the second `UPDATE` matched zero rows. A view's `WHERE` limits what you can change through it.

      - type: example
        title: A view you cannot update
        md: |
          `order_totals` uses `GROUP BY`, so a row of the view is a summary of many order lines. What should an `UPDATE` change?
        sql: |
          CREATE VIEW order_totals AS
          SELECT o.order_id, ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          GROUP BY o.order_id;

          UPDATE order_totals SET total = 0 WHERE order_id = 1;
        expectError: true
        after: |
          `cannot update view "order_totals"`, with the detail *Views containing GROUP BY are not automatically updatable*. This is PostgreSQL protecting you: there is no single row to change.

      - type: quiz
        id: m15-l01-q2
        question: |
          Which of these views can PostgreSQL update automatically? (Pick all that apply.)
        options:
          - "CREATE VIEW v AS SELECT name, price FROM products WHERE price < 20"
          - "CREATE VIEW v AS SELECT category_id, COUNT(*) AS n FROM products GROUP BY category_id"
          - "CREATE VIEW v AS SELECT DISTINCT city FROM customers"
          - "CREATE VIEW v AS SELECT * FROM orders"
        answer: [0, 3]
        explanation: |
          Views over **one table** with plain columns are updatable (options 1 and 4). Views with `GROUP BY` or `DISTINCT` summarize rows, so a view row does not match one real row. Views that join several tables are also not automatically updatable.

      - type: exercise
        id: m15-l01-e5
        title: Update through the view
        prompt: |
          The view `active_products` (columns `product_id`, `name`, `price`, `stock_qty`) already exists.

          Using **the view** (not the `products` table), set `stock_qty` to `0` for product `2`.
        setup: |
          CREATE VIEW active_products AS
          SELECT product_id, name, price, stock_qty
          FROM products
          WHERE is_active = true;
        starter: |
          UPDATE active_products
          SET
        solution: |
          UPDATE active_products
          SET stock_qty = 0
          WHERE product_id = 2;
        check: |
          SELECT product_id, stock_qty
          FROM products
          WHERE product_id IN (1, 2, 3)
          ORDER BY product_id;
        hints:
          - Use `UPDATE` with the view's name in the place where you would normally write a table name.
          - "Do not forget the `WHERE` so only product 2 changes."
          - "UPDATE active_products SET stock_qty = ___ WHERE product_id = ___;"
        explanation: |
          Product 2 now has 0 in stock in the real `products` table; products 1 and 3 are untouched. Always include the `WHERE`, exactly as with a normal `UPDATE`.
        difficulty: 2

      - type: read
        title: Three view gotchas
        md: |
          > [!MISTAKE]
          > **Thinking a view is faster.** A view runs its whole query every time. A slow query inside a view is still a slow view. Speed comes from indexes (lessons 3 to 5) or from a materialized view (next lesson).

          > [!MISTAKE]
          > **`SELECT *` inside a view.** The `*` is expanded to the real column list *when the view is created*. If you add a column to the table later, the view does **not** show it. List your columns explicitly.

          > [!MISTAKE]
          > **Two columns with the same name.** A normal query can return two columns called `name`, but a view needs unique names. Give each one an alias: `p.name AS product_name`.

      - type: exercise
        id: m15-l01-e6
        title: Fix the bug
        prompt: |
          This view should list every product with its category, but `CREATE VIEW` fails. Fix it so the view has the columns `product_name` and `category_name` (in that order).
        starter: |
          CREATE VIEW product_catalog AS
          SELECT p.name, c.name
          FROM products p
          JOIN categories c ON c.category_id = p.category_id;
        solution: |
          CREATE VIEW product_catalog AS
          SELECT p.name AS product_name, c.name AS category_name
          FROM products p
          JOIN categories c ON c.category_id = p.category_id;
        check: |
          SELECT * FROM product_catalog ORDER BY product_name LIMIT 10;
        columnNames: true
        hints:
          - "'Read the error: column "name" specified more than once. A view needs distinct column names.'"
          - Give each `name` column its own alias with `AS`.
          - "SELECT p.name AS ___, c.name AS ___ FROM products p JOIN categories c ON ..."
        explanation: |
          A plain `SELECT` may return two columns with the same name, but a view turns the result into a "virtual table", and a table cannot have two columns with the same name. Aliases fix it.
        difficulty: 2

      - type: parsons
        id: m15-l01-o1
        prompt: |
          Put the lines in order: create a view of delivered orders, then count its rows.
        lines:
          - CREATE VIEW delivered_orders AS
          - SELECT order_id, customer_id, order_date
          - FROM orders
          - WHERE status = 'delivered';
          - SELECT COUNT(*) FROM delivered_orders;
        distractors:
          - CREATE TABLE delivered_orders AS
        explanation: |
          The view must be created before you can read from it. `CREATE TABLE ... AS` would copy the rows into a new table, which is a different tool: a table is a snapshot, a view is a live window.

      - type: example
        title: Listing and dropping views
        md: |
          Views are objects in the database, so you can list them and remove them. We create two views, list them, drop one and list again.
        sql: |
          CREATE VIEW v_cheap AS SELECT name, price FROM products WHERE price < 20;
          CREATE VIEW v_orders AS SELECT * FROM orders;

          SELECT table_name, is_updatable
          FROM information_schema.views
          WHERE table_schema = 'public'
          ORDER BY table_name;

          DROP VIEW v_cheap;
          DROP VIEW IF EXISTS v_not_there;

          SELECT table_name
          FROM information_schema.views
          WHERE table_schema = 'public'
          ORDER BY table_name;
        after: |
          Two result tabs appear (**Result 1** and **Result 2**): first both views, then only `v_orders`. `information_schema.views` is PostgreSQL's built-in list of views, and `is_updatable` tells you if you can change data through each one.

          `DROP VIEW` removes only the saved query, never the data. `DROP VIEW IF EXISTS` does nothing, without an error, when the view is already gone. Dropping a **table** that a view uses is refused unless you add `CASCADE`.

      - type: exercise
        id: m15-l01-e7
        title: A view built on a view
        prompt: |
          The view `order_totals` already exists (`order_id`, `customer_id`, `order_date`, `status`, `total`).

          Create a view called `customer_spend` **on top of it** with three columns: `customer_id`, `orders` (how many delivered orders) and `spent` (the sum of `total` of the delivered orders). One row per customer who has at least one delivered order.
        setup: |
          CREATE VIEW order_totals AS
          SELECT o.order_id, o.customer_id, o.order_date, o.status,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          GROUP BY o.order_id, o.customer_id, o.order_date, o.status;
        starter: |
          CREATE VIEW customer_spend AS
          SELECT
        solution: |
          CREATE VIEW customer_spend AS
          SELECT customer_id,
                 COUNT(*) AS orders,
                 SUM(total) AS spent
          FROM order_totals
          WHERE status = 'delivered'
          GROUP BY customer_id;
        check: |
          SELECT * FROM customer_spend ORDER BY spent DESC, customer_id LIMIT 10;
        columnNames: true
        ordered: true
        hints:
          - A view can read from another view, because a view looks just like a table.
          - "Group `order_totals` by `customer_id` after filtering `status = 'delivered'`."
          - "CREATE VIEW customer_spend AS SELECT customer_id, COUNT(*) AS orders, SUM(___) AS spent FROM order_totals WHERE ___ GROUP BY customer_id;"
        explanation: |
          137 customers have a delivered order. Customer 6 leads with 18 orders and 8,458.39 spent. Stacking views like this is a neat way to build up complicated reports in small, named steps. Just remember that every layer runs again each time.
        difficulty: 3
    cheatsheet:
      - title: Create or replace a view
        sql: |
          CREATE VIEW cheap_products AS
          SELECT product_id, name, price
          FROM products
          WHERE price < 20;
        note: "Use CREATE OR REPLACE VIEW to change it; new columns must go at the end."
      - title: Query a view
        sql: SELECT * FROM cheap_products WHERE price < 10;
        note: "A view works like a table in FROM, but its query runs again every time."
      - title: Remove a view
        sql: DROP VIEW IF EXISTS cheap_products;
        note: "Drops only the saved query, never the data."
      - title: List views
        sql: |
          SELECT table_name, is_updatable
          FROM information_schema.views
          WHERE table_schema = 'public';
  - id: m15-l02
    title: "Materialized views: saved results"
    summary: Store a query's result on disk for instant reads, and refresh it when the data changes.
    minutes: 25
    steps:
      - type: read
        title: The dashboard that takes forever
        md: |
          Mia's "Monthly revenue" page adds up every delivered order from two years, joined to every order line. With 900 orders that takes a blink. But ShopSmart is growing: imagine **50 million** orders. Every page view would make the database crunch all of them again, and the numbers only change once a day!

          A normal view will not help, because it re-runs its query every single time. What Mia needs is to **do the work once and keep the answer**. That is a **materialized view**.

          A **materialized view** is a view whose *result rows are stored* on disk, like a small table. Reading it is instant. The price: the stored answer can become **stale**, until you refresh it.

          > [!ANALOGY]
          > A normal view is a **live webcam** of the shop: always current, but it has to point at the shop every time. A materialized view is a **photograph**: quick to look at and as sharp as the day it was taken, but it does not change until you take a new photo (`REFRESH`).

      - type: example
        title: Your first materialized view
        md: |
          The syntax is almost the same: add the word `MATERIALIZED`. PostgreSQL runs the query **once**, right now, and stores the 24 rows it returns.
        sql: |
          CREATE MATERIALIZED VIEW monthly_revenue AS
          SELECT date_trunc('month', o.order_date)::date AS month,
                 COUNT(DISTINCT o.order_id) AS orders,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY 1;

          SELECT *
          FROM monthly_revenue
          ORDER BY month DESC
          LIMIT 6;
        after: |
          The join and the `GROUP BY` ran only once, when the view was created. The `SELECT` after it just reads 24 tiny stored rows.

          November 2024 had 65 delivered orders worth 18,037.94, and December 2024 shows 55 orders and 23,367.47. With millions of orders, "read 24 rows" instead of "crunch everything" is the whole point.

      - type: read
        title: View or materialized view?
        md: |
          | | View | Materialized view |
          |---|---|---|
          | What is stored | the query only | the query **and** its result rows |
          | Reading it | runs the query every time | reads stored rows (fast) |
          | Is it fresh? | always | only after a `REFRESH` |
          | Can you index it? | no | **yes** |
          | Disk space | almost none | like a small table |

          Use a **view** when the data must always be current or the query is cheap. Use a **materialized view** when the query is expensive, many people read the result, and a bit of staleness is fine (a nightly report, a leaderboard, a dashboard).

      - type: example
        title: Fresh versus stale
        md: |
          We create a view and a materialized view with the same query, then a new order arrives. Watch which one notices.
        sql: |
          CREATE VIEW v_status AS
          SELECT status, COUNT(*) AS orders
          FROM orders GROUP BY status;

          CREATE MATERIALIZED VIEW mv_status AS
          SELECT status, COUNT(*) AS orders
          FROM orders GROUP BY status;

          INSERT INTO orders (order_id, customer_id, order_date, status, ship_city)
          VALUES (901, 1, '2024-12-31', 'processing', 'Austin');

          SELECT 'view' AS kind, orders
          FROM v_status WHERE status = 'processing'
          UNION ALL
          SELECT 'materialized view', orders
          FROM mv_status WHERE status = 'processing';
        after: |
          The plain **view** says 8 `processing` orders: it looked at the live table. The **materialized view** still says 7, the number from when it was created. Its photo is out of date.

          The next step shows how to take a fresh photo.

      - type: predict
        id: m15-l02-p1
        question: |
          The `products` table has 60 rows. A materialized view counts them, and then a new product is added. What does the last query return?
        sql: |
          CREATE MATERIALIZED VIEW mv_product_count AS
          SELECT COUNT(*) AS n FROM products;

          INSERT INTO products
              (product_id, name, category_id, price, cost, stock_qty, is_active, created_at)
          VALUES (61, 'Test Mug', 4, 9.99, 4.00, 10, true, '2024-12-31');

          SELECT n FROM mv_product_count;
        options: ["60", "61", "NULL", "An error"]
        answer: 0
        explanation: |
          **60**. The count was calculated and stored when the view was created. Adding a product changes `products`, but the stored photo stays the same until you run `REFRESH MATERIALIZED VIEW mv_product_count;`.

      - type: exercise
        id: m15-l02-e1
        title: Cache the payment methods
        prompt: |
          Create a materialized view called `mv_payment_methods` from the `payments` table with three columns, in this order:

          - `method`
          - "`payments`: how many payments used that method"
          - "`total`: the sum of `amount` for that method"
        starter: |
          CREATE MATERIALIZED VIEW mv_payment_methods AS
          SELECT
        solution: |
          CREATE MATERIALIZED VIEW mv_payment_methods AS
          SELECT method,
                 COUNT(*) AS payments,
                 SUM(amount) AS total
          FROM payments
          GROUP BY method;
        check: |
          SELECT * FROM mv_payment_methods ORDER BY method;
        columnNames: true
        hints:
          - It is like a normal view, with the word MATERIALIZED added after CREATE.
          - "Group `payments` by `method` and use `COUNT(*)` and `SUM(amount)`."
          - "CREATE MATERIALIZED VIEW mv_payment_methods AS SELECT method, COUNT(*) AS payments, SUM(___) AS total FROM payments GROUP BY ___;"
        explanation: |
          Four rows: bank_transfer, card, gift_card and paypal. Card payments lead with 463 payments worth 162,887.72. These four rows are now stored, so a dashboard tile can read them without touching the 778 payment rows.
        difficulty: 1

      - type: read
        title: Taking a new photo with REFRESH
        md: |
          To update the stored rows, run:

          ```sql
          REFRESH MATERIALIZED VIEW monthly_revenue;
          ```

          PostgreSQL re-runs the saved query and replaces **all** the stored rows. It does not happen by itself. In real projects a scheduled job (every night, every hour) calls `REFRESH`.

          > [!NOTE]
          > A plain `REFRESH` locks the materialized view while it works, so readers have to wait. Later in this lesson you will meet `REFRESH ... CONCURRENTLY`, which avoids that.

      - type: exercise
        id: m15-l02-e2
        title: Refresh the stale view
        prompt: |
          The materialized view `mv_status_counts` (columns `status` and `orders`) was created this morning. Since then a new `processing` order arrived, so the stored number is out of date.

          Bring `mv_status_counts` up to date. The check will look at the stored `processing` count.
        setup: |
          CREATE MATERIALIZED VIEW mv_status_counts AS
          SELECT status, COUNT(*) AS orders
          FROM orders
          GROUP BY status;

          INSERT INTO orders (order_id, customer_id, order_date, status, ship_city)
          VALUES (901, 1, '2024-12-31', 'processing', 'Austin');
        starter: |
          -- bring mv_status_counts up to date
        solution: |
          REFRESH MATERIALIZED VIEW mv_status_counts;
        check: |
          SELECT status, orders
          FROM mv_status_counts
          ORDER BY status;
        hints:
          - There is a special statement for taking a new photo of a materialized view.
          - "It starts with `REFRESH`."
          - "REFRESH MATERIALIZED VIEW ___;"
        explanation: |
          After the refresh, `processing` shows 8 instead of 7. Tip: first run `SELECT * FROM mv_status_counts;` to see the stale number, then refresh and look again.
        difficulty: 1

      - type: example
        title: WITH NO DATA
        md: |
          Sometimes you want to create the structure now and fill it later. `WITH NO DATA` creates the materialized view **empty and unpopulated**. Reading it fails until the first refresh.
        sql: |
          CREATE MATERIALIZED VIEW mv_empty AS
          SELECT status, COUNT(*) AS orders
          FROM orders
          GROUP BY status
          WITH NO DATA;

          SELECT * FROM mv_empty;
        expectError: true
        after: |
          PostgreSQL says `materialized view "mv_empty" has not been populated` and even tells you the fix: run `REFRESH MATERIALIZED VIEW mv_empty;`. After that first refresh, reading works.

      - type: quiz
        id: m15-l02-q1
        question: |
          Which tool fits best? **A screen in the warehouse must always show the orders that are processing right now**, including ones created a second ago.
        options:
          - "A plain view"
          - "A materialized view refreshed every night"
          - "A materialized view refreshed once a week"
          - "A copy of the table made last month"
        answer: 0
        explanation: |
          The warehouse needs live data, so use a **plain view** (or just a query). A materialized view is a photo and would hide the newest orders until the next refresh. Materialized views shine for *expensive* queries whose answer may be a bit old, like yesterday's revenue.

      - type: read
        title: Indexes and REFRESH CONCURRENTLY
        md: |
          Because a materialized view stores real rows, you can put an **index** on it (lesson 3 explains indexes in detail).

          An index also unlocks a very useful trick. With a **unique index** on the materialized view you can run:

          ```sql
          REFRESH MATERIALIZED VIEW CONCURRENTLY mv_name;
          ```

          PostgreSQL builds the new rows on the side and swaps in only the differences, so people reading the view are **not blocked** while it refreshes. It is a little slower, but your dashboard never freezes.

      - type: example
        title: CONCURRENTLY needs a unique index
        md: |
          We try `CONCURRENTLY` on a materialized view that has no unique index yet.
        sql: |
          CREATE MATERIALIZED VIEW mv_status AS
          SELECT status, COUNT(*) AS orders
          FROM orders
          GROUP BY status;

          REFRESH MATERIALIZED VIEW CONCURRENTLY mv_status;
        expectError: true
        after: |
          The error message tells you exactly what to do: *Create a unique index with no WHERE clause on one or more columns of the materialized view.* PostgreSQL needs a unique key to match old rows with new rows.

      - type: example
        title: Index first, then refresh concurrently
        md: |
          This time we add a unique index on `status` (every status appears once), then refresh with a new order waiting.
        sql: |
          CREATE MATERIALIZED VIEW mv_status AS
          SELECT status, COUNT(*) AS orders
          FROM orders
          GROUP BY status;

          CREATE UNIQUE INDEX uq_mv_status ON mv_status (status);

          INSERT INTO orders (order_id, customer_id, order_date, status, ship_city)
          VALUES (901, 1, '2024-12-31', 'processing', 'Austin');

          REFRESH MATERIALIZED VIEW CONCURRENTLY mv_status;

          SELECT * FROM mv_status ORDER BY status;
        after: |
          It worked, and `processing` now shows 8. In a real server, other users could have kept reading `mv_status` the whole time.

          Remember the rule: **`CONCURRENTLY` needs a unique index** on the materialized view.

      - type: exercise
        id: m15-l02-e3
        title: Make it refreshable
        prompt: |
          The materialized view `mv_category_revenue` already exists. Each `category` appears only once in it.

          Create a **unique index** named `uq_mv_category` on its `category` column, so that it can be refreshed concurrently.
        setup: |
          CREATE MATERIALIZED VIEW mv_category_revenue AS
          SELECT c.name AS category,
                 SUM(i.quantity) AS units,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM order_items i
          JOIN orders o ON o.order_id = i.order_id
          JOIN products p ON p.product_id = i.product_id
          JOIN categories c ON c.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY c.name;
        starter: |
          CREATE UNIQUE INDEX
        solution: |
          CREATE UNIQUE INDEX uq_mv_category
          ON mv_category_revenue (category);
        check: |
          SELECT tablename, indexname, indexdef
          FROM pg_indexes
          WHERE tablename = 'mv_category_revenue';
        hints:
          - You create an index on a materialized view exactly like on a table.
          - "The pattern is `CREATE UNIQUE INDEX index_name ON view_name (column);`"
          - "CREATE UNIQUE INDEX uq_mv_category ON ___ (___);"
        explanation: |
          `pg_indexes` lists indexes of tables **and** materialized views. Now `REFRESH MATERIALIZED VIEW CONCURRENTLY mv_category_revenue;` would be allowed.
        difficulty: 2

      - type: exercise
        id: m15-l02-e4
        title: The category revenue cache
        prompt: |
          Create a materialized view called `mv_category_revenue` with three columns, in this order:

          - "`category`: the category name"
          - "`units`: total quantity sold"
          - "`revenue`: total of `quantity * unit_price * (1 - discount)`, rounded to 2 decimals"

          Count only lines that belong to **delivered** orders.
        starter: |
          CREATE MATERIALIZED VIEW mv_category_revenue AS
          SELECT
        solution: |
          CREATE MATERIALIZED VIEW mv_category_revenue AS
          SELECT c.name AS category,
                 SUM(i.quantity) AS units,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM order_items i
          JOIN orders o ON o.order_id = i.order_id
          JOIN products p ON p.product_id = i.product_id
          JOIN categories c ON c.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY c.name;
        check: |
          SELECT * FROM mv_category_revenue ORDER BY revenue DESC;
        columnNames: true
        ordered: true
        hints:
          - You need four tables in the join path - order_items, orders, products and categories.
          - "Filter with `WHERE o.status = 'delivered'` and `GROUP BY c.name`."
          - "SELECT c.name AS category, SUM(i.quantity) AS units, ROUND(SUM(___), 2) AS revenue FROM order_items i JOIN orders o ON ... JOIN products p ON ... JOIN categories c ON ... WHERE ... GROUP BY c.name"
        explanation: |
          Phones lead with 60,548.25, followed by Laptops with 46,914.56. This four-table query is exactly the kind of work you do **once** in a materialized view and read cheaply a thousand times.
        difficulty: 2

      - type: read
        title: Materialized view gotchas
        md: |
          > [!MISTAKE]
          > **Forgetting to refresh.** The number on the dashboard is quietly wrong, and nobody gets an error. Always decide *who* refreshes the view and *how often*, and write it down.

          > [!MISTAKE]
          > **Trying to change the rows by hand.** `UPDATE`, `INSERT` and `DELETE` on a materialized view are not allowed. Change the base tables, then refresh.

          > [!REAL-WORLD]
          > Data teams often build a "reporting layer" of materialized views refreshed every night: daily sales, top products, customer lifetime value. Dashboards read these small stored tables, so they feel instant.

      - type: example
        title: You cannot edit the photo
        md: |
          What happens if you try to update a materialized view directly?
        sql: |
          CREATE MATERIALIZED VIEW mv_status AS
          SELECT status, COUNT(*) AS orders
          FROM orders
          GROUP BY status;

          UPDATE mv_status SET orders = 0;
        expectError: true
        after: |
          `cannot change materialized view "mv_status"`. The rows are only ever created by running the saved query (at creation or at `REFRESH`).

      - type: exercise
        id: m15-l02-e5
        title: Which views are populated?
        prompt: |
          Two materialized views exist, `mv_a` and `mv_b`. PostgreSQL keeps a list of them in the system view `pg_matviews`.

          Show `matviewname` and `ispopulated` for every materialized view, sorted by `matviewname`.
        setup: |
          CREATE MATERIALIZED VIEW mv_a AS SELECT COUNT(*) AS n FROM orders;
          CREATE MATERIALIZED VIEW mv_b AS SELECT COUNT(*) AS n FROM payments WITH NO DATA;
        starter: |
          SELECT *
          FROM pg_matviews;
        solution: |
          SELECT matviewname, ispopulated
          FROM pg_matviews
          ORDER BY matviewname;
        ordered: true
        hints:
          - "`pg_matviews` is a read-only list that you query like any table."
          - Select the two columns by name and add an ORDER BY.
          - "SELECT matviewname, ___ FROM pg_matviews ORDER BY ___;"
        explanation: |
          `mv_a` is populated (`true`); `mv_b` was created `WITH NO DATA`, so it is `false` and would raise an error if you read it. `pg_matviews` also shows each view's definition.
        difficulty: 2

      - type: fill
        id: m15-l02-f1
        prompt: |
          Complete the script: create a materialized view of customers per city, then update its stored rows.
        template: |
          CREATE ___ VIEW mv_cities AS
          SELECT city, COUNT(*) AS customers
          FROM customers
          GROUP BY city;

          ___ MATERIALIZED VIEW mv_cities;
        answers:
          - ["MATERIALIZED"]
          - ["REFRESH"]
        explanation: |
          `CREATE MATERIALIZED VIEW` stores the result, and `REFRESH MATERIALIZED VIEW` re-runs the query and replaces the stored rows.

      - type: quiz
        id: m15-l02-q2
        question: |
          Which statements about materialized views are **true**? (Pick all that apply.)
        options:
          - "Reading a materialized view re-runs its query every time."
          - "You can create an index on a materialized view."
          - "A materialized view updates itself whenever the base tables change."
          - "REFRESH MATERIALIZED VIEW re-runs the query and replaces the stored rows."
        answer: [1, 3]
        explanation: |
          The stored rows are read directly (so option 1 is false), they can be indexed (true), and they only change on `REFRESH` (so option 3 is false and option 4 is true). Automatic updating is exactly what a materialized view does **not** do.

      - type: exercise
        id: m15-l02-e6
        title: Cache with a safe refresh
        prompt: |
          Build the monthly revenue cache in one go:

          1. Create a materialized view `mv_monthly_revenue` with columns `month` (the first day of the month, as a date), `orders` (how many different delivered orders) and `revenue` (sum of `quantity * unit_price * (1 - discount)` rounded to 2 decimals) for **delivered** orders.
          2. Create a **unique index** on its `month` column, named `uq_mv_monthly_revenue`.
        starter: |
          CREATE MATERIALIZED VIEW mv_monthly_revenue AS
          SELECT
        solution: |
          CREATE MATERIALIZED VIEW mv_monthly_revenue AS
          SELECT date_trunc('month', o.order_date)::date AS month,
                 COUNT(DISTINCT o.order_id) AS orders,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY 1;

          CREATE UNIQUE INDEX uq_mv_monthly_revenue
          ON mv_monthly_revenue (month);
        check: |
          SELECT
              (SELECT COUNT(*) FROM mv_monthly_revenue) AS months,
              (SELECT ROUND(SUM(revenue), 2) FROM mv_monthly_revenue) AS total_revenue,
              (SELECT COUNT(*) FROM pg_indexes
               WHERE indexname = 'uq_mv_monthly_revenue'
                 AND indexdef LIKE 'CREATE UNIQUE INDEX%') AS unique_indexes;
        columnNames: true
        hints:
          - "This is two statements: one `CREATE MATERIALIZED VIEW` and one `CREATE UNIQUE INDEX`."
          - "Group by `date_trunc('month', o.order_date)::date`; `COUNT(DISTINCT o.order_id)` counts orders once even though an order has several lines."
          - "CREATE UNIQUE INDEX uq_mv_monthly_revenue ON mv_monthly_revenue (___);"
        explanation: |
          You get 24 months of revenue stored in a tiny table, plus the unique index that allows `REFRESH ... CONCURRENTLY` later. Without `COUNT(DISTINCT o.order_id)` you would count order *lines* instead of orders.
        difficulty: 3
    cheatsheet:
      - title: Create and refresh
        sql: |
          CREATE MATERIALIZED VIEW mv_sales AS
          SELECT ... ;

          REFRESH MATERIALIZED VIEW mv_sales;
        note: "The rows are stored when you create it and replaced on every REFRESH."
      - title: Refresh without blocking readers
        sql: |
          CREATE UNIQUE INDEX uq_mv_sales ON mv_sales (month);
          REFRESH MATERIALIZED VIEW CONCURRENTLY mv_sales;
        note: "CONCURRENTLY requires a unique index on the materialized view."
      - title: View or materialized view?
        sql: |
          -- View: always fresh, runs every time
          -- Materialized view: stored, fast, needs REFRESH
          SELECT matviewname, ispopulated FROM pg_matviews;
        note: "Pick a materialized view for expensive queries that can be a little stale."
  - id: m15-l03
    title: "How indexes work"
    summary: Understand the B-tree index, create and drop indexes, and know what they cost.
    minutes: 28
    steps:
      - type: read
        title: Finding one order among 200,000
        md: |
          ShopSmart's support team types an order number and waits... and waits. The `orders` table has grown to **200,000 rows** and every lookup feels slow. Mia asks you: *"Can the database find an order without reading all of them?"*

          Yes, with an **index**. Think about a **phone book**. To find "Hadad, Noor" you do not read every page from "A". The names are in alphabetical order, so you jump to the middle, then to the right quarter, and in a few jumps you are on the correct page.

          A database index works the same way. It is a **separate, sorted list** of the values in one column, each pointing to the row where it lives.

          > [!ANALOGY]
          > The **index at the back of a book** lists topics alphabetically with page numbers. You look up "pagination", see "p. 214", and go straight there instead of reading the whole book.

      - type: viz
        viz: index
        title: Race a full scan against an index
        md: |
          Pick an id and press **Race them!**. The left side reads rows one after another (a **sequential scan**). The right side walks down a **B-tree** (the shape of most indexes) in just a few steps.
        config:
          rows: 200000

      - type: read
        title: What a B-tree looks like
        md: |
          Most indexes are **B-trees**. A B-tree is a tree of sorted "pages":

          - The **root** page says which branch to follow ("ids 1 to 50,000 go left...").
          - **Branch** pages narrow it down further.
          - **Leaf** pages hold the sorted values, each with a pointer to the real table row.

          Each page holds hundreds of entries, so even with millions of rows the tree is only **3 or 4 levels** deep. Finding a value takes a handful of page reads instead of millions.

          Because the leaves are sorted, an index also helps with `BETWEEN`, `<`, `>`, `ORDER BY` and `LIMIT`, not only `=`.

          You create one with:

          ```sql
          CREATE INDEX index_name ON table_name (column_name);
          ```

          > [!NOTE]
          > `CREATE INDEX` builds a B-tree unless you say otherwise. Other types (`GIN` and friends) come in lesson 5.

      - type: example
        title: The slow lookup
        md: |
          Let's feel the problem. The first statement builds a practice table, `big_orders`, with **200,000 rows**. (`generate_series(1, 200000)` simply counts from 1 to 200,000. You will meet it properly in module 16. Don't worry about the arithmetic: it just invents tidy pretend orders.)

          `ANALYZE` lets PostgreSQL take notes about the new table, which lesson 7 explains. Then `EXPLAIN ANALYZE` runs a lookup and shows how PostgreSQL did it. Lesson 4 teaches you to read the whole plan. For now, just spot two things: the words **Seq Scan** and the **Execution Time** at the bottom.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT * FROM big_orders
          WHERE order_id = 123456;
        after: |
          The plan starts with **Seq Scan on big_orders**: PostgreSQL read the table from the first row to the last. The line `Rows Removed by Filter: 199999` says it looked at 200,000 rows to find the one you wanted. On a typical run that took roughly 10 to 20 milliseconds. Your number will differ, and that is fine.

          One lookup at 15 ms is okay. A website doing hundreds of lookups a second is not.

      - type: example
        title: The same lookup with an index
        md: |
          Same table, same query, but now we add an index on `order_id` before asking.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          ANALYZE big_orders;

          CREATE INDEX idx_big_orders_order_id
          ON big_orders (order_id);

          EXPLAIN ANALYZE
          SELECT * FROM big_orders
          WHERE order_id = 123456;
        after: |
          Now the plan says **Index Scan using idx_big_orders_order_id**, and the `Execution Time` is a small fraction of a millisecond, around 0.05 ms on our test run. That is hundreds of times faster, for one extra line of SQL.

          PostgreSQL chose the index **by itself**. You never write "use this index" in your query: you just create it, and the planner decides whether it helps.

      - type: quiz
        id: m15-l03-q1
        question: |
          Why can an index find `order_id = 123456` so much faster than scanning the table?
        options:
          - "The index stores a copy of the whole table in memory"
          - "The index is a sorted structure, so PostgreSQL can skip almost all rows and jump straight to the right place"
          - "The index deletes rows that are not needed"
          - "The index runs the query on several computers at once"
        answer: 1
        explanation: |
          An index is a **sorted tree** of values with pointers to the rows. Like looking up a word in a dictionary, you narrow the search down in a few steps. The index does not copy, delete or distribute your data.

      - type: exercise
        id: m15-l03-e1
        title: Your first index
        prompt: |
          Customers' order histories are looked up by `customer_id` all the time. Create an index named `idx_orders_customer` on the `customer_id` column of the `orders` table.
        starter: |
          CREATE INDEX
        solution: |
          CREATE INDEX idx_orders_customer
          ON orders (customer_id);
        check: |
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_orders_customer';
        hints:
          - The pattern is CREATE INDEX name ON table (column).
          - "Name first, then `ON orders`, then the column in parentheses."
          - "CREATE INDEX idx_orders_customer ON ___ (___);"
        explanation: |
          `pg_indexes` is PostgreSQL's catalog of indexes. The check looks up yours by name and compares its definition. The `orders` table is small (900 rows), so you will not feel a difference, but this is exactly the index a big shop needs.
        difficulty: 1

      - type: read
        title: Some indexes already exist
        md: |
          You did not create any index earlier in the course, but some already exist:

          - A **primary key** automatically gets a unique index.
          - A **`UNIQUE` constraint** automatically gets a unique index.

          But a **foreign key** does **not** get an index! `orders.customer_id` points to `customers`, yet nothing makes lookups by `customer_id` fast. Joining on foreign keys is so common that you often create those indexes yourself.

          To see what exists, ask the catalog `pg_indexes`.

      - type: example
        title: Which indexes does the shop have?
        sql: |
          SELECT tablename, indexname
          FROM pg_indexes
          WHERE schemaname = 'public'
          ORDER BY tablename, indexname;
        after: |
          Eleven indexes, all created automatically by primary keys and `UNIQUE` rules (the names end in `_pkey` or `_key`).

          Look at the `orders` table: it only has `orders_pkey`. There is **no index** on `orders.customer_id` and none on `order_items.product_id`. Two of the first columns you would want to search by!

      - type: exercise
        id: m15-l03-e2
        title: What indexes does order_items have?
        prompt: |
          Show the `indexname` of every index on the table `order_items`, sorted by name.
        starter: |
          SELECT indexname
          FROM pg_indexes;
        solution: |
          SELECT indexname
          FROM pg_indexes
          WHERE tablename = 'order_items'
          ORDER BY indexname;
        ordered: true
        hints:
          - "`pg_indexes` has a column called `tablename` you can filter on."
          - "Add `WHERE tablename = 'order_items'` and an ORDER BY."
          - "SELECT indexname FROM pg_indexes WHERE tablename = ___ ORDER BY ___;"
        explanation: |
          Two indexes: one for the primary key (`order_items_pkey`) and one for the `UNIQUE (order_id, product_id)` rule. The second one will also help queries that filter on `order_id` alone, which lesson 5 explains.
        difficulty: 1

      - type: read
        title: Unique indexes
        md: |
          A **unique index** does two jobs: it speeds up lookups **and** refuses duplicate values.

          ```sql
          CREATE UNIQUE INDEX uq_name ON table_name (column_name);
          ```

          This is what `PRIMARY KEY` and `UNIQUE` use behind the scenes. Be careful: if the column **already contains duplicates**, PostgreSQL cannot build the unique index and tells you which value is duplicated.

      - type: predict
        id: m15-l03-p1
        question: |
          Many customers have placed more than one order. What happens when this statement runs?
        sql: |
          CREATE UNIQUE INDEX uq_orders_customer
          ON orders (customer_id);
        options:
          - "The index is created"
          - "An error: could not create unique index, a customer_id is duplicated"
          - "An error: orders is not a table"
          - "The index is created but ignores duplicates"
        answer: 1
        expectError: true
        explanation: |
          A unique index cannot exist while two rows share the same value. PostgreSQL stops with `could not create unique index "uq_orders_customer"` and a detail such as *Key (customer_id)=(81) is duplicated*. Uniqueness only makes sense for columns like email, order number or a primary key.

      - type: example
        title: A unique index as a rule
        md: |
          Supplier names should never repeat. We add a unique index, then try to add a second supplier with the same name as supplier 1.
        sql: |
          CREATE UNIQUE INDEX uq_suppliers_name
          ON suppliers (name);

          INSERT INTO suppliers (supplier_id, name, country)
          SELECT 9, name, 'Norway'
          FROM suppliers
          WHERE supplier_id = 1;
        expectError: true
        after: |
          The error says `duplicate key value violates unique constraint "uq_suppliers_name"` and shows the repeated name. The index quietly protects your data, and it also makes `WHERE name = ...` lookups fast.

      - type: exercise
        id: m15-l03-e3
        title: A unique index
        prompt: |
          Product names are all different. Create a **unique** index named `uq_products_name` on the `name` column of `products`.
        starter: |
          CREATE
        solution: |
          CREATE UNIQUE INDEX uq_products_name
          ON products (name);
        check: |
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE indexname = 'uq_products_name';
        hints:
          - Put one extra word between CREATE and INDEX.
          - "`CREATE UNIQUE INDEX name ON table (column);`"
          - "CREATE ___ INDEX uq_products_name ON products (___);"
        explanation: |
          The `indexdef` the check compares starts with `CREATE UNIQUE INDEX`, so a plain index would not pass. It worked because all 60 product names are different.
        difficulty: 2

      - type: read
        title: Indexes are not free
        md: |
          If indexes make reads fast, why not index every column? Because every index has a **cost**:

          - **Slower writes.** Each `INSERT`, `UPDATE` or `DELETE` must also update every index on the table.
          - **Disk space.** An index is a second copy of a column, sorted. It can be as big as the data itself.
          - **Maintenance.** More things to vacuum and keep healthy (lesson 7).

          So the rule is: **index the columns you often search, join or sort by, and nothing more.**

      - type: example
        title: What an index costs
        md: |
          We load 100,000 rows into two identical empty tables. `t_indexed` has three indexes, `t_plain` has none. `EXPLAIN ANALYZE` times each load (it really inserts the rows). The last result shows how big everything is. You get **three result tabs**: click each one.
        sql: |
          CREATE TABLE t_plain (id int, customer_id int, order_date date);
          CREATE TABLE t_indexed (id int, customer_id int, order_date date);
          CREATE INDEX t_idx1 ON t_indexed (id);
          CREATE INDEX t_idx2 ON t_indexed (customer_id);
          CREATE INDEX t_idx3 ON t_indexed (order_date);

          EXPLAIN ANALYZE
          INSERT INTO t_plain
          SELECT g, g % 5000 + 1, DATE '2023-01-01' + g % 731
          FROM generate_series(1, 100000) AS g;

          EXPLAIN ANALYZE
          INSERT INTO t_indexed
          SELECT g, g % 5000 + 1, DATE '2023-01-01' + g % 731
          FROM generate_series(1, 100000) AS g;

          SELECT pg_size_pretty(pg_relation_size('t_indexed')) AS table_size,
                 pg_size_pretty(pg_relation_size('t_idx1')
                              + pg_relation_size('t_idx2')
                              + pg_relation_size('t_idx3')) AS indexes_size;
        after: |
          Compare the two `Execution Time` lines at the bottom of Result 1 and Result 2. On our test runs, loading with three indexes took about **four to five times longer** (roughly 750 ms against 170 ms). The indexes also take up space of their own (Result 3): about 4.1 MB of indexes next to a table of 4.2 MB, so the three indexes together are almost as big as the data.

          This is the trade-off: reads get faster, writes get slower, and the disk fills up. A table that is read a thousand times for every write loves indexes. A table that is mostly written (like a log) wants as few as possible.

      - type: quiz
        id: m15-l03-q2
        question: |
          A table `orders` has 1,000,000 rows. Which index is **most likely worth creating** for the query `WHERE customer_id = ?`, which returns about 10 rows each time?
        options:
          - "An index on customer_id (about 100,000 different values)"
          - "An index on is_test, a boolean that is false for 99.9% of the rows"
          - "An index on every column, just in case"
          - "No index: a full scan is always best"
        answer: 0
        explanation: |
          An index pays off when the search is **selective**: it narrows a million rows down to a handful. `customer_id` does that. A boolean that is the same for almost every row narrows nothing, and indexing every column makes all writes slow and wastes space.

      - type: exercise
        id: m15-l03-e4
        title: Drop an index
        prompt: |
          The index `idx_orders_status` was created for a report that no longer exists, and it only slows writes down. Remove it.
        setup: |
          CREATE INDEX idx_orders_status ON orders (status);
        starter: |
          DROP
        solution: |
          DROP INDEX idx_orders_status;
        check: |
          SELECT indexname
          FROM pg_indexes
          WHERE indexname = 'idx_orders_status';
        allowEmpty: true
        hints:
          - You remove an index with DROP, like you drop a view.
          - "`DROP INDEX index_name;` - no table name needed."
          - "DROP INDEX ___;"
        explanation: |
          The check finds no index with that name, so the drop worked. Dropping an index never touches your data, only the extra lookup structure. Use `DROP INDEX IF EXISTS name;` in scripts to avoid errors when it is already gone.
        difficulty: 2

      - type: exercise
        id: m15-l03-e5
        title: Fix the bug
        prompt: |
          This statement should create an index named `idx_orders_status` on the `status` column of `orders`, but it fails with a syntax error. Fix it.
        starter: |
          CREATE INDEX idx_orders_status ON orders status;
        solution: |
          CREATE INDEX idx_orders_status ON orders (status);
        check: |
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_orders_status';
        hints:
          - Read the error message. It points at the word status.
          - The column list of an index must be wrapped in parentheses.
          - "CREATE INDEX idx_orders_status ON orders (status);"
        explanation: |
          Index columns always go in parentheses, even when there is only one. The same pattern works for several columns, which you will use in lesson 5.
        difficulty: 2

      - type: parsons
        id: m15-l03-o1
        prompt: |
          Put the lines in order: create an index on `payments.order_id`, then list the indexes of `payments`.
        lines:
          - CREATE INDEX idx_payments_order
          - ON payments (order_id);
          - SELECT indexname
          - FROM pg_indexes
          - WHERE tablename = 'payments';
        distractors:
          - DROP INDEX idx_payments_order;
        explanation: |
          First the `CREATE INDEX ... ON table (column)` statement, then the query on `pg_indexes`. The result shows the new `idx_payments_order` next to `payments_pkey`. The `DROP INDEX` line would delete the index again.

      - type: exercise
        id: m15-l03-e6
        title: How much space does an index use?
        prompt: |
          Compare the size of the `orders` table with the size of its primary key index. Show two columns:

          - "`table_size`: `pg_size_pretty(pg_relation_size('orders'))`"
          - "`index_size`: `pg_size_pretty(pg_relation_size('orders_pkey'))`"
        starter: |
          SELECT pg_size_pretty(pg_relation_size('orders')) AS table_size
        solution: |
          SELECT pg_size_pretty(pg_relation_size('orders')) AS table_size,
                 pg_size_pretty(pg_relation_size('orders_pkey')) AS index_size;
        columnNames: true
        hints:
          - "`pg_relation_size('name')` returns bytes; `pg_size_pretty` turns bytes into text like `64 kB`."
          - You need two expressions in one SELECT, each with its own alias.
          - "SELECT pg_size_pretty(pg_relation_size('orders')) AS table_size, pg_size_pretty(pg_relation_size(___)) AS index_size;"
        explanation: |
          The table takes 64 kB and the index on just its `order_id` column takes 40 kB, more than half the size of the table itself. That is why you should only create indexes you will actually use.
        difficulty: 2
    cheatsheet:
      - title: Create an index
        sql: CREATE INDEX idx_orders_customer ON orders (customer_id);
        note: "Name, table, then the column(s) in parentheses. PostgreSQL decides when to use it."
      - title: Unique index
        sql: CREATE UNIQUE INDEX uq_products_name ON products (name);
        note: "Speeds up lookups and rejects duplicates. Fails if duplicates already exist."
      - title: Drop or list indexes
        sql: |
          DROP INDEX IF EXISTS idx_orders_customer;

          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE tablename = 'orders';
        note: "Primary keys and UNIQUE constraints get an index automatically. Foreign keys do not."
      - title: The cost of indexes
        sql: SELECT pg_size_pretty(pg_relation_size('orders_pkey'));
        note: "Indexes use disk space and slow down INSERT, UPDATE and DELETE."
  - id: m15-l04
    title: "Reading EXPLAIN"
    summary: Use EXPLAIN and EXPLAIN ANALYZE to see how PostgreSQL runs a query and where the time goes.
    minutes: 30
    steps:
      - type: read
        title: Guessing is slow, looking is fast
        md: |
          The dashboard is slow again. Mia asks: *"What is wrong with it?"* A beginner guesses ("maybe it needs an index?"). An expert **looks**.

          Before running your query, PostgreSQL's **planner** decides *how* to get the answer: which tables to read first, whether to use an index, how to join. That decision is the **query plan**.

          Two commands show you the plan:

          - **`EXPLAIN`** shows the plan PostgreSQL *would* use. It does **not** run the query.
          - **`EXPLAIN ANALYZE`** really **runs** the query and adds the measured time and row counts.

          > [!ANALOGY]
          > `EXPLAIN` is the **route preview** in a maps app: it shows the way and the estimated time. `EXPLAIN ANALYZE` is the **trip log** after you have actually driven: it shows how long every part really took.

      - type: example
        title: Your first EXPLAIN
        md: |
          Put `EXPLAIN` in front of any query. The result is the plan, one line of text per row.
        sql: |
          EXPLAIN
          SELECT * FROM orders
          WHERE order_id = 7;
        after: |
          Two lines. The first one is the plan step: **Index Scan using orders_pkey on orders**. PostgreSQL will use the primary key's index. The second line, `Index Cond: (order_id = 7)`, is the condition it will look up in the index.

          Next to it in brackets are the planner's **estimates**. The next step explains them.

      - type: read
        title: Anatomy of a plan line
        md: |
          Look at the first line of the plan:

          ```
          Index Scan using orders_pkey on orders  (cost=0.28..8.29 rows=1 width=42)
          ```

          | Part | Meaning |
          |---|---|
          | `Index Scan using orders_pkey on orders` | **What** PostgreSQL does, and on which table or index. |
          | `cost=0.28..8.29` | The planner's estimate: **start-up cost .. total cost**. It is measured in made-up "cost units", not milliseconds. Lower is better. |
          | `rows=1` | How many rows the planner **expects** this step to produce. |
          | `width=42` | The average size of one result row, in bytes. |

          Cost units are only good for comparing plans for the *same* query. Never convert them to seconds.

      - type: example
        title: Now with ANALYZE
        md: |
          Add the word `ANALYZE` and the query really runs. The plan now has real measurements next to the estimates.
        sql: |
          EXPLAIN ANALYZE
          SELECT * FROM orders
          WHERE order_id = 7;
        after: |
          Compare the new brackets: `(actual time=0.053..0.057 rows=1.00 loops=1)`.

          - **actual time** is milliseconds, again start-up..total.
          - **rows** is how many rows this step really produced (PostgreSQL 18 prints decimals like `1.00`).
          - **loops** is how many times the step ran. For a join's inner side it can be large, and the time and rows shown are **per loop**.

          At the bottom, `Planning Time` is how long the planner thought, and `Execution Time` is the real run time of the query. The `Buffers:` lines count the 8 kB pages touched (since PostgreSQL 18 they appear by default with `ANALYZE`). `Index Searches: 1` (new in 18) counts how many times the index was probed.

      - type: quiz
        id: m15-l04-q1
        question: |
          You want to know how long a `SELECT` **really** takes. Which command do you use?
        options:
          - "EXPLAIN SELECT ..."
          - "EXPLAIN ANALYZE SELECT ..."
          - "ANALYZE SELECT ..."
          - "SHOW PLAN SELECT ..."
        answer: 1
        explanation: |
          Only `EXPLAIN ANALYZE` executes the query and measures it. Plain `EXPLAIN` shows estimates without running anything. (A bare `ANALYZE` is a different command: it updates the planner's statistics. You will meet it in lesson 7.)

      - type: read
        title: "Careful: ANALYZE really runs the query"
        md: |
          `EXPLAIN ANALYZE` executes the statement. For a `SELECT` that is harmless, but for an `INSERT`, `UPDATE` or `DELETE` the **changes really happen**.

          The safe habit is to wrap it in a transaction (module 14) and roll it back:

          ```sql
          BEGIN;
          EXPLAIN ANALYZE DELETE FROM reviews WHERE rating = 1;
          ROLLBACK;
          ```

          > [!MISTAKE]
          > Running `EXPLAIN ANALYZE DELETE ...` on production without `BEGIN` and `ROLLBACK` deletes the rows. Always check the first word of the statement after `ANALYZE`.

      - type: example
        title: Time a DELETE safely
        md: |
          We time a `DELETE` of one-star reviews, roll it back, and then count the reviews to prove nothing was lost.
        sql: |
          BEGIN;

          EXPLAIN ANALYZE
          DELETE FROM reviews
          WHERE rating = 1;

          ROLLBACK;

          SELECT COUNT(*) AS reviews_left
          FROM reviews;
        after: |
          The plan shows a `Delete on reviews` step that read the table and found 5 rows with `rating = 1`. After `ROLLBACK` the last query still counts all **320** reviews: the delete was timed and then undone.

      - type: parsons
        id: m15-l04-o1
        prompt: |
          Put the lines in order to measure an `UPDATE` safely without keeping its changes.
        lines:
          - BEGIN;
          - EXPLAIN ANALYZE
          - UPDATE products SET price = price * 1.1
          - WHERE category_id = 12;
          - ROLLBACK;
        distractors:
          - COMMIT;
        explanation: |
          Open the transaction, run the timed statement (`EXPLAIN ANALYZE` followed by the `UPDATE`), and finish with `ROLLBACK`. `COMMIT` would make the price change permanent, which is the opposite of what you want while only measuring.

      - type: exercise
        id: m15-l04-e1
        title: Time it, then undo it
        prompt: |
          Measure how long it takes to delete all reviews with `rating = 1` using `EXPLAIN ANALYZE`, but make sure **no review is actually deleted**.

          The check counts the rows left in `reviews`.
        starter: |
          EXPLAIN ANALYZE
          DELETE FROM reviews
          WHERE rating = 1;
        solution: |
          BEGIN;
          EXPLAIN ANALYZE
          DELETE FROM reviews
          WHERE rating = 1;
          ROLLBACK;
        check: |
          SELECT COUNT(*) AS reviews_left
          FROM reviews;
        columnNames: true
        hints:
          - The starter really deletes the rows. You need to undo it.
          - Wrap the statement in a transaction, with BEGIN before it and ROLLBACK after it.
          - "BEGIN; EXPLAIN ANALYZE DELETE ...; ___;"
        explanation: |
          With `BEGIN ... ROLLBACK` the five one-star reviews come back, so 320 remain. Without it the starter deletes them for real and only 315 are left, which is why the check fails for the starter.
        difficulty: 2

      - type: read
        title: "A plan is a tree: read it from the inside out"
        md: |
          Bigger queries give bigger plans. Lines are **indented** to show which step feeds which:

          ```
          Limit
            ->  Sort
                  ->  HashAggregate
                        ->  Seq Scan on big_orders
          ```

          Data flows **upwards**. The most indented step (here the `Seq Scan`) runs first and hands its rows to the step above it. So you **read from the deepest line up**, but the top line is the final result.

      - type: example
        title: A real plan with four steps
        md: |
          This builds our 200,000-row practice table again and asks for the five customers with the most orders since June 2024. (All customers have 40 orders in total, so the order of the top five isn't meaningful: we only care about the plan.) Read the plan from the bottom up.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT customer_id, COUNT(*) AS orders
          FROM big_orders
          WHERE order_date >= '2024-06-01'
          GROUP BY customer_id
          ORDER BY orders DESC, customer_id
          LIMIT 5;
        after: |
          From the bottom up:

          1. **Seq Scan on big_orders** reads all 200,000 rows and keeps about 58,000 that match the date (`Rows Removed by Filter` shows the rest).
          2. **HashAggregate** groups them by `customer_id` into 5,000 groups.
          3. **Sort** orders the groups. The note `top-N heapsort` means it only keeps the best 5.
          4. **Limit** returns 5 rows.

          Look at the `actual time` of each step: the numbers grow as you go up, because each step includes the time of the steps below it. Most of the time was spent reading the table. That is the step to improve.

      - type: quiz
        id: m15-l04-q2
        question: |
          Read this plan (shortened):

          ```
          Sort  (actual time=61.2..61.3 rows=5 loops=1)
            ->  HashAggregate  (actual time=58.0..59.9 rows=5000 loops=1)
                  ->  Seq Scan on big_orders  (actual time=0.1..33.4 rows=58000 loops=1)
                        Filter: (order_date >= '2024-06-01'::date)
                        Rows Removed by Filter: 142000
          ```

          Which step does PostgreSQL run **first**?
        options:
          - "Sort, because it is on top"
          - "HashAggregate"
          - "Seq Scan, because it is the most indented step"
          - "It is random"
        answer: 2
        explanation: |
          The deepest (most indented) step runs first and passes its rows up. Here the `Seq Scan` reads the table, `HashAggregate` groups, and `Sort` finishes. Also notice that the scan alone took about 33 of the 61 milliseconds, and it threw away 142,000 rows to keep 58,000.

      - type: read
        title: The scan types
        md: |
          The first thing to look at in a plan is **how each table is read**:

          | Scan | What it does | Typical when |
          |---|---|---|
          | **Seq Scan** | Reads every row of the table | the table is small, or the query needs a big part of it |
          | **Index Scan** | Walks the index, then fetches each matching row | few rows match |
          | **Index Only Scan** | Answers from the index alone, without touching the table | the index contains every column the query needs |
          | **Bitmap Index Scan + Bitmap Heap Scan** | Marks the matching pages first, then reads those pages once | a medium number of rows match, or they are spread over many pages |

          > [!TIP]
          > A **Seq Scan is not a bug**. For a tiny table, or a query that needs most of the rows, reading everything is the cheapest plan. It becomes a problem only when a *big* table is scanned to find *a few* rows.

      - type: example
        title: Four ways to read the same table
        md: |
          We build `big_orders` with two indexes and ask for four different slices. `EXPLAIN` (without `ANALYZE`) is enough, because we only want to see the choice. You get **four result tabs**, one per query: click through them.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_big_orders_order_id ON big_orders (order_id);
          CREATE INDEX idx_big_orders_customer ON big_orders (customer_id);
          ANALYZE big_orders;

          EXPLAIN SELECT * FROM big_orders WHERE order_id = 777;
          EXPLAIN SELECT order_id FROM big_orders WHERE order_id = 777;
          EXPLAIN SELECT * FROM big_orders WHERE customer_id = 777;
          EXPLAIN SELECT * FROM big_orders WHERE order_id < 150000;
        after: |
          - "**Result 1**: one specific order, so an **Index Scan**."
          - "**Result 2**: the same lookup, but we only ask for `order_id`, which the index already holds. That allows an **Index Only Scan**."
          - "**Result 3**: customer 777 has 40 orders spread all over the table, so PostgreSQL first builds a **Bitmap** of the right pages, then reads them."
          - "**Result 4**: three quarters of the table matches. The planner decides that reading everything is cheaper than jumping through the index 150,000 times, so it uses a **Seq Scan even though an index exists**."

          The planner compares the estimated cost of every option and picks the cheapest. That is why you never tell it which index to use.

      - type: predict
        id: m15-l04-p1
        question: |
          `customers` has a primary key, so `customer_id` is indexed. But the table has only 150 rows, stored in 3 pages. What scan will PostgreSQL choose for this query?
        sql: |
          EXPLAIN
          SELECT * FROM customers
          WHERE customer_id = 25;
        options:
          - "Seq Scan on customers"
          - "Index Scan using customers_pkey"
          - "Bitmap Heap Scan on customers"
          - "An error: customers has no index"
        answer: 0
        explanation: |
          A **Seq Scan**. Reading 3 tiny pages is cheaper (cost about 4.9) than visiting the index first and then the table (about 8.3). Having an index does not force PostgreSQL to use it: the planner always picks the cheapest plan. On `orders` (8 pages) the same kind of lookup does use the index.

      - type: example
        title: The same index, two different choices
        md: |
          On `orders` we create an index on `status`. Then we ask for the most common status (`delivered`, 72% of all orders) and for a rare one (`processing`, 7 orders). Two result tabs.
        sql: |
          CREATE INDEX idx_orders_status ON orders (status);

          EXPLAIN SELECT * FROM orders WHERE status = 'delivered';
          EXPLAIN SELECT * FROM orders WHERE status = 'processing';
        after: |
          For `delivered` the planner expects 650 of the 900 rows (`rows=650`) and uses a **Seq Scan**: almost the whole table is needed anyway. For `processing` it expects only 7 rows (`rows=7`) and switches to a **Bitmap** scan on the new index.

          The deciding factor is **selectivity**: what fraction of the table the filter keeps. An index shines when the answer is a small slice.

      - type: exercise
        id: m15-l04-e2
        title: Estimated versus actual
        prompt: |
          When the planner looks at `WHERE customer_id = 7` on `orders` it *estimates* 2 rows. Check the estimate against the truth: return one number, called `actual_rows`, the real count of orders with `customer_id = 7`.
        starter: |
          SELECT COUNT(*)
          FROM orders;
        solution: |
          SELECT COUNT(*) AS actual_rows
          FROM orders
          WHERE customer_id = 7;
        columnNames: true
        hints:
          - Count only the rows for customer 7.
          - Add a WHERE clause and alias the count.
          - "SELECT COUNT(*) AS actual_rows FROM orders WHERE customer_id = ___;"
        explanation: |
          The answer is 2: the estimate was exactly right. When estimates and actual rows are close, the planner usually makes good decisions. A big gap (for example `rows=1` estimated but 60,000 actual) is a red flag; lesson 7 shows why that happens and how to fix it.
        difficulty: 1

      - type: exercise
        id: m15-l04-e3
        title: How selective is a filter?
        prompt: |
          What share of all orders have `status = 'delivered'`? Return one number called `delivered_pct`: the percentage, rounded to 1 decimal (for example `72.2`).
        starter: |
          SELECT COUNT(*) AS delivered_pct
          FROM orders;
        solution: |
          SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'delivered') / COUNT(*), 1) AS delivered_pct
          FROM orders;
        columnNames: true
        hints:
          - Count the delivered orders and divide by all orders, multiplied by 100.0 to avoid integer division.
          - "`COUNT(*) FILTER (WHERE status = 'delivered')` counts only delivered orders."
          - "SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE ___) / COUNT(*), 1) AS delivered_pct FROM orders;"
        explanation: |
          72.2 percent of all orders are delivered. A filter that keeps 72% of the table is **not selective**, so the planner reads the whole table instead of using an index. A filter that keeps well under 5% is where indexes usually win.
        difficulty: 1

      - type: exercise
        id: m15-l04-e4
        title: What the planner knows about a table
        prompt: |
          The planner's notes about each table are kept in the catalog `pg_class`. Show, for the table named `orders`, two columns:

          - "`est_rows`: `reltuples` converted to an integer (`reltuples::int`)"
          - "`pages`: `relpages` (the number of 8 kB pages)"
        starter: |
          SELECT reltuples, relpages
          FROM pg_class;
        solution: |
          SELECT reltuples::int AS est_rows,
                 relpages AS pages
          FROM pg_class
          WHERE relname = 'orders';
        columnNames: true
        hints:
          - "`pg_class` has one row per table and index, so you need a WHERE on `relname`."
          - "Filter with `WHERE relname = 'orders'` and give the two columns their aliases."
          - "SELECT reltuples::int AS est_rows, relpages AS ___ FROM pg_class WHERE relname = ___;"
        explanation: |
          The planner believes `orders` has 900 rows in 8 pages. These two numbers are what it multiplies by the cost constants to estimate a Seq Scan (about 19.25 for `orders`). Statistics like these come from `ANALYZE`.
        difficulty: 2

      - type: read
        title: Finding the slow part
        md: |
          When a plan is long, hunt for these warning signs:

          1. **A Seq Scan on a big table with a `Filter` that throws most rows away.** Look at `Rows Removed by Filter`. An index on the filtered column may help.
          2. **The step with the biggest `actual time`.** Remember times include the steps below, so find the step where the time jumps up.
          3. **Estimated `rows` far from actual `rows`.** The planner is working with bad information (lesson 7).
          4. **A step with a large `loops` number.** A cheap step repeated a million times is expensive.

          > [!REAL-WORLD]
          > Experienced developers rarely guess. When a query is slow they run `EXPLAIN ANALYZE`, find the one step that dominates the time, fix it (often with an index), and run the same command again to prove it got faster.

      - type: exercise
        id: m15-l04-e5
        title: Fix what the plan showed
        prompt: |
          The support team looks up payments by `order_id` all day long, and `EXPLAIN` shows a **Seq Scan on payments** for `WHERE order_id = 150`.

          Fix it: create an index named `idx_payments_order_id` on `payments (order_id)`.
        starter: |
          EXPLAIN SELECT * FROM payments WHERE order_id = 150;
        solution: |
          CREATE INDEX idx_payments_order_id
          ON payments (order_id);
        check: |
          SELECT indexname, indexdef
          FROM pg_indexes
          WHERE tablename = 'payments'
          ORDER BY indexname;
        hints:
          - The plan needs an index on the column in the WHERE clause.
          - "`CREATE INDEX name ON table (column);`"
          - "CREATE INDEX idx_payments_order_id ON ___ (___);"
        explanation: |
          Run `EXPLAIN SELECT * FROM payments WHERE order_id = 150;` again afterwards. With 778 payments the planner may still prefer a cheap Seq Scan, but as the table grows, the index becomes the clear winner. This habit of "look at the plan, fix, look again" is the heart of performance work.
        difficulty: 2

      - type: exercise
        id: m15-l04-e6
        title: Which tables are the biggest?
        prompt: |
          A DBA wants to know where to look first. Show every ordinary table in the `public` schema with three columns:

          - "`table_name`: the table's name (`relname`)"
          - "`pages`: `relpages`"
          - "`est_rows`: `reltuples` as an integer"

          Biggest first by `pages`, ties broken by `table_name`. Join `pg_class` (alias `c`) to `pg_namespace` (alias `n`) on `n.oid = c.relnamespace`, and keep only `c.relkind = 'r'` (ordinary tables) in the namespace named `public`.
        starter: |
          SELECT c.relname AS table_name
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace;
        solution: |
          SELECT c.relname AS table_name,
                 c.relpages AS pages,
                 c.reltuples::int AS est_rows
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind = 'r'
          ORDER BY c.relpages DESC, c.relname;
        ordered: true
        columnNames: true
        hints:
          - The join is already in the starter. Add the filters on schema name and table kind.
          - "Use `WHERE n.nspname = 'public' AND c.relkind = 'r'`, then `ORDER BY c.relpages DESC, c.relname`."
          - "SELECT c.relname AS table_name, c.relpages AS pages, c.reltuples::int AS est_rows FROM pg_class c JOIN pg_namespace n ON ... WHERE ... ORDER BY ___ DESC, c.relname;"
        explanation: |
          `order_items` (17 pages) and `orders` (8 pages) are the biggest tables; even they are tiny. Real tables measured in gigabytes have millions of pages, which is where plan choices matter.
        difficulty: 3
    cheatsheet:
      - title: See the plan
        sql: |
          EXPLAIN
          SELECT * FROM orders WHERE order_id = 7;
        note: "Shows the planner's estimates without running the query."
      - title: Measure the real run
        sql: |
          EXPLAIN ANALYZE
          SELECT * FROM orders WHERE order_id = 7;
        note: "Runs the query for real: compare estimated rows with actual rows."
      - title: Measure a change safely
        sql: |
          BEGIN;
          EXPLAIN ANALYZE DELETE FROM reviews WHERE rating = 1;
          ROLLBACK;
        note: "EXPLAIN ANALYZE executes DELETE, UPDATE and INSERT for real, so roll back."
      - title: Scan types
        sql: |
          -- Seq Scan: whole table
          -- Index Scan / Index Only Scan: through an index
          -- Bitmap Heap Scan: pages marked by an index first
        note: "Read plans from the most indented line up. The planner picks the cheapest option."
  - id: m15-l05
    title: "Smarter indexes"
    summary: Build composite, partial, expression, covering and GIN indexes, and pick the one that matches the question.
    minutes: 30
    steps:
      - type: read
        title: One index is not enough
        md: |
          Mia's team runs three reports against the 200,000-row order history. The first asks for **one customer's orders in a date range**. The second asks for **orders that are still processing**. The third looks up customers **by email, ignoring capital letters**.

          A plain index on a single column helps only one of these questions. In this lesson you learn the right *shape* of index for each one. Every example builds its own practice table, so each one runs on its own.

      - type: example
        title: Two columns in one index
        md: |
          A **composite index** covers more than one column. This one is sorted by `customer_id` first, and by `order_date` inside each customer.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_cust_date
              ON big_orders (customer_id, order_date);

          ANALYZE big_orders;

          SELECT COUNT(*) AS orders_found
          FROM big_orders
          WHERE customer_id = 777
            AND order_date >= '2024-06-01';
        after: |
          Customer 777 has **13** orders since June 2024. PostgreSQL goes straight to customer 777 in the index, walks along the dates, and skips the other rows instead of reading all 200,000 of them.

      - type: read
        title: The order of the columns matters
        md: |
          Think of a phone book. It is sorted by **last name, then first name**. Finding every "Smith" is quick. Finding every "John" in the whole book is slow, because the Johns are spread across every section.

          The same is true for an index. The **first** column is the one the index is sorted by.

          > [!ANALOGY]
          > A phone book is a composite index on `(last_name, first_name)`. It answers "all Smiths" instantly, but "all Johns" needs a look at every section.

          A simple rule works well: put the columns you compare with `=` first, and the range column (`>`, `<`, `BETWEEN`) last. For "one customer, since a date", that is `(customer_id, order_date)`.

          > [!MISTAKE]
          > An index on `(customer_id, order_date)` does not help much when you filter by `order_date` alone. Build the index with the column you filter on first.

      - type: example
        title: The wrong order for a date-only question
        md: |
          Same table and same index. This time we ask only for one day. Look at the plan: it is the one from the phone-book mistake.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_cust_date
              ON big_orders (customer_id, order_date);

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT COUNT(*)
          FROM big_orders
          WHERE order_date = '2024-06-01';
        after: |
          The plan is a **Seq Scan**: PostgreSQL reads the whole table and removes **199,727** rows with the filter. The index starts with `customer_id`, so it cannot find a date quickly. The planner is right to ignore it.

          Lesson 4 taught you to read plans. Remember that the exact timings change on every run; the shape of the plan is what you learn from.

      - type: quiz
        id: m15-l05-q1
        question: |
          Your most common question is "orders for **one customer** placed **after a date**". Which index is the best fit?
        options:
          - "(order_date, customer_id)"
          - "(customer_id, order_date)"
          - "(status)"
          - "(total)"
        answer: 1
        explanation: |
          The equality column `customer_id` goes first, so the index jumps to one customer, and then `order_date` narrows the range inside that customer's entries. The other option reads a whole date range for every customer first.

      - type: read
        title: "Partial index: index only the rows you ask for"
        md: |
          A **partial index** holds only the rows that match a `WHERE` condition. It is smaller, cheaper to update, and very fast for the questions it was built for.

          The second report wants the orders that are still `processing`. Only about 1 in 100 orders is in that state, so an index on just those rows is much smaller than an index on all of them.

          > [!TIP]
          > The query must repeat the index's condition. An index built `WHERE status = 'processing'` helps a query that says `WHERE status = 'processing'`.

      - type: example
        title: A small index for open orders
        md: |
          We build an index on `order_date`, but only for processing orders. Then we count the processing orders from 2024.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_open_orders
              ON big_orders (order_date)
              WHERE status = 'processing';

          ANALYZE big_orders;

          SELECT COUNT(*) AS open_orders_2024
          FROM big_orders
          WHERE status = 'processing'
            AND order_date >= '2024-01-01';
        after: |
          The answer is **989** orders. The planner uses `idx_open_orders` because the query repeats its `WHERE status = 'processing'`. The index holds only about 2,000 entries, which is why it is so small. On the same table, a full index on `(status, order_date)` took about 1.4 MB, while this one took 56 kB.

      - type: exercise
        id: m15-l05-e1
        title: Fix the column order
        prompt: |
          The reports filter by `customer_id` **first** and then by `order_date`.

          Create an index named `idx_orders_cust_date` on the `orders` table with the columns **`customer_id`, then `order_date`**, in that order.

          The check shows the index definition.
        starter: |
          CREATE INDEX idx_orders_cust_date
              ON orders (order_date, customer_id);
        solution: |
          CREATE INDEX idx_orders_cust_date
              ON orders (customer_id, order_date);
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_orders_cust_date';
        hints:
          - The starter has the two columns in the wrong order. Swap them.
          - The first column in the brackets is the one the index is sorted by. It must be `customer_id`.
          - "CREATE INDEX idx_orders_cust_date ON orders (___, ___);"
        explanation: |
          The index is now sorted by customer first and by date second. The starter sorted it by date first, so it would be useless for "one customer's orders" questions.
        difficulty: 1

      - type: exercise
        id: m15-l05-e2
        title: Index only the processing orders
        prompt: |
          Create a **partial index** named `idx_open_orders` on the `orders` table. It should index `order_date`, but only for rows where `status` is `'processing'`.

          The check shows the index definition.
        solution: |
          CREATE INDEX idx_open_orders
              ON orders (order_date)
              WHERE status = 'processing';
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_open_orders';
        hints:
          - A partial index ends with a `WHERE` clause.
          - "Put `WHERE status = 'processing'` after the column list."
          - "CREATE INDEX idx_open_orders ON orders (___) WHERE ___ = ___;"
        explanation: |
          The `WHERE` at the end is what makes the index partial. Only the processing orders are stored in it, so it stays small even when the table grows.
        difficulty: 2

      - type: read
        title: "Expression index: index the result of a function"
        md: |
          The third report must ignore capital letters in emails. The query looks like this: `WHERE lower(email) = 'ana@example.com'`.

          A normal index on `email` cannot help, because it stores the emails as typed. An **expression index** stores the result of a function instead, such as `lower(email)`.

          > [!MISTAKE]
          > The query must use **the same expression** as the index. An index on `lower(email)` is not used by `WHERE email = ...`, so the query scans the whole table.

      - type: example
        title: Searching without caring about capitals
        md: |
          Emails are stored with mixed capitals, as sign-up forms often produce them. The index stores `lower(email)`, so the search also uses `lower(email)`.
        sql: |
          CREATE TABLE big_users AS
          SELECT g AS user_id,
                 'Person' || g || '@Mail.example.com' AS email
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_users_lower_email
              ON big_users (lower(email));

          ANALYZE big_users;

          SELECT user_id, email
          FROM big_users
          WHERE lower(email) = 'person777@mail.example.com';
        after: |
          User 777 is found, even though her email is stored as `Person777@Mail.example.com`. Try the same search with `WHERE email = 'person777@mail.example.com'` and you get **no rows**: the stored text has a capital P, and the index is not used for that expression.

      - type: exercise
        id: m15-l05-e3
        title: An index on lower(email)
        prompt: |
          Create an index named `idx_customers_lower_email` on the `customers` table that stores `lower(email)`.

          The check shows the index definition.
        solution: |
          CREATE INDEX idx_customers_lower_email
              ON customers (lower(email));
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_customers_lower_email';
        hints:
          - The function goes inside the brackets, around the column name.
          - "Write `ON customers (lower(email))`."
          - "CREATE INDEX idx_customers_lower_email ON customers (___(___));"
        explanation: |
          The brackets hold an expression, not just a column. Because the index stores `lower(email)`, a search with `WHERE lower(email) = ...` can use it.
        difficulty: 2

      - type: read
        title: "Covering index: answer from the index alone"
        md: |
          An **Index Only Scan** is the fastest kind of read. If the index contains every column the query asks for, PostgreSQL answers from the index and never visits the table.

          `INCLUDE` adds extra columns to the index for exactly this purpose. The included columns are stored in the index but are not used for searching or sorting.

          Index-only scans also need the table's **visibility map** to be up to date, and `VACUUM` keeps it current. Lesson 7 explains `VACUUM`.

      - type: example
        title: Answer from the index alone
        md: |
          We add the order date and total to the index with `INCLUDE`. Then we ask for exactly those columns for customer 777.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_cust_incl
              ON big_orders (customer_id)
              INCLUDE (order_date, total);

          VACUUM ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT customer_id, order_date, total
          FROM big_orders
          WHERE customer_id = 777;
        after: |
          The plan shows **Index Only Scan** and **Heap Fetches: 0**. Every column the query needs is in the index, so PostgreSQL never reads the table. Without `VACUUM` the visibility map would not be up to date, and PostgreSQL would still have to check the table rows.

      - type: exercise
        id: m15-l05-e4
        title: A covering index for customers
        prompt: |
          Create an index named `idx_orders_cust_incl` on the `orders` table. The key column is `customer_id`. Include `order_date` and `status` with `INCLUDE`, so a query for those three columns can be answered from the index.

          The check shows the index definition.
        solution: |
          CREATE INDEX idx_orders_cust_incl
              ON orders (customer_id)
              INCLUDE (order_date, status);
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_orders_cust_incl';
        hints:
          - The key column goes in the first brackets, and the extra columns go after the word INCLUDE.
          - Use a second pair of brackets after INCLUDE.
          - "CREATE INDEX idx_orders_cust_incl ON orders (___) INCLUDE (___, ___);"
        explanation: |
          `INCLUDE` columns are carried along in the index, not used to search. That makes the index bigger but lets some queries skip the table entirely.
        difficulty: 2

      - type: read
        title: "GIN index: search inside arrays and jsonb"
        md: |
          Some columns hold **many values in one cell**: a list of tags, or a JSON document. A **GIN index** (Generalized Inverted Index) records, for each value inside the cell, which rows contain it. It works like the index at the back of a cookbook: find the ingredient, then the list of pages.

          The operators a GIN index understands include `@>`, which means "contains". For example:

          - `tags @> ARRAY['vintage']` finds rows whose array contains `'vintage'`.
          - "`specs @> '{"recalled": true}'` finds JSON documents with that key and value."

          > [!MISTAKE]
          > `'vintage' = ANY(tags)` and `specs->>'recalled' = 'true'` look right, but a default GIN index does not help them. PostgreSQL scans the whole table. Use the operator the index understands.

      - type: example
        title: Find products by tag
        md: |
          We create a table of 200,000 products with a tags array, and a GIN index on the tags. Then we search for the rare tag `vintage`.
        sql: |
          CREATE TABLE product_tags AS
          SELECT g AS product_id,
                 CASE WHEN g % 500 = 0 THEN ARRAY['vintage', 'wired']
                      WHEN g % 2 = 0 THEN ARRAY['wireless']
                      ELSE ARRAY['wired'] END AS tags
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_tags
              ON product_tags USING GIN (tags);

          ANALYZE product_tags;

          SELECT COUNT(*) AS vintage_products
          FROM product_tags
          WHERE tags @> ARRAY['vintage'];
        after: |
          **400** products carry the `vintage` tag. The GIN index holds one entry for each tag, so the search jumps straight to the products that have it.

      - type: exercise
        id: m15-l05-e5
        title: Index a tags array
        setup: |
          CREATE TABLE product_tags (
              product_id integer PRIMARY KEY,
              tags text[]
          );

          INSERT INTO product_tags VALUES
              (1, ARRAY['kitchen', 'sale']),
              (2, ARRAY['garden']),
              (3, ARRAY['kitchen']);
        prompt: |
          The `product_tags` table has a `tags` array column. Create a **GIN** index named `idx_product_tags` on `tags`.

          The check shows the index definition.
        starter: |
          CREATE INDEX idx_product_tags
              ON product_tags (tags);
        solution: |
          CREATE INDEX idx_product_tags
              ON product_tags USING GIN (tags);
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_product_tags';
        hints:
          - The starter makes a normal B-tree index. Arrays need a different kind.
          - Add `USING GIN` between the table name and the column list.
          - "CREATE INDEX idx_product_tags ON product_tags USING ___ (tags);"
        explanation: |
          `USING GIN` tells PostgreSQL which kind of index to build. A GIN index is the right choice for arrays, jsonb and full-text search.
        difficulty: 2

      - type: predict
        id: m15-l05-p1
        question: |
          How many rows does this query return? Think about which orders are `processing` and when they were placed.
        sql: |
          SELECT COUNT(*) AS processing_december
          FROM orders
          WHERE status = 'processing'
            AND order_date >= '2024-12-01';
        options: ["0", "7", "86", "An error"]
        answer: 1
        explanation: |
          There are 7 processing orders in the shop, and the oldest was placed on 2024-12-24. So all 7 match. The 86 orders is the total for all of December 2024, not just processing ones.

      - type: fill
        id: m15-l05-f1
        prompt: |
          Finish the partial index so it covers only the **shipped** orders.
        template: |
          CREATE INDEX idx_shipped_date
              ON orders (order_date)
              WHERE ___ = ___;
        answers:
          - ["status"]
          - ["'shipped'"]
        explanation: |
          The `WHERE` clause picks the rows that go into the index. `status = 'shipped'` keeps only the shipped orders.

      - type: exercise
        id: m15-l05-e6
        title: Composite and partial together
        prompt: |
          Create an index named `idx_shipped_cust` on the `orders` table with the columns `customer_id` then `order_date`. Index **only** the rows where `status` is `'shipped'`.

          The check shows the index definition.
        solution: |
          CREATE INDEX idx_shipped_cust
              ON orders (customer_id, order_date)
              WHERE status = 'shipped';
        check: |
          SELECT indexdef
          FROM pg_indexes
          WHERE indexname = 'idx_shipped_cust';
        hints:
          - Start from the composite index from the first exercise, then add a `WHERE` at the end.
          - Keep `customer_id` first, then `order_date`.
          - "CREATE INDEX idx_shipped_cust ON orders (___, ___) WHERE ___ = ___;"
        explanation: |
          Combining the two ideas gives the smallest index that still answers the question: only shipped orders, sorted by customer and then date.
        difficulty: 3

      - type: parsons
        id: m15-l05-o1
        prompt: |
          Put the lines in the right order to index orders by customer and date, refresh the statistics, and count customer 7's orders since 2024-01-01.
        lines:
          - CREATE INDEX idx_orders_cust_date
          - ON orders (customer_id, order_date);
          - ANALYZE orders;
          - SELECT COUNT(*) AS orders_found
          - FROM orders
          - WHERE customer_id = 7
          - AND order_date >= '2024-01-01';
        distractors:
          - DROP TABLE orders;
        explanation: |
          First build the index, then `ANALYZE` so PostgreSQL knows the new index and the data sizes, and finally run the query. Never drop the table you are working with.
    cheatsheet:
      - title: Composite index
        sql: |
          CREATE INDEX idx_cust_date
              ON orders (customer_id, order_date);
        note: "Put the = column first and the range column last."
      - title: Partial index
        sql: |
          CREATE INDEX idx_open_orders
              ON orders (order_date)
              WHERE status = 'processing';
        note: "Only rows matching the WHERE are stored. The query must repeat the condition."
      - title: Expression index
        sql: |
          CREATE INDEX idx_customers_lower_email
              ON customers (lower(email));
        note: "The query must use the same expression: WHERE lower(email) = ..."
      - title: GIN index for arrays and jsonb
        sql: |
          CREATE INDEX idx_tags
              ON product_tags USING GIN (tags);
        note: "Use operators it understands, such as @> (contains)."

  - id: m15-l06
    title: "Writing fast queries"
    summary: Write conditions the planner can use with an index, and paginate big lists without OFFSET.
    minutes: 28
    steps:
      - type: read
        title: The dashboard that hides its indexes
        md: |
          Mia's "recent orders" page is slow. The index on `order_date` exists, so why is it not used? The developer wrote the filter like this: `WHERE EXTRACT(YEAR FROM order_date) = 2024`.

          The query is correct. It just hides the column inside a function, and that stops the index from helping. Most speed problems in everyday SQL are not missing indexes. They are conditions written in a way the index cannot understand.

      - type: example
        title: A function hides the column
        md: |
          We build a 200,000-row table with an index on `order_date`, then ask for the 2024 orders with `EXTRACT`.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_date ON big_orders (order_date);

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT COUNT(*)
          FROM big_orders
          WHERE EXTRACT(YEAR FROM order_date) = 2024;
        after: |
          The plan is a **Seq Scan**. PostgreSQL must work out `EXTRACT(YEAR ...)` for every row, so it reads the whole table and removes **100,009** rows with the filter. The index on `order_date` cannot help, because the condition asks about the year, not a range of dates.

      - type: read
        title: "Sargable: a condition the index can use"
        md: |
          **Sargable** is a fancy word (short for "search argument able") that means: *a condition the planner can use to search an index*.

          A column compared with plain values is sargable: `order_date >= '2024-01-01'`. A column wrapped in a function or arithmetic usually is not: `EXTRACT(...)`, `order_date + 1`, `lower(email)`. (An expression index from lesson 5 is the exception.)

          > [!ANALOGY]
          > A phone book is sorted by name. Finding everyone whose name starts with "S" is quick. Finding everyone whose name has an "a" as its third letter means reading every entry, because the book is not sorted that way.

          > [!TIP]
          > Move the work to the other side of the comparison. Keep the column bare and change the constants you compare it with.

      - type: example
        title: The same answer, written so the index helps
        md: |
          Same table and index. We ask the same question with a date range, and check that the count matches the first version.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_date ON big_orders (order_date);

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT COUNT(*)
          FROM big_orders
          WHERE order_date >= '2024-01-01'
            AND order_date < '2025-01-01';
        after: |
          The count is still **99,991**, but the plan now uses the index (a **Bitmap Index Scan** on `idx_date`), so PostgreSQL goes straight to the 2024 rows. A date range is the usual way to write "in 2024" so that an index on the date can be used.

      - type: quiz
        id: m15-l06-q1
        question: |
          Which condition lets PostgreSQL search an index on `order_date` directly?
        options:
          - "WHERE EXTRACT(YEAR FROM order_date) = 2024"
          - "WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'"
          - "WHERE TO_CHAR(order_date, 'YYYY') = '2024'"
          - "WHERE order_date::text = '2024-06-01'"
        answer: 1
        explanation: |
          Only the range keeps the column bare, so the index can be searched. The other three wrap `order_date` in a function or a cast, and PostgreSQL has to compute that for every row first.

      - type: exercise
        id: m15-l06-e1
        title: Write the range yourself
        prompt: |
          Show the `order_id` and `order_date` of every order placed from **25 December 2024 to 31 December 2024**, both days included. Sort by `order_id`.

          Do not wrap `order_date` in a function.
        starter: |
          SELECT order_id, order_date
          FROM orders
          WHERE
        solution: |
          SELECT order_id, order_date
          FROM orders
          WHERE order_date >= '2024-12-25'
            AND order_date < '2025-01-01'
          ORDER BY order_id;
        hints:
          - The end date is exclusive, so "before 1 January 2025" catches all of 31 December.
          - Use two conditions joined with AND, one for the start date and one for the end.
          - "WHERE order_date >= '2024-12-25' AND order_date ___ '2025-01-01'"
        explanation: |
          `>=` the start date and `<` the day after the end date covers the whole range, and it keeps `order_date` bare so the index can help. Thirteen orders match.
        ordered: true
        difficulty: 1

      - type: read
        title: OR versus UNION
        md: |
          Two conditions joined with `OR` are often fine. When each side has its own index, PostgreSQL can combine both results. But `UNION` is sometimes clearer and faster, especially when each side is a simple query.

          Be careful with the two kinds of `UNION`:

          - `UNION` joins the two lists and **removes duplicates**.
          - `UNION ALL` joins the two lists and **keeps duplicates**. It skips the duplicate check, so it is quicker, but only use it when the two parts cannot overlap.

      - type: example
        title: Duplicates hide in UNION ALL
        md: |
          We list the customers who live in California or are in the Corporate segment, and use `UNION ALL` to join the two lists.
        sql: |
          SELECT COUNT(*) AS rows_returned
          FROM (
              SELECT customer_id
              FROM customers
              WHERE state = 'CA'
              UNION ALL
              SELECT customer_id
              FROM customers
              WHERE segment = 'Corporate'
          ) AS matches;
        after: |
          The answer is **69**, but there are only **61** different customers in that set (`WHERE state = 'CA' OR segment = 'Corporate'` returns 61). The 8 customers who are both in California and Corporate were counted twice. `UNION` would have removed them.

          > [!MISTAKE]
          > `UNION ALL` is only correct when the two parts cannot share rows. If they can, switch to `UNION` or use one `WHERE` with `OR`.

      - type: exercise
        id: m15-l06-e2
        title: Fix the duplicates
        prompt: |
          List the `customer_id` of every customer who lives in Washington (`state = 'WA'`) **or** is in the `Home Office` segment. Each customer must appear **once**. Sort by `customer_id`.

          The starter returns some customers twice. Fix it.
        starter: |
          SELECT customer_id
          FROM customers
          WHERE state = 'WA'
          UNION ALL
          SELECT customer_id
          FROM customers
          WHERE segment = 'Home Office'
          ORDER BY customer_id;
        solution: |
          SELECT customer_id
          FROM customers
          WHERE state = 'WA'
          UNION
          SELECT customer_id
          FROM customers
          WHERE segment = 'Home Office'
          ORDER BY customer_id;
        hints:
          - Five customers are in both groups, and `UNION ALL` counts them twice.
          - Change the keyword between the two SELECT statements.
          - "SELECT customer_id FROM customers WHERE state = 'WA' ___ SELECT customer_id FROM customers WHERE segment = 'Home Office' ORDER BY customer_id;"
        explanation: |
          `UNION` removes the repeated rows, so each customer appears once. The answer is 38 customers. A single `WHERE state = 'WA' OR segment = 'Home Office'` gives the same list.
        ordered: true
        difficulty: 2

      - type: read
        title: NOT IN has a NULL trap; EXISTS does not
        md: |
          `NOT IN (...)` checks that a value is **not in a list**. The list comes from a subquery, and it may contain **NULL**, which means "unknown".

          If the list contains a NULL, `NOT IN` can never be TRUE, so the query returns nothing, and it does not warn you.

          `EXISTS` asks a simpler question: "is there at least one matching row?" It stops at the first match. `NOT EXISTS` is the safe way to find things that have **no** match, because NULLs cannot trick it.

          In this database, `EXISTS` and `IN` gave the same join plan, so choose the one that is clearer and NULL-safe.

      - type: example
        title: NOT IN returns nothing
        md: |
          We look for products whose id is not in the list of supplier ids. Three products have no supplier, so that list contains NULL.
        sql: |
          SELECT COUNT(*) AS products_found
          FROM products
          WHERE product_id NOT IN (
              SELECT supplier_id
              FROM products
          );
        after: |
          **0** products come back, and there is no error. Three rows of the subquery are NULL, and `product_id NOT IN (..., NULL)` is never TRUE. Replace `NOT IN` with `NOT EXISTS` when the list can contain NULL.

          > [!MISTAKE]
          > Many beginners write `NOT IN` and assume it is safe. It is only safe when the subquery cannot return NULL.

      - type: predict
        id: m15-l06-p1
        question: |
          How many customers have never placed an order? This query uses `NOT IN`, but the subquery column has no NULL values.
        sql: |
          SELECT COUNT(*) AS never_ordered
          FROM customers
          WHERE customer_id NOT IN (
              SELECT customer_id
              FROM orders
          );
        options: ["0", "10", "140", "150"]
        answer: 1
        explanation: |
          `orders.customer_id` has no NULLs, so `NOT IN` works as expected. Customers 141 to 150 have never ordered, which is 10 customers. The 0 answer is the NULL trap from the example, and it does not apply here.

      - type: exercise
        id: m15-l06-e3
        title: Customers who never ordered
        prompt: |
          List the `customer_id`, `first_name` and `last_name` of every customer who has **never placed an order**. Use `NOT EXISTS`. Sort by `customer_id`.
        starter: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          WHERE NOT EXISTS (
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders AS o
              WHERE o.customer_id = c.customer_id
          )
          ORDER BY c.customer_id;
        hints:
          - "The subquery looks for an order that belongs to this customer."
          - "Inside the brackets, match `o.customer_id` with `c.customer_id`."
          - "WHERE NOT EXISTS (SELECT 1 FROM orders AS o WHERE o.customer_id = ___);"
        explanation: |
          For each customer, `NOT EXISTS` checks whether any order matches. Ten customers (141 to 150) have none. The starter is unfinished, so it is not a valid query yet.
        ordered: true
        difficulty: 2

      - type: read
        title: SELECT * and ORDER BY with LIMIT
        md: |
          Two small habits make a big difference:

          - **Ask only for the columns you need.** `SELECT *` asks for every column, so PostgreSQL must visit the table rows too. `SELECT customer_id` can be answered from an index alone, if one covers that column (lesson 5).
          - **Ask for the top rows with an index that is already sorted.** If an index holds the rows in the order `ORDER BY` wants, PostgreSQL reads the first few entries and stops. Without a matching index it has to sort everything first.

          > [!MISTAKE]
          > `ORDER BY ... LIMIT 5` without a tie-breaker can return different rows on different runs. Always add a unique column such as `order_id` at the end of the `ORDER BY`.

      - type: example
        title: The five newest orders
        md: |
          We index `(order_date, order_id)`, so the rows are already in the newest-first order the dashboard wants.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_date_id
              ON big_orders (order_date, order_id);

          ANALYZE big_orders;

          SELECT order_id, order_date
          FROM big_orders
          ORDER BY order_date DESC, order_id DESC
          LIMIT 5;
        after: |
          The five newest orders are 199562, 198831, 198100, 197369 and 196638, all placed on 2024-12-31. PostgreSQL reads five index entries and stops. Without the index it would sort all 200,000 rows before choosing five.

      - type: read
        title: OFFSET gets slower as you go deeper
        md: |
          Pagination (showing a list one page at a time) often uses `LIMIT` with `OFFSET`:

          ```sql
          SELECT ...
          ORDER BY order_date DESC, order_id DESC
          LIMIT 10 OFFSET 150000;
          ```

          `OFFSET 150000` means "skip the first 150,000 rows". PostgreSQL has to produce those rows and throw them away before it can return page 15,001. The deeper the page, the more work.

          **Keyset pagination** (also called seek pagination) avoids this. Remember the last row you showed, and ask for the rows that come after it. The index jumps straight to that position.

          > [!MISTAKE]
          > Keyset pagination needs a unique tie-breaker, such as `order_id`. If two rows share the same date and you only compare dates, rows can be skipped or shown twice.

      - type: example
        title: Why deep pages are slow
        md: |
          We ask for page 15,001 of the newest orders, 10 per page, using `OFFSET`.
        sql: |
          CREATE TABLE big_orders AS
          SELECT g AS order_id,
                 g % 5000 + 1 AS customer_id,
                 DATE '2023-01-01' + g % 731 AS order_date,
                 CASE WHEN g % 101 = 0 THEN 'processing'
                      WHEN g % 101 < 71 THEN 'delivered'
                      WHEN g % 101 < 91 THEN 'shipped'
                      ELSE 'cancelled' END AS status,
                 ROUND(9.99 + g % 197 * 1.5, 2) AS total
          FROM generate_series(1, 200000) AS g;

          CREATE INDEX idx_date_id
              ON big_orders (order_date, order_id);

          ANALYZE big_orders;

          EXPLAIN ANALYZE
          SELECT order_id, order_date
          FROM big_orders
          ORDER BY order_date DESC, order_id DESC
          LIMIT 10 OFFSET 150000;
        after: |
          The plan says the index scan produced **150,010 rows** to return just 10. Those 150,000 extra rows were read and then dropped. Keyset pagination needs to read only the rows it returns, as the next exercise shows.

      - type: exercise
        id: m15-l06-e4
        title: The next page, without OFFSET
        prompt: |
          The dashboard shows orders 3 per page, newest first. The last order on page 1 was **order 893**, placed on **2024-12-27**.

          Write the query for page 2, using keyset pagination (no `OFFSET`). Show `order_id` and `order_date`. Sort by `order_date` newest first, then `order_id` descending. Return 3 rows.
        starter: |
          SELECT order_id, order_date
          FROM orders
          ORDER BY order_date DESC, order_id DESC
          LIMIT 3;
        solution: |
          SELECT order_id, order_date
          FROM orders
          WHERE (order_date, order_id) < (DATE '2024-12-27', 893)
          ORDER BY order_date DESC, order_id DESC
          LIMIT 3;
        hints:
          - The starter shows page 1 again. Page 2 needs rows that come after order 893.
          - Compare the pair `(order_date, order_id)` with the pair `(DATE '2024-12-27', 893)`, using `<`.
          - "SELECT order_id, order_date FROM orders WHERE (order_date, order_id) < (DATE '2024-12-27', ___) ORDER BY order_date ___, order_id ___ LIMIT 3;"
        explanation: |
          `(order_date, order_id) < (...)` compares the two columns as a pair, so rows on the same date with a smaller id still come next. The result is orders 892, 891 and 890, with no OFFSET needed.
        columnNames: true
        ordered: true
        difficulty: 3

      - type: fill
        id: m15-l06-f1
        prompt: |
          Finish the query that shows the 5 newest orders.
        template: |
          SELECT order_id, order_date
          FROM orders
          ORDER BY order_date DESC, order_id DESC
          ___ 5;
        answers:
          - ["LIMIT"]
        explanation: |
          `LIMIT` keeps only the first rows of the sorted result. Put it after `ORDER BY`, because the sort has to happen first.

      - type: parsons
        id: m15-l06-o1
        prompt: |
          Put the lines in the right order to fetch the next page of three orders after order 893 (placed 2024-12-27), using keyset pagination.
        lines:
          - SELECT order_id, order_date
          - FROM orders
          - WHERE (order_date, order_id) < (DATE '2024-12-27', 893)
          - ORDER BY order_date DESC, order_id DESC
          - LIMIT 3;
        distractors:
          - OFFSET 300;
        explanation: |
          Select the columns, pick the table, filter to rows after the last one shown, sort with the tie-breaker, and keep three rows. `OFFSET` is not needed in keyset pagination, so that line stays out.

      - type: exercise
        id: m15-l06-e5
        title: Delivered orders, next page
        prompt: |
          Only delivered orders from 2024 should appear on this dashboard page. The last row on the previous page was **order 891**, placed on **2024-12-25**.

          Show the next **3** delivered orders placed in 2024, after that row. Use a date range for 2024 (no function on `order_date`) and keyset pagination (no `OFFSET`). Show `order_id` and `order_date`, newest first, then `order_id` descending.
        solution: |
          SELECT order_id, order_date
          FROM orders
          WHERE status = 'delivered'
            AND order_date >= '2024-01-01'
            AND order_date < '2025-01-01'
            AND (order_date, order_id) < (DATE '2024-12-25', 891)
          ORDER BY order_date DESC, order_id DESC
          LIMIT 3;
        hints:
          - Combine the status condition, the date range and the keyset comparison with AND.
          - The keyset comparison is `(order_date, order_id) < (DATE '2024-12-25', 891)`.
          - "WHERE status = 'delivered' AND order_date >= '2024-01-01' AND order_date ___ '2025-01-01' AND (order_date, order_id) < (___);"
        explanation: |
          Each condition keeps the query fast: the date range is sargable, the keyset comparison jumps to the position, and `LIMIT` stops early. The three rows are orders 890, 882 and 881.
        columnNames: true
        ordered: true
        difficulty: 3
    cheatsheet:
      - title: Range instead of a function
        sql: |
          SELECT order_id, order_date
          FROM orders
          WHERE order_date >= '2024-01-01'
            AND order_date < '2025-01-01';
        note: "Keep the column bare so an index on it can be used."
      - title: Never ordered (NOT EXISTS)
        sql: |
          SELECT c.customer_id
          FROM customers AS c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders AS o
              WHERE o.customer_id = c.customer_id
          );
        note: "Safe with NULLs, unlike NOT IN."
      - title: Next page with keyset
        sql: |
          SELECT order_id, order_date
          FROM orders
          WHERE (order_date, order_id) < (DATE '2024-12-27', 893)
          ORDER BY order_date DESC, order_id DESC
          LIMIT 3;
        note: "Use the last row you showed, plus a unique tie-breaker."
      - title: Duplicates removed
        sql: |
          SELECT customer_id FROM customers WHERE state = 'WA'
          UNION
          SELECT customer_id FROM customers WHERE segment = 'Home Office';
        note: "UNION removes duplicates; UNION ALL keeps them and is quicker."

  - id: m15-l07
    title: "Joins under the hood"
    summary: See how PostgreSQL chooses a join method, and how ANALYZE and VACUUM keep its plans and tables healthy.
    minutes: 30
    steps:
      - type: read
        title: Same question, three ways to answer it
        md: |
          Mia's dashboard joins `customers`, `orders` and `order_items` for every chart. Sometimes it is instant, and sometimes it hangs. The SQL text is the same each time, so the difference must come from **how** PostgreSQL joins the tables.

          For every join, the planner picks one of three **join methods**. It is not guessing: it estimates how many rows each step will produce, and it picks the method it expects to be cheapest. You do not choose the method yourself, but you can understand the choice and help the planner make it.

      - type: read
        title: The three join methods
        md: |
          - **Nested loop.** For each row on one side, look up the matching rows on the other side. It is excellent when one side is small and the other side has an index on the join column.
          - **Hash join.** Read one side into a hash table in memory (a fast lookup table). Then read the other side once and look up each row in the table. It works only for equality joins (`=`), and it is the usual choice for big tables.
          - **Merge join.** Make sure both sides are sorted by the join column, then walk down both lists side by side. It is very fast when the sorting is already done, for example when an index gives the rows in order.

          > [!ANALOGY]
          > Imagine matching guests with name tags. A **nested loop** checks each guest against a short list. A **hash join** sorts the name tags into a box by first letter, then goes through the guests once. A **merge join** lines up two sorted lists and compares them side by side.

      - type: example
        title: A nested loop with an index
        md: |
          Customer 7 is one row. The orders table has an index on `customer_id`, so the planner finds customer 7 first and then uses the index to find only her orders.
        sql: |
          CREATE INDEX idx_orders_cust
              ON orders (customer_id);

          ANALYZE orders;

          SELECT c.first_name,
                 o.order_id
          FROM customers AS c
          JOIN orders AS o
            ON o.customer_id = c.customer_id
          WHERE c.customer_id = 7
          ORDER BY o.order_id;
        after: |
          Two orders, both from **Daniela** (order 152 and order 414). When one side has a single row and the other side is indexed, the planner uses a **Nested Loop** in the plan. Each step is quick, because the index does the searching.

      - type: quiz
        id: m15-l07-q1
        question: |
          A query joins a table that is filtered down to **one row** to a very large table, and the large table has an index on the join column. Which join method suits this best?
        options:
          - "Nested loop"
          - "Hash join"
          - "Merge join"
          - "Cross join"
        answer: 0
        explanation: |
          A nested loop does one fast index lookup per row of the small side. With a single row, that is one lookup. A cross join multiplies every row by every other row, which is the opposite of what you want here.

      - type: example
        title: A hash join for a big match
        md: |
          Now the join is between two large tables with no filter. Ask for the plan, and look for the word **Hash Join**.
        sql: |
          EXPLAIN
          SELECT o.order_id,
                 i.product_id
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id;
        after: |
          The plan contains **Hash Join**. The planner builds a hash table from the `orders` side (the 900 rows), then reads the `order_items` side once and looks up each line. The plan is only an estimate, but the shape is the point: a hash table makes each lookup cheap, and no index is needed.

      - type: read
        title: Merge join and planner settings
        md: |
          A **merge join** needs both sides sorted by the join column. Sorting is extra work, unless an index already gives the rows in that order. When it is free, a merge join is a very efficient way to join.

          To learn how the methods compare, you can switch one off for your session with `SET enable_hashjoin = off;`. The planner then has to choose something else. The answer does **not** change, only the way PostgreSQL gets it.

          > [!MISTAKE]
          > `SET enable_...` commands are for experiments only. In real work, leave the planner alone and fix the cause: a missing index, or statistics that are out of date.

      - type: example
        title: The same answer, another method
        md: |
          We switch hash joins off for this session and count the joined rows. Then we compare the answer with the earlier join.
        sql: |
          SET enable_hashjoin = off;

          SELECT COUNT(*) AS joined_rows
          FROM orders AS o
          JOIN order_items AS i
            ON i.order_id = o.order_id;
        after: |
          The answer is **2,296** order lines, the same as with a hash join. With hash joins off, the planner uses a **Merge Join**: both sides are read in `order_id` order, straight from existing indexes, so no sorting is needed.

      - type: exercise
        id: m15-l07-e1
        title: Join warm-up
        prompt: |
          Show the `order_id` and the customer's `last_name` for every order placed on **2024-12-29**. Sort by `order_id`.
        starter: |
          SELECT o.order_id,
                 c.last_name
          FROM orders AS o
          JOIN customers AS c
          WHERE o.order_date = '2024-12-29'
          ORDER BY o.order_id;
        solution: |
          SELECT o.order_id,
                 c.last_name
          FROM orders AS o
          JOIN customers AS c
            ON c.customer_id = o.customer_id
          WHERE o.order_date = '2024-12-29'
          ORDER BY o.order_id;
        hints:
          - The starter has no join condition, so it would multiply the rows. Add an `ON` clause.
          - Match `o.customer_id` with `c.customer_id`.
          - "FROM orders AS o JOIN customers AS c ___ c.customer_id = o.customer_id"
        explanation: |
          Every join needs a condition that says which rows belong together. Without it, the `JOIN` pairs every order with every customer, which is almost always a mistake.
        ordered: true
        columnNames: true
        difficulty: 1

      - type: read
        title: "Statistics: the planner's notes"
        md: |
          The planner decides using **statistics**: notes about each table that PostgreSQL keeps in the catalog. They include an estimate of how many rows the table has, and for each column how many different values it holds (`n_distinct`), plus the most common values.

          `ANALYZE` refreshes these notes by reading a sample of the table. Autovacuum runs `ANALYZE` in the background, but after a big load you can run it yourself, straight away.

          > [!REAL-WORLD]
          > When a plan suddenly gets slow after a bulk import, experienced developers run `ANALYZE` on the table first. Out-of-date statistics are one of the most common causes of bad plans.

      - type: example
        title: Read the notes the planner keeps
        md: |
          We refresh the notes for `customers`, then read the number of distinct values the planner recorded for three columns.
        sql: |
          ANALYZE customers;

          SELECT attname,
                 n_distinct
          FROM pg_stats
          WHERE schemaname = 'public'
            AND tablename = 'customers'
            AND attname IN ('state', 'segment', 'city')
          ORDER BY attname;
        after: |
          The planner knows that `city` has **14** different values, `segment` has **3** and `state` has **12**. When it estimates how many customers are in a state, it uses these numbers.

      - type: exercise
        id: m15-l07-e2
        title: What does the planner know about orders?
        prompt: |
          Read the planner's notes for the `orders` table. Show the `attname` and `n_distinct` of the `status` and `ship_city` columns only. Sort by `attname`.
        starter: |
          SELECT attname,
                 n_distinct
          FROM pg_stats
          WHERE tablename = 'orders';
        solution: |
          SELECT attname,
                 n_distinct
          FROM pg_stats
          WHERE schemaname = 'public'
            AND tablename = 'orders'
            AND attname IN ('status', 'ship_city')
          ORDER BY attname;
        hints:
          - The starter lists the notes for every column. Keep only two of them.
          - Add a condition on `attname` with `IN (...)`.
          - "WHERE schemaname = 'public' AND tablename = 'orders' AND attname ___ ('status', 'ship_city')"
        explanation: |
          `pg_stats` has one row per column. `status` has 5 distinct values and `ship_city` has 14. Filtering on `attname` keeps only the columns you care about.
        ordered: true
        columnNames: true
        difficulty: 2

      - type: read
        title: "VACUUM: cleaning up old row versions"
        md: |
          When you `UPDATE` or `DELETE` a row, PostgreSQL does not erase the old version straight away. Other sessions may still need it. The old version becomes a **dead row**, and it still takes up space in the table.

          **`VACUUM`** removes dead rows so their space can be reused. It also updates the **visibility map**, which index-only scans rely on (lesson 5). Autovacuum runs `VACUUM` in the background, so you rarely need to run it yourself.

          > [!TIP]
          > `VACUUM ANALYZE` does both jobs in one command: it cleans the table and refreshes the statistics.

      - type: example
        title: VACUUM does not change your data
        md: |
          We clean and analyze the `reviews` table, then count the reviews. Nothing has been deleted, so the count stays the same.
        sql: |
          VACUUM ANALYZE reviews;

          SELECT COUNT(*) AS reviews
          FROM reviews;
        after: |
          The count is **320**, as before. `VACUUM` tidies up dead rows and keeps the notes current, but it never removes live data.

      - type: example
        title: VACUUM cannot run in a transaction
        md: |
          `VACUUM` cannot run inside a transaction, so trying to wrap it in `BEGIN` and `COMMIT` gives an error.
        sql: |
          BEGIN;

          VACUUM reviews;

          COMMIT;
        expectError: true
        after: |
          The error says **VACUUM cannot run inside a transaction block**. Run `VACUUM` on its own, outside any `BEGIN ... COMMIT`.

          > [!MISTAKE]
          > Maintenance commands such as `VACUUM` are not part of a transaction, so they cannot be rolled back. Run them as their own statements.

      - type: exercise
        id: m15-l07-e3
        title: Orders per segment
        prompt: |
          For each customer `segment`, count how many orders its customers placed. Show the `segment` and the count as `orders_placed`. Sort by `segment`.
        starter: |
          SELECT c.segment
          FROM customers AS c
          JOIN orders AS o
            ON o.customer_id = c.customer_id
          ORDER BY c.segment;
        solution: |
          SELECT c.segment,
                 COUNT(*) AS orders_placed
          FROM customers AS c
          JOIN orders AS o
            ON o.customer_id = c.customer_id
          GROUP BY c.segment
          ORDER BY c.segment;
        hints:
          - You need to count the orders, so you need a `GROUP BY` on the segment.
          - Use `COUNT(*) AS orders_placed` in the SELECT list.
          - "SELECT c.segment, COUNT(*) AS orders_placed FROM ... GROUP BY ___ ORDER BY c.segment;"
        explanation: |
          The join connects each order to its customer, and `GROUP BY` collapses the rows into one per segment. The three segments add up to the 900 orders in the shop.
        ordered: true
        columnNames: true
        difficulty: 2

      - type: predict
        id: m15-l07-p1
        question: |
          This query uses `LEFT JOIN`, so every customer appears at least once. How many rows does it return?
        sql: |
          SELECT COUNT(*) AS rows_returned
          FROM customers AS c
          LEFT JOIN orders AS o
            ON o.customer_id = c.customer_id;
        options: ["900", "910", "150", "140"]
        answer: 1
        explanation: |
          The 140 customers with orders contribute their 900 orders in total. The 10 customers without orders still appear once each, with empty order columns. 900 + 10 = 910.

      - type: exercise
        id: m15-l07-e4
        title: Three tables in one join
        prompt: |
          For **delivered** orders only, count the order lines (rows in `order_items`) in each product category. Show the category `name` as `category_name` and the count as `delivered_lines`. Sort by `category_name`.

          You will need to join four tables: `order_items`, `orders`, `products` and `categories`.
        starter: |
          SELECT cat.name AS category_name
          FROM order_items AS i
          JOIN orders AS o
            ON o.order_id = i.order_id
          JOIN products AS p
            ON p.product_id = i.product_id
          JOIN categories AS cat
            ON cat.category_id = p.category_id
          ORDER BY cat.name;
        solution: |
          SELECT cat.name AS category_name,
                 COUNT(*) AS delivered_lines
          FROM order_items AS i
          JOIN orders AS o
            ON o.order_id = i.order_id
          JOIN products AS p
            ON p.product_id = i.product_id
          JOIN categories AS cat
            ON cat.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY cat.name
          ORDER BY cat.name;
        hints:
          - Keep the joins from the starter. You only need to add a filter, a count and a grouping.
          - Filter the orders with `WHERE o.status = 'delivered'`.
          - "Add COUNT(*) AS delivered_lines and GROUP BY cat.name before ORDER BY."
        explanation: |
          Each join adds one table to the chain. Filtering on the orders table and grouping by category gives one row per category. The result has 11 categories, and Books is the largest with 312 lines.
        ordered: true
        columnNames: true
        difficulty: 3

      - type: fill
        id: m15-l07-f1
        prompt: |
          Finish the command that cleans the `reviews` table **and** refreshes its statistics.
        template: |
          VACUUM ___ reviews;
        answers:
          - ["ANALYZE"]
        explanation: |
          `VACUUM ANALYZE` does both jobs at once. Plain `VACUUM` cleans up dead rows, and `ANALYZE` refreshes the statistics the planner uses.

      - type: parsons
        id: m15-l07-o1
        prompt: |
          Put the lines in the right order to refresh the statistics for `orders`, then check what the planner knows about the `status` column.
        lines:
          - ANALYZE orders;
          - SELECT attname, n_distinct
          - FROM pg_stats
          - WHERE tablename = 'orders'
          - AND attname = 'status';
        distractors:
          - CREATE INDEX idx_status ON orders (status);
        explanation: |
          Refresh first, then read the notes. Creating an index is not part of this check, so that line stays out.
    cheatsheet:
      - title: See the join method
        sql: |
          EXPLAIN
          SELECT o.order_id, c.last_name
          FROM orders AS o
          JOIN customers AS c
            ON c.customer_id = o.customer_id;
        note: "Look for Nested Loop, Hash Join or Merge Join in the plan."
      - title: Index for a nested loop
        sql: |
          CREATE INDEX idx_orders_cust
              ON orders (customer_id);
        note: "An index on the join column lets a nested loop find matches quickly."
      - title: Refresh the statistics
        sql: |
          ANALYZE orders;
        note: "Run it after a big load, so the planner's estimates are current."
      - title: Clean up dead rows
        sql: |
          VACUUM ANALYZE reviews;
        note: "Cannot run inside BEGIN ... COMMIT. Run it on its own."

testPool:
  # ---------------------------------------------------------------- l01 Views
  - type: exercise
    id: m15-t01
    lesson: m15-l01
    difficulty: 1
    prompt: |
      Create a view called `us_west_customers` with the columns `customer_id`, `first_name`, `last_name` and `state`, for customers whose `state` is `'CA'`, `'OR'` or `'WA'`.
    starter: |
      CREATE VIEW us_west_customers AS
      SELECT
    solution: |
      CREATE VIEW us_west_customers AS
      SELECT customer_id, first_name, last_name, state
      FROM customers
      WHERE state IN ('CA', 'OR', 'WA');
    check: |
      SELECT * FROM us_west_customers ORDER BY customer_id;
    hints:
      - A view is `CREATE VIEW name AS` plus a normal SELECT.
      - "Use `WHERE state IN (...)` to keep the three states."
      - "CREATE VIEW us_west_customers AS SELECT customer_id, first_name, last_name, state FROM customers WHERE state IN (___);"
    explanation: |
      The view lists the customers living in those three states. It stores no rows, so new customers from CA, OR or WA appear in it automatically.
  # ---------------------------------------------------------------- l01 Views
  - type: quiz
    id: m15-t02
    lesson: m15-l01
    difficulty: 1
    question: |
      When you `SELECT` from a view, what does PostgreSQL actually run?
    options:
      - "A copy of the rows that were stored when the view was created"
      - "The view's SELECT query, run again against the current tables"
      - "Nothing: a view can only be listed, never queried"
      - "A brand-new table with the same name as the view"
    answer: 1
    explanation: |
      A view stores the question, not the answer. Each time you use it, PostgreSQL runs the saved SELECT, so the result always reflects the current data.
  - type: exercise
    id: m15-t03
    lesson: m15-l01
    difficulty: 2
    prompt: |
      Create a view named `orders_2024` that holds every column of the `orders` table for orders placed in 2024 (from 2024-01-01 to 2024-12-31). The check counts the rows in the view.
    starter: |
      CREATE VIEW orders_2024 AS
      SELECT *
      FROM orders;
    solution: |
      CREATE VIEW orders_2024 AS
      SELECT *
      FROM orders
      WHERE order_date >= '2024-01-01'
        AND order_date < '2025-01-01';
    check: |
      SELECT COUNT(*) AS orders_in_view
      FROM orders_2024;
    hints:
      - The starter shows every order, not only the ones from 2024.
      - Add a WHERE clause on order_date with a start date and an end date.
      - "CREATE VIEW orders_2024 AS SELECT * FROM orders WHERE order_date >= '2024-01-01' AND order_date ___ '2025-01-01';"
    explanation: |
      The view stores the question, so it always reflects the current orders. 572 orders were placed in 2024. The starter returns all 900.
  - type: exercise
    id: m15-t04
    lesson: m15-l01
    difficulty: 3
    prompt: |
      Create a view named `active_products` with the columns `product_id`, `name` and `price`, for products where `is_active` is `TRUE`.

      Then, **through that view**, change the price of product 2 to `99.50`.

      The check shows product 2's price.
    starter: |
      CREATE VIEW active_products AS
      SELECT product_id, name, price
      FROM products
      WHERE is_active = TRUE;
    solution: |
      CREATE VIEW active_products AS
      SELECT product_id, name, price
      FROM products
      WHERE is_active = TRUE;

      UPDATE active_products
      SET price = 99.50
      WHERE product_id = 2;
    check: |
      SELECT product_id, price
      FROM products
      WHERE product_id = 2;
    hints:
      - The starter only creates the view. You also need an UPDATE.
      - A simple view that uses one table can be updated, so name the view after UPDATE.
      - "UPDATE active_products SET price = ___ WHERE product_id = ___;"
    explanation: |
      A simple view that selects from one table can be updated, and PostgreSQL changes the matching row in `products`. Product 2 now costs 99.50.
  # ---------------------------------------------------------- l02 Materialized views
  - type: quiz
    id: m15-t05
    lesson: m15-l02
    difficulty: 1
    question: |
      What does `REFRESH MATERIALIZED VIEW` do?
    options:
      - "Recalculates the stored result from the current data"
      - "Creates a new index on the view"
      - "Changes the query that the view is based on"
      - "Deletes every row from the base tables"
    answer: 0
    explanation: |
      A materialized view keeps a saved copy of its result. `REFRESH` takes a new copy from the current data. It never changes the base tables.
  - type: exercise
    id: m15-t06
    lesson: m15-l02
    difficulty: 2
    prompt: |
      Create a **materialized view** named `segment_totals` with two columns: `segment`, and `customers` (how many customers are in that segment).

      The check reads the view, sorted by `segment`.
    starter: |
      CREATE MATERIALIZED VIEW segment_totals AS
      SELECT segment
      FROM customers;
    solution: |
      CREATE MATERIALIZED VIEW segment_totals AS
      SELECT segment,
             COUNT(*) AS customers
      FROM customers
      GROUP BY segment;
    check: |
      SELECT segment, customers
      FROM segment_totals
      ORDER BY segment;
    ordered: true
    hints:
      - The starter lists every customer and does not count anything.
      - Count the rows in each group with `COUNT(*)`, and group by `segment`.
      - "CREATE MATERIALIZED VIEW segment_totals AS SELECT segment, COUNT(*) AS customers FROM customers ___ segment;"
    explanation: |
      The materialized view stores one row per segment: Consumer 89, Corporate 33 and Home Office 28. Together they make the 150 customers.
  - type: predict
    id: m15-t07
    lesson: m15-l02
    difficulty: 2
    question: |
      The materialized view `segment_counts` is created **before** one customer is deleted. What total does the last query return?
    sql: |
      CREATE MATERIALIZED VIEW segment_counts AS
      SELECT segment, COUNT(*) AS n
      FROM customers
      GROUP BY segment;

      DELETE FROM customers
      WHERE customer_id = 150;

      SELECT SUM(n) AS customers_in_view
      FROM segment_counts;
    options: ["149", "150", "140", "An error"]
    answer: 1
    explanation: |
      The view is a saved copy, so it still counts the deleted customer and shows 150. It only catches up after REFRESH MATERIALIZED VIEW segment_counts;.
  - type: parsons
    id: m15-t25
    lesson: m15-l02
    difficulty: 1
    prompt: |
      Put the lines in the right order to create a materialized view that counts customers per city, sorted by city.
    lines:
      - CREATE MATERIALIZED VIEW city_counts AS
      - SELECT city, COUNT(*) AS customers
      - FROM customers
      - GROUP BY city
      - ORDER BY city;
    distractors:
      - REFRESH MATERIALIZED VIEW city_counts;
    explanation: |
      The view must be created before anything can refresh it. Refreshing is a later step, so that line stays out of the definition.
  # ---------------------------------------------------------- l03 How indexes work
  - type: quiz
    id: m15-t08
    lesson: m15-l03
    difficulty: 1
    question: |
      What is the main price you pay for adding an index to a table?
    options:
      - "INSERT, UPDATE and DELETE get slower, and the index takes up disk space"
      - "Every SELECT returns different rows"
      - "The table can no longer be sorted"
      - "The table is locked until the index is dropped"
    answer: 0
    explanation: |
      Every change to the table must also update each index on it. Indexes make reads faster but writes slower, so only add the ones you need.
  - type: exercise
    id: m15-t09
    lesson: m15-l03
    difficulty: 2
    prompt: |
      Create a **unique** index named `uq_products_name` on the `name` column of the `products` table. A unique index stops two products from having the same name.

      The check shows the index definition.
    starter: |
      CREATE INDEX uq_products_name
          ON products (name);
    solution: |
      CREATE UNIQUE INDEX uq_products_name
          ON products (name);
    check: |
      SELECT indexdef
      FROM pg_indexes
      WHERE indexname = 'uq_products_name';
    hints:
      - The starter makes an ordinary index. One extra word after CREATE makes it unique.
      - "CREATE ___ INDEX uq_products_name ON products (name);"
      - All 60 product names are different, so the index can be built.
    explanation: |
      `CREATE UNIQUE INDEX` builds an index and enforces uniqueness at the same time. It works here because no two products share a name.
  - type: fill
    id: m15-t10
    lesson: m15-l03
    difficulty: 1
    prompt: |
      Complete the index on `orders.status`. Name the default index type explicitly: it is `btree`.
    template: |
      CREATE INDEX idx_orders_status
          ON orders USING ___ (status);
    answers:
      - ["btree"]
    explanation: |
      `USING btree` names the index type. It is also the default, so leaving out `USING` builds the same kind of index.
  # ---------------------------------------------------------- l04 Reading EXPLAIN
  - type: exercise
    id: m15-t11
    lesson: m15-l04
    difficulty: 2
    prompt: |
      Time an `UPDATE` with `EXPLAIN ANALYZE`, but **do not keep the change**. Set `is_active` to `FALSE` for every product with `stock_qty = 0`.

      The check counts the active products. It should still be 56.
    starter: |
      EXPLAIN ANALYZE
      UPDATE products
      SET is_active = FALSE
      WHERE stock_qty = 0;
    solution: |
      BEGIN;
      EXPLAIN ANALYZE
      UPDATE products
      SET is_active = FALSE
      WHERE stock_qty = 0;
      ROLLBACK;
    check: |
      SELECT COUNT(*) AS active_products
      FROM products
      WHERE is_active;
    hints:
      - The starter really changes the rows. Wrap the statement in a transaction.
      - Begin with BEGIN, and undo everything with ROLLBACK.
      - "BEGIN; EXPLAIN ANALYZE UPDATE products SET ___ WHERE stock_qty = 0; ROLLBACK;"
    explanation: |
      `ROLLBACK` throws the change away, so all 56 products stay active. The starter keeps the change, and the count drops to 53.
  - type: predict
    id: m15-t12
    lesson: m15-l04
    difficulty: 2
    question: |
      Inside this transaction, how many reviews are left after the `DELETE`? The `ROLLBACK` at the end undoes the delete.
    sql: |
      BEGIN;

      DELETE FROM reviews
      WHERE rating >= 4;

      SELECT COUNT(*) AS reviews_inside
      FROM reviews;

      ROLLBACK;
    options: ["86", "234", "320", "0"]
    answer: 0
    explanation: |
      There are 234 reviews with 4 or 5 stars, so 320 - 234 = 86 remain inside the transaction. The `ROLLBACK` brings all 234 back afterwards.
  - type: quiz
    id: m15-t13
    lesson: m15-l04
    difficulty: 2
    question: |
      In an `EXPLAIN ANALYZE` plan, a step estimates `rows=1`, but the actual count is 60,000. What is the most likely fix?
    options:
      - "Run ANALYZE on the table so the planner's statistics are current"
      - "Add SELECT * to the query"
      - "Delete the WHERE clause"
      - "Run VACUUM FULL on the database"
    answer: 0
    explanation: |
      A big gap between estimated and actual rows means the planner is working with bad information. Refreshing the statistics with ANALYZE usually fixes the plan. VACUUM FULL does not refresh them.
  # ---------------------------------------------------------- l05 Smarter indexes
  - type: quiz
    id: m15-t14
    lesson: m15-l05
    difficulty: 2
    question: |
      Your query says `WHERE lower(email) = 'ana@example.com'`. Which index can the planner use for it?
    options:
      - "An index on email"
      - "An index on (last_name, first_name)"
      - "A partial index WHERE status = 'processing'"
      - "An index on lower(email)"
    answer: 3
    explanation: |
      The index must hold the same expression as the query. An index on `lower(email)` stores exactly what the search compares. A plain index on `email` stores the text as typed, so it cannot be used here.
  - type: exercise
    id: m15-t15
    lesson: m15-l05
    difficulty: 2
    prompt: |
      Create a partial index named `idx_reviews_five_star` on `product_id` in the `reviews` table. It should hold **only** the reviews with `rating = 5`.

      The check shows the index definition.
    starter: |
      CREATE INDEX idx_reviews_five_star
          ON reviews (product_id);
    solution: |
      CREATE INDEX idx_reviews_five_star
          ON reviews (product_id)
          WHERE rating = 5;
    check: |
      SELECT indexdef
      FROM pg_indexes
      WHERE indexname = 'idx_reviews_five_star';
    hints:
      - The starter indexes every review. Add a condition at the end.
      - Use `WHERE rating = 5` after the column list.
      - "CREATE INDEX idx_reviews_five_star ON reviews (product_id) ___ rating = 5;"
    explanation: |
      Only the 136 five-star reviews go into this index, so it is much smaller than an index on all 320 reviews.
  - type: exercise
    id: m15-t16
    lesson: m15-l05
    difficulty: 2
    prompt: |
      Create a covering index named `idx_reviews_prod_incl` on `reviews`. The key column is `product_id`. Include `rating` and `created_at` with `INCLUDE`.

      The check shows the index definition.
    starter: |
      CREATE INDEX idx_reviews_prod_incl
          ON reviews (product_id, rating, created_at);
    solution: |
      CREATE INDEX idx_reviews_prod_incl
          ON reviews (product_id)
          INCLUDE (rating, created_at);
    check: |
      SELECT indexdef
      FROM pg_indexes
      WHERE indexname = 'idx_reviews_prod_incl';
    hints:
      - The starter makes all three columns part of the search key. Only `product_id` belongs in the first brackets.
      - Put `rating` and `created_at` inside brackets after the word `INCLUDE`.
      - "CREATE INDEX idx_reviews_prod_incl ON reviews (___) INCLUDE (___, ___);"
    explanation: |
      `INCLUDE` columns travel with the index but are not part of its sort order. A query for these three columns can then be answered from the index alone, once VACUUM has run.
  - type: predict
    id: m15-t17
    lesson: m15-l05
    difficulty: 2
    question: |
      How many shipped orders were placed before 1 December 2024? These are the stuck shipments.
    sql: |
      SELECT COUNT(*) AS stuck_shipments
      FROM orders
      WHERE status = 'shipped'
        AND order_date < '2024-12-01';
    options: ["0", "7", "14", "320"]
    answer: 1
    explanation: |
      The shop has 14 shipped orders in total, but only 7 were placed before December 2024. The other 7 were placed in December.
  # ---------------------------------------------------------- l06 Writing fast queries
  - type: quiz
    id: m15-t18
    lesson: m15-l06
    difficulty: 2
    question: |
      A dashboard shows 10 orders per page. Which approach stays fast when a user jumps to page 15,000?
    options:
      - "Keep OFFSET: page 15,000 is LIMIT 10 OFFSET 149990"
      - "Keyset pagination: WHERE (order_date, order_id) < (the last row shown), then LIMIT 10"
      - "SELECT * and then pick the rows in the application"
      - "Remove the ORDER BY, so PostgreSQL has less to do"
    answer: 1
    explanation: |
      OFFSET reads and discards every row before the page, so deep pages get slower. Keyset pagination jumps straight to the position after the last row shown. Removing ORDER BY would make the pages meaningless.
  - type: exercise
    id: m15-t19
    lesson: m15-l06
    difficulty: 3
    prompt: |
      Show the `review_id`, `rating` and `created_at` of the 5-star reviews (`rating = 5`) written in 2023. Use a date range for 2023, not a function on `created_at`.

      Sort by `created_at` newest first, then by `review_id` descending. Keep only the top 3 rows.
    starter: |
      SELECT review_id, rating, created_at
      FROM reviews
      WHERE rating = 5
      ORDER BY created_at DESC
      LIMIT 3;
    solution: |
      SELECT review_id, rating, created_at
      FROM reviews
      WHERE rating = 5
        AND created_at >= '2023-01-01'
        AND created_at < '2024-01-01'
      ORDER BY created_at DESC, review_id DESC
      LIMIT 3;
    hints:
      - The starter shows the newest 5-star reviews from every year, so it needs a date filter.
      - "Add two conditions on `created_at`: a start date and an end date."
      - "AND created_at >= '2023-01-01' AND created_at ___ '2024-01-01'"
    columnNames: true
    ordered: true
    explanation: |
      The date range keeps `created_at` bare, so an index on it can be used. `review_id` breaks ties, so `LIMIT 3` always returns the same rows. The answer is reviews 103, 99 and 97.
  - type: fill
    id: m15-t20
    lesson: m15-l06
    difficulty: 1
    prompt: |
      Complete the query so it skips 6 orders and then returns the next 3.
    template: |
      SELECT order_id
      FROM orders
      ORDER BY order_id
      ___ 3 ___ 6;
    answers:
      - ["LIMIT"]
      - ["OFFSET"]
    explanation: |
      `LIMIT 3 OFFSET 6` skips the first six rows and returns the next three: orders 7, 8 and 9.
  - type: predict
    id: m15-t21
    lesson: m15-l06
    difficulty: 2
    question: |
      How many products have never been sold? Look at the `order_items` table.
    sql: |
      SELECT COUNT(*) AS never_sold
      FROM products
      WHERE product_id NOT IN (
          SELECT product_id
          FROM order_items
      );
    options: ["0", "5", "52", "60"]
    answer: 1
    explanation: |
      `order_items.product_id` has no NULLs, so `NOT IN` is safe here. Five products (5, 34, 46, 56 and 60) never appear in an order.
  # ---------------------------------------------------------- l07 Joins under the hood
  - type: fill
    id: m15-t22
    lesson: m15-l07
    difficulty: 2
    prompt: |
      Complete the query that reads the planner's notes about the `segment` column of `customers`.
    template: |
      SELECT attname, n_distinct
      FROM ___
      WHERE tablename = 'customers'
        AND attname = 'segment';
    answers:
      - ["pg_stats"]
    explanation: |
      `pg_stats` has one row per column with the statistics the planner uses. For `segment` it shows 3 distinct values.
  - type: parsons
    id: m15-t23
    lesson: m15-l07
    difficulty: 2
    prompt: |
      Put the lines in the right order to count, for each state, the orders its customers placed. Customers without any orders must still appear, with a count of 0.
    lines:
      - SELECT c.state,
      - COUNT(o.order_id) AS order_count
      - FROM customers AS c
      - LEFT JOIN orders AS o
      - ON o.customer_id = c.customer_id
      - GROUP BY c.state
      - ORDER BY c.state;
    distractors:
      - WHERE o.status = 'returned'
    explanation: |
      A `LEFT JOIN` keeps every customer, and `COUNT(o.order_id)` counts only real orders, so customers with none get 0. A `WHERE` on the orders table would drop those customers again, so that line stays out.
  - type: exercise
    id: m15-t24
    lesson: m15-l07
    difficulty: 3
    prompt: |
      For each `state`, count the **different** customers who have at least one **delivered** order. Show `state` and `buyers`. Sort by `state`.
    starter: |
      SELECT c.state,
             COUNT(*) AS buyers
      FROM customers AS c
      JOIN orders AS o
        ON o.customer_id = c.customer_id
      WHERE o.status = 'delivered'
      GROUP BY c.state
      ORDER BY c.state;
    solution: |
      SELECT c.state,
             COUNT(DISTINCT c.customer_id) AS buyers
      FROM customers AS c
      JOIN orders AS o
        ON o.customer_id = c.customer_id
      WHERE o.status = 'delivered'
      GROUP BY c.state
      ORDER BY c.state;
    hints:
      - The starter counts orders, not customers. One customer can have several orders.
      - Count only the distinct customer ids, with `DISTINCT` inside `COUNT`.
      - "COUNT(___ c.customer_id) AS buyers"
    columnNames: true
    ordered: true
    explanation: |
      `COUNT(*)` counts joined rows (orders). `COUNT(DISTINCT c.customer_id)` counts each customer once per state. The result has 12 states, and California has 33 buyers.
project:
  id: m15-proj
  title: Speed Up the Dashboard
  icon: "🚀"
  dataset: shop
  md: |
    Mia runs ShopSmart. Every Monday she opens the **dashboard**, and it has become painfully slow. Every chart runs its own query over the same tables, and most of them filter by date.

    You will fix it in six steps. Each step builds on the one before:

    1. Give every order one row with its total, saved as a view.
    2. Save the monthly sales chart as a materialized view.
    3. Index the date column the widgets filter on.
    4. Rewrite a slow date filter so an index can help.
    5. Page through the "recent orders" list without `OFFSET`.
    6. Refresh the chart without blocking the managers who are reading it.

    Each task starts with the earlier pieces already in place, so you only write the new part. Read the prompt carefully: it says which columns to show and in which order.
  tasks:
    - type: exercise
      id: m15-proj-1
      title: One row per order
      prompt: |
        Mia needs one row per order, with its total, for every chart. Create a **view** named `order_totals` that shows these columns for each order:

        `order_id`, `customer_id`, `order_date`, `status` and `total`

        The `total` is the sum of `quantity * unit_price * (1 - discount)` over the order's lines, rounded to 2 decimals. The check shows the number of orders and the revenue.
      starter: |
        CREATE VIEW order_totals AS
        SELECT order_id, status
        FROM orders;
      solution: |
        CREATE VIEW order_totals AS
        SELECT o.order_id,
               o.customer_id,
               o.order_date,
               o.status,
               ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
        FROM orders AS o
        JOIN order_items AS i
          ON i.order_id = o.order_id
        GROUP BY o.order_id,
                 o.customer_id,
                 o.order_date,
                 o.status;
      check: |
        SELECT COUNT(*) AS orders,
               ROUND(SUM(total), 2) AS revenue
        FROM order_totals;
      hints:
        - Join `orders` to `order_items` on `order_id`, then add up the lines for each order.
        - GROUP BY the order columns, and put the SUM in the SELECT list with `AS total`.
        - "The line total is `quantity * unit_price * (1 - discount)`."
      explanation: |
        The view joins the two tables and groups them once, so every chart can read one row per order. There are 900 orders, with revenue of 314,851.15.
      difficulty: 1

    - type: exercise
      id: m15-proj-2
      title: Monthly sales, saved
      setup: |
        CREATE VIEW order_totals AS
        SELECT o.order_id,
               o.customer_id,
               o.order_date,
               o.status,
               ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
        FROM orders AS o
        JOIN order_items AS i
          ON i.order_id = o.order_id
        GROUP BY o.order_id,
                 o.customer_id,
                 o.order_date,
                 o.status;
      prompt: |
        The managers open a sales chart of **delivered** orders, one row per month. Save it as a **materialized view** named `monthly_sales` with three columns:

        - "`month`: the year and month as text, like `'2024-11'` (use `to_char(order_date, 'YYYY-MM')`)"
        - "`orders`: the number of delivered orders in that month"
        - "`revenue`: the sum of their `total`"

        Use the `order_totals` view from the first task. The check counts the months and adds up the orders.
      starter: |
        CREATE MATERIALIZED VIEW monthly_sales AS
        SELECT to_char(order_date, 'YYYY-MM') AS month,
               COUNT(*) AS orders,
               SUM(total) AS revenue
        FROM order_totals
        GROUP BY to_char(order_date, 'YYYY-MM');
      solution: |
        CREATE MATERIALIZED VIEW monthly_sales AS
        SELECT to_char(order_date, 'YYYY-MM') AS month,
               COUNT(*) AS orders,
               SUM(total) AS revenue
        FROM order_totals
        WHERE status = 'delivered'
        GROUP BY to_char(order_date, 'YYYY-MM');
      check: |
        SELECT COUNT(*) AS months,
               SUM(orders) AS delivered_orders
        FROM monthly_sales;
      hints:
        - The starter counts every order, but the chart only shows delivered ones.
        - Add `WHERE status = 'delivered'` before the GROUP BY.
        - "FROM order_totals WHERE ___ = ___ GROUP BY to_char(order_date, 'YYYY-MM');"
      explanation: |
        The materialized view stores the monthly totals, so the chart reads 24 rows instead of adding up 900 orders each time. The 24 months contain 650 delivered orders.
      difficulty: 2

    - type: exercise
      id: m15-proj-3
      title: An index for the recent orders list
      prompt: |
        The "recent orders" widget filters orders by `order_date`, and it is slow. Create an index named `idx_orders_date` on the `order_date` column of `orders`.

        The check shows the index definition.
      starter: |
        CREATE INDEX idx_orders_date
            ON orders (status);
      solution: |
        CREATE INDEX idx_orders_date
            ON orders (order_date);
      check: |
        SELECT indexdef
        FROM pg_indexes
        WHERE indexname = 'idx_orders_date';
      hints:
        - The starter indexes the wrong column.
        - Put `order_date` inside the brackets.
        - "CREATE INDEX idx_orders_date ON orders (___);"
      explanation: |
        A plain index on the date column lets the widget jump to a date range instead of reading every order. The next task shows the kind of filter that can use it.
      difficulty: 2

    - type: exercise
      id: m15-proj-4
      title: Big orders in 2024, with a range
      setup: |
        CREATE VIEW order_totals AS
        SELECT o.order_id,
               o.customer_id,
               o.order_date,
               o.status,
               ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
        FROM orders AS o
        JOIN order_items AS i
          ON i.order_id = o.order_id
        GROUP BY o.order_id,
                 o.customer_id,
                 o.order_date,
                 o.status;
      prompt: |
        The "big orders in 2024" widget counts **delivered** orders from 2024 whose `total` is at least 500. The first version used `EXTRACT(YEAR FROM order_date) = 2024`, which hides the date from the index.

        Write the query with a **date range** instead. Show one row with `COUNT(*) AS big_orders_2024`.
      starter: |
        SELECT COUNT(*) AS big_orders_2024
        FROM order_totals
        WHERE status = 'delivered'
          AND total >= 500;
      solution: |
        SELECT COUNT(*) AS big_orders_2024
        FROM order_totals
        WHERE status = 'delivered'
          AND total >= 500
          AND order_date >= '2024-01-01'
          AND order_date < '2025-01-01';
      hints:
        - The starter counts big delivered orders from every year. It needs a filter for 2024.
        - "Add two conditions on `order_date`: a start date and an end date."
        - "AND order_date >= '2024-01-01' AND order_date ___ '2025-01-01'"
      explanation: |
        The answer is 93. The date range keeps `order_date` bare, which is the form an index can search. The `EXTRACT` version returns the same count but hides the date inside a function.
      difficulty: 2

    - type: exercise
      id: m15-proj-5
      title: Next page of recent orders
      setup: |
        CREATE VIEW order_totals AS
        SELECT o.order_id,
               o.customer_id,
               o.order_date,
               o.status,
               ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
        FROM orders AS o
        JOIN order_items AS i
          ON i.order_id = o.order_id
        GROUP BY o.order_id,
                 o.customer_id,
                 o.order_date,
                 o.status;
      prompt: |
        The "recent orders" list shows 5 orders per page, newest first. The last order on the previous page was **order 850**, placed on **2024-12-12**.

        Write the query for the next page using **keyset pagination** (no `OFFSET`). Show `order_id`, `order_date` and `total` for the next 5 orders. Sort by `order_date` newest first, then by `order_id` descending.
      starter: |
        SELECT order_id, order_date, total
        FROM order_totals
        ORDER BY order_date DESC, order_id DESC
        LIMIT 5;
      solution: |
        SELECT order_id, order_date, total
        FROM order_totals
        WHERE (order_date, order_id) < (DATE '2024-12-12', 850)
        ORDER BY order_date DESC, order_id DESC
        LIMIT 5;
      hints:
        - The starter shows the newest page again. The next page starts after order 850.
        - Compare the pair `(order_date, order_id)` with `(DATE '2024-12-12', 850)` using `<`.
        - "WHERE (order_date, order_id) ___ (DATE '2024-12-12', 850)"
      columnNames: true
      ordered: true
      explanation: |
        The next five orders are 849, 848, 847, 846 and 845. Orders 849 and 848 share a date, and the pair comparison keeps them in order, with no repeats or gaps.
      difficulty: 3

    - type: exercise
      id: m15-proj-6
      title: A refresh that does not block readers
      setup: |
        CREATE VIEW order_totals AS
        SELECT o.order_id,
               o.customer_id,
               o.order_date,
               o.status,
               ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS total
        FROM orders AS o
        JOIN order_items AS i
          ON i.order_id = o.order_id
        GROUP BY o.order_id,
                 o.customer_id,
                 o.order_date,
                 o.status;

        CREATE MATERIALIZED VIEW monthly_sales AS
        SELECT to_char(order_date, 'YYYY-MM') AS month,
               COUNT(*) AS orders,
               SUM(total) AS revenue
        FROM order_totals
        WHERE status = 'delivered'
        GROUP BY to_char(order_date, 'YYYY-MM');
      prompt: |
        Every night `monthly_sales` is refreshed, and managers are reading it at the same time. A normal refresh blocks readers while it runs.

        Make it safe. Create a **UNIQUE** index named `idx_monthly_sales_month` on the `month` column of `monthly_sales`, then run `REFRESH MATERIALIZED VIEW CONCURRENTLY monthly_sales;`.

        The check shows the index definition.
      starter: |
        CREATE INDEX idx_monthly_sales_month
            ON monthly_sales (month);
      solution: |
        CREATE UNIQUE INDEX idx_monthly_sales_month
            ON monthly_sales (month);

        REFRESH MATERIALIZED VIEW CONCURRENTLY monthly_sales;
      check: |
        SELECT indexdef
        FROM pg_indexes
        WHERE indexname = 'idx_monthly_sales_month';
      hints:
        - The starter is missing the word that makes the index unique.
        - "The word CONCURRENTLY needs a unique index on the view. Create that first."
        - "CREATE ___ INDEX idx_monthly_sales_month ON monthly_sales (month); REFRESH MATERIALIZED VIEW ___ monthly_sales;"
      explanation: |
        `REFRESH ... CONCURRENTLY` rebuilds the data while readers keep seeing the old rows. PostgreSQL allows it only when a unique index exists on the view, and `month` is unique here because each month appears once.
      difficulty: 3
