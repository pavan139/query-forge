    lesson: m14-l04
    difficulty: 2
    question: In PostgreSQL, at which level can a phantom read still happen?
    options: ["REPEATABLE READ only", "READ COMMITTED (the default)", "SERIALIZABLE only", "Nowhere, at any level"]
    answer: 1
    explanation: |
      At READ COMMITTED, each statement sees the rows committed so far, so a new matching row can appear between two
      reads. REPEATABLE READ and SERIALIZABLE keep one snapshot for the whole transaction.
