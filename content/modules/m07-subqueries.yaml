id: m07
order: 7
title: Subqueries — Queries Inside Queries
subtitle: Let one question help answer another
icon: "🪆"
level: intermediate
description: |
  Real questions are rarely one step: "Which products cost more than the **average**?" or
  "Which customers have **never** ordered?" You need an answer *first*, and then you use it.

  In this module you will learn to put one query inside another (a **subquery**), to build lists
  with `IN`, to ask "does a matching row exist?" with `EXISTS`, to compare each row with its own
  group, to treat a query like a table, and to compare against whole sets with `ANY` and `ALL`.
  You will also learn the famous `NOT IN` + `NULL` trap — and how to never fall into it.
dataset: shop
lessons:
  - id: m07-l01
    title: Scalar subqueries
    summary: Use a query that returns one value inside WHERE, SELECT and HAVING.
    minutes: 25
    steps:
      - type: read
        title: Priya has a question
        md: |
          Priya from marketing sends you a message:

          > "Which of our products cost **more than the average** product?"

          To answer, you need two things: **(1)** the average price, and **(2)** the products above it.
          Until now you would run two queries — copy the average from the first, paste it into the second.

          A **subquery** does both steps in one go. It is a `SELECT` written **inside another query**,
          wrapped in parentheses `( )`. The inner query runs first and hands its answer to the outer query.

          > [!ANALOGY]
          > Imagine cooking and the recipe says "add the amount of salt you wrote on the sticky note".
          > You read the sticky note first, then you cook. A subquery is the sticky note: the database
          > reads it first, then finishes the rest of the query.

          When the inner query returns **exactly one value** (one row, one column), it is called a
          **scalar subquery**. "Scalar" just means "a single value". You can use it anywhere you could
          type a single number, piece of text or date.

      - type: example
        title: The inner query on its own
        md: |
          First, the sticky note by itself. Press **Run**.
        sql: |
          SELECT AVG(price)
          FROM products;
        after: |
          One row, one column: the average price of all 60 products, about **193.04**
          (PostgreSQL shows extra zeros after the decimals — that's normal for averages).
          That is a single value, so it is a perfect scalar subquery.

      - type: stepper
        title: Working from the inside out
        md: |
          Click through the three stages. Notice how stage 3 is stage 2 with the pasted number
          replaced by the query that produces it.
        stages:
          - label: Inner query
            md: The database runs the inner query first. It produces one value.
            sql: |
              SELECT AVG(price)
              FROM products;
          - label: Paste the number
            md: |
              If we typed that number by hand, we could filter the products. But the number
              would go **stale** the day a price changes.
            sql: |
              SELECT name, price
              FROM products
              WHERE price > 193.04
              ORDER BY price DESC;
          - label: Use a subquery
            md: |
              Now the database finds the average itself, every time. The answer is always up to date.
            sql: |
              SELECT name, price
              FROM products
              WHERE price > (SELECT AVG(price) FROM products)
              ORDER BY price DESC;

      - type: example
        title: Products above the average price
        md: |
          Same query as stage 3, written with one clause per line. Run it and count the rows.
        sql: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT AVG(price)
              FROM products
          )
          ORDER BY price DESC;
        after: |
          **12 products** cost more than the average — from the Aurora 16-inch Pro Laptop (1499.99)
          down to the 10-inch Tablet Lite (229.99). The inner query ran once, produced about 193.04,
          and the outer query kept every row with a bigger price.

      - type: predict
        id: m07-l01-p1
        question: |
          This query looks for the product whose price equals the highest price.
          How many rows does it return?
        sql: |
          SELECT name
          FROM products
          WHERE price = (SELECT MAX(price) FROM products);
        options: ["1 row", "12 rows", "0 rows", "An error"]
        answer: 0
        explanation: |
          `MAX(price)` is 1499.99, and only one product has that price: *Aurora 16-inch Pro Laptop*.
          If two products shared the top price, both would be returned.

      - type: exercise
        id: m07-l01-e1
        title: Costly to make
        prompt: |
          Show the `name` and `cost` of every product whose `cost` is **above the average `cost`**
          of all products. Use a subquery — don't type the average by hand.
        starter: |
          SELECT name, cost
          FROM products
          WHERE cost > (SELECT ___ FROM products);
        solution: |
          SELECT name, cost
          FROM products
          WHERE cost > (SELECT AVG(cost) FROM products);
        hints:
          - You need the average of the `cost` column, computed by an inner query.
          - "The inner query is `SELECT AVG(cost) FROM products`. Wrap it in parentheses after `cost >`."
          - "SELECT name, cost FROM products WHERE cost > (SELECT AVG(___) FROM products);"
        explanation: |
          12 products have a cost above the average of about 112.01. The pattern is always the same:
          `WHERE column  <comparison>  (SELECT one_value ...)`.
        difficulty: 1

      - type: read
        title: The golden rule of scalar subqueries
        md: |
          When you use `=`, `>`, `<` and friends, the subquery must give back **one column** and
          **at most one row**. What happens if it gives more?

          - **Two or more rows** → error: *more than one row returned by a subquery used as an expression*.
          - **Two or more columns** → error: *subquery must return only one column*.
          - **Zero rows** → no error! The value is simply **NULL** (an unknown). And as you learned
            in m02, a comparison with NULL is never true, so the outer query returns nothing.

          > [!MISTAKE]
          > Writing `WHERE price > (SELECT price FROM products WHERE category_id = 9)`. Kitchen has
          > eight products, so the subquery returns eight prices, and `>` can only compare against one.
          > Ask for a single value with `MAX`, `MIN` or `AVG`.

      - type: example
        title: See the error with your own eyes
        md: |
          Run this on purpose. Kitchen (category 9) has several products, so the subquery returns many rows.
        sql: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT price
              FROM products
              WHERE category_id = 9
          );
        expectError: true
        after: |
          PostgreSQL says: *more than one row returned by a subquery used as an expression*.
          The fix is to boil the eight prices down to one value — for example with `MAX(price)`
          ("more expensive than **every** Kitchen product").

      - type: exercise
        id: m07-l01-e2
        title: Fix the crash
        prompt: |
          This query should show the `name` and `price` of products that cost **more than the most
          expensive Kitchen product** (`category_id = 9`), but it crashes. Fix it.
        starter: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT price
              FROM products
              WHERE category_id = 9
          );
        solution: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT MAX(price)
              FROM products
              WHERE category_id = 9
          );
        hints:
          - The inner query returns one price per Kitchen product. You need just one number.
          - Which aggregate gives the biggest value?
          - "SELECT ... WHERE price > (SELECT ___(price) FROM products WHERE category_id = 9);"
        explanation: |
          The most expensive Kitchen product is the Stainless Steel Cookware Set at 189.99, so the query
          returns the 12 products priced above it. `MAX` squeezes many rows into one value.
        difficulty: 1

      - type: example
        title: The latest order
        md: |
          A subquery is perfect for "the newest", "the oldest", "the biggest"... First find the date,
          then find the rows with that date.
        sql: |
          SELECT order_id, customer_id, status, order_date
          FROM orders
          WHERE order_date = (SELECT MAX(order_date) FROM orders);
        after: |
          The most recent order date in the shop is **2024-12-31**, and exactly one order was placed that
          day: order 900, from customer 102, still `shipped`. If several orders shared that date,
          you would see all of them.

      - type: exercise
        id: m07-l01-e3
        title: The very first order
        prompt: |
          Show the `order_id`, `customer_id` and `order_date` of every order placed on the **earliest
          order date** in the `orders` table.
        starter: |
          SELECT order_id, customer_id, order_date
          FROM orders
          WHERE order_date = (SELECT ___ FROM orders);
        solution: |
          SELECT order_id, customer_id, order_date
          FROM orders
          WHERE order_date = (SELECT MIN(order_date) FROM orders);
        hints:
          - It's the mirror image of the latest-order example.
          - The earliest date is the *smallest* date. Which aggregate finds the smallest?
          - "SELECT order_id, customer_id, order_date FROM orders WHERE order_date = (SELECT MIN(___) FROM orders);"
        explanation: |
          The shop's first day was 2023-01-01, and one order was placed on it. `MIN` finds the smallest value —
          for dates, the earliest one.
        difficulty: 1

      - type: read
        title: A subquery in the SELECT list
        md: |
          So far the subquery sat in `WHERE`. A scalar subquery can also be **a column of its own**.
          That's handy when you want to show each row *next to* a number from the whole table —
          for example, each product's price next to the shop-wide average.

          > [!TIP]
          > Think of it as "a column that has the same value on every row". Give it an alias with `AS`
          > so the result has a friendly column name.

      - type: example
        title: Prices compared with the average
        md: |
          For the five laptops, show the price and how far it is above the shop-wide average price.
        sql: |
          SELECT
              name,
              price,
              ROUND(price - (SELECT AVG(price) FROM products), 2)
                  AS above_avg
          FROM products
          WHERE category_id = 12
          ORDER BY price;
        after: |
          The inner query still returns one value (about 193.04), and the database subtracts it from each laptop's price.
          The Terra Student Laptop 15 is 356.95 above average; the Aurora 16-inch Pro Laptop is 1306.95 above.

      - type: exercise
        id: m07-l01-e4
        title: A price index
        prompt: |
          For every product in category 8 (Phones), show `name`, `price` and a column called
          `price_index` = the product's price **divided by the average price of all products**,
          rounded to 2 decimals. Sort by `price` from highest to lowest.
        starter: |
          SELECT name, price,
              ROUND(price / (SELECT ___ FROM products), 2) AS price_index
          FROM products
          WHERE category_id = 8
          ORDER BY price DESC;
        solution: |
          SELECT name, price,
              ROUND(price / (SELECT AVG(price) FROM products), 2) AS price_index
          FROM products
          WHERE category_id = 8
          ORDER BY price DESC;
        ordered: true
        columnNames: true
        hints:
          - The subquery goes inside the division, just like a number would.
          - "Use `(SELECT AVG(price) FROM products)` as the divisor, then wrap everything in ROUND(..., 2)."
          - "SELECT name, price, ROUND(price / (SELECT AVG(price) FROM ___), 2) AS price_index FROM products WHERE category_id = 8 ORDER BY price DESC;"
        explanation: |
          A price index of 4.66 means "4.66 times the shop average" (the Lumio Phone S5 Plus); 0.05 means about a
          twentieth of it (the Screen Protector 3-Pack). A scalar subquery can sit inside any expression.
        difficulty: 2

      - type: read
        title: Subqueries in HAVING
        md: |
          Remember `HAVING` filters **groups** after `GROUP BY` (m05). A scalar subquery works there too:
          "keep only the groups whose average is above the shop-wide average".

      - type: example
        title: Categories pricier than the shop average
        sql: |
          SELECT
              category_id,
              ROUND(AVG(price), 2) AS avg_price
          FROM products
          GROUP BY category_id
          HAVING AVG(price) > (SELECT AVG(price) FROM products)
          ORDER BY category_id;
        after: |
          Only 3 of the 11 categories beat the shop-wide average of 193.04: Computers (7), Phones (8)
          and Laptops (12). The subquery on the right-hand side runs once; `HAVING` compares each group's average to it.

      - type: quiz
        id: m07-l01-q1
        question: Where is it possible to use a scalar subquery? (Choose all that apply.)
        options:
          - In the WHERE clause
          - In the SELECT list, as a column
          - In the HAVING clause
          - Only in the WHERE clause — nowhere else
        answer: [0, 1, 2]
        explanation: |
          A scalar subquery is just a value, so it can appear almost anywhere a value can: `WHERE`,
          the `SELECT` list, `HAVING`, and inside calculations.

      - type: exercise
        id: m07-l01-e5
        title: Big payments
        prompt: |
          Show the `order_id` and `amount` of every payment that is **larger than five times the average
          payment `amount`**. Sort by `amount` from highest to lowest.
        starter: |
          SELECT order_id, amount
          FROM payments
          WHERE amount > 5 * (SELECT ___ FROM payments)
          ORDER BY amount DESC;
        solution: |
          SELECT order_id, amount
          FROM payments
          WHERE amount > 5 * (SELECT AVG(amount) FROM payments)
          ORDER BY amount DESC;
        ordered: true
        hints:
          - The average payment is about 339.31. You need "5 times that".
          - "Put the subquery in parentheses and multiply it: 5 * (SELECT ...)."
          - "SELECT order_id, amount FROM payments WHERE amount > 5 * (SELECT AVG(___) FROM payments) ORDER BY amount DESC;"
        explanation: |
          Five times the average is about 1,696.55, and 9 payments are bigger — the largest is 1,982.96 for order 419.
          Spotting "unusually large" values this way is a classic data-quality and fraud-check pattern.
        difficulty: 2

      - type: exercise
        id: m07-l01-e6
        title: Categories with costly stock
        prompt: |
          Show each `category_id` and its average product `cost` rounded to 2 decimals (call it `avg_cost`),
          but only for categories whose average `cost` is **above the average `cost` of all products**.
          Sort by `category_id`.
        starter: |
          SELECT category_id, ROUND(AVG(cost), 2) AS avg_cost
          FROM products
          GROUP BY category_id
          HAVING ___
          ORDER BY category_id;
        solution: |
          SELECT category_id, ROUND(AVG(cost), 2) AS avg_cost
          FROM products
          GROUP BY category_id
          HAVING AVG(cost) > (SELECT AVG(cost) FROM products)
          ORDER BY category_id;
        ordered: true
        hints:
          - Filtering groups means HAVING, not WHERE.
          - "Compare `AVG(cost)` of the group with a subquery that averages `cost` over the whole table."
          - "HAVING AVG(cost) > (SELECT AVG(___) FROM products)"
        explanation: |
          Four categories qualify: 7 (Computers), 8 (Phones), 10 (Furniture) and 12 (Laptops).
          `WHERE` can't be used here because the average only exists *after* grouping.
        difficulty: 2

      - type: fill
        id: m07-l01-f1
        prompt: |
          Complete the query so it lists the products that are **cheaper than** the average price.
        template: |
          SELECT name, price
          FROM products
          WHERE price ___ (SELECT ___(price) FROM products);
        answers:
          - ["<"]
          - ["AVG"]
        explanation: |
          "Cheaper than" means `<`, and the shop-wide average comes from `AVG(price)`.

      - type: predict
        id: m07-l01-p2
        question: |
          There is no product called 'Time Machine'. What does this query return?
        sql: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT price
              FROM products
              WHERE name = 'Time Machine'
          );
        options:
          - "An error: the subquery found no row"
          - "All 60 products"
          - "0 rows"
          - "1 row with NULLs"
        answer: 2
        explanation: |
          A scalar subquery that finds no rows quietly becomes **NULL**. Then `price > NULL` is unknown
          for every product, so no row passes the filter. No error — just an empty result. Be careful: a typo
          in the subquery can silently give you "no results".

      - type: parsons
        id: m07-l01-o1
        prompt: |
          Put the lines in order to list products that cost more than the average price, most expensive first.
        lines:
          - SELECT name, price
          - FROM products
          - WHERE price > (SELECT AVG(price) FROM products)
          - ORDER BY price DESC;
        distractors:
          - WHERE price > SELECT AVG(price) FROM products
        explanation: |
          The subquery must be wrapped in parentheses. `ORDER BY` always comes last.

      - type: exercise
        id: m07-l01-e7
        title: In between
        prompt: |
          Show the `name` and `price` of products that cost **more than the average price** but **less than
          the price of the product called `Standing Desk 140cm`**. Use two subqueries.
        starter: |
          SELECT name, price
          FROM products
          WHERE price > (SELECT ___ FROM products)
            AND price < (SELECT ___ FROM products WHERE ___);
        solution: |
          SELECT name, price
          FROM products
          WHERE price > (SELECT AVG(price) FROM products)
            AND price < (
                SELECT price
                FROM products
                WHERE name = 'Standing Desk 140cm'
            );
        hints:
          - You need two conditions joined by AND, each with its own subquery.
          - "The upper limit is the price of one named product: `SELECT price FROM products WHERE name = 'Standing Desk 140cm'`. Product names are unique, so that's one value."
          - "WHERE price > (SELECT AVG(price) FROM products) AND price < (SELECT price FROM products WHERE name = '___')"
        explanation: |
          The Standing Desk costs 449.99, so the answer is the three products between 193.04 and 449.99:
          the 27-inch 4K Monitor, the Ergonomic Office Chair and the 10-inch Tablet Lite.
          Looking up one row by a unique name is another common way to get a single value.
        difficulty: 3
    cheatsheet:
      - title: Compare with an aggregate
        sql: |
          SELECT name, price
          FROM products
          WHERE price > (SELECT AVG(price) FROM products);
        note: "The subquery must return ONE column and at most ONE row."
      - title: Subquery as a column
        sql: |
          SELECT name,
              price - (SELECT AVG(price) FROM products) AS diff
          FROM products;
        note: "The same value is repeated on every row."
      - title: Subquery in HAVING
        sql: |
          SELECT category_id, AVG(price)
          FROM products
          GROUP BY category_id
          HAVING AVG(price) > (SELECT AVG(price) FROM products);
        note: "Zero rows from the subquery means NULL, not an error."

  - id: m07-l02
    title: IN subqueries
    summary: Build a list with one query and filter another with it — and dodge the NOT IN + NULL trap.
    minutes: 30
    steps:
      - type: read
        title: A guest list from another query
        md: |
          The procurement team asks: "Which products come from our suppliers in **Japan or Mexico**?"

          In m02 you learned `IN` with a list you type yourself, like `supplier_id IN (3, 6)`.
          But you don't remember which supplier ids belong to Japan and Mexico — and the list could change
          next month. So let the database **build the list for you** with a subquery.

          > [!ANALOGY]
          > `IN` is a bouncer with a guest list. A subquery is the person who *writes the guest list
          > just before the party starts*. The bouncer then checks every visitor's name against it.

          The inner query must return **one column** (it can return many rows). That column becomes the list.

      - type: stepper
        title: From typed list to subquery
        md: Click through the three stages and press Run in each.
        stages:
          - label: The list
            md: The inner query produces a list of supplier ids — one column, two rows.
            sql: |
              SELECT supplier_id
              FROM suppliers
              WHERE country IN ('Japan', 'Mexico');
          - label: Typed by hand
            md: |
              If we copy those two ids into `IN (...)`, we get the products. It works, but only until
              a supplier changes country.
            sql: |
              SELECT name, supplier_id
              FROM products
              WHERE supplier_id IN (3, 6)
              ORDER BY supplier_id, name;
          - label: Built by a subquery
            md: The list now builds itself, every time.
            sql: |
              SELECT name, supplier_id
              FROM products
              WHERE supplier_id IN (
                  SELECT supplier_id
                  FROM suppliers
                  WHERE country IN ('Japan', 'Mexico')
              )
              ORDER BY supplier_id, name;

      - type: example
        title: Washington customers with a returned order
        md: |
          Customer support wants to call the customers in `WA` who have had an order **returned**.
        sql: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE state = 'WA'
            AND customer_id IN (
                SELECT customer_id
                FROM orders
                WHERE status = 'returned'
            )
          ORDER BY customer_id;
        after: |
          Six customers. Customer 121 (Aarav Gupta) has **three** returned orders, so 121 appears three times
          in the inner list — but he shows up **once** in the result. `IN` only asks "is this id on the
          list?", so duplicates in the list never create duplicate rows.

      - type: exercise
        id: m07-l02-e1
        title: Disappointing products
        prompt: |
          Show the `name` of every product that has received at least one **1-star** review
          (`rating = 1` in the `reviews` table). Sort the names alphabetically.
        starter: |
          SELECT name
          FROM products
          WHERE product_id IN (
              SELECT ___
              FROM reviews
              WHERE ___
          )
          ORDER BY name;
        solution: |
          SELECT name
          FROM products
          WHERE product_id IN (
              SELECT product_id
              FROM reviews
              WHERE rating = 1
          )
          ORDER BY name;
        ordered: true
        hints:
          - The inner query should list the product ids that have a 1-star review.
          - "Inside the parentheses: `SELECT product_id FROM reviews WHERE rating = 1`."
          - "SELECT name FROM products WHERE product_id IN (SELECT product_id FROM reviews WHERE rating = ___) ORDER BY name;"
        explanation: |
          Four products have a 1-star review: Air Fryer 5L, Programmable Coffee Maker, The Beginner's Guide
          to Sourdough and Vitamin C Moisturizer. Even if one of them had five 1-star reviews, it would still
          appear only once.
        difficulty: 1

      - type: predict
        id: m07-l02-p1
        question: |
          There are 150 customers and 900 orders in total. How many rows does this return?
        sql: |
          SELECT customer_id
          FROM customers
          WHERE customer_id IN (SELECT customer_id FROM orders);
        options: ["900", "150", "140", "10"]
        answer: 2
        explanation: |
          Each customer is listed **at most once**, and only customers who appear in `orders` qualify.
          140 customers have ordered; the other 10 (ids 141 to 150) never did.

      - type: example
        title: A subquery can only hand over one column
        md: |
          What if the inner query returns two columns? `IN` wouldn't know which one to compare.
        sql: |
          SELECT first_name
          FROM customers
          WHERE customer_id IN (
              SELECT customer_id, status
              FROM orders
          );
        expectError: true
        after: |
          *subquery has too many columns*. Remove the extra column so the inner query returns **just the one**
          you are comparing against.

      - type: read
        title: NOT IN — the opposite list
        md: |
          Put `NOT` in front of `IN` and you keep the rows that are **not on the list**. This is how you find
          "things that never happened": customers who never ordered, products nobody bought...

      - type: example
        title: Customers who never ordered
        sql: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE customer_id NOT IN (
              SELECT customer_id
              FROM orders
          )
          ORDER BY customer_id;
        after: |
          Ten customers, ids 141 to 150. They all signed up in October 2024 and haven't bought anything
          yet — a perfect list for a "welcome, here's 10% off" email.

      - type: exercise
        id: m07-l02-e2
        title: Products nobody bought
        prompt: |
          Show the `product_id` and `name` of every product that has **never been ordered**
          (it never appears in `order_items`). Sort by `product_id`.
        starter: |
          SELECT product_id, name
          FROM products
          WHERE product_id ___ (SELECT ___ FROM order_items)
          ORDER BY product_id;
        solution: |
          SELECT product_id, name
          FROM products
          WHERE product_id NOT IN (SELECT product_id FROM order_items)
          ORDER BY product_id;
        ordered: true
        hints:
          - "You want the products that are NOT in the list of ordered product ids."
          - "Inner query: `SELECT product_id FROM order_items`. Outer: `product_id NOT IN (...)`."
          - "SELECT product_id, name FROM products WHERE product_id NOT IN (SELECT ___ FROM order_items) ORDER BY product_id;"
        explanation: |
          Five products have never been ordered, including the Zephyr Gaming Laptop X and the Standing Desk 140cm.
          This is safe here because `order_items.product_id` can never be NULL — but the next page shows
          why that matters.
        difficulty: 1

      - type: read
        title: The NOT IN trap (read this twice!)
        md: |
          `NOT IN` has one famous trap: **if the list contains even one NULL, `NOT IN` returns no rows at all.**

          Why? Remember from m02 that NULL means "unknown". `x NOT IN (1, NULL)` is really
          "x is not 1 **and** x is not (an unknown value)". For x = 2, the first part is true, but
          the second part is **unknown** — and `true AND unknown` is unknown. A row is kept only when the
          condition is **true**, so the row is thrown away.

          > [!MISTAKE]
          > Using `NOT IN (SELECT some_column ...)` when `some_column` can contain NULLs. You get an empty
          > result, no error, no warning — and it looks like "nothing matches". Very easy to miss!

      - type: example
        title: Try it with tiny lists
        md: |
          Four little tests. `IN` is fine with a NULL in the list; `NOT IN` is not.
        sql: |
          SELECT
              2 NOT IN (1, 3)    AS clean_list,
              2 NOT IN (1, NULL) AS list_with_null,
              1 IN (1, NULL)     AS found_anyway,
              2 IN (1, NULL)     AS not_found;
        after: |
          - `2 NOT IN (1, 3)` is **true** — as you would expect.
          - `2 NOT IN (1, NULL)` is **NULL** (unknown), not true. A WHERE clause treats that like false.
          - `1 IN (1, NULL)` is **true**: a match is a match, NULLs don't spoil it.
          - `2 IN (1, NULL)` is **NULL**, not false.

      - type: viz
        viz: null-logic
        title: Why unknown ruins NOT IN
        md: |
          Play with the truth tables. Look at what `NOT` does to an unknown, and what `AND` / `OR` do
          when one side is unknown. That is exactly what happens inside `NOT IN`.

      - type: example
        title: The trap with real data
        md: |
          The `categories` table has a `parent_id` column. Top-level categories (Electronics, Home...)
          have a NULL parent. Let's find categories that are **not a parent** of any other category.
        sql: |
          SELECT category_id, name
          FROM categories
          WHERE category_id NOT IN (
              SELECT parent_id
              FROM categories
          );
        after: |
          **0 rows** — but we know that categories like Books and Phones have no children, so the answer
          is *not* empty. The list `parent_id` contains NULLs (the 6 top-level categories), which poisons
          `NOT IN`. The next example fixes it.

      - type: example
        title: The fix — keep NULLs out of the list
        sql: |
          SELECT category_id, name
          FROM categories
          WHERE category_id NOT IN (
              SELECT parent_id
              FROM categories
              WHERE parent_id IS NOT NULL
          )
          ORDER BY category_id;
        after: |
          Now we get the **9** categories with no sub-categories: Books, Toys, Beauty, Phones, Kitchen, Furniture,
          Laptops, Peripherals and Camping. Two rules to remember: add `WHERE column IS NOT NULL` inside a
          `NOT IN` subquery — or use `NOT EXISTS`, which you meet in the next lesson.

      - type: quiz
        id: m07-l02-q1
        question: |
          The query with `NOT IN (SELECT parent_id FROM categories)` returned 0 rows. What caused it?
        options:
          - "The subquery's list contains NULL, so NOT IN can never be true"
          - "NOT IN does not work with subqueries"
          - "There are no categories without children"
          - "The query needs an ORDER BY"
        answer: 0
        explanation: |
          `parent_id` is NULL for the six top-level categories. With a NULL in the list, `NOT IN` evaluates to
          unknown for every row, so nothing passes. Filter the NULLs out (`WHERE parent_id IS NOT NULL`)
          or use `NOT EXISTS`.

      - type: predict
        id: m07-l02-p2
        question: |
          The same list (with its NULLs) is used, but now with plain `IN`. How many rows come back?
        sql: |
          SELECT category_id
          FROM categories
          WHERE category_id IN (SELECT parent_id FROM categories);
        options: ["5", "6", "0", "14"]
        answer: 0
        explanation: |
          `IN` is happy to ignore the NULLs: a match is a match. Five categories are parents of
          something: Electronics (1), Home (2), Sports (3), Computers (7) and Outdoor (11).

      - type: exercise
        id: m07-l02-e3
        title: Fix the empty result
        dataset: company
        prompt: |
          *(This exercise uses the **company** database.)* HR wants every employee who is **nobody's manager**.
          Show `emp_id`, `first_name` and `last_name`, sorted by `emp_id`. The query below returns nothing —
          fix it. (You should end up with 29 employees.)
        starter: |
          SELECT emp_id, first_name, last_name
          FROM employees
          WHERE emp_id NOT IN (
              SELECT manager_id
              FROM employees
          )
          ORDER BY emp_id;
        solution: |
          SELECT emp_id, first_name, last_name
          FROM employees
          WHERE emp_id NOT IN (
              SELECT manager_id
              FROM employees
              WHERE manager_id IS NOT NULL
          )
          ORDER BY emp_id;
        ordered: true
        hints:
          - The CEO has no manager, so `manager_id` is NULL for one row. That NULL ends up in the list.
          - Keep NULLs out of the subquery's list with a WHERE inside it.
          - "SELECT manager_id FROM employees WHERE manager_id ___ NULL"
        explanation: |
          Employees with `manager_id IS NULL` (only the CEO) put a NULL in the list. After removing it, the
          query returns the 29 people who manage nobody. Always ask: "can this column contain NULL?"
        difficulty: 2

      - type: exercise
        id: m07-l02-e4
        title: Colorado cancellations
        prompt: |
          Show `customer_id`, `first_name` and `last_name` of customers who live in `CO` **and** have at least one
          order with the status `cancelled`. Sort by `customer_id`.
        starter: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE state = 'CO'
            AND customer_id IN (___)
          ORDER BY customer_id;
        solution: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE state = 'CO'
            AND customer_id IN (
                SELECT customer_id
                FROM orders
                WHERE status = 'cancelled'
            )
          ORDER BY customer_id;
        ordered: true
        hints:
          - Combine a normal filter (state) with an IN subquery using AND.
          - "The inner query lists `customer_id`s from `orders` where the status is 'cancelled'."
          - "... AND customer_id IN (SELECT customer_id FROM orders WHERE status = '___')"
        explanation: |
          Ten Colorado customers had at least one cancelled order. You can mix ordinary conditions and subquery
          conditions freely with `AND` / `OR`.
        difficulty: 2

      - type: read
        title: Subqueries inside subqueries
        md: |
          A subquery can contain another subquery. Read them **from the inside out**, like opening
          nesting dolls: the innermost query runs first and feeds the one around it.

          Example question: "Which orders contain a **Laptop**?" The path is
          *category → products → order_items → orders*, so we use one `IN` per step.

      - type: example
        title: Orders that contain a laptop (since November 2024)
        sql: |
          SELECT order_id, order_date
          FROM orders
          WHERE order_date >= '2024-11-01'
            AND order_id IN (
                SELECT order_id
                FROM order_items
                WHERE product_id IN (
                    SELECT product_id
                    FROM products
                    WHERE category_id = 12
                )
            )
          ORDER BY order_id;
        after: |
          Eight orders. Reading inside-out: (1) the product ids in category 12 (Laptops), (2) the order ids whose
          lines use those products, (3) the orders from November 2024 on with those ids.

          > [!TIP]
          > With three levels the query gets hard to read. You already know JOINs from m06; in lesson 7 you
          > will compare both styles, and in m09 you'll meet CTEs, which make deep nesting much easier to read.

      - type: exercise
        id: m07-l02-e5
        title: Who bought the flagship laptop?
        prompt: |
          Show `customer_id`, `first_name` and `last_name` of every customer who has ever ordered the product named
          `Aurora 16-inch Pro Laptop`. Sort by `customer_id`. Use nested `IN` subqueries (no JOIN).
        starter: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE customer_id IN (
              SELECT customer_id
              FROM orders
              WHERE order_id IN (
                  SELECT order_id
                  FROM order_items
                  WHERE product_id IN (___)
              )
          )
          ORDER BY customer_id;
        solution: |
          SELECT customer_id, first_name, last_name
          FROM customers
          WHERE customer_id IN (
              SELECT customer_id
              FROM orders
              WHERE order_id IN (
                  SELECT order_id
                  FROM order_items
                  WHERE product_id IN (
                      SELECT product_id
                      FROM products
                      WHERE name = 'Aurora 16-inch Pro Laptop'
                  )
              )
          )
          ORDER BY customer_id;
        ordered: true
        hints:
          - "Work from the inside out: product → order_items → orders → customers."
          - "Innermost: `SELECT product_id FROM products WHERE name = 'Aurora 16-inch Pro Laptop'`."
          - "Each level is `column IN (SELECT column FROM next_table WHERE ...)`; the starter already has three of the four levels."
        explanation: |
          Twelve customers bought it. Four tables, four levels — that is the same path
          `customers → orders → order_items → products` that you joined in m06.
        difficulty: 3

      - type: fill
        id: m07-l02-f1
        prompt: |
          Complete the query so it lists the customers who have **written a review**.
        template: |
          SELECT first_name, last_name
          FROM customers
          WHERE customer_id ___ (
              SELECT ___
              FROM reviews
          );
        answers:
          - ["IN"]
          - ["customer_id"]
        explanation: |
          The inner query returns the `customer_id` of every review; `IN` keeps customers on that list.

      - type: exercise
        id: m07-l02-e6
        title: Ordered but never reviewed
        prompt: |
          Show the `product_id` and `name` of products that **have been ordered at least once** but have
          **never received a review**. Sort by `product_id`.
        starter: |
          SELECT product_id, name
          FROM products
          WHERE product_id IN (___)
            AND product_id NOT IN (___)
          ORDER BY product_id;
        solution: |
          SELECT product_id, name
          FROM products
          WHERE product_id IN (SELECT product_id FROM order_items)
            AND product_id NOT IN (SELECT product_id FROM reviews)
          ORDER BY product_id;
        ordered: true
        hints:
          - "You need two conditions: one `IN` (was ordered) and one `NOT IN` (has no review)."
          - "The lists come from `order_items.product_id` and `reviews.product_id`. Neither column can be NULL, so NOT IN is safe here."
          - "WHERE product_id IN (SELECT product_id FROM ___) AND product_id NOT IN (SELECT product_id FROM ___)"
        explanation: |
          Three products fit: Laptop Stand, Aluminum (12), Atlas of Hidden Cities (48) and Hydrating Face Serum (58).
          These are items customers buy but never rate — maybe a nudge email asking for reviews would help.
        difficulty: 3

      - type: parsons
        id: m07-l02-o1
        prompt: |
          Put the lines in order to list customers in `WA` who have had an order returned.
        lines:
          - SELECT first_name, last_name
          - FROM customers
          - WHERE state = 'WA'
          - AND customer_id IN (
          - SELECT customer_id FROM orders WHERE status = 'returned'
          - );
        distractors:
          - WHERE customer_id IN (
        explanation: |
          There is only one WHERE; the second condition is added with AND. The subquery sits inside the parentheses.
    cheatsheet:
      - title: IN with a subquery
        sql: |
          SELECT name
          FROM products
          WHERE supplier_id IN (
              SELECT supplier_id
              FROM suppliers
              WHERE country = 'Japan'
          );
        note: "The inner query returns ONE column; duplicates in the list don't duplicate rows."
      - title: NOT IN — safe version
        sql: |
          SELECT category_id
          FROM categories
          WHERE category_id NOT IN (
              SELECT parent_id
              FROM categories
              WHERE parent_id IS NOT NULL
          );
        note: "One NULL in the list makes NOT IN return nothing. Filter NULLs out, or use NOT EXISTS."

  - id: m07-l03
    title: EXISTS & NOT EXISTS
    summary: Ask a yes/no question for every row — "is there at least one matching row?" — and stay safe from NULLs.
    minutes: 30
    steps:
      - type: read
        title: A yes/no question for every row
        md: |
          Marketing asks: "Which customers in **Washington** placed an order **this December**?"

          With `IN` you build a *list* and check membership. `EXISTS` works differently: for each customer
          it asks a simple **yes/no question** — *"is there at least one matching row in the other table?"*
          If yes, the customer is kept.

          > [!ANALOGY]
          > Imagine a filing cabinet with one folder per order. For each customer you open the drawer and ask:
          > "Is there **at least one** folder with this customer's name on it?" You don't read the folder —
          > you only care that one exists. That's `EXISTS`.

          In database language this is called a **semi-join** (keep the rows that have a match, but don't pull in any
          columns or duplicates from the other table). Its opposite, `NOT EXISTS`, is an **anti-join**
          (keep the rows that have **no** match).

      - type: example
        title: Washington customers with a December order
        sql: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE c.state = 'WA'
            AND EXISTS (
                SELECT 1
                FROM orders o
                WHERE o.customer_id = c.customer_id
                  AND o.order_date >= '2024-12-01'
            )
          ORDER BY c.customer_id;
        after: |
          Seven customers. For each Washington customer the database asks: "is there an order with **this**
          customer's id placed on or after 1 December 2024?" Yes → keep; no → drop.

      - type: read
        title: How to read an EXISTS subquery
        md: |
          Look at the three ingredients:

          1. `EXISTS ( ... )` goes in `WHERE`, and gives **true** if the inner query returns **at least one row**.
          2. `SELECT 1` — the inner `SELECT` list is irrelevant. `EXISTS` only checks *that* a row exists, not what's in it.
             `SELECT 1` is the usual habit.
          3. `WHERE o.customer_id = c.customer_id` — the **link** between the inner query and the *current* outer row.

          The inner query uses a column from the outer query (`c.customer_id`), so it is different for each customer.
          This is called a **correlated subquery** — you'll explore it fully in lesson 4. Note the aliases
          `c` and `o`: they tell PostgreSQL which table each `customer_id` belongs to.

          > [!MISTAKE]
          > Forgetting the link. `EXISTS (SELECT 1 FROM orders)` asks "does the orders table have any rows at
          > all?" — which is true for **everyone**.

      - type: predict
        id: m07-l03-p1
        question: |
          The link is missing! How many rows does this return?
        sql: |
          SELECT customer_id
          FROM customers
          WHERE EXISTS (SELECT 1 FROM orders);
        options: ["0", "140", "150", "900"]
        answer: 2
        explanation: |
          The orders table has rows, so `EXISTS` is true for every customer and all **150** come back. Without
          `WHERE o.customer_id = c.customer_id`, the inner query doesn't depend on the customer at all.

      - type: exercise
        id: m07-l03-e1
        title: Suppliers of pricey products
        prompt: |
          Show the `name` of every supplier that supplies **at least one product priced above 300**.
          Sort by `name`. (Try it with `EXISTS`.)
        starter: |
          SELECT s.name
          FROM suppliers s
          WHERE EXISTS (
              SELECT 1
              FROM products p
              WHERE p.supplier_id = ___
                AND ___
          )
          ORDER BY s.name;
        solution: |
          SELECT s.name
          FROM suppliers s
          WHERE EXISTS (
              SELECT 1
              FROM products p
              WHERE p.supplier_id = s.supplier_id
                AND p.price > 300
          )
          ORDER BY s.name;
        ordered: true
        hints:
          - The inner query looks in `products`. It needs a link to the current supplier row and the price condition.
          - "Link: `p.supplier_id = s.supplier_id`. Extra condition: `p.price > 300`."
          - "SELECT s.name FROM suppliers s WHERE EXISTS (SELECT 1 FROM products p WHERE p.supplier_id = s.supplier_id AND p.price > ___) ORDER BY s.name;"
        explanation: |
          Three suppliers qualify: Jade River Manufacturing, Nordlys Distribution and Tanuki Goods Ltd.
          Extra conditions (like the price) go **inside** the subquery, next to the link.
        difficulty: 1

      - type: read
        title: NOT EXISTS — "has no matching row"
        md: |
          Add `NOT` and you keep only the rows for which the inner query returns **nothing**.
          It's the cleanest way to say "customers who never...", "products without any...".

      - type: example
        title: Customers who never ordered
        sql: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = c.customer_id
          )
          ORDER BY c.customer_id;
        after: |
          The same 10 customers (ids 141 to 150) that `NOT IN` found in the last lesson. For each customer the
          database looks for an order; if it finds none, the customer is kept.

      - type: exercise
        id: m07-l03-e2
        title: Fix the empty result
        prompt: |
          This query should list customers who have **never placed an order**, but it returns nothing.
          Fix it so it shows `customer_id`, `first_name` and `last_name`, sorted by `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders o
          )
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = c.customer_id
          )
          ORDER BY c.customer_id;
        ordered: true
        hints:
          - The inner query isn't connected to the customer, so it always finds orders.
          - Add a WHERE inside the subquery that matches the order's customer to the outer customer.
          - "WHERE o.customer_id = c.___"
        explanation: |
          Without the link, the orders table is never empty, so `NOT EXISTS` is false for everybody and you get zero
          rows. With the link, the inner query searches only *this customer's* orders.
        difficulty: 1

      - type: stepper
        title: Four ways to ask "who has ordered?"
        md: |
          The same question, asked four ways. The first two give 140; look closely at stage 3!
        stages:
          - label: IN
            md: Build a list of customer ids, and test membership.
            sql: |
              SELECT COUNT(*) AS customers
              FROM customers
              WHERE customer_id IN (SELECT customer_id FROM orders);
          - label: EXISTS
            md: Ask a yes/no question for every customer.
            sql: |
              SELECT COUNT(*) AS customers
              FROM customers c
              WHERE EXISTS (
                  SELECT 1
                  FROM orders o
                  WHERE o.customer_id = c.customer_id
              );
          - label: JOIN
            md: |
              A join produces **one row per matching order**, not per customer. A customer with 23 orders appears
              23 times — that's 900 rows, one per order!
            sql: |
              SELECT COUNT(*) AS rows_returned
              FROM customers c
              JOIN orders o ON o.customer_id = c.customer_id;
          - label: JOIN + DISTINCT
            md: Count distinct customers to undo the duplication.
            sql: |
              SELECT COUNT(DISTINCT c.customer_id) AS customers
              FROM customers c
              JOIN orders o ON o.customer_id = c.customer_id;

      - type: read
        title: Why NOT EXISTS is NULL-safe
        md: |
          Remember the trap: one NULL in the list ruins `NOT IN`. `EXISTS` and `NOT EXISTS` never fall into it.
          Why? `EXISTS` doesn't compare a value to a list. It only asks "did the inner query return a row?" and
          the answer is always **true or false** — never unknown.

          > [!TIP]
          > Rule of thumb: when you need "rows with **no match**", reach for **NOT EXISTS** first. It gives the right
          > answer even when NULLs are around.

      - type: example
        title: Categories with no sub-categories — safe this time
        md: |
          The very same question that gave **0 rows** with `NOT IN` in the last lesson.
        sql: |
          SELECT c.category_id, c.name
          FROM categories c
          WHERE NOT EXISTS (
              SELECT 1
              FROM categories child
              WHERE child.parent_id = c.category_id
          )
          ORDER BY c.category_id;
        after: |
          The correct **9** rows, without any `IS NOT NULL` trick. The categories table is used twice, so the
          inner copy gets its own alias, `child`. Top-level categories have a NULL `parent_id`, but `NULL = c.category_id`
          is never true, so those rows simply don't count as matches.

      - type: example
        title: A second, sneakier NOT IN problem
        md: |
          NULLs can hurt `NOT IN` on the **left** side too. Three products have no supplier (`supplier_id` is NULL).
          Question: "How many products are **not** supplied by a supplier without a contact email?"
        sql: |
          SELECT
              (SELECT COUNT(*)
               FROM products
               WHERE supplier_id NOT IN (
                   SELECT supplier_id
                   FROM suppliers
                   WHERE contact_email IS NULL
               )) AS with_not_in,
              (SELECT COUNT(*)
               FROM products p
               WHERE NOT EXISTS (
                   SELECT 1
                   FROM suppliers s
                   WHERE s.supplier_id = p.supplier_id
                     AND s.contact_email IS NULL
               )) AS with_not_exists;
        after: |
          `NOT IN` says **45**, `NOT EXISTS` says **48**. Twelve products come from suppliers without an email
          (60 − 12 = 48). `NOT IN` also drops the 3 products with a NULL `supplier_id`, because `NULL NOT IN (...)`
          is unknown. Those three do not come from an email-less supplier, so `NOT EXISTS` is right.

      - type: quiz
        id: m07-l03-q1
        question: Which statement about `EXISTS` is true?
        options:
          - "It is true as soon as the subquery returns at least one row"
          - "It compares the values returned by the subquery with a column"
          - "It can return NULL when the subquery contains NULLs"
          - "The subquery must select exactly one column"
        answer: 0
        explanation: |
          `EXISTS` only checks whether a row comes back. What the row contains (even NULL) is irrelevant, and the
          result is always true or false. That's why `SELECT 1`, `SELECT *` and `SELECT NULL` all behave the same inside it.

      - type: predict
        id: m07-l03-p2
        question: |
          The inner `SELECT` returns NULL for every row. How many customers does this return?
        sql: |
          SELECT customer_id
          FROM customers c
          WHERE EXISTS (
              SELECT NULL
              FROM orders o
              WHERE o.customer_id = c.customer_id
          );
        options: ["0", "140", "150", "An error"]
        answer: 1
        explanation: |
          `EXISTS` cares only that a **row** exists, not that its value is non-NULL. A row containing NULL is still a
          row. So the 140 customers with orders are kept.

      - type: exercise
        id: m07-l03-e3
        title: Products without reviews
        prompt: |
          Show the `product_id` and `name` of products that have **no reviews at all**.
          Use `NOT EXISTS`. Sort by `product_id`.
        starter: |
          SELECT p.product_id, p.name
          FROM products p
          WHERE NOT EXISTS (
              SELECT 1
              FROM reviews r
              WHERE ___
          )
          ORDER BY p.product_id;
        solution: |
          SELECT p.product_id, p.name
          FROM products p
          WHERE NOT EXISTS (
              SELECT 1
              FROM reviews r
              WHERE r.product_id = p.product_id
          )
          ORDER BY p.product_id;
        ordered: true
        hints:
          - It's the same shape as "customers who never ordered", with products and reviews.
          - Link the review to the current product with `r.product_id = p.product_id`.
          - "WHERE r.product_id = p.___"
        explanation: |
          Eight products have never been reviewed. Five of them were never even ordered, which explains why
          nobody reviewed them.
        difficulty: 2

      - type: exercise
        id: m07-l03-e4
        title: Unpaid orders
        prompt: |
          Finance wants a list of orders that are **not cancelled** but have **no payment** recorded.
          Show `order_id`, `order_date` and `status`, sorted by `order_id`.
        starter: |
          SELECT o.order_id, o.order_date, o.status
          FROM orders o
          WHERE o.status <> 'cancelled'
            AND NOT EXISTS (___)
          ORDER BY o.order_id;
        solution: |
          SELECT o.order_id, o.order_date, o.status
          FROM orders o
          WHERE o.status <> 'cancelled'
            AND NOT EXISTS (
                SELECT 1
                FROM payments p
                WHERE p.order_id = o.order_id
            )
          ORDER BY o.order_id;
        ordered: true
        hints:
          - You need two conditions combined with AND — one plain filter, one NOT EXISTS.
          - The subquery looks in `payments` for rows with the same `order_id`.
          - "AND NOT EXISTS (SELECT 1 FROM payments p WHERE p.order_id = o.___)"
        explanation: |
          15 orders are unpaid: 6 delivered, 6 still processing and 3 shipped. The delivered ones (like order 681 from
          October) are probably worth a call to the finance team!
        difficulty: 2

      - type: exercise
        id: m07-l03-e5
        title: Bought but never reviewed
        prompt: |
          Show `customer_id`, `first_name` and `last_name` of customers who have **placed at least one order** but have
          **never written a review**. Sort by `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE EXISTS (___)
            AND NOT EXISTS (___)
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name, c.last_name
          FROM customers c
          WHERE EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = c.customer_id
          )
          AND NOT EXISTS (
              SELECT 1
              FROM reviews r
              WHERE r.customer_id = c.customer_id
          )
          ORDER BY c.customer_id;
        ordered: true
        hints:
          - Two subqueries in the same WHERE, one positive and one negative.
          - "One looks in `orders`, the other in `reviews`; both link on `customer_id`."
          - "WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id) AND NOT EXISTS (SELECT 1 FROM ___ r WHERE r.customer_id = c.customer_id)"
        explanation: |
          25 customers ordered but never left a review. The `EXISTS` part removes the 10 customers who never ordered at
          all, so you're left with real buyers to ask for feedback.
        difficulty: 2

      - type: fill
        id: m07-l03-f1
        prompt: |
          Complete the query to list customers who have **never placed an order**.
        template: |
          SELECT c.first_name, c.last_name
          FROM customers c
          WHERE ___ EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = ___.customer_id
          );
        answers:
          - ["NOT"]
          - ["c"]
        explanation: |
          `NOT EXISTS` keeps customers with no matching order, and `c.customer_id` links the inner query to the current customer.

      - type: exercise
        id: m07-l03-e6
        title: Loved and hated
        prompt: |
          Show the `product_id` and `name` of products that have received **at least one 5-star review and at least one
          1-star review**. Sort by `product_id`.
        starter: |
          SELECT p.product_id, p.name
          FROM products p
          WHERE EXISTS (___)
            AND EXISTS (___)
          ORDER BY p.product_id;
        solution: |
          SELECT p.product_id, p.name
          FROM products p
          WHERE EXISTS (
              SELECT 1
              FROM reviews r
              WHERE r.product_id = p.product_id
                AND r.rating = 5
          )
          AND EXISTS (
              SELECT 1
              FROM reviews r
              WHERE r.product_id = p.product_id
                AND r.rating = 1
          )
          ORDER BY p.product_id;
        ordered: true
        hints:
          - "You need two separate EXISTS subqueries on the same table — one for each rating."
          - "A single review can't have rating 5 and rating 1 at once, so don't try `rating = 5 AND rating = 1` inside one subquery."
          - "WHERE EXISTS (SELECT 1 FROM reviews r WHERE r.product_id = p.product_id AND r.rating = 5) AND EXISTS (SELECT 1 FROM reviews r WHERE ... AND r.rating = ___)"
        explanation: |
          Three polarizing products: Air Fryer 5L, The Beginner's Guide to Sourdough and Vitamin C Moisturizer. Each
          `EXISTS` is its own question about the same product. This "has both A and B" pattern is hard with a plain
          `JOIN` and easy with two `EXISTS`.
        difficulty: 3

      - type: parsons
        id: m07-l03-o1
        prompt: |
          Put the lines in order to list customers who have had an order **returned**.
        lines:
          - SELECT c.first_name, c.last_name
          - FROM customers c
          - WHERE EXISTS (
          - SELECT 1 FROM orders o
          - WHERE o.customer_id = c.customer_id
          - AND o.status = 'returned'
          - );
        distractors:
          - HAVING EXISTS (
        explanation: |
          `EXISTS ( ... )` belongs in `WHERE`, not `HAVING`. The link and the extra condition are both inside the parentheses.
    cheatsheet:
      - title: EXISTS (has at least one match)
        sql: |
          SELECT c.first_name
          FROM customers c
          WHERE EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = c.customer_id
          );
        note: "The WHERE inside links the inner query to the current outer row (c)."
      - title: NOT EXISTS (has no match)
        sql: |
          SELECT c.first_name
          FROM customers c
          WHERE NOT EXISTS (
              SELECT 1
              FROM orders o
              WHERE o.customer_id = c.customer_id
          );
        note: "NULL-safe: prefer it over NOT IN when the column may contain NULLs."

  - id: m07-l04
    title: Correlated subqueries
    summary: Let the inner query peek at the current outer row, so every row gets its own answer.
    minutes: 30
    steps:
      - type: read
        title: Above average — for their own group
        md: |
          Priya is back with a sharper question:

          > "Which products cost more than the average **of their own category**?"

          A $120 air fryer is pricey for a kitchen, but a $120 laptop would be a bargain. So "average"
          can't be one number for the whole shop any more. Every product needs to be compared with the
          average of **its own category**.

          The scalar subqueries from lesson 1 can't do that: they run once and hand the **same** number
          to every row. We need an inner query that can look at the row the outer query is working on right now.
          That is a **correlated subquery**.

          > [!ANALOGY]
          > A teacher wants to know which students beat **their own class** average. She can't use one school-wide
          > number. For each student she first looks up *that student's class*, finds the class average, and
          > only then compares. The inner query is that "look up my class" step.

          You met a correlated subquery already: the `WHERE o.customer_id = c.customer_id` link inside
          `EXISTS` in the last lesson. Now we use the same idea to compute values.

      - type: example
        title: Products above their category's average
        md: |
          Run it and look at the result. Notice that it contains laptops *and* books.
        sql: |
          SELECT p.name, p.category_id, p.price
          FROM products p
          WHERE p.price > (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = p.category_id
          )
          ORDER BY p.category_id, p.price DESC;
        after: |
          **24** of the 60 products are above the average of their own category — twice as many as the 12 that
          beat the shop-wide average. A $29.99 book (*Mysteries of the Deep Sea*) is in the list because
          the average book costs only 25.99. The same query would never pick it with one shop-wide number.

      - type: read
        title: How to read a correlated subquery
        md: |
          Three things to notice in that query:

          1. **Two copies of one table.** `products p` is the *outer* row; `products p2` is the *inner* copy
             we average over. Different aliases keep them apart (you used the same trick for `categories` and `child`).
          2. **The link:** `WHERE p2.category_id = p.category_id`. The inner query uses a column of the
             **outer** row (`p.category_id`). That is what makes it *correlated*.
          3. **The inner query is different for every row.** For an Air Fryer (category 9) it averages category 9;
             for a laptop it averages category 12.

          So think of it as a loop: *for each outer row → run the inner query with that row's values →
          keep the row if the condition is true.*

          > [!NOTE]
          > The inner query can look **out** at the outer row, but the outer query can never look **in**.
          > Names like `p2` only exist inside the parentheses.

      - type: stepper
        title: Following the loop
        md: |
          Click through four stages and press Run in each. Watch how the inner average changes from row to row.
        stages:
          - label: One product
            md: Pick one row from the outer query — the Air Fryer, from category 9.
            sql: |
              SELECT name, category_id, price
              FROM products
              WHERE name = 'Air Fryer 5L';
          - label: Its inner query
            md: |
              For that row the inner query averages **category 9** only. The Air Fryer costs 119.99, which is
              more than about 81.87, so this row will be kept.
            sql: |
              SELECT AVG(price)
              FROM products
              WHERE category_id = 9;
          - label: Different rows, different averages
            md: |
              Here the correlated subquery sits in the `SELECT` list, so you can *see* the average each
              row gets. The Air Fryer, the phone and the chair beat their group; the laptop and the book do not.
            sql: |
              SELECT
                  p.name,
                  p.category_id,
                  p.price,
                  (SELECT ROUND(AVG(p2.price), 2)
                   FROM products p2
                   WHERE p2.category_id = p.category_id) AS category_avg
              FROM products p
              WHERE p.product_id IN (1, 17, 29, 33, 45)
              ORDER BY p.product_id;
          - label: Keep the winners
            md: Move the correlated subquery into `WHERE`, and only rows that beat their own group survive.
            sql: |
              SELECT p.name, p.category_id, p.price
              FROM products p
              WHERE p.price > (
                  SELECT AVG(p2.price)
                  FROM products p2
                  WHERE p2.category_id = p.category_id
              )
              ORDER BY p.category_id, p.price DESC;

      - type: exercise
        id: m07-l04-e1
        title: Costly for their category
        prompt: |
          Show the `name`, `category_id` and `cost` of every product whose `cost` is **above the average `cost`
          of its own category**. Sort by `category_id`, then `name`.
        starter: |
          SELECT p.name, p.category_id, p.cost
          FROM products p
          WHERE p.cost > (
              SELECT AVG(p2.cost)
              FROM products p2
              WHERE ___
          )
          ORDER BY p.category_id, p.name;
        solution: |
          SELECT p.name, p.category_id, p.cost
          FROM products p
          WHERE p.cost > (
              SELECT AVG(p2.cost)
              FROM products p2
              WHERE p2.category_id = p.category_id
          )
          ORDER BY p.category_id, p.name;
        ordered: true
        hints:
          - It is the same shape as the example, with `cost` instead of `price`.
          - "The link between the inner copy (`p2`) and the outer row (`p`) is their `category_id`."
          - "WHERE p2.category_id = p.___"
        explanation: |
          25 products qualify. The only thing that changed from the example is the column being averaged.
          The link `p2.category_id = p.category_id` is what turns an ordinary subquery into a correlated one.
        difficulty: 1

      - type: read
        title: A correlated subquery as a column
        md: |
          Just like a scalar subquery, a correlated one can be **a column of its own** in the `SELECT` list —
          and now each row gets its *own* value. A classic use: "next to each customer, show how many orders they placed."

      - type: example
        title: Orders per customer, without a JOIN
        sql: |
          SELECT
              c.customer_id,
              c.first_name,
              (SELECT COUNT(*)
               FROM orders o
               WHERE o.customer_id = c.customer_id) AS order_count
          FROM customers c
          WHERE c.customer_id IN (1, 2, 5, 141, 142)
          ORDER BY c.customer_id;
        after: |
          Felix has 13 orders, Owen 8 and Kenji 16. Customers 141 and 142 have **0**: when `COUNT(*)` has no rows
          to count it returns 0, not NULL. Every customer appears exactly once, which is a nice property:
          a JOIN would need `LEFT JOIN` + `GROUP BY` to get the same result.

      - type: exercise
        id: m07-l04-e2
        title: Reviews per product
        prompt: |
          For products with `product_id` 1 to 8, show `product_id`, `name` and a column called `review_count`
          with the number of reviews each product has (0 if none). Sort by `product_id`.
        starter: |
          SELECT
              p.product_id,
              p.name,
              (SELECT COUNT(*)
               FROM reviews r
               WHERE ___) AS review_count
          FROM products p
          WHERE p.product_id <= 8
          ORDER BY p.product_id;
        solution: |
          SELECT
              p.product_id,
              p.name,
              (SELECT COUNT(*)
               FROM reviews r
               WHERE r.product_id = p.product_id) AS review_count
          FROM products p
          WHERE p.product_id <= 8
          ORDER BY p.product_id;
        ordered: true
        columnNames: true
        hints:
          - Count the reviews that belong to the *current* product.
          - "Link the review to the outer product: `r.product_id = p.product_id`."
          - "(SELECT COUNT(*) FROM reviews r WHERE r.product_id = p.___) AS review_count"
        explanation: |
          The Zephyr Gaming Laptop X (id 5) has no reviews, so its count is 0 — the row is still there. The
          Nimbus Air 13 Ultrabook and the Wireless Ergonomic Mouse have 4 each.
        difficulty: 1

      - type: read
        title: The same-name trap
        md: |
          What if you leave out the aliases and write `WHERE category_id = category_id`?

          Inside the inner query, a bare name like `category_id` means **the inner table's column** — the closest
          one wins. So the condition compares the column with *itself* and is true for every row. The link
          is gone, and the inner query averages the **whole** table again.

          > [!MISTAKE]
          > Writing a "correlated" subquery without distinct aliases, such as
          > `WHERE category_id = category_id`. No error appears — you silently get the wrong answer.
          > Always alias the outer table (`p`) and the inner table (`p2`), and write `p2.category_id = p.category_id`.

      - type: predict
        id: m07-l04-p1
        question: |
          This query forgot its aliases. Earlier, the correct version returned 24 rows.
          How many rows does this one return?
        sql: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT AVG(price)
              FROM products
              WHERE category_id = category_id
          );
        options:
          - "24 — it still compares with the category average"
          - "12 — it compares with the shop-wide average"
          - "0 — a column can't equal itself"
          - "An error: ambiguous column"
        answer: 1
        explanation: |
          `category_id = category_id` is true for every inner row (no product has a NULL category), so the inner
          query averages all 60 products — about 193.04 — exactly like lesson 1. You get the same 12 rows as the
          shop-wide filter. PostgreSQL doesn't complain, because the query is perfectly legal.

      - type: exercise
        id: m07-l04-e3
        title: Fix the missing link
        prompt: |
          This query should show the `name` and `price` of products that cost more than the average price of **their own
          category** — 24 products. At the moment it returns only 12. Fix it.
        starter: |
          SELECT name, price
          FROM products
          WHERE price > (
              SELECT AVG(price)
              FROM products
              WHERE category_id = category_id
          );
        solution: |
          SELECT p.name, p.price
          FROM products p
          WHERE p.price > (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = p.category_id
          );
        hints:
          - The inner condition compares a column with itself. Give the two copies of `products` different aliases.
          - "Use `p` for the outer table and `p2` for the inner one, then link them: `p2.category_id = p.category_id`."
          - "SELECT p.name, p.price FROM products p WHERE p.price > (SELECT AVG(p2.price) FROM products p2 WHERE p2.category_id = p.___);"
        explanation: |
          Two aliases and one corrected condition — that's the whole fix. When a correlated query "works but the
          numbers look like the plain version", check the link first.
        difficulty: 2

      - type: example
        title: Each customer's latest order day
        md: |
          Correlated subqueries are great for "the latest/biggest/first **per group**". Here: orders placed on their
          customer's most recent order date. (We look at the first 12 customers only.)
        sql: |
          SELECT o.customer_id, o.order_id, o.order_date, o.status
          FROM orders o
          WHERE o.order_date = (
              SELECT MAX(o2.order_date)
              FROM orders o2
              WHERE o2.customer_id = o.customer_id
          )
            AND o.customer_id <= 12
          ORDER BY o.customer_id, o.order_id;
        after: |
          13 rows for 12 customers. Customer 9 shows up **twice**: two cancelled orders (801 and 802) were placed on
          the same day, so both share the latest date. "Latest per group" with a date can have ties — decide whether you want
          all of them or just one.

      - type: quiz
        id: m07-l04-q1
        question: What makes a subquery **correlated**?
        options:
          - "It uses a column from the outer query"
          - "It returns more than one row"
          - "It sits in the HAVING clause"
          - "It has an alias"
        answer: 0
        explanation: |
          A correlated subquery refers to the current row of the outer query (for example `p.category_id`), so it can give a different
          answer for every outer row. A subquery that doesn't mention the outer query at all is *uncorrelated* and runs once.

      - type: exercise
        id: m07-l04-e4
        title: Above their department's average pay
        dataset: company
        prompt: |
          *(This exercise uses the **company** database.)* Show the `emp_id`, `first_name`, `last_name` and `salary` of every employee who
          earns **more than the average salary of their own department** (`dept_id`). Sort by `emp_id`.
        starter: |
          SELECT e.emp_id, e.first_name, e.last_name, e.salary
          FROM employees e
          WHERE e.salary > (
              SELECT AVG(x.salary)
              FROM employees x
              WHERE ___
          )
          ORDER BY e.emp_id;
        solution: |
          SELECT e.emp_id, e.first_name, e.last_name, e.salary
          FROM employees e
          WHERE e.salary > (
              SELECT AVG(x.salary)
              FROM employees x
              WHERE x.dept_id = e.dept_id
          )
          ORDER BY e.emp_id;
        ordered: true
        hints:
          - The structure is the same as the products query. The "group" is now the department.
          - "Link the inner copy `x` to the outer row `e` through `dept_id`."
          - "WHERE x.dept_id = e.___"
        explanation: |
          20 employees earn more than their department average. The two contractors with no department (`dept_id` is NULL) can
          never appear: `NULL = NULL` is not true, so their inner query finds no rows, the average is NULL,
          and the comparison is unknown. (The department average includes the employee being tested — that is normal.)
        difficulty: 2

      - type: example
        title: The outer query can't see inside
        md: |
          Remember: names defined inside the parentheses exist only there. Try to use `p2` from outside.
        sql: |
          SELECT p.name, p2.category_id
          FROM products p
          WHERE p.price > (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = p.category_id
          );
        expectError: true
        after: |
          *missing FROM-clause entry for table "p2"*. The inner query can look **out** at `p`, but the outer
          query can't look **in** at `p2`. If you need the average in your result, put the subquery in the
          `SELECT` list (as in the stepper) or use the derived-table technique of the next lesson.

      - type: fill
        id: m07-l04-f1
        prompt: |
          Complete the query: show products that cost **less than** the average price of their own category.
        template: |
          SELECT p.name, p.price
          FROM products p
          WHERE p.price ___ (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = ___.category_id
          );
        answers:
          - ["<"]
          - ["p"]
        explanation: |
          "Less than" is `<`. The link needs the **outer** alias `p`, so each product is compared with its own category.

      - type: exercise
        id: m07-l04-e5
        title: The top earner of each department
        dataset: company
        prompt: |
          *(Company database.)* Show the `emp_id`, `first_name`, `dept_id` and `salary` of the **highest-paid employee in each
          department**. Sort by `dept_id`. (Employees with no department don't count.)
        starter: |
          SELECT e.emp_id, e.first_name, e.dept_id, e.salary
          FROM employees e
          WHERE e.salary = (
              SELECT ___(x.salary)
              FROM employees x
              WHERE x.dept_id = e.dept_id
          )
          ORDER BY e.dept_id;
        solution: |
          SELECT e.emp_id, e.first_name, e.dept_id, e.salary
          FROM employees e
          WHERE e.salary = (
              SELECT MAX(x.salary)
              FROM employees x
              WHERE x.dept_id = e.dept_id
          )
          ORDER BY e.dept_id;
        ordered: true
        hints:
          - You want each employee whose salary equals the biggest salary in their own department.
          - "Inner query: the `MAX` of `salary` over employees with the same `dept_id` as the outer row."
          - "WHERE e.salary = (SELECT MAX(x.salary) FROM employees x WHERE x.dept_id = e.___)"
        explanation: |
          Six rows — one per department (Executive, Engineering, Sales, Marketing, Finance, HR). Research has nobody. If two
          people shared a department's top salary both would appear; here the top salaries are all unique.
        difficulty: 2

      - type: read
        title: A note about speed
        md: |
          Conceptually the inner query runs once per outer row. PostgreSQL is clever and often takes shortcuts,
          but a correlated **scalar** subquery really can be re-run for each row — you can see a `SubPlan` in `EXPLAIN` (m15).

          - With 60 products or 150 customers: instant.
          - With millions of rows: it can be slow.

          > [!REAL-WORLD]
          > Analysts use correlated subqueries for quick questions on small or medium tables. For big tables
          > they switch to a JOIN against a grouped result (next lesson) or to window functions (m10), which
          > compute "per group" values in a single pass.

      - type: parsons
        id: m07-l04-o1
        prompt: |
          Put the lines in order to list products whose `cost` is above the average `cost` of their own category.
        lines:
          - SELECT p.name, p.cost
          - FROM products p
          - WHERE p.cost > (
          - SELECT AVG(p2.cost)
          - FROM products p2
          - WHERE p2.category_id = p.category_id
          - );
        distractors:
          - WHERE p2.category_id = p2.category_id
        explanation: |
          The distractor is the same-name trap: it compares the inner column with itself and removes the link to the outer row.

      - type: exercise
        id: m07-l04-e6
        title: Pricey for the shelf and nobody buys it
        prompt: |
          Show the `product_id`, `name` and `price` of products that are **priced above the average price of their own category**
          **and** have **never been ordered** (no row in `order_items`). Sort by `product_id`.
        starter: |
          SELECT p.product_id, p.name, p.price
          FROM products p
          WHERE p.price > (___)
            AND NOT EXISTS (___)
          ORDER BY p.product_id;
        solution: |
          SELECT p.product_id, p.name, p.price
          FROM products p
          WHERE p.price > (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = p.category_id
          )
            AND NOT EXISTS (
                SELECT 1
                FROM order_items oi
                WHERE oi.product_id = p.product_id
            )
          ORDER BY p.product_id;
        ordered: true
        hints:
          - Two subqueries in one WHERE, joined by AND. One compares a value, the other asks "does a row exist?".
          - "First: `p.price > (SELECT AVG(p2.price) FROM products p2 WHERE p2.category_id = p.category_id)`. Second: `NOT EXISTS` against `order_items`."
          - "AND NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.___)"
        explanation: |
          Four products are both above their category's average price and have never been ordered: the Zephyr Gaming Laptop X,
          the Standing Desk 140cm, *Mysteries of the Deep Sea* and the Science Lab Starter Kit. You just combined a correlated
          scalar subquery (this lesson) with `NOT EXISTS` (the last one).
        difficulty: 3
    cheatsheet:
      - title: Compare with the group's own average
        sql: |
          SELECT p.name, p.price
          FROM products p
          WHERE p.price > (
              SELECT AVG(p2.price)
              FROM products p2
              WHERE p2.category_id = p.category_id
          );
        note: "Different aliases (p, p2) + a link to the outer row. Never write category_id = category_id."
      - title: Per-row value in the SELECT list
        sql: |
          SELECT c.first_name,
              (SELECT COUNT(*)
               FROM orders o
               WHERE o.customer_id = c.customer_id) AS order_count
          FROM customers c;
        note: "Each row gets its own count; customers without orders get 0."
      - title: Best row per group
        sql: |
          SELECT e.first_name, e.dept_id, e.salary
          FROM employees e
          WHERE e.salary = (
              SELECT MAX(x.salary)
              FROM employees x
              WHERE x.dept_id = e.dept_id
          );
        note: "Ties return every tied row. The inner query can see the outer row, but not the other way round."

  - id: m07-l05
    title: Subqueries in FROM
    summary: Treat a query like a temporary table — and finally average an aggregate.
    minutes: 30
    steps:
      - type: read
        title: Averaging a count
        md: |
          Priya asks: "On average, **how many orders** does one of our customers place?"

          It takes two steps: **(1)** count the orders of each customer, **(2)** average those counts. Your first
          idea might be `AVG(COUNT(*))` — but SQL doesn't allow an aggregate inside another aggregate.

          The fix: run step 1 as a query, and let the outer query **use its result like a table**. A subquery in the
          `FROM` clause is called a **derived table** (some people say *inline view*): a temporary table that exists
          only while the query runs.

          > [!ANALOGY]
          > Two sheets of scratch paper. On sheet 1 you tally orders per customer. On sheet 2 you take the
          > average of the tallies. The derived table is sheet 1 — and the outer query reads it as if it were a real table.

      - type: example
        title: The nested aggregate error
        md: |
          Try the shortcut first, so you recognise the error when you meet it.
        sql: |
          SELECT AVG(COUNT(*))
          FROM orders
          GROUP BY customer_id;
        expectError: true
        after: |
          *aggregate function calls cannot be nested*. `COUNT(*)` must finish for each customer **before**
          `AVG` can look at the counts. A derived table gives you that two-level structure.

      - type: stepper
        title: Build it in layers
        md: Click through the three stages and run each one.
        stages:
          - label: The inner query
            md: |
              One row per customer with their number of orders. (We show 5 rows here; the full result
              has 140 rows — one for each customer who ordered.)
            sql: |
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
              ORDER BY customer_id
              LIMIT 5;
          - label: Wrap it in FROM
            md: |
              Put the inner query in parentheses after `FROM`, give it a name (`per_customer`),
              and average its `order_count` column.
            sql: |
              SELECT AVG(order_count)
              FROM (
                  SELECT customer_id, COUNT(*) AS order_count
                  FROM orders
                  GROUP BY customer_id
              ) AS per_customer;
          - label: Tidy up
            md: Round the result and give it a friendly name.
            sql: |
              SELECT ROUND(AVG(order_count), 2) AS avg_orders
              FROM (
                  SELECT customer_id, COUNT(*) AS order_count
                  FROM orders
                  GROUP BY customer_id
              ) AS per_customer;

      - type: read
        title: Three rules for derived tables
        md: |
          1. **Parentheses** around the subquery, and it goes after `FROM` (or after a `JOIN`).
          2. **Give it an alias** (`AS per_customer`). PostgreSQL 16 and newer let you leave it out, but older
             versions and many other databases (such as MySQL and SQL Server) insist on it — and you need the name
             to write `per_customer.order_count`.
          3. **The outer query only sees the columns the inner `SELECT` lists**, under the names it gives them.
             That is why we wrote `COUNT(*) AS order_count`.

          > [!MISTAKE]
          > Leaving a computed column without a name. An inner `COUNT(*)` is automatically called `count`; if the
          > inner query has two such columns and the outer query uses `count`, you get *column reference "count" is ambiguous*.
          > Always write `AS some_name` for every computed column in a derived table.

          > [!TIP]
          > You can also rename the columns right after the alias: `FROM (SELECT COUNT(*) FROM orders GROUP BY customer_id) AS t(n)`
          > names the single column `n`. Handy for short one-off queries.

      - type: exercise
        id: m07-l05-e1
        title: Items per order
        prompt: |
          An order contains one row in `order_items` per product. What is the **average number of order lines
          per order**? Return one number rounded to 2 decimals, with the column name `avg_items`.
        starter: |
          SELECT ROUND(AVG(item_count), 2) AS avg_items
          FROM (
              SELECT order_id, COUNT(*) AS item_count
              FROM ___
              GROUP BY ___
          ) AS per_order;
        solution: |
          SELECT ROUND(AVG(item_count), 2) AS avg_items
          FROM (
              SELECT order_id, COUNT(*) AS item_count
              FROM order_items
              GROUP BY order_id
          ) AS per_order;
        columnNames: true
        hints:
          - Layer 1 counts the lines of each order. Layer 2 averages those counts.
          - "The inner query groups `order_items` by `order_id`."
          - "FROM order_items GROUP BY order_id — the outer query then averages `item_count`."
        explanation: |
          2.55 lines per order on average. Notice the two levels: `COUNT(*)` per order inside, `AVG` of those counts outside.

      - type: predict
        id: m07-l05-p1
        question: |
          The outer query asks for a column the derived table doesn't expose. What happens?
        sql: |
          SELECT customer_id
          FROM (
              SELECT COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS t;
        options:
          - "An error: column customer_id does not exist"
          - "140 rows of customer ids"
          - "900 rows of customer ids"
          - "One row with the average"
        answer: 0
        expectError: true
        explanation: |
          The inner query *groups by* `customer_id` but doesn't **select** it, so the derived table `t` has just
          one column, `order_count`. The outer query can only use what the inner `SELECT` hands over.

      - type: example
        title: Grouping the groups — an order-count histogram
        md: |
          Once you have a derived table you can `GROUP BY` again. How many customers placed exactly 1 order, 2 orders, 3...?
        sql: |
          SELECT order_count, COUNT(*) AS customers
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS per_customer
          GROUP BY order_count
          ORDER BY order_count;
        after: |
          19 rows. The most common is **3 orders** (27 customers), then 2 orders (22 customers). Only 2 customers ordered exactly once, and at
          the far end 5 customers placed 23 orders each. First level: orders per customer; second level: customers
          per order count.

      - type: exercise
        id: m07-l05-e2
        title: Fewest and most orders
        prompt: |
          In one row, show the **smallest** and the **largest** number of orders placed by any customer who has ordered.
          Name the columns `fewest` and `most`.
        starter: |
          SELECT MIN(order_count) AS fewest, MAX(order_count) AS most
          FROM (
              ___
          ) AS per_customer;
        solution: |
          SELECT MIN(order_count) AS fewest, MAX(order_count) AS most
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS per_customer;
        columnNames: true
        hints:
          - The inner query is the same "orders per customer" table as in the stepper.
          - "Inside the parentheses: `SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id`."
          - "The outer query uses MIN(order_count) and MAX(order_count)."
        explanation: |
          Some customers ordered once, the busiest placed 23 orders. Customers with zero orders are not in
          the derived table at all, because `GROUP BY` on `orders` only creates groups for customers who appear there.
        difficulty: 1

      - type: read
        title: Filtering on a computed column
        md: |
          A derived table gives you a new power: the **outer** `WHERE` can use the inner query's aliases.
          That matters because `WHERE` runs *before* `SELECT` (remember the execution order from m03),
          so you can't write `WHERE order_count > 15` right next to `COUNT(*) AS order_count`.

          `HAVING COUNT(*) > 15` is the usual answer — but when the logic gets more complex, "compute first, filter after"
          with a derived table is easier to read.

      - type: example
        title: The busiest customers
        sql: |
          SELECT customer_id, order_count
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS per_customer
          WHERE order_count > 15
          ORDER BY order_count DESC, customer_id;
        after: |
          11 customers placed more than 15 orders. Five of them are tied at the top with 23 orders each (customers
          6, 14, 39, 44 and 64). The outer `WHERE` simply treats `order_count` as a normal column.

      - type: quiz
        id: m07-l05-q1
        question: |
          Why does `WHERE order_count > 15` work in the **outer** query but not next to `COUNT(*) AS order_count`?
        options:
          - "The inner query finishes first, so in the outer query order_count is just an ordinary column"
          - "Because COUNT runs faster inside a subquery"
          - "Because WHERE is allowed to contain aggregates only in the outer query"
          - "Because derived tables turn aliases into HAVING conditions"
        answer: 0
        explanation: |
          `WHERE` cannot see aliases defined in the `SELECT` of the *same* query. The derived table is computed
          completely first, so its columns (including `order_count`) are ordinary columns for the outer query.

      - type: read
        title: Joining a derived table
        md: |
          A derived table can also be **joined** to a normal table. In lesson 4 the correlated subquery
          recomputed the category average for every product. Here we compute **one average per category** once, then join:

          1. Inner query: `category_id` and its `avg_price` (one row per category).
          2. `JOIN` it to `products` on `category_id`.
          3. Compare each product's price with the average that came along.

          Bonus: the average is now a normal column, so you can **show** it in the result.

      - type: example
        title: Products far above their category average
        sql: |
          SELECT p.name, p.price, ROUND(cat.avg_price, 2) AS avg_price
          FROM products p
          JOIN (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          ) AS cat ON cat.category_id = p.category_id
          WHERE p.price > 1.5 * cat.avg_price
          ORDER BY p.product_id;
        after: |
          Nine products cost at least 50% more than their category's average — the 27-inch 4K Monitor (379.99) is almost four times
          the Peripherals average of 96.87. The derived table `cat` has 11 rows (one per category) and is joined like any
          other table, using an `ON` condition.

      - type: exercise
        id: m07-l05-e3
        title: More than double
        prompt: |
          Show the `name`, `price` and `avg_price` (the average price of the product's category, rounded to 2 decimals) for every
          product that costs **more than twice** its category's average price. Sort by `product_id`.
        starter: |
          SELECT p.name, p.price, ROUND(cat.avg_price, 2) AS avg_price
          FROM products p
          JOIN (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          ) AS cat ON ___
          WHERE ___
          ORDER BY p.product_id;
        solution: |
          SELECT p.name, p.price, ROUND(cat.avg_price, 2) AS avg_price
          FROM products p
          JOIN (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          ) AS cat ON cat.category_id = p.category_id
          WHERE p.price > 2 * cat.avg_price
          ORDER BY p.product_id;
        ordered: true
        columnNames: true
        hints:
          - It is the example with a stricter filter.
          - "Join on `cat.category_id = p.category_id`; \"more than twice\" means `p.price > 2 * cat.avg_price`."
          - "... ) AS cat ON cat.category_id = p.category_id WHERE p.price > ___ * cat.avg_price"
        explanation: |
          Six products are more than double their category's average: the 27-inch 4K Monitor, both Lumio phones, the Stainless Steel
          Cookware Set, the Standing Desk 140cm and the 2-Person Camping Tent.
        difficulty: 2

      - type: example
        title: Average order value
        md: |
          Shops watch one number all the time: the **average order value**. There's no `total` column, so first
          compute each order's total (level 1), then average the totals (level 2). Here we use delivered orders only.
        sql: |
          SELECT ROUND(AVG(total), 2) AS avg_order_value
          FROM (
              SELECT
                  o.order_id,
                  SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS total
              FROM orders o
              JOIN order_items oi ON oi.order_id = o.order_id
              WHERE o.status = 'delivered'
              GROUP BY o.order_id
          ) AS order_totals;
        after: |
          The average delivered order is worth **352.99**. The inner query joins two tables and groups by order,
          producing 650 totals; the outer query averages them. A plain `AVG(unit_price)` would answer a different question
          (the average price of an *item*, not of an *order*).

      - type: exercise
        id: m07-l05-e4
        title: How big are our orders?
        prompt: |
          Count how many orders have 1, 2, 3, 4 and 5 order lines. Show `item_count` (lines in the order) and `orders`
          (how many orders have that many lines). Sort by `item_count`.
        starter: |
          SELECT item_count, COUNT(*) AS orders
          FROM (
              SELECT order_id, COUNT(*) AS item_count
              FROM order_items
              GROUP BY order_id
          ) AS per_order
          ___
          ORDER BY item_count;
        solution: |
          SELECT item_count, COUNT(*) AS orders
          FROM (
              SELECT order_id, COUNT(*) AS item_count
              FROM order_items
              GROUP BY order_id
          ) AS per_order
          GROUP BY item_count
          ORDER BY item_count;
        ordered: true
        columnNames: true
        hints:
          - It's the histogram example again, with order lines instead of orders.
          - You need a second GROUP BY on the outer query — grouping by the derived column.
          - "GROUP BY item_count"
        explanation: |
          Two-line orders are the most common (264 of 900 orders), and 82 orders have the maximum of five lines.
          The shop's "typical basket" is small: 1 to 3 items in 688 of the 900 orders.
        difficulty: 2

      - type: fill
        id: m07-l05-f1
        prompt: |
          Complete the query: the average number of reviews that a reviewed product has received.
        template: |
          SELECT ROUND(AVG(review_count), 2) AS avg_reviews
          FROM (
              SELECT product_id, COUNT(*) AS ___
              FROM reviews
              GROUP BY ___
          ) AS per_product;
        answers:
          - ["review_count"]
          - ["product_id"]
        explanation: |
          The name given in the inner query (`review_count`) is the name the outer `AVG` uses. The result is 6.15 reviews per reviewed product
          (320 reviews across 52 products).

      - type: exercise
        id: m07-l05-e5
        title: Average order value per status
        prompt: |
          Show, for every order `status`, the **average order total** rounded to 2 decimals. Name the columns `status` and `avg_total`,
          and sort by `status`. An order's total is `SUM(quantity * unit_price * (1 - discount))` over its lines in `order_items`.
          Use **all** orders (every status).
        starter: |
          SELECT status, ROUND(AVG(total), 2) AS avg_total
          FROM (
              SELECT
                  o.order_id,
                  o.status,
                  SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS total
              FROM orders o
              JOIN order_items oi ON oi.order_id = o.order_id
              GROUP BY ___
          ) AS order_totals
          GROUP BY status
          ORDER BY status;
        solution: |
          SELECT status, ROUND(AVG(total), 2) AS avg_total
          FROM (
              SELECT
                  o.order_id,
                  o.status,
                  SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) AS total
              FROM orders o
              JOIN order_items oi ON oi.order_id = o.order_id
              GROUP BY o.order_id, o.status
          ) AS order_totals
          GROUP BY status
          ORDER BY status;
        ordered: true
        columnNames: true
        hints:
          - "Level 1 gives one row per order with its total and status. Level 2 groups those rows by status."
          - "In level 1 every non-aggregated column must be in GROUP BY: both `o.order_id` and `o.status`."
          - "GROUP BY o.order_id, o.status"
        explanation: |
          Delivered orders average 352.99, cancelled ones 351.88, returned 333.36, shipped 341.94 and processing 275.61. Cancelled orders are about
          as big as delivered ones, so basket size doesn't seem to explain cancellations. This is a classic **two-level aggregation**.
        difficulty: 2

      - type: parsons
        id: m07-l05-o1
        prompt: |
          Put the lines in order to find the **largest number of reviews** any single product has.
        lines:
          - SELECT MAX(review_count) AS most_reviews
          - FROM (
          - SELECT product_id, COUNT(*) AS review_count
          - FROM reviews
          - GROUP BY product_id
          - ) AS per_product;
        distractors:
          - GROUP BY review_count
        explanation: |
          The inner query counts reviews per product (the `GROUP BY product_id` belongs inside the parentheses); the outer query takes the maximum
          of those counts. The most-reviewed product has 20 reviews.

      - type: exercise
        id: m07-l05-e6
        title: Tied for the most orders
        prompt: |
          Show the `customer_id` and `order_count` of **every customer who is tied for the highest number of orders**
          (if three customers share the top count, show all three). Sort by `customer_id`.
          Hint: use `HAVING` with a scalar subquery whose `FROM` is a derived table.
        starter: |
          SELECT customer_id, COUNT(*) AS order_count
          FROM orders
          GROUP BY customer_id
          HAVING COUNT(*) = (
              SELECT ___(n)
              FROM (
                  SELECT COUNT(*) AS n
                  FROM orders
                  GROUP BY customer_id
              ) AS x
          )
          ORDER BY customer_id;
        solution: |
          SELECT customer_id, COUNT(*) AS order_count
          FROM orders
          GROUP BY customer_id
          HAVING COUNT(*) = (
              SELECT MAX(n)
              FROM (
                  SELECT COUNT(*) AS n
                  FROM orders
                  GROUP BY customer_id
              ) AS x
          )
          ORDER BY customer_id;
        ordered: true
        columnNames: true
        hints:
          - You need the largest per-customer count first — a number — and then every customer whose count equals it.
          - "The scalar subquery takes `MAX` of the counts produced by a derived table. The outer `HAVING COUNT(*) = (...)` compares each group with it."
          - "HAVING COUNT(*) = (SELECT MAX(n) FROM (SELECT COUNT(*) AS n FROM orders GROUP BY customer_id) AS x)"
        explanation: |
          Five customers are tied with 23 orders: 6, 14, 39, 44 and 64. This query uses all three subquery spots from this module:
          a scalar subquery in `HAVING`, which itself contains a derived table. Nesting like this gets hard to read — in m09 you'll
          learn CTEs, which let you name each layer and read the query top to bottom.
        difficulty: 3
    cheatsheet:
      - title: Aggregate an aggregate
        sql: |
          SELECT ROUND(AVG(order_count), 2) AS avg_orders
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS per_customer;
        note: "Inner query = first layer. Always alias the derived table and every computed column."
      - title: Filter on a computed column
        sql: |
          SELECT *
          FROM (
              SELECT customer_id, COUNT(*) AS order_count
              FROM orders
              GROUP BY customer_id
          ) AS t
          WHERE order_count > 15;
        note: "The outer WHERE sees the inner aliases as ordinary columns."
      - title: JOIN a derived table
        sql: |
          SELECT p.name, p.price, cat.avg_price
          FROM products p
          JOIN (
              SELECT category_id, AVG(price) AS avg_price
              FROM products
              GROUP BY category_id
          ) AS cat ON cat.category_id = p.category_id;
        note: "One average per group is computed once, then joined to every product."

  - id: m07-l06
    title: ANY and ALL
    summary: Compare one value with a whole set of values — "at least one" or "every one".
    minutes: 25
    steps:
      - type: read
        title: Beating at least one, or beating them all
        md: |
          Priya's next question: "Which products cost more than **every** product in our Peripherals category?"

          You could answer it with `MAX`, as in lesson 1. But SQL has a more direct way to compare one value
          with a **whole list** (a subquery that returns one column and many rows):

          - `> ALL (subquery)` — greater than **every** value in the list.
          - `> ANY (subquery)` — greater than **at least one** value in the list.

          The same works with `<`, `<=`, `>=`, `=` and `<>`.

          > [!ANALOGY]
          > A race. Beating **ALL** the runners means you beat the winner — you were the fastest. Beating **ANY** runner
          > only means you finished ahead of at least one person; beating the slowest runner is enough.

      - type: stepper
        title: ANY versus ALL on a real list
        md: |
          The list is the four Camping prices (24.99, 44.99, 89.99 and 159.99). The outer rows are the eight
          Peripherals. Run each stage and compare the row counts.
        stages:
          - label: The list
            md: The four prices that we compare with.
            sql: |
              SELECT name, price
              FROM products
              WHERE category_id = 14
              ORDER BY price;
          - label: "> ANY"
            md: |
              Greater than **at least one** Camping price. Being above the cheapest one (24.99) is enough, so
              seven of the eight Peripherals pass; only the 19.99 Desk Mat fails.
            sql: |
              SELECT name, price
              FROM products
              WHERE category_id = 13
                AND price > ANY (
                    SELECT price
                    FROM products
                    WHERE category_id = 14
                )
              ORDER BY price;
          - label: "> ALL"
            md: |
              Greater than **every** Camping price. You must beat the most expensive one (159.99), so only one product
              gets through: the 27-inch 4K Monitor.
            sql: |
              SELECT name, price
              FROM products
              WHERE category_id = 13
                AND price > ALL (
                    SELECT price
                    FROM products
                    WHERE category_id = 14
                )
              ORDER BY price;

      - type: read
        title: A cheat table
        md: |
          For ordering comparisons there is a simple translation. Say the list is the prices of one category:

          | You write | Means the same as |
          |---|---|
          | `price > ALL (list)` | `price >` the **largest** value |
          | `price > ANY (list)` | `price >` the **smallest** value |
          | `price < ALL (list)` | `price <` the **smallest** value |
          | `price < ANY (list)` | `price <` the **largest** value |

          So "beats ALL" means beating the extreme, "beats ANY" means beating the *easiest* one.

      - type: example
        title: Pricier than every Peripheral
        sql: |
          SELECT name, price
          FROM products
          WHERE price > ALL (
              SELECT price
              FROM products
              WHERE category_id = 13
          )
          ORDER BY price DESC;
        after: |
          Nine products. The most expensive Peripheral is the 27-inch 4K Monitor at 379.99, so everything above that
          price qualifies: laptops, phones, the Mini Desktop PC Cube and the Standing Desk 140cm.

      - type: exercise
        id: m07-l06-e1
        title: Pricier than all furniture
        prompt: |
          Show the `name` and `price` of every product that costs **more than every Furniture product**
          (`category_id = 10`). Sort by `price` from highest to lowest.
        starter: |
          SELECT name, price
          FROM products
          WHERE price > ___ (
              SELECT price
              FROM products
              WHERE category_id = 10
          )
          ORDER BY price DESC;
        solution: |
          SELECT name, price
          FROM products
          WHERE price > ALL (
              SELECT price
              FROM products
              WHERE category_id = 10
          )
          ORDER BY price DESC;
        ordered: true
        hints:
          - "\"Every\" is the keyword you want after the comparison sign."
          - "`> ALL (subquery)` compares with every value in the list."
          - "WHERE price > ALL (SELECT price FROM products WHERE category_id = ___)"
        explanation: |
          Eight products beat the priciest Furniture item (the Standing Desk at 449.99). Note that the Standing Desk itself is not in the
          list: it's not greater than itself.
        difficulty: 1

      - type: example
        title: ALL is a shortcut for MAX
        md: |
          Two ways to ask the same question. Both counts should agree.
        sql: |
          SELECT
              (SELECT COUNT(*)
               FROM products
               WHERE price > ALL (
                   SELECT price
                   FROM products
                   WHERE category_id = 13
               )) AS with_all,
              (SELECT COUNT(*)
               FROM products
               WHERE price > (
                   SELECT MAX(price)
                   FROM products
                   WHERE category_id = 13
               )) AS with_max;
        after: |
          Both give 9. `> ALL` reads like English, while `> (SELECT MAX(...))` is the scalar-subquery style from lesson 1.
          Use whichever you find clearer — but know both, because you'll see both in other people's code.

      - type: predict
        id: m07-l06-p1
        question: |
          Camping prices are 24.99, 44.99, 89.99 and 159.99. How many **Camping** products does this return?
        sql: |
          SELECT name
          FROM products
          WHERE category_id = 14
            AND price > ANY (
                SELECT price
                FROM products
                WHERE category_id = 14
            );
        options: ["4", "3", "1", "0"]
        answer: 1
        explanation: |
          `> ANY` means "greater than the smallest value" (24.99). Three of the four products are greater than 24.99; the
          Headlamp (24.99) is not greater than itself.

      - type: exercise
        id: m07-l06-e2
        title: Suppliers with premium products
        prompt: |
          Show the `supplier_id` and `name` of every supplier that supplies **at least one product priced above 400**.
          Write the condition as `supplier_id = ANY (subquery)`. Sort by `name`.
        starter: |
          SELECT supplier_id, name
          FROM suppliers
          WHERE supplier_id = ___ (
              SELECT supplier_id
              FROM products
              WHERE price > 400
          )
          ORDER BY name;
        solution: |
          SELECT supplier_id, name
          FROM suppliers
          WHERE supplier_id = ANY (
              SELECT supplier_id
              FROM products
              WHERE price > 400
          )
          ORDER BY name;
        ordered: true
        hints:
          - "`= ANY` means \"equal to at least one value in the list\"."
          - "Fill the blank with ANY."
          - "WHERE supplier_id = ANY (SELECT supplier_id FROM products WHERE price > ___)"
        explanation: |
          Three suppliers: Jade River Manufacturing, Nordlys Distribution and Tanuki Goods Ltd. `= ANY` does exactly what `IN` does —
          it is just another spelling.
        difficulty: 1

      - type: read
        title: IN and NOT IN in disguise
        md: |
          Two translations worth memorising:

          - `x = ANY (list)` is the same as `x IN (list)`.
          - `x <> ALL (list)` is the same as `x NOT IN (list)` — **including the NULL trap**: if the list contains a NULL, the
            result is never true.

          > [!MISTAKE]
          > Thinking `x <> ANY (list)` means "not in the list". It doesn't! `<> ANY` is true when x differs from **at least
          > one** value, which is almost always the case. `5 <> ANY (5, 6)` is true because 5 differs from 6. To say "none of
          > them", use `<> ALL` (or `NOT IN` / `NOT EXISTS`).

      - type: example
        title: The NULL trap, once more
        md: |
          Remember lesson 2? Categories that are **not a parent** of any other category, this time written with `<> ALL`.
        sql: |
          SELECT category_id, name
          FROM categories
          WHERE category_id <> ALL (
              SELECT parent_id
              FROM categories
          );
        after: |
          **0 rows** again. The list contains NULL (the top-level categories have no parent), and `x <> NULL` is unknown, so `<> ALL` can
          never be true. Add `WHERE parent_id IS NOT NULL` inside the subquery, or use `NOT EXISTS`, to get the 9 correct rows.

      - type: exercise
        id: m07-l06-e3
        title: Departments with nobody in them
        dataset: company
        prompt: |
          *(This exercise uses the **company** database.)* Show the `dept_id` and `name` of every department that has **no employees**.
          The query below returns nothing because of a NULL in the list. Fix it. (You should get one department.)
        starter: |
          SELECT dept_id, name
          FROM departments
          WHERE dept_id <> ALL (
              SELECT dept_id
              FROM employees
          );
        solution: |
          SELECT dept_id, name
          FROM departments
          WHERE dept_id <> ALL (
              SELECT dept_id
              FROM employees
              WHERE dept_id IS NOT NULL
          );
        hints:
          - Two employees have no department, so `employees.dept_id` contains NULLs.
          - Keep the NULLs out of the list with a WHERE inside the subquery.
          - "SELECT dept_id FROM employees WHERE dept_id IS ___ NULL"
        explanation: |
          Research (dept 7) is the only department without employees. The two contractors with no department put NULLs into the list
          and blocked `<> ALL`. `NOT EXISTS` would have avoided the whole problem.
        difficulty: 2

      - type: quiz
        id: m07-l06-q1
        question: Which pair of conditions always means the same thing?
        options:
          - "x = ANY (list)  and  x IN (list)"
          - "x <> ANY (list)  and  x NOT IN (list)"
          - "x > ANY (list)  and  x > the largest value of the list"
          - "x < ALL (list)  and  x < the largest value of the list"
        answer: 0
        explanation: |
          `= ANY` and `IN` are two spellings of the same test. `<> ANY` is *not* `NOT IN` (that is `<> ALL`); `> ANY` means greater than the
          **smallest** value; `< ALL` means smaller than the **smallest** value.

      - type: exercise
        id: m07-l06-e4
        title: Out-earning Marketing
        dataset: company
        prompt: |
          *(Company database.)* Show the `emp_id`, `first_name` and `salary` of every employee who earns **more than every employee in the
          Marketing department** (`dept_id = 4`). Sort by `salary` from highest to lowest.
        starter: |
          SELECT emp_id, first_name, salary
          FROM employees
          WHERE salary > ALL (
              ___
          )
          ORDER BY salary DESC;
        solution: |
          SELECT emp_id, first_name, salary
          FROM employees
          WHERE salary > ALL (
              SELECT salary
              FROM employees
              WHERE dept_id = 4
          )
          ORDER BY salary DESC;
        ordered: true
        hints:
          - The list is the salaries of everyone in department 4.
          - "Inner query: `SELECT salary FROM employees WHERE dept_id = 4`."
          - "WHERE salary > ALL (SELECT salary FROM employees WHERE dept_id = ___)"
        explanation: |
          Four people out-earn the best-paid Marketing employee (the VP of Marketing, 225,000): the CEO and the VPs of Engineering, Sales
          and Finance. The VP of Marketing is not in the list either: nobody is greater than themselves.
        difficulty: 2

      - type: read
        title: The empty-list surprise
        md: |
          What if the list is **empty** (the subquery finds no rows)?

          - `> ALL (empty list)` is **true** — "greater than every value" is satisfied when there are no values to beat.
          - `> ANY (empty list)` is **false** — there is no value to beat.

          Compare this with lesson 1: a scalar subquery such as `price > (SELECT MAX(price) ...)` over no rows gives NULL and **no** results. With `ALL`, a typo in
          the subquery's filter returns **everything**.

          > [!WARNING]
          > Use `ALL` only when you are sure the list can't be empty — or add an `EXISTS` check, as you will see below.

      - type: predict
        id: m07-l06-p2
        question: |
          There is no category with id 99, so the subquery finds no rows. How many of the 60 products does this return?
        sql: |
          SELECT name
          FROM products
          WHERE price > ALL (
              SELECT price
              FROM products
              WHERE category_id = 99
          );
        options: ["0", "60", "1", "An error"]
        answer: 1
        explanation: |
          With an empty list `> ALL` is true for every row, so all 60 products are returned. The `MAX` version of the same query
          would return 0 rows, because `MAX` of nothing is NULL.

      - type: example
        title: Better than all your reports?
        dataset: company
        md: |
          *(Company database.)* "Which employees earn more than **all of their direct reports**?" Employees with *no* reports have an empty list.
          Run the query and compare the two numbers.
        sql: |
          SELECT
              (SELECT COUNT(*)
               FROM employees e
               WHERE e.salary > ALL (
                   SELECT r.salary
                   FROM employees r
                   WHERE r.manager_id = e.emp_id
               )) AS count_with_all_only,
              (SELECT COUNT(*)
               FROM employees e
               WHERE EXISTS (
                   SELECT 1
                   FROM employees r
                   WHERE r.manager_id = e.emp_id
               )
               AND e.salary > ALL (
                   SELECT r.salary
                   FROM employees r
                   WHERE r.manager_id = e.emp_id
               )) AS managers_only;
        after: |
          The first count is **54** of the 55 employees — the 29 people without reports are counted because "all of nothing" is true. The second count
          is **25**: real managers who out-earn every report. Adding `EXISTS` to guard against the empty list fixes the surprise.

      - type: exercise
        id: m07-l06-e5
        title: Pricey enough to rival a laptop
        prompt: |
          Show the `name` and `price` of every product that is **not a laptop** (`category_id` is not 12) but costs **more than at least
          one laptop**. Sort by `price`.
        starter: |
          SELECT name, price
          FROM products
          WHERE category_id <> 12
            AND price > ___ (
                SELECT price
                FROM products
                WHERE category_id = 12
            )
          ORDER BY price;
        solution: |
          SELECT name, price
          FROM products
          WHERE category_id <> 12
            AND price > ANY (
                SELECT price
                FROM products
                WHERE category_id = 12
            )
          ORDER BY price;
        ordered: true
        hints:
          - "\"At least one\" is the keyword you need."
          - "`> ANY` beats at least one value in the list — so it only needs to beat the cheapest laptop (549.99)."
          - "AND price > ANY (SELECT price FROM products WHERE category_id = ___)"
        explanation: |
          Three non-laptops cost more than the cheapest laptop (the Terra Student Laptop 15 at 549.99): the Mini Desktop PC Cube, the Lumio Phone S5
          and the Lumio Phone S5 Plus. With `> ALL` the answer would be empty, because nothing beats the 1,499.99 Aurora 16-inch Pro.
        difficulty: 2

      - type: example
        title: Preview — ANY with a list of patterns
        md: |
          *(A small preview of arrays, which you will study properly in m16.)* `ANY` also works with a typed list in `ARRAY[...]`.
          That makes it possible to test several `LIKE` patterns at once.
        sql: |
          SELECT name
          FROM products
          WHERE name LIKE ANY (ARRAY['Lumio%', 'Aurora%'])
          ORDER BY product_id;
        after: |
          Four products: the two Aurora laptops and the two Lumio phones. `LIKE ANY (...)` means "matches at least one of the patterns" — a
          tidy alternative to `name LIKE 'Lumio%' OR name LIKE 'Aurora%'`.

      - type: parsons
        id: m07-l06-o1
        prompt: |
          Put the lines in order to list products that cost **more than every** Peripherals product (`category_id = 13`).
        lines:
          - SELECT name, price
          - FROM products
          - WHERE price > ALL (
          - SELECT price
          - FROM products
          - WHERE category_id = 13
          - );
        distractors:
          - WHERE price > ANY (
        explanation: |
          `ALL` means "every value in the list"; `ANY` would only require beating the cheapest Peripheral.

      - type: exercise
        id: m07-l06-e6
        title: Paid less than your own report
        dataset: company
        prompt: |
          *(Company database.)* Show `emp_id`, `first_name`, `last_name` and `salary` of every employee who earns **less than at least
          one of their direct reports** (someone whose `manager_id` equals the employee's `emp_id`). Sort by `emp_id`.
        starter: |
          SELECT e.emp_id, e.first_name, e.last_name, e.salary
          FROM employees e
          WHERE e.salary < ___ (
              SELECT r.salary
              FROM employees r
              WHERE ___
          )
          ORDER BY e.emp_id;
        solution: |
          SELECT e.emp_id, e.first_name, e.last_name, e.salary
          FROM employees e
          WHERE e.salary < ANY (
              SELECT r.salary
              FROM employees r
              WHERE r.manager_id = e.emp_id
          )
          ORDER BY e.emp_id;
        ordered: true
        hints:
          - "This one is correlated: the list changes for every employee `e` — it holds the salaries of the people who report to `e`."
          - "\"Less than at least one\" is `< ANY`. The link is `r.manager_id = e.emp_id`."
          - "WHERE e.salary < ANY (SELECT r.salary FROM employees r WHERE r.manager_id = e.___)"
        explanation: |
          Exactly one person: Mei Nakamura, a Sales Team Lead earning 118,000, who has a report paid more. Unlike `> ALL`, the `< ANY` test is
          false on an empty list, so employees without reports are safely left out — no `EXISTS` guard is needed here.
        difficulty: 3
    cheatsheet:
      - title: Greater than every value
        sql: |
          SELECT name, price
          FROM products
          WHERE price > ALL (
              SELECT price
              FROM products
              WHERE category_id = 13
          );
        note: "> ALL = bigger than the maximum. An EMPTY list makes ALL true for every row!"
      - title: Greater than at least one value
        sql: |
          SELECT name, price
          FROM products
          WHERE price > ANY (
              SELECT price
              FROM products
              WHERE category_id = 14
          );
        note: "> ANY = bigger than the minimum. = ANY is the same as IN."
      - title: NOT IN as ALL
        sql: |
          SELECT category_id
          FROM categories
          WHERE category_id <> ALL (
              SELECT parent_id
              FROM categories
              WHERE parent_id IS NOT NULL
          );
        note: "<> ALL = NOT IN, with the same NULL trap. <> ANY is something else entirely."

  - id: m07-l07
    title: Subquery or JOIN?
    summary: Translate between subqueries and JOINs, spot the differences, and pick the clearer tool.
    minutes: 30
    steps:
      - type: read
        title: Same question, two spellings
        md: |
          A teammate rewrites your subquery as a JOIN. The rewritten query runs, the numbers look
          *almost* right — but the row count has changed. Who is right?

          Good news: most subqueries have a **JOIN twin** and the other way round. Even better news: you
          already know both halves. This lesson teaches you to:

          1. **translate** between the two forms,
          2. **spot the traps** (duplicates, NULLs, lost rows),
          3. **choose** the one that is clearer for the question at hand.

          > [!ANALOGY]
          > Two routes to the same shop. A JOIN is walking *through* the other table and bringing its columns back with you.
          > `EXISTS` or `IN` is phoning the shop to ask "do you have it?" and getting a yes or a no — you learn the answer, but you
          > bring nothing back.

      - type: example
        title: Semi-join as a JOIN — with duplicates
        md: |
          Customers in `WA` who have a returned order. In lesson 2 we wrote this with `IN` and got **6 customers**.
          Here is the JOIN version. Count the rows.
        sql: |
          SELECT c.customer_id, c.first_name, c.last_name, o.order_id
          FROM customers c
          JOIN orders o ON o.customer_id = c.customer_id
          WHERE c.state = 'WA'
            AND o.status = 'returned'
          ORDER BY c.customer_id, o.order_id;
        after: |
          **8 rows** for 6 customers. A JOIN returns one row per *matching pair*, and Aarav Gupta (121) has three returned orders, so he
          appears three times. `IN` and `EXISTS` only ask "is there a match?" — they never duplicate the customer.

      - type: example
        title: Making the JOIN behave
        md: |
          Remove the order column and add `DISTINCT` to collapse the duplicates.
        sql: |
          SELECT DISTINCT c.customer_id, c.first_name, c.last_name
          FROM customers c
          JOIN orders o ON o.customer_id = c.customer_id
          WHERE c.state = 'WA'
            AND o.status = 'returned'
          ORDER BY c.customer_id;
        after: |
          Now it's the same 6 customers as the `IN` and `EXISTS` versions. Rule of thumb: **a JOIN twin of IN/EXISTS needs `DISTINCT`**
          (or a `GROUP BY`) unless the match is guaranteed to be one-to-one.

      - type: exercise
        id: m07-l07-e1
        title: Categories with a premium product
        prompt: |
          Show the `category_id` and `name` of every category that contains **at least one product priced above 400**.
          Write it as a **JOIN** (categories to products) and remove duplicates with `DISTINCT`. Sort by `category_id`.
        starter: |
          SELECT DISTINCT c.category_id, c.name
          FROM categories c
          JOIN products p ON ___
          WHERE ___
          ORDER BY c.category_id;
        solution: |
          SELECT DISTINCT c.category_id, c.name
          FROM categories c
          JOIN products p ON p.category_id = c.category_id
          WHERE p.price > 400
          ORDER BY c.category_id;
        ordered: true
        hints:
          - Join categories to their products, then filter the products by price.
          - "The join condition is `p.category_id = c.category_id`; the filter is `p.price > 400`."
          - "JOIN products p ON p.category_id = c.category_id WHERE p.price > ___"
        explanation: |
          Four categories: Computers, Phones, Furniture and Laptops. Without `DISTINCT`, Phones would appear twice (two phones cost more
          than 400) and Laptops five times.
        difficulty: 1

      - type: predict
        id: m07-l07-p1
        question: |
          14 customers in `TX` have written at least one 5-star review; between them they wrote 25 five-star reviews.
          How many rows does this JOIN return?
        sql: |
          SELECT c.customer_id
          FROM customers c
          JOIN reviews r ON r.customer_id = c.customer_id
          WHERE c.state = 'TX'
            AND r.rating = 5;
        options: ["14", "25", "21", "136"]
        answer: 1
        explanation: |
          A JOIN gives one row per matching *review*: 25 rows. The 14 customers are repeated according to how many 5-star
          reviews each wrote. `WHERE customer_id IN (...)` or `DISTINCT` would give 14.

      - type: exercise
        id: m07-l07-e2
        title: Fix the repeated suppliers
        prompt: |
          This query should list each supplier that supplies **at least one product priced above 300** — three suppliers — but it
          returns 10 rows with repeated names. Fix it so it returns only the 3 names (column `name`).
        starter: |
          SELECT s.name
          FROM suppliers s
          JOIN products p ON p.supplier_id = s.supplier_id
          WHERE p.price > 300;
        solution: |
          SELECT DISTINCT s.name
          FROM suppliers s
          JOIN products p ON p.supplier_id = s.supplier_id
          WHERE p.price > 300;
        hints:
          - Each pricey product creates one row for its supplier.
          - "Either add DISTINCT, or rewrite it with EXISTS — both give 3 rows."
          - "SELECT ___ s.name FROM suppliers s JOIN products p ON ..."
        explanation: |
          Jade River Manufacturing has four pricey products, Tanuki Goods five and Nordlys one — 10 joined rows, 3 suppliers.
          `DISTINCT` collapses them; an `EXISTS` version would never create the duplicates in the first place.
        difficulty: 1

      - type: read
        title: "\"Never\" has three spellings"
        md: |
          Finding rows with **no match** (the anti-join) can be written three ways:

          - `NOT IN (subquery)` — short, but breaks with NULLs.
          - `NOT EXISTS (correlated subquery)` — NULL-safe.
          - `LEFT JOIN ... WHERE other.id IS NULL` — NULL-safe, uses only the JOIN skills of m06.

          Run all three and compare.

      - type: stepper
        title: Customers who never ordered — three ways
        md: Each stage returns the same 10 customers (ids 141 to 150).
        stages:
          - label: NOT IN
            md: A list of customers with orders, then "not on the list".
            sql: |
              SELECT customer_id, first_name
              FROM customers
              WHERE customer_id NOT IN (
                  SELECT customer_id
                  FROM orders
              )
              ORDER BY customer_id;
          - label: NOT EXISTS
            md: For each customer, "is there no order?"
            sql: |
              SELECT c.customer_id, c.first_name
              FROM customers c
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM orders o
                  WHERE o.customer_id = c.customer_id
              )
              ORDER BY c.customer_id;
          - label: LEFT JOIN
            md: |
              Keep every customer, attach orders where they exist, and keep the rows where the order side is
              NULL — meaning no match was found.
            sql: |
              SELECT c.customer_id, c.first_name
              FROM customers c
              LEFT JOIN orders o ON o.customer_id = c.customer_id
              WHERE o.order_id IS NULL
              ORDER BY c.customer_id;

      - type: read
        title: Which of the three?
        md: |
          All three agree here, but they are not equal in general:

          - **NOT EXISTS** and **LEFT JOIN ... IS NULL** are the safe choices. PostgreSQL usually runs both as the same kind
            of "anti join".
          - **NOT IN** answers differently when the list contains NULL (you saw it return nothing), and
            PostgreSQL often cannot optimise it as well on big tables.

          > [!TIP]
          > Speed rarely decides this on small data. Write the version you and your teammates can read most easily, check the
          > row count, and only investigate speed with `EXPLAIN` (m15) when a query is actually slow.

      - type: exercise
        id: m07-l07-e3
        title: Never ordered, the JOIN way
        prompt: |
          Show the `product_id` and `name` of every product that has **never been ordered** (no row in `order_items`).
          Write it with a **LEFT JOIN** and `IS NULL`. Sort by `product_id`.
        starter: |
          SELECT p.product_id, p.name
          FROM products p
          LEFT JOIN order_items oi ON ___
          WHERE ___
          ORDER BY p.product_id;
        solution: |
          SELECT p.product_id, p.name
          FROM products p
          LEFT JOIN order_items oi ON oi.product_id = p.product_id
          WHERE oi.order_item_id IS NULL
          ORDER BY p.product_id;
        ordered: true
        hints:
          - Keep all products, attach their order lines, then keep the rows where no order line was found.
          - "Join on `oi.product_id = p.product_id`; test a column of `oi` that can't be NULL when a match exists, such as `oi.order_item_id`."
          - "LEFT JOIN order_items oi ON oi.product_id = p.product_id WHERE oi.order_item_id IS ___"
        explanation: |
          The same 5 products that `NOT IN` found in lesson 2. Test a column from the *right-hand* table for `IS NULL`; a column from `p`
          would be filled in for every row and tell you nothing.
        difficulty: 2

      - type: fill
        id: m07-l07-f1
        prompt: |
          Complete the anti-join: customers who have **never placed an order**, written with a LEFT JOIN.
        template: |
          SELECT c.customer_id, c.first_name
          FROM customers c
          LEFT ___ orders o ON o.customer_id = c.customer_id
          WHERE o.order_id ___ NULL;
        answers:
          - ["JOIN"]
          - ["IS"]
        explanation: |
          `LEFT JOIN` keeps every customer; `o.order_id IS NULL` keeps only those for whom no order was found. Remember: `= NULL` never works, you need `IS NULL`.

      - type: example
        title: A per-row count, JOIN style
        md: |
          In lesson 4 you counted orders per customer with a correlated subquery in `SELECT`. The JOIN twin uses `LEFT JOIN` + `GROUP BY`.
          Compare with the earlier result: Felix 13, Owen 8, Kenji 16 and zero for customers 141 and 142.
        sql: |
          SELECT
              c.customer_id,
              c.first_name,
              COUNT(o.order_id) AS order_count
          FROM customers c
          LEFT JOIN orders o ON o.customer_id = c.customer_id
          WHERE c.customer_id IN (1, 2, 5, 141, 142)
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        after: |
          The same numbers. Two details make it correct: `LEFT JOIN` (so customers without orders survive) and `COUNT(o.order_id)` instead
          of `COUNT(*)` — `COUNT(*)` would count the single NULL-filled row and report 1 instead of 0.

      - type: exercise
        id: m07-l07-e4
        title: Products per category — with the empty ones
        prompt: |
          Show every category's `category_id`, `name` and `product_count` (the number of products in it, **0** for categories with none).
          Use a **LEFT JOIN** with `GROUP BY`. Sort by `category_id`.
        starter: |
          SELECT c.category_id, c.name, COUNT(___) AS product_count
          FROM categories c
          LEFT JOIN products p ON p.category_id = c.category_id
          GROUP BY c.category_id, c.name
          ORDER BY c.category_id;
        solution: |
          SELECT c.category_id, c.name, COUNT(p.product_id) AS product_count
          FROM categories c
          LEFT JOIN products p ON p.category_id = c.category_id
          GROUP BY c.category_id, c.name
          ORDER BY c.category_id;
        ordered: true
        columnNames: true
        hints:
          - Count a column of the *products* side, so unmatched categories count as 0.
          - "`COUNT(*)` would count 1 for a category without products. Use `COUNT(p.product_id)`."
          - "COUNT(p.___) AS product_count"
        explanation: |
          14 rows. Electronics, Home and Sports are top-level departments with no products of their own, so they show 0.
          A correlated subquery `(SELECT COUNT(*) FROM products p WHERE p.category_id = c.category_id)` would give the same table.
        difficulty: 2

      - type: read
        title: What a subquery can't do
        md: |
          A subquery in `WHERE` can **filter**, but it can't **bring columns back**. Tables that appear only inside the
          parentheses are invisible to the outer query.

          > [!MISTAKE]
          > Asking for `c.first_name` in the outer `SELECT` while `customers c` only appears inside an `IN (...)` subquery.
          > If you need columns from the other table in your result, that table belongs in a `JOIN`.

      - type: example
        title: The column that isn't there
        sql: |
          SELECT o.order_id, c.first_name
          FROM orders o
          WHERE o.customer_id IN (
              SELECT c.customer_id
              FROM customers c
              WHERE c.state = 'WA'
          );
        expectError: true
        after: |
          *missing FROM-clause entry for table "c"*. The alias `c` lives only inside the subquery. Put `customers c` in a
          `JOIN` to show `first_name` — and keep the state filter in the outer `WHERE`.

      - type: exercise
        id: m07-l07-e5
        title: Who made the big payments?
        prompt: |
          Show `order_id`, `first_name`, `last_name` and `amount` for every payment larger than **five times the average
          payment amount**, with the name of the customer who placed the order. Sort by `amount` from highest to lowest.
          Mix tools: JOINs for the names, a scalar subquery for the average.
        starter: |
          SELECT o.order_id, c.first_name, c.last_name, p.amount
          FROM payments p
          JOIN orders o ON o.order_id = p.order_id
          JOIN customers c ON ___
          WHERE p.amount > 5 * (SELECT ___ FROM payments)
          ORDER BY p.amount DESC;
        solution: |
          SELECT o.order_id, c.first_name, c.last_name, p.amount
          FROM payments p
          JOIN orders o ON o.order_id = p.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          WHERE p.amount > 5 * (SELECT AVG(amount) FROM payments)
          ORDER BY p.amount DESC;
        ordered: true
        hints:
          - "Path: payments → orders → customers. The average comes from a separate, small subquery."
          - "Join customers with `c.customer_id = o.customer_id`, and use `5 * (SELECT AVG(amount) FROM payments)` in WHERE."
          - "JOIN customers c ON c.customer_id = o.customer_id WHERE p.amount > 5 * (SELECT AVG(___) FROM payments)"
        explanation: |
          Nine payments qualify; the biggest is 1,982.96 for order 419 (Javier Oliveira). You used both tools in one query: JOINs to
          *bring back* names, a subquery to compute *one number*. That is how real queries are usually built.
        difficulty: 2

      - type: read
        title: A simple decision guide
        md: |
          Start from the **question**, not from the syntax:

          | You need... | Reach for |
          |---|---|
          | Only to keep rows that have (or lack) a match somewhere else | `EXISTS` / `NOT EXISTS` (or `IN`) |
          | Columns from the other table in the result | `JOIN` |
          | A comparison with one number, such as the average | a scalar subquery |
          | An aggregate of an aggregate, or a filter on a computed column | a subquery in `FROM` |
          | A comparison with a whole set of values | `ANY` / `ALL` |
          | "Rows with no match" | `NOT EXISTS` or `LEFT JOIN ... IS NULL` — avoid `NOT IN` unless the list can't contain NULL |

          > [!REAL-WORLD]
          > In code reviews people ask two things: "does it return the right rows?" and "can I read it in one go?". When subqueries are
          > nested more than two levels deep, the usual fix is a CTE (m09) — a subquery with a name, written at the top of the query.

      - type: quiz
        id: m07-l07-q1
        question: |
          The marketing team wants a list of customers who have at least one returned order, **showing each customer's email**
          and nothing from the orders table. Which approach is the cleanest?
        options:
          - "WHERE EXISTS (a correlated subquery on orders) — it keeps each customer once and brings no duplicates"
          - "An INNER JOIN without DISTINCT — it's simpler"
          - "NOT IN with a subquery on orders"
          - "ALL with a subquery on orders"
        answer: 0
        explanation: |
          You only need to know *whether* a returned order exists, so `EXISTS` (or `IN`) is ideal: no duplicates, and the email comes
          from the customers table you are already in. A JOIN works only if you add `DISTINCT`; `NOT IN` would find customers
          *without* returned orders.

      - type: parsons
        id: m07-l07-o1
        prompt: |
          Put the lines in order: customers with a returned order, as a JOIN that returns each customer only once.
        lines:
          - SELECT DISTINCT c.customer_id, c.first_name
          - FROM customers c
          - JOIN orders o ON o.customer_id = c.customer_id
          - WHERE o.status = 'returned'
          - ORDER BY c.customer_id;
        distractors:
          - GROUP BY o.status
        explanation: |
          `DISTINCT` after `SELECT` removes the repeats caused by customers with several returned orders. A `GROUP BY o.status` would be a
          different (and invalid) query.

      - type: read
        title: A subquery inside a JOIN condition
        md: |
          Subqueries can sit almost anywhere a value or a table can: also inside the `ON` of a join. This is useful with `LEFT JOIN`:
          if you put the filter in `ON`, rows from the left table that have no match **survive** (with NULLs); if you put the
          same filter in `WHERE`, they are thrown away. You met this trap in m06.

          > [!WARNING]
          > With a `LEFT JOIN`, a filter on the right-hand table belongs in `ON` when you want to keep the unmatched left rows.
          > In `WHERE` it silently turns the LEFT JOIN into an INNER JOIN.

      - type: exercise
        id: m07-l07-e6
        title: Premium products per category — zeros included
        prompt: |
          For **every** category show its `name` and `pricey_products`: how many of its products cost **more than the average price of
          all products**. Categories with none must appear with `0`. Sort by `category_id`.
          (Use `LEFT JOIN`, put the price test in the `ON` clause, and use a scalar subquery for the average.)
        starter: |
          SELECT c.name, COUNT(p.product_id) AS pricey_products
          FROM categories c
          LEFT JOIN products p
              ON p.category_id = c.category_id
             AND ___
          GROUP BY c.category_id, c.name
          ORDER BY c.category_id;
        solution: |
          SELECT c.name, COUNT(p.product_id) AS pricey_products
          FROM categories c
          LEFT JOIN products p
              ON p.category_id = c.category_id
             AND p.price > (SELECT AVG(price) FROM products)
          GROUP BY c.category_id, c.name
          ORDER BY c.category_id;
        ordered: true
        columnNames: true
        hints:
          - The price test has to live in the ON clause (not WHERE), otherwise categories without pricey products vanish.
          - "Add it to ON with AND: compare `p.price` with the scalar subquery that averages all prices."
          - "AND p.price > (SELECT AVG(___) FROM products)"
        explanation: |
          All 14 categories appear: Laptops has 5 premium products, Computers, Phones and Furniture have 2 each, Peripherals 1, and the rest 0. If you move the
          price test to `WHERE`, only 5 categories remain — the zeros are lost.
        difficulty: 3
    cheatsheet:
      - title: IN / EXISTS as a JOIN
        sql: |
          SELECT DISTINCT c.customer_id, c.first_name
          FROM customers c
          JOIN orders o ON o.customer_id = c.customer_id
          WHERE o.status = 'returned';
        note: "A JOIN gives one row per match, so add DISTINCT. EXISTS never duplicates."
      - title: Anti-join, three spellings
        sql: |
          -- NOT EXISTS (NULL-safe)
          WHERE NOT EXISTS (
              SELECT 1 FROM orders o
              WHERE o.customer_id = c.customer_id)

          -- LEFT JOIN (NULL-safe)
          LEFT JOIN orders o ON o.customer_id = c.customer_id
          WHERE o.order_id IS NULL
        note: "NOT IN is the odd one out: one NULL in the list and it returns nothing."
      - title: Which tool?
        sql: |
          -- columns from the other table  -> JOIN
          -- only "does a match exist?"    -> EXISTS / IN
          -- compare with one number       -> scalar subquery
          -- aggregate of an aggregate     -> subquery in FROM
        note: "Check the row count whenever you rewrite one form as the other."

testPool:
  - type: quiz
    id: m07-t01
    lesson: m07-l01
    difficulty: 1
    question: What does a scalar subquery return?
    options:
      - One value (one row and one column)
      - A list of many values
      - A whole table
      - Always a number
    answer: 0
    explanation: Scalar means a single value; it can be a number, text, a date...

  - type: exercise
    id: m07-t02
    lesson: m07-l01
    difficulty: 1
    prompt: |
      Show the `name` and `stock_qty` of every product that has **more units in stock than the average** `stock_qty`
      of all products. Use a subquery for the average.
    starter: |
      SELECT name, stock_qty
      FROM products
      WHERE stock_qty > (SELECT ___ FROM products);
    solution: |
      SELECT name, stock_qty
      FROM products
      WHERE stock_qty > (SELECT AVG(stock_qty) FROM products);
    hints:
      - You need the average of one column, calculated by an inner query in parentheses.
      - "The inner query is `SELECT AVG(stock_qty) FROM products`."
      - "WHERE stock_qty > (SELECT AVG(___) FROM products)"
    explanation: |
      The inner query returns one number (about 180.92) and the outer query keeps the 25 products above it.

  - type: predict
    id: m07-t03
    lesson: m07-l01
    difficulty: 2
    question: |
      The `orders` table has 900 rows. What does the `total` column show in the 3 rows this query returns?
    sql: |
      SELECT order_id, (SELECT COUNT(*) FROM orders) AS total
      FROM orders
      WHERE order_id <= 3;
    options: ["3 in every row", "900 in every row", "1, 2 and 3", "An error"]
    answer: 1
    explanation: |
      The subquery in the `SELECT` list does not look at the outer row, so it counts **all** 900 orders and gives
      the same single value to each of the 3 rows. The outer `WHERE` only decides which rows are shown.

  - type: exercise
    id: m07-t04
    lesson: m07-l01
    difficulty: 3
    prompt: |
      A product's **margin** is `price - cost`. Show each `category_id` with its average margin rounded to 2 decimals
      (call it `avg_margin`), but only for categories whose average margin is **above the average margin of all
      products**. Sort by `category_id`.
    starter: |
      SELECT category_id, ROUND(AVG(price - cost), 2) AS avg_margin
      FROM products
      GROUP BY category_id
      HAVING AVG(price - cost) > (___)
      ORDER BY category_id;
    solution: |
      SELECT category_id, ROUND(AVG(price - cost), 2) AS avg_margin
      FROM products
      GROUP BY category_id
      HAVING AVG(price - cost) > (SELECT AVG(price - cost) FROM products)
      ORDER BY category_id;
    ordered: true
    columnNames: true
    hints:
      - A condition on a group's average belongs in HAVING, not WHERE.
      - The inner query averages the margin of **all** products, with no GROUP BY.
      - "HAVING AVG(price - cost) > (SELECT AVG(___ - ___) FROM products)"
    explanation: |
      Three categories qualify: Computers (7), Phones (8) and Laptops (12). The shop-wide average margin is about 81.03,
      and the subquery computes it for you.

  - type: exercise
    id: m07-t05
    lesson: m07-l02
    difficulty: 1
    prompt: |
      Show the `customer_id` and `first_name` of every customer who has placed at least one order with the
      discount code `BLACKFRIDAY`. Use `IN` with a subquery on `orders`. Sort by `customer_id`.
    starter: |
      SELECT customer_id, first_name
      FROM customers
      WHERE customer_id IN (SELECT ___ FROM orders WHERE ___)
      ORDER BY customer_id;
    solution: |
      SELECT customer_id, first_name
      FROM customers
      WHERE customer_id IN (
          SELECT customer_id
          FROM orders
          WHERE discount_code = 'BLACKFRIDAY'
      )
      ORDER BY customer_id;
    ordered: true
    hints:
      - The inner query should return a list of customer ids taken from the orders.
      - "Inner query: `SELECT customer_id FROM orders WHERE discount_code = 'BLACKFRIDAY'`."
      - "WHERE customer_id IN (SELECT customer_id FROM orders WHERE discount_code = '___')"
    explanation: |
      24 customers used the code. A customer with several Black Friday orders still appears only once, because `IN` just
      asks "is this id in the list?".

  - type: quiz
    id: m07-t06
    lesson: m07-l02
    difficulty: 2
    question: |
      A subquery returns the list `3, 7, NULL`. What does `5 NOT IN (3, 7, NULL)` evaluate to?
    options:
      - "TRUE, because 5 is not 3 and not 7"
      - "FALSE, because the list contains a NULL"
      - "NULL (unknown), so a WHERE clause would drop the row"
      - "An error, because lists cannot hold NULL"
    answer: 2
    explanation: |
      `5 NOT IN (3, 7, NULL)` means `5 <> 3 AND 5 <> 7 AND 5 <> NULL`. The first two are TRUE, the last one is unknown
      (NULL), and TRUE AND TRUE AND NULL is NULL. `WHERE` keeps only TRUE rows, so nothing passes. That is the NOT IN trap.

  - type: predict
    id: m07-t07
    lesson: m07-l02
    difficulty: 2
    question: |
      There are 150 customers. The 102 returned orders were placed by 73 different customers, and `orders.customer_id`
      never contains NULL. How many rows does this query return?
    sql: |
      SELECT customer_id
      FROM customers
      WHERE customer_id NOT IN (
          SELECT customer_id
          FROM orders
          WHERE status = 'returned'
      );
    options: ["48", "73", "77", "0"]
    answer: 2
    explanation: |
      The inner list holds 73 different customer ids (repeats do not matter) and has no NULL, so `NOT IN` works normally.
      That leaves 150 - 73 = 77 customers, including the 10 who never ordered at all.

  - type: parsons
    id: m07-t08
    lesson: m07-l02
    difficulty: 2
    prompt: |
      Put the lines in order to list the suppliers that supply **no product priced above 300**, using a `NOT IN`
      that is safe against NULLs (some products have no supplier).
    lines:
      - SELECT supplier_id, name
      - FROM suppliers
      - WHERE supplier_id NOT IN (
      - SELECT supplier_id
      - FROM products
      - WHERE price > 300
      - AND supplier_id IS NOT NULL
      - )
      - ORDER BY supplier_id;
    distractors:
      - AND supplier_id = NULL
    explanation: |
      `products.supplier_id` can be NULL, so the inner query filters those rows out with `IS NOT NULL`. Writing
      `= NULL` would never be true, so it cannot do the job. The result: 5 suppliers.

  - type: exercise
    id: m07-t09
    lesson: m07-l03
    difficulty: 1
    prompt: |
      Show the `category_id` and `name` of every category that contains **at least one inactive product**
      (`is_active = false`). Use `EXISTS`. Sort by `category_id`.
    starter: |
      SELECT c.category_id, c.name
      FROM categories c
      WHERE EXISTS (
          SELECT 1
          FROM products p
          WHERE ___
      )
      ORDER BY c.category_id;
    solution: |
      SELECT c.category_id, c.name
      FROM categories c
      WHERE EXISTS (
          SELECT 1
          FROM products p
          WHERE p.category_id = c.category_id
            AND p.is_active = false
      )
      ORDER BY c.category_id;
    ordered: true
    hints:
      - The inner query must be linked to the current category and also check the product's status.
      - "Link with `p.category_id = c.category_id`, then add `AND p.is_active = false`."
      - "WHERE p.category_id = c.___ AND p.is_active = ___"
    explanation: |
      Four categories have a discontinued product: Toys, Phones, Furniture and Peripherals. `EXISTS` only asks "is there at
      least one?", so a category with two inactive products would still appear once.

  - type: fill
    id: m07-t10
    lesson: m07-l03
    difficulty: 1
    prompt: |
      Complete the query to list the products that have been **reviewed at least once**.
    template: |
      SELECT p.name
      FROM products p
      WHERE ___ (
          SELECT 1
          FROM reviews r
          WHERE r.product_id = p.___
      );
    answers:
      - ["EXISTS"]
      - ["product_id"]
    explanation: |
      `EXISTS` keeps a product when the inner query finds at least one review. The link `r.product_id = p.product_id`
      makes the inner query look only at that product's reviews. 52 of the 60 products qualify.

  - type: exercise
    id: m07-t11
    lesson: m07-l03
    difficulty: 3
    prompt: |
      Show `customer_id`, `first_name` and `last_name` of customers who have bought at least one **Laptops** product
      (`category_id = 12`) but have **never** bought a **Peripherals** product (`category_id = 13`). Any order counts,
      whatever its status. Sort by `customer_id`.
    starter: |
      SELECT c.customer_id, c.first_name, c.last_name
      FROM customers c
      WHERE EXISTS (___)
        AND NOT EXISTS (___)
      ORDER BY c.customer_id;
    solution: |
      SELECT c.customer_id, c.first_name, c.last_name
      FROM customers c
      WHERE EXISTS (
          SELECT 1
          FROM orders o
          JOIN order_items oi ON oi.order_id = o.order_id
          JOIN products p ON p.product_id = oi.product_id
          WHERE o.customer_id = c.customer_id
            AND p.category_id = 12
      )
        AND NOT EXISTS (
          SELECT 1
          FROM orders o
          JOIN order_items oi ON oi.order_id = o.order_id
          JOIN products p ON p.product_id = oi.product_id
          WHERE o.customer_id = c.customer_id
            AND p.category_id = 13
      )
      ORDER BY c.customer_id;
    ordered: true
    hints:
      - Two yes/no questions about each customer, joined by AND. Both need orders, order lines and products.
      - Inside each subquery, join orders to order_items to products, then link back with `o.customer_id = c.customer_id`.
      - "EXISTS (SELECT 1 FROM orders o JOIN order_items oi ON ... JOIN products p ON ... WHERE o.customer_id = c.customer_id AND p.category_id = 12)"
    explanation: |
      Eight customers qualify. A subquery can contain joins: only the link to the outer row (`c`) matters. The second
      subquery is identical except for `category_id = 13` and the `NOT`.

  - type: quiz
    id: m07-t12
    lesson: m07-l03
    difficulty: 1
    question: |
      In this query, what decides whether a customer row is kept?
    sql: |
      SELECT c.first_name
      FROM customers c
      WHERE EXISTS (
          SELECT 1
          FROM orders o
          WHERE o.customer_id = c.customer_id
      );
    options:
      - The number 1 is compared with the customer's id
      - Whether the customer has exactly one order
      - Whether the inner query finds at least one order for that customer
      - Whether the customer has more orders than average
    answer: 2
    explanation: |
      `EXISTS` only checks whether the inner query returns any row for the current customer. What the inner `SELECT`
      lists (here `1`) does not matter, and the number of matching orders does not matter either: one is enough.

  - type: exercise
    id: m07-t13
    lesson: m07-l04
    difficulty: 2
    prompt: |
      For every product in category 8 (Phones), show its `name`, `price` and `cheaper_in_category`: the number of
      products **in the same category** that have a lower price. Use a correlated subquery in the `SELECT` list.
      Sort by `price`.
    starter: |
      SELECT
          p.name,
          p.price,
          (
              SELECT COUNT(*)
              FROM products x
              WHERE ___
          ) AS cheaper_in_category
      FROM products p
      WHERE p.category_id = 8
      ORDER BY p.price;
    solution: |
      SELECT
          p.name,
          p.price,
          (
              SELECT COUNT(*)
              FROM products x
              WHERE x.category_id = p.category_id
                AND x.price < p.price
          ) AS cheaper_in_category
      FROM products p
      WHERE p.category_id = 8
      ORDER BY p.price;
    ordered: true
    columnNames: true
    hints:
      - The inner query counts products. It needs two conditions linking it to the current outer product.
      - Same category as `p`, and a price lower than `p.price`.
      - "WHERE x.category_id = p.category_id AND x.price < p.___"
    explanation: |
      The cheapest phone gets 0 and the most expensive gets 7 (the category has 8 products). The count is recalculated for
      every outer row, because the inner query uses `p.price` and `p.category_id`.

  - type: exercise
    id: m07-t14
    lesson: m07-l04
    difficulty: 3
    dataset: company
    prompt: |
      *(This exercise uses the **company** database.)* Show `emp_id`, `first_name`, `salary` and `manager_salary`
      (the salary of that employee's own manager) for every employee who **earns more than their manager**.
      Use a correlated subquery.
    starter: |
      SELECT
          e.emp_id,
          e.first_name,
          e.salary,
          (
              SELECT m.salary
              FROM employees m
              WHERE ___
          ) AS manager_salary
      FROM employees e
      WHERE e.salary > (
          SELECT m.salary
          FROM employees m
          WHERE ___
      );
    solution: |
      SELECT
          e.emp_id,
          e.first_name,
          e.salary,
          (
              SELECT m.salary
              FROM employees m
              WHERE m.emp_id = e.manager_id
          ) AS manager_salary
      FROM employees e
      WHERE e.salary > (
          SELECT m.salary
          FROM employees m
          WHERE m.emp_id = e.manager_id
      );
    columnNames: true
    hints:
      - Each employee has a `manager_id`, which is the `emp_id` of another row in the same table.
      - The inner query looks up the row `m` whose `emp_id` equals the outer employee's `manager_id`.
      - "WHERE m.emp_id = e.___"
    explanation: |
      Only one employee earns more than their manager: Jia Kang (135,000 against 118,000). The CEO has no manager, so the
      subquery returns NULL for them and the comparison is never TRUE.

  - type: predict
    id: m07-t15
    lesson: m07-l04
    difficulty: 2
    question: |
      The 14 categories contain this many products, biggest first: 8, 8, 8, 7, 6, 5, 5, 4, 3, 3, 3, 0, 0, 0.
      How many rows does this query return?
    sql: |
      SELECT c.name
      FROM categories c
      WHERE (
          SELECT COUNT(*)
          FROM products p
          WHERE p.category_id = c.category_id
      ) >= 5;
    options: ["3", "7", "11", "14"]
    answer: 1
    explanation: |
      For each category the inner query counts that category's own products. Seven categories reach 5 or more
      (8, 8, 8, 7, 6, 5, 5). Without the link `p.category_id = c.category_id` every category would see all 60 products,
      and all 14 rows would come back.

  - type: parsons
    id: m07-t16
    lesson: m07-l04
    difficulty: 3
    prompt: |
      Put the lines in order to list the reviews whose `rating` is **below the average rating of the same product**.
    lines:
      - SELECT r.review_id, r.product_id, r.rating
      - FROM reviews r
      - WHERE r.rating < (
      - SELECT AVG(r2.rating)
      - FROM reviews r2
      - WHERE r2.product_id = r.product_id
      - )
      - ORDER BY r.review_id;
    distractors:
      - WHERE r2.product_id <> r.product_id
    explanation: |
      The inner query averages the ratings of the **same** product as the current outer review (`=`). With `<>` it would
      average every other product instead, which answers a different question.

  - type: fill
    id: m07-t17
    lesson: m07-l05
    difficulty: 2
    prompt: |
      Complete the query: the **average number of payments per order**, counting only orders that have at least one
      payment, rounded to 2 decimals.
    template: |
      SELECT ROUND(___(payment_count), 2) AS avg_payments
      FROM (
          SELECT order_id, COUNT(*) AS payment_count
          FROM payments
          GROUP BY ___
      ) AS per_order;
    answers:
      - ["AVG"]
      - ["order_id"]
    explanation: |
      The inner query makes one row per paid order with its number of payments; the outer query averages that column.
      The answer is 1.03: 778 payments spread over 758 orders (a few orders were paid in two payments).

  - type: exercise
    id: m07-t18
    lesson: m07-l05
    difficulty: 3
    prompt: |
      For each `state`, show the **average number of orders per customer**, counting only customers who have placed at
      least one order. Show `state` and `avg_orders` (rounded to 2 decimals), sorted by `state`.
    starter: |
      SELECT c.state, ROUND(AVG(t.order_count), 2) AS avg_orders
      FROM customers c
      JOIN (
          ___
      ) AS t ON t.customer_id = c.customer_id
      GROUP BY c.state
      ORDER BY c.state;
    solution: |
      SELECT c.state, ROUND(AVG(t.order_count), 2) AS avg_orders
      FROM customers c
      JOIN (
          SELECT customer_id, COUNT(*) AS order_count
          FROM orders
          GROUP BY customer_id
      ) AS t ON t.customer_id = c.customer_id
      GROUP BY c.state
      ORDER BY c.state;
    ordered: true
    columnNames: true
    hints:
      - First count the orders of each customer (one row per customer), then group those counts by state.
      - "The derived table is `SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id`. Join it to `customers`."
      - "JOIN (SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY ___) AS t ON t.customer_id = c.customer_id"
    explanation: |
      12 rows, from FL (3.83) to CO (10.09). A derived table lets you aggregate twice: first per customer, then per state.
      Because it is an inner join, the 10 customers who never ordered are not part of the averages.

  - type: quiz
    id: m07-t19
    lesson: m07-l05
    difficulty: 2
    question: |
      This query should list the customers with **more than 10 orders**. Which condition goes in the outer `WHERE`?

      ```sql
      SELECT t.customer_id, t.n
      FROM (
          SELECT customer_id, COUNT(*) AS n
          FROM orders
          GROUP BY customer_id
      ) AS t
      WHERE ...;
      ```
    options:
      - COUNT(*) > 10
      - t.n > 10
      - orders > 10
      - HAVING t.n > 10
    answer: 1
    explanation: |
      From the outside, the derived table `t` is an ordinary table with the columns `customer_id` and `n`, so a plain
      `WHERE t.n > 10` works (22 customers). `COUNT(*)` is not allowed in `WHERE`, `orders` is not a column of `t`, and
      `HAVING` cannot be written in the middle of a `WHERE`.

  - type: exercise
    id: m07-t20
    lesson: m07-l06
    difficulty: 2
    prompt: |
      Show the `name` and `price` of every product that is **cheaper than every product in the Kitchen category**
      (`category_id = 9`). Use `ALL`. Sort by `price` from highest to lowest, then by `name`.
    starter: |
      SELECT name, price
      FROM products
      WHERE price < ___ (
          SELECT price
          FROM products
          WHERE category_id = 9
      )
      ORDER BY price DESC, name;
    solution: |
      SELECT name, price
      FROM products
      WHERE price < ALL (
          SELECT price
          FROM products
          WHERE category_id = 9
      )
      ORDER BY price DESC, name;
    ordered: true
    hints:
      - "\"Cheaper than every one\" means cheaper than the cheapest Kitchen product."
      - "Put `ALL` between the comparison and the parentheses: `price < ALL (subquery)`."
      - "WHERE price < ___ (SELECT price FROM products WHERE category_id = 9)"
    explanation: |
      14 products are cheaper than the cheapest Kitchen item (29.99). `price < ALL (...)` is the same as
      `price < (SELECT MIN(price) ...)`. The Kitchen products themselves are not included, since none is cheaper than itself.

  - type: quiz
    id: m07-t21
    lesson: m07-l06
    difficulty: 2
    question: |
      Which condition always gives the same rows as `price < ANY (SELECT price FROM products WHERE category_id = 9)`
      (assuming the subquery returns at least one row)?
    options:
      - price < (SELECT MIN(price) FROM products WHERE category_id = 9)
      - price < (SELECT MAX(price) FROM products WHERE category_id = 9)
      - price < (SELECT AVG(price) FROM products WHERE category_id = 9)
      - price < ALL (SELECT price FROM products WHERE category_id = 9)
    answer: 1
    explanation: |
      `< ANY` means "less than at least one value in the list". If a price is below the **largest** Kitchen price, it is
      below at least one of them. `< ALL` would be the same as `< MIN`, because the price must beat every value.

  - type: fill
    id: m07-t22
    lesson: m07-l06
    difficulty: 2
    prompt: |
      Complete the query to list the customers who have **never written a review**.
    template: |
      SELECT customer_id, first_name
      FROM customers
      WHERE customer_id ___ ___ (
          SELECT customer_id
          FROM reviews
      );
    answers:
      - ["<>", "!="]
      - ["ALL"]
    explanation: |
      `<> ALL (list)` means "different from every value in the list", which is the same idea as `NOT IN`. 35 customers
      have no review. It is safe here because `reviews.customer_id` never contains NULL; with a NULL in the list,
      `<> ALL` would return nothing, just like `NOT IN`.

  - type: exercise
    id: m07-t23
    lesson: m07-l07
    difficulty: 3
    prompt: |
      For each `state`, count the customers who have **at least one returned order** (a customer with several returned
      orders is counted once). Show `state` and `customers`, sorted by `customers` from highest to lowest, then by `state`.
    starter: |
      SELECT c.state, COUNT(*) AS customers
      FROM customers c
      WHERE EXISTS (___)
      GROUP BY c.state
      ORDER BY customers DESC, c.state;
    solution: |
      SELECT c.state, COUNT(*) AS customers
      FROM customers c
      WHERE EXISTS (
          SELECT 1
          FROM orders o
          WHERE o.customer_id = c.customer_id
            AND o.status = 'returned'
      )
      GROUP BY c.state
      ORDER BY customers DESC, c.state;
    ordered: true
    columnNames: true
    hints:
      - First decide which customers qualify (EXISTS), then group the qualifying customers by state.
      - "With a JOIN you would count `COUNT(DISTINCT c.customer_id)`; with `EXISTS` a plain `COUNT(*)` is enough."
      - "WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id AND o.status = '___')"
    explanation: |
      California leads with 19 customers, then Texas (11) and New York (10). `EXISTS` keeps each customer once, so
      `COUNT(*)` is correct. A JOIN with `COUNT(*)` would count returned orders instead (26 for California).

  - type: quiz
    id: m07-t24
    lesson: m07-l07
    difficulty: 2
    question: |
      Query A joins `customers` to `orders` and keeps `o.status = 'cancelled'`. Query B selects customers with
      `WHERE EXISTS (...)` on cancelled orders. A returns 127 rows and B returns 75 rows. Why?
    options:
      - B ignores customers that have more than one cancelled order
      - A also includes customers who have no cancelled order
      - A returns one row per cancelled order, B returns one row per customer
      - EXISTS removes rows whose customer_id is NULL
    answer: 2
    explanation: |
      A JOIN produces one result row for every matching pair, so a customer with three cancelled orders appears three
      times (127 cancelled orders in total). `EXISTS` only asks whether at least one exists, so each of the 75 customers
      appears once. Use the JOIN when you need columns from `orders`, and `EXISTS` when you only need the customers.

  - type: predict
    id: m07-t25
    lesson: m07-l07
    difficulty: 3
    question: |
      There are 150 customers and 900 orders. Ten customers have never ordered, and every order belongs to a customer.
      How many rows does this query return?
    sql: |
      SELECT c.customer_id, o.order_id
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.customer_id;
    options: ["150", "900", "910", "1050"]
    answer: 2
    explanation: |
      Each of the 900 orders matches exactly one customer, giving 900 rows. The 10 customers without orders are kept by
      the `LEFT JOIN`, each as one extra row with a NULL `order_id`. Total: 900 + 10 = 910.

project:
  id: m07-proj
  title: Product Performance Review
  icon: "📈"
  dataset: shop
  md: |
    It is early January 2025 and ShopSmart holds its yearly **product review meeting** tomorrow morning. Three
    colleagues each need a list from you:

    - **Priya** (marketing) wants to know where the money is.
    - **Marcus** (warehouse) wants to know what is gathering dust on the shelves.
    - **Dana** (customer care) wants to know which products are letting customers down.

    You are the analyst who prepares the lists tonight. The tasks build on each other: a list you build early on
    becomes a piece of a bigger query later.

    You will use everything from this module: scalar subqueries, `IN`, `NOT EXISTS`, subqueries in `FROM`, and `ALL`.
    Run each query and check the row count before you move on.

    > [!TIP]
    > Build big queries from the inside out. Run the inner query on its own first, check that it returns what you expect,
    > and only then wrap it in the outer query.
  tasks:
    - type: exercise
      id: m07-proj-1
      title: Priya's list — the premium line-up
      prompt: |
        Priya wants the premium line-up. Show the `name`, `price` and `margin` (the `price` minus the `cost`) of every
        product priced **above the average price** of all products. Sort by `margin` from highest to lowest.
      starter: |
        SELECT name, price, price - cost AS margin
        FROM products
        WHERE price > (___)
        ORDER BY margin DESC;
      solution: |
        SELECT name, price, price - cost AS margin
        FROM products
        WHERE price > (SELECT AVG(price) FROM products)
        ORDER BY margin DESC;
      ordered: true
      columnNames: true
      hints:
        - You need one number first (the average price), and the outer query compares each product with it.
        - "The inner query is `SELECT AVG(price) FROM products`. Wrap it in parentheses after `price >`."
        - "SELECT name, price, price - cost AS margin FROM products WHERE price > (SELECT AVG(___) FROM products) ORDER BY margin DESC;"
      explanation: |
        12 products cost more than the average of about 193.04. The Nimbus Air 13 Ultrabook earns the most per sale
        (a margin of 564.44). The subquery keeps the list correct even when prices change.
      difficulty: 1

    - type: exercise
      id: m07-proj-2
      title: Marcus's list — premium, but nobody buys it
      prompt: |
        Marcus is worried about expensive stock that does not sell. Among the premium products from task 1
        (price above the average price of all products), find those that have **never been ordered**: they have no row
        in `order_items`. Show `name`, `price` and `stock_qty`, sorted by `name`.
      starter: |
        SELECT p.name, p.price, p.stock_qty
        FROM products p
        WHERE p.price > (___)
          AND NOT EXISTS (___)
        ORDER BY p.name;
      solution: |
        SELECT p.name, p.price, p.stock_qty
        FROM products p
        WHERE p.price > (SELECT AVG(price) FROM products)
          AND NOT EXISTS (
              SELECT 1
              FROM order_items oi
              WHERE oi.product_id = p.product_id
          )
        ORDER BY p.name;
      ordered: true
      hints:
        - Keep the premium condition from task 1 and add a second condition with AND.
        - "\"Never ordered\" is a job for `NOT EXISTS` on `order_items`, linked with `oi.product_id = p.product_id`."
        - "AND NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.___)"
      explanation: |
        Two premium products have never sold: the Standing Desk 140cm (42 units in stock) and the Zephyr Gaming Laptop X
        (8 units). `NOT EXISTS` is the NULL-safe way to say "no matching row". `NOT IN` would also work here, because
        `order_items.product_id` never contains NULL.
      difficulty: 2

    - type: exercise
      id: m07-proj-3
      title: Dana's list — the rating watch-list
      prompt: |
        Dana wants products that customers are not happy with. Show the `name`, `review_count` (number of reviews) and
        `avg_rating` (average rating rounded to 2 decimals) of products that have **at least 5 reviews** and whose
        average rating is **below the average rating of all reviews**. Sort by `avg_rating` (lowest first), then by `name`.
      starter: |
        SELECT
            p.name,
            COUNT(*) AS review_count,
            ROUND(AVG(r.rating), 2) AS avg_rating
        FROM reviews r
        JOIN products p ON p.product_id = r.product_id
        GROUP BY p.product_id, p.name
        HAVING COUNT(*) >= 5
           AND AVG(r.rating) < (___)
        ORDER BY avg_rating, p.name;
      solution: |
        SELECT
            p.name,
            COUNT(*) AS review_count,
            ROUND(AVG(r.rating), 2) AS avg_rating
        FROM reviews r
        JOIN products p ON p.product_id = r.product_id
        GROUP BY p.product_id, p.name
        HAVING COUNT(*) >= 5
           AND AVG(r.rating) < (SELECT AVG(rating) FROM reviews)
        ORDER BY avg_rating, p.name;
      ordered: true
      columnNames: true
      hints:
        - A condition on a group's average belongs in HAVING, and the number to compare with comes from a subquery.
        - "The overall average rating is `SELECT AVG(rating) FROM reviews` (about 4.07)."
        - "HAVING COUNT(*) >= 5 AND AVG(r.rating) < (SELECT AVG(___) FROM reviews)"
      explanation: |
        13 products are on the watch-list. The worst is *The Beginner's Guide to Sourdough* with an average of 2.78 from
        9 reviews. Notice the scalar subquery inside `HAVING`: it is computed once, over all reviews, not per group.
      difficulty: 2

    - type: exercise
      id: m07-proj-4
      title: Priya's list — the best sellers
      prompt: |
        Priya also wants the best sellers. A product's **units sold** is the total `quantity` over all its `order_items`
        rows (every order counts, whatever its status). Show the `name` and `units_sold` of products whose units sold
        is **above the average units sold per ordered product**. Sort by `units_sold` from highest to lowest, then by `name`.
      starter: |
        SELECT p.name, SUM(oi.quantity) AS units_sold
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
        GROUP BY p.product_id, p.name
        HAVING SUM(oi.quantity) > (
            ___
        )
        ORDER BY units_sold DESC, p.name;
      solution: |
        SELECT p.name, SUM(oi.quantity) AS units_sold
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
        GROUP BY p.product_id, p.name
        HAVING SUM(oi.quantity) > (
            SELECT AVG(units)
            FROM (
                SELECT SUM(quantity) AS units
                FROM order_items
                GROUP BY product_id
            ) AS per_product
        )
        ORDER BY units_sold DESC, p.name;
      ordered: true
      columnNames: true
      hints:
        - You need the average of a sum. That is an aggregate of an aggregate, so use a subquery in FROM.
        - "Derived table: `SELECT SUM(quantity) AS units FROM order_items GROUP BY product_id`. Average its `units` column."
        - "HAVING SUM(oi.quantity) > (SELECT AVG(units) FROM (SELECT SUM(quantity) AS units FROM order_items GROUP BY ___) AS per_product)"
      explanation: |
        17 products beat the average of about 62.3 units per ordered product. *Vitamin C Moisturizer* leads with 220.
        The subquery inside `HAVING` contains its own derived table: three levels of query, each doing one small job.
      difficulty: 3

    - type: exercise
      id: m07-proj-5
      title: Dana's nightmare — popular but unloved
      prompt: |
        The worst case for Dana: products that sell a lot **and** have bad ratings. Show the `name` and `units_sold` of
        products that are on **both** lists: the best sellers from task 4 (units sold above the average per ordered
        product) **and** the watch-list from task 3 (at least 5 reviews, average rating below the average rating of all
        reviews). Sort by `units_sold` from highest to lowest, then by `name`.
      starter: |
        SELECT p.name, SUM(oi.quantity) AS units_sold
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
        WHERE p.product_id IN (
            ___
        )
        GROUP BY p.product_id, p.name
        HAVING SUM(oi.quantity) > (
            ___
        )
        ORDER BY units_sold DESC, p.name;
      solution: |
        SELECT p.name, SUM(oi.quantity) AS units_sold
        FROM order_items oi
        JOIN products p ON p.product_id = oi.product_id
        WHERE p.product_id IN (
            SELECT product_id
            FROM reviews
            GROUP BY product_id
            HAVING COUNT(*) >= 5
               AND AVG(rating) < (SELECT AVG(rating) FROM reviews)
        )
        GROUP BY p.product_id, p.name
        HAVING SUM(oi.quantity) > (
            SELECT AVG(units)
            FROM (
                SELECT SUM(quantity) AS units
                FROM order_items
                GROUP BY product_id
            ) AS per_product
        )
        ORDER BY units_sold DESC, p.name;
      ordered: true
      columnNames: true
      hints:
        - Reuse task 4 for the `HAVING` part, and turn the watch-list from task 3 into an `IN` list of product ids.
        - "The watch-list subquery returns only `product_id`: `SELECT product_id FROM reviews GROUP BY product_id HAVING ...`."
        - "WHERE p.product_id IN (SELECT product_id FROM reviews GROUP BY product_id HAVING COUNT(*) >= 5 AND AVG(rating) < (SELECT AVG(rating) FROM reviews))"
      explanation: |
        Nine of the 17 best sellers are also on the watch-list, led by *Vitamin C Moisturizer* (220 units, average rating
        3.95). That is a useful message for Dana: fixing these nine would help the most customers. You combined `IN`,
        `HAVING` with scalar subqueries, and a derived table, all in one query.
      difficulty: 3

    - type: exercise
      id: m07-proj-6
      title: Category champions
      prompt: |
        For the final slide, Priya wants the **best-selling product of every category** (most units sold, as in task 4).
        Show `category` (the category name), `product` (the product name) and `units_sold`, for every category that has
        sold something. Sort by `category`.
      starter: |
        SELECT c.name AS category, p.name AS product, u.units_sold
        FROM (
            SELECT product_id, SUM(quantity) AS units_sold
            FROM order_items
            GROUP BY product_id
        ) AS u
        JOIN products p ON p.product_id = u.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE u.units_sold >= ALL (
            ___
        )
        ORDER BY c.name;
      solution: |
        SELECT c.name AS category, p.name AS product, u.units_sold
        FROM (
            SELECT product_id, SUM(quantity) AS units_sold
            FROM order_items
            GROUP BY product_id
        ) AS u
        JOIN products p ON p.product_id = u.product_id
        JOIN categories c ON c.category_id = p.category_id
        WHERE u.units_sold >= ALL (
            SELECT u2.units_sold
            FROM (
                SELECT product_id, SUM(quantity) AS units_sold
                FROM order_items
                GROUP BY product_id
            ) AS u2
            JOIN products p2 ON p2.product_id = u2.product_id
            WHERE p2.category_id = p.category_id
        )
        ORDER BY c.name;
      ordered: true
      columnNames: true
      hints:
        - A product is the champion when its units are at least as high as those of every product in its own category.
        - "That is `>= ALL (subquery)`, where the subquery lists the units of all products in the same category as the outer `p` (correlated)."
        - "Inside, repeat the units-per-product derived table as `u2`, join `products p2`, and add WHERE p2.category_id = p.___"
      explanation: |
        11 categories have a champion, from *Vitamin C Moisturizer* (Beauty, 220 units) to *Aurora 14-inch Laptop*
        (Laptops, 19 units). Electronics, Home and Sports have no products of their own, so they do not appear.
        You wrote the same derived table twice. In m09 you will meet CTEs, which let you write it once and reuse the name.
      difficulty: 3
