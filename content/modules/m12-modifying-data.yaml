    - type: exercise
      id: m12-proj-5
      title: The clean-up
      difficulty: 3
      setup: |
        INSERT INTO suppliers (supplier_id, name, country, contact_email)
        VALUES (9, 'Summit Outdoor Co.', 'Norway',
                'hello@summitoutdoor.example.com');
        INSERT INTO products
            (product_id, name, category_id, supplier_id,
             price, cost, stock_qty, is_active, created_at)
        VALUES (61, 'Trail Water Bottle 1L', 14, 9, 24.50, 11.20,
                0, TRUE, '2024-12-30');
        UPDATE products SET stock_qty = 40 WHERE product_id = 61;
        UPDATE products SET stock_qty = stock_qty - 3 WHERE product_id = 34;
        UPDATE products SET price = ROUND(price * 0.90, 2) WHERE category_id = 14;
      prompt: |
        Lena's clean-up note: *"Some products have never sold, and they are older than 2024. Remove them from the
        catalog. Keep anything that has sold, and keep anything added in 2024."*

        Delete every product that appears in **no** order line (`order_items`) **and** has a `created_at` before
        `2024-01-01`.

        Hint: use a `NOT IN` sub-query for the order lines, and add the date condition with `AND`.
      solution: |
        DELETE FROM products
        WHERE product_id NOT IN (
            SELECT product_id
            FROM order_items
        )
          AND created_at < '2024-01-01';
      check: |
        SELECT product_id, name
        FROM products
        WHERE product_id IN (5, 34, 46, 56, 60, 61)
        ORDER BY product_id;
      hints:
        - "Products that never sold are the ones whose product_id is not in order_items."
        - "Both conditions must be true, so join them with AND. The date is compared with '2024-01-01'."
        - "DELETE FROM products WHERE product_id NOT IN (SELECT ___ FROM order_items) AND created_at ___ '2024-01-01';"
      explanation: Products 46 and 60 never sold and were added in 2022, so they are deleted. Products 5, 34 and 56 never sold either, but they were added in 2024, so they stay.

    - type: exercise
      id: m12-proj-6
      title: The Camping count
      difficulty: 3
      setup: |
        INSERT INTO suppliers (supplier_id, name, country, contact_email)
        VALUES (9, 'Summit Outdoor Co.', 'Norway',
                'hello@summitoutdoor.example.com');
        INSERT INTO products
            (product_id, name, category_id, supplier_id,
             price, cost, stock_qty, is_active, created_at)
        VALUES (61, 'Trail Water Bottle 1L', 14, 9, 24.50, 11.20,
                0, TRUE, '2024-12-30');
        UPDATE products SET stock_qty = 40 WHERE product_id = 61;
        UPDATE products SET stock_qty = stock_qty - 3 WHERE product_id = 34;
        UPDATE products SET price = ROUND(price * 0.90, 2) WHERE category_id = 14;
        DELETE FROM products
        WHERE product_id NOT IN (SELECT product_id FROM order_items)
          AND created_at < '2024-01-01';
        CREATE TABLE count_sheet (product_id integer, counted integer);
        INSERT INTO count_sheet (product_id, counted) VALUES (61, 35), (41, 120);
      prompt: |
        The last count sheet of the day is in the table `count_sheet`, with the columns `product_id` and `counted`:

        - product 61 (Trail Water Bottle): 35 counted
        - product 41 (2-Person Camping Tent): 120 counted

        Camping items that are **not** on the sheet were not on the shelves, so they are out of stock. Use **one**
        `MERGE` to:

        1. set `stock_qty` to the counted number for products on the sheet
        2. set `stock_qty` to `0` for every Camping product (category `14`) that is not on the sheet

        Products in other categories must stay unchanged.
      solution: |
        MERGE INTO products AS p
        USING count_sheet AS s
           ON p.product_id = s.product_id
        WHEN MATCHED THEN
            UPDATE SET stock_qty = s.counted
        WHEN NOT MATCHED BY SOURCE AND p.category_id = 14 THEN
            UPDATE SET stock_qty = 0;
      check: |
        SELECT product_id, name, stock_qty
        FROM products
        WHERE category_id = 14
        ORDER BY product_id;
      hints:
        - "Use WHEN MATCHED for the products on the sheet, and WHEN NOT MATCHED BY SOURCE for the Camping products that are not on it."
        - "Add AND p.category_id = 14 after WHEN NOT MATCHED BY SOURCE, so no other category changes."
        - "MERGE INTO products AS p USING count_sheet AS s ON ___ WHEN MATCHED THEN UPDATE SET stock_qty = s.___ WHEN NOT MATCHED BY SOURCE AND ___ THEN UPDATE SET stock_qty = ___;"
      explanation: The tent gets 120 and the bottle gets 35. The three Camping items that were not counted go to 0, and every other category is left alone. This final task brings together MERGE, a condition on the source-less rows, and everything from the earlier tasks.
