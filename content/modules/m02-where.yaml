      - ["AND"]
    explanation: |
      `BETWEEN low AND high` includes both ends, so Omar Haddad (exactly 16.00) is in. Six people match.

  - type: predict
    id: m02-t20
    lesson: m02-l05
    difficulty: 2
    question: |
      There are 8 coffees and 5 teas (13 items) on the menu of 32. How many rows does this query return?
    sql: |
      SELECT name
      FROM menu_items
      WHERE category NOT IN ('Coffee', 'Tea');
    options: ["13", "19", "32", "0"]
    answer: 1
    explanation: |
      `NOT IN` removes the 13 coffees and teas, leaving 32 - 13 = 19 items. (No category here is NULL, so
