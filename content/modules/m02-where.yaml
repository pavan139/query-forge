  - type: quiz
    id: m02-t21
    lesson: m02-l05
    difficulty: 3
    question: |
      `order_time` is a timestamp. Which condition finds **every order placed at any time in November 2024**?
    options:
      - order_time BETWEEN '2024-11-01' AND '2024-11-30'
      - order_time >= '2024-11-01' AND order_time < '2024-12-01'
      - order_time >= '2024-11-01' AND order_time <= '2024-11-30'
      - order_time = '2024-11'
    answer: 1
    explanation: |
      The safe pattern is `>=` the first day and `<` the day after the last day. The `BETWEEN` and `<=`
      versions treat `'2024-11-30'` as midnight, so they silently lose the two orders placed later on 30
      November (#107 and #108). The last option is not even a valid timestamp.

  # ---------------------------------------------------------------- l06 LIKE
  - type: exercise
    id: m02-t22
    lesson: m02-l06
    difficulty: 1
    prompt: |
      Show the `name` of every menu item whose name **starts with** `Ca`.
    starter: |
      SELECT name
      FROM menu_items
      WHERE
    solution: |
      SELECT name
      FROM menu_items
      WHERE name LIKE 'Ca%';
    hints:
      - You know how the name begins, but not how it ends.
      - Use LIKE with the letters first and a % after them.
      - "SELECT name FROM menu_items WHERE name LIKE '___%';"
    explanation: |
      Four items: Cappuccino, Caramel Latte, Caprese Panini and Carrot Ginger Juice.

  - type: fill
    id: m02-t23
    lesson: m02-l06
    difficulty: 2
    prompt: Complete the query to find items with "chocolate" in the name, whatever the capital letters.
    template: |
      SELECT name
      FROM menu_items
      WHERE name ___ '%CHOCOLATE%';
    answers:
      - ["ILIKE"]
    explanation: |
      `ILIKE` ignores capital letters, so the pattern in capitals still finds the Chocolate Chip Cookie and
      the Chocolate Brownie. Plain `LIKE` would find nothing.

  - type: quiz
    id: m02-t24
    lesson: m02-l06
    difficulty: 2
    question: |
      Which of these first names match the pattern `'_o%'`? (Pick all that apply.)
    options: ["Nora", "Hugo", "Sophia", "Naledi"]
    answer: [0, 2]
    explanation: |
      `_` is exactly one character, so the pattern means "any first letter, then an `o`, then anything".
      Nora (N-**o**-ra) and Sophia (S-**o**-phia) fit. In Hugo the second letter is `u`, and in Naledi it is `a`.

  - type: exercise
    id: m02-t25
    lesson: m02-l06
    difficulty: 3
    prompt: |
      Show the `name` of every menu item whose **second letter is `a`** and whose **last letter is `e`**.
    starter: |
      SELECT name
      FROM menu_items
      WHERE
    solution: |
      SELECT name
      FROM menu_items
      WHERE name LIKE '_a%e';
    hints:
      - Use one pattern that describes the start and the end.
      - The first letter can be anything (`_`), then `a`, then anything (`%`), then `e`.
      - "WHERE name LIKE '_a%___';"
    explanation: |
      Four names match: Vanilla Latte, Caramel Latte, Matcha Latte and Carrot Ginger Juice. `_` fixes the
      position of the second letter, and `%` covers everything in the middle.

  # ---------------------------------------------------------------- l07 NULL
  - type: exercise
    id: m02-t26
    lesson: m02-l07
    difficulty: 1
    prompt: |
      Show the `name` of the staff member who has **no manager** (their `manager_id` is missing).
    starter: |
      SELECT name
      FROM staff
      WHERE
    solution: |
      SELECT name
      FROM staff
      WHERE manager_id IS NULL;
    hints:
      - A missing value is NULL.
      - Don't use `=`. Use the special test for NULL.
      - "SELECT name FROM staff WHERE manager_id ___ ___;"
    explanation: |
      Only Maria Santos, the café manager, has no manager above her.

  - type: quiz
    id: m02-t27
    lesson: m02-l07
    difficulty: 2
    question: What does `SELECT NULL = NULL;` return in PostgreSQL?
    options:
      - "true"
      - "false"
      - NULL (unknown)
      - An error
    answer: 2
    explanation: |
      Comparing an unknown value with another unknown value gives an unknown answer, which shows as NULL.
      That is why you test for missing values with `IS NULL` instead of `= NULL`.

