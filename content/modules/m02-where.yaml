  - type: exercise
    id: m02-t30
    lesson: m02-l07
    difficulty: 3
    prompt: |
      Show the `order_id` and `tip` of every order paid by `'card'` where the tip is either **0.00** or
      **missing** (NULL).
    starter: |
      SELECT order_id, tip
      FROM orders
      WHERE
    solution: |
      SELECT order_id, tip
      FROM orders
      WHERE payment_method = 'card'
        AND (tip = 0 OR tip IS NULL);
    hints:
      - Three ideas this time - card, zero tip and missing tip.
      - The two tip rules are alternatives (OR), so they need parentheses before the AND.
      - "WHERE payment_method = 'card' AND (tip = 0 OR tip ___ ___);"
    explanation: |
      19 orders. Without the parentheses, `OR` would pull in every order with a NULL tip, whatever the payment
      method. And `tip = 0` alone would never find the NULL rows.
