id: m17
order: 17
title: "Programming the Database"
subtitle: Put reusable logic, safety checks and rules inside the database itself
icon: "🔧"
level: expert
description: |
  Until now you have written one query at a time. In a real bank, the same
  logic is needed again and again: the same balance formula, the same fee
  rules, the same checks before money moves. Copying it into every report is
  slow, and one wrong copy causes trouble.

  PostgreSQL lets you store that logic **inside the database**. You will write
  **functions** that return a value, **procedures** that do a job and can
  `COMMIT`, **triggers** that run by themselves when rows change, and
  **error handling** that stops bad work before it is saved. You will also
  learn to control who may see and change what, with **roles**, `GRANT` and
  **row-level security**.

  The code is PL/pgSQL, PostgreSQL's built-in programming language. It is SQL
  with variables, `IF` and loops added. You do not need to be a programmer:
  every idea starts with a short example you can run. The module ends with a
  project that automates Harbor Bank.
dataset: bank
lessons:
  - id: m17-l01
    title: "SQL functions: reusable formulas"
    summary: Write a formula once, give it a name, and use it in any query like a column.
    minutes: 30
    steps:
      - type: read
        title: The same question, every day
        md: |
          Harbor Bank's branch managers ask one question all day: "What is this account's balance?"
          Every analyst answers it with the same `SUM(amount)` query. Then one person forgets to round
          the result, and another forgets to filter by account. Two reports now disagree.

          A **function** fixes this. You write the formula **once**, give it a name, and then use that
          name wherever you need the answer, the same way you use a column name.

          > [!ANALOGY]
          > A function is like a button on a calculator. Someone programmed the steps once. You press
          > the button and get the answer, and you do not need to know how it works inside.

      - type: read
        title: The parts of a function
        md: |
          Every function has four parts:

          | part | example | what it means |
          |---|---|---|
          | name | `account_balance` | What you call it, like a column name. |
          | parameters | `(p_account_id INTEGER)` | Inputs you give it. Each one needs a name and a type. |
          | return type | `RETURNS NUMERIC` | The kind of value it gives back. |
          | body | `SELECT ROUND(SUM(amount), 2) ...` | The SQL that does the work, between `AS $$` and `$$;`. |

          Good habit: start every parameter name with `p_` (for "parameter"). Then you can tell it
          apart from a column with the same name. `LANGUAGE sql` says the body is plain SQL.

      - type: example
        title: Your first function
        md: |
          Press **Run**. The first statement creates the function. The second statement calls it once
          for each account and shows the balance.
        sql: |
          CREATE FUNCTION account_balance(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_id,
                 account_balance(account_id) AS balance
          FROM accounts
          WHERE account_id IN (1, 2, 3)
          ORDER BY account_id;
        after: |
          You called `account_balance` just like a column. Account 1 shows **260.79**, account 2 shows
          **6983.12** and account 3 shows **33301.71**.

          `COALESCE(..., 0)` turns "no transactions" into 0 instead of NULL, and `ROUND` keeps two
          decimals. Both rules now live in one place.

      - type: read
        title: One value per row
        md: |
          A function that is used in a `SELECT` gives back **one value for each row**. That makes it
          easy to combine with the columns you already know.

          Inside the function, the parameter `p_amount` works like a variable. The function gets a
          fresh copy of the value each time it is called, so one call never changes another.

      - type: example
        title: A function that makes a decision
        md: |
          `CASE` works inside a function too. This one sorts each amount into one of three bands.
          It runs on the transactions table, one row at a time.
        sql: |
          CREATE FUNCTION balance_band(p_amount NUMERIC)
          RETURNS TEXT
          LANGUAGE sql
          IMMUTABLE
          AS $$
              SELECT CASE
                         WHEN p_amount < 0 THEN 'negative'
                         WHEN p_amount < 1000 THEN 'small'
                         ELSE 'large'
                     END;
          $$;

          SELECT txn_id, amount,
                 balance_band(amount) AS band
          FROM transactions
          WHERE txn_id IN (1, 2731, 3203)
          ORDER BY txn_id;
        after: |
          Transaction 1 is a `5075.00` opening balance, so it is **large**. Transactions 2731 and 3203 are
          card and cash payments out, so they are **negative**.

      - type: example
        title: Use a function in WHERE
        md: |
          A function can also decide **which rows** you see. Here we keep only the accounts whose balance
          is below zero.
        sql: |
          CREATE FUNCTION account_balance(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_id
          FROM accounts
          WHERE account_balance(account_id) < 0
          ORDER BY account_id;
        after: |
          You get **11** account numbers. The function runs once for each account, and the `WHERE`
          keeps only the rows where the result is below zero. Most of these are credit accounts with a
          balance owed.

      - type: read
        title: "Volatility: how often can the result change?"
        md: |
          Every function is labelled with one word that tells PostgreSQL how stable its answer is. It
          is called the **volatility**.

          | label | meaning | example |
          |---|---|---|
          | `IMMUTABLE` | Same inputs always give the same output, and it never reads a table. | `balance_band(amount)` |
          | `STABLE` | Same inputs give the same output during one statement. It may read tables. | `account_balance(id)` |
          | `VOLATILE` | The output can change on every call. This is the default if you write nothing. | a function that generates a random number |

          The label is a promise to PostgreSQL. It can then run the function fewer times. Choose the
          strongest label that is still true. Writing `IMMUTABLE` for a function that reads
          `transactions` is a bug waiting to happen.

      - type: quiz
        id: m17-l01-q1
        question: A function turns an amount into a price with tax, using only its inputs and no tables. Which label fits best?
        options: [VOLATILE, STABLE, IMMUTABLE, PRIMARY KEY]
        answer: 2
        explanation: |
          `IMMUTABLE` means the same inputs always give the same output and no table is read. `STABLE` is for
          functions that read tables. `VOLATILE` is the default when you write nothing. `PRIMARY KEY` is a
          constraint, not a volatility label.

      - type: example
        title: Dates as parameters
        md: |
          Parameters can have any type, including `DATE`. This function shows the balance **up to and
          including** a given day. The month-end balance is a common report.
        sql: |
          CREATE FUNCTION account_balance_on(p_account_id INTEGER,
                                             p_day DATE)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id
                AND txn_time < p_day + 1;
          $$;

          SELECT account_balance_on(1, '2024-03-31') AS bal_march,
                 account_balance_on(1, '2024-12-31') AS bal_december;
        after: |
          Account 1 had **4636.35** at the end of March and **260.79** at the end of the year. Adding 1 to a
          `DATE` gives the next day, so `txn_time < p_day + 1` includes every moment of `p_day`.

      - type: example
        title: Calling a function wrong
        md: |
          Run it to see what happens when you forget the argument.
        sql: |
          CREATE FUNCTION account_balance(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_balance();
        expectError: true
        after: |
          PostgreSQL looks for a function called `account_balance` that takes **no** inputs. Our function
          needs one `INTEGER`, so it does not exist. The hint says the same thing in plain words.

          > [!MISTAKE]
          > The name is not enough. PostgreSQL matches the name **and** the number and types of the inputs.
          > Pass the account number: `account_balance(1)`.

      - type: stepper
        title: Building a function one step at a time
        md: Start from a query you already know, then wrap it in a function. Click through the stages.
        stages:
          - label: The query you already know
            md: This is the formula. It works, but you would have to copy it everywhere.
            sql: |
              SELECT ROUND(COALESCE(SUM(amount), 0), 2) AS balance
              FROM transactions
              WHERE account_id = 1;
          - label: Wrap it in a function
            md: Replace the number `1` with a parameter, and give the whole thing a name.
            sql: |
              CREATE FUNCTION account_balance(p_account_id INTEGER)
              RETURNS NUMERIC
              LANGUAGE sql
              AS $$
                  SELECT ROUND(COALESCE(SUM(amount), 0), 2)
                  FROM transactions
                  WHERE account_id = p_account_id;
              $$;

              SELECT account_balance(1) AS balance;
          - label: Reuse it for any account
            md: Now the same formula works for any account, in any query.
            sql: |
              CREATE FUNCTION account_balance(p_account_id INTEGER)
              RETURNS NUMERIC
              LANGUAGE sql
              AS $$
                  SELECT ROUND(COALESCE(SUM(amount), 0), 2)
                  FROM transactions
                  WHERE account_id = p_account_id;
              $$;

              SELECT account_id, account_balance(account_id) AS balance
              FROM accounts
              WHERE account_id IN (1, 2)
              ORDER BY account_id;

      - type: predict
        id: m17-l01-p1
        question: The function `account_balance` is created as in the first example. What does this return?
        sql: |
          CREATE FUNCTION account_balance(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_balance(4) AS balance;
        options: ["833.85", "1", "0.00", "An error"]
        answer: 0
        explanation: |
          Account 4 has a balance of 833.85 at the end of 2024. The function returns the sum of its
          transactions, rounded to two decimals, so there is no error.

      - type: fill
        id: m17-l01-f1
        prompt: Complete the function header so that it returns a number.
        template: |
          CREATE FUNCTION double_amount(p_amount NUMERIC)
          ___ NUMERIC
          LANGUAGE sql
          AS $$
              SELECT p_amount * 2;
          $$;
        answers:
          - ["RETURNS"]
        explanation: The keyword `RETURNS` announces the type of value the function gives back.

      - type: parsons
        id: m17-l01-o1
        prompt: Put the lines in the right order to create a tax function and then call it.
        lines:
          - CREATE FUNCTION add_tax(p_amount NUMERIC, p_rate NUMERIC)
          - RETURNS NUMERIC
          - LANGUAGE sql
          - AS $$
          - SELECT ROUND(p_amount * (1 + p_rate), 2);
          - $$;
          - SELECT add_tax(100.00, 0.08) AS total;
        distractors:
          - RETURNS TEXT
        explanation: |
          The header comes first, then the type and language, then the body between `AS $$` and `$$;`. The
          last line calls the new function. `RETURNS TEXT` would be the wrong return type for a number.

      - type: exercise
        id: m17-l01-e1
        title: Name your own total
        prompt: |
          Write a function named `account_total` that takes one parameter, `p_account_id` (an integer).
          It returns the sum of that account's `amount` values, rounded to 2 decimals.

          Then call it for account 2 and show the result as one column named `total`.
        starter: |
          -- 1. Write CREATE FUNCTION account_total here.

          -- 2. Call it for account 2 here.
        solution: |
          CREATE FUNCTION account_total(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_total(2) AS total;
        columnNames: true
        hints:
          - It is the same formula as the first example, with a new name.
          - Put `RETURNS NUMERIC` and `LANGUAGE sql` between the parameter list and `AS $$`.
          - "Skeleton: `CREATE FUNCTION account_total(p_account_id INTEGER) RETURNS ___ LANGUAGE sql AS $$ SELECT ___ FROM transactions WHERE ___; $$;`"
        explanation: |
          The function is a reusable formula. Once it exists, `SELECT account_total(2)` returns the same
          answer as the long query. Name parameters with `p_` so they never clash with a column.
        difficulty: 1

      - type: exercise
        id: m17-l01-e2
        title: Count the transactions
        prompt: |
          Write a function named `txn_count` that takes one parameter, `p_account_id` (an integer), and
          returns how many rows of `transactions` belong to that account.

          Then show `account_id` and `txn_count` (the function's result) for accounts 1, 2 and 3. Order
          the rows by `account_id`.
        starter: |
          -- 1. Write CREATE FUNCTION txn_count here.

          -- 2. Show the three accounts here.
        solution: |
          CREATE FUNCTION txn_count(p_account_id INTEGER)
          RETURNS BIGINT
          LANGUAGE sql
          STABLE
          AS $$
              SELECT COUNT(*)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          SELECT account_id,
                 txn_count(account_id) AS txn_count
          FROM accounts
          WHERE account_id IN (1, 2, 3)
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - Use `COUNT(*)` in the function body, and call the function in the `SELECT` list.
          - The function's return type can be `BIGINT`, because `COUNT` returns a big integer.
          - "Skeleton: `SELECT ___(account_id) AS txn_count FROM accounts WHERE account_id IN (1, 2, 3) ORDER BY account_id;`"
        explanation: |
          `COUNT(*)` counts rows, including rows with NULL values. The function is called once per account,
          so the outer query gets one row per account.
        difficulty: 1

      - type: exercise
        id: m17-l01-e3
        title: Sort the balances into bands
        prompt: |
          Write two functions.

          1. `account_balance(p_account_id INTEGER)` returns the account's balance, rounded to 2 decimals.
             Use the same formula as the first example.
          2. `balance_band(p_amount NUMERIC)` returns `'negative'` if the amount is below 0, `'small'` if it
             is below 1000, and `'large'` otherwise. Use the same `CASE` as the second example.

          Then count the accounts in each band. Show two columns, `band` and `accounts`, ordered by `band`.
          Use the bank's accounts table and call `balance_band(account_balance(account_id))`.
        starter: |
          -- 1. Write account_balance here.

          -- 2. Write balance_band here.

          -- 3. Count the accounts per band here.
        solution: |
          CREATE FUNCTION account_balance(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id;
          $$;

          CREATE FUNCTION balance_band(p_amount NUMERIC)
          RETURNS TEXT
          LANGUAGE sql
          IMMUTABLE
          AS $$
              SELECT CASE
                         WHEN p_amount < 0 THEN 'negative'
                         WHEN p_amount < 1000 THEN 'small'
                         ELSE 'large'
                     END;
          $$;

          SELECT balance_band(account_balance(account_id)) AS band,
                 COUNT(*) AS accounts
          FROM accounts
          GROUP BY 1
          ORDER BY 1;
        columnNames: true
        ordered: true
        hints:
          - Write the two functions first, then query the accounts table.
          - "Put `balance_band(account_balance(account_id))` in the `SELECT` and `GROUP BY` it."
          - "Skeleton: `SELECT balance_band(...) AS band, COUNT(*) AS accounts FROM accounts GROUP BY 1 ORDER BY 1;`"
        explanation: |
          Functions can call other functions. Here `account_balance` runs for each account, and its result
          goes straight into `balance_band`. Grouping by the band counts how many accounts fall in each
          one. Note that an account with no transactions has balance 0, so it is in the `small` band.
        difficulty: 2

      - type: exercise
        id: m17-l01-e4
        title: The balance on a chosen day
        prompt: |
          Write a function named `account_balance_on` with two parameters: `p_account_id` (an integer) and
          `p_day` (a `DATE`). It returns the account's balance, rounded to 2 decimals, counting every
          transaction on or before `p_day`.

          Then show `account_id` and `balance` (the result of the function on `2024-06-30`) for account 1.
        starter: |
          -- 1. Write account_balance_on here.

          -- 2. Show account 1 here.
        solution: |
          CREATE FUNCTION account_balance_on(p_account_id INTEGER,
                                             p_day DATE)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id
                AND txn_time < p_day + 1;
          $$;

          SELECT account_id,
                 account_balance_on(account_id, '2024-06-30') AS balance
          FROM accounts
          WHERE account_id = 1;
        columnNames: true
        hints:
          - Copy the date filter from the "Dates as parameters" example and change the date.
          - "The filter is `txn_time < p_day + 1`, which includes every time on `p_day`."
          - "Skeleton: `SELECT account_id, account_balance_on(account_id, '2024-06-30') AS balance FROM accounts WHERE account_id = 1;`"
        explanation: |
          Dates work well as parameters. `p_day + 1` is the next day, so the `<` comparison keeps the whole
          of the chosen day. Using a fixed date such as `'2024-06-30'` also keeps the answer the same every
          time you run it.
        difficulty: 2

      - type: exercise
        id: m17-l01-e5
        title: Who was overdrawn on a given day?
        prompt: |
          Write `account_balance_on(p_account_id INTEGER, p_day DATE)` as in the previous exercise.

          Then list `account_id` and `balance` for every account whose balance on `2024-06-30` is below
          zero. Use the function both in the `SELECT` and in the `WHERE`. Order the rows by `account_id`.
        starter: |
          -- 1. Write account_balance_on here.

          -- 2. List the accounts below zero on 2024-06-30 here.
        solution: |
          CREATE FUNCTION account_balance_on(p_account_id INTEGER,
                                             p_day DATE)
          RETURNS NUMERIC
          LANGUAGE sql
          STABLE
          AS $$
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
              FROM transactions
              WHERE account_id = p_account_id
                AND txn_time < p_day + 1;
          $$;

          SELECT account_id,
                 account_balance_on(account_id, '2024-06-30') AS balance
          FROM accounts
          WHERE account_balance_on(account_id, '2024-06-30') < 0
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - The `WHERE` clause can call the function with the same date.
          - "Repeat the call in the `WHERE`: `WHERE account_balance_on(account_id, '2024-06-30') < 0`."
          - "Skeleton: `SELECT account_id, account_balance_on(account_id, '2024-06-30') AS balance FROM accounts WHERE ___ ORDER BY account_id;`"
        explanation: |
          The function runs twice for each account, once for the `SELECT` and once for the `WHERE`. That is
          fine for a small bank, but in a big table you would compute it once in a subquery. You will learn
          how in a later module.
        difficulty: 3

    cheatsheet:
      - title: Create a SQL function
        sql: |
          CREATE FUNCTION add_tax(p_amount NUMERIC, p_rate NUMERIC)
          RETURNS NUMERIC
          LANGUAGE sql
          AS $$
              SELECT ROUND(p_amount * (1 + p_rate), 2);
          $$;
        note: Parameters need names and types. The body goes between AS $$ and $$;.
      - title: Call a function
        sql: |
          SELECT add_tax(100.00, 0.08) AS total;
        note: Use it like a column, in SELECT, WHERE or ORDER BY.
      - title: Volatility labels
        sql: |
          -- IMMUTABLE: same inputs, same output, no tables read
          -- STABLE:    same output within one statement, may read tables
          -- VOLATILE:  may change on every call (the default)
        note: Choose the strongest label that is still true.
  - id: m17-l02
    title: "PL/pgSQL basics: variables, IF and loops"
    summary: Write small programs inside the database with variables, decisions, loops and DO blocks.
    minutes: 30
    steps:
      - type: read
        title: A question SQL cannot answer alone
        md: |
          Rafael works in risk at Harbor Bank. Every week he goes through each defaulted loan, looks up the
          customer, and writes one line in a watch list. A single `SELECT` can find the loans. It cannot
          write a line for each loan, decide what to do with it, and remember a running count.

          **PL/pgSQL** is the tool for that job. It is SQL with a few extra tools added:

          - **variables** that remember a value,
          - **`IF`** to make a decision,
          - **loops** to repeat a step for every row.

          > [!ANALOGY]
          > A plain query is a shopping list: you say what you want and the shop brings it. A PL/pgSQL block
          > is a recipe card: you say the steps in order, and you can check something before the next step.

      - type: read
        title: The shape of a block
        md: |
          A PL/pgSQL program is a **block**. It has up to three parts:

          | part | what it is for |
          |---|---|
          | `DECLARE` | The list of variables, each with a type. Optional. |
          | `BEGIN` ... `END;` | The steps that do the work. |
          | `$$` ... `$$` | The quotes around the code, so the database reads it as one piece of text. |

          A block that runs once, without a name, is called a **DO block**. You will write many of them in
          this lesson. A DO block does not return rows, so the results you see come from its messages and
          from any tables it changes.

      - type: example
        title: Your first DO block
        md: |
          Press **Run**. The block adds up account 1, then uses `IF` to decide what to say.
        sql: |
          DO $$
          DECLARE
              v_total NUMERIC;
          BEGIN
              SELECT SUM(amount) INTO v_total
              FROM transactions
              WHERE account_id = 1;

              IF v_total > 0 THEN
                  RAISE NOTICE 'Account 1 is in credit: %', v_total;
              ELSIF v_total = 0 THEN
                  RAISE NOTICE 'Account 1 is at zero';
              ELSE
                  RAISE NOTICE 'Account 1 is overdrawn: %', v_total;
              END IF;
          END;
          $$;
        after: |
          The result table is empty, because a DO block returns no rows. The message appears in the
          **Messages** panel: `Account 1 is in credit: 260.79`. The `%` is replaced by the value of
          `v_total`, and the `IF` picked the first branch because the total is above zero.

      - type: read
        title: Variables and INTO
        md: |
          A **variable** is a named box that holds one value. You declare it in `DECLARE` with a type, such
          as `v_total NUMERIC;`. You can fill it in two ways:

          1. With `:=`, the assignment arrow: `v_total := 0;`
          2. With a query: `SELECT SUM(amount) INTO v_total FROM ...;`

          PL/pgSQL also accepts `=` for assignment, but `:=` is the usual style and it is easy to spot.
          Name variables with a `v_` prefix so they never clash with a column name.

      - type: example
        title: Looping over the rows of a query
        md: |
          `FOR ... IN ... LOOP` repeats the steps once for every row a query returns. The variable `r`
          holds the current row, and `r.name` reads one column of it.
        sql: |
          DO $$
          DECLARE
              r RECORD;
          BEGIN
              FOR r IN SELECT branch_id, name, city
                       FROM branches
                       ORDER BY branch_id LOOP
                  RAISE NOTICE 'Branch % is % in %',
                               r.branch_id, r.name, r.city;
              END LOOP;
          END;
          $$;
        after: |
          The loop ran five times, once for each branch. The first message is
          `Branch 1 is Harbor Bank Downtown in Seattle`. Every `END LOOP;` marks the end of one round.

      - type: example
        title: Counting with a loop
        md: |
          A loop can also count from one number to another. `i` is created for you, so you do not declare it.
        sql: |
          DO $$
          BEGIN
              FOR i IN 1..3 LOOP
                  RAISE NOTICE 'Round %', i;
              END LOOP;
          END;
          $$;
        after: |
          Three messages appear: `Round 1`, `Round 2` and `Round 3`. The range `1..3` includes both
          ends, just like `BETWEEN`.

      - type: read
        title: Loops that change data
        md: |
          A notice is for reading. Real work changes data, and `INSERT`, `UPDATE` and `DELETE` work inside a
          block exactly as they do outside one. The loop is the part that repeats the change for every row.

          > [!REAL-WORLD]
          > Analysts use loops like this to write one note per customer, to fill a summary table nightly or to
          > run a fix on many rows that a single `UPDATE` cannot describe.

      - type: example
        title: A loop that writes to a table
        md: |
          This block creates a small table and then writes one row for each account in the loop. Each
          account gets the note `checked`.
        sql: |
          CREATE TABLE watch_list (
              account_id INTEGER,
              note TEXT
          );

          DO $$
          DECLARE
              r RECORD;
          BEGIN
              FOR r IN SELECT account_id
                       FROM accounts
                       WHERE account_id IN (1, 2, 3)
                       ORDER BY account_id LOOP
                  INSERT INTO watch_list (account_id, note)
                  VALUES (r.account_id, 'checked');
              END LOOP;
          END;
          $$;

          SELECT account_id, note
          FROM watch_list
          ORDER BY account_id;
        after: |
          The loop wrote three rows, one for each account. The final `SELECT` reads them back, outside the
          block, like any other table.

      - type: read
        title: Functions can use the same tools
        md: |
          A **function** written in PL/pgSQL works like the functions from the last lesson, but it can use
          variables, `IF` and loops. You write `LANGUAGE plpgsql` instead of `LANGUAGE sql`, and you give
          the answer with `RETURN`.

          Rule of thumb: use a plain SQL function when one query gives the answer. Use PL/pgSQL when you
          need steps, decisions or loops.

      - type: example
        title: A function with IF and ELSIF
        md: |
          This function looks up one loan and returns a risk label. It needs two variables, one to hold the
          status and one to hold the rate.
        sql: |
          CREATE FUNCTION loan_risk(p_loan_id INTEGER)
          RETURNS TEXT
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_status TEXT;
              v_rate NUMERIC;
          BEGIN
              SELECT status, annual_rate
                INTO v_status, v_rate
              FROM loans
              WHERE loan_id = p_loan_id;

              IF v_status = 'defaulted' THEN
                  RETURN 'High risk';
              ELSIF v_rate >= 10 THEN
                  RETURN 'Watch';
              ELSE
                  RETURN 'Normal';
              END IF;
          END;
          $$;

          SELECT loan_id, status, annual_rate,
                 loan_risk(loan_id) AS risk
          FROM loans
          WHERE loan_id IN (1, 2, 3, 4, 5, 6)
          ORDER BY loan_id;
        after: |
          Loans 3 and 4 are **High risk** because they are defaulted. Loans 1, 2, 5 and 6 are **Normal**: none
          of them is defaulted and none has a rate of 10 or more. `SELECT ... INTO v_status, v_rate` fills
          two variables from one row at once.

      - type: quiz
        id: m17-l02-q1
        question: What does `RAISE NOTICE` do inside a block?
        options:
          - It undoes every change the block made.
          - It shows a message to you and lets the block keep going.
          - It saves the block as a function.
          - It stops the block with an error.
        answer: 1
        explanation: |
          A notice is a message for you, shown in the Messages panel. The block keeps running afterwards. To
          stop the block with an error, you use `RAISE EXCEPTION`, which you will learn in a later lesson.

      - type: read
        title: Every query needs a destination
        md: |
          Inside a block, a `SELECT` on its own does nothing with its rows. PostgreSQL needs to know where
          the rows should go. You have three choices:

          - a variable, with `SELECT ... INTO v_name`,
          - a table, with `INSERT INTO ... SELECT ...`,
          - nowhere, with `PERFORM`, when you run a query only for its side effects.

          > [!MISTAKE]
          > The most common PL/pgSQL error is a plain `SELECT` with no `INTO`. The next example shows it.

      - type: example
        title: The SELECT that has nowhere to go
        md: Run it. The block is correct SQL, but the `SELECT` has no destination.
        sql: |
          DO $$
          DECLARE
              v_count INTEGER;
          BEGIN
              SELECT COUNT(*) FROM transactions;
          END;
          $$;
        expectError: true
        after: |
          The hint says exactly what to do: add `INTO v_count` after the `SELECT` list, so the count goes
          into the variable, or use `PERFORM` if you do not need the number at all.

      - type: predict
        id: m17-l02-p1
        question: How many rows does the final `SELECT` return?
        sql: |
          CREATE TABLE picks (n INTEGER);

          DO $$
          BEGIN
              FOR i IN 1..6 LOOP
                  IF i % 3 = 0 THEN
                      INSERT INTO picks VALUES (i);
                  END IF;
              END LOOP;
          END;
          $$;

          SELECT COUNT(*) FROM picks;
        options: ["2", "3", "6", "0"]
        answer: 0
        explanation: |
          `i % 3` is the remainder after dividing `i` by 3. It is 0 for i = 3 and i = 6 only, so the block
          inserts two rows.

      - type: fill
        id: m17-l02-f1
        prompt: Complete the loop so that it prints the name of every branch.
        template: |
          DO $$
          DECLARE
              r RECORD;
          BEGIN
              ___ r IN SELECT name FROM branches
              ___
                  RAISE NOTICE 'Branch: %', r.name;
              END LOOP;
          END;
          $$;
        answers:
          - ["FOR"]
          - ["LOOP"]
        explanation: "`FOR r IN ... LOOP` opens the loop, and `END LOOP;` closes it."

      - type: parsons
        id: m17-l02-o1
        prompt: Put the lines in the right order to count the loans and print the total.
        lines:
          - DO $$
          - DECLARE
          - "    v_loans INTEGER;"
          - BEGIN
          - "    SELECT COUNT(*) INTO v_loans FROM loans;"
          - "    RAISE NOTICE 'Loans: %', v_loans;"
          - END;
          - $$;
        distractors:
          - "    RAISE EXCEPTION 'Loans: %', v_loans;"
        explanation: |
          The variable is declared before `BEGIN`, filled by `SELECT ... INTO`, and then printed. The
          `RAISE EXCEPTION` line would stop the block with an error, so it is left out.

      - type: exercise
        id: m17-l02-e1
        title: Check three accounts in a loop
        prompt: |
          The table `watch_list` already exists (hidden setup). It has two columns, `account_id` and
          `note`, and it is empty.

          Write a DO block that loops over accounts 1, 2 and 3, and inserts one row per account into
          `watch_list` with `note` set to `'checked'`.

          Then show `account_id` and `note` from `watch_list`, ordered by `account_id`.
        setup: |
          CREATE TABLE watch_list (
              account_id INTEGER,
              note TEXT
          );
        starter: |
          -- 1. Write the DO block here.

          -- 2. Show the rows of watch_list here.
        solution: |
          DO $$
          DECLARE
              r RECORD;
          BEGIN
              FOR r IN SELECT account_id
                       FROM accounts
                       WHERE account_id IN (1, 2, 3) LOOP
                  INSERT INTO watch_list (account_id, note)
                  VALUES (r.account_id, 'checked');
              END LOOP;
          END;
          $$;

          SELECT account_id, note
          FROM watch_list
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - It is the same pattern as the loop example, with `WHERE account_id IN (1, 2, 3)`.
          - Use `FOR r IN SELECT account_id FROM accounts ... LOOP`, then an `INSERT` inside the loop.
          - "Skeleton: `DO $$ DECLARE r RECORD; BEGIN FOR r IN SELECT ___ FROM accounts WHERE ___ LOOP INSERT INTO watch_list VALUES (___, 'checked'); END LOOP; END; $$;`"
        explanation: |
          One loop round means one `INSERT`. Because the loop uses `ORDER BY`, the rows go in order, and the
          final query shows them in that order too.
        difficulty: 1

      - type: exercise
        id: m17-l02-e2
        title: Size up a loan
        prompt: |
          Write a PL/pgSQL function named `loan_size` with one parameter, `p_loan_id` (an integer). It returns
          the text `'Large'` if the loan's `principal` is 100000 or more, `'Medium'` if it is 20000 or more,
          and `'Small'` otherwise. Read `principal` into a variable first.

          Then show `loan_id` and `size` for loans 1 to 5, ordered by `loan_id`. `size` is the result of
          `loan_size`.
        starter: |
          -- 1. Write the loan_size function here.

          -- 2. Show loans 1 to 5 here.
        solution: |
          CREATE FUNCTION loan_size(p_loan_id INTEGER)
          RETURNS TEXT
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_principal NUMERIC;
          BEGIN
              SELECT principal INTO v_principal
              FROM loans
              WHERE loan_id = p_loan_id;

              IF v_principal >= 100000 THEN
                  RETURN 'Large';
              ELSIF v_principal >= 20000 THEN
                  RETURN 'Medium';
              ELSE
                  RETURN 'Small';
              END IF;
          END;
          $$;

          SELECT loan_id,
                 loan_size(loan_id) AS size
          FROM loans
          WHERE loan_id BETWEEN 1 AND 5
          ORDER BY loan_id;
        columnNames: true
        ordered: true
        hints:
          - Start with `SELECT principal INTO v_principal FROM loans WHERE loan_id = p_loan_id;`.
          - Check the big limit first, then the middle one, and use `ELSE` for the rest.
          - "Skeleton: `IF v_principal >= 100000 THEN RETURN ___; ELSIF v_principal >= 20000 THEN RETURN ___; ELSE RETURN ___; END IF;`"
        explanation: |
          Checking the largest limit first keeps the `IF` short. `ELSE` catches everything that did not match
          an earlier branch. Loans 2 and 5 are Large, loans 4 is Medium, and loans 1 and 3 are Small.
        difficulty: 1

      - type: exercise
        id: m17-l02-e3
        title: Flag the accounts in trouble
        prompt: |
          The table `watch_list` already exists (hidden setup). It has columns `account_id` and `note`, and
          it is empty.

          Write a DO block that loops over the accounts from 20 to 40 (`account_id BETWEEN 20 AND 40`). For
          each account:

          1. Read its balance with `SELECT COALESCE(SUM(amount), 0) INTO ...` from `transactions`.
          2. If the balance is below 0, insert a row with `note` set to `'overdrawn'`.
          3. Otherwise, if the balance is below 1000, insert a row with `note` set to `'low'`.
          4. Accounts with 1000 or more get no row.

          Then show `account_id` and `note` from `watch_list`, ordered by `account_id`.
        setup: |
          CREATE TABLE watch_list (
              account_id INTEGER,
              note TEXT
          );
        starter: |
          -- 1. Write the DO block here.

          -- 2. Show the rows of watch_list here.
        solution: |
          DO $$
          DECLARE
              r RECORD;
              v_balance NUMERIC;
          BEGIN
              FOR r IN SELECT account_id
                       FROM accounts
                       WHERE account_id BETWEEN 20 AND 40
                       ORDER BY account_id LOOP
                  SELECT COALESCE(SUM(amount), 0) INTO v_balance
                  FROM transactions
                  WHERE account_id = r.account_id;

                  IF v_balance < 0 THEN
                      INSERT INTO watch_list VALUES (r.account_id, 'overdrawn');
                  ELSIF v_balance < 1000 THEN
                      INSERT INTO watch_list VALUES (r.account_id, 'low');
                  END IF;
              END LOOP;
          END;
          $$;

          SELECT account_id, note
          FROM watch_list
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - Declare one more variable, `v_balance NUMERIC`, to hold the balance.
          - Use an `IF` with an `ELSIF` inside the loop. Each branch inserts one row.
          - "Skeleton: `IF v_balance < 0 THEN INSERT ... 'overdrawn'; ELSIF v_balance < 1000 THEN INSERT ... 'low'; END IF;`"
        explanation: |
          The `IF` runs once for every account. The `ELSIF` is only checked when the first test fails, so an
          account below zero is never also marked as low. Accounts 22, 31 and 40 are overdrawn, and accounts
          23 and 39 are low.
        difficulty: 2

      - type: exercise
        id: m17-l02-e4
        title: Record the defaulted loans
        prompt: |
          The table `risk_list` already exists (hidden setup). It has two columns, `customer_id` and `reason`,
          and it is empty.

          Write a DO block that loops over every loan with `status = 'defaulted'`. For each loan, insert one
          row into `risk_list` with the loan's `customer_id` and the `reason` `'defaulted loan'`.

          Then show `customer_id` and `reason` from `risk_list`, ordered by `customer_id`.
        setup: |
          CREATE TABLE risk_list (
              customer_id INTEGER,
              reason TEXT
          );
        starter: |
          -- 1. Write the DO block here.

          -- 2. Show the rows of risk_list here.
        solution: |
          DO $$
          DECLARE
              r RECORD;
          BEGIN
              FOR r IN SELECT customer_id
                       FROM loans
                       WHERE status = 'defaulted' LOOP
                  INSERT INTO risk_list (customer_id, reason)
                  VALUES (r.customer_id, 'defaulted loan');
              END LOOP;
          END;
          $$;

          SELECT customer_id, reason
          FROM risk_list
          ORDER BY customer_id;
        columnNames: true
        ordered: true
        hints:
          - The loop query reads from `loans`, not from `customers`.
          - Put the `WHERE status = 'defaulted'` filter in the loop's query.
          - "Skeleton: `FOR r IN SELECT ___ FROM loans WHERE ___ LOOP INSERT INTO risk_list (customer_id, reason) VALUES (r.___, ___); END LOOP;`"
        explanation: |
          A loop can read from any table. Here it reads loans and writes customers into the watch list. The
          result has five rows, one for each defaulted loan.
        difficulty: 2

      - type: exercise
        id: m17-l02-e5
        title: Find the big card debts
        prompt: |
          The table `card_watch` already exists (hidden setup). It has two columns, `account_id` and
          `balance`, and it is empty.

          Write a DO block that loops over every account with `account_type = 'credit'`. For each account:

          1. Compute its balance with `COALESCE(SUM(amount), 0)` from `transactions`, into a variable.
          2. If the balance is below -1000, insert the `account_id` and the balance rounded to 2 decimals.

          Then show `account_id` and `balance` from `card_watch`, ordered by `account_id`.
        setup: |
          CREATE TABLE card_watch (
              account_id INTEGER,
              balance NUMERIC
          );
        starter: |
          -- 1. Write the DO block here.

          -- 2. Show the rows of card_watch here.
        solution: |
          DO $$
          DECLARE
              r RECORD;
              v_balance NUMERIC;
          BEGIN
              FOR r IN SELECT account_id
                       FROM accounts
                       WHERE account_type = 'credit'
                       ORDER BY account_id LOOP
                  SELECT COALESCE(SUM(amount), 0) INTO v_balance
                  FROM transactions
                  WHERE account_id = r.account_id;

                  IF v_balance < -1000 THEN
                      INSERT INTO card_watch (account_id, balance)
                      VALUES (r.account_id, ROUND(v_balance, 2));
                  END IF;
              END LOOP;
          END;
          $$;

          SELECT account_id, balance
          FROM card_watch
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - It is the same loop as the previous exercise, with a different filter and threshold.
          - Only one `IF` is needed. Insert inside it, and skip the other accounts.
          - "Skeleton: `IF v_balance < ___ THEN INSERT INTO card_watch (account_id, balance) VALUES (r.account_id, ROUND(v_balance, 2)); END IF;`"
        explanation: |
          Credit accounts owe money when the balance is negative. Only two credit accounts owe more than
          1000 dollars at the end of 2024. Rounding with `ROUND(v_balance, 2)` keeps the stored value tidy.
        difficulty: 3

    cheatsheet:
      - title: A DO block
        sql: |
          DO $$
          DECLARE
              v_total NUMERIC;
          BEGIN
              -- your steps here
          END;
          $$;
        note: DO runs the block once. It does not return rows.
      - title: Loop over the rows of a query
        sql: |
          FOR r IN SELECT account_id FROM accounts LOOP
              RAISE NOTICE 'Account %', r.account_id;
          END LOOP;
        note: r holds the current row. Read columns with r.column_name.
      - title: Store one value in a variable
        sql: |
          SELECT COUNT(*) INTO v_count
          FROM transactions;
        note: SELECT ... INTO is the way to keep a query result in a variable.
  - id: m17-l03
    title: "Set-returning functions: a query with a name"
    summary: Write a function that returns many rows, and use it in FROM and JOIN as if it were a table.
    minutes: 28
    steps:
      - type: read
        title: A list, not a single value
        md: |
          Maria in compliance needs the same list every month: every debit of at least $2,000, with the
          account it came from. She could paste the same `WHERE` clause into a new query each time. Or she
          could write the query **once** as a function that returns rows.

          A function that returns many rows is called a **set-returning function**. You use it in `FROM`,
          the same place as a table, so you can filter, sort and join its rows.

          > [!ANALOGY]
          > A table is a filing cabinet. A set-returning function is a request form: you fill in a number,
          > and the bank hands you back a folder of matching pages.

      - type: read
        title: Three ways to say what comes back
        md: |
          There are three common shapes for the rows a function returns:

          | shape | written as | when to use it |
          |---|---|---|
          | one value | `RETURNS NUMERIC` | the answer is a single number or text |
          | named columns | `RETURNS TABLE(txn_id INTEGER, amount NUMERIC)` | you choose the columns |
          | rows of a table | `RETURNS SETOF transactions` | you want every column of a table |

          The first shape was used in the last lesson. This lesson uses the other two, and you can then call
          them with `SELECT * FROM function_name(...)`.

      - type: example
        title: A function that returns a table
        md: |
          Press **Run**. The function returns every transaction of at least 10,000 dollars, with three
          columns. We call it in `FROM`, like a table.
        sql: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER,
                        account_id INTEGER,
                        amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT t.txn_id, t.account_id, t.amount
              FROM transactions t
              WHERE t.amount <= -p_min;
          $$;

          SELECT *
          FROM big_debits(10000);
        after: |
          One row comes back: transaction **2731** on account 94, a withdrawal of **-22450.00**. The
          `WHERE` uses `-p_min` because debits are negative numbers. Changing `10000` to another amount
          changes the list without changing the function.

      - type: read
        title: Rows of a whole table
        md: |
          If you want every column of a table, you can say `RETURNS SETOF` followed by the table name. The
          body returns rows that match that table's columns, and the caller gets all of them.

          Think of it as a **saved filter** on the table. It keeps the columns and filters the rows.

      - type: example
        title: A saved filter on card payments
        md: |
          This function returns all the card payments of one account. `SELECT *` is safe here, because the
          function's columns are exactly the columns of `transactions`.
        sql: |
          CREATE FUNCTION card_payments_for(p_account_id INTEGER)
          RETURNS SETOF transactions
          LANGUAGE sql
          AS $$
              SELECT *
              FROM transactions
              WHERE account_id = p_account_id
                AND txn_type = 'card_payment';
          $$;

          SELECT txn_id, txn_time, merchant, amount
          FROM card_payments_for(1)
          ORDER BY txn_id
          LIMIT 5;
        after: |
          The first five card payments of account 1 are at ClearWater Utility, Brick Oven Pizzeria and other
          merchants. `LIMIT 5` only shortens the list; the function returned all 48 payments. Because the
          rows come back from the function in no fixed order, `ORDER BY` in the outer query makes the result
          predictable.

      - type: read
        title: RETURN QUERY and the PL/pgSQL body
        md: |
          Sometimes the rows need steps before they are ready: an `IF`, a variable, a loop. Then you write
          the function in PL/pgSQL with `LANGUAGE plpgsql`. Inside the body, `RETURN QUERY` sends the rows of a
          query back to the caller. You can call `RETURN QUERY` more than once in the same function, and the
          rows from each call are added to the result.

      - type: example
        title: The three biggest debits of an account
        md: |
          This PL/pgSQL function returns the `p_count` most negative amounts of one account. The `LIMIT` takes
          its size from a parameter.
        sql: |
          CREATE FUNCTION top_debits(p_account_id INTEGER,
                                     p_count INTEGER)
          RETURNS TABLE(txn_id INTEGER, amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              RETURN QUERY
              SELECT t.txn_id, t.amount
              FROM transactions t
              WHERE t.account_id = p_account_id
                AND t.amount < 0
              ORDER BY t.amount
              LIMIT p_count;
          END;
          $$;

          SELECT txn_id, amount
          FROM top_debits(1, 3)
          ORDER BY amount;
        after: |
          The biggest debit is transaction **3203**, at -2250.00. The next two are -212.46 and -199.52. The
          function sorted them inside, and the outer `ORDER BY amount` sorts the final result the same way.

      - type: quiz
        id: m17-l03-q1
        question: Which query uses a function that returns a table of rows correctly?
        options:
          - "SELECT * FROM big_debits(10000);"
          - "SELECT big_debits;"
          - "CALL big_debits(10000);"
          - "SELECT * big_debits(10000);"
        answer: 0
        explanation: |
          A function that returns rows is used in `FROM`, with `SELECT * FROM function_name(arguments)`.
          `CALL` is only for procedures, which you will meet in a later lesson. Without `FROM`, the function
          name is treated as a column.

      - type: read
        title: Joining a function like a table
        md: |
          Because the function is in `FROM`, you can `JOIN` it to other tables. The function's rows behave
          like rows of a table with the columns you named. This is the main reason to write them this way.

      - type: example
        title: Who made the big debit?
        md: |
          This query joins the function's rows to `accounts` and `customers`, so each debit gets a name.
        sql: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER,
                        account_id INTEGER,
                        amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT t.txn_id, t.account_id, t.amount
              FROM transactions t
              WHERE t.amount <= -p_min;
          $$;

          SELECT c.full_name, b.txn_id, b.amount
          FROM big_debits(10000) b
          JOIN accounts a
            ON a.account_id = b.account_id
          JOIN customers c
            ON c.customer_id = a.customer_id;
        after: |
          The one debit of 10000 or more was made by **Hannah Thomas**, on transaction 2731. The function
          gives the rows, and the joins add the names. The function is written once and joined as often as
          you like.

      - type: read
        title: Do not forget FROM
        md: |
          When a function returns a row, `SELECT f(...)` on its own does not split the row into columns. It
          gives you the whole row as **one** value. The next example shows this.

          > [!MISTAKE]
          > `SELECT big_debits(10000);` runs without an error, but the result is one column that looks
          > like `(2731,94,-22450.00)`. Use `SELECT * FROM big_debits(10000);` to get separate columns.

      - type: example
        title: The same function without FROM
        md: Run it and compare the result with the first example.
        sql: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER,
                        account_id INTEGER,
                        amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT t.txn_id, t.account_id, t.amount
              FROM transactions t
              WHERE t.amount <= -p_min;
          $$;

          SELECT big_debits(10000);
        after: |
          The same row comes back, but everything is packed into one column, shown in brackets:
          `(2731,94,-22450.00)`. You cannot filter by `amount` in this form, so always use `FROM` when a
          function returns a table.

      - type: predict
        id: m17-l03-p1
        question: How many rows does this query return?
        sql: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER, amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT txn_id, amount
              FROM transactions
              WHERE amount <= -p_min;
          $$;

          SELECT COUNT(*) FROM big_debits(2000);
        options: ["21", "1", "0", "An error"]
        answer: 0
        explanation: |
          There are 21 transactions of 2000 dollars or more going out. The function returns them all, and
          `COUNT(*)` counts the rows it gives back.

      - type: fill
        id: m17-l03-f1
        prompt: "Complete the function so that it returns a table, and call it in FROM."
        template: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS ___ (txn_id INTEGER, amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT txn_id, amount
              FROM transactions
              WHERE amount <= -p_min;
          $$;

          SELECT txn_id, amount
          ___ big_debits(10000)
          ORDER BY txn_id;
        answers:
          - ["TABLE"]
          - ["FROM"]
        explanation: "`RETURNS TABLE(...)` names the columns. Calling the function in `FROM` makes its rows usable like a table."

      - type: parsons
        id: m17-l03-o1
        prompt: Put the lines in the right order to create a function that returns a table, then call it.
        lines:
          - CREATE FUNCTION big_debits(p_min NUMERIC)
          - "RETURNS TABLE(txn_id INTEGER, amount NUMERIC)"
          - LANGUAGE sql
          - AS $$
          - "    SELECT txn_id, amount FROM transactions WHERE amount <= -p_min;"
          - $$;
          - "SELECT * FROM big_debits(10000);"
        distractors:
          - RETURNS INTEGER
        explanation: |
          The header, the `RETURNS TABLE` line, the language, the body and the call go in that order.
          `RETURNS INTEGER` would promise one number, not a table, so it is left out.

      - type: exercise
        id: m17-l03-e1
        title: Money coming in
        prompt: |
          Write a SQL function named `big_credits` with one parameter, `p_min` (a `NUMERIC`). It returns a
          table with three columns, `txn_id` (INTEGER), `account_id` (INTEGER) and `amount` (NUMERIC). It
          returns every transaction whose `amount` is greater than or equal to `p_min`.

          Then show all of its rows for `p_min` = 20000, ordered by `txn_id`.
        starter: |
          -- 1. Write CREATE FUNCTION big_credits here.

          -- 2. Call it for 20000 here.
        solution: |
          CREATE FUNCTION big_credits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER,
                        account_id INTEGER,
                        amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT t.txn_id, t.account_id, t.amount
              FROM transactions t
              WHERE t.amount >= p_min;
          $$;

          SELECT *
          FROM big_credits(20000)
          ORDER BY txn_id;
        columnNames: true
        ordered: true
        hints:
          - It is the first example, with `>=` instead of `<=` and no minus sign.
          - Call the function with `SELECT * FROM big_credits(20000)`.
          - "Skeleton: `RETURNS TABLE(txn_id INTEGER, account_id INTEGER, amount NUMERIC) LANGUAGE sql AS $$ SELECT ___ FROM transactions WHERE amount ___ p_min; $$;`"
        explanation: |
          Money coming in is positive, so the test is `>= p_min`. Nine transactions reach 20000 or more, and
          the largest is 35550.00 on account 103.
        difficulty: 1

      - type: exercise
        id: m17-l03-e2
        title: Count the card payments
        prompt: |
          Write a SQL function named `card_payments_for` with one parameter, `p_account_id` (an INTEGER). It
          returns `SETOF transactions`: every transaction of that account whose `txn_type` is `'card_payment'`.

          Then show how many rows the function returns for account 1, as one column named `payments`.
        starter: |
          -- 1. Write CREATE FUNCTION card_payments_for here.

          -- 2. Count the rows for account 1 here.
        solution: |
          CREATE FUNCTION card_payments_for(p_account_id INTEGER)
          RETURNS SETOF transactions
          LANGUAGE sql
          AS $$
              SELECT *
              FROM transactions
              WHERE account_id = p_account_id
                AND txn_type = 'card_payment';
          $$;

          SELECT COUNT(*) AS payments
          FROM card_payments_for(1);
        columnNames: true
        hints:
          - "The return type is `SETOF transactions`, so the body must return the columns of `transactions`."
          - Count the rows with `COUNT(*)` in an outer query, using `FROM card_payments_for(1)`.
          - "Skeleton: `SELECT COUNT(*) AS payments FROM card_payments_for(___);`"
        explanation: |
          `SETOF transactions` means the function gives back whole rows of that table. Counting its results
          in `FROM` works exactly like counting rows in a table. Account 1 has 48 card payments.
        difficulty: 1

      - type: exercise
        id: m17-l03-e3
        title: The biggest debits, with PL/pgSQL
        prompt: |
          Write a PL/pgSQL function named `top_debits` with two parameters, `p_account_id` (INTEGER) and
          `p_count` (INTEGER). It returns a table with two columns, `txn_id` (INTEGER) and `amount`
          (NUMERIC). It returns the `p_count` most negative amounts (the biggest debits) of that account,
          using `RETURN QUERY`, with the most negative first.

          Then show `txn_id` and `amount` for `top_debits(1, 3)`, ordered by `amount`.
        starter: |
          -- 1. Write the PL/pgSQL top_debits function here.

          -- 2. Show the three biggest debits of account 1 here.
        solution: |
          CREATE FUNCTION top_debits(p_account_id INTEGER,
                                     p_count INTEGER)
          RETURNS TABLE(txn_id INTEGER, amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              RETURN QUERY
              SELECT t.txn_id, t.amount
              FROM transactions t
              WHERE t.account_id = p_account_id
                AND t.amount < 0
              ORDER BY t.amount
              LIMIT p_count;
          END;
          $$;

          SELECT txn_id, amount
          FROM top_debits(1, 3)
          ORDER BY amount;
        columnNames: true
        ordered: true
        hints:
          - Copy the body from the `top_debits` example, and check that it returns two columns.
          - "`ORDER BY t.amount` ascending puts the most negative amount first, so `LIMIT p_count` keeps the biggest debits."
          - "Skeleton: `BEGIN RETURN QUERY SELECT ___ FROM transactions WHERE ___ ORDER BY ___ LIMIT p_count; END;`"
        explanation: |
          Ascending order on a negative amount puts the largest debit first, which is why `LIMIT` keeps the
          right rows. Transactions 3203, 2633 and 2046 are the three biggest debits on account 1.
        difficulty: 2

      - type: exercise
        id: m17-l03-e4
        title: Name the big debits
        prompt: |
          Write a SQL function named `big_debits` with one parameter, `p_min` (NUMERIC). It returns a table
          with three columns, `txn_id`, `account_id` and `amount`. It returns every transaction whose
          `amount` is less than or equal to `-p_min`.

          Then join its rows to `accounts` and `customers`, so you can show `full_name`, `txn_id` and
          `amount` for every debit of at least 2000, ordered by `txn_id`. Use the customer that owns the
          account.
        starter: |
          -- 1. Write CREATE FUNCTION big_debits here.

          -- 2. Join it to accounts and customers here.
        solution: |
          CREATE FUNCTION big_debits(p_min NUMERIC)
          RETURNS TABLE(txn_id INTEGER,
                        account_id INTEGER,
                        amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT t.txn_id, t.account_id, t.amount
              FROM transactions t
              WHERE t.amount <= -p_min;
          $$;

          SELECT c.full_name, b.txn_id, b.amount
          FROM big_debits(2000) b
          JOIN accounts a
            ON a.account_id = b.account_id
          JOIN customers c
            ON c.customer_id = a.customer_id
          ORDER BY b.txn_id;
        columnNames: true
        ordered: true
        hints:
          - Call the function in `FROM` with the alias `b`, then join `accounts` on `account_id`.
          - Then join `customers` on `customer_id`, using the accounts table as the bridge.
          - "Skeleton: `SELECT c.full_name, b.txn_id, b.amount FROM big_debits(2000) b JOIN accounts a ON ___ JOIN customers c ON ___ ORDER BY b.txn_id;`"
        explanation: |
          Each function row becomes a row of the join. Joins can use the function's columns just as they would
          use a table's columns. The result has 21 rows, and the customer names come from `customers`.
        difficulty: 2

      - type: exercise
        id: m17-l03-e5
        title: Rich savings accounts
        prompt: |
          Write a PL/pgSQL function named `balances_by_type` with one parameter, `p_type` (TEXT). It returns a
          table with two columns, `account_id` (INTEGER) and `balance` (NUMERIC). It returns one row for each
          account of type `p_type` that has transactions. `balance` is the sum of that account's `amount`
          values, rounded to 2 decimals. Use `RETURN QUERY`.

          Then show `account_id` and `balance` for the savings accounts (`'savings'`) whose balance is above
          25000, ordered by `account_id`.
        starter: |
          -- 1. Write the PL/pgSQL balances_by_type function here.

          -- 2. Show the rich savings accounts here.
        solution: |
          CREATE FUNCTION balances_by_type(p_type TEXT)
          RETURNS TABLE(account_id INTEGER, balance NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              RETURN QUERY
              SELECT a.account_id, ROUND(SUM(t.amount), 2)
              FROM accounts a
              JOIN transactions t
                ON t.account_id = a.account_id
              WHERE a.account_type = p_type
              GROUP BY a.account_id;
          END;
          $$;

          SELECT account_id, balance
          FROM balances_by_type('savings')
          WHERE balance > 25000
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - Group by the account, and sum the transactions of each one inside `RETURN QUERY`.
          - Filter on `a.account_type = p_type` inside the function, and on `balance > 25000` outside it.
          - "Skeleton: `RETURN QUERY SELECT a.account_id, ROUND(SUM(t.amount), 2) FROM accounts a JOIN transactions t ON ___ WHERE ___ GROUP BY ___;`"
        explanation: |
          The function does the grouping, and the outer query filters the result like any table. Three savings
          accounts are above 25000: accounts 32, 53 and 103. The filter on `balance` happens outside the
          function, so the function can be reused for any threshold.
        difficulty: 3

    cheatsheet:
      - title: Return a table with named columns
        sql: |
          CREATE FUNCTION name(p_x INTEGER)
          RETURNS TABLE(id INTEGER, amount NUMERIC)
          LANGUAGE sql
          AS $$
              SELECT txn_id, amount FROM transactions;
          $$;
        note: The column names in RETURNS TABLE are the names the caller sees.
      - title: Return the rows of a table
        sql: |
          CREATE FUNCTION card_rows(p_id INTEGER)
          RETURNS SETOF transactions
          LANGUAGE sql
          AS $$ SELECT * FROM transactions WHERE account_id = p_id; $$;
        note: SETOF table_name gives back whole rows of that table.
      - title: Call a set-returning function
        sql: |
          SELECT * FROM big_debits(10000);
        note: Always use FROM. SELECT big_debits(...) gives one packed column.
  - id: m17-l04
    title: "Procedures: jobs that can COMMIT"
    summary: Write a procedure that does a piece of work, and learn when it may save or undo its own changes.
    minutes: 28
    steps:
      - type: read
        title: Some work is a job, not a question
        md: |
          Every month, Harbor Bank posts a fee to every account in a branch. That is a **job**: insert a row
          for each account, check the work, and save it. A function is good at answering a question, like
          "what is the balance?". For a job that changes data, PostgreSQL has a second tool: a **procedure**.

          > [!ANALOGY]
          > A function is a calculator: you press it and it shows an answer. A procedure is a clerk: you give
          > them a task, they do the paperwork, and at the end they sign it off, which is the `COMMIT`.

      - type: read
        title: Functions and procedures side by side
        md: |
          | | function | procedure |
          |---|---|---|
          | how you call it | `SELECT f(...)` or in `FROM` | `CALL p(...);` |
          | returns | a value or a table | nothing, or values through `OUT` parameters |
          | used inside a query | yes | no |
          | can use `COMMIT` or `ROLLBACK` inside | no | yes |

          Rule of thumb: use a function to **answer** something, and a procedure to **do** something.

      - type: example
        title: A procedure that posts a fee
        md: |
          Press **Run**. The procedure adds one fee row for the account you name, then `COMMIT` saves it.
          `CALL` runs it, and the last query shows the row that was added.
        sql: |
          CREATE PROCEDURE post_fee(p_account_id INTEGER,
                                    p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   p_account_id, '2025-01-02 09:00:00',
                   -p_amount, 'fee', 'Manual fee');
              COMMIT;
          END;
          $$;

          CALL post_fee(2, 15.00);

          SELECT txn_id, account_id, amount, txn_type
          FROM transactions
          WHERE txn_id = (SELECT MAX(txn_id) FROM transactions);
        after: |
          The new row is transaction **3675**: account 2, amount **-15.00**, type `fee`. `CALL` does not
          return rows, so the final `SELECT` is the one that shows the result.

          `(SELECT MAX(txn_id) + 1 FROM transactions)` gives the next free number. It works here because the
          table has 3,674 rows, numbered 1 to 3674.

      - type: read
        title: COMMIT and ROLLBACK inside a procedure
        md: |
          A procedure can finish a piece of work with `COMMIT`, which saves everything it did so far. It can
          also use `ROLLBACK`, which throws away everything since the last `COMMIT` or since the start of the
          call.

          This is useful for long jobs: a procedure can save each branch as it goes, so a crash later does not
          lose the earlier branches.

          > [!MISTAKE]
          > A procedure can only `COMMIT` when it is called directly. If you wrap the `CALL` in your own
          > `BEGIN` block, PostgreSQL refuses. The example below shows the error.

      - type: example
        title: A transfer that is saved as one job
        md: |
          This procedure moves money from one account to another. It writes both halves of the transfer and
          then saves them with one `COMMIT`.
        sql: |
          CREATE PROCEDURE transfer_money(p_from INTEGER,
                                          p_to INTEGER,
                                          p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   p_from, '2025-01-02 09:00:00',
                   -p_amount, 'transfer_out', 'Transfer'),
                  ((SELECT MAX(txn_id) + 2 FROM transactions),
                   p_to, '2025-01-02 09:00:00',
                   p_amount, 'transfer_in', 'Transfer');
              COMMIT;
          END;
          $$;

          CALL transfer_money(1, 2, 50.00);

          SELECT account_id,
                 ROUND(SUM(amount), 2) AS balance
          FROM transactions
          WHERE account_id IN (1, 2)
          GROUP BY account_id
          ORDER BY account_id;
        after: |
          Account 1 went from 260.79 to **210.79**, and account 2 went from 6983.12 to **7033.12**. Both halves
          of the transfer were saved together, by a single `COMMIT`.

      - type: example
        title: A procedure cannot be used in SELECT
        md: Run it. The procedure is correct, but it is called the wrong way.
        sql: |
          CREATE PROCEDURE post_fee(p_account_id INTEGER,
                                    p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   p_account_id, '2025-01-02 09:00:00',
                   -p_amount, 'fee', 'Manual fee');
              COMMIT;
          END;
          $$;

          SELECT post_fee(2, 15.00);
        expectError: true
        after: |
          The hint says it plainly: `post_fee` is a procedure, so you call it with `CALL`, not `SELECT`.
          Procedures are never used inside a query. Functions are, because they return a value.

      - type: example
        title: A function cannot COMMIT
        md: Run it. A function is not allowed to save work by itself.
        sql: |
          CREATE FUNCTION save_now()
          RETURNS VOID
          LANGUAGE plpgsql
          AS $$
          BEGIN
              COMMIT;
          END;
          $$;

          SELECT save_now();
        expectError: true
        after: |
          `invalid transaction termination` means the function tried to end the transaction. Only a
          procedure may do that. If a job needs `COMMIT`, write it as a procedure.

      - type: read
        title: "OUT parameters: giving a value back"
        md: |
          A procedure cannot return a value with `RETURN`, but it can have **`OUT` parameters**. An `OUT`
          parameter is a box the procedure fills in. When you call the procedure, the boxes come back as the
          result of `CALL`.

      - type: example
        title: A procedure with an OUT parameter
        md: This procedure counts how many money-out transactions an account has. The count is an `OUT` value.
        sql: |
          CREATE PROCEDURE count_debits(IN p_account_id INTEGER,
                                        OUT p_count BIGINT)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              SELECT COUNT(*) INTO p_count
              FROM transactions
              WHERE account_id = p_account_id
                AND amount < 0;
          END;
          $$;

          CALL count_debits(1, NULL);
        after: |
          The result has one column, `p_count`, with the value **52**. The `NULL` in the call is a placeholder
          for the `OUT` box, because the caller does not know the value yet.

      - type: example
        title: Undoing a change inside a procedure
        md: |
          This procedure inserts a fee row, then decides to undo it with `ROLLBACK`. We count the rows before
          and after the call.
        sql: |
          CREATE PROCEDURE undo_demo()
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   2, '2025-01-02 09:00:00',
                   -1.00, 'fee', 'Test fee');
              ROLLBACK;
          END;
          $$;

          SELECT COUNT(*) AS before_call FROM transactions;
          CALL undo_demo();
          SELECT COUNT(*) AS after_call FROM transactions;
        after: |
          Both counts are **3674**. The fee row was added and then removed by `ROLLBACK`, so the table is
          exactly as it was before the call.

      - type: quiz
        id: m17-l04-q1
        question: Which kind of routine can use COMMIT inside its own body?
        options: [A SQL function, A procedure, A view, A query with WHERE]
        answer: 1
        explanation: |
          A procedure is the routine that can save or undo its own work. Functions cannot end the
          transaction, and views and queries have no body to run.

      - type: predict
        id: m17-l04-p1
        question: How many rows are in `notes` after the procedure and the final `SELECT`?
        sql: |
          CREATE TABLE notes (n INTEGER);

          CREATE PROCEDURE add_then_undo()
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO notes VALUES (1), (2);
              ROLLBACK;
              INSERT INTO notes VALUES (3);
          END;
          $$;

          CALL add_then_undo();
          SELECT COUNT(*) FROM notes;
        options: ["1", "3", "2", "0"]
        answer: 0
        explanation: |
          The two rows are rolled back, so they are gone. The procedure then inserts row 3 in a new
          transaction, which is the only row left.

      - type: fill
        id: m17-l04-f1
        prompt: "Complete the statement that runs the procedure. Remember: procedures are not called with SELECT."
        template: |
          CREATE PROCEDURE reactivate(p_account_id INTEGER)
          LANGUAGE sql
          AS $$
              UPDATE accounts
              SET status = 'active'
              WHERE account_id = p_account_id;
          $$;

          ___ reactivate(5);
        answers:
          - ["CALL"]
        explanation: "`CALL` is the only way to run a procedure. The word `SELECT` is for functions."

      - type: parsons
        id: m17-l04-o1
        prompt: Put the lines in the right order to create a procedure that saves its work, then call it.
        lines:
          - CREATE PROCEDURE post_fee(p_account_id INTEGER, p_amount NUMERIC)
          - LANGUAGE plpgsql
          - AS $$
          - BEGIN
          - "    INSERT INTO transactions (txn_id, account_id, txn_time, amount, txn_type, description)"
          - "    VALUES ((SELECT MAX(txn_id) + 1 FROM transactions), p_account_id, '2025-01-02 09:00:00', -p_amount, 'fee', 'Manual fee');"
          - "    COMMIT;"
          - END;
          - $$;
          - CALL post_fee(2, 15.00);
        distractors:
          - "    ROLLBACK;"
        explanation: |
          The insert happens first, then `COMMIT` saves it, then `END;` closes the body and `CALL` runs it. The
          `ROLLBACK` would undo the fee, so it is left out.

      - type: exercise
        id: m17-l04-e1
        title: Post a bank fee
        prompt: |
          Write a procedure named `add_bank_fee` with two parameters, `p_account_id` (INTEGER) and `p_amount`
          (NUMERIC). It inserts one row into `transactions`:

          - `txn_id`: the largest existing `txn_id` plus 1
          - `account_id`: `p_account_id`
          - `txn_time`: `'2025-01-02 09:00:00'`
          - `amount`: `-p_amount`
          - `txn_type`: `'fee'`
          - `description`: `'Bank fee'`

          It then runs `COMMIT`.

          Then call it for account 3 with 12.50, and show `txn_id`, `account_id`, `amount` and `txn_type` for
          `txn_id` 3675.
        starter: |
          -- 1. Write CREATE PROCEDURE add_bank_fee here.

          -- 2. Call it for account 3 with 12.50, then show txn 3675 here.
        solution: |
          CREATE PROCEDURE add_bank_fee(p_account_id INTEGER,
                                        p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   p_account_id, '2025-01-02 09:00:00',
                   -p_amount, 'fee', 'Bank fee');
              COMMIT;
          END;
          $$;

          CALL add_bank_fee(3, 12.50);

          SELECT txn_id, account_id, amount, txn_type
          FROM transactions
          WHERE txn_id = 3675;
        columnNames: true
        hints:
          - It is the procedure from the example, with a different description.
          - Use `CALL add_bank_fee(3, 12.50);` before the `SELECT`.
          - "Skeleton: `CREATE PROCEDURE add_bank_fee(p_account_id INTEGER, p_amount NUMERIC) LANGUAGE plpgsql AS $$ BEGIN INSERT INTO transactions ... VALUES (___, p_account_id, ..., -p_amount, 'fee', 'Bank fee'); COMMIT; END; $$;`"
        explanation: |
          `CALL` runs the procedure, and the fee is saved by the `COMMIT` inside it. Because the procedure
          returns nothing, the final `SELECT` checks the result.
        difficulty: 1

      - type: exercise
        id: m17-l04-e2
        title: Close the account with CALL
        prompt: |
          The procedure `close_account` already exists (hidden setup). It takes one account number and sets its
          `status` to `'closed'`.

          The starter calls it the wrong way. Fix it, call `close_account` for account 7, and then show
          `account_id` and `status` for account 7.
        setup: |
          CREATE PROCEDURE close_account(p_account_id INTEGER)
          LANGUAGE sql
          AS $$
              UPDATE accounts
              SET status = 'closed'
              WHERE account_id = p_account_id;
          $$;
        starter: |
          SELECT close_account(7);

          SELECT account_id, status
          FROM accounts
          WHERE account_id = 7;
        solution: |
          CALL close_account(7);

          SELECT account_id, status
          FROM accounts
          WHERE account_id = 7;
        columnNames: true
        hints:
          - A procedure cannot be called with `SELECT`. Which keyword is used for procedures?
          - Replace `SELECT close_account(7);` with the keyword for procedures.
          - "Skeleton: `___ close_account(7);`"
        explanation: |
          Only `CALL` may run a procedure. Once it runs, account 7 shows `closed`. The starter fails with
          the same error as the example, which is a good way to remember the rule.
        difficulty: 1

      - type: exercise
        id: m17-l04-e3
        title: Transfer with two rows
        prompt: |
          Write a procedure named `transfer_money` with three parameters: `p_from` (INTEGER), `p_to` (INTEGER)
          and `p_amount` (NUMERIC). In one `INSERT ... VALUES` statement it adds two rows to `transactions`
          with `txn_time` `'2025-01-02 09:00:00'` and `description` `'Transfer'`:

          - the outgoing row for `p_from`: `txn_type` `'transfer_out'`, amount `-p_amount`, and
            `txn_id` = `(SELECT MAX(txn_id) + 1 FROM transactions)`
          - the incoming row for `p_to`: `txn_type` `'transfer_in'`, amount `p_amount`, and
            `txn_id` = `(SELECT MAX(txn_id) + 2 FROM transactions)`

          The procedure then runs `COMMIT`.

          Then call `transfer_money(1, 2, 50.00)` and show `account_id` and `balance` (the rounded sum of
          `amount`) for accounts 1 and 2, ordered by `account_id`.
        starter: |
          -- 1. Write CREATE PROCEDURE transfer_money here.

          -- 2. Call it and show the balances here.
        solution: |
          CREATE PROCEDURE transfer_money(p_from INTEGER,
                                          p_to INTEGER,
                                          p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO transactions
                  (txn_id, account_id, txn_time, amount,
                   txn_type, description)
              VALUES
                  ((SELECT MAX(txn_id) + 1 FROM transactions),
                   p_from, '2025-01-02 09:00:00',
                   -p_amount, 'transfer_out', 'Transfer'),
                  ((SELECT MAX(txn_id) + 2 FROM transactions),
                   p_to, '2025-01-02 09:00:00',
                   p_amount, 'transfer_in', 'Transfer');
              COMMIT;
          END;
          $$;

          CALL transfer_money(1, 2, 50.00);

          SELECT account_id,
                 ROUND(SUM(amount), 2) AS balance
          FROM transactions
          WHERE account_id IN (1, 2)
          GROUP BY account_id
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - Copy the transfer example, and check the IDs and the two signs.
          - Both `MAX` subqueries in the same `VALUES` see the same table, so `+ 1` and `+ 2` give two different numbers.
          - "Skeleton: `INSERT INTO transactions (...) VALUES (MAX+1, p_from, ..., -p_amount, 'transfer_out', 'Transfer'), (MAX+2, p_to, ..., p_amount, 'transfer_in', 'Transfer'); COMMIT;`"
        explanation: |
          Account 1 goes from 260.79 to 210.79, and account 2 goes from 6983.12 to 7033.12. Two rows, one
          `COMMIT`, so the money moves as one job.
        difficulty: 2

      - type: exercise
        id: m17-l04-e4
        title: Return a count through OUT
        prompt: |
          Write a procedure named `count_debits` with two parameters: `p_account_id` (`IN`, INTEGER) and
          `p_count` (`OUT`, BIGINT). It sets `p_count` to the number of transactions of that account whose
          `amount` is below zero.

          Then call it for account 1 with `CALL count_debits(1, NULL);`.
        starter: |
          -- 1. Write CREATE PROCEDURE count_debits here.

          -- 2. Call it for account 1 here.
        solution: |
          CREATE PROCEDURE count_debits(IN p_account_id INTEGER,
                                        OUT p_count BIGINT)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              SELECT COUNT(*) INTO p_count
              FROM transactions
              WHERE account_id = p_account_id
                AND amount < 0;
          END;
          $$;

          CALL count_debits(1, NULL);
        columnNames: true
        hints:
          - The `OUT` parameter is filled with `SELECT ... INTO p_count`, just like a variable.
          - "The `CALL` returns one row, with the `OUT` value in a column named after the parameter."
          - "Skeleton: `CREATE PROCEDURE count_debits(IN p_account_id INTEGER, OUT p_count BIGINT) LANGUAGE plpgsql AS $$ BEGIN SELECT COUNT(*) INTO p_count FROM transactions WHERE ___; END; $$;`"
        explanation: |
          Account 1 has 52 transactions below zero. An `OUT` parameter works like a variable that the caller
          can read after `CALL`. Use `NULL` for it in the call, because the caller only receives the value.
        difficulty: 2

      - type: exercise
        id: m17-l04-e5
        title: A fee for every account in a branch
        prompt: |
          Write a procedure named `post_branch_fees` with two parameters: `p_branch_id` (INTEGER) and
          `p_amount` (NUMERIC). It loops over every account with `branch_id = p_branch_id`. For each
          account it inserts one fee row into `transactions`:

          - `txn_id`: the largest existing `txn_id` plus 1, computed for each new row
          - `account_id`: the account from the loop
          - `txn_time`: `'2025-01-02 09:00:00'`
          - `amount`: `-p_amount`
          - `txn_type`: `'fee'`
          - `description`: `'Monthly fee'`

          After the loop, the procedure runs `COMMIT`.

          Then call `post_branch_fees(5, 2.00)` and count the rows with `description` `'Monthly fee'`, as one
          column named `fees`.
        starter: |
          -- 1. Write CREATE PROCEDURE post_branch_fees here.

          -- 2. Call it for branch 5 and count the fees here.
        solution: |
          CREATE PROCEDURE post_branch_fees(p_branch_id INTEGER,
                                            p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          DECLARE
              r RECORD;
          BEGIN
              FOR r IN SELECT account_id
                       FROM accounts
                       WHERE branch_id = p_branch_id
                       ORDER BY account_id LOOP
                  INSERT INTO transactions
                      (txn_id, account_id, txn_time, amount,
                       txn_type, description)
                  VALUES
                      ((SELECT MAX(txn_id) + 1 FROM transactions),
                       r.account_id, '2025-01-02 09:00:00',
                       -p_amount, 'fee', 'Monthly fee');
              END LOOP;
              COMMIT;
          END;
          $$;

          CALL post_branch_fees(5, 2.00);

          SELECT COUNT(*) AS fees
          FROM transactions
          WHERE description = 'Monthly fee';
        columnNames: true
        hints:
          - Use a `FOR r IN SELECT account_id ... LOOP`, then an `INSERT` inside the loop.
          - The `MAX(txn_id)` subquery runs again for each new row, so each fee gets a new number.
          - "Skeleton: `FOR r IN SELECT account_id FROM accounts WHERE ___ LOOP INSERT INTO transactions ... VALUES ((SELECT MAX(txn_id) + 1 FROM transactions), r.account_id, ...); END LOOP; COMMIT;`"
        explanation: |
          Branch 5 has 19 accounts, so the procedure adds 19 fee rows, one per account. The `COMMIT` after the
          loop saves them all together.
        difficulty: 3

    cheatsheet:
      - title: Create and call a procedure
        sql: |
          CREATE PROCEDURE post_fee(p_account_id INTEGER, p_amount NUMERIC)
          LANGUAGE plpgsql
          AS $$
          BEGIN
              -- your steps here
              COMMIT;
          END;
          $$;

          CALL post_fee(2, 15.00);
        note: Use CALL, never SELECT. A procedure may COMMIT or ROLLBACK.
      - title: Return values with OUT
        sql: |
          CREATE PROCEDURE count_debits(IN p_account_id INTEGER,
                                        OUT p_count BIGINT)
          LANGUAGE plpgsql
          AS $$ BEGIN SELECT COUNT(*) INTO p_count FROM transactions; END; $$;

          CALL count_debits(1, NULL);
        note: The OUT value comes back as a column of the CALL result.
      - title: Procedure or function?
        sql: |
          SELECT some_function(1);   -- a function answers a question
          CALL some_procedure(1);    -- a procedure does a job
        note: A function cannot COMMIT. A procedure cannot be used inside a query.
  - id: m17-l05
    title: "Triggers: rules that run by themselves"
    summary: Write functions that run automatically when rows change, to keep an audit trail, timestamps and safety rules.
    minutes: 30
    steps:
      - type: read
        title: Nobody has to remember
        md: |
          At Harbor Bank, every change to an account should leave a record: who changed what, and when. If
          that depends on each analyst remembering to write the record, sooner or later someone forgets. A
          **trigger** makes the rule automatic. It is a function that PostgreSQL runs **by itself** each time
          a row is inserted, updated or deleted.

          > [!ANALOGY]
          > A trigger is like the motion sensor that turns on a light when someone walks in. Nobody has to
          > press a switch, and nobody can walk in without it happening.

      - type: read
        title: The two parts of a trigger
        md: |
          A trigger is made of two things:

          1. a **trigger function**, which contains the steps and must `RETURNS TRIGGER`,
          2. a **trigger**, which says when to run that function.

          The trigger says:

          | part | choices | meaning |
          |---|---|---|
          | when | `BEFORE` or `AFTER` | before the change is saved, or after it |
          | what | `INSERT`, `UPDATE`, `DELETE` | which change starts it |
          | how often | `FOR EACH ROW` or `FOR EACH STATEMENT` | once per changed row, or once per statement |

      - type: example
        title: An audit trail that writes itself
        md: |
          Press **Run**. The trigger writes one line to `audit_log` each time an account row is updated. We
          then change one account's status with a normal `UPDATE`.
        sql: |
          CREATE TABLE audit_log (
              audit_id INTEGER GENERATED ALWAYS AS IDENTITY
                  PRIMARY KEY,
              table_name TEXT,
              action TEXT,
              row_key TEXT
          );

          CREATE FUNCTION log_account_update()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO audit_log (table_name, action, row_key)
              VALUES ('accounts', TG_OP, OLD.account_id::TEXT);
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER accounts_audit
          AFTER UPDATE ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION log_account_update();

          UPDATE accounts
          SET status = 'frozen'
          WHERE account_id = 5;

          SELECT audit_id, table_name, action, row_key
          FROM audit_log;
        after: |
          The `UPDATE` never mentioned the audit table, but the log has one line: table `accounts`, action
          **UPDATE**, row key **5**. The trigger ran by itself.

      - type: read
        title: "NEW and OLD: the row before and after"
        md: |
          Inside a row trigger, PostgreSQL gives you two records:

          - **`OLD`**: the row as it was **before** the change (for `UPDATE` and `DELETE`),
          - **`NEW`**: the row as it will be **after** the change (for `INSERT` and `UPDATE`).

          Use `NEW.column_name` or `OLD.column_name` to read a column. `TG_OP` tells you which operation
          started the trigger: `'INSERT'`, `'UPDATE'` or `'DELETE'`.

          > [!TIP]
          > `OLD.account_id::TEXT` in the example turns the number into text, because the log's `row_key`
          > column is text. The `::` symbol is a short way to write a cast.

      - type: read
        title: A BEFORE trigger can change the new row
        md: |
          A `BEFORE` trigger runs before the change is saved, so it can **edit** `NEW`. This is how you keep a
          "last changed" column up to date without asking anyone. The trigger must `RETURN NEW;` so the
          change continues with the edited row.

          > [!MISTAKE]
          > Every row trigger must end with `RETURN`. A `BEFORE` trigger that forgets `RETURN NEW;` stops with
          > the error *control reached end of trigger procedure without RETURN*. Exercise 2 of this lesson shows the fix.

      - type: example
        title: A timestamp that stamps itself
        md: |
          We add an `updated_at` column, then a `BEFORE UPDATE` trigger fills it in. Only the account we
          changed gets a timestamp.
        sql: |
          ALTER TABLE accounts
              ADD COLUMN updated_at TIMESTAMP;

          CREATE FUNCTION stamp_account()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              NEW.updated_at := CURRENT_TIMESTAMP;
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER accounts_stamp
          BEFORE UPDATE ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION stamp_account();

          UPDATE accounts
          SET status = 'frozen'
          WHERE account_id = 5;

          SELECT account_id, status,
                 updated_at IS NOT NULL AS stamped
          FROM accounts
          WHERE account_id IN (4, 5)
          ORDER BY account_id;
        after: |
          Account 5 was updated, so it has a timestamp: **true**. Account 4 was not touched, so it stays
          **false**. The exact time is different on each run, so we only check whether it is filled in.

      - type: read
        title: Preventing a bad change
        md: |
          A `BEFORE` trigger can also **refuse** a change. It checks the new values, and if they break a
          business rule, it calls `RAISE EXCEPTION`. The change is cancelled, and the whole statement is undone,
          so the table never holds the bad value.

      - type: example
        title: A transaction of zero dollars is refused
        md: Run it. A zero-value transaction is not allowed at Harbor Bank, so the trigger stops the insert.
        sql: |
          CREATE FUNCTION block_zero_amounts()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF NEW.amount = 0 THEN
                  RAISE EXCEPTION
                      'Zero-value transactions are not allowed';
              END IF;
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER no_zero_amounts
          BEFORE INSERT ON transactions
          FOR EACH ROW
          EXECUTE FUNCTION block_zero_amounts();

          INSERT INTO transactions
              (txn_id, account_id, txn_time, amount,
               txn_type, description)
          VALUES
              (3675, 1, '2025-01-02 09:00:00',
               0.00, 'fee', 'Zero test');
        expectError: true
        after: |
          The error message is the one we wrote in `RAISE EXCEPTION`. Because the trigger ran before the row
          was saved, transaction 3675 was never added to the table.

      - type: read
        title: Once per row, or once per statement
        md: |
          A `FOR EACH ROW` trigger runs **once for every row** the statement changes. A `FOR EACH STATEMENT`
          trigger runs **once per statement**, even when the statement changes many rows. Choose the level by
          asking "do I need one record per row, or one record for the whole action?"

      - type: example
        title: Rows versus statements
        md: One `UPDATE` changes 19 accounts. We have two triggers, one per row and one per statement, and we count what each one wrote.
        sql: |
          CREATE TABLE change_log (level TEXT);

          CREATE FUNCTION log_row()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO change_log VALUES ('row');
              RETURN NULL;
          END;
          $$;

          CREATE FUNCTION log_statement()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO change_log VALUES ('statement');
              RETURN NULL;
          END;
          $$;

          CREATE TRIGGER accounts_row_log
          AFTER UPDATE ON accounts
          FOR EACH ROW EXECUTE FUNCTION log_row();

          CREATE TRIGGER accounts_stmt_log
          AFTER UPDATE ON accounts
          FOR EACH STATEMENT EXECUTE FUNCTION log_statement();

          UPDATE accounts
          SET status = 'active'
          WHERE branch_id = 5;

          SELECT level, COUNT(*) AS entries
          FROM change_log
          GROUP BY level
          ORDER BY level;
        after: |
          The row trigger wrote **19** entries, one for each account in branch 5. The statement trigger wrote
          **1** entry for the whole `UPDATE`. An AFTER trigger's return value is ignored, so `RETURN NULL` is
          a safe choice.

      - type: quiz
        id: m17-l05-q1
        question: Which timing lets a trigger change the NEW row before it is saved?
        options: [AFTER, BEFORE, FOR EACH STATEMENT, DELETE]
        answer: 1
        explanation: |
          A `BEFORE` trigger runs before the change is saved, so it can edit `NEW`. An `AFTER` trigger runs once
          the row is already saved, so it can only read the row and react to it.

      - type: predict
        id: m17-l05-p1
        question: How many rows does `change_log` contain after the `UPDATE`? (Branch 1 has 33 accounts.)
        sql: |
          CREATE TABLE change_log (level TEXT);

          CREATE FUNCTION log_each()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO change_log VALUES ('row');
              RETURN NULL;
          END;
          $$;

          CREATE FUNCTION log_once()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO change_log VALUES ('statement');
              RETURN NULL;
          END;
          $$;

          CREATE TRIGGER each_row AFTER UPDATE ON accounts
              FOR EACH ROW EXECUTE FUNCTION log_each();
          CREATE TRIGGER once_per_stmt AFTER UPDATE ON accounts
              FOR EACH STATEMENT EXECUTE FUNCTION log_once();

          UPDATE accounts
          SET status = 'active'
          WHERE branch_id = 1;

          SELECT COUNT(*) FROM change_log;
        options: ["34", "33", "1", "2"]
        answer: 0
        explanation: |
          The row trigger writes one entry for each of the 33 accounts, and the statement trigger writes one
          more for the whole `UPDATE`. 33 + 1 = 34.

      - type: fill
        id: m17-l05-f1
        prompt: Complete the trigger so that it runs after each new row is inserted into `notes`.
        template: |
          CREATE TABLE notes (n INTEGER);
          CREATE TABLE note_log (msg TEXT);

          CREATE FUNCTION log_note()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO note_log VALUES ('added');
              RETURN NULL;
          END;
          $$;

          CREATE TRIGGER note_added
          ___ INSERT ON ___
          FOR EACH ROW EXECUTE FUNCTION log_note();

          INSERT INTO notes VALUES (1), (2);
          SELECT COUNT(*) AS logged FROM note_log;
        answers:
          - ["AFTER"]
          - ["notes"]
        explanation: |
          `AFTER INSERT ON notes` runs the trigger once for each inserted row. Two rows were inserted, so
          the log has two entries.

      - type: parsons
        id: m17-l05-o1
        prompt: Put the lines in the right order to add an updated_at stamp to accounts, change one account, and count the stamped rows.
        lines:
          - ALTER TABLE accounts ADD COLUMN updated_at TIMESTAMP;
          - CREATE FUNCTION stamp_account() RETURNS TRIGGER LANGUAGE plpgsql AS $$
          - BEGIN
          - "    NEW.updated_at := CURRENT_TIMESTAMP;"
          - "    RETURN NEW;"
          - END;
          - $$;
          - CREATE TRIGGER accounts_stamp BEFORE UPDATE ON accounts
          - FOR EACH ROW EXECUTE FUNCTION stamp_account();
          - UPDATE accounts SET status = 'frozen' WHERE account_id = 5;
          - SELECT COUNT(*) AS stamped FROM accounts WHERE updated_at IS NOT NULL;
        distractors:
          - "    RETURN NULL;"
        explanation: |
          The column must exist before the trigger uses it. The function and trigger come next, then the
          `UPDATE` fires the trigger. The final query counts the one stamped account.

      - type: exercise
        id: m17-l05-e1
        title: Log every overdraft change
        prompt: |
          The table `limit_changes` already exists (hidden setup). It has three columns: `account_id`,
          `old_limit` and `new_limit`.

          Write a trigger function named `log_limit_change`, and an AFTER trigger named `limit_audit` on
          `accounts`. The trigger fires `FOR EACH ROW` when `overdraft_limit` is updated. It inserts one row
          into `limit_changes` with the account id, the old limit and the new limit.

          Then run `UPDATE accounts SET overdraft_limit = 1000.00 WHERE account_id = 1;` and show `account_id`,
          `old_limit` and `new_limit` from `limit_changes`.
        setup: |
          CREATE TABLE limit_changes (
              account_id INTEGER,
              old_limit NUMERIC,
              new_limit NUMERIC
          );
        starter: |
          -- 1. Write the trigger function and trigger here.

          -- 2. Update account 1 and show the log here.
        solution: |
          CREATE FUNCTION log_limit_change()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO limit_changes
                  (account_id, old_limit, new_limit)
              VALUES
                  (OLD.account_id, OLD.overdraft_limit,
                   NEW.overdraft_limit);
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER limit_audit
          AFTER UPDATE OF overdraft_limit ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION log_limit_change();

          UPDATE accounts
          SET overdraft_limit = 1000.00
          WHERE account_id = 1;

          SELECT account_id, old_limit, new_limit
          FROM limit_changes;
        columnNames: true
        hints:
          - It is the audit example from this lesson, but it logs `overdraft_limit` instead of the status.
          - Put `OLD.overdraft_limit` and `NEW.overdraft_limit` in the insert.
          - "Skeleton: `CREATE TRIGGER limit_audit AFTER UPDATE OF overdraft_limit ON accounts FOR EACH ROW EXECUTE FUNCTION log_limit_change();`"
        explanation: |
          `OLD` holds the limit before the update (0.00) and `NEW` holds it after (1000.00). `AFTER UPDATE OF
          overdraft_limit` fires only when that column is part of the update.
        difficulty: 1

      - type: exercise
        id: m17-l05-e2
        title: Fix the missing line
        prompt: |
          The starter below should turn every new branch's city into upper case, for example `seattle` into
          `SEATTLE`. Running it gives an error. Find the missing line in the trigger function and fix it. Do not
          change the table, the trigger or the final query.
        starter: |
          CREATE TABLE sample_branches (name TEXT, city TEXT);

          CREATE FUNCTION upper_city()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              NEW.city := UPPER(NEW.city);
          END;
          $$;

          CREATE TRIGGER upper_city_trg
          BEFORE INSERT ON sample_branches
          FOR EACH ROW
          EXECUTE FUNCTION upper_city();

          INSERT INTO sample_branches VALUES ('Test', 'seattle');

          SELECT name, city FROM sample_branches;
        solution: |
          CREATE TABLE sample_branches (name TEXT, city TEXT);

          CREATE FUNCTION upper_city()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              NEW.city := UPPER(NEW.city);
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER upper_city_trg
          BEFORE INSERT ON sample_branches
          FOR EACH ROW
          EXECUTE FUNCTION upper_city();

          INSERT INTO sample_branches VALUES ('Test', 'seattle');

          SELECT name, city FROM sample_branches;
        columnNames: true
        hints:
          - The error says the function ended without a `RETURN`. What must a `BEFORE` row trigger return?
          - A `BEFORE` row trigger has to hand back the row, so add `RETURN NEW;` after the assignment line.
          - "Skeleton: `NEW.city := UPPER(NEW.city); ___ NEW;`"
        explanation: |
          Every row trigger must end with `RETURN`. In a `BEFORE` trigger, `RETURN NEW;` passes the edited row
          on to be saved. Without it, PostgreSQL does not know which row to save, and it stops with an error.
        difficulty: 1

      - type: exercise
        id: m17-l05-e3
        title: Stamp only the changed accounts
        prompt: |
          The column `updated_at` has been added to `accounts` (hidden setup).

          Write a trigger function named `stamp_account` and a `BEFORE UPDATE` trigger named `accounts_stamp`
          on `accounts`, `FOR EACH ROW`. The function sets `NEW.updated_at` to `CURRENT_TIMESTAMP` and returns
          the new row.

          Then run `UPDATE accounts SET status = 'frozen' WHERE account_id = 4;` and show `account_id` and
          whether `updated_at` is filled in (`stamped`, true or false) for accounts 4 and 5, ordered by
          `account_id`.
        setup: |
          ALTER TABLE accounts ADD COLUMN updated_at TIMESTAMP;
        starter: |
          -- 1. Write the trigger function and trigger here.

          -- 2. Update account 4 and show accounts 4 and 5 here.
        solution: |
          CREATE FUNCTION stamp_account()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              NEW.updated_at := CURRENT_TIMESTAMP;
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER accounts_stamp
          BEFORE UPDATE ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION stamp_account();

          UPDATE accounts
          SET status = 'frozen'
          WHERE account_id = 4;

          SELECT account_id,
                 updated_at IS NOT NULL AS stamped
          FROM accounts
          WHERE account_id IN (4, 5)
          ORDER BY account_id;
        columnNames: true
        ordered: true
        hints:
          - "The function is the same as in the example: one line that sets `NEW.updated_at`, then `RETURN NEW;`."
          - "`updated_at IS NOT NULL` is true only after the trigger has filled it in."
          - "Skeleton: `CREATE TRIGGER accounts_stamp BEFORE UPDATE ON accounts FOR EACH ROW EXECUTE FUNCTION stamp_account();`"
        explanation: |
          The trigger runs only for rows that are actually updated, so account 5 keeps a NULL timestamp. Checking
          `IS NOT NULL` instead of the time itself keeps the answer the same every time you run it.
        difficulty: 2

      - type: exercise
        id: m17-l05-e4
        title: Correct a negative limit
        prompt: |
          Write a trigger function named `no_negative_limit` and a `BEFORE UPDATE OF overdraft_limit` trigger
          named `limit_floor` on `accounts`, `FOR EACH ROW`. Instead of refusing the change, the trigger should
          correct it: if `NEW.overdraft_limit` is below 0, set it to 0. Then return the new row.

          Then run `UPDATE accounts SET overdraft_limit = -100.00 WHERE account_id = 2;` and show `account_id`
          and `overdraft_limit` for account 2.
        starter: |
          -- 1. Write the trigger function and trigger here.

          -- 2. Update account 2 and show it here.
        solution: |
          CREATE FUNCTION no_negative_limit()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF NEW.overdraft_limit < 0 THEN
                  NEW.overdraft_limit := 0;
              END IF;
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER limit_floor
          BEFORE UPDATE OF overdraft_limit ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION no_negative_limit();

          UPDATE accounts
          SET overdraft_limit = -100.00
          WHERE account_id = 2;

          SELECT account_id, overdraft_limit
          FROM accounts
          WHERE account_id = 2;
        columnNames: true
        hints:
          - Use an `IF` inside the function, comparing `NEW.overdraft_limit` with 0.
          - Assign the corrected value with `NEW.overdraft_limit := 0;` and always finish with `RETURN NEW;`.
          - "Skeleton: `IF NEW.overdraft_limit < 0 THEN NEW.overdraft_limit := ___; END IF; RETURN ___;`"
        explanation: |
          A `BEFORE` trigger can fix a value instead of refusing it. The row is saved with 0.00, not -100.00.
          Account 2 had 500.00 before the update, so the change shows the trigger worked.
        difficulty: 2

      - type: exercise
        id: m17-l05-e5
        title: Keep the deleted transactions
        prompt: |
          The table `deleted_txns` already exists (hidden setup). It has two columns, `txn_id` and `amount`.

          Write a trigger function named `keep_deleted` and an `AFTER DELETE` trigger named `txn_deleted` on
          `transactions`, `FOR EACH ROW`. The function inserts the `txn_id` and `amount` of the **old** row into
          `deleted_txns`.

          Then run `DELETE FROM transactions WHERE account_id = 8;` and show the number of rows in
          `deleted_txns` as `deleted`, and the sum of their `amount` values, rounded to 2 decimals, as `total`.
        setup: |
          CREATE TABLE deleted_txns (
              txn_id INTEGER,
              amount NUMERIC
          );
        starter: |
          -- 1. Write the trigger function and trigger here.

          -- 2. Delete account 8's transactions and show the totals here.
        solution: |
          CREATE FUNCTION keep_deleted()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              INSERT INTO deleted_txns (txn_id, amount)
              VALUES (OLD.txn_id, OLD.amount);
              RETURN OLD;
          END;
          $$;

          CREATE TRIGGER txn_deleted
          AFTER DELETE ON transactions
          FOR EACH ROW
          EXECUTE FUNCTION keep_deleted();

          DELETE FROM transactions
          WHERE account_id = 8;

          SELECT COUNT(*) AS deleted,
                 ROUND(SUM(amount), 2) AS total
          FROM deleted_txns;
        columnNames: true
        hints:
          - In a `DELETE` trigger the row you need is `OLD`, not `NEW`.
          - Insert `OLD.txn_id` and `OLD.amount`, then `RETURN OLD;` at the end.
          - "Skeleton: `CREATE TRIGGER txn_deleted AFTER DELETE ON transactions FOR EACH ROW EXECUTE FUNCTION keep_deleted();`"
        explanation: |
          Account 8 has 20 transactions, and their amounts add up to 21316.51, which is exactly its balance.
          Writing `OLD` values to a log is a common way to keep deleted data that the business must still see.
        difficulty: 3

    cheatsheet:
      - title: Trigger function and trigger
        sql: |
          CREATE FUNCTION my_fn()
          RETURNS TRIGGER
          LANGUAGE plpgsql
          AS $$
          BEGIN
              -- steps here
              RETURN NEW;
          END;
          $$;

          CREATE TRIGGER my_trg
          BEFORE UPDATE ON accounts
          FOR EACH ROW
          EXECUTE FUNCTION my_fn();
        note: A row trigger must RETURN NEW (or OLD for DELETE).
      - title: NEW, OLD and TG_OP
        sql: |
          -- NEW: the row after the change (INSERT, UPDATE)
          -- OLD: the row before the change (UPDATE, DELETE)
          -- TG_OP: 'INSERT', 'UPDATE' or 'DELETE'
        note: Read a column with NEW.column_name or OLD.column_name.
      - title: Refuse a bad change
        sql: |
          IF NEW.amount = 0 THEN
              RAISE EXCEPTION 'Zero-value transactions are not allowed';
          END IF;
        note: RAISE EXCEPTION in a BEFORE trigger cancels the change.
  - id: m17-l06
    title: "Error handling: stop, explain and recover"
    summary: Raise your own clear errors, catch the errors you expect, and undo partial work when something goes wrong.
    minutes: 28
    steps:
      - type: read
        title: Errors are a feature
        md: |
          Every bank has rules: an amount must be positive, an account number must exist, two people cannot
          both own the same account number. When a rule is broken, the database should **stop**, say **why**
          in plain words, and leave the data exactly as it was.

          > [!ANALOGY]
          > A circuit breaker in your home trips when a circuit overloads. It cuts the power before a fire
          > starts, and the switch tells you which circuit tripped. An error in PL/pgSQL does the same job.

      - type: read
        title: "RAISE EXCEPTION: stop with a message"
        md: |
          `RAISE EXCEPTION` stops the block or function right away and returns an error. You can add more
          information after the message with `USING`:

          | option | what it adds |
          |---|---|
          | `USING HINT = '...'` | a suggestion for how to fix the problem |
          | `USING ERRCODE = '...'` | a standard code, such as `check_violation` for a failed rule |
          | `USING DETAIL = '...'` | more detail about what went wrong |

          The `%` in the message is replaced by the next value, just like in `RAISE NOTICE`.

      - type: example
        title: A rule with a clear error message
        md: Run it. The function refuses a zero or negative amount, and explains how to fix the call.
        sql: |
          CREATE FUNCTION check_amount(p_amount NUMERIC)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF p_amount <= 0 THEN
                  RAISE EXCEPTION
                      'Amount must be positive, got %', p_amount
                      USING ERRCODE = 'check_violation',
                            HINT = 'Use a number greater than zero.';
              END IF;
              RETURN p_amount;
          END;
          $$;

          SELECT check_amount(-5);
        expectError: true
        after: |
          The error shows the message with the value that broke the rule, the hint, and the code
          **23514** (the standard code for a failed check). The learner sees exactly what to change.

      - type: read
        title: "EXCEPTION WHEN: catch the error you expect"
        md: |
          Sometimes the error is expected, and the block can deal with it. A block can have an `EXCEPTION`
          part after its work, with one `WHEN ... THEN` for each kind of error:

          ```
          BEGIN
              -- work that might fail
          EXCEPTION
              WHEN division_by_zero THEN
                  -- what to do instead
          END;
          ```

          Each kind of error has a name, such as `division_by_zero`, `unique_violation` (a duplicate key) or
          `raise_exception` (an error you raised yourself). You can list the names in the `WHEN`.

      - type: example
        title: Returning NULL instead of an error
        md: Run it. Dividing by zero would normally stop the function. The `EXCEPTION` part catches that error.
        sql: |
          CREATE FUNCTION safe_divide(p_a NUMERIC, p_b NUMERIC)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          BEGIN
              RETURN ROUND(p_a / p_b, 2);
          EXCEPTION
              WHEN division_by_zero THEN
                  RETURN NULL;
          END;
          $$;

          SELECT safe_divide(10, 4) AS ok,
                 safe_divide(10, 0) AS bad;
        after: |
          The first column is **2.50**. The second is **NULL**, because the division by zero was caught and the
          function returned nothing instead of stopping with an error.

      - type: read
        title: Reading the details of an error
        md: |
          Inside an `EXCEPTION` part you can read what went wrong:

          - `GET STACKED DIAGNOSTICS v_message = MESSAGE_TEXT` gives the message,
          - `GET STACKED DIAGNOSTICS v_state = RETURNED_SQLSTATE` gives the five-character code,
          - `SQLERRM` is a short way to get the message in a `WHEN` part.

          The code is useful because it does not change when the wording does. Codes are how programs
          recognize errors. `23505` means a duplicate key, `22P02` means text that is not a valid number, and
          `42P01` means a table that does not exist.

      - type: example
        title: Printing a duplicate-key error
        md: We try to insert an account number that already exists, and print the error details.
        sql: |
          DO $$
          DECLARE
              v_message TEXT;
              v_state TEXT;
          BEGIN
              INSERT INTO accounts
                  (account_id, customer_id, branch_id,
                   account_type, opened_on, status, overdraft_limit)
              VALUES
                  (1, 1, 1, 'checking', '2025-01-01', 'active', 0);
          EXCEPTION
              WHEN unique_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_message = MESSAGE_TEXT,
                      v_state = RETURNED_SQLSTATE;
                  RAISE NOTICE 'Caught: % (SQLSTATE %)',
                               v_message, v_state;
          END;
          $$;
        after: |
          Account 1 already exists, so the insert fails. The `WHEN unique_violation` part catches it, and the
          message appears in the Messages panel: the duplicate key message, with SQLSTATE **23505**.

      - type: read
        title: A block with an EXCEPTION part undoes its own work
        md: |
          When an error is caught by an `EXCEPTION` part, PostgreSQL first **undoes** everything the block
          did since its `BEGIN`. That makes the block all-or-nothing, like a transaction inside your block. The
          next example shows it.

      - type: example
        title: Two inserts, then an error
        md: Run it. Both inserts happen, then the block fails. Count the rows afterwards.
        sql: |
          CREATE TABLE notes (n INTEGER);

          DO $$
          BEGIN
              INSERT INTO notes VALUES (1);
              INSERT INTO notes VALUES (2);
              RAISE EXCEPTION 'stop';
          EXCEPTION
              WHEN raise_exception THEN
                  RAISE NOTICE 'caught: %', SQLERRM;
          END;
          $$;

          SELECT COUNT(*) AS rows_left
          FROM notes;
        after: |
          The count is **0**. The two inserts were undone when the error was caught, so the table is as it
          was before the block started.

      - type: read
        title: Catch only what you expect
        md: |
          `WHEN OTHERS` catches **every** error, including ones you did not think about. That can hide real
          problems. Name the error you expect, and let unexpected ones stop the program so you see them.

          > [!MISTAKE]
          > A `WHEN OTHERS THEN NULL;` at the end of a block looks harmless, but it quietly hides broken
          > data. Only use it when you know exactly why it is safe, and always print or log the error.

      - type: quiz
        id: m17-l06-q1
        question: What does `WHEN division_by_zero THEN` do inside an EXCEPTION part?
        options:
          - It stops the program with no message.
          - It catches that kind of error, so the block can handle it.
          - It creates a table for division errors.
          - It repeats the division until it works.
        answer: 1
        explanation: |
          `WHEN name THEN` catches one named kind of error. The statements after `THEN` run instead of the error
          stopping the program. Other kinds of error are not caught by this line.

      - type: example
        title: Turning a failure into a log row
        md: A function raises a clear error for a missing account. A DO block catches it and writes it to a log table.
        sql: |
          CREATE FUNCTION account_balance_strict(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_exists BOOLEAN;
              v_balance NUMERIC;
          BEGIN
              SELECT EXISTS (SELECT 1 FROM accounts
                             WHERE account_id = p_account_id)
                INTO v_exists;
              IF NOT v_exists THEN
                  RAISE EXCEPTION 'Account % not found', p_account_id;
              END IF;
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
                INTO v_balance
              FROM transactions
              WHERE account_id = p_account_id;
              RETURN v_balance;
          END;
          $$;

          CREATE TABLE error_log (code TEXT, message TEXT);

          DO $$
          DECLARE
              v_msg TEXT;
              v_state TEXT;
          BEGIN
              PERFORM account_balance_strict(999);
          EXCEPTION
              WHEN raise_exception THEN
                  GET STACKED DIAGNOSTICS
                      v_msg = MESSAGE_TEXT,
                      v_state = RETURNED_SQLSTATE;
                  INSERT INTO error_log (code, message)
                  VALUES (v_state, v_msg);
          END;
          $$;

          SELECT code, message FROM error_log;
        after: |
          The log has one row: code **P0001** (the code for an error raised with `RAISE EXCEPTION`) and the message
          **Account 999 not found**. The function did not crash the program. It reported the problem, and the
          block recorded it.

      - type: predict
        id: m17-l06-p1
        question: How many rows are in `notes` at the end?
        sql: |
          CREATE TABLE notes (n INTEGER);

          DO $$
          BEGIN
              INSERT INTO notes VALUES (1);

              BEGIN
                  INSERT INTO notes VALUES (2);
                  RAISE EXCEPTION 'inner failure';
              EXCEPTION
                  WHEN raise_exception THEN
                      NULL;
              END;

              INSERT INTO notes VALUES (3);
          END;
          $$;

          SELECT COUNT(*) FROM notes;
        options: ["1", "2", "3", "0"]
        answer: 1
        explanation: |
          Row 1 is inserted and kept. The inner block inserts row 2, then fails, so row 2 is undone and the
          inner block ends quietly. Row 3 is inserted afterwards. Rows 1 and 3 remain: 2 rows.

      - type: fill
        id: m17-l06-f1
        prompt: Complete the block so that it catches a duplicate key error.
        template: |
          DO $$
          BEGIN
              INSERT INTO accounts
                  (account_id, customer_id, branch_id,
                   account_type, opened_on, status, overdraft_limit)
              VALUES
                  (2, 2, 2, 'checking', '2025-01-01', 'active', 0);
          EXCEPTION
              WHEN ___ THEN
                  RAISE NOTICE 'Account 2 already exists';
          END;
          $$;
        answers:
          - ["unique_violation"]
        explanation: "`unique_violation` is the name of the error for a duplicate key, so the `WHEN` part catches it."

      - type: parsons
        id: m17-l06-o1
        prompt: Put the lines in the right order so that the block tries an insert and catches a duplicate.
        lines:
          - DO $$
          - BEGIN
          - "    INSERT INTO branches (branch_id, name, city, opened_on)"
          - "    VALUES (1, 'Dup Branch', 'Denver', '2025-01-01');"
          - EXCEPTION
          - "    WHEN unique_violation THEN"
          - "        RAISE NOTICE 'Branch 1 already exists';"
          - END;
          - $$;
        distractors:
          - "    RAISE EXCEPTION 'Branch 1 already exists';"
        explanation: |
          The insert comes first, then the `EXCEPTION` part that catches the duplicate, then the block ends.
          `RAISE EXCEPTION` would stop the block with an error, so it does not belong here.

      - type: exercise
        id: m17-l06-e1
        title: Percent with a safe answer
        prompt: |
          Write a function named `safe_percent` with two parameters, `p_part` (NUMERIC) and `p_whole` (NUMERIC).
          It returns `p_part * 100 / p_whole`, rounded to 2 decimals. If `p_whole` is 0, it returns NULL instead
          of an error. Use `EXCEPTION WHEN division_by_zero`.

          Then show `safe_percent(25, 200)` as `ok` and `safe_percent(5, 0)` as `bad`.
        starter: |
          -- 1. Write the safe_percent function here.

          -- 2. Show the two results here.
        solution: |
          CREATE FUNCTION safe_percent(p_part NUMERIC,
                                       p_whole NUMERIC)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          BEGIN
              RETURN ROUND(p_part * 100 / p_whole, 2);
          EXCEPTION
              WHEN division_by_zero THEN
                  RETURN NULL;
          END;
          $$;

          SELECT safe_percent(25, 200) AS ok,
                 safe_percent(5, 0) AS bad;
        columnNames: true
        hints:
          - It is the `safe_divide` example, with `p_part * 100` on top.
          - Put the division inside the body and the `WHEN division_by_zero` part after it.
          - "Skeleton: `RETURN ROUND(p_part * 100 / p_whole, 2); EXCEPTION WHEN division_by_zero THEN RETURN ___;`"
        explanation: |
          25 is 12.5% of 200, which shows as 12.50. The function does not stop when the total is 0, because the
          error is caught and turned into NULL.
        difficulty: 1

      - type: exercise
        id: m17-l06-e2
        title: Require a positive amount
        prompt: |
          Write a PL/pgSQL function named `require_positive` with one parameter, `p_amount` (NUMERIC). If
          `p_amount` is 0 or less, it raises the error `Amount must be positive` with the code
          `check_violation`. Otherwise it returns `p_amount`.

          Then show `require_positive(25.50)` as `amount`.
        starter: |
          -- Write the require_positive function here, then call it with 25.50.
        solution: |
          CREATE FUNCTION require_positive(p_amount NUMERIC)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          BEGIN
              IF p_amount <= 0 THEN
                  RAISE EXCEPTION 'Amount must be positive'
                      USING ERRCODE = 'check_violation';
              END IF;
              RETURN p_amount;
          END;
          $$;

          SELECT require_positive(25.50) AS amount;
        columnNames: true
        hints:
          - Use an `IF` that checks `p_amount <= 0`, and put the `RAISE EXCEPTION` inside it.
          - Add `USING ERRCODE = 'check_violation'` at the end of the `RAISE EXCEPTION` line.
          - "Skeleton: `IF p_amount <= 0 THEN RAISE EXCEPTION '___' USING ERRCODE = '___'; END IF; RETURN p_amount;`"
        explanation: |
          The good path returns the amount unchanged. The check is only reached when the amount is bad, which
          this exercise cannot test, but you can try `require_positive(-1)` yourself to see the error.
        difficulty: 2

      - type: exercise
        id: m17-l06-e3
        title: Log a duplicate account
        prompt: |
          The table `error_log` already exists (hidden setup). It has two columns, `code` and `message`.

          Write a DO block that tries to insert this account: `account_id` 1, `customer_id` 1, `branch_id` 1,
          `account_type` `'checking'`, `opened_on` `'2025-01-01'`, `status` `'active'`, and
          `overdraft_limit` 0. The insert will fail, because account 1 already exists.

          Catch the `unique_violation` error. Put the SQLSTATE (`RETURNED_SQLSTATE`) into `code` and the
          message (`MESSAGE_TEXT`) into `message` of `error_log`.

          Then show `code` and `message` from `error_log`.
        setup: |
          CREATE TABLE error_log (
              code TEXT,
              message TEXT
          );
        starter: |
          -- 1. Write the DO block here.

          -- 2. Show error_log here.
        solution: |
          DO $$
          DECLARE
              v_message TEXT;
              v_state TEXT;
          BEGIN
              INSERT INTO accounts
                  (account_id, customer_id, branch_id,
                   account_type, opened_on, status, overdraft_limit)
              VALUES
                  (1, 1, 1, 'checking', '2025-01-01', 'active', 0);
          EXCEPTION
              WHEN unique_violation THEN
                  GET STACKED DIAGNOSTICS
                      v_message = MESSAGE_TEXT,
                      v_state = RETURNED_SQLSTATE;
                  INSERT INTO error_log (code, message)
                  VALUES (v_state, v_message);
          END;
          $$;

          SELECT code, message
          FROM error_log;
        columnNames: true
        hints:
          - The insert goes in the block, and the `EXCEPTION` part handles the failure.
          - Use `GET STACKED DIAGNOSTICS` with `MESSAGE_TEXT` and `RETURNED_SQLSTATE`, then insert both.
          - "Skeleton: `EXCEPTION WHEN unique_violation THEN GET STACKED DIAGNOSTICS v_message = MESSAGE_TEXT, v_state = ___; INSERT INTO error_log (code, message) VALUES (___, ___); END;`"
        explanation: |
          The code `23505` is the standard code for a duplicate key, and the message names the constraint that
          rejected the row. Logging both lets someone read the problem later without rerunning the code.
        difficulty: 2

      - type: exercise
        id: m17-l06-e4
        title: Raise, catch and log
        prompt: |
          The table `error_log` already exists (hidden setup). It has two columns, `code` and `message`.

          Write a function named `account_balance_strict` with one parameter, `p_account_id` (INTEGER). If no row
          of `accounts` has that id, it raises the error `Account % not found` (with the account id). Otherwise
          it returns the sum of that account's `amount` values, rounded to 2 decimals.

          Then write a DO block that calls `account_balance_strict(999)`, catches `raise_exception`, and inserts
          the SQLSTATE and the message into `error_log`.

          Then show `code` and `message` from `error_log`.
        setup: |
          CREATE TABLE error_log (
              code TEXT,
              message TEXT
          );
        starter: |
          -- 1. Write account_balance_strict here.

          -- 2. Call it for account 999 inside a DO block, and show error_log here.
        solution: |
          CREATE FUNCTION account_balance_strict(p_account_id INTEGER)
          RETURNS NUMERIC
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_exists BOOLEAN;
              v_balance NUMERIC;
          BEGIN
              SELECT EXISTS (SELECT 1 FROM accounts
                             WHERE account_id = p_account_id)
                INTO v_exists;
              IF NOT v_exists THEN
                  RAISE EXCEPTION 'Account % not found', p_account_id;
              END IF;
              SELECT ROUND(COALESCE(SUM(amount), 0), 2)
                INTO v_balance
              FROM transactions
              WHERE account_id = p_account_id;
              RETURN v_balance;
          END;
          $$;

          DO $$
          DECLARE
              v_msg TEXT;
              v_state TEXT;
          BEGIN
              PERFORM account_balance_strict(999);
          EXCEPTION
              WHEN raise_exception THEN
                  GET STACKED DIAGNOSTICS
                      v_msg = MESSAGE_TEXT,
                      v_state = RETURNED_SQLSTATE;
                  INSERT INTO error_log (code, message)
                  VALUES (v_state, v_msg);
          END;
          $$;

          SELECT code, message
          FROM error_log;
        columnNames: true
        hints:
          - "The `RAISE EXCEPTION` goes inside an `IF NOT ...` check, as in the log example."
          - Call the function with `PERFORM` inside the block, then catch `raise_exception` in the `EXCEPTION` part.
          - "Skeleton: `DO $$ DECLARE ... BEGIN PERFORM account_balance_strict(999); EXCEPTION WHEN raise_exception THEN GET STACKED DIAGNOSTICS ...; INSERT INTO error_log ...; END; $$;`"
        explanation: |
          The function reports a missing account with a clear message, and the block turns that message into a
          row in the log. Keeping the check in the function means every caller gets the same rule.
        difficulty: 2

      - type: exercise
        id: m17-l06-e5
        title: Refuse overdrafts, log the failures
        prompt: |
          The table `error_log` already exists (hidden setup). It has one column, `message`.

          Write a function named `check_withdrawal` with two parameters, `p_account_id` (INTEGER) and `p_amount`
          (NUMERIC). It returns VOID. It works out the account's balance (the sum of `amount`, using 0 when there
          are no rows) and its `overdraft_limit`. If `balance - p_amount` is below `-overdraft_limit`, it raises
          the error `Insufficient funds on account %` with the account id.

          Then write a DO block with two nested blocks, each with its own `EXCEPTION` part:

          1. call `check_withdrawal(4, 100)`. If it fails, insert its message into `error_log`.
          2. call `check_withdrawal(4, 5000)`. If it fails, insert its message into `error_log`.

          Then show `message` from `error_log`.
        setup: |
          CREATE TABLE error_log (
              message TEXT
          );
        starter: |
          -- 1. Write check_withdrawal here.

          -- 2. Write the DO block with two nested blocks here.

          -- 3. Show error_log here.
        solution: |
          CREATE FUNCTION check_withdrawal(p_account_id INTEGER,
                                           p_amount NUMERIC)
          RETURNS VOID
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_balance NUMERIC;
              v_limit NUMERIC;
          BEGIN
              SELECT COALESCE(SUM(amount), 0) INTO v_balance
              FROM transactions
              WHERE account_id = p_account_id;

              SELECT overdraft_limit INTO v_limit
              FROM accounts
              WHERE account_id = p_account_id;

              IF v_balance - p_amount < -v_limit THEN
                  RAISE EXCEPTION 'Insufficient funds on account %',
                                  p_account_id;
              END IF;
          END;
          $$;

          DO $$
          BEGIN
              BEGIN
                  PERFORM check_withdrawal(4, 100);
              EXCEPTION
                  WHEN raise_exception THEN
                      INSERT INTO error_log (message)
                      VALUES (SQLERRM);
              END;

              BEGIN
                  PERFORM check_withdrawal(4, 5000);
              EXCEPTION
                  WHEN raise_exception THEN
                      INSERT INTO error_log (message)
                      VALUES (SQLERRM);
              END;
          END;
          $$;

          SELECT message
          FROM error_log;
        columnNames: true
        hints:
          - Start with the function, using `SELECT COALESCE(SUM(amount), 0) INTO v_balance` and the same for the limit.
          - Each nested block has its own `BEGIN ... EXCEPTION ... END;`. Only the second call should fail.
          - "Skeleton: `BEGIN PERFORM check_withdrawal(4, ___); EXCEPTION WHEN raise_exception THEN INSERT INTO error_log (message) VALUES (SQLERRM); END;`"
        explanation: |
          Account 4 has 833.85 and no overdraft, so a withdrawal of 100 is fine and logs nothing. A withdrawal of
          5000 would leave the balance far below zero, so it fails and is logged. Each nested block handles its
          own error, so the second call still runs even if the first one had failed.
        difficulty: 3

    cheatsheet:
      - title: Raise your own error
        sql: |
          RAISE EXCEPTION 'Amount must be positive, got %', p_amount
              USING ERRCODE = 'check_violation',
                    HINT = 'Use a number above zero.';
        note: The % is replaced by the next value. HINT and ERRCODE are optional.
      - title: Catch a named error
        sql: |
          EXCEPTION
              WHEN unique_violation THEN
                  RAISE NOTICE 'Already exists';
        note: Common names are division_by_zero, unique_violation and raise_exception.
      - title: Read the error details
        sql: |
          GET STACKED DIAGNOSTICS
              v_msg = MESSAGE_TEXT,
              v_state = RETURNED_SQLSTATE;
        note: Use these only inside an EXCEPTION part.
  - id: m17-l07
    title: "Security: who may do what"
    summary: Give each person only the access they need, check it with SET ROLE, and keep user input away from your SQL text.
    minutes: 30
    steps:
      - type: read
        title: Not everyone should see everything
        md: |
          At Harbor Bank, a teller helps customers at one branch and should see only that branch's transactions.
          An auditor may read all accounts but must never change one. Only an administrator may delete data.
          If everyone logs in with full power, one mistake or one stolen password can do enormous damage.

          The rule that protects against this is **least privilege**: give each person only the access they
          need for their job, and nothing more.

      - type: read
        title: Roles, GRANT and REVOKE
        md: |
          In PostgreSQL, a **role** is an account that can be given permissions. You manage roles with four
          commands:

          | command | what it does |
          |---|---|
          | `CREATE ROLE name NOLOGIN;` | creates a role that is used for permissions and cannot log in by itself |
          | `GRANT SELECT ON table TO name;` | gives the permission to read the table |
          | `REVOKE SELECT ON table FROM name;` | takes the permission away again |
          | `SET ROLE name;` / `RESET ROLE;` | act as that role for testing, and then go back to yourself |

          > [!ANALOGY]
          > A role is like a staff badge. `GRANT` decides which doors the badge opens, `REVOKE` removes a door,
          > and `SET ROLE` lets you test the badge before you hand it out.

      - type: example
        title: Testing what a role can read
        md: |
          Press **Run**. We create a role, give it the permission to read `accounts`, and then act as that role
          to count the rows. The `RESET ROLE` at the end goes back to our own account.
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;

          SET ROLE teller;
          SELECT COUNT(*) AS accounts_seen
          FROM accounts;
          RESET ROLE;
        after: |
          The teller can see all **126** accounts, because she was granted `SELECT` on that table. The
          `GRANT USAGE ON SCHEMA public` line is also needed, as the next two examples show.

      - type: read
        title: Permission denied
        md: |
          If a role tries something it was not granted, PostgreSQL refuses with **permission denied**. The
          check happens for every statement, so a read-only role cannot change data, even by accident.

      - type: example
        title: A teller cannot change accounts
        md: Run it. The teller was granted reading, not writing, so the insert is refused.
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;

          SET ROLE teller;
          INSERT INTO accounts
              (account_id, customer_id, branch_id,
               account_type, opened_on, status, overdraft_limit)
          VALUES
              (200, 1, 1, 'checking', '2025-01-01', 'active', 0);
        expectError: true
        after: |
          The error says **permission denied for table accounts**. No row was added. The database checks the
          role, not the person, so this protection works even when the query is typed by mistake.

      - type: read
        title: The schema door
        md: |
          Tables live in a **schema** (the folder `public` in this database). A role needs permission to
          enter the schema as well as permission on the table. Without it, PostgreSQL does not even show the
          table to that role.

          > [!MISTAKE]
          > If you forget `GRANT USAGE ON SCHEMA public TO ...;`, the error looks strange: the table seems not
          > to exist, even though it is there. The next example shows this.

      - type: example
        title: The table seems to vanish
        md: Run it. The role has `SELECT` on `transactions`, but has not been allowed into the schema.
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT SELECT ON transactions TO teller;

          SET ROLE teller;
          SELECT COUNT(*) FROM transactions;
        expectError: true
        after: |
          The error is **relation "transactions" does not exist**. The table exists, but the role cannot see
          it. Adding `GRANT USAGE ON SCHEMA public TO teller;` fixes it.

      - type: read
        title: "Row-level security: each row has a rule"
        md: |
          Sometimes a role may read a table but should see only some of its rows. **Row-level security** (RLS)
          does that. You turn it on for a table, then write a **policy**: a condition that each row must pass
          for the role to see it.

          A policy looks like this: `CREATE POLICY name ON table FOR SELECT TO role USING (condition);`.
          Once RLS is on, a row that fails the condition is invisible to that role. Owners and superusers are
          not limited by policies, so use `SET ROLE` to test them.

      - type: example
        title: A teller sees only her branch
        md: This teller sees only the transactions of accounts at branch 2.
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;
          GRANT SELECT ON transactions TO teller;

          ALTER TABLE transactions
              ENABLE ROW LEVEL SECURITY;

          CREATE POLICY teller_branch_only
              ON transactions
              FOR SELECT
              TO teller
              USING (account_id IN
                  (SELECT account_id FROM accounts
                   WHERE branch_id = 2));

          SET ROLE teller;
          SELECT COUNT(*) AS visible_rows
          FROM transactions;
          RESET ROLE;
        after: |
          The teller sees **633** transactions. The table has 3,674, but only rows that pass the policy are
          visible. The policy reads `accounts`, so the teller also needs `SELECT` on `accounts`.

      - type: read
        title: Why user input must never be glued into SQL
        md: |
          Suppose a program builds a query by joining text together: it takes the name a user typed and puts it
          straight into the SQL. Names such as O'Brien contain a quote. A quote in the middle of the text
          **ends the text early**, and the rest of the name is read as SQL. The query is broken, or worse.

          Attackers use exactly this trick to make a database run their own commands. It is called
          **SQL injection**. The safe fix is a **parameter**: the query has a placeholder such as `$1`, and the
          value travels separately. The value is always treated as data, never as SQL.

          The next two examples show the difference, using a harmless name.

      - type: example
        title: "The risky way: gluing text together"
        md: Run it. We pass the name O'Brien, which contains a quote, into a query built with `||`.
        sql: |
          CREATE FUNCTION count_customers_unsafe(p_name TEXT)
          RETURNS BIGINT
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_count BIGINT;
          BEGIN
              EXECUTE 'SELECT COUNT(*) FROM customers
                       WHERE full_name = ''' || p_name || ''''
                  INTO v_count;
              RETURN v_count;
          END;
          $$;

          SELECT count_customers_unsafe('O''Brien');
        expectError: true
        after: |
          The quote in O'Brien closed the text early, so the query became invalid SQL. The message is a
          **syntax error**. A user who typed a clever quote could do much worse, which is why this pattern is
          dangerous.

      - type: example
        title: "The safe way: a parameter"
        md: Run it. The same name is passed as a parameter with `USING`, so it is only ever compared as text.
        sql: |
          CREATE FUNCTION count_customers_named(p_name TEXT)
          RETURNS BIGINT
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_count BIGINT;
          BEGIN
              EXECUTE 'SELECT COUNT(*) FROM customers
                       WHERE full_name = $1'
                  INTO v_count
                  USING p_name;
              RETURN v_count;
          END;
          $$;

          SELECT count_customers_named('Sneha Khan') AS matches,
                 count_customers_named('O''Brien') AS obrien;
        after: |
          Sneha Khan matches **1** customer. O'Brien matches **0**, and there is no error, because the quote is
          just a character in the name. `$1` is the first placeholder, and `USING p_name` fills it in.

          > [!TIP]
          > Use `$1`, `$2`... with `EXECUTE ... USING` whenever a value comes from outside your code. Never join
          > user text into the SQL string.

      - type: quiz
        id: m17-l07-q1
        question: In a parameterized query with EXECUTE ... USING, how is the first value marked in the SQL text?
        options: ["?", "$1", "@name", ":1"]
        answer: 1
        explanation: |
          `$1` is the first placeholder, `$2` the second, and so on. The value after `USING` is sent separately,
          so it is never read as SQL.

      - type: predict
        id: m17-l07-p1
        question: What does the final `SELECT` return?
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;

          SET ROLE teller;
          SELECT COUNT(*) FROM transactions;
        options:
          - Its row count
          - "An error: permission denied for table transactions"
          - "0"
          - "NULL"
        answer: 1
        expectError: true
        explanation: |
          The role may enter the schema, but it was never granted `SELECT` on `transactions`. PostgreSQL
          refuses the query with a permission error, and no count is returned.

      - type: fill
        id: m17-l07-f1
        prompt: Complete the statements that act as the teller role and then return to yourself.
        template: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;

          ___ ROLE teller;
          SELECT COUNT(*) FROM accounts;
          ___ ROLE;
        answers:
          - ["SET"]
          - ["RESET"]
        explanation: "`SET ROLE` starts acting as the role, and `RESET ROLE` goes back to your own account."

      - type: parsons
        id: m17-l07-o1
        prompt: Put the lines in the right order to give a teller read-only access to accounts, and then count them as the teller.
        lines:
          - CREATE ROLE teller NOLOGIN;
          - GRANT USAGE ON SCHEMA public TO teller;
          - GRANT SELECT ON accounts TO teller;
          - SET ROLE teller;
          - SELECT COUNT(*) FROM accounts;
          - RESET ROLE;
        distractors:
          - GRANT ALL ON accounts TO teller;
        explanation: |
          The role is created, allowed into the schema, and then given only `SELECT`. The role is tested before
          it is reset. `GRANT ALL` would give far more power than a teller needs, so it is left out.

      - type: exercise
        id: m17-l07-e1
        title: An auditor who can only read
        prompt: |
          Create a role named `auditor` with `NOLOGIN`. Let it use the `public` schema, and give it `SELECT` on
          `accounts`.

          Then `SET ROLE auditor`, count the rows of `accounts` as `accounts_seen`, and finish with `RESET ROLE`.
        starter: |
          -- 1. Create the role and its permissions here.

          -- 2. Act as the auditor and count the accounts here.

          -- 3. Go back to yourself here.
        solution: |
          CREATE ROLE auditor NOLOGIN;
          GRANT USAGE ON SCHEMA public TO auditor;
          GRANT SELECT ON accounts TO auditor;

          SET ROLE auditor;
          SELECT COUNT(*) AS accounts_seen
          FROM accounts;
          RESET ROLE;
        columnNames: true
        hints:
          - The example with `teller` shows every line you need, so copy it and change the name.
          - Remember `GRANT USAGE ON SCHEMA public TO auditor;`, or the table will look missing.
          - "Skeleton: `CREATE ROLE auditor NOLOGIN; GRANT USAGE ON SCHEMA public TO auditor; GRANT SELECT ON accounts TO auditor; SET ROLE auditor; SELECT COUNT(*) AS accounts_seen FROM accounts; RESET ROLE;`"
        explanation: |
          The auditor sees all 126 accounts, because the permission covers the whole table. Read-only access is
          the usual permission for reports and audits.
        difficulty: 1

      - type: exercise
        id: m17-l07-e2
        title: Take the permission away
        prompt: |
          The role `auditor` already exists (hidden setup). It has `USAGE` on the `public` schema and `SELECT` on
          `transactions`.

          `REVOKE` the `SELECT` permission on `transactions` from `auditor`. Then show whether the role can still
          read it, as `can_read` (true or false), using `has_table_privilege('auditor', 'transactions', 'SELECT')`.
        setup: |
          CREATE ROLE auditor NOLOGIN;
          GRANT USAGE ON SCHEMA public TO auditor;
          GRANT SELECT ON transactions TO auditor;
        starter: |
          -- 1. Revoke the permission here.

          -- 2. Check the permission here.
        solution: |
          REVOKE SELECT ON transactions FROM auditor;

          SELECT has_table_privilege('auditor', 'transactions', 'SELECT')
              AS can_read;
        columnNames: true
        hints:
          - "The command is `REVOKE SELECT ON transactions FROM auditor;`."
          - "`has_table_privilege` takes the role, the table and the permission name, all in quotes."
          - "Skeleton: `REVOKE SELECT ON transactions FROM ___; SELECT has_table_privilege('___', 'transactions', 'SELECT') AS can_read;`"
        explanation: |
          `has_table_privilege` answers "may this role do this?" without running a query. After `REVOKE`, the
          answer is false. Checking a permission this way is safer than testing it by trying to read the table.
        difficulty: 1

      - type: exercise
        id: m17-l07-e3
        title: A branch-one auditor
        prompt: |
          The role `auditor` already exists (hidden setup). It has `USAGE` on the `public` schema and `SELECT` on
          `accounts`.

          Turn on row-level security for `accounts`. Create a policy named `branch1_only` that lets `auditor`
          read only the accounts whose `branch_id` is 1.

          Then `SET ROLE auditor`, count the rows of `accounts` as `visible`, and finish with `RESET ROLE`.
        setup: |
          CREATE ROLE auditor NOLOGIN;
          GRANT USAGE ON SCHEMA public TO auditor;
          GRANT SELECT ON accounts TO auditor;
        starter: |
          -- 1. Turn on RLS and create the policy here.

          -- 2. Act as the auditor and count the rows here.
        solution: |
          ALTER TABLE accounts ENABLE ROW LEVEL SECURITY;

          CREATE POLICY branch1_only
              ON accounts
              FOR SELECT
              TO auditor
              USING (branch_id = 1);

          SET ROLE auditor;
          SELECT COUNT(*) AS visible
          FROM accounts;
          RESET ROLE;
        columnNames: true
        hints:
          - Use `ALTER TABLE accounts ENABLE ROW LEVEL SECURITY;` first, then `CREATE POLICY`.
          - "The `USING` part is a condition, like a `WHERE`: `USING (branch_id = 1)`."
          - "Skeleton: `CREATE POLICY branch1_only ON accounts FOR SELECT TO auditor USING (___);`"
        explanation: |
          Branch 1 has 33 accounts. The policy hides the other 93 from the auditor, but the table itself still
          holds all 126 rows, so the rule is enforced by the database and not by the query.
        difficulty: 2

      - type: exercise
        id: m17-l07-e4
        title: Look up a name safely
        prompt: |
          Write a function named `customer_matches` with one parameter, `p_name` (TEXT). It returns how many
          customers have exactly that `full_name`, as a BIGINT.

          Build the query with `EXECUTE`, use `$1` as the placeholder, and pass `p_name` with `USING`. Do not
          join the name into the SQL text.

          Then show `customer_matches('Hannah Thomas')` as `matches`.
        starter: |
          -- Write customer_matches here, then call it for 'Hannah Thomas'.
        solution: |
          CREATE FUNCTION customer_matches(p_name TEXT)
          RETURNS BIGINT
          LANGUAGE plpgsql
          AS $$
          DECLARE
              v_count BIGINT;
          BEGIN
              EXECUTE 'SELECT COUNT(*) FROM customers
                       WHERE full_name = $1'
                  INTO v_count
                  USING p_name;
              RETURN v_count;
          END;
          $$;

          SELECT customer_matches('Hannah Thomas') AS matches;
        columnNames: true
        hints:
          - Copy the safe function from the example, and rename it.
          - "Put `$1` in the SQL text, and add `USING p_name` after the `INTO` part."
          - "Skeleton: `EXECUTE 'SELECT COUNT(*) FROM customers WHERE full_name = $1' INTO v_count USING ___;`"
        explanation: |
          Only one customer has that name, so the answer is 1. Because the name is a parameter, a name with a
          quote in it would be harmless too.
        difficulty: 2

      - type: exercise
        id: m17-l07-e5
        title: Teller access, from scratch
        prompt: |
          Create a role named `teller` with `NOLOGIN`. Let it use the `public` schema, and give it `SELECT` on
          `accounts` and on `transactions`.

          Turn on row-level security for `transactions`. Create a policy named `teller_branch2` that lets `teller`
          read only the transactions whose account is at branch 2. Use a subquery on `accounts` in the policy.

          Then `SET ROLE teller`, count the rows of `transactions` as `visible`, and finish with `RESET ROLE`.
        starter: |
          -- 1. Create the role and its permissions here.

          -- 2. Turn on RLS and create the policy here.

          -- 3. Act as the teller and count the rows here.
        solution: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;
          GRANT SELECT ON transactions TO teller;

          ALTER TABLE transactions ENABLE ROW LEVEL SECURITY;

          CREATE POLICY teller_branch2
              ON transactions
              FOR SELECT
              TO teller
              USING (account_id IN
                  (SELECT account_id FROM accounts
                   WHERE branch_id = 2));

          SET ROLE teller;
          SELECT COUNT(*) AS visible
          FROM transactions;
          RESET ROLE;
        columnNames: true
        hints:
          - Combine the permissions from the first exercise with the policy from the branch example.
          - The policy reads `accounts`, so the role needs `SELECT` on `accounts` too.
          - "Skeleton: `CREATE POLICY teller_branch2 ON transactions FOR SELECT TO teller USING (account_id IN (SELECT account_id FROM accounts WHERE ___));`"
        explanation: |
          The teller can see 633 transactions, the ones on accounts at branch 2. This is least privilege in
          practice: read access, a single table's rows, and nothing else. Checking the result with `SET ROLE`
          shows what the teller really sees.
        difficulty: 3

    cheatsheet:
      - title: Create a read-only role
        sql: |
          CREATE ROLE teller NOLOGIN;
          GRANT USAGE ON SCHEMA public TO teller;
          GRANT SELECT ON accounts TO teller;
        note: USAGE lets the role enter the schema, and SELECT lets it read the table.
      - title: Act as a role, then go back
        sql: |
          SET ROLE teller;
          SELECT COUNT(*) FROM accounts;
          RESET ROLE;
        note: Always RESET ROLE after testing, so later statements run as you.
      - title: Safe lookup with a parameter
        sql: |
          EXECUTE 'SELECT COUNT(*) FROM customers
                   WHERE full_name = $1'
              INTO v_count
              USING p_name;
        note: Never join user text into the SQL string. Pass it with USING.
testPool:
  - type: exercise
    id: m17-t01
    lesson: m17-l01
    difficulty: 1
    prompt: |
      Write a function `money_in` that takes one parameter, `p_account_id` (an integer). It returns
      the total of the **positive** amounts (money in) for that account, rounded to 2 decimals.

      Then show its result for account 1 in a column named `money_in`.
    starter: |
      -- Write CREATE FUNCTION money_in here, then call it for account 1.
    solution: |
      CREATE FUNCTION money_in(p_account_id INTEGER)
      RETURNS NUMERIC
      LANGUAGE sql
      STABLE
      AS $$
          SELECT ROUND(COALESCE(SUM(amount) FILTER (WHERE amount > 0), 0), 2)
          FROM transactions
          WHERE account_id = p_account_id;
      $$;

      SELECT money_in(1) AS money_in;
    columnNames: true
    hints:
      - Only positive amounts count, so filter them with `FILTER (WHERE amount > 0)` or a `WHERE` in the function.
      - The function body is a single `SELECT` that uses `SUM` and `ROUND`.
      - "Skeleton: `CREATE FUNCTION money_in(p_account_id INTEGER) RETURNS NUMERIC LANGUAGE sql AS $$ SELECT ___ FROM transactions WHERE ___; $$;`"
  - type: quiz
    id: m17-t02
    lesson: m17-l01
    difficulty: 2
    question: |
      A function reads the `transactions` table to add up one account's amounts. During one query, the same
      account always gives the same answer. Which volatility label is the strongest one that is still true?
    options: [IMMUTABLE, STABLE, VOLATILE, UNIQUE]
    answer: 1
    explanation: |
      `IMMUTABLE` would be a lie, because the function reads a table and the table can change between calls.
      `STABLE` is true and is the strongest label that stays true. `VOLATILE` is also true, but it tells
      PostgreSQL less, so it can run the function more often than needed.
  - type: predict
    id: m17-t03
    lesson: m17-l01
    difficulty: 2
    question: What does this query return?
    sql: |
      CREATE FUNCTION account_total(p_id INTEGER)
      RETURNS NUMERIC
      LANGUAGE sql
      STABLE
      AS $$
          SELECT ROUND(COALESCE(SUM(amount), 0), 2)
          FROM transactions
          WHERE account_id = p_id;
      $$;

      SELECT account_total(999) AS total;
    options: ["0.00", "NULL", "An error", "1"]
    answer: 0
    explanation: |
      Account 999 does not exist, so the `SUM` has no rows and returns NULL. `COALESCE` turns that
      NULL into 0, and `ROUND` shows it as 0.00. No error is raised.
  - type: fill
    id: m17-t04
    lesson: m17-l01
    difficulty: 1
    prompt: "Fill in the three blanks: name the function, choose its language, and call it for account 3."
    template: |
      CREATE FUNCTION ___(p_id INTEGER)
      RETURNS NUMERIC
      LANGUAGE ___
      AS $$
          SELECT ROUND(COALESCE(SUM(amount), 0), 2)
          FROM transactions
          WHERE account_id = p_id;
      $$;

      SELECT ___(3) AS total;
    answers:
      - ["account_total"]
      - ["sql"]
      - ["account_total"]
    explanation: The name is used when you create the function and again when you call it. `LANGUAGE sql` says the body is plain SQL.
  - type: exercise
    id: m17-t05
    lesson: m17-l02
    difficulty: 2
    prompt: |
      The table `summary` already exists (hidden setup). It has two columns, `customer_id` and
      `account_count`, and it is empty.

      Write a DO block that loops over customers 1, 2 and 3. For each one, count how many accounts that
      customer owns, and insert a row into `summary` with the customer's id and that count.

      Then show `customer_id` and `account_count` from `summary`, ordered by `customer_id`.
    setup: |
      CREATE TABLE summary (
          customer_id INTEGER,
          account_count BIGINT
      );
    starter: |
      -- Write the DO block and the final SELECT here.
    solution: |
      DO $$
      DECLARE
          r RECORD;
          v_count BIGINT;
      BEGIN
          FOR r IN SELECT customer_id
                   FROM customers
                   WHERE customer_id BETWEEN 1 AND 3
                   ORDER BY customer_id LOOP
              SELECT COUNT(*) INTO v_count
              FROM accounts
              WHERE customer_id = r.customer_id;

              INSERT INTO summary (customer_id, account_count)
              VALUES (r.customer_id, v_count);
          END LOOP;
      END;
      $$;

      SELECT customer_id, account_count
      FROM summary
      ORDER BY customer_id;
    columnNames: true
    ordered: true
    hints:
      - Loop over the customers, and use `SELECT COUNT(*) INTO v_count` for each one.
      - The count goes into `summary`, not into the loop query.
      - "Skeleton: `FOR r IN SELECT customer_id FROM customers ... LOOP SELECT COUNT(*) INTO v_count FROM accounts WHERE ___; INSERT INTO summary ... VALUES (___, v_count); END LOOP;`"
  - type: quiz
    id: m17-t06
    lesson: m17-l02
    difficulty: 1
    question: In PL/pgSQL, what does `v_total := 0;` do?
    options:
      - It compares v_total with 0.
      - It gives the variable v_total the value 0.
      - It creates a new table called v_total.
      - It prints 0 as a notice.
    answer: 1
    explanation: |
      `:=` is the assignment arrow. It puts a value into a variable that was declared in `DECLARE`.
      Comparing needs `=`, and inside an `IF` the same `=` means "equal to".
  - type: predict
    id: m17-t07
    lesson: m17-l02
    difficulty: 2
    question: What does the final `SELECT` return?
    sql: |
      CREATE TABLE numbers (n INTEGER);

      DO $$
      BEGIN
          FOR i IN 3..6 LOOP
              IF i % 2 = 1 THEN
                  INSERT INTO numbers VALUES (i);
              END IF;
          END LOOP;
      END;
      $$;

      SELECT SUM(n) AS total FROM numbers;
    options: ["8", "18", "2", "An error"]
    answer: 0
    explanation: |
      `i % 2 = 1` is true for odd numbers. Between 3 and 6 the odd numbers are 3 and 5, and their sum is 8.
      `FOR i` creates the loop variable for you, so there is no error.
  - type: parsons
    id: m17-t08
    lesson: m17-l02
    difficulty: 2
    prompt: Put the lines in the right order so the block prints the name of every customer in Seattle.
    lines:
      - DO $$
      - DECLARE
      - "    r RECORD;"
      - BEGIN
      - "    FOR r IN SELECT full_name FROM customers WHERE city = 'Seattle' ORDER BY full_name LOOP"
      - "        RAISE NOTICE 'Customer: %', r.full_name;"
      - "    END LOOP;"
      - END;
      - $$;
    distractors:
      - "    RETURN r.full_name;"
    explanation: |
      The loop needs its variable declared, the `FOR ... LOOP` line, the message inside the loop, and the
      `END LOOP;` line. `RETURN` only belongs in a function, so it does not belong in this DO block.
  - type: exercise
    id: m17-t09
    lesson: m17-l03
    difficulty: 2
    prompt: |
      Write a SQL function named `txns_between` with three parameters: `p_account_id` (INTEGER), `p_from`
      (DATE) and `p_to` (DATE). It returns `SETOF transactions`: the rows of that account whose `txn_time`
      is on or after `p_from` and on or before `p_to`, including every time on `p_to`.

      Then count the rows it returns for account 1 between `'2024-01-01'` and `'2024-03-31'`, as one column
      named `rows_q1`.
    starter: |
      -- Write CREATE FUNCTION txns_between here, then count the rows.
    solution: |
      CREATE FUNCTION txns_between(p_account_id INTEGER,
                                   p_from DATE,
                                   p_to DATE)
      RETURNS SETOF transactions
      LANGUAGE sql
      AS $$
          SELECT *
          FROM transactions
          WHERE account_id = p_account_id
            AND txn_time >= p_from
            AND txn_time < p_to + 1;
      $$;

      SELECT COUNT(*) AS rows_q1
      FROM txns_between(1, '2024-01-01', '2024-03-31');
    columnNames: true
    hints:
      - Use `RETURNS SETOF transactions` and `SELECT *`, as in the card payments example.
      - "For the end date, use `txn_time < p_to + 1` so that the whole last day is included."
      - "Skeleton: `SELECT COUNT(*) AS rows_q1 FROM txns_between(___, '2024-01-01', '2024-03-31');`"
  - type: quiz
    id: m17-t10
    lesson: m17-l03
    difficulty: 2
    question: A function is declared with `RETURNS SETOF transactions`. What does each row it returns look like?
    options:
      - It has exactly the columns of the transactions table.
      - It is one single number.
      - It has only the columns you name in RETURNS TABLE.
      - It is plain text, one value per row.
    answer: 0
    explanation: |
      `SETOF transactions` says each row has the same columns as the table. `RETURNS TABLE(...)` is the other
      shape, where you choose the columns yourself. A single number would be `RETURNS NUMERIC`.
  - type: exercise
    id: m17-t11
    lesson: m17-l03
    difficulty: 2
    prompt: |
      Write a SQL function named `account_credits` with one parameter, `p_account_id` (INTEGER). It returns a
      table with two columns, `txn_id` (INTEGER) and `amount` (NUMERIC). It returns the transactions of that
      account whose `amount` is greater than 1000.

      Then show `txn_id` and `amount` for account 3, ordered by `txn_id`.
    starter: |
      -- Write CREATE FUNCTION account_credits here, then call it for account 3.
    solution: |
      CREATE FUNCTION account_credits(p_account_id INTEGER)
      RETURNS TABLE(txn_id INTEGER, amount NUMERIC)
      LANGUAGE sql
      AS $$
          SELECT t.txn_id, t.amount
          FROM transactions t
          WHERE t.account_id = p_account_id
            AND t.amount > 1000;
      $$;

      SELECT txn_id, amount
      FROM account_credits(3)
      ORDER BY txn_id;
    columnNames: true
    ordered: true
    hints:
      - Use `RETURNS TABLE(txn_id INTEGER, amount NUMERIC)` and select those two columns.
      - Filter on `t.account_id = p_account_id` and `t.amount > 1000`.
      - "Skeleton: `SELECT ___ FROM transactions t WHERE ___ AND t.amount > 1000;` then `SELECT txn_id, amount FROM account_credits(3) ORDER BY txn_id;`"
    explanation: |
      Ordering by `txn_id` is what makes this result unambiguous. Several rows share the amount 4965.00, so
      sorting by `amount` alone would not decide their order.
  - type: exercise
    id: m17-t12
    lesson: m17-l04
    difficulty: 2
    prompt: |
      Write a procedure named `set_overdraft` with two parameters: `p_account_id` (INTEGER) and `p_limit`
      (NUMERIC). It changes the `overdraft_limit` of that account in `accounts` to `p_limit`, and then runs
      `COMMIT`.

      Then call `set_overdraft(2, 500.00)` and show `account_id` and `overdraft_limit` for account 2.
    starter: |
      -- Write CREATE PROCEDURE set_overdraft here, then call it.
    solution: |
      CREATE PROCEDURE set_overdraft(p_account_id INTEGER,
                                     p_limit NUMERIC)
      LANGUAGE plpgsql
      AS $$
      BEGIN
          UPDATE accounts
          SET overdraft_limit = p_limit
          WHERE account_id = p_account_id;
          COMMIT;
      END;
      $$;

      CALL set_overdraft(2, 500.00);

      SELECT account_id, overdraft_limit
      FROM accounts
      WHERE account_id = 2;
    columnNames: true
    hints:
      - The body is one `UPDATE` on `accounts`, followed by `COMMIT;`.
      - Use `CALL set_overdraft(2, 500.00);` before the `SELECT`, not `SELECT set_overdraft(...)`.
      - "Skeleton: `CREATE PROCEDURE set_overdraft(p_account_id INTEGER, p_limit NUMERIC) LANGUAGE plpgsql AS $$ BEGIN UPDATE accounts SET ___ WHERE ___; COMMIT; END; $$;`"
  - type: quiz
    id: m17-t13
    lesson: m17-l04
    difficulty: 1
    question: Which keyword runs a procedure?
    options: [SELECT, CALL, RETURN, PERFORM]
    answer: 1
    explanation: |
      `CALL` runs a procedure. `SELECT` is for functions, and `PERFORM` is only used inside PL/pgSQL code to run
      a function while ignoring its result.
  - type: fill
    id: m17-t14
    lesson: m17-l04
    difficulty: 1
    prompt: Fill in the blank so that the procedure saves its row.
    template: |
      CREATE TABLE audit_demo (n INTEGER);

      CREATE PROCEDURE save_row()
      LANGUAGE plpgsql
      AS $$
      BEGIN
          INSERT INTO audit_demo VALUES (42);
          ___;
      END;
      $$;

      CALL save_row();
      SELECT COUNT(*) FROM audit_demo;
    answers:
      - ["COMMIT"]
    explanation: "`COMMIT` saves the row from inside the procedure. A procedure that wants to save its work says so with `COMMIT`."
  - type: exercise
    id: m17-t15
    lesson: m17-l05
    difficulty: 2
    prompt: |
      The table `branch_log` already exists (hidden setup). It has one column, `branch_name` (TEXT).

      Write a trigger function named `log_new_branch`, and an `AFTER INSERT` trigger named `branch_logger`
      on `branches`, `FOR EACH ROW`. The function inserts the new branch's `name` into `branch_log`.

      Then insert one branch with `branch_id` 6, `name` `'Harbor Bank Airport'`, `city` `'Denver'` and
      `opened_on` `'2025-03-01'`. Finally, show `branch_name` from `branch_log`.
    setup: |
      CREATE TABLE branch_log (
          branch_name TEXT
      );
    starter: |
      -- Write the trigger function and trigger, then insert the branch and show the log.
    solution: |
      CREATE FUNCTION log_new_branch()
      RETURNS TRIGGER
      LANGUAGE plpgsql
      AS $$
      BEGIN
          INSERT INTO branch_log (branch_name)
          VALUES (NEW.name);
          RETURN NEW;
      END;
      $$;

      CREATE TRIGGER branch_logger
      AFTER INSERT ON branches
      FOR EACH ROW
      EXECUTE FUNCTION log_new_branch();

      INSERT INTO branches (branch_id, name, city, opened_on)
      VALUES (6, 'Harbor Bank Airport', 'Denver', '2025-03-01');

      SELECT branch_name
      FROM branch_log;
    columnNames: true
    hints:
      - It is the audit example, but it logs `NEW.name` on insert.
      - An `AFTER INSERT` row trigger reads `NEW`, because the new row is the one that matters.
      - "Skeleton: `CREATE TRIGGER branch_logger AFTER INSERT ON branches FOR EACH ROW EXECUTE FUNCTION log_new_branch();`"
  - type: predict
    id: m17-t16
    lesson: m17-l05
    difficulty: 2
    question: How many rows does `branch_log` contain at the end?
    sql: |
      CREATE TABLE branch_log (name TEXT);

      CREATE FUNCTION log_row()
      RETURNS TRIGGER
      LANGUAGE plpgsql
      AS $$
      BEGIN
          INSERT INTO branch_log VALUES (NEW.name);
          RETURN NULL;
      END;
      $$;

      CREATE FUNCTION log_stmt()
      RETURNS TRIGGER
      LANGUAGE plpgsql
      AS $$
      BEGIN
          INSERT INTO branch_log VALUES ('statement');
          RETURN NULL;
      END;
      $$;

      CREATE TRIGGER row_trg AFTER INSERT ON branches
          FOR EACH ROW EXECUTE FUNCTION log_row();
      CREATE TRIGGER stmt_trg AFTER INSERT ON branches
          FOR EACH STATEMENT EXECUTE FUNCTION log_stmt();

      INSERT INTO branches (branch_id, name, city, opened_on)
      VALUES (6, 'Pine Point', 'Denver', '2025-03-01'),
             (7, 'Lake Shore', 'Chicago', '2025-03-01');

      SELECT COUNT(*) FROM branch_log;
    options: ["3", "2", "1", "4"]
    answer: 0
    explanation: |
      The row trigger runs once for each of the two inserted rows, so it writes two entries. The statement
      trigger runs once for the whole `INSERT`, so it writes one more. 2 + 1 = 3.
  - type: parsons
    id: m17-t17
    lesson: m17-l05
    difficulty: 2
    prompt: Put the lines in the right order to create a trigger that refuses zero-amount transactions, then count the zero rows.
    lines:
      - CREATE FUNCTION block_zeros() RETURNS TRIGGER
      - LANGUAGE plpgsql AS $$
      - BEGIN
      - "    IF NEW.amount = 0 THEN"
      - "        RAISE EXCEPTION 'Zero amounts are not allowed';"
      - "    END IF;"
      - "    RETURN NEW;"
      - END;
      - $$;
      - CREATE TRIGGER no_zeros BEFORE INSERT ON transactions
      - FOR EACH ROW EXECUTE FUNCTION block_zeros();
      - SELECT COUNT(*) AS zero_rows FROM transactions WHERE amount = 0;
    distractors:
      - AFTER INSERT ON transactions
    explanation: |
      The function comes first, then the trigger that uses it. A `BEFORE` trigger is needed so that the
      check runs before the row is saved. `AFTER` would save the zero row first, so it is left out.
  - type: exercise
    id: m17-t18
    lesson: m17-l06
    difficulty: 1
    prompt: |
      Write a function named `div_or_zero` with two parameters, `p_a` and `p_b` (both NUMERIC). It returns
      `p_a / p_b`, rounded to 2 decimals. If `p_b` is 0, it returns `0.00` instead of an error.

      Then show `div_or_zero(9, 3)` as `ok` and `div_or_zero(9, 0)` as `bad`.
    starter: |
      -- Write div_or_zero here, then call it twice.
    solution: |
      CREATE FUNCTION div_or_zero(p_a NUMERIC, p_b NUMERIC)
      RETURNS NUMERIC
      LANGUAGE plpgsql
      AS $$
      BEGIN
          RETURN ROUND(p_a / p_b, 2);
      EXCEPTION
          WHEN division_by_zero THEN
              RETURN 0.00;
      END;
      $$;

      SELECT div_or_zero(9, 3) AS ok,
             div_or_zero(9, 0) AS bad;
    columnNames: true
    hints:
      - It is the `safe_divide` example, but it returns 0.00 instead of NULL.
      - Catch `division_by_zero` in the `EXCEPTION` part, and return the zero there.
      - "Skeleton: `BEGIN RETURN ROUND(p_a / p_b, 2); EXCEPTION WHEN division_by_zero THEN RETURN ___; END;`"
  - type: quiz
    id: m17-t19
    lesson: m17-l06
    difficulty: 2
    question: Which SQLSTATE code means that a unique key was used twice, such as a duplicate account number?
    options: ["23505", "42P01", "22P02", "P0001"]
    answer: 0
    explanation: |
      `23505` is the standard code for a duplicate key (`unique_violation`). `42P01` means a missing table,
      `22P02` means text that is not a valid value for its type, and `P0001` is an error raised with `RAISE EXCEPTION`.
  - type: exercise
    id: m17-t20
    lesson: m17-l06
    difficulty: 2
    prompt: |
      The table `oops_log` already exists (hidden setup). It has one column, `msg` (TEXT).

      Write a DO block that inserts a branch with `branch_id` 1, `name` `'Dup Branch'`, `city` `'Denver'` and
      `opened_on` `'2025-01-01'` into `branches`. Branch 1 already exists, so the insert fails. Catch the
      `unique_violation` error and insert the error message (`MESSAGE_TEXT`) into `oops_log`.

      Then show `msg` from `oops_log`.
    setup: |
      CREATE TABLE oops_log (
          msg TEXT
      );
    starter: |
      -- Write the DO block here, then show oops_log.
    solution: |
      DO $$
      DECLARE
          v_message TEXT;
      BEGIN
          INSERT INTO branches (branch_id, name, city, opened_on)
          VALUES (1, 'Dup Branch', 'Denver', '2025-01-01');
      EXCEPTION
          WHEN unique_violation THEN
              GET STACKED DIAGNOSTICS v_message = MESSAGE_TEXT;
              INSERT INTO oops_log (msg) VALUES (v_message);
      END;
      $$;

      SELECT msg
      FROM oops_log;
    columnNames: true
    hints:
      - Use the same pattern as the duplicate-account example, but for `branches`.
      - Read `MESSAGE_TEXT` with `GET STACKED DIAGNOSTICS` into a variable, then insert the variable.
      - "Skeleton: `EXCEPTION WHEN unique_violation THEN GET STACKED DIAGNOSTICS v_message = ___; INSERT INTO oops_log (msg) VALUES (___); END;`"
    explanation: |
      The message names the constraint that rejected the row: `branches_pkey`, the primary key of the
      branches table. Logging it tells you which table and which rule failed.
  - type: predict
    id: m17-t21
    lesson: m17-l06
    difficulty: 3
    question: How many rows does `sums` contain at the end?
    sql: |
      CREATE TABLE error_log (message TEXT);
      CREATE TABLE sums (total INTEGER);

      DO $$
      BEGIN
          BEGIN
              INSERT INTO sums VALUES (10);
              INSERT INTO sums VALUES (1 / 0);
          EXCEPTION WHEN division_by_zero THEN
              INSERT INTO error_log VALUES (SQLERRM);
          END;
          INSERT INTO sums VALUES (20);
      END;
      $$;

      SELECT COUNT(*) FROM sums;
    options: ["1", "2", "0", "3"]
    answer: 0
    explanation: |
      The inner block inserts 10, then fails on `1 / 0`. The exception undoes the inner block, so the 10 is
      removed and the error is logged. The last insert adds 20. Only one row is left in `sums`.
  - type: exercise
    id: m17-t22
    lesson: m17-l07
    difficulty: 2
    prompt: |
      Create a role named `reporter` with `NOLOGIN`. Let it use the `public` schema, and give it `SELECT` on
      `customers` only.

      Then show two columns: `can_select` and `can_insert`. They hold the answers of
      `has_table_privilege('reporter', 'customers', 'SELECT')` and
      `has_table_privilege('reporter', 'customers', 'INSERT')`.
    starter: |
      -- Create the role and its permissions, then check them.
    solution: |
      CREATE ROLE reporter NOLOGIN;
      GRANT USAGE ON SCHEMA public TO reporter;
      GRANT SELECT ON customers TO reporter;

      SELECT has_table_privilege('reporter', 'customers', 'SELECT')
          AS can_select,
             has_table_privilege('reporter', 'customers', 'INSERT')
          AS can_insert;
    columnNames: true
    hints:
      - Grant only the permission the prompt asks for. Nothing else.
      - "`has_table_privilege` takes the role name, the table name and the permission, in quotes."
      - "Skeleton: `CREATE ROLE reporter NOLOGIN; GRANT USAGE ON SCHEMA public TO reporter; GRANT ___ ON customers TO reporter;`"
  - type: exercise
    id: m17-t23
    lesson: m17-l07
    difficulty: 3
    prompt: |
      Write a PL/pgSQL function named `active_accounts_of` with one parameter, `p_type` (TEXT). It returns how
      many accounts of that `account_type` have `status` `'active'`, as a BIGINT.

      Build the query with `EXECUTE`, use `$1` as the placeholder, and pass `p_type` with `USING`.

      Then show `active_accounts_of('savings')` as `savings` and `active_accounts_of('checking')` as `checking`.
    starter: |
      -- Write active_accounts_of here, then call it twice.
    solution: |
      CREATE FUNCTION active_accounts_of(p_type TEXT)
      RETURNS BIGINT
      LANGUAGE plpgsql
      AS $$
      DECLARE
          v_count BIGINT;
      BEGIN
          EXECUTE 'SELECT COUNT(*) FROM accounts
                   WHERE account_type = $1
                     AND status = ''active'''
              INTO v_count
              USING p_type;
          RETURN v_count;
      END;
      $$;

      SELECT active_accounts_of('savings') AS savings,
             active_accounts_of('checking') AS checking;
    columnNames: true
    hints:
      - Copy the safe function from the lesson, and add one more condition to the query text.
      - "The `status` test is a fixed text, so it can sit in the SQL string as `status = ''active''`."
      - "Skeleton: `EXECUTE 'SELECT COUNT(*) FROM accounts WHERE account_type = $1 AND status = ''active''' INTO v_count USING ___;`"
  - type: fill
    id: m17-t24
    lesson: m17-l07
    difficulty: 2
    prompt: Fill in the blank so that the clerk is allowed to read the branches table. The count then runs as the clerk.
    template: |
      CREATE ROLE clerk NOLOGIN;
      GRANT USAGE ON SCHEMA public TO clerk;
      GRANT ___ ON branches TO clerk;

      SET ROLE clerk;
      SELECT COUNT(*) FROM branches;
      RESET ROLE;
    answers:
      - ["SELECT"]
    explanation: "`GRANT SELECT` gives permission to read. The count runs as the clerk, so it returns 5 branches."
  - type: quiz
    id: m17-t25
    lesson: m17-l07
    difficulty: 1
    question: Which command gives a role permission to read a table?
    options:
      - "GRANT SELECT ON accounts TO teller;"
      - "REVOKE SELECT ON accounts FROM teller;"
      - "CREATE ROLE SELECT accounts;"
      - "SET ROLE SELECT ON accounts;"
    answer: 0
    explanation: |
      `GRANT SELECT ON table TO role;` adds the permission. `REVOKE` removes it, and `CREATE ROLE` only creates
      the role. `SET ROLE` acts as the role for testing, but it does not give it any permission.
project:
  id: m17-proj
  title: "Automate the Bank"
  icon: "🏦"
  dataset: bank
  md: |
    Harbor Bank's operations team spends every Monday copying the same SQL into new reports. Last quarter a
    single typo in a copied formula showed a branch manager the wrong balance. Management wants the routine
    work automated **inside the database**, so that every report, every fee and every transfer uses the same
    rules.

    You will build that automation in six steps. Each step adds one piece: a balance formula, a compliance
    list, a monthly fee, an audit trail, safe transfers and finally a security lock for the tellers. Your
    colleagues have already installed the earlier pieces in the database for each step, so you only write the
    new part. The tasks grow harder, and the last one uses everything from this module.

    Work through the tasks in order. Each Run starts from the original bank, so nothing you did in an earlier
    task is kept, but the colleagues' pieces are always there.
  tasks:
    - type: exercise
      id: m17-proj-1
      title: The one balance formula
      prompt: |
        Priya, the operations analyst, has copied the same balance formula into twelve reports. Turn it into
        one function that every report can share.

        Write `account_balance(p_account_id INTEGER)`. It returns the account's balance: the sum of its
        `amount` values, rounded to 2 decimals, and 0 when the account has no transactions.

        Then show `account_id` and `balance` for accounts 1 to 3, ordered by `account_id`.
      starter: |
        -- 1. Write account_balance here.

        -- 2. Show accounts 1 to 3 here.
      solution: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;

        SELECT account_id,
               account_balance(account_id) AS balance
        FROM accounts
        WHERE account_id IN (1, 2, 3)
        ORDER BY account_id;
      columnNames: true
      ordered: true
      hints:
        - It is the formula from the first lesson, with a parameter named `p_account_id`.
        - Use `COALESCE(SUM(amount), 0)` so an account with no rows gives 0, not NULL.
        - "Skeleton: `CREATE FUNCTION account_balance(p_account_id INTEGER) RETURNS NUMERIC LANGUAGE sql AS $$ SELECT ROUND(COALESCE(SUM(amount), 0), 2) FROM transactions WHERE ___; $$;`"
      difficulty: 1
    - type: exercise
      id: m17-proj-2
      title: The compliance list
      prompt: |
        Compliance wants a list of every large debit: any transaction that takes out 2000 dollars or more. Your
        colleague's `account_balance` function is already installed.

        Write `large_debits(p_min NUMERIC)`. It returns a table with three columns: `txn_id` (INTEGER),
        `account_id` (INTEGER) and `amount` (NUMERIC). It returns every transaction whose `amount` is less than
        or equal to `-p_min`.

        Then show all the rows of `large_debits(2000)`, ordered by `txn_id`.
      setup: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;
      starter: |
        -- 1. Write large_debits here.

        -- 2. Show the large debits here.
      solution: |
        CREATE FUNCTION large_debits(p_min NUMERIC)
        RETURNS TABLE(txn_id INTEGER,
                      account_id INTEGER,
                      amount NUMERIC)
        LANGUAGE sql
        AS $$
            SELECT t.txn_id, t.account_id, t.amount
            FROM transactions t
            WHERE t.amount <= -p_min;
        $$;

        SELECT *
        FROM large_debits(2000)
        ORDER BY txn_id;
      columnNames: true
      ordered: true
      hints:
        - Use `RETURNS TABLE(...)` with the three columns, and filter with `-p_min` as in the lesson example.
        - "The filter is `amount <= -p_min`, because debits are negative."
        - "Skeleton: `RETURNS TABLE(txn_id INTEGER, account_id INTEGER, amount NUMERIC) LANGUAGE sql AS $$ SELECT ___ FROM transactions WHERE amount <= -p_min; $$;`"
      explanation: |
        The list has 21 rows. Each one is a debit of at least 2000 dollars, and `ORDER BY txn_id` makes the
        order the same each time.
      difficulty: 2
    - type: exercise
      id: m17-proj-3
      title: The monthly fee
      prompt: |
        Every account pays a monthly maintenance fee. Write a procedure named `post_monthly_fee` with two
        parameters, `p_account_id` (INTEGER) and `p_amount` (NUMERIC). It inserts one row into `transactions`:

        - `txn_id`: the largest existing `txn_id` plus 1
        - `account_id`: `p_account_id`
        - `txn_time`: `'2025-01-31 23:00:00'`
        - `amount`: `-p_amount`
        - `txn_type`: `'fee'`
        - `description`: `'Monthly maintenance fee'`

        The procedure then runs `COMMIT`.

        Then `CALL post_monthly_fee(1, 12.00);` and show `txn_id`, `account_id`, `amount` and `description` for
        `txn_id` 3675.
      setup: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;

        CREATE FUNCTION large_debits(p_min NUMERIC)
        RETURNS TABLE(txn_id INTEGER,
                      account_id INTEGER,
                      amount NUMERIC)
        LANGUAGE sql
        AS $$
            SELECT t.txn_id, t.account_id, t.amount
            FROM transactions t
            WHERE t.amount <= -p_min;
        $$;
      starter: |
        -- 1. Write post_monthly_fee here.

        -- 2. Call it for account 1 with 12.00, then show txn 3675 here.
      solution: |
        CREATE PROCEDURE post_monthly_fee(p_account_id INTEGER,
                                          p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_account_id, '2025-01-31 23:00:00',
                 -p_amount, 'fee', 'Monthly maintenance fee');
            COMMIT;
        END;
        $$;

        CALL post_monthly_fee(1, 12.00);

        SELECT txn_id, account_id, amount, description
        FROM transactions
        WHERE txn_id = 3675;
      columnNames: true
      hints:
        - It is the procedure from the lesson, with the fee's description and time from the prompt.
        - Use `CALL post_monthly_fee(1, 12.00);`, not `SELECT`, before the final query.
        - "Skeleton: `CREATE PROCEDURE post_monthly_fee(p_account_id INTEGER, p_amount NUMERIC) LANGUAGE plpgsql AS $$ BEGIN INSERT INTO transactions ... VALUES (___, p_account_id, ..., -p_amount, 'fee', 'Monthly maintenance fee'); COMMIT; END; $$;`"
      explanation: |
        The fee is saved by the `COMMIT` inside the procedure. The new row gets number 3675, and its amount is
        negative because money is going out.
      difficulty: 2
    - type: exercise
      id: m17-proj-4
      title: Every status change is recorded
      prompt: |
        The auditors need every change of an account's status recorded: freezes, closures and reactivations.
        The table `status_audit` already exists (set up by a colleague). It has three columns: `account_id`,
        `old_status` and `new_status`.

        Write a trigger function named `log_status_change` and an `AFTER UPDATE OF status` trigger named
        `status_audit_trg` on `accounts`, `FOR EACH ROW`. Each change inserts one row into `status_audit`, with
        the old and the new status.

        Then run `UPDATE accounts SET status = 'frozen' WHERE account_id = 5;` and show `account_id`,
        `old_status` and `new_status` from `status_audit`.
      setup: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;

        CREATE FUNCTION large_debits(p_min NUMERIC)
        RETURNS TABLE(txn_id INTEGER,
                      account_id INTEGER,
                      amount NUMERIC)
        LANGUAGE sql
        AS $$
            SELECT t.txn_id, t.account_id, t.amount
            FROM transactions t
            WHERE t.amount <= -p_min;
        $$;

        CREATE PROCEDURE post_monthly_fee(p_account_id INTEGER,
                                          p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_account_id, '2025-01-31 23:00:00',
                 -p_amount, 'fee', 'Monthly maintenance fee');
            COMMIT;
        END;
        $$;

        CREATE TABLE status_audit (
            account_id INTEGER,
            old_status TEXT,
            new_status TEXT
        );
      starter: |
        -- 1. Write the trigger function and trigger here.

        -- 2. Freeze account 5 and show status_audit here.
      solution: |
        CREATE FUNCTION log_status_change()
        RETURNS TRIGGER
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO status_audit
                (account_id, old_status, new_status)
            VALUES
                (OLD.account_id, OLD.status, NEW.status);
            RETURN NEW;
        END;
        $$;

        CREATE TRIGGER status_audit_trg
        AFTER UPDATE OF status ON accounts
        FOR EACH ROW
        EXECUTE FUNCTION log_status_change();

        UPDATE accounts
        SET status = 'frozen'
        WHERE account_id = 5;

        SELECT account_id, old_status, new_status
        FROM status_audit;
      columnNames: true
      hints:
        - The audit trigger from the lesson is the model. Change the table and the columns.
        - Use `OLD.status` for the old value and `NEW.status` for the new one.
        - "Skeleton: `CREATE TRIGGER status_audit_trg AFTER UPDATE OF status ON accounts FOR EACH ROW EXECUTE FUNCTION log_status_change();`"
      explanation: |
        Account 5 was active and is now frozen, so the audit row holds both values. Because the trigger runs
        for every update of `status`, no status change can slip past it, even one made by a quick `UPDATE`.
      difficulty: 2
    - type: exercise
      id: m17-proj-5
      title: A transfer that refuses to overdraw
      prompt: |
        Transfers must be safe. A colleague's `account_balance` function and the audit trigger are already
        installed.

        Write a procedure named `transfer_funds` with three parameters: `p_from` (INTEGER), `p_to` (INTEGER)
        and `p_amount` (NUMERIC).

        1. If `account_balance(p_from)` is less than `p_amount`, raise the error `Insufficient funds on account %`
           with `p_from`. Do not move any money in that case.
        2. Otherwise, insert two rows in one `INSERT ... VALUES` statement, with `txn_time` `'2025-01-02 09:00:00'`
           and `description` `'Transfer'`. The outgoing row is for `p_from`, with `txn_type` `'transfer_out'`,
           amount `-p_amount` and `txn_id` = `(SELECT MAX(txn_id) + 1 FROM transactions)`. The incoming row is for
           `p_to`, with `txn_type` `'transfer_in'`, amount `p_amount` and `txn_id` = `(SELECT MAX(txn_id) + 2 FROM transactions)`.
        3. Run `COMMIT`.

        Then `CALL transfer_funds(1, 2, 50.00);` and show `account_id` and `account_balance(account_id)` as
        `balance` for accounts 1 and 2, ordered by `account_id`.
      setup: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;

        CREATE FUNCTION large_debits(p_min NUMERIC)
        RETURNS TABLE(txn_id INTEGER,
                      account_id INTEGER,
                      amount NUMERIC)
        LANGUAGE sql
        AS $$
            SELECT t.txn_id, t.account_id, t.amount
            FROM transactions t
            WHERE t.amount <= -p_min;
        $$;

        CREATE PROCEDURE post_monthly_fee(p_account_id INTEGER,
                                          p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_account_id, '2025-01-31 23:00:00',
                 -p_amount, 'fee', 'Monthly maintenance fee');
            COMMIT;
        END;
        $$;

        CREATE TABLE status_audit (
            account_id INTEGER,
            old_status TEXT,
            new_status TEXT
        );

        CREATE FUNCTION log_status_change()
        RETURNS TRIGGER
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO status_audit
                (account_id, old_status, new_status)
            VALUES
                (OLD.account_id, OLD.status, NEW.status);
            RETURN NEW;
        END;
        $$;

        CREATE TRIGGER status_audit_trg
        AFTER UPDATE OF status ON accounts
        FOR EACH ROW
        EXECUTE FUNCTION log_status_change();
      starter: |
        -- 1. Write the transfer_funds procedure here.

        -- 2. Move 50.00 from account 1 to account 2 and show the balances here.
      solution: |
        CREATE PROCEDURE transfer_funds(p_from INTEGER,
                                        p_to INTEGER,
                                        p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            IF account_balance(p_from) < p_amount THEN
                RAISE EXCEPTION 'Insufficient funds on account %',
                                p_from;
            END IF;

            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_from, '2025-01-02 09:00:00',
                 -p_amount, 'transfer_out', 'Transfer'),
                ((SELECT MAX(txn_id) + 2 FROM transactions),
                 p_to, '2025-01-02 09:00:00',
                 p_amount, 'transfer_in', 'Transfer');
            COMMIT;
        END;
        $$;

        CALL transfer_funds(1, 2, 50.00);

        SELECT account_id,
               account_balance(account_id) AS balance
        FROM accounts
        WHERE account_id IN (1, 2)
        ORDER BY account_id;
      columnNames: true
      ordered: true
      hints:
        - Start the body with the `IF` check, then the `INSERT`, then `COMMIT;`.
        - "The check is `IF account_balance(p_from) < p_amount THEN RAISE EXCEPTION ...; END IF;`."
        - "Skeleton: `CREATE PROCEDURE transfer_funds(p_from INTEGER, p_to INTEGER, p_amount NUMERIC) LANGUAGE plpgsql AS $$ BEGIN IF ___ THEN RAISE EXCEPTION ...; END IF; INSERT INTO transactions ... VALUES (...), (...); COMMIT; END; $$;`"
      explanation: |
        Account 1 had 260.79 and sends 50.00, so it ends at 210.79. Account 2 receives it and ends at 7033.12.
        The check runs first, so an overdraft attempt would raise an error and leave both balances as they were.
      difficulty: 3
    - type: exercise
      id: m17-proj-6
      title: Lock the bank down for tellers
      prompt: |
        The last step is security. A teller at branch 2 must see only the transactions of branch 2 accounts, and
        must not be able to post fees. Your colleagues' pieces are all installed.

        1. Create a role named `teller` with `NOLOGIN`. Let it use the `public` schema, and give it `SELECT` on
           `accounts` and on `transactions`.
        2. Turn on row-level security for `transactions`. Create a policy named `teller_branch2` that lets
           `teller` read only the transactions whose `account_id` is an account at branch 2.
        3. Take away the permission to run `post_monthly_fee` from `PUBLIC`, which means every role by default.
           Use `REVOKE EXECUTE ON PROCEDURE post_monthly_fee(INTEGER, NUMERIC) FROM PUBLIC;`.

        Then `SET ROLE teller`, and run one query that shows two columns: `visible`, the number of transactions
        the teller can see, and `can_post`, the result of
        `has_function_privilege('teller', 'post_monthly_fee(integer, numeric)', 'EXECUTE')`. Finish with `RESET ROLE`.
      setup: |
        CREATE FUNCTION account_balance(p_account_id INTEGER)
        RETURNS NUMERIC
        LANGUAGE sql
        STABLE
        AS $$
            SELECT ROUND(COALESCE(SUM(amount), 0), 2)
            FROM transactions
            WHERE account_id = p_account_id;
        $$;

        CREATE FUNCTION large_debits(p_min NUMERIC)
        RETURNS TABLE(txn_id INTEGER,
                      account_id INTEGER,
                      amount NUMERIC)
        LANGUAGE sql
        AS $$
            SELECT t.txn_id, t.account_id, t.amount
            FROM transactions t
            WHERE t.amount <= -p_min;
        $$;

        CREATE PROCEDURE post_monthly_fee(p_account_id INTEGER,
                                          p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_account_id, '2025-01-31 23:00:00',
                 -p_amount, 'fee', 'Monthly maintenance fee');
            COMMIT;
        END;
        $$;

        CREATE TABLE status_audit (
            account_id INTEGER,
            old_status TEXT,
            new_status TEXT
        );

        CREATE FUNCTION log_status_change()
        RETURNS TRIGGER
        LANGUAGE plpgsql
        AS $$
        BEGIN
            INSERT INTO status_audit
                (account_id, old_status, new_status)
            VALUES
                (OLD.account_id, OLD.status, NEW.status);
            RETURN NEW;
        END;
        $$;

        CREATE TRIGGER status_audit_trg
        AFTER UPDATE OF status ON accounts
        FOR EACH ROW
        EXECUTE FUNCTION log_status_change();

        CREATE PROCEDURE transfer_funds(p_from INTEGER,
                                        p_to INTEGER,
                                        p_amount NUMERIC)
        LANGUAGE plpgsql
        AS $$
        BEGIN
            IF account_balance(p_from) < p_amount THEN
                RAISE EXCEPTION 'Insufficient funds on account %',
                                p_from;
            END IF;

            INSERT INTO transactions
                (txn_id, account_id, txn_time, amount,
                 txn_type, description)
            VALUES
                ((SELECT MAX(txn_id) + 1 FROM transactions),
                 p_from, '2025-01-02 09:00:00',
                 -p_amount, 'transfer_out', 'Transfer'),
                ((SELECT MAX(txn_id) + 2 FROM transactions),
                 p_to, '2025-01-02 09:00:00',
                 p_amount, 'transfer_in', 'Transfer');
            COMMIT;
        END;
        $$;
      starter: |
        -- 1. Create the role and its permissions here.

        -- 2. Turn on RLS and create the policy here.

        -- 3. Remove the permission to post fees here.

        -- 4. Check what the teller can see and do here.
      solution: |
        CREATE ROLE teller NOLOGIN;
        GRANT USAGE ON SCHEMA public TO teller;
        GRANT SELECT ON accounts TO teller;
        GRANT SELECT ON transactions TO teller;

        ALTER TABLE transactions ENABLE ROW LEVEL SECURITY;

        CREATE POLICY teller_branch2
            ON transactions
            FOR SELECT
            TO teller
            USING (account_id IN
                (SELECT account_id FROM accounts
                 WHERE branch_id = 2));

        REVOKE EXECUTE ON PROCEDURE
            post_monthly_fee(INTEGER, NUMERIC) FROM PUBLIC;

        SET ROLE teller;

        SELECT COUNT(*) AS visible,
               has_function_privilege('teller',
                   'post_monthly_fee(integer, numeric)',
                   'EXECUTE') AS can_post
        FROM transactions;

        RESET ROLE;
      columnNames: true
      hints:
        - Combine the permissions and the policy from the lesson on row-level security.
        - "`REVOKE EXECUTE ON PROCEDURE post_monthly_fee(INTEGER, NUMERIC) FROM PUBLIC;` removes the default permission that every role has."
        - "The final check must run after `SET ROLE teller;` so that it shows what the teller sees."
      explanation: |
        The teller sees 633 transactions, the ones of branch 2 accounts, and `can_post` is false. The bank is
        now protected by its own rules: tellers read only their branch, and only roles with the right
        permission can post fees. Every report written from here on uses the same rules.
      difficulty: 3
