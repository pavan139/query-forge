    question: |
      How many rows does this query return? (2024 is a leap year.)
    sql: |
      SELECT COUNT(*) AS days
      FROM generate_series(
               '2024-02-28'::date,
               '2024-03-01'::date,
               '1 day'
           ) AS d;
    options:
      - "2"
      - "3"
      - "4"
      - "An error"
    answer: 1
    explanation: |
      The series is 28 February, 29 February and 1 March. February has 29 days in 2024, so the leap day counts, and both ends are included.
  # ------------------------------------------------ l05 LATERAL
  - type: exercise
    id: m16-t14
    lesson: m16-l05
    difficulty: 2
    prompt: |
      For the categories with `category_id` from 4 to 6, show the cheapest product in each category. Show three columns: `category`, `product` and `price`. Sort by `category` from A to Z.
    starter: |
      SELECT c.name AS category
      FROM categories c
      WHERE c.category_id BETWEEN 4 AND 6;
    solution: |
      SELECT c.name AS category,
             cheap.name AS product,
             cheap.price
      FROM categories c
      CROSS JOIN LATERAL (
          SELECT p.name,
                 p.price
          FROM products p
          WHERE p.category_id = c.category_id
          ORDER BY p.price ASC
          LIMIT 1
      ) AS cheap
      WHERE c.category_id BETWEEN 4 AND 6
      ORDER BY c.name;
    hints:
      - Use the top-N example, but sort the products from cheapest to most expensive.
      - "`ORDER BY p.price ASC` puts the lowest price first, and `LIMIT 1` keeps one row."
      - "... ORDER BY p.price ___ LIMIT ___ ) AS cheap WHERE c.category_id BETWEEN 4 AND 6 ORDER BY c.name;"
    ordered: true
  - type: quiz
    id: m16-t15
    lesson: m16-l05
    difficulty: 1
    question: |
      Which keyword must appear before a subquery in `FROM` when that subquery refers to a table listed before it?
    options:
      - "LATERAL"
      - "DISTINCT"
      - "EXISTS"
      - "UNNEST"
    answer: 0
    explanation: |
      Only `LATERAL` lets a subquery see the columns of the tables to its left. Without it, PostgreSQL reports an invalid reference.
  # ------------------------------------------------ l06 ROLLUP, CUBE, GROUPING SETS
  - type: exercise
    id: m16-t16
    lesson: m16-l06
    difficulty: 2
    prompt: |
      For cancelled orders only, count the orders per year, with a grand total row. Show two columns: `year` and `cancelled_orders`. Leave `year` as `NULL` on the grand total row. Sort by `year`, with the total row last.
    starter: |
      SELECT EXTRACT(YEAR FROM o.order_date)::int AS year
      FROM orders o
      WHERE o.status = 'cancelled'
      GROUP BY 1;
    solution: |
      SELECT x.yr AS year,
             COUNT(*) AS cancelled_orders
      FROM (
          SELECT EXTRACT(YEAR FROM o.order_date)::int AS yr
          FROM orders o
          WHERE o.status = 'cancelled'
      ) AS x
      GROUP BY ROLLUP (x.yr)
      ORDER BY x.yr;
    hints:
      - Use the yearly ROLLUP from the exercises, and add a filter for cancelled orders.
      - "The filter `WHERE o.status = 'cancelled'` belongs inside the subquery, next to the year."
      - "GROUP BY ___ (x.yr) ORDER BY x.yr;"
    ordered: true
    columnNames: true
  - type: quiz
    id: m16-t17
    lesson: m16-l06
    difficulty: 1
    question: |
      In a `ROLLUP` result, what does `GROUPING(c.name)` return on the grand total row?
    options:
      - "0"
      - "1"
      - "NULL"
      - "The text 'All categories'"
    answer: 1
    explanation: |
      `GROUPING` returns 1 when the column was rolled up, which is the grand total row. Normal rows return 0.
  - type: parsons
    id: m16-t18
    lesson: m16-l06
    difficulty: 2
    prompt: |
      Put the lines in the right order to show the total units sold for each order status, with a grand total row. Sort by `status`, with the total row last.
    lines:
      - SELECT o.status,
      - SUM(i.quantity) AS units
      - FROM orders o
      - JOIN order_items i ON i.order_id = o.order_id
      - GROUP BY ROLLUP (o.status)
      - ORDER BY o.status;
    distractors:
      - WHERE o.status = 'delivered'
    explanation: |
      The `WHERE` line would keep only delivered orders, so the statuses other than delivered would disappear. It does not belong in this report.
