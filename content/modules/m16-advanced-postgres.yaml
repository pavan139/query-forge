testPool:
  # ------------------------------------------------ l01 JSON basics
  - type: quiz
    id: m16-t01
    lesson: m16-l01
    difficulty: 1
    question: |
      What does `properties->>'screen'` return for a `workout_started` event?
    options:
      - "NULL, because only app_open events have a screen key"
      - "The text 'workouts'"
      - "The whole JSON object"
      - "An error, because the key is missing"
    answer: 0
    explanation: |
      A missing key does not stop the query. The arrow returns NULL. Only `app_open` events store a `screen`.
  - type: exercise
    id: m16-t02
    lesson: m16-l01
    difficulty: 1
    prompt: |
      Show `event_id` and `screen` (as text) for every `app_open` event with an `event_id` up to 8. Sort by `event_id`.
    starter: |
      SELECT event_id
      FROM events
      WHERE event_name = 'app_open';
    solution: |
      SELECT event_id,
             properties->>'screen' AS screen
      FROM events
      WHERE event_name = 'app_open'
        AND event_id <= 8
      ORDER BY event_id;
    hints:
      - Use `->>` with the key `screen`.
      - "Keep the filter `event_name = 'app_open'` and add `event_id <= 8`."
      - "SELECT event_id, properties->>'___' AS screen FROM events WHERE event_name = '___' AND event_id <= 8 ORDER BY event_id;"
    ordered: true
  - type: predict
    id: m16-t03
    lesson: m16-l01
    difficulty: 2
    question: |
      What does this query return?
    sql: |
      SELECT '100' > '93' AS bigger;
    options:
      - "true"
      - "false"
      - "NULL"
      - "An error"
    answer: 1
    explanation: |
      Both values are text, so they are compared one character at a time. The first characters are '1' and '9', and '1' comes before '9', so '100' is smaller. As numbers, 100 would be bigger than 93.
  - type: fill
    id: m16-t04
    lesson: m16-l01
    difficulty: 2
    prompt: |
      Complete the query so that `price` comes out as a number.
    template: |
      SELECT (properties ___ 'price')::___ AS price
      FROM events
      WHERE event_name = 'subscription_started'
      ORDER BY event_id
      LIMIT 1;
    answers:
      - ["->>"]
      - ["numeric", "decimal"]
    explanation: |
      `->>` gets the price as text, then `::numeric` turns it into an exact decimal number.
  # ------------------------------------------------ l02 Querying JSONB
  - type: exercise
    id: m16-t05
    lesson: m16-l02
    difficulty: 2
    prompt: |
      Show `event_id` and `price` (as a number) for every `subscription_started` event with an `event_id` of 40 or less whose properties contain `"plan": "monthly"`. Sort by `event_id`.
    starter: |
      SELECT event_id
      FROM events
      WHERE event_name = 'subscription_started';
    solution: |
      SELECT event_id,
             (properties->>'price')::numeric AS price
      FROM events
      WHERE event_name = 'subscription_started'
        AND properties @> '{"plan": "monthly"}'
        AND event_id <= 40
      ORDER BY event_id;
    hints:
      - Use `@>` with the plan you want, as in the first example.
      - "Cast the price with `::numeric` so that it shows as a number."
      - "SELECT event_id, (properties->>'___')::numeric AS price FROM events WHERE event_name = '___' AND properties @> '{\"plan\": \"___\"}' AND event_id <= 40 ORDER BY event_id;"
    ordered: true
  - type: quiz
    id: m16-t06
    lesson: m16-l02
    difficulty: 1
    question: |
      Which function opens a JSON object into one row per key, with the columns `key` and `value`?
    options:
      - "jsonb_each"
      - "jsonb_agg"
      - "jsonb_set"
      - "jsonb_build_object"
    answer: 0
    explanation: |
      `jsonb_each` returns one row for each key. `jsonb_agg` does the opposite, gathering rows into an array, and `jsonb_set` changes one value.
  - type: predict
    id: m16-t07
    lesson: m16-l02
    difficulty: 2
    question: |
      What does this query return?
    sql: |
      SELECT '{"a": {"b": 2}}'::jsonb ? 'b' AS found;
    options:
      - "true"
      - "false"
      - "NULL"
      - "An error"
    answer: 1
    explanation: |
      The `?` operator looks only at the **top-level** keys. Here the top-level key is `a`, and `b` is nested one level down, so the answer is `false`.
  - type: fill
    id: m16-t08
    lesson: m16-l02
    difficulty: 2
    prompt: |
      Complete the query so that all of user 2's event names come out as one JSON array, in time order.
    template: |
      SELECT ___(event_name ORDER BY event_id)
      FROM events
      WHERE user_id = 2;
    answers:
      - ["jsonb_agg"]
    explanation: |
      `jsonb_agg` gathers the values into one JSON array. The `ORDER BY` inside the function keeps the order of the events.
  # ------------------------------------------------ l03 Arrays
  - type: exercise
    id: m16-t09
    lesson: m16-l03
    difficulty: 2
    prompt: |
      Show `movie_id` and `title` for every film whose genres include **both** `Crime` and `Drama`. Build one genre list per film with `ARRAY_AGG`, then test it with `@>`. Sort by `movie_id`.
    starter: |
      SELECT movie_id,
             title
      FROM movies;
    solution: |
      SELECT tagged.movie_id,
             tagged.title
      FROM (
          SELECT m.movie_id,
                 m.title,
                 ARRAY_AGG(g.name ORDER BY g.name) AS genres
          FROM movies m
          JOIN movie_genres mg ON mg.movie_id = m.movie_id
          JOIN genres g ON g.genre_id = mg.genre_id
          GROUP BY m.movie_id, m.title
      ) AS tagged
      WHERE tagged.genres @> ARRAY['Crime', 'Drama']
      ORDER BY tagged.movie_id;
    hints:
      - "`@>` checks that the array contains every item on its right side."
      - "Put both genres in the array on the right: `ARRAY['Crime', 'Drama']`."
      - "WHERE tagged.genres @> ARRAY['___', '___'] ORDER BY tagged.movie_id;"
    ordered: true
  - type: quiz
    id: m16-t10
    lesson: m16-l03
    difficulty: 1
    question: |
      Which function counts every item in an array, and gives 0 for an empty array?
    options:
      - "cardinality(array)"
      - "array_length(array, 1)"
      - "unnest(array)"
      - "ARRAY_AGG(value)"
    answer: 0
    explanation: |
      `cardinality` counts all the items. For an empty array `array_length` gives `NULL`, not 0, so `cardinality` is the safer choice for counting.
  # ------------------------------------------------ l04 generate_series
  - type: exercise
    id: m16-t11
    lesson: m16-l04
    difficulty: 2
    prompt: |
      For user 2, show every day from 2024-03-04 to 2024-03-08. Show two columns: `day` (as a date) and `has_data`. `has_data` is `true` when the tracker sent a steps value that day, and `false` when it did not. Sort by `day`.
    starter: |
      SELECT d::date AS day
      FROM generate_series(
               '2024-03-04'::date,
               '2024-03-08'::date,
               '1 day'
           ) AS d;
    solution: |
      SELECT d::date AS day,
             s.steps IS NOT NULL AS has_data
      FROM generate_series(
               '2024-03-04'::date,
               '2024-03-08'::date,
               '1 day'
           ) AS d
      LEFT JOIN daily_steps s
             ON s.day = d::date
            AND s.user_id = 2
      ORDER BY day;
    hints:
      - Use the date spine with a `LEFT JOIN` to `daily_steps`, as in the example.
      - "`s.steps IS NOT NULL` is true when the join found a row."
      - "SELECT d::date AS day, s.steps ___ NULL AS has_data FROM ... LEFT JOIN daily_steps s ON s.day = d::date AND s.user_id = 2 ORDER BY day;"
    ordered: true
  - type: quiz
    id: m16-t12
    lesson: m16-l04
    difficulty: 2
    question: |
      Which join keeps every day of a date spine, even when the data has no row for that day?
    options:
      - "INNER JOIN with the data on the left"
      - "LEFT JOIN with the spine on the left"
      - "UNION of the spine and the data"
      - "SELECT DISTINCT on the data"
    answer: 1
    explanation: |
      A `LEFT JOIN` keeps every row from its left table. Put the spine on the left, and the days without data stay in the result with `NULL` values.
  - type: predict
    id: m16-t13
    lesson: m16-l04
