  # ---------------------------------------------------------------- l01 ORDER BY
  - type: exercise
    id: m03-t01
    lesson: m03-l01
    difficulty: 1
    prompt: |
      Show the `name` and `hourly_rate` of every staff member whose `role` is `'Barista'`, with the
      **lowest paid first**.
    starter: |
      SELECT name, hourly_rate
      FROM staff
      WHERE role = 'Barista'
    solution: |
      SELECT name, hourly_rate
      FROM staff
      WHERE role = 'Barista'
      ORDER BY hourly_rate;
    ordered: true
    hints:
      - The filter is already written. You only need to add the sorting clause at the end.
      - "Lowest first is the default direction, so `ORDER BY` plus the column is enough."
      - "ORDER BY ___;"
    explanation: |
      Four baristas, from Kofi Mensah (16.25) up to Ben Carter (19.75). Every hourly rate is different, so
      the order is always exactly the same. `ASC` is the default, so you did not need to type it.

  - type: quiz
    id: m03-t02
    lesson: m03-l01
    difficulty: 1
    question: |
      Maria runs `SELECT name FROM menu_items;` with **no** `ORDER BY`. What does SQL promise about the
      order of the rows?
    options:
      - They always come back in the same order, because the data has not changed
      - They come back in alphabetical order
      - Nothing. Without ORDER BY the order is not guaranteed
      - They come back with the cheapest item first
    answer: 2
    explanation: |
      Without `ORDER BY`, the database may return the rows in any order, and that order can change (for
      example after rows are updated). It often *looks* tidy, but you can never rely on it. Only
      `ORDER BY` guarantees a sequence.

  - type: exercise
    id: m03-t03
    lesson: m03-l01
    difficulty: 2
    prompt: |
      Show the `name`, `category` and `added_on` of every menu item that is **available**
      (`is_available` is true) and was added on or after **2023-01-01**. Put the **newest item first**.
    starter: |
      SELECT name, category, added_on
      FROM menu_items
      WHERE is_available
        AND added_on >= '2023-01-01'
    solution: |
      SELECT name, category, added_on
      FROM menu_items
      WHERE is_available
        AND added_on >= '2023-01-01'
      ORDER BY added_on DESC;
    ordered: true
    hints:
      - The filter is done. Now think about which direction puts the newest date on top.
      - Dates sort like numbers, so the newest (biggest) date first needs `DESC`.
      - "ORDER BY added_on ___;"
    explanation: |
      Six items qualify, from Berry Smoothie (2024-11-30) down to Veggie Hummus Wrap (2023-02-13). Three
      newer items are missing because they are not available any more: Smoked Salmon Bagel, Tiramisu Cup
      and Lemon Tart. All six dates are different, so no tie-breaker is needed.

  - type: fill
