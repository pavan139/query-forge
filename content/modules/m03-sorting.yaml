      - "ORDER BY payment_method ___, quantity ___, order_id;"
    explanation: |
      18 rows: the 3 `cash` orders first (order 176 has quantity 2, so it leads), then 7 `card` orders and
      8 `app` orders. Z to A on text puts `cash` before `card` before `app`. The last column, `order_id`,
