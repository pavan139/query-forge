  # ---------------------------------------------------------------- l02 Sorting by several columns
  - type: exercise
    id: m03-t05
    lesson: m03-l02
    difficulty: 3
    prompt: |
      Show the `order_id`, `payment_method` and `quantity` of every order placed on or after
      **2024-12-24**.

      Sort by `payment_method` **Z to A**, then by `quantity` with the **biggest first**, and finally by
      `order_id` (smallest first).
    starter: |
      SELECT order_id, payment_method, quantity
      FROM orders
      WHERE order_time >= '2024-12-24'
    solution: |
      SELECT order_id, payment_method, quantity
      FROM orders
      WHERE order_time >= '2024-12-24'
      ORDER BY payment_method DESC, quantity DESC, order_id;
    ordered: true
    hints:
      - Three sort columns, and each one has its own direction.
