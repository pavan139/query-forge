        **in this order**:

        1. `member_id` — `integer`, which is **both** the primary key **and** a foreign key that **references**
           `members (member_id)`. When the member is deleted, the card is deleted too (`ON DELETE CASCADE`).
        2. `card_number` — `text`, required and unique.
      starter: |
        CREATE TABLE library_cards (
            member_id integer,
            card_number text
        );
      solution: |
        CREATE TABLE library_cards (
            member_id integer PRIMARY KEY
                REFERENCES members (member_id)
                ON DELETE CASCADE,
