      prompt: |
        Ravi wants returned loans kept apart, so the live `loans` table stays small. Do three things, in order:

        1. Create the schema `archive`.
        2. Create the table `archive.closed_loans` as a copy of the **returned** loans only (the rows of `loans`
           where `returned_on` is **not** empty). It has the columns `loan_id`, `copy_id`, `member_id`,
           `loaned_on` and `returned_on`, in that order.
        3. Attach the note `Loans that have been returned` to `archive.closed_loans`.

        The check reads the note and shows each archived loan.
      starter: |
        CREATE SCHEMA archive;
      solution: |
        CREATE SCHEMA archive;

        CREATE TABLE archive.closed_loans AS
        SELECT loan_id, copy_id, member_id,
               loaned_on, returned_on
        FROM loans
        WHERE returned_on IS NOT NULL;

        COMMENT ON TABLE archive.closed_loans
            IS 'Loans that have been returned';
      check: |
        SELECT obj_description('archive.closed_loans'::regclass,
                               'pg_class')
        UNION ALL
        SELECT loan_id::text || ' ' || returned_on::text
        FROM archive.closed_loans
        ORDER BY 1;
      hints:
        - Start with `CREATE SCHEMA archive;`, then copy the returned loans into `archive.closed_loans`.
        - "The filter is `WHERE returned_on IS NOT NULL`, and the note uses `COMMENT ON TABLE archive.closed_loans IS`."
        - "COMMENT ON TABLE archive.closed_loans IS '___';"
      explanation: |
        Only loan 1 had been returned, so it is the only row in the archive. Each new table lives in the folder named
        in its full address, and the note tells the next person what is inside. The final design is now ready for
        the library to open.
