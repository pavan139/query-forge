id: m06
order: 6
title: JOINs — Combining Tables
subtitle: Connect customers, orders and products into one clear answer
icon: "🔗"
level: intermediate
description: |
  Real databases split information across many small tables. **JOINs** are how you stitch those tables
  back together so one query can answer questions like *"Which customer bought which product?"*

  You will learn why data is split into tables, how keys connect them, and every major kind of join:
  INNER, LEFT, RIGHT, FULL, self joins, CROSS joins and range joins. You will also learn the classic trap
  where a join silently double-counts your totals — and how to avoid it.
dataset: shop
lessons:
  - id: m06-l01
    title: Why many tables?
    summary: Why data is split into tables, and how primary keys and foreign keys connect them.
    minutes: 15
    steps:
      - type: read
        title: A question the orders table can't answer
        md: |
          Your manager at **ShopSmart** (our online store) sends you a message:

          > "Who placed order number 17, and which city do they live in?"

          You open the `orders` table and find a surprise. It has a `customer_id` (just a number) but **no
          customer name**. Where did the customer's details go?

          They live in a *different table*, called `customers`. This module is all about **JOINs**: the tool
          that lets one query reach into several tables at once. First, let's see *why* data is split up.

      - type: read
        title: Why not one giant spreadsheet?
        md: |
          Imagine we kept everything in one huge table. Every order would repeat the customer's details:

          | order_id | order_date | customer | email | city |
          |---|---|---|---|---|
          | 9 | 2023-01-15 | Jiwoo Watanabe | jiwoo.watanabe@example.org | Denver |
          | 17 | 2023-02-04 | Jiwoo Watanabe | jiwoo.watanabe@example.org | Denver |
          | 159 | 2023-08-27 | Jiwoo Watanabe | jiwoo.watanabe@example.org | Denver |

          Jiwoo has placed **12 orders** in total, so those details would be copied 12 times. That causes
          three problems:

          1. **Waste.** The same facts are stored again and again.
          2. **Painful updates.** If Jiwoo moves to Austin, you must fix 12 rows. Miss one and the data
             contradicts itself.
          3. **Typos.** One row says "Denver", another says "Denvr". Now they look like different cities.

          The fix: store each fact **once**, in the table where it belongs, and point to it with an id.

      - type: read
        title: Keys, the glue between tables
        md: |
          Two kinds of **keys** connect the tables:

          - A **primary key** (PK) is a column whose value is *different for every row*. It identifies the row,
            like a passport number. `customers.customer_id` is a primary key.
          - A **foreign key** (FK) is a column that stores *another table's primary key*. It points to a row
            over there. `orders.customer_id` is a foreign key pointing to `customers`.

          > [!ANALOGY]
          > Think of a library. Your borrowing slip doesn't repeat your name and address. It just says
          > **member #46**. If the librarian needs your details, they look #46 up in the member file.
          > That member number is a key.

          Here is the ShopSmart map for the tables you will use most:

          | table | primary key | foreign keys |
          |---|---|---|
          | `customers` | `customer_id` | none |
          | `orders` | `order_id` | `customer_id` → customers |
          | `order_items` | `order_item_id` | `order_id` → orders, `product_id` → products |
          | `products` | `product_id` | `category_id` → categories, `supplier_id` → suppliers |

          > [!MISTAKE]
          > A foreign key is **not** unique. Customer 46 appears in 12 different rows of `orders`. Only the
          > primary key must be different on every row.

      - type: example
        title: Step 1, peek at the customers table
        md: Each customer is stored **once**, with their own `customer_id`.
        sql: |
          SELECT customer_id, first_name, last_name, city
          FROM customers
          ORDER BY customer_id
          LIMIT 5;
        after: |
          Five customers, each with a different `customer_id`. That column is the **primary key**:
          no two customers share it.

      - type: example
        title: Step 2, find the order
        md: Now look at order 17 in the `orders` table.
        sql: |
          SELECT order_id, customer_id, order_date, status
          FROM orders
          WHERE order_id = 17;
        after: |
          Order 17 was placed on 2023-02-04 by customer **46**. We only get a number, not a name.
          That `customer_id` is the **foreign key**.

      - type: example
        title: Step 3, look the customer up
        md: Use that number to search the `customers` table, just like the librarian would.
        sql: |
          SELECT customer_id, first_name, last_name, city
          FROM customers
          WHERE customer_id = 46;
        after: |
          Customer 46 is **Jiwoo Watanabe from Denver**. Mission accomplished, but it took two queries and
          we had to copy the number across by hand.

      - type: example
        title: A taste of the real thing (preview)
        md: |
          A **JOIN** does those steps in one go. Don't worry about the new words, we will take it apart
          piece by piece in the next lessons. Just press **Run**.
        sql: |
          SELECT orders.order_id,
                 orders.order_date,
                 customers.first_name,
                 customers.last_name,
                 customers.city
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE orders.order_id = 17;
        after: |
          One query, one row, with the order details *and* the customer's name and city side by side.
          The database followed the foreign key for you.

      - type: exercise
        id: m06-l01-e1
        title: Find an order
        prompt: |
          Show the `order_id`, `customer_id`, `order_date` and `status` of the order with `order_id` 250.
        starter: |
          SELECT order_id, ___
          FROM orders
          WHERE ___;
        solution: |
          SELECT order_id, customer_id, order_date, status
          FROM orders
          WHERE order_id = 250;
        hints:
          - This is the same shape as Step 2 above, only the order number changes.
          - List the four columns after SELECT, separated by commas, and filter with WHERE order_id = ...
          - "SELECT order_id, customer_id, order_date, ___ FROM orders WHERE order_id = 250;"
        explanation: |
          Order 250 belongs to customer **87**, and it was cancelled. Remember that number: the next
          exercise uses it.
        difficulty: 1

      - type: exercise
        id: m06-l01-e2
        title: Follow the foreign key
        prompt: |
          Order 250 was placed by customer 87. Look that customer up: show their `first_name`, `last_name`
          and `city`.
        starter: |
          SELECT first_name, last_name, city
          FROM customers
          WHERE ___;
        solution: |
          SELECT first_name, last_name, city
          FROM customers
          WHERE customer_id = 87;
        hints:
          - Which table stores the customers' names?
          - Filter on the primary key of that table, customer_id.
          - "SELECT first_name, last_name, city FROM customers WHERE customer_id = ___;"
        explanation: |
          Sofia Saleh from Atlanta. You just did a join **by hand**: read a foreign key in one table, then
          looked up the matching primary key in another.
        difficulty: 1

      - type: quiz
        id: m06-l01-q1
        question: |
          The column `customer_id` exists in both `customers` and `orders`. Which statement is true?
        options:
          - It is the primary key in both tables.
          - It is the primary key in `customers` and a foreign key in `orders`.
          - It is a foreign key in `customers` and the primary key in `orders`.
          - It must contain different values in every row of both tables.
        answer: 1
        explanation: |
          In `customers`, each `customer_id` is unique (primary key). In `orders`, it points back to a
          customer (foreign key) and can repeat, because one customer can place many orders.

      - type: read
        title: Reading the map, one-to-many
        md: |
          Whenever one row in table A can be linked to *many* rows in table B, we call it a
          **one-to-many relationship**. ShopSmart is full of them:

          ```
          customers  1 ───< ∞  orders
          orders     1 ───< ∞  order_items
          products   1 ───< ∞  order_items
          categories 1 ───< ∞  products
          orders     1 ───< ∞  payments
          ```

          Read `1 ───< ∞` as: **one** customer, **many** orders. The "many" side holds the foreign key:

          ```
          orders.customer_id     → customers.customer_id
          order_items.order_id   → orders.order_id
          order_items.product_id → products.product_id
          products.category_id   → categories.category_id
          payments.order_id      → orders.order_id
          ```

          An order can hold several products, and a product can be in many orders. The `order_items`
          table sits in the middle and connects the two: one row per product per order.

      - type: exercise
        id: m06-l01-e3
        title: One customer, many orders
        prompt: |
          List every order placed by customer 6: show `order_id`, `order_date` and `status`.
          Put the newest order first; if two orders share a date, the higher `order_id` comes first.
        starter: |
          SELECT order_id, order_date, status
          FROM orders
          WHERE ___
          ORDER BY ___;
        solution: |
          SELECT order_id, order_date, status
          FROM orders
          WHERE customer_id = 6
          ORDER BY order_date DESC, order_id DESC;
        ordered: true
        hints:
          - Filter on the foreign key column in orders.
          - "WHERE customer_id = 6, then sort with ORDER BY order_date DESC and a tie-breaker."
          - "ORDER BY order_date DESC, order_id DESC;"
        explanation: |
          You get **23 rows** for one customer. That is the "many" side of one-to-many: customer 6 appears
          23 times in the foreign key column of `orders`, but only once in `customers`.
        difficulty: 2

      - type: predict
        id: m06-l01-p1
        question: |
          Order 17 contains several products. How many rows will this query return?
        sql: |
          SELECT *
          FROM order_items
          WHERE order_id = 17;
        options: ["1 row", "4 rows", "2,296 rows", "An error"]
        answer: 1
        explanation: |
          Each product in an order gets its own row in `order_items`, and order 17 has 4 products. The
          `order_id` column here is a foreign key, so the same order number appears on several rows.

      - type: example
        title: The database guards the keys (preview)
        md: |
          Foreign keys are not just labels: PostgreSQL **enforces** them. This `INSERT` (you will learn it in
          module 12) tries to add an order for customer 99999, who doesn't exist. Run it and read the error.
        sql: |
          INSERT INTO orders (order_id, customer_id, order_date, status, ship_city)
          VALUES (9999, 99999, '2024-12-31', 'processing', 'Denver');
        expectError: true
        after: |
          The database refuses: *violates foreign key constraint*. An order must point at a real customer,
          so a foreign key can never be left dangling. (Nothing was saved, and every Run starts fresh anyway.)

      - type: quiz
        id: m06-l01-q2
        question: |
          An order can contain many products, and one product can appear in many orders. Which table connects
          `orders` and `products`?
        options: [customers, order_items, payments, categories]
        answer: 1
        explanation: |
          `order_items` has one row per product per order, with foreign keys to both `orders` and `products`.
          A table like this, in the middle of two others, is called a **bridge table** (or junction table).

      - type: fill
        id: m06-l01-f1
        prompt: Complete the query to look up the customer with `customer_id` 46.
        template: |
          SELECT first_name, last_name, city
          FROM ___
          WHERE ___ = 46;
        answers:
          - [customers]
          - [customer_id]
        explanation: |
          The customer's details live in `customers`, and `customer_id` is the key we search by.

      - type: exercise
        id: m06-l01-e4
        title: Primary key vs foreign key, by the numbers
        prompt: |
          In one row, show these three numbers for the `orders` table, using exactly these column names:

          - `total_rows`: how many rows the table has
          - `distinct_order_ids`: how many *different* `order_id` values
          - `distinct_customer_ids`: how many *different* `customer_id` values
        starter: |
          SELECT COUNT(*) AS total_rows,
                 ___
          FROM orders;
        solution: |
          SELECT COUNT(*) AS total_rows,
                 COUNT(DISTINCT order_id) AS distinct_order_ids,
                 COUNT(DISTINCT customer_id) AS distinct_customer_ids
          FROM orders;
        columnNames: true
        hints:
          - Use COUNT(DISTINCT column) to count different values (you met it in module 5).
          - "Three expressions in one SELECT, each with an AS alias."
          - "COUNT(DISTINCT order_id) AS distinct_order_ids, COUNT(DISTINCT customer_id) AS ___"
        explanation: |
          The result is **900, 900, 140**. The primary key is unique (900 orders, 900 different ids). The
          foreign key repeats: just 140 different customers placed all 900 orders. The other 10 customers
          have never ordered, which will matter a lot in the lesson on LEFT JOIN.
        difficulty: 3

    cheatsheet:
      - title: Primary key vs foreign key
        sql: |
          -- customers.customer_id  is the PRIMARY KEY (unique)
          -- orders.customer_id     is a FOREIGN KEY (can repeat)
          SELECT * FROM orders WHERE customer_id = 46;
        note: The foreign key stores another table's primary key. One customer, many orders.
      - title: Doing a join by hand
        sql: |
          SELECT customer_id FROM orders WHERE order_id = 17;
          SELECT * FROM customers WHERE customer_id = 46;
        note: Copy the key from one table, search for it in the other. A JOIN automates exactly this.

  - id: m06-l02
    title: INNER JOIN
    summary: Combine two tables by matching rows with ON, and see only the rows that match.
    minutes: 20
    steps:
      - type: read
        title: Names, not numbers
        md: |
          Marketing sends you a request:

          > "Can I get a list of orders with the **customer's name** next to each one? A column of customer
          > numbers doesn't help me."

          You know where the data lives: order details in `orders`, names in `customers`. The tool that
          connects them is the **INNER JOIN**.

          An INNER JOIN lines up rows from two tables wherever a **matching rule** is true (usually
          "the foreign key equals the primary key"). Rows with no partner are left out.

          > [!ANALOGY]
          > Picture every order as a sticky note with a customer number on it. You walk through the
          > customer address book, and wherever a note's number matches an entry, you staple the two
          > together. Notes or entries with no partner stay behind. What you hold at the end is the
          > **inner join**.

      - type: viz
        viz: join
        title: Watch the matching happen
        md: |
          Two tiny tables. Ben and Dee have no orders. Hover over a result row to see where it came from.
          The coloured stripe shows which rows were matched on `id = customer_id`.
        config:
          left:
            name: customers
            columns: [id, name]
            rows: [[1, Ana], [2, Ben], [3, Chen], [4, Dee]]
          right:
            name: orders
            columns: [order_id, customer_id, total]
            rows: [[101, 1, 25], [102, 1, 8], [103, 3, 40], [104, 3, 15]]
          on: [id, customer_id]
          types: [inner]

      - type: read
        title: The shape of a join
        md: |
          Here is the pattern. Read it top to bottom:

          ```sql
          SELECT columns you want
          FROM first_table
          INNER JOIN second_table
              ON first_table.key = second_table.key;
          ```

          - `FROM` names the first table.
          - `INNER JOIN` names the second table.
          - `ON` is the **matching rule**: when it is true for a pair of rows, that pair goes in the result.

          Writing just `JOIN` means exactly the same as `INNER JOIN`. Most people use the short form.

          > [!TIP]
          > Write columns as `table_name.column_name` (for example `orders.customer_id`). It makes clear
          > which table each column comes from. In this lesson, pick columns that exist in only one of the
          > two tables. The next lesson shows what happens when both tables have a column of the same name.

      - type: example
        title: Orders with customer names
        md: Join `orders` to `customers` and show the first ten orders.
        sql: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          INNER JOIN customers
              ON orders.customer_id = customers.customer_id
          ORDER BY order_id
          LIMIT 10;
        after: |
          Each row mixes columns from **both** tables: `order_id` and `order_date` come from `orders`,
          `first_name` and `last_name` from `customers`. Notice that Kenji Kobayashi appears twice
          (orders 5 and 8): one customer, many orders.

      - type: example
        title: JOIN is short for INNER JOIN, and WHERE still works
        md: |
          You can add `WHERE` and `ORDER BY` after the join, just like with a single table. Here are the
          delivered orders from customers who live in Denver, placed in December 2024.
        sql: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE city = 'Denver'
            AND status = 'delivered'
            AND order_date >= '2024-12-01'
          ORDER BY order_date, order_id;
        after: |
          Five orders. The filter on `city` (a `customers` column) and the filter on `status` (an `orders`
          column) work together, because after the join each row holds both.

      - type: example
        title: Order lines with product names
        md: |
          The same idea works for any pair of tables linked by a key. `order_items` stores
          `product_id` (a number); `products` stores the product's `name`.
        sql: |
          SELECT order_id, name, quantity, unit_price
          FROM order_items
          JOIN products
              ON order_items.product_id = products.product_id
          WHERE order_id = 17;
        after: |
          Earlier, order 17's lines were just product numbers. Now we can read what was bought:
          a desk mat, a kettle, a pillow and a journal (quantity 2).

      - type: stepper
        title: Build a join one piece at a time
        md: Click through the stages and press Run on each. Every stage adds one idea.
        stages:
          - label: One table
            md: Start with just `orders`. It has 7 columns and 900 rows (we only show the first 3).
            sql: |
              SELECT *
              FROM orders
              ORDER BY order_id
              LIMIT 3;
          - label: Add the JOIN
            md: |
              `JOIN customers ON ...` glues each order to its customer. The result has the columns of
              **both** tables side by side. Scroll right to see the customer columns.
            sql: |
              SELECT *
              FROM orders
              JOIN customers
                  ON orders.customer_id = customers.customer_id
              ORDER BY order_id
              LIMIT 3;
          - label: Pick columns
            md: '`SELECT *` is too much. Choose only the columns you need.'
            sql: |
              SELECT order_id, order_date, first_name, last_name
              FROM orders
              JOIN customers
                  ON orders.customer_id = customers.customer_id
              ORDER BY order_id
              LIMIT 3;
          - label: Filter and sort
            md: Add `WHERE` to filter the joined rows, and `ORDER BY` to sort them.
            sql: |
              SELECT order_id, order_date, first_name, last_name
              FROM orders
              JOIN customers
                  ON orders.customer_id = customers.customer_id
              WHERE status = 'delivered'
              ORDER BY order_date DESC, order_id DESC
              LIMIT 3;

      - type: exercise
        id: m06-l02-e1
        title: Orders still processing
        prompt: |
          Show `order_id`, `order_date`, `first_name` and `last_name` for every order whose `status` is
          `'processing'`. Sort by `order_id`.
        starter: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          JOIN customers
              ON ___
          WHERE ___
          ORDER BY order_id;
        solution: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE status = 'processing'
          ORDER BY order_id;
        ordered: true
        hints:
          - This is the first example again, with a WHERE filter added after the join.
          - "The ON rule links the foreign key to the primary key: orders.customer_id = customers.customer_id."
          - "WHERE status = 'processing' goes after the JOIN ... ON ... lines and before ORDER BY."
        explanation: |
          Seven orders are still being processed, and now you can see **who** is waiting for them.
          `status` lives in `orders`, but you could just as well have filtered on a `customers` column.
        difficulty: 1

      - type: exercise
        id: m06-l02-e2
        title: What is in order 100?
        prompt: |
          Show the product `name`, `quantity` and `unit_price` of every line in order 100 (join
          `order_items` with `products`).
        starter: |
          SELECT name, quantity, unit_price
          FROM order_items
          JOIN products
              ON ___
          WHERE order_id = 100;
        solution: |
          SELECT name, quantity, unit_price
          FROM order_items
          JOIN products
              ON order_items.product_id = products.product_id
          WHERE order_id = 100;
        hints:
          - Which column do order_items and products share?
          - "Both tables have product_id. Match them in the ON rule."
          - "ON order_items.product_id = products.product_id"
        explanation: |
          Four lines: a blender, a water bottle, a sleeping bag and a cookbook. Each `order_items` row found
          its product through `product_id`.
        difficulty: 1

      - type: read
        title: When the ON rule is wrong
        md: |
          The database never checks whether your `ON` rule *makes sense*. It just matches whatever you tell it
          to match. A wrong rule gives a result that **looks fine but is wrong**.

          > [!MISTAKE]
          > Joining on the wrong columns, for example `orders.order_id = customers.customer_id`. Order 1 gets
          > matched with customer 1 (Felix White) just because both numbers are 1. The query runs without any
          > error, but the names are nonsense. Always join a **foreign key** to the **primary key it points to**.

      - type: exercise
        id: m06-l02-e3
        title: Fix the wrong match
        prompt: |
          This query should show the first customer name for orders 1 to 4, but the names are wrong because
          the `ON` rule joins the wrong columns. Fix it. Keep the same columns, and sort by `order_id`.
        starter: |
          SELECT orders.order_id, first_name
          FROM orders
          JOIN customers
              ON orders.order_id = customers.customer_id
          WHERE orders.order_id <= 4
          ORDER BY orders.order_id;
        solution: |
          SELECT orders.order_id, first_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE orders.order_id <= 4
          ORDER BY orders.order_id;
        ordered: true
        hints:
          - Compare the ON line with the one in the first example.
          - The foreign key in orders is customer_id, not order_id.
          - "ON orders.customer_id = customers.customer_id"
        explanation: |
          Orders 1 to 4 belong to Anya, Ingrid, Seun and Freya. The broken version matched order numbers
          with customer numbers and handed out the wrong names. Same row count, wrong answer: the sneakiest
          kind of bug!
        difficulty: 2

      - type: predict
        id: m06-l02-p1
        question: |
          The 900 orders in the shop belong to 140 different customers (the other 10 customers never ordered).
          How many rows does this query return?
        sql: |
          SELECT COUNT(*)
          FROM customers
          INNER JOIN orders
              ON customers.customer_id = orders.customer_id;
        options: ["150", "140", "900", "910"]
        answer: 2
        explanation: |
          An INNER JOIN returns **one row per matching pair**. Every one of the 900 orders matches exactly one
          customer, so 900 pairs. The 10 customers without orders have no partner and disappear.
          Customers with many orders simply appear many times.

      - type: exercise
        id: m06-l02-e4
        title: Returned orders in Texas
        prompt: |
          Show `order_id`, `order_date`, `first_name` and `last_name` for orders with status `'returned'`
          that were placed in 2024 (on or after `'2024-01-01'`) by customers whose `state` is `'TX'`.
          Sort by `order_date`, then `order_id`.
        starter: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE ___
          ORDER BY order_date, order_id;
        solution: |
          SELECT order_id, order_date, first_name, last_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE status = 'returned'
            AND order_date >= '2024-01-01'
            AND state = 'TX'
          ORDER BY order_date, order_id;
        ordered: true
        hints:
          - You need three conditions combined with AND. One of them is about a customers column.
          - "state is a column of customers; status and order_date are columns of orders."
          - "WHERE status = 'returned' AND order_date >= '2024-01-01' AND state = ___"
        explanation: |
          Eleven returned orders. A single `WHERE` can mix conditions on columns from both tables, because
          the join has already put them in the same row.
        difficulty: 2

      - type: exercise
        id: m06-l02-e5
        title: Price of each line
        prompt: |
          For order 100, show each product `name` and its `line_total`, which is
          `quantity * unit_price * (1 - discount)` rounded to 2 decimals. Use exactly the column names
          `name` and `line_total`.
        starter: |
          SELECT name,
                 ROUND(___, 2) AS line_total
          FROM order_items
          JOIN products
              ON ___
          WHERE order_id = 100;
        solution: |
          SELECT name,
                 ROUND(quantity * unit_price * (1 - discount), 2) AS line_total
          FROM order_items
          JOIN products
              ON order_items.product_id = products.product_id
          WHERE order_id = 100;
        columnNames: true
        hints:
          - You can do arithmetic in SELECT on columns from the joined rows, exactly as in module 1.
          - "ROUND(quantity * unit_price * (1 - discount), 2) AS line_total"
          - "Don't forget the ON rule: order_items.product_id = products.product_id"
        explanation: |
          Prices (`unit_price`, `discount`, `quantity`) come from `order_items`, the name from `products`.
          Once joined, they are just columns in one row, so you can calculate with them freely.
        difficulty: 2

      - type: example
        title: Forgetting the ON rule
        md: What happens if you write `INNER JOIN` but forget `ON`? Run it and read the message.
        sql: |
          SELECT order_id, first_name
          FROM orders
          INNER JOIN customers;
        expectError: true
        after: |
          A **syntax error**: after `INNER JOIN customers` the database was still waiting for `ON ...`.
          Every `INNER JOIN` needs its matching rule. (An `ON` with the wrong columns is far worse than a
          missing one, because that gives no error at all.)

      - type: quiz
        id: m06-l02-q1
        question: |
          Customer 145 has never placed an order. Will they appear in the result of `customers INNER JOIN orders`
          (matching on `customer_id`)?
        options:
          - "Yes, once, with empty order columns"
          - "Yes, 145 times"
          - "No, they have no matching row in orders"
          - "No, because INNER JOIN only keeps customers from Texas"
        answer: 2
        explanation: |
          An INNER JOIN keeps **only** pairs that match. Customer 145 has no orders to pair with, so they
          vanish from the result. The next-but-one lesson (LEFT JOIN) shows how to keep them.

      - type: fill
        id: m06-l02-f1
        prompt: Complete the join so it shows each order with its customer's first name.
        template: |
          SELECT order_id, first_name
          FROM orders
          ___ customers
              ___ orders.customer_id = customers.customer_id;
        answers:
          - [INNER JOIN, JOIN]
          - [ON]
        explanation: |
          `JOIN` (or `INNER JOIN`) names the second table and `ON` introduces the matching rule.

      - type: exercise
        id: m06-l02-e6
        title: Orders per customer segment
        prompt: |
          How many orders were placed by each customer `segment`? Show `segment` and the number of orders,
          named `order_count`. Put the segment with the most orders first.
        starter: |
          SELECT segment, COUNT(*) AS order_count
          FROM orders
          JOIN customers
              ON ___
          GROUP BY ___
          ORDER BY ___;
        solution: |
          SELECT segment, COUNT(*) AS order_count
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          GROUP BY segment
          ORDER BY order_count DESC;
        columnNames: true
        ordered: true
        hints:
          - Join first, then group. After the join, each row is one order with its customer's segment.
          - "GROUP BY segment, with COUNT(*) counting the joined rows in each group."
          - "ORDER BY order_count DESC puts the biggest segment first."
        explanation: |
          Consumers placed 552 orders, Home Office 188 and Corporate 160. This is the pattern you will use
          constantly: **join to bring the columns together, then GROUP BY to summarise them.**
        difficulty: 3

    cheatsheet:
      - title: INNER JOIN
        sql: |
          SELECT orders.order_id, customers.first_name
          FROM orders
          INNER JOIN customers
              ON orders.customer_id = customers.customer_id;
        note: Keeps only rows that have a match in both tables. JOIN alone means INNER JOIN.
      - title: Filter and sort a join
        sql: |
          SELECT order_id, first_name
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          WHERE status = 'delivered'
          ORDER BY order_id;
        note: WHERE, ORDER BY and LIMIT work after the join, on columns from either table.
      - title: Join, then summarise
        sql: |
          SELECT segment, COUNT(*) AS order_count
          FROM orders
          JOIN customers
              ON orders.customer_id = customers.customer_id
          GROUP BY segment;
        note: Join first to bring columns together, then GROUP BY to count or add things up.

  - id: m06-l03
    title: Table aliases
    summary: Give tables short nicknames, fix the "ambiguous column" error, and meet the USING shortcut.
    minutes: 18
    steps:
      - type: read
        title: Typing less, saying more
        md: |
          Look at the joins you have written so far. `orders.customer_id = customers.customer_id` is a lot
          to type, and it gets worse with three or four tables.

          The cure is a **table alias**: a short nickname you give a table inside one query. Instead of
          `customers` you can write `c`, and instead of `orders` you can write `o`.

          > [!ANALOGY]
          > Your friend Alexandra might be "Alex" to everyone in the group chat. The nickname only works
          > inside that chat, and it points at the same person. A table alias works only inside one query,
          > and it points at the same table.

      - type: example
        title: Your first aliases
        md: |
          The alias goes right after the table name in `FROM` / `JOIN`, with `AS` in between.
          From then on, use the alias everywhere in the query.
        sql: |
          SELECT o.order_id, o.order_date, c.first_name, c.city
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          ORDER BY o.order_id
          LIMIT 5;
        after: |
          The same result as before, but the query is shorter and every column says where it came from:
          `o.` for orders, `c.` for customers. The word `AS` is optional for table aliases, so
          `FROM orders o` works too. Most people use that shorter form.

      - type: read
        title: Alias habits that pay off
        md: |
          - Pick short but meaningful names: `o` for orders, `c` for customers, `oi` for order_items,
            `p` for products. Don't use `a`, `b`, `c` for everything; you'll forget which is which.
          - **Always put the alias in front of every column** when you join (`o.order_id`), even when the
            name is unique. Your future self will thank you.
          - An alias lives only for that query. Nothing is renamed in the database.

          > [!MISTAKE]
          > Giving two tables the **same** alias, for example `orders AS o JOIN customers AS o`. PostgreSQL
          > stops with *table name "o" specified more than once*. Every table in a query needs its own
          > nickname.

      - type: example
        title: The "ambiguous column" error
        md: |
          Both `orders` and `customers` have a column called `customer_id`. What if we just ask for
          `customer_id` without saying which table?
        sql: |
          SELECT customer_id, first_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id;
        expectError: true
        after: |
          *column reference "customer_id" is ambiguous*. The database sees two columns with that name and
          refuses to guess which one you mean. Fix it by naming the table: `o.customer_id` or
          `c.customer_id`.

      - type: example
        title: Fixing it with a prefix
        md: |
          Let's show **both** versions of `customer_id` side by side. We rename them with `AS` so we can
          tell them apart.
        sql: |
          SELECT o.order_id,
                 o.customer_id AS in_orders,
                 c.customer_id AS in_customers,
                 c.first_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          ORDER BY o.order_id
          LIMIT 3;
        after: |
          The two numbers are always equal, because that is exactly what the `ON` rule demanded. So it
          doesn't matter which one you pick, but you **must** pick one.

      - type: example
        title: Once aliased, use the alias
        md: |
          Here is a classic slip. We gave `orders` the alias `o`, then used the long name `orders` anyway.
        sql: |
          SELECT orders.order_id, c.first_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id;
        expectError: true
        after: |
          *invalid reference to FROM-clause entry for table "orders"*, and PostgreSQL even adds a hint:
          *Perhaps you meant to reference the table alias "o"*. After you rename a table in `FROM`, the old
          name no longer works in that query.

      - type: exercise
        id: m06-l03-e1
        title: Aliases in action
        prompt: |
          Using the aliases `o` for orders and `c` for customers, show `order_id`, `order_date`,
          `first_name` and `city` of the **cancelled** orders (`status = 'cancelled'`). Sort by `order_id`
          and keep only the first 6 rows.
        starter: |
          SELECT o.order_id, o.order_date, c.first_name, c.city
          FROM orders AS o
          JOIN customers AS c
              ON ___
          WHERE ___
          ORDER BY o.order_id
          LIMIT 6;
        solution: |
          SELECT o.order_id, o.order_date, c.first_name, c.city
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          WHERE o.status = 'cancelled'
          ORDER BY o.order_id
          LIMIT 6;
        ordered: true
        hints:
          - Start from the first alias example and add a WHERE filter.
          - "The ON rule is o.customer_id = c.customer_id. The filter is about o.status."
          - "WHERE o.status = 'cancelled' goes before ORDER BY."
        explanation: |
          Orders 12, 15, 18, 19, 26 and 30 are the first six cancelled ones. Because `order_id` is unique,
          sorting by it gives a stable "first 6".
        difficulty: 1

      - type: exercise
        id: m06-l03-e2
        title: Fix the ambiguous column
        prompt: |
          This query is supposed to list `order_id`, `customer_id` and `last_name` for orders 1 to 5, but it
          fails with an "ambiguous" error. Fix it (take `customer_id` from the `orders` table).
        starter: |
          SELECT o.order_id, customer_id, c.last_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          WHERE o.order_id <= 5
          ORDER BY o.order_id;
        solution: |
          SELECT o.order_id, o.customer_id, c.last_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          WHERE o.order_id <= 5
          ORDER BY o.order_id;
        ordered: true
        hints:
          - "Read the error: which column name is ambiguous?"
          - Both tables have customer_id. Put an alias in front of it.
          - "Change customer_id to o.customer_id in the SELECT list."
        explanation: |
          Any column that exists in **both** tables needs a prefix. A good habit is to prefix *every* column
          in a join, then you never see this error.
        difficulty: 1

      - type: predict
        id: m06-l03-p1
        question: |
          Both `products` and `categories` have a column called `name`. What happens when you run this?
        sql: |
          SELECT name
          FROM products AS p
          JOIN categories AS c
              ON p.category_id = c.category_id;
        options:
          - A list of product names
          - A list of category names
          - Both names, side by side
          - 'An error: column reference "name" is ambiguous'
        answer: 3
        expectError: true
        explanation: |
          Same trap as with `customer_id`, only this time the column is `name`. You must say `p.name` or
          `c.name`. And if you want both in one result, give them different labels with `AS`.

      - type: read
        title: USING, a shortcut for same-named keys
        md: |
          When the key columns have the **same name in both tables** (like `customer_id`), there is a
          shortcut:

          ```sql
          FROM orders o
          JOIN customers c USING (customer_id)
          ```

          This means "match rows where `customer_id` is equal on both sides". Two nice side effects:
          the result has **one** `customer_id` column (not two), and you can write `customer_id` without a
          prefix, because it is no longer ambiguous.

          `USING` only works when the names are identical and the rule is plain equality. For anything else
          you still need `ON`.

          > [!WARNING]
          > You may meet a third form, `NATURAL JOIN`. It silently joins on **every** column the two tables
          > share by name. If someone later adds a same-named column to one of the tables, the join changes
          > meaning without any warning. Prefer `ON` or `USING`, where you state the rule yourself.

      - type: example
        title: USING in action
        md: |
          With `USING`, the join column appears once and needs no prefix.
        sql: |
          SELECT customer_id, first_name, order_id, order_date
          FROM orders
          JOIN customers USING (customer_id)
          WHERE customer_id = 6
          ORDER BY order_date, order_id
          LIMIT 5;
        after: |
          Noor's first five orders. Note that `customer_id` is used in `SELECT` and in `WHERE` without any
          prefix, and no error appears. `SELECT *` would also show `customer_id` just once (16 columns
          instead of 17).

      - type: exercise
        id: m06-l03-e3
        title: Join with USING
        prompt: |
          Use `JOIN ... USING (customer_id)` to show `customer_id`, `first_name`, `order_id` and
          `order_date` for the orders of customer **14**, sorted by `order_date` then `order_id`, keeping
          only the first 4 rows.
        starter: |
          SELECT customer_id, first_name, order_id, order_date
          FROM orders
          JOIN customers USING (___)
          WHERE ___
          ORDER BY order_date, order_id
          LIMIT 4;
        solution: |
          SELECT customer_id, first_name, order_id, order_date
          FROM orders
          JOIN customers USING (customer_id)
          WHERE customer_id = 14
          ORDER BY order_date, order_id
          LIMIT 4;
        ordered: true
        hints:
          - USING takes the shared column name in parentheses.
          - "USING (customer_id), and then customer_id needs no prefix anywhere."
          - "WHERE customer_id = 14"
        explanation: |
          Jia's first four orders. Compare the two spellings: `ON o.customer_id = c.customer_id` versus
          `USING (customer_id)`. Same rows. Use whichever is clearer; `ON` is the one that always works.
        difficulty: 2

      - type: exercise
        id: m06-l03-e4
        title: Two columns called "name"
        prompt: |
          Show every product priced **above 500**: its name as `product`, its category's name as `category`
          and its `price`. Use exactly those column names. Sort by `price` (highest first), then by product
          name. Use the aliases `p` and `c`.
        starter: |
          SELECT p.name AS product,
                 c.name AS ___,
                 p.price
          FROM products AS p
          JOIN categories AS c
              ON ___
          WHERE ___
          ORDER BY ___;
        solution: |
          SELECT p.name AS product,
                 c.name AS category,
                 p.price
          FROM products AS p
          JOIN categories AS c
              ON p.category_id = c.category_id
          WHERE p.price > 500
          ORDER BY p.price DESC, p.name;
        columnNames: true
        ordered: true
        hints:
          - Products point to their category with category_id.
          - "Both tables have name, so label them with AS: p.name AS product, c.name AS category."
          - "ORDER BY p.price DESC, p.name; the WHERE is p.price > 500."
        explanation: |
          Eight products cost more than $500: laptops, phones and a mini PC. Two `AS` labels turned two
          identical column names into two clear ones.
        difficulty: 2

      - type: exercise
        id: m06-l03-e5
        title: Products per supplier country
        prompt: |
          How many products does each supplier country provide? Join `products` (alias `p`) to `suppliers`
          (alias `s`) and show `country` and the number of products as `products`. Sort by the number of
          products (most first), then by `country`.
        starter: |
          SELECT s.country, COUNT(*) AS products
          FROM products AS p
          JOIN suppliers AS s
              ON ___
          GROUP BY ___
          ORDER BY ___;
        solution: |
          SELECT s.country, COUNT(*) AS products
          FROM products AS p
          JOIN suppliers AS s
              ON p.supplier_id = s.supplier_id
          GROUP BY s.country
          ORDER BY products DESC, s.country;
        columnNames: true
        ordered: true
        hints:
          - The foreign key is products.supplier_id, the primary key is suppliers.supplier_id.
          - Join, then GROUP BY s.country and COUNT(*).
          - "ORDER BY products DESC, s.country"
        explanation: |
          China supplies 17 products, Germany 9 and so on. The counts add up to **57**, not 60: three products
          have no supplier (`supplier_id` is NULL), and an INNER JOIN drops rows that find no partner.
          Keep that in mind for the LEFT JOIN lesson.
        difficulty: 2

      - type: quiz
        id: m06-l03-q1
        question: |
          You wrote `FROM orders AS o JOIN customers AS c ON ...`. Which expression correctly refers to the
          order date inside that query?
        options: [orders.order_date, o.order_date, "order.o_date", "o->order_date"]
        answer: 1
        explanation: |
          Once a table has an alias, use the alias: `o.order_date`. The original name `orders` no longer
          works in this query, as you saw in the error earlier.

      - type: fill
        id: m06-l03-f1
        prompt: Give the tables the aliases `o` and `c`, then complete the query.
        template: |
          SELECT o.order_id, c.first_name
          FROM orders AS ___
          JOIN customers AS c
              ON o.customer_id = ___.customer_id;
        answers:
          - [o]
          - [c]
        explanation: |
          The alias after `AS` is the name you then use in front of every column.

      - type: parsons
        id: m06-l03-o1
        prompt: |
          Put the lines in order to list the first 5 orders from customers living in California
          (`state = 'CA'`), sorted by `order_id`.
        lines:
          - SELECT o.order_id, c.first_name
          - FROM orders AS o
          - JOIN customers AS c
          - "    ON o.customer_id = c.customer_id"
          - WHERE c.state = 'CA'
          - ORDER BY o.order_id
          - LIMIT 5;
        distractors:
          - "    ON o.order_id = c.customer_id"
        explanation: |
          The order is always SELECT, FROM, JOIN ... ON, WHERE, ORDER BY, LIMIT. The distractor joins the
          wrong columns: it would run, but it would hand out the wrong customers.

      - type: exercise
        id: m06-l03-e6
        title: Prices that changed
        prompt: |
          Some products had a different price when they were ordered. For order lines of orders **1 to 40**
          (`order_id <= 40`), show the lines where the price paid is different from the product's current
          price. Show `order_id`, the product name as `product`, the price paid (`unit_price`) as `paid`
          and the current `price` as `current_price`. Sort by `order_id`, then by `product`. Use `oi` and
          `p` as aliases.
        starter: |
          SELECT oi.order_id,
                 p.name AS product,
                 oi.unit_price AS paid,
                 ___ AS current_price
          FROM order_items AS oi
          JOIN products AS p
              ON ___
          WHERE oi.order_id <= 40
            AND ___
          ORDER BY oi.order_id, product;
        solution: |
          SELECT oi.order_id,
                 p.name AS product,
                 oi.unit_price AS paid,
                 p.price AS current_price
          FROM order_items AS oi
          JOIN products AS p
              ON oi.product_id = p.product_id
          WHERE oi.order_id <= 40
            AND oi.unit_price <> p.price
          ORDER BY oi.order_id, product;
        columnNames: true
        ordered: true
        hints:
          - The join is order_items to products on product_id. The extra condition compares two columns.
          - "Different from is <> (you met it in module 2). Compare oi.unit_price with p.price."
          - "WHERE oi.order_id <= 40 AND oi.unit_price <> p.price"
        explanation: |
          Twelve lines were sold at an older price. `order_items.unit_price` remembers the price **at the time
          of the order**, while `products.price` is today's price. This is why revenue should always be
          calculated from `unit_price` in `order_items`, not from `products.price`.
        difficulty: 3

    cheatsheet:
      - title: Table aliases
        sql: |
          SELECT o.order_id, c.first_name
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id;
        note: Give each table a short nickname and put it in front of every column. AS is optional.
      - title: Fix an ambiguous column
        sql: |
          SELECT p.name AS product, c.name AS category
          FROM products p
          JOIN categories c ON p.category_id = c.category_id;
        note: A column that exists in both tables needs a prefix. Use AS to give same-named columns different labels.
      - title: USING
        sql: |
          SELECT customer_id, first_name, order_id
          FROM orders
          JOIN customers USING (customer_id);
        note: Shortcut for same-named key columns. The key appears once and needs no prefix.

  - id: m06-l04
    title: LEFT JOIN
    summary: Keep every row from the left table, fill gaps with NULL, and find rows that have no match.
    minutes: 25
    steps:
      - type: read
        title: The "we miss you" email
        md: |
          The marketing team has a new idea:

          > "Send a *we miss you* discount code to every customer who has **never** placed an order."

          You try an INNER JOIN between `customers` and `orders`... and the people you are looking for
          are exactly the ones that **disappear**, because they have no orders to match.

          You need a join that says: *"Keep every customer, whether or not they have orders."* That is the
          **LEFT JOIN**.

          > [!ANALOGY]
          > Think of a class roll call. The teacher's list (the **left** table) has every student. Next to each
          > name you write down the homework they handed in. Students who handed nothing still stay on the
          > list, with an empty box. A LEFT JOIN is that list with empty boxes.

      - type: viz
        viz: join
        title: LEFT JOIN vs INNER JOIN
        md: |
          Click **LEFT JOIN**, then **INNER JOIN**, and watch Ben and Dee. In the LEFT JOIN they stay, with
          `NULL` in the order columns. The left table is the one written **before** the word JOIN.
        config:
          left:
            name: customers
            columns: [id, name]
            rows: [[1, Ana], [2, Ben], [3, Chen], [4, Dee]]
          right:
            name: orders
            columns: [order_id, customer_id, total]
            rows: [[101, 1, 25], [102, 1, 8], [103, 3, 40], [104, 3, 15]]
          on: [id, customer_id]
          types: [left, inner]

      - type: read
        title: Left, right, and what NULL means here
        md: |
          ```sql
          SELECT ...
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id;
          ```

          - The **left table** is the one in `FROM` (here `customers`). *Every* one of its rows is kept.
          - The **right table** is the one after `LEFT JOIN` (here `orders`).
          - If a left row has matches, you get one result row per match, like an INNER JOIN.
          - If it has **no match**, you still get one row, and all the right-table columns are **NULL**.

          So in a LEFT JOIN, a NULL in a right-table column often means: *"there was nothing to match."*

      - type: example
        title: See the NULLs
        md: |
          Customers 139 to 143. Some have orders and some don't. Run it and look at the `order_id` column.
        sql: |
          SELECT c.customer_id, c.first_name, o.order_id, o.status
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE c.customer_id BETWEEN 139 AND 143
          ORDER BY c.customer_id, o.order_id;
        after: |
          Pierre (139) has five orders, so he appears five times. Ximena (140) has two. Liam, Ingrid and Emily
          (141 to 143) have **none**, so each gets a single row with NULL in `order_id` and `status`.
          An INNER JOIN would have dropped those three.

      - type: example
        title: Counting the extra rows
        md: |
          How many rows does the LEFT JOIN of all customers and all orders have? We count the total rows, the
          rows that found an order, and the rows that did not.
        sql: |
          SELECT COUNT(*) AS total_rows,
                 COUNT(o.order_id) AS rows_with_order,
                 COUNT(*) - COUNT(o.order_id) AS rows_without_order
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id;
        after: |
          **910 rows** = 900 matched pairs (what INNER JOIN gives) + 10 extra rows for the customers who never
          ordered. Remember from module 5: `COUNT(column)` skips NULLs, so `COUNT(o.order_id)` counts only real
          orders.

      - type: exercise
        id: m06-l04-e1
        title: See who has orders
        prompt: |
          Use a LEFT JOIN from `customers` (alias `c`) to `orders` (alias `o`) to show `customer_id`,
          `first_name` and `order_id` for customers **140 to 142** (`BETWEEN 140 AND 142`). Sort by
          `customer_id`, then `order_id`.
        starter: |
          SELECT c.customer_id, c.first_name, o.order_id
          FROM customers AS c
          LEFT JOIN orders AS o
              ON ___
          WHERE ___
          ORDER BY c.customer_id, o.order_id;
        solution: |
          SELECT c.customer_id, c.first_name, o.order_id
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE c.customer_id BETWEEN 140 AND 142
          ORDER BY c.customer_id, o.order_id;
        ordered: true
        hints:
          - It is the same shape as the example above. Only the range of customer ids changes.
          - "The ON rule is o.customer_id = c.customer_id and the filter is on c.customer_id."
          - "WHERE c.customer_id BETWEEN 140 AND 142"
        explanation: |
          Ximena (140) has orders 740 and 881; Liam (141) and Ingrid (142) have none, so they show one row each
          with a NULL `order_id`. Four rows in total.
        difficulty: 1

      - type: read
        title: The anti-join, finding what is missing
        md: |
          Now the marketing request. After a LEFT JOIN, customers without orders are exactly the rows
          where the right table's columns are NULL. So keep only those:

          ```sql
          WHERE o.order_id IS NULL
          ```

          This pattern is called an **anti-join**: "give me the left rows that have *no* partner on the right".
          Use the right table's **primary key** for the NULL test. It can never be NULL in a real match, so a
          NULL there can only mean "no match".

          > [!MISTAKE]
          > Writing `WHERE o.order_id = NULL`. As you learned in module 2, nothing is ever `= NULL`, so this
          > returns zero rows. Always use `IS NULL`.

      - type: example
        title: Customers who never ordered
        md: The "we miss you" list.
        sql: |
          SELECT c.customer_id, c.first_name, c.last_name, c.signup_date
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE o.order_id IS NULL
          ORDER BY c.customer_id;
        after: |
          Ten customers (141 to 150), all of whom signed up in October 2024. Marketing can now send their
          email. The trick: LEFT JOIN, then `WHERE <right primary key> IS NULL`.

      - type: exercise
        id: m06-l04-e2
        title: Products nobody bought
        prompt: |
          Which products have never appeared in any order? Show the product `name` and `price` of every
          product with no row in `order_items`. Sort by `name`.
        starter: |
          SELECT p.name, p.price
          FROM products AS p
          LEFT JOIN order_items AS oi
              ON ___
          WHERE ___
          ORDER BY p.name;
        solution: |
          SELECT p.name, p.price
          FROM products AS p
          LEFT JOIN order_items AS oi
              ON oi.product_id = p.product_id
          WHERE oi.order_item_id IS NULL
          ORDER BY p.name;
        ordered: true
        hints:
          - This is the same anti-join pattern, with products on the left.
          - "LEFT JOIN order_items, then keep rows where order_items' primary key is NULL."
          - "WHERE oi.order_item_id IS NULL"
        explanation: |
          Five products have never been ordered, including the pricey Zephyr Gaming Laptop X. Anti-joins are
          the classic way to find "things without any activity".
        difficulty: 2

      - type: quiz
        id: m06-l04-q1
        question: |
          You wrote `FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id`. Which `WHERE`
          keeps only the customers who have **no** orders?
        options:
          - WHERE o.order_id = NULL
          - WHERE o.order_id IS NULL
          - WHERE c.customer_id IS NULL
          - WHERE o.order_id IS NOT NULL
        answer: 1
        explanation: |
          `o.order_id IS NULL` finds the NULL-filled rows from customers with no match. `= NULL` never
          matches anything; `c.customer_id IS NULL` would only be true for customers without an id (none);
          `IS NOT NULL` keeps exactly the customers that **do** have orders.

      - type: exercise
        id: m06-l04-e3
        title: Customers who never ordered
        prompt: |
          Show `customer_id`, `first_name`, `last_name` and `city` of customers who have never placed an
          order. Sort by `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name, c.last_name, c.city
          FROM customers AS c
          LEFT JOIN orders AS o
              ON ___
          WHERE ___
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name, c.last_name, c.city
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE o.order_id IS NULL
          ORDER BY c.customer_id;
        ordered: true
        hints:
          - Keep all customers with a LEFT JOIN, then filter for the missing orders.
          - "The test is on the orders primary key: o.order_id IS NULL."
          - "WHERE o.order_id IS NULL"
        explanation: |
          The same 10 customers, now with their cities. Try changing it to `IS NOT NULL` and see how many
          rows come back (900, one per order).
        difficulty: 2

      - type: read
        title: A trap, COUNT(*) after a LEFT JOIN
        md: |
          Suppose you want the **number of orders per customer**, including zero. You might write
          `COUNT(*)`. But a customer with no orders still produces **one** row (the NULL-filled one), so
          `COUNT(*)` says 1 instead of 0.

          The fix is to count a column from the *right* table: `COUNT(o.order_id)` skips NULLs, so it gives
          0 for customers with no orders.

          > [!MISTAKE]
          > `COUNT(*)` after a LEFT JOIN counts the "empty" row too. Count a right-table column instead.

      - type: exercise
        id: m06-l04-e4
        title: Customers with fewer than 2 orders
        prompt: |
          Show `customer_id`, `first_name` and the number of orders as `order_count` for every customer who
          has **fewer than 2 orders** (zero or one). Sort by `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name,
                 COUNT(___) AS order_count
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          GROUP BY c.customer_id, c.first_name
          HAVING ___
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name,
                 COUNT(o.order_id) AS order_count
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          GROUP BY c.customer_id, c.first_name
          HAVING COUNT(o.order_id) < 2
          ORDER BY c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - LEFT JOIN, GROUP BY the customer, and filter the groups with HAVING.
          - "Count a column from the right table: COUNT(o.order_id). COUNT(*) would count the empty row."
          - "HAVING COUNT(o.order_id) < 2"
        explanation: |
          Twelve customers: two with a single order (106 and 127) and the ten who never ordered, correctly
          shown as 0. With `COUNT(*)` every one of them would have shown 1.
        difficulty: 3

      - type: read
        title: ON versus WHERE, the classic LEFT JOIN trap
        md: |
          With a LEFT JOIN, **where** you put a condition changes the answer:

          - A condition in **ON** is part of the *matching rule*. Left rows that fail it are still kept, with NULLs.
          - A condition in **WHERE** is applied *after* the join and removes whole rows, including the
            NULL-filled ones.

          Let's count cancelled orders both ways.

      - type: example
        title: Filter in ON, every customer stays
        sql: |
          SELECT COUNT(*) AS result_rows,
                 COUNT(DISTINCT c.customer_id) AS customers_shown
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.status = 'cancelled';
        after: |
          **202 rows, all 150 customers.** The rule says "match a customer to their *cancelled* orders". Customers
          with no cancelled orders still get one row with NULLs: 127 cancelled orders + 75 customers without any.

      - type: example
        title: Filter in WHERE, the LEFT JOIN is undone
        sql: |
          SELECT COUNT(*) AS result_rows,
                 COUNT(DISTINCT c.customer_id) AS customers_shown
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE o.status = 'cancelled';
        after: |
          **127 rows, only 75 customers.** After the join, `WHERE o.status = 'cancelled'` throws away every
          row where `status` is NULL, which is every unmatched customer. The LEFT JOIN has quietly turned into
          an INNER JOIN.

      - type: predict
        id: m06-l04-p1
        question: |
          650 of the 900 orders are `delivered`. How many rows does this query return?
        sql: |
          SELECT c.customer_id, o.order_id, o.status
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE o.status = 'delivered';
        options: ["150", "650", "660", "910"]
        answer: 1
        explanation: |
          The `WHERE` on a right-table column removes all NULL-filled rows, so the 10 customers without orders
          are gone, and only the 650 delivered orders remain. Despite the word LEFT, this behaves like an
          INNER JOIN.

      - type: read
        title: Rule of thumb
        md: |
          > [!TIP]
          > - Conditions about the **left** table (the rows you want to keep) go in `WHERE`.
          > - Conditions about the **right** table that decide *what counts as a match* go in `ON`.
          > - The only `WHERE` test on the right table that makes sense is `IS NULL` (the anti-join).

      - type: exercise
        id: m06-l04-e5
        title: Fix the vanishing customer
        prompt: |
          Every customer who lives in Denver should appear together with the number of their **delivered**
          orders (`delivered_orders`), showing 0 if they have none. The query below loses a customer. Fix it
          so all 12 Denver customers appear. Sort by `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name,
                 COUNT(o.order_id) AS delivered_orders
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE c.city = 'Denver'
            AND o.status = 'delivered'
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name,
                 COUNT(o.order_id) AS delivered_orders
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.status = 'delivered'
          WHERE c.city = 'Denver'
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - Which Denver customer is missing, and why does the WHERE remove them?
          - "The status condition is about the right table, so it belongs in ON, not WHERE."
          - "Move AND o.status = 'delivered' up into the ON rule. Keep c.city = 'Denver' in WHERE."
        explanation: |
          Felix (customer 146) has no orders at all, so the buggy `WHERE o.status = 'delivered'` erased him.
          In `ON`, the status filter only decides what counts as a match, and Felix correctly shows 0.
        difficulty: 3

      - type: exercise
        id: m06-l04-e6
        title: Cancelled orders per customer
        prompt: |
          For customers **1 to 12** (`customer_id <= 12`), show `customer_id`, `first_name` and the number of
          their cancelled orders as `cancelled_orders` (0 if none). All 12 customers must appear. Sort by
          `customer_id`.
        starter: |
          SELECT c.customer_id, c.first_name,
                 COUNT(___) AS cancelled_orders
          FROM customers AS c
          LEFT JOIN orders AS o
              ON ___
          WHERE c.customer_id <= 12
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id, c.first_name,
                 COUNT(o.order_id) AS cancelled_orders
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.status = 'cancelled'
          WHERE c.customer_id <= 12
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - Customers with zero cancelled orders must still appear, so this is a LEFT JOIN.
          - "Put the status test inside ON (joined with AND) and count COUNT(o.order_id)."
          - "ON o.customer_id = c.customer_id AND o.status = 'cancelled'"
        explanation: |
          Customers 3, 5, 11 and 12 show 0 instead of vanishing, and Seun (10) has four cancelled orders.
          The pattern "count with a condition, keep zeros" is LEFT JOIN + condition in ON + COUNT(right column).
        difficulty: 3

      - type: fill
        id: m06-l04-f1
        prompt: Complete the anti-join that lists orders that have **no payment** row.
        template: |
          SELECT o.order_id, o.status
          FROM orders AS o
          ___ JOIN payments AS p
              ON p.order_id = o.order_id
          WHERE p.payment_id IS ___;
        answers:
          - [LEFT]
          - ["NULL"]
        explanation: |
          Keep every order with LEFT JOIN, then keep the ones where the payment's primary key is NULL.
          That includes the 127 cancelled orders (they are never paid).

      - type: exercise
        id: m06-l04-e7
        title: Orders waiting for a payment
        prompt: |
          Finance wants to chase unpaid orders. Show `order_id`, `order_date` and `status` of every order that
          has **no row in `payments`** and whose status is **not** `'cancelled'` (cancelled orders are never
          paid). Sort by `order_id`.
        starter: |
          SELECT o.order_id, o.order_date, o.status
          FROM orders AS o
          LEFT JOIN payments AS p
              ON ___
          WHERE ___
          ORDER BY o.order_id;
        solution: |
          SELECT o.order_id, o.order_date, o.status
          FROM orders AS o
          LEFT JOIN payments AS p
              ON p.order_id = o.order_id
          WHERE p.payment_id IS NULL
            AND o.status <> 'cancelled'
          ORDER BY o.order_id;
        ordered: true
        hints:
          - This is an anti-join from orders to payments, plus one more filter.
          - "p.payment_id IS NULL finds orders without payments; add AND o.status <> 'cancelled'."
          - "WHERE p.payment_id IS NULL AND o.status <> 'cancelled'"
        explanation: |
          Fifteen orders are unpaid: 6 delivered ones (finance has some chasing to do!), 6 still processing and
          3 shipped. A real analyst would send this list straight to the finance team.
        difficulty: 3

    cheatsheet:
      - title: LEFT JOIN
        sql: |
          SELECT c.first_name, o.order_id
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id;
        note: Keeps every row of the left table. When there is no match, right-table columns are NULL.
      - title: Anti-join (rows with no match)
        sql: |
          SELECT c.customer_id, c.first_name
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          WHERE o.order_id IS NULL;
        note: Test the right table's primary key with IS NULL to find left rows that have no partner.
      - title: Count with zeros
        sql: |
          SELECT c.customer_id, COUNT(o.order_id) AS orders
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.status = 'cancelled'
          GROUP BY c.customer_id;
        note: Count a right-table column (not COUNT(*)), and put conditions on the right table in ON, not WHERE.

  - id: m06-l05
    title: RIGHT & FULL OUTER JOIN
    summary: Keep the unmatched rows of the right table, or of both tables, and compare two lists.
    minutes: 22
    dataset: company
    steps:
      - type: read
        title: A data audit at Acme Corp
        md: |
          For this lesson we switch to a different database: **Acme Corp**, a company with `departments` and
          `employees`. Each employee has a `dept_id` that points to a department, just like `orders` points
          to `customers`.

          HR asks you to audit the data:

          > "Are there employees who belong to **no** department? And are there departments with **no**
          > employees?"

          Those are two questions about *unmatched rows*, one on each side. LEFT JOIN handles one side.
          Today you will meet its two siblings: **RIGHT JOIN** and **FULL OUTER JOIN**.

      - type: example
        title: Employees without a department
        md: First, a quick look at the problem. The `dept_id` of some employees is NULL.
        sql: |
          SELECT emp_id, first_name, last_name, job_title, dept_id
          FROM employees
          WHERE dept_id IS NULL;
        after: |
          Two contractors, Kwame and Jia, have not been assigned to a department. An INNER JOIN between
          `employees` and `departments` would silently drop them.

      - type: read
        title: RIGHT JOIN, LEFT JOIN's mirror image
        md: |
          A **RIGHT JOIN** keeps every row of the **right** table (the one written after `JOIN`), plus any
          matching rows from the left. Where there is no match, the *left* columns become NULL.

          ```sql
          FROM employees AS e
          RIGHT JOIN departments AS d
              ON e.dept_id = d.dept_id
          ```

          Here every **department** is kept, even one without employees.

          Here is the useful fact: `A RIGHT JOIN B` gives the same rows as `B LEFT JOIN A`. Swap the tables
          and swap the word, nothing else changes.

      - type: viz
        viz: join
        title: RIGHT JOIN, step by step
        md: |
          Employee Di has no department, and the Legal department has no employees. Click **RIGHT JOIN**
          (all employees' side is the *right* table here, so Di stays), then **LEFT JOIN** to compare.
        config:
          left:
            name: departments
            columns: [dept_id, dept]
            rows: [[1, Sales], [2, Tech], [3, Legal]]
          right:
            name: employees
            columns: [emp_id, name, dept_id]
            rows: [[10, Ava, 1], [11, Bo, 2], [12, Cy, 2], [13, Di, null]]
          on: [dept_id, dept_id]
          types: [right, left]

      - type: example
        title: Head count per department with RIGHT JOIN
        md: |
          Every department must appear, even if nobody works there. So departments is the table we keep: the
          right one.
        sql: |
          SELECT d.name, COUNT(e.emp_id) AS headcount
          FROM employees AS e
          RIGHT JOIN departments AS d
              ON e.dept_id = d.dept_id
          GROUP BY d.dept_id, d.name
          ORDER BY d.dept_id;
        after: |
          Seven departments, including **Research with 0** employees. As with LEFT JOIN, we count a column
          from the table that may be missing (`e.emp_id`), not `COUNT(*)`.

      - type: example
        title: The same thing as a LEFT JOIN
        md: Swap the table order and replace RIGHT with LEFT.
        sql: |
          SELECT d.name, COUNT(e.emp_id) AS headcount
          FROM departments AS d
          LEFT JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY d.dept_id, d.name
          ORDER BY d.dept_id;
        after: |
          Identical result. In practice most SQL developers write **LEFT JOIN almost always**, because "the
          main table first, optional details after" reads naturally from top to bottom. RIGHT JOIN is simply
          available when it fits better.

      - type: predict
        id: m06-l05-p1
        question: |
          Acme has 55 employees and 7 departments. 53 employees belong to a department, 2 do not, and the
          Research department has no employees. How many rows does this return?
        sql: |
          SELECT *
          FROM departments AS d
          RIGHT JOIN employees AS e
              ON e.dept_id = d.dept_id;
        options: ["53", "54", "55", "56"]
        answer: 2
        explanation: |
          The **right** table here is `employees`, so all 55 employees stay: 53 matched ones plus the 2 with no
          department. Research has no partner on the right, so it is dropped. (The 56 would come from a FULL
          JOIN, which keeps Research too.)

      - type: exercise
        id: m06-l05-e1
        title: HR and Research
        prompt: |
          Use `employees AS e RIGHT JOIN departments AS d` to show the department `name`, the employee's
          `emp_id` and `last_name` for the departments with `dept_id` 6 (HR) and 7 (Research). Sort by the
          department's `dept_id`, then `emp_id`.
        starter: |
          SELECT d.name, e.emp_id, e.last_name
          FROM employees AS e
          RIGHT JOIN departments AS d
              ON ___
          WHERE d.dept_id IN (6, 7)
          ORDER BY d.dept_id, e.emp_id;
        solution: |
          SELECT d.name, e.emp_id, e.last_name
          FROM employees AS e
          RIGHT JOIN departments AS d
              ON e.dept_id = d.dept_id
          WHERE d.dept_id IN (6, 7)
          ORDER BY d.dept_id, e.emp_id;
        ordered: true
        hints:
          - The ON rule connects the two dept_id columns, just like in the example.
          - "ON e.dept_id = d.dept_id"
          - "Filter on d.dept_id (the table we keep), not e.dept_id."
        explanation: |
          HR has five employees and Research has none, so it shows up as a single row with NULLs. If you filtered on
          `e.dept_id` instead, that Research row would disappear: remember the ON versus WHERE lesson.
        difficulty: 1

      - type: read
        title: FULL OUTER JOIN, keep everything
        md: |
          A **FULL OUTER JOIN** (usually written `FULL JOIN`) keeps **all rows from both sides**:

          - rows that match are joined,
          - left rows without a partner get NULLs on the right,
          - right rows without a partner get NULLs on the left.

          It is the tool for **comparing two lists**: "what is in A but not in B, what is in B but not in A,
          and what is in both?" That is exactly the HR audit.

          > [!REAL-WORLD]
          > Accountants use FULL JOINs to **reconcile**: they compare the bank's statement against the
          > company's own ledger. Entries missing on either side show up as rows with NULLs.

      - type: viz
        viz: join
        title: All four joins side by side
        md: |
          Click through the buttons and compare. FULL JOIN is the only one that keeps both **Legal**
          (no employees) and **Di** (no department).
        config:
          left:
            name: departments
            columns: [dept_id, dept]
            rows: [[1, Sales], [2, Tech], [3, Legal]]
          right:
            name: employees
            columns: [emp_id, name, dept_id]
            rows: [[10, Ava, 1], [11, Bo, 2], [12, Cy, 2], [13, Di, null]]
          on: [dept_id, dept_id]
          types: [full, inner, left, right]

      - type: example
        title: The audit in one query
        md: |
          Keep everything with FULL JOIN, then filter down to the rows where **either** side is missing.
        sql: |
          SELECT d.name AS department,
                 e.emp_id, e.first_name, e.last_name
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          WHERE d.dept_id IS NULL
             OR e.emp_id IS NULL
          ORDER BY e.emp_id;
        after: |
          Three rows tell the whole story: Kwame and Jia have **no department** (NULL on the left), and the
          **Research** department has **no employees** (NULL on the right). One query found both kinds of problem.

      - type: example
        title: Labelling and counting every kind of row
        md: |
          Use `CASE` (module 4) to name each kind of row, then count them with `GROUP BY`.
        sql: |
          SELECT CASE
                     WHEN e.emp_id IS NULL THEN 'department without employees'
                     WHEN d.dept_id IS NULL THEN 'employee without department'
                     ELSE 'matched'
                 END AS row_type,
                 COUNT(*) AS row_count
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY row_type
          ORDER BY row_count DESC;
        after: |
          **53 matched**, 2 employees without a department and 1 department without employees. These add up
          to 56 rows, the size of the full join.

      - type: read
        title: Watch out
        md: |
          > [!MISTAKE]
          > Putting a filter on one side in `WHERE` can cancel the "outer" part. For example, `WHERE
          > e.salary > 100000` removes every row where `e.salary` is NULL, so unmatched departments vanish and
          > your FULL JOIN turns into something smaller. Use `IS NULL` tests, or move the condition into `ON`.

          > [!TIP]
          > Which one should I use? **LEFT JOIN** for 95% of cases. **RIGHT JOIN** only when it reads better
          > (it can always be rewritten as a LEFT JOIN). **FULL JOIN** when you need unmatched rows from both
          > sides, which is usually a data comparison or an audit.

      - type: quiz
        id: m06-l05-q1
        question: |
          You have a list of newsletter subscribers and a list of customers. You want every person who appears in
          **either** list, with NULLs where a person is missing from one of them. Which join?
        options: [INNER JOIN, LEFT JOIN, RIGHT JOIN, FULL OUTER JOIN]
        answer: 3
        explanation: |
          Only a FULL OUTER JOIN keeps unmatched rows from **both** sides. INNER keeps only people in both lists;
          LEFT and RIGHT each keep one list completely.

      - type: exercise
        id: m06-l05-e2
        title: Departments without projects
        prompt: |
          Which departments do not own a single project? Show the `name` and `location` of every department
          that has no row in `projects` (`projects.dept_id` is the owner). You may use LEFT or RIGHT JOIN.
        starter: |
          SELECT d.name, d.location
          FROM projects AS p
          RIGHT JOIN departments AS d
              ON ___
          WHERE ___;
        solution: |
          SELECT d.name, d.location
          FROM projects AS p
          RIGHT JOIN departments AS d
              ON p.dept_id = d.dept_id
          WHERE p.project_id IS NULL;
        hints:
          - This is an anti-join, like "customers who never ordered", but with departments as the kept table.
          - "Join projects to departments on dept_id and look for a NULL project primary key."
          - "WHERE p.project_id IS NULL"
        explanation: |
          Only the Executive department owns no projects. A LEFT JOIN written as
          `departments d LEFT JOIN projects p ...` gives the very same answer.
        difficulty: 2
        allowEmpty: false

      - type: exercise
        id: m06-l05-e3
        title: The full audit list
        prompt: |
          Reproduce the audit with a FULL JOIN between `departments` (alias `d`) and `employees` (alias `e`).
          Show the department `name`, the employee's `first_name` and `last_name` for only the rows where
          the department is missing **or** the employee is missing. Sort by `e.emp_id`.
        starter: |
          SELECT d.name, e.first_name, e.last_name
          FROM departments AS d
          FULL JOIN employees AS e
              ON ___
          WHERE ___
          ORDER BY e.emp_id;
        solution: |
          SELECT d.name, e.first_name, e.last_name
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          WHERE d.dept_id IS NULL
             OR e.emp_id IS NULL
          ORDER BY e.emp_id;
        ordered: true
        hints:
          - You need two IS NULL tests combined with OR, one for each side.
          - "d.dept_id IS NULL means the employee has no department; e.emp_id IS NULL means the department is empty."
          - "WHERE d.dept_id IS NULL OR e.emp_id IS NULL"
        explanation: |
          NULLs sort last in ascending order, so the Research row (no employee) comes after Kwame (53) and
          Jia (54). If you wrote `AND` instead of `OR`, you would get no rows, because no row is missing
          both sides at once.
        difficulty: 2

      - type: parsons
        id: m06-l05-o1
        prompt: |
          Put the lines in order to list rows that exist on only one side of the department/employee match.
        lines:
          - SELECT d.name, e.first_name
          - FROM departments AS d
          - FULL JOIN employees AS e
          - "    ON e.dept_id = d.dept_id"
          - WHERE d.dept_id IS NULL
          - "   OR e.emp_id IS NULL;"
        distractors:
          - "   AND e.emp_id IS NULL;"
        explanation: |
          The `OR` line finishes the `WHERE` condition. The `AND` distractor would ask for rows missing on both
          sides at once, which never happens.

      - type: exercise
        id: m06-l05-e4
        title: Counting the row types
        prompt: |
          Reproduce the labelled count. Using a FULL JOIN of `departments` (`d`) and `employees` (`e`), show
          `row_type` and `row_count`, where `row_type` is one of exactly these three texts:
          `'matched'`, `'employee without department'`, `'department without employees'`.
          Sort by `row_count`, largest first.
        starter: |
          SELECT CASE
                     WHEN ___ THEN 'department without employees'
                     WHEN ___ THEN 'employee without department'
                     ELSE 'matched'
                 END AS row_type,
                 COUNT(*) AS row_count
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY row_type
          ORDER BY row_count DESC;
        solution: |
          SELECT CASE
                     WHEN e.emp_id IS NULL THEN 'department without employees'
                     WHEN d.dept_id IS NULL THEN 'employee without department'
                     ELSE 'matched'
                 END AS row_type,
                 COUNT(*) AS row_count
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY row_type
          ORDER BY row_count DESC;
        columnNames: true
        ordered: true
        hints:
          - Use CASE WHEN to give each kind of row a label, then GROUP BY that label.
          - "A department with no employees has e.emp_id IS NULL; an employee with no department has d.dept_id IS NULL."
          - "WHEN e.emp_id IS NULL THEN ... WHEN d.dept_id IS NULL THEN ..."
        explanation: |
          You combined FULL JOIN, CASE and GROUP BY in a single query. A report like this is a very common
          first step in checking the quality of any dataset.
        difficulty: 3

      - type: fill
        id: m06-l05-f1
        prompt: Complete the query so every department is kept, even when it has no employees.
        template: |
          SELECT d.name, e.first_name
          FROM employees AS e
          ___ JOIN departments AS d
              ON e.dept_id = d.dept_id;
        answers:
          - [RIGHT]
        explanation: |
          Departments is the table written after `JOIN`, so to keep all of its rows you need a RIGHT JOIN.
          (`FULL` would also keep every department, plus the employees without one.)

      - type: exercise
        id: m06-l05-e5
        title: Department report with a catch-all row
        prompt: |
          Build a head-count report that lists **every department and also the employees without one**. Show
          `department` (the department `name`, or the text `'(no department)'` when there is none),
          `headcount` (number of employees) and `avg_salary` (average `salary`, rounded to 0 decimals; it is
          NULL for a department with no employees). Group by `d.dept_id, d.name`. Sort by `headcount`
          (largest first), then `department`.
        starter: |
          SELECT COALESCE(d.name, '(no department)') AS department,
                 COUNT(___) AS headcount,
                 ROUND(AVG(e.salary), 0) AS avg_salary
          FROM departments AS d
          ___ JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY d.dept_id, d.name
          ORDER BY headcount DESC, department;
        solution: |
          SELECT COALESCE(d.name, '(no department)') AS department,
                 COUNT(e.emp_id) AS headcount,
                 ROUND(AVG(e.salary), 0) AS avg_salary
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          GROUP BY d.dept_id, d.name
          ORDER BY headcount DESC, department;
        columnNames: true
        ordered: true
        hints:
          - You need both unmatched sides, so which join type keeps both?
          - "COALESCE(d.name, '(no department)') replaces the NULL name. Count e.emp_id so empty departments get 0."
          - "FULL JOIN employees, then GROUP BY d.dept_id, d.name"
        explanation: |
          Eight rows: seven departments plus the catch-all group of the 2 employees without one. Research shows
          0 people and a NULL average, because there are no salaries to average. This is the kind of report
          where an INNER JOIN would silently hide both problems.
        difficulty: 3

    cheatsheet:
      - title: RIGHT JOIN
        sql: |
          SELECT d.name, e.first_name
          FROM employees AS e
          RIGHT JOIN departments AS d
              ON e.dept_id = d.dept_id;
        note: Keeps every row of the right table. Same as swapping the tables and using LEFT JOIN.
      - title: FULL OUTER JOIN
        sql: |
          SELECT d.name, e.first_name
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id;
        note: Keeps all rows from both tables. Unmatched rows get NULLs on the other side.
      - title: Find mismatches between two tables
        sql: |
          SELECT d.name, e.first_name
          FROM departments AS d
          FULL JOIN employees AS e
              ON e.dept_id = d.dept_id
          WHERE d.dept_id IS NULL OR e.emp_id IS NULL;
        note: After a FULL JOIN, a NULL key on one side shows a row that has no partner on the other side.

  - id: m06-l06
    title: Joining 3+ tables
    summary: Plan a route through several tables and chain JOINs from customers all the way to categories.
    minutes: 25
    steps:
      - type: read
        title: A report that needs five tables
        md: |
          The marketing team is reviewing last month's campaign. They ask you:

          > "For every item bought, show **who** bought it, **what** it was, and which **category** it
          > belongs to."

          Look at where those facts live. The person's name is in `customers`. The product name is in
          `products`. The category name is in `categories`. And the link between a customer and a product
          is hidden in two more tables: `orders` and `order_items`.

          That is **five tables**, but don't panic. You already know how to join two. A longer join is just
          the same move repeated: every `JOIN` adds **one more table** to the query.

          > [!ANALOGY]
          > Think of a subway trip with changes. You can't go straight from your home station to the
          > museum, but you can ride Line A to the centre, change to Line B, and change again. Each `JOIN`
          > is one more line you ride. The skill is **planning the route** before you start typing.

      - type: read
        title: Plan the route first
        md: |
          Every hop in the route is a foreign key that points at a primary key. Here is the map from
          customers to categories:

          ```
          customers.customer_id  <-  orders.customer_id
          orders.order_id        <-  order_items.order_id
          order_items.product_id ->  products.product_id
          products.category_id   ->  categories.category_id
          ```

          Plan every long join in three steps:

          1. **Write down the columns you need** and the table each one lives in.
          2. **Find a chain of foreign keys** that connects those tables.
          3. **Add one `JOIN ... ON ...` per hop.**

          A handy rule: **N tables need N - 1 `ON` rules**. Five tables means four joins. Tables in the
          middle (here `orders` and `order_items`) may not give you a single column, but they are the
          stepping stones you must stand on.

      - type: example
        title: Three tables, two joins
        md: |
          Let's start small: what did order 17 contain, and in which category is each product? The route
          is `order_items` -> `products` -> `categories`.
        sql: |
          SELECT oi.order_id,
                 p.name AS product,
                 c.name AS category,
                 oi.quantity
          FROM order_items AS oi
          JOIN products AS p
              ON oi.product_id = p.product_id
          JOIN categories AS c
              ON p.category_id = c.category_id
          WHERE oi.order_id = 17
          ORDER BY oi.order_item_id;
        after: |
          Four lines: a pillow (Furniture), a desk mat (Peripherals), the journal (Books) and a kettle
          (Kitchen). Look at the second `ON`: it links `categories` to `p`, the table we **just added**,
          not to `oi`. Each new table hooks onto one that is already on the map.

      - type: exercise
        id: m06-l06-e1
        title: Order 100 by category
        prompt: |
          Show the lines of order 100 with the product `name` as `product`, the category `name` as
          `category`, and the `quantity`. Sort by product name.
        starter: |
          SELECT p.name AS product,
                 c.name AS category,
                 oi.quantity
          FROM order_items AS oi
          JOIN products AS p
              ON ___
          JOIN categories AS c
              ON ___
          WHERE oi.order_id = 100
          ORDER BY product;
        solution: |
          SELECT p.name AS product,
                 c.name AS category,
                 oi.quantity
          FROM order_items AS oi
          JOIN products AS p
              ON oi.product_id = p.product_id
          JOIN categories AS c
              ON p.category_id = c.category_id
          WHERE oi.order_id = 100
          ORDER BY product;
        columnNames: true
        ordered: true
        hints:
          - It is the same route as the example, only the order number changes.
          - "The first ON links order_items to products; the second links products to categories."
          - "ON oi.product_id = p.product_id ... ON p.category_id = c.category_id"
        explanation: |
          A blender and water bottle (2 each), a sleeping bag and a sourdough cookbook (1 each). Because the
          sort is on the `product` alias, you can write `ORDER BY product`.
        difficulty: 1

      - type: stepper
        title: Grow the query one JOIN at a time
        md: |
          Here is the full five-table query for order 17, built in five stages. Press Run on each one
          and watch how the **number of rows** changes.
        stages:
          - label: orders
            md: Start with the order itself. One row.
            sql: |
              SELECT o.order_id, o.customer_id
              FROM orders AS o
              WHERE o.order_id = 17;
          - label: + customers
            md: |
              Join `customers` to bring in the name. Still **one row**: an order has exactly one customer.
            sql: |
              SELECT o.order_id, c.first_name, c.last_name
              FROM orders AS o
              JOIN customers AS c
                  ON o.customer_id = c.customer_id
              WHERE o.order_id = 17;
          - label: + order_items
            md: |
              Join `order_items`. The order has four lines, so the single row becomes **four rows**. This is
              the "one-to-many" step.
            sql: |
              SELECT o.order_id, c.first_name, oi.product_id,
                     oi.quantity
              FROM orders AS o
              JOIN customers AS c
                  ON o.customer_id = c.customer_id
              JOIN order_items AS oi
                  ON oi.order_id = o.order_id
              WHERE o.order_id = 17;
          - label: + products
            md: |
              Swap the product number for the product name. Still four rows: each line has exactly one
              product.
            sql: |
              SELECT o.order_id, c.first_name, p.name AS product,
                     oi.quantity
              FROM orders AS o
              JOIN customers AS c
                  ON o.customer_id = c.customer_id
              JOIN order_items AS oi
                  ON oi.order_id = o.order_id
              JOIN products AS p
                  ON p.product_id = oi.product_id
              WHERE o.order_id = 17;
          - label: + categories
            md: |
              The last hop: add the category name. Four joins for five tables, and still four rows.
            sql: |
              SELECT o.order_id, c.first_name, p.name AS product,
                     cat.name AS category
              FROM orders AS o
              JOIN customers AS c
                  ON o.customer_id = c.customer_id
              JOIN order_items AS oi
                  ON oi.order_id = o.order_id
              JOIN products AS p
                  ON p.product_id = oi.product_id
              JOIN categories AS cat
                  ON cat.category_id = p.category_id
              WHERE o.order_id = 17;

      - type: example
        title: A customer's recent purchases
        md: |
          The same five tables answer a different question: what has **Noor Haddad** (customer 6) bought
          since 1 December 2024? Filters can use columns from any table in the chain.
        sql: |
          SELECT o.order_id,
                 c.first_name,
                 p.name AS product,
                 cat.name AS category
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS cat
              ON cat.category_id = p.category_id
          WHERE c.customer_id = 6
            AND o.order_date >= '2024-12-01'
          ORDER BY o.order_id, p.name;
        after: |
          Order 853 had three products: a blender (Kitchen), an ultrabook (Laptops) and a cookbook
          (Books). This time we started `FROM customers` and walked the route in the other direction. The
          result is the same, because a join is just a matching rule: it doesn't care which end you start from.

      - type: quiz
        id: m06-l06-q1
        question: |
          You want each customer's name next to the **names of the products they bought**. Which route of
          tables connects `customers` to `products`?
        options:
          - customers -> products (they share a key)
          - customers -> orders -> order_items -> products
          - customers -> payments -> products
          - customers -> categories -> products
        answer: 1
        explanation: |
          A customer places orders, orders contain order lines, and order lines point at products. There is
          no direct foreign key between `customers` and `products`, so you have to ride through `orders`
          and `order_items`.

      - type: read
        title: One rule for the ON lines
        md: |
          An `ON` rule may only mention tables that have **already appeared above it** in the query. The
          database reads the joins from top to bottom and can't look ahead.

          > [!MISTAKE]
          > Writing an `ON` that mentions a table you haven't joined yet. If `categories` (alias `c`) comes
          > after `products` in the list, the rule `p.category_id = c.category_id` is fine. But if you write
          > it **before** `categories` has been joined, PostgreSQL has never heard of `c`.

      - type: example
        title: Mentioning a table too early
        md: |
          Here the `products` join uses `c.category_id`, but `categories AS c` is only joined on the next line.
        sql: |
          SELECT o.order_id, c.name
          FROM orders AS o
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          JOIN products AS p
              ON p.category_id = c.category_id
          JOIN categories AS c
              ON c.category_id = p.category_id;
        expectError: true
        after: |
          *missing FROM-clause entry for table "c"*. Read the error as: "you used a table called `c`, but
          it isn't in the query **yet**". Fix it by joining each table first, and only then using it. Here
          that means `products` must link to `oi`, and `categories` to `p`.

      - type: exercise
        id: m06-l06-e2
        title: Fix the order of the joins
        prompt: |
          This query should list the product and category of every line in orders 1 to 3, but it fails
          because `categories` is joined before `products`. Fix it. Keep the same columns, and sort by
          `order_item_id`.
        starter: |
          SELECT oi.order_id, p.name AS product, c.name AS category
          FROM order_items AS oi
          JOIN categories AS c
              ON p.category_id = c.category_id
          JOIN products AS p
              ON oi.product_id = p.product_id
          WHERE oi.order_id <= 3
          ORDER BY oi.order_item_id;
        solution: |
          SELECT oi.order_id, p.name AS product, c.name AS category
          FROM order_items AS oi
          JOIN products AS p
              ON oi.product_id = p.product_id
          JOIN categories AS c
              ON p.category_id = c.category_id
          WHERE oi.order_id <= 3
          ORDER BY oi.order_item_id;
        ordered: true
        hints:
          - Read the error message. Which table is used before it is joined?
          - The categories join needs p, so products must come first.
          - Swap the two JOIN ... ON blocks, keeping each ON line with its own JOIN.
        explanation: |
          Eight lines come back (orders 1, 2 and 3 have 2, 4 and 2 lines). The join order matters only for
          this reason: every `ON` must refer to tables that are already in the query.
        difficulty: 2

      - type: predict
        id: m06-l06-p1
        question: |
          `order_items` has 2,296 rows. After joining it to four lookup tables, how many rows does this
          query return?
        sql: |
          SELECT oi.order_item_id
          FROM order_items AS oi
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS c
              ON c.category_id = p.category_id
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN customers AS cu
              ON cu.customer_id = o.customer_id;
        options: ["60", "900", "2,296", "More than 2,296"]
        answer: 2
        explanation: |
          Every order line has exactly **one** product, one category, one order and one customer. Hopping
          from the "many" side to the "one" side never adds rows, so the count stays at 2,296.

      - type: read
        title: Which way does the row count move?
        md: |
          This is worth remembering, because it explains almost every surprise in long joins:

          | You hop... | Example | Rows |
          |---|---|---|
          | toward the **one** side | order line -> its product | stay the same |
          | toward the **many** side | customer -> their orders | can multiply |

          Customer 6 is one row in `customers` but 23 rows in `orders`. If you walk from `customers` to
          `orders` to `order_items`, each customer row is repeated once per order line. That is perfectly
          fine for listing things. Later in this module you'll see what it does to **totals**.

      - type: exercise
        id: m06-l06-e3
        title: Camping gear, delivered
        prompt: |
          Show `order_id`, `first_name`, `last_name`, the product `name` as `product` and the `quantity` for
          every order line whose product is in the category named `'Camping'`, in **delivered** orders
          placed on or after `'2024-11-15'`. Sort by `order_id`, then `product`.
        starter: |
          SELECT o.order_id, c.first_name, c.last_name,
                 p.name AS product, oi.quantity
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON ___
          JOIN products AS p
              ON ___
          JOIN categories AS cat
              ON ___
          WHERE ___
          ORDER BY o.order_id, product;
        solution: |
          SELECT o.order_id, c.first_name, c.last_name,
                 p.name AS product, oi.quantity
          FROM orders AS o
          JOIN customers AS c
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS cat
              ON cat.category_id = p.category_id
          WHERE cat.name = 'Camping'
            AND o.status = 'delivered'
            AND o.order_date >= '2024-11-15'
          ORDER BY o.order_id, product;
        columnNames: true
        ordered: true
        hints:
          - You need all five tables again, because you show customer columns and filter on a category.
          - "Each ON links the new table to one already listed. The WHERE has three conditions with AND."
          - "WHERE cat.name = 'Camping' AND o.status = 'delivered' AND o.order_date >= '2024-11-15'"
        explanation: |
          Fourteen lines. Notice that the filter on the **category name** sits at the far end of the chain,
          yet it works exactly like a filter on any other column. Camp stoves and headlamps show up most often.
          before Christmas.
        difficulty: 2

      - type: fill
        id: m06-l06-f1
        prompt: |
          Complete the chain so each payment shows the first name of the customer who paid.
        template: |
          SELECT cu.first_name, py.amount
          FROM payments AS py
          JOIN orders AS o
              ON ___ = o.order_id
          JOIN customers AS cu
              ON o.customer_id = ___;
        answers:
          - [py.order_id]
          - [cu.customer_id]
        explanation: |
          `payments` points to `orders` (via `order_id`), and `orders` points to `customers` (via
          `customer_id`). There is no `customer_id` in `payments`, so `orders` is the stepping stone.

      - type: parsons
        id: m06-l06-o1
        prompt: |
          Put the lines in order to list the distinct products bought by customer 6, alphabetically.
        lines:
          - SELECT DISTINCT p.name
          - FROM customers AS c
          - JOIN orders AS o
          - "    ON o.customer_id = c.customer_id"
          - JOIN order_items AS oi
          - "    ON oi.order_id = o.order_id"
          - JOIN products AS p
          - "    ON p.product_id = oi.product_id"
          - WHERE c.customer_id = 6
          - ORDER BY p.name;
        distractors:
          - "    ON p.product_id = o.product_id"
        explanation: |
          Follow the chain: customers, orders, order_items, products. The distractor fails because `orders`
          has no `product_id` column: products are reached through `order_items`.

      - type: read
        title: Mixing in LEFT JOIN
        md: |
          You can use any join type in a chain. Let's go back to the 10 customers who have never ordered
          (customers 141 to 150) and see how a chain treats them:

          - `customers LEFT JOIN orders LEFT JOIN order_items` keeps every customer: **2,306 rows**
            (2,296 lines plus one empty row for each of the 10 customers with no orders).
          - `customers LEFT JOIN orders JOIN order_items` gives only **2,296 rows**.

          Why? The plain `JOIN` at the end needs an order line for every row, and the "empty" rows from
          the `LEFT JOIN` have none. So they are thrown away again.

          > [!TIP]
          > Once you start a chain with `LEFT JOIN` to keep unmatched rows, keep using `LEFT JOIN` for the
          > tables that follow. A plain `JOIN` later in the chain can quietly undo it.

      - type: example
        title: A LEFT JOIN chain
        md: |
          Count the order lines per customer for a few customers, including some who never ordered.
        sql: |
          SELECT c.customer_id,
                 c.first_name,
                 COUNT(oi.order_item_id) AS lines
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
          LEFT JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id BETWEEN 139 AND 143
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        after: |
          Customers 139 and 140 have 14 and 6 order lines. Customers 141, 142 and 143 never ordered, yet they
          still appear, with a count of **0**. We counted `oi.order_item_id`, a column that is NULL for them.

      - type: exercise
        id: m06-l06-e4
        title: Categories nothing was sold in
        prompt: |
          Which categories have **no order lines at all** (no product in them has ever been ordered)? Show
          `category_id` and `name`, sorted by `category_id`. Hint: start from `categories`, `LEFT JOIN` the
          products and then the order lines, group, and keep groups where the count of lines is 0.
        starter: |
          SELECT c.category_id, c.name
          FROM categories AS c
          LEFT JOIN products AS p
              ON p.category_id = c.category_id
          LEFT JOIN order_items AS oi
              ON ___
          GROUP BY c.category_id, c.name
          HAVING ___
          ORDER BY c.category_id;
        solution: |
          SELECT c.category_id, c.name
          FROM categories AS c
          LEFT JOIN products AS p
              ON p.category_id = c.category_id
          LEFT JOIN order_items AS oi
              ON oi.product_id = p.product_id
          GROUP BY c.category_id, c.name
          HAVING COUNT(oi.order_item_id) = 0
          ORDER BY c.category_id;
        ordered: true
        hints:
          - Both joins must be LEFT JOINs so that empty categories survive the whole chain.
          - "COUNT(oi.order_item_id) counts only real lines, so a category with none gets 0."
          - "HAVING COUNT(oi.order_item_id) = 0"
        explanation: |
          Electronics, Home and Sports are top-level departments whose products all live in
          sub-categories, so nothing is attached to them directly. A plain `WHERE oi.order_item_id IS NULL`
          would also have listed Books, Toys and others, because those have *some* product nobody ordered.
          Counting per category answers the question we really asked.
        difficulty: 3

      - type: exercise
        id: m06-l06-e5
        title: A product with its category and supplier
        prompt: |
          Show every product in the categories named `'Books'` or `'Toys'`: the product `name` as `product`,
          the category `name` as `category`, and the supplier's `name` as `supplier`. If a product has no
          supplier, show the text `'Direct'` instead. Sort by product name. (Some of these products have no
          supplier, so choose your join types carefully.)
        starter: |
          SELECT p.name AS product,
                 c.name AS category,
                 COALESCE(s.name, 'Direct') AS supplier
          FROM products AS p
          JOIN categories AS c
              ON ___
          ___ JOIN suppliers AS s
              ON ___
          WHERE ___
          ORDER BY product;
        solution: |
          SELECT p.name AS product,
                 c.name AS category,
                 COALESCE(s.name, 'Direct') AS supplier
          FROM products AS p
          JOIN categories AS c
              ON p.category_id = c.category_id
          LEFT JOIN suppliers AS s
              ON p.supplier_id = s.supplier_id
          WHERE c.name IN ('Books', 'Toys')
          ORDER BY product;
        columnNames: true
        ordered: true
        hints:
          - "Here `products` is the hub: it points to both `categories` and `suppliers`. The two joins branch out from it."
          - A product without a supplier would vanish from an INNER JOIN. Which join type keeps it?
          - "LEFT JOIN suppliers AS s ON p.supplier_id = s.supplier_id, then COALESCE for the label."
        explanation: |
          Thirteen products. Two books ("Learn SQL in 30 Days" and "Mindful Mornings Journal") are sourced
          directly. With an INNER JOIN to `suppliers` they would have disappeared, and nobody would have
          noticed. Not every route is a straight line: a route can also **branch** from a table in the middle.
        difficulty: 3

    cheatsheet:
      - title: Chain several JOINs
        sql: |
          SELECT c.first_name, p.name AS product
          FROM customers AS c
          JOIN orders AS o ON o.customer_id = c.customer_id
          JOIN order_items AS oi ON oi.order_id = o.order_id
          JOIN products AS p ON p.product_id = oi.product_id;
        note: Each JOIN adds one table. N tables need N - 1 ON rules, and each ON links the new table to one already listed.
      - title: Plan the route
        sql: |
          -- customers -> orders -> order_items -> products -> categories
          -- customers.customer_id  <- orders.customer_id
          -- orders.order_id        <- order_items.order_id
          -- order_items.product_id -> products.product_id
          -- products.category_id   -> categories.category_id
        note: Follow the foreign keys. Stepping-stone tables are needed even if you show none of their columns.
      - title: Keep unmatched rows through a chain
        sql: |
          SELECT c.customer_id, COUNT(oi.order_item_id) AS lines
          FROM customers AS c
          LEFT JOIN orders AS o ON o.customer_id = c.customer_id
          LEFT JOIN order_items AS oi ON oi.order_id = o.order_id
          GROUP BY c.customer_id;
        note: Keep using LEFT JOIN down the chain. A plain JOIN later on throws the empty rows away again.

  - id: m06-l07
    title: Self joins
    summary: Join a table to itself to match employees with their managers and to compare rows with each other.
    minutes: 25
    dataset: company
    steps:
      - type: read
        title: Who reports to whom?
        md: |
          We are back at **Acme Corp** (the company database from the last lesson). HR sends a request:

          > "Give me a list showing every employee next to **their manager's name**."

          Open the `employees` table and you'll find a puzzle. There is a `manager_id` column, but it only
          holds a number. Whose number? It's the `emp_id` of another employee, and that employee lives in
          the **very same table**.

          > [!ANALOGY]
          > Think of a family tree written as one list of people. Each line has a name and the *number of
          > that person's mother*. To find the mother's name, you look her up in the same list. A table that
          > points to itself is called a **self-referencing** table.

      - type: example
        title: Numbers, not names
        md: Here is what the data looks like. `manager_id` is a foreign key that points back to `emp_id`.
        sql: |
          SELECT emp_id, first_name, last_name, job_title, manager_id
          FROM employees
          ORDER BY emp_id
          LIMIT 8;
        after: |
          Employee 1 (the CEO) has no manager, so `manager_id` is NULL. Employees 2 to 7 all have
          `manager_id` 1: they report to Diego Adeyemi. Employee 8 reports to employee 3.

      - type: read
        title: The trick, use the table twice
        md: |
          To turn those numbers into names, imagine making **two photocopies** of `employees`. Call the
          first copy `e` (the employee) and the second copy `m` (the manager). Now it's an ordinary join
          between two tables:

          ```sql
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          ```

          Read the rule as: *"the employee's manager number equals the manager's employee number."*

          That's a **self join**. It isn't a new kind of join: it's the INNER or LEFT JOIN you already know,
          used with the same table on both sides. The only difference is that **aliases are required**,
          because otherwise the database couldn't tell the two copies apart.

      - type: viz
        viz: join
        title: A tiny org chart
        md: |
          The left copy (`e`) is the employee, the right copy (`m`) is the manager. Diego is the CEO and has
          no manager. Click **LEFT JOIN** to keep him.
        config:
          left:
            name: employees AS e
            columns: [emp_id, name, manager_id]
            rows: [[1, Diego, null], [2, Ming, 1], [3, Thiago, 1], [8, Olivia, 3]]
          right:
            name: employees AS m
            columns: [emp_id, name]
            rows: [[1, Diego], [2, Ming], [3, Thiago], [8, Olivia]]
          on: [manager_id, emp_id]
          types: [inner, left]

      - type: example
        title: Employees with their managers
        md: |
          Press Run. The same table appears twice, once as `e` and once as `m`.
        sql: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.job_title,
                 m.first_name || ' ' || m.last_name AS manager
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          ORDER BY e.emp_id
          LIMIT 8;
        after: |
          Now every employee has a manager's **name** next to them. We build full names by joining first and
          last name with `||`, as in module 1. This INNER JOIN returns 54 rows, not 55: the CEO has no
          manager, so there is no partner for him and he drops out.

      - type: example
        title: Forgetting the aliases
        md: |
          What if we name the table twice without giving each copy its own nickname?
        sql: |
          SELECT employees.emp_id
          FROM employees
          JOIN employees
              ON employees.manager_id = employees.emp_id;
        expectError: true
        after: |
          *table name "employees" specified more than once*. The database can't tell which copy you mean in
          `employees.emp_id`. Give each copy its own alias (`e` and `m`) and the problem disappears.

      - type: exercise
        id: m06-l07-e1
        title: The Engineering VP's direct reports
        prompt: |
          Show the full name of everyone who reports directly to the employee whose `job_title` is
          `'VP of Engineering'`. Use these columns: `employee` (first name, a space, then last name),
          `job_title` (of the employee) and `manager` (the VP's full name, built the same way). Sort by
          `emp_id` of the employee.
        starter: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.job_title,
                 ___ AS manager
          FROM employees AS e
          JOIN employees AS m
              ON ___
          WHERE ___
          ORDER BY e.emp_id;
        solution: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.job_title,
                 m.first_name || ' ' || m.last_name AS manager
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          WHERE m.job_title = 'VP of Engineering'
          ORDER BY e.emp_id;
        columnNames: true
        ordered: true
        hints:
          - It is the previous example plus a WHERE. Which alias holds the manager's job title?
          - "The filter is on the manager's copy of the table: WHERE m.job_title = ..."
          - "WHERE m.job_title = 'VP of Engineering'"
        explanation: |
          Two directors and an engineering manager report to Thiago Rodriguez. Because the filter used `m.job_title` (the manager's
          copy), we could name the manager by job title and still show his name in the result.
        difficulty: 1

      - type: read
        title: Keeping the boss with a LEFT JOIN
        md: |
          An INNER self join drops everyone without a partner, so the CEO disappears. As in lesson 4, a
          **LEFT JOIN** keeps every row of the left copy (`e`) and fills the manager's columns with NULL
          when there is none. `COALESCE` can then print a friendly label instead of NULL.

          > [!MISTAKE]
          > Writing the rule the wrong way round: `ON e.emp_id = m.manager_id`. The query still runs, but now
          > `m` is the employee and `e` is the boss, so your "manager" column shows each person's
          > **subordinates**. The foreign key (`manager_id`) belongs to the **employee** alias, and it
          > points at the primary key (`emp_id`) of the **manager** alias.

      - type: exercise
        id: m06-l07-e2
        title: Include the CEO
        prompt: |
          Show `emp_id`, the employee's full name as `employee` and the manager's full name as `manager` for
          employees 1, 2 and 3 (`emp_id <= 3`). The CEO has no manager: show the text `'(none)'` for him.
          Sort by `emp_id`.
        starter: |
          SELECT e.emp_id,
                 e.first_name || ' ' || e.last_name AS employee,
                 COALESCE(m.first_name || ' ' || m.last_name, '(none)') AS manager
          FROM employees AS e
          ___ JOIN employees AS m
              ON ___
          WHERE e.emp_id <= 3
          ORDER BY e.emp_id;
        solution: |
          SELECT e.emp_id,
                 e.first_name || ' ' || e.last_name AS employee,
                 COALESCE(m.first_name || ' ' || m.last_name, '(none)') AS manager
          FROM employees AS e
          LEFT JOIN employees AS m
              ON e.manager_id = m.emp_id
          WHERE e.emp_id <= 3
          ORDER BY e.emp_id;
        columnNames: true
        ordered: true
        hints:
          - The CEO has no partner, so which join type keeps unmatched rows of the left copy?
          - "LEFT JOIN employees AS m ON e.manager_id = m.emp_id"
          - "The COALESCE is already written for you, so only the join type and the ON rule are missing."
        explanation: |
          Diego Adeyemi (the CEO) appears with `(none)`. Concatenating with `||` gives NULL when one part is
          NULL, so `COALESCE` caught the whole expression and replaced it.
        difficulty: 2

      - type: exercise
        id: m06-l07-e3
        title: Fix the reversed rule
        prompt: |
          This query should show employees 8, 9 and 10 with the first name of their **manager**, but the
          `ON` rule is written the wrong way round. Fix it. Keep the same columns, and sort by `e.emp_id`.
        starter: |
          SELECT e.emp_id,
                 e.first_name AS employee,
                 m.first_name AS manager
          FROM employees AS e
          JOIN employees AS m
              ON e.emp_id = m.manager_id
          WHERE e.emp_id IN (8, 9, 10)
          ORDER BY e.emp_id, m.emp_id;
        solution: |
          SELECT e.emp_id,
                 e.first_name AS employee,
                 m.first_name AS manager
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          WHERE e.emp_id IN (8, 9, 10)
          ORDER BY e.emp_id, m.emp_id;
        columnNames: true
        ordered: true
        hints:
          - Run the starter and look at the "manager" column. Those people work for employee 8, 9 or 10, not the other way round.
          - The foreign key manager_id belongs to e, the employee. It must equal m.emp_id.
          - "ON e.manager_id = m.emp_id"
        explanation: |
          All three report to Thiago. The broken version matched each person with the people who report to
          *them*. It ran without any error, which is why it's worth reading the rule aloud:
          "employee's manager number equals the manager's employee number."
        difficulty: 2

      - type: quiz
        id: m06-l07-q1
        question: |
          Why does a self join need **table aliases**?
        options:
          - Because the table is very large
          - Because the database needs to tell the two copies of the same table apart
          - Because self joins only work with LEFT JOIN
          - Because aliases make the query run faster
        answer: 1
        explanation: |
          Both sides of the join are the same table, so the name `employees` is ambiguous. Aliases such as
          `e` and `m` give each copy its own name. Speed has nothing to do with it.

      - type: read
        title: Comparing rows inside one table
        md: |
          A self join isn't only for hierarchies. Whenever you need to **compare one row with another row of
          the same table**, put the two copies side by side.

          For example, the `ON` rule doesn't have to use `=`. Any condition that links the two copies
          works, such as *"the employee earns more than the manager"*. Run it and see.

      - type: example
        title: Who earns more than their boss?
        md: |
          We join each employee to their manager with the usual rule, and then keep only the rows where the
          employee's salary is higher.
        sql: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.salary,
                 m.first_name || ' ' || m.last_name AS manager,
                 m.salary AS manager_salary
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          WHERE e.salary > m.salary;
        after: |
          Just one: Jia Kang, a Business Consultant, earns 135,000 while manager Mei Nakamura earns
          118,000. The two `salary` columns come from the two different copies, so the aliases `e.` and `m.`
          are what make the comparison possible.

      - type: exercise
        id: m06-l07-e4
        title: Close to the boss's pay
        prompt: |
          Find employees who earn **at least 88%** of their manager's salary (`e.salary >= 0.88 * m.salary`).
          Show `employee` (full name), `salary`, `manager` (full name) and `manager_salary`. Sort by the
          employee's `emp_id`.
        starter: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.salary,
                 m.first_name || ' ' || m.last_name AS manager,
                 m.salary AS manager_salary
          FROM employees AS e
          JOIN employees AS m
              ON ___
          WHERE ___
          ORDER BY e.emp_id;
        solution: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 e.salary,
                 m.first_name || ' ' || m.last_name AS manager,
                 m.salary AS manager_salary
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          WHERE e.salary >= 0.88 * m.salary
          ORDER BY e.emp_id;
        columnNames: true
        ordered: true
        hints:
          - Same join as the example. Only the WHERE condition changes.
          - Multiply the manager's salary by 0.88 and compare.
          - "WHERE e.salary >= 0.88 * m.salary"
        explanation: |
          Three people: Violet Wright, Diya Rao and Jia Kang. The next closest, Sophia, is at 87.5%, so the
          result isn't sensitive to rounding. You can do arithmetic across the two copies in the `WHERE` just
          like anywhere else.
        difficulty: 2

      - type: read
        title: Pairs of colleagues
        md: |
          Now a trickier idea: find **pairs of people who share the same manager** (colleagues). Join the
          table to itself on `manager_id`:

          ```sql
          FROM employees AS a
          JOIN employees AS b
              ON a.manager_id = b.manager_id
          ```

          Run that alone and you get a mess: every person is paired with **themselves**, and every pair
          appears **twice** (Vikram with Pierre, and Pierre with Vikram). A single extra condition fixes both:

          ```sql
              AND a.emp_id < b.emp_id
          ```

          Because the id of `a` must be **smaller** than the id of `b`, no one is paired with themselves
          and each pair is listed exactly once.

      - type: example
        title: Colleagues of Jun Zhang
        md: |
          Jun Zhang (employee 19) leads a frontend team of four. Which pairs of teammates exist?
        sql: |
          SELECT a.first_name AS person_a,
                 b.first_name AS person_b
          FROM employees AS a
          JOIN employees AS b
              ON a.manager_id = b.manager_id
             AND a.emp_id < b.emp_id
          WHERE a.manager_id = 19
          ORDER BY a.emp_id, b.emp_id;
        after: |
          Four teammates make **6 pairs** (4 x 3 / 2). Try changing `<` to `<>`: you'll get 12 rows, because
          every pair is now counted in both directions. Changing it to `<=` brings back the self-pairs.

      - type: predict
        id: m06-l07-p1
        question: |
          Employees 8 and 9 both report to employee 3, and so does employee 10. So manager 3 has exactly
          **three** direct reports. How many rows does this query return?
        sql: |
          SELECT a.emp_id AS a_id, b.emp_id AS b_id
          FROM employees AS a
          JOIN employees AS b
              ON a.manager_id = b.manager_id
             AND a.emp_id < b.emp_id
          WHERE a.manager_id = 3;
        options: ["3", "6", "9", "1"]
        answer: 0
        explanation: |
          Three people form three pairs: (8, 9), (8, 10) and (9, 10). With `<>` there would be 6 rows, and
          without any extra condition there would be 9 (3 x 3, including self-pairs).

      - type: exercise
        id: m06-l07-e5
        title: Same department, same salary
        prompt: |
          Find pairs of employees who are in the **same department** (`dept_id`) and have **exactly the same
          salary**. List each pair once. Show `person_a` and `person_b` (full names, built from first and
          last name) and the shared `salary`. Sort by `salary` (highest first), then by the id of person A, then
          by the id of person B.
        starter: |
          SELECT a.first_name || ' ' || a.last_name AS person_a,
                 b.first_name || ' ' || b.last_name AS person_b,
                 a.salary
          FROM employees AS a
          JOIN employees AS b
              ON a.dept_id = b.dept_id
             AND ___
             AND ___
          ORDER BY a.salary DESC, a.emp_id, b.emp_id;
        solution: |
          SELECT a.first_name || ' ' || a.last_name AS person_a,
                 b.first_name || ' ' || b.last_name AS person_b,
                 a.salary
          FROM employees AS a
          JOIN employees AS b
              ON a.dept_id = b.dept_id
             AND a.salary = b.salary
             AND a.emp_id < b.emp_id
          ORDER BY a.salary DESC, a.emp_id, b.emp_id;
        columnNames: true
        ordered: true
        hints:
          - You already have the department rule. You need two more conditions in the ON.
          - One condition says the salaries are equal; the other keeps each pair once.
          - "AND a.salary = b.salary AND a.emp_id < b.emp_id"
        explanation: |
          Nine pairs. Hana, Mariana and Tariq all earn 88,000 in the same department, so they form three
          pairs among themselves. The two contractors with no department (`dept_id` is NULL) can never match,
          because `NULL = NULL` is not true. Careful: the rule `a.emp_id < b.emp_id` is what stops each pair
          from showing up twice.
        difficulty: 3

      - type: fill
        id: m06-l07-f1
        prompt: |
          Complete the self join that lists each employee next to the manager's first name.
        template: |
          SELECT e.first_name AS employee, m.first_name AS manager
          FROM employees AS e
          JOIN employees AS ___
              ON e.manager_id = ___.emp_id;
        answers:
          - [m]
          - [m]
        explanation: |
          The second copy of the table is the manager, so we call it `m`. Its primary key (`emp_id`) is what the
          employee's `manager_id` points at.

      - type: parsons
        id: m06-l07-o1
        prompt: |
          Put the lines in order to show, for the employees with `emp_id` up to 5, the first name of the
          employee and of their manager, keeping people without a manager.
        lines:
          - SELECT e.first_name, m.first_name AS manager
          - FROM employees AS e
          - LEFT JOIN employees AS m
          - "    ON e.manager_id = m.emp_id"
          - WHERE e.emp_id <= 5
          - ORDER BY e.emp_id;
        distractors:
          - "    ON e.emp_id = m.manager_id"
        explanation: |
          Keep-everything-on-the-left means `LEFT JOIN`, and the rule is "employee's manager_id equals the
          manager's emp_id". The distractor reverses the two sides, which would list subordinates instead.

      - type: read
        title: Climbing two levels
        md: |
          You can use the table **three times** to climb further up the chain: the employee, their manager,
          and the manager's manager (the "grand-boss").

          ```sql
          FROM employees AS e
          LEFT JOIN employees AS m ON e.manager_id = m.emp_id
          LEFT JOIN employees AS g ON m.manager_id = g.emp_id
          ```

          Each new copy hooks onto the previous one. Use LEFT JOINs so that people near the top, who run out
          of bosses, still show up.

          > [!NOTE]
          > Climbing a fixed number of levels works, but what if you want the *whole* chain up to the CEO?
          > You can't know how many copies to write. That problem is solved by **recursive CTEs**, which you
          > will meet in module 9.

      - type: example
        title: Employee, manager and manager's manager
        md: |
          Let's follow five people, from the CEO down to a coordinator.
        sql: |
          SELECT e.first_name || ' ' || e.last_name AS employee,
                 m.first_name || ' ' || m.last_name AS manager,
                 g.first_name || ' ' || g.last_name AS manager_of_manager
          FROM employees AS e
          LEFT JOIN employees AS m
              ON e.manager_id = m.emp_id
          LEFT JOIN employees AS g
              ON m.manager_id = g.emp_id
          WHERE e.emp_id IN (1, 2, 8, 33, 55)
          ORDER BY e.emp_id;
        after: |
          Diego (the CEO) has no manager and no grand-boss: two NULLs. Ming reports straight to Diego, so
          only the grand-boss is NULL. Vikram Kumar reports to Jun Zhang, who reports to Layla Khan. Each
          LEFT JOIN kept the row even when the next step up didn't exist.

      - type: exercise
        id: m06-l07-e6
        title: Managers with big teams
        prompt: |
          Find managers with **at least 3 direct reports**. Show `manager` (the manager's full name),
          `boss_of_manager` (the full name of the manager's own manager, or `'(none)'` when there is none)
          and `reports` (how many people report to them). Sort by `reports` (largest first), then by the
          manager's `emp_id`.
        starter: |
          SELECT m.first_name || ' ' || m.last_name AS manager,
                 COALESCE(g.first_name || ' ' || g.last_name, '(none)')
                     AS boss_of_manager,
                 COUNT(*) AS reports
          FROM employees AS e
          JOIN employees AS m
              ON ___
          LEFT JOIN employees AS g
              ON ___
          GROUP BY m.emp_id, m.first_name, m.last_name,
                   g.emp_id, g.first_name, g.last_name
          HAVING ___
          ORDER BY reports DESC, m.emp_id;
        solution: |
          SELECT m.first_name || ' ' || m.last_name AS manager,
                 COALESCE(g.first_name || ' ' || g.last_name, '(none)')
                     AS boss_of_manager,
                 COUNT(*) AS reports
          FROM employees AS e
          JOIN employees AS m
              ON e.manager_id = m.emp_id
          LEFT JOIN employees AS g
              ON m.manager_id = g.emp_id
          GROUP BY m.emp_id, m.first_name, m.last_name,
                   g.emp_id, g.first_name, g.last_name
          HAVING COUNT(*) >= 3
          ORDER BY reports DESC, m.emp_id;
        columnNames: true
        ordered: true
        hints:
          - Three copies of the table, in a chain, then GROUP BY the manager. Each row of e is one report.
          - "First rule: e.manager_id = m.emp_id. Second rule: m.manager_id = g.emp_id (a LEFT JOIN, since the CEO has no boss)."
          - "HAVING COUNT(*) >= 3"
        explanation: |
          Four managers: the CEO (6 reports, no boss), Jun Zhang (4), Thiago Rodriguez (3) and Mei Nakamura
          (3). This pulls together a self join, a second self join, GROUP BY and HAVING in one query. If the
          second join were a plain `JOIN`, the CEO would vanish, because he has no boss to match.
        difficulty: 3

    cheatsheet:
      - title: Self join (employee and manager)
        sql: |
          SELECT e.first_name AS employee, m.first_name AS manager
          FROM employees AS e
          LEFT JOIN employees AS m
              ON e.manager_id = m.emp_id;
        note: One table, two aliases. The foreign key belongs to the employee alias; it points at the manager alias's primary key.
      - title: Pairs without duplicates
        sql: |
          SELECT a.first_name, b.first_name
          FROM employees AS a
          JOIN employees AS b
              ON a.manager_id = b.manager_id
             AND a.emp_id < b.emp_id;
        note: "a.emp_id < b.emp_id avoids self-pairs and mirrored duplicates."
      - title: Compare rows with each other
        sql: |
          SELECT e.first_name, e.salary, m.salary AS manager_salary
          FROM employees AS e
          JOIN employees AS m ON e.manager_id = m.emp_id
          WHERE e.salary > m.salary;
        note: The two aliases give you two rows side by side, so you can compare their columns.

  - id: m06-l08
    title: CROSS JOIN & non-equi joins
    summary: Pair every row with every row, and match rows with ranges and comparisons instead of equals.
    minutes: 25
    steps:
      - type: read
        title: Two joins that don't match keys
        md: |
          Every join so far matched a foreign key to a primary key with `=`. That covers about nine joins
          out of ten. Today you'll meet two more tools for the tenth:

          1. **CROSS JOIN**: pair **every** row of one table with **every** row of another. No matching
             rule at all.
          2. **Non-equi joins**: match rows using `<`, `>` or `BETWEEN` instead of `=`. ("Equi" means
             "equal", so *non-equi* means "not using equals".)

          Here is a story for each. The merchandising team wants a **coverage grid** of every supplier
          against every category, to spot combinations the shop doesn't stock yet. And finance wants to
          sort products into **price bands** such as Budget and Premium. Neither of those has a key to
          match on.

          > [!ANALOGY]
          > A restaurant has 3 starters and 4 main courses. How many two-course meals can you build?
          > Every starter with every main: 3 x 4 = **12**. That's a CROSS JOIN.

      - type: viz
        viz: join
        title: Every row with every row
        md: |
          Three sizes and two colours. Click **CROSS JOIN** and count the result: 3 x 2 = 6 rows. There
          is no stripe, because there is no matching rule.
        config:
          left:
            name: sizes
            columns: [size_id, size]
            rows: [[1, S], [2, M], [3, L]]
          right:
            name: colours
            columns: [colour_id, colour]
            rows: [[1, Red], [2, Blue]]
          on: [size_id, colour_id]
          types: [cross]

      - type: read
        title: The CROSS JOIN pattern
        md: |
          ```sql
          SELECT a.some_column, b.other_column
          FROM table_a AS a
          CROSS JOIN table_b AS b;
          ```

          There is **no `ON`**. The number of result rows is always:

          > rows in A **x** rows in B

          With two small tables that is handy. With two big tables it explodes, so it pays to know the
          numbers before you press Run.

      - type: example
        title: Suppliers x categories
        md: |
          Take the first two suppliers and three categories (Books, Toys, Kitchen). Every supplier gets
          paired with every category.
        sql: |
          SELECT s.name AS supplier,
                 c.name AS category
          FROM suppliers AS s
          CROSS JOIN categories AS c
          WHERE s.supplier_id <= 2
            AND c.category_id IN (4, 5, 9)
          ORDER BY s.supplier_id, c.category_id;
        after: |
          2 suppliers x 3 categories = **6 rows**. The `WHERE` filters the two lists first, then every
          remaining supplier meets every remaining category. Each supplier name is repeated three times.

      - type: exercise
        id: m06-l08-e1
        title: Four pairings
        prompt: |
          Show every combination of the suppliers with `supplier_id` 3 or 4 and the categories with
          `category_id` 5 or 6. Show the supplier `name` as `supplier` and the category `name` as `category`.
          Sort by `supplier_id`, then `category_id`.
        starter: |
          SELECT s.name AS supplier,
                 c.name AS category
          FROM suppliers AS s
          ___ JOIN categories AS c
          WHERE ___
          ORDER BY s.supplier_id, c.category_id;
        solution: |
          SELECT s.name AS supplier,
                 c.name AS category
          FROM suppliers AS s
          CROSS JOIN categories AS c
          WHERE s.supplier_id IN (3, 4)
            AND c.category_id IN (5, 6)
          ORDER BY s.supplier_id, c.category_id;
        columnNames: true
        ordered: true
        hints:
          - It is the example again with different ids.
          - "A CROSS JOIN has no ON. Filter both lists in the WHERE with IN (...)."
          - "WHERE s.supplier_id IN (3, 4) AND c.category_id IN (5, 6)"
        explanation: |
          2 x 2 = 4 rows. Jade River Manufacturing and Tanuki Goods each pair with Toys and Beauty. Notice
          there's nothing to join on: the tables don't need to be related at all.
        difficulty: 1

      - type: predict
        id: m06-l08-p1
        question: |
          `suppliers` has 8 rows and `categories` has 14. What does this query return?
        sql: |
          SELECT COUNT(*)
          FROM suppliers
          CROSS JOIN categories;
        options: ["22", "112", "8", "14"]
        answer: 1
        explanation: |
          A CROSS JOIN returns rows in A **x** rows in B: 8 x 14 = 112. (Adding the row counts to get 22 is
          the classic slip.)

      - type: read
        title: The accidental cross join
        md: |
          > [!MISTAKE]
          > Old SQL code lists tables with commas, like `FROM orders, customers`, and puts the matching
          > rule in the `WHERE`. If someone forgets that rule, the database happily returns **every order
          > paired with every customer**, with no error at all. Modern `JOIN ... ON` syntax can't do this by
          > accident, because a missing `ON` is a syntax error. That's one more reason to always write
          > joins with `JOIN` and `ON`.

      - type: example
        title: How big can it get?
        md: |
          Count the rows when the matching rule is forgotten. There are 900 orders and 150 customers.
        sql: |
          SELECT COUNT(*)
          FROM orders, customers;
        after: |
          **135,000** rows (900 x 150) when you wanted 900. Whenever a join returns far more rows than
          the biggest table, suspect a missing or too-loose `ON` rule.

      - type: read
        title: A real use, fill in the zeros
        md: |
          The best use of CROSS JOIN is to **build a complete grid first** and then `LEFT JOIN` the real
          data onto it. Combinations with no data stay in the report with a count of 0, instead of
          silently disappearing the way they would with a plain join.

      - type: example
        title: The coverage grid
        md: |
          For the first three suppliers and the categories Books, Toys and Kitchen: how many products does
          each supplier have in each category?
        sql: |
          SELECT s.name AS supplier,
                 c.name AS category,
                 COUNT(p.product_id) AS products
          FROM suppliers AS s
          CROSS JOIN categories AS c
          LEFT JOIN products AS p
              ON p.supplier_id = s.supplier_id
             AND p.category_id = c.category_id
          WHERE s.supplier_id <= 3
            AND c.category_id IN (4, 5, 9)
          GROUP BY s.supplier_id, s.name, c.category_id, c.name
          ORDER BY s.supplier_id, c.category_id;
        after: |
          All 9 combinations appear, including the zeros: Lumen Trading has no Toys, and Tanuki Goods
          supplies nothing in these three categories at all. Without the CROSS JOIN, those rows would simply
          be missing and the gaps would be invisible.

      - type: exercise
        id: m06-l08-e2
        title: Another coverage grid
        prompt: |
          Build the grid for suppliers with `supplier_id` 4 and 5 and for the categories with `category_id`
          5, 8, 9 and 11 (Toys, Phones, Kitchen, Outdoor). Show `supplier` (name), `category` (name) and
          `products` (how many products that supplier has in that category, 0 if none). Sort by
          `supplier_id`, then `category_id`.
        starter: |
          SELECT s.name AS supplier,
                 c.name AS category,
                 COUNT(p.product_id) AS products
          FROM suppliers AS s
          CROSS JOIN categories AS c
          LEFT JOIN products AS p
              ON ___
          WHERE ___
          GROUP BY s.supplier_id, s.name, c.category_id, c.name
          ORDER BY s.supplier_id, c.category_id;
        solution: |
          SELECT s.name AS supplier,
                 c.name AS category,
                 COUNT(p.product_id) AS products
          FROM suppliers AS s
          CROSS JOIN categories AS c
          LEFT JOIN products AS p
              ON p.supplier_id = s.supplier_id
             AND p.category_id = c.category_id
          WHERE s.supplier_id IN (4, 5)
            AND c.category_id IN (5, 8, 9, 11)
          GROUP BY s.supplier_id, s.name, c.category_id, c.name
          ORDER BY s.supplier_id, c.category_id;
        columnNames: true
        ordered: true
        hints:
          - The LEFT JOIN needs two conditions joined with AND, one per grid dimension.
          - "A product belongs to a grid cell when its supplier_id AND its category_id both match."
          - "ON p.supplier_id = s.supplier_id AND p.category_id = c.category_id"
        explanation: |
          Eight rows (2 x 4). Jade River has 5 Phones but no Outdoor products; Nordlys has only Kitchen
          items. Counting `p.product_id` (not `*`) is what makes the empty cells show 0.
        difficulty: 2

      - type: quiz
        id: m06-l08-q1
        question: |
          Which of these is a good use of a `CROSS JOIN`?
        options:
          - Matching each order with the customer who placed it
          - Listing every size together with every colour
          - Finding customers who never ordered
          - Putting the rows of one table below the rows of another
        answer: 1
        explanation: |
          A CROSS JOIN builds every combination of two lists, like sizes and colours. Matching orders to
          customers needs an ON rule; finding missing rows needs a LEFT JOIN; stacking rows is a different
          tool (UNION, in module 8).

      - type: read
        title: Non-equi joins, matching by range
        md: |
          The `ON` of a join can contain **any condition**, not only `=`. The most useful ones:

          - **Ranges** with `BETWEEN`, or with `>=` and `<`.
          - **Comparisons** between rows with `<` and `>`.

          Typical uses: price tiers, salary bands, grade boundaries, "which promotion was running on that
          date?".

          For the next examples we need a small lookup table of price bands. The first two statements of each
          example create it (you'll learn `CREATE TABLE` in module 13, so ignore the details for now).
          Each band covers `min_price` up to, but **not including**, `max_price`.

      - type: example
        title: Price bands
        md: |
          Each product matches exactly one band, the one where `min_price <= price < max_price`.
        sql: |
          CREATE TABLE price_bands (
              band text, min_price numeric, max_price numeric);
          INSERT INTO price_bands VALUES
              ('Budget', 0, 25), ('Standard', 25, 100),
              ('Premium', 100, 500), ('Luxury', 500, 100000);

          SELECT b.band,
                 COUNT(*) AS products,
                 MIN(p.price) AS cheapest,
                 MAX(p.price) AS dearest
          FROM products AS p
          JOIN price_bands AS b
              ON p.price >= b.min_price
             AND p.price < b.max_price
          GROUP BY b.band, b.min_price
          ORDER BY b.min_price;
        after: |
          13 Budget, 29 Standard, 10 Premium and 8 Luxury products: **60 in total**, exactly the number of
          products in the shop. Each product found one and only one band. That is what you want from a
          range join.

      - type: example
        title: When bands overlap
        md: |
          Here is the classic trap. These bands are written with `BETWEEN`, which includes **both ends**,
          and one band's maximum is the next band's minimum (24.99 and 99.99 are used twice).
        sql: |
          CREATE TABLE price_bands (
              band text, min_price numeric, max_price numeric);
          INSERT INTO price_bands VALUES
              ('Budget', 0, 24.99), ('Standard', 24.99, 99.99),
              ('Premium', 99.99, 499.99), ('Luxury', 499.99, 100000);

          SELECT COUNT(*) AS rows_returned
          FROM products AS p
          JOIN price_bands AS b
              ON p.price BETWEEN b.min_price AND b.max_price;
        after: |
          **66 rows** from 60 products. Four products cost exactly 24.99 and two cost exactly 99.99. Each
          of those six fits **two** bands, so each appears twice. No error, just quietly wrong totals.
          Fix: make bands touch but never overlap, using `>= min AND < max` as in the previous example.

      - type: exercise
        id: m06-l08-e3
        title: Products per band, from a helper table
        prompt: |
          A helper table `price_bands(band, min_price, max_price)` already exists for this exercise. A
          product belongs to a band when `min_price <= price < max_price`. Show each `band` and the number
          of products in it as `products`. Sort by `min_price`.
        setup: |
          CREATE TABLE price_bands (
              band text, min_price numeric, max_price numeric);
          INSERT INTO price_bands VALUES
              ('Budget', 0, 25), ('Standard', 25, 100),
              ('Premium', 100, 500), ('Luxury', 500, 100000);
        starter: |
          SELECT b.band, COUNT(*) AS products
          FROM products AS p
          JOIN price_bands AS b
              ON ___
          GROUP BY b.band, b.min_price
          ORDER BY b.min_price;
        solution: |
          SELECT b.band, COUNT(*) AS products
          FROM products AS p
          JOIN price_bands AS b
              ON p.price >= b.min_price
             AND p.price < b.max_price
          GROUP BY b.band, b.min_price
          ORDER BY b.min_price;
        columnNames: true
        ordered: true
        hints:
          - The ON rule is a range check, not an equality.
          - "The price must be at least min_price and below max_price."
          - "ON p.price >= b.min_price AND p.price < b.max_price"
        explanation: |
          13, 29, 10 and 8, adding up to the 60 products. Grouping by `b.min_price` as well as `b.band` lets
          us sort the bands from cheapest to dearest.
        difficulty: 2

      - type: example
        title: Which promotion was running?
        md: |
          Dates work the same way. The helper table `promotions` has a start and end date (both days
          included), so `BETWEEN` is the right tool here: it matches an order if its date falls inside the
          window. Orders outside every window have no partner and are dropped by the INNER JOIN.
        sql: |
          CREATE TABLE promotions (
              promo text, starts_on date, ends_on date);
          INSERT INTO promotions VALUES
              ('Summer Sale', '2024-06-15', '2024-08-31'),
              ('Black Friday Week', '2024-11-25', '2024-12-01'),
              ('Holiday Rush', '2024-12-15', '2024-12-24');

          SELECT pr.promo, COUNT(*) AS orders
          FROM promotions AS pr
          JOIN orders AS o
              ON o.order_date BETWEEN pr.starts_on AND pr.ends_on
          GROUP BY pr.promo, pr.starts_on
          ORDER BY pr.starts_on;
        after: |
          117 orders during the Summer Sale, 30 in Black Friday week and 35 during Holiday Rush. The three
          windows don't overlap, so every order matches at most one promotion. If two windows overlapped,
          an order inside both would be counted twice.

      - type: fill
        id: m06-l08-f1
        prompt: |
          Complete the range join so it keeps only orders placed in the first 30 days after the customer
          signed up (both end days count).
        template: |
          SELECT c.customer_id, o.order_id
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.order_date ___ c.signup_date ___ c.signup_date + 30
          WHERE c.customer_id IN (63, 64, 68);
        answers:
          - [BETWEEN]
          - [AND]
        explanation: |
          `BETWEEN a AND b` is shorthand for `>= a AND <= b`. It includes both ends, which is exactly what
          you want for whole days, and exactly the trap for numeric bands that touch. Notice that this `ON`
          mixes an equality (same customer) with a range (the 30-day window).

      - type: exercise
        id: m06-l08-e4
        title: Revenue per promotion
        prompt: |
          A helper table `promotions(promo, starts_on, ends_on)` exists for this exercise (the same three
          windows as in the example; both end dates are included). For **delivered** orders only, show each
          `promo` and its `revenue`: the sum of `quantity * unit_price * (1 - discount)` over the order
          lines of the orders placed inside the window, rounded to 2 decimals. Sort by `revenue`, highest
          first.
        setup: |
          CREATE TABLE promotions (
              promo text, starts_on date, ends_on date);
          INSERT INTO promotions VALUES
              ('Summer Sale', '2024-06-15', '2024-08-31'),
              ('Black Friday Week', '2024-11-25', '2024-12-01'),
              ('Holiday Rush', '2024-12-15', '2024-12-24');
        starter: |
          SELECT pr.promo,
                 ROUND(SUM(___), 2) AS revenue
          FROM promotions AS pr
          JOIN orders AS o
              ON ___
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY pr.promo
          ORDER BY revenue DESC;
        solution: |
          SELECT pr.promo,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM promotions AS pr
          JOIN orders AS o
              ON o.order_date BETWEEN pr.starts_on AND pr.ends_on
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY pr.promo
          ORDER BY revenue DESC;
        columnNames: true
        ordered: true
        hints:
          - "Two joins: promotions to orders by date range (non-equi), then orders to order_items by key (equi)."
          - "Line revenue is oi.quantity * oi.unit_price * (1 - oi.discount); SUM it and ROUND to 2."
          - "ON o.order_date BETWEEN pr.starts_on AND pr.ends_on"
        explanation: |
          Summer Sale 29,536.84; Holiday Rush 10,177.69; Black Friday Week 5,970.71. You mixed one non-equi
          join with one ordinary join in the same chain, which is very common in reporting.
        difficulty: 3

      - type: parsons
        id: m06-l08-o1
        prompt: |
          Put the lines in order to pair supplier 1 with the categories 4 and 5 (Books and Toys), sorted by
          category id.
        lines:
          - SELECT s.name AS supplier, c.name AS category
          - FROM suppliers AS s
          - CROSS JOIN categories AS c
          - WHERE s.supplier_id = 1
          - "  AND c.category_id IN (4, 5)"
          - ORDER BY c.category_id;
        distractors:
          - "    ON s.supplier_id = c.category_id"
        explanation: |
          A CROSS JOIN never has an `ON`. The distractor would be a syntax error here, and in any case it
          would compare two unrelated ids.

      - type: exercise
        id: m06-l08-e5
        title: Orders placed too close together
        prompt: |
          Customer service suspects some customers accidentally ordered twice. Find pairs of orders from
          the **same customer** placed on the same day or the next day. For each pair show `customer_id`,
          `first_order` (the smaller `order_id`), `second_order` (the larger `order_id`) and `days_apart`
          (second order date minus first order date). Sort by `customer_id`, `first_order`,
          `second_order`.
        starter: |
          SELECT a.customer_id,
                 a.order_id AS first_order,
                 b.order_id AS second_order,
                 b.order_date - a.order_date AS days_apart
          FROM orders AS a
          JOIN orders AS b
              ON ___
             AND ___
             AND ___
          ORDER BY a.customer_id, first_order, second_order;
        solution: |
          SELECT a.customer_id,
                 a.order_id AS first_order,
                 b.order_id AS second_order,
                 b.order_date - a.order_date AS days_apart
          FROM orders AS a
          JOIN orders AS b
              ON a.customer_id = b.customer_id
             AND a.order_id < b.order_id
             AND b.order_date - a.order_date <= 1
          ORDER BY a.customer_id, first_order, second_order;
        columnNames: true
        ordered: true
        hints:
          - It is a self join on orders, like the pairs of colleagues in the last lesson.
          - "Three conditions: same customer, a.order_id < b.order_id, and the date difference is at most 1 day."
          - "AND b.order_date - a.order_date <= 1 (subtracting two dates gives a number of days)"
        explanation: |
          23 pairs, 8 of them on the very same day. The ON rule mixes an equality (same customer) with two
          non-equi conditions (`<` on the ids, and a limit on the day gap). Order ids grow with the order
          date in this shop, so the first order is never the later one.
        difficulty: 3

    cheatsheet:
      - title: CROSS JOIN
        sql: |
          SELECT s.name, c.name
          FROM suppliers AS s
          CROSS JOIN categories AS c;
        note: Every row of A with every row of B, no ON. Rows returned = rows in A x rows in B.
      - title: Grid first, then LEFT JOIN the facts
        sql: |
          SELECT s.name, c.name, COUNT(p.product_id)
          FROM suppliers AS s
          CROSS JOIN categories AS c
          LEFT JOIN products AS p
              ON p.supplier_id = s.supplier_id
             AND p.category_id = c.category_id
          GROUP BY s.supplier_id, s.name, c.category_id, c.name;
        note: Missing combinations stay in the report with a count of 0.
      - title: Range join without overlaps
        sql: |
          SELECT p.name, b.band
          FROM products AS p
          JOIN price_bands AS b
              ON p.price >= b.min_price
             AND p.price < b.max_price;
        note: Use >= min and < max so that touching bands never double count. BETWEEN includes both ends.

  - id: m06-l09
    title: Joins + aggregation
    summary: Join tables, then summarise them, and learn to spot and fix the fan-out (double counting) trap.
    minutes: 30
    steps:
      - type: read
        title: The CFO's three questions
        md: |
          The finance director at ShopSmart sends three requests:

          1. "How much **revenue** did each customer bring in?"
          2. "How much revenue did each **product category** bring in?"
          3. "How many **orders** did each customer place?"

          Each answer lives in more than one table, so you'll **join first, then group**: the JOIN brings the
          columns together, and `GROUP BY` collapses the rows into one per customer or per category. It is
          probably the most common query shape in the real world.

          One reminder: there is no "order total" column. The revenue of one order line is
          `quantity * unit_price * (1 - discount)`, and we add those up. We'll count only **delivered**
          orders, so cancelled and returned ones don't inflate the numbers.

      - type: example
        title: Revenue per customer
        md: |
          Route: `customers` -> `orders` -> `order_items`. Show the five best customers.
        sql: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY c.customer_id, c.first_name, c.last_name
          ORDER BY revenue DESC
          LIMIT 5;
        after: |
          Noor Haddad leads with $8,458.40, followed by Seun Kamau with $7,227.87. We grouped by
          `customer_id` **and** the name columns, because everything in `SELECT` that isn't inside an
          aggregate must be in the `GROUP BY` (module 5). Grouping by id guards against two different
          customers with the same name.

      - type: exercise
        id: m06-l09-e1
        title: Revenue per segment
        prompt: |
          Show each customer `segment` and its delivered `revenue` (sum of
          `quantity * unit_price * (1 - discount)`, rounded to 2 decimals). Sort by revenue, highest first.
        starter: |
          SELECT c.segment,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM customers AS c
          JOIN orders AS o
              ON ___
          JOIN order_items AS oi
              ON ___
          WHERE ___
          GROUP BY ___
          ORDER BY revenue DESC;
        solution: |
          SELECT c.segment,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY c.segment
          ORDER BY revenue DESC;
        columnNames: true
        ordered: true
        hints:
          - Same three tables and joins as the example. Only the grouping column changes.
          - "Group by c.segment instead of by customer."
          - "WHERE o.status = 'delivered' GROUP BY c.segment"
        explanation: |
          Consumer $142,528.77, Home Office $46,572.96, Corporate $40,341.77. Together they come to
          $229,443.50, which is the shop's total delivered revenue. Keep that number in mind: it is the
          yardstick we'll use to check our joins later in this lesson.
        difficulty: 1

      - type: example
        title: Revenue per category
        md: |
          Four tables now: `order_items` -> `orders` (for the status filter), `order_items` -> `products`
          -> `categories`.
        sql: |
          SELECT cat.name AS category,
                 SUM(oi.quantity) AS units,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS cat
              ON cat.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY cat.category_id, cat.name
          ORDER BY revenue DESC;
        after: |
          Phones bring in the most money ($60,548.25), but Books sell the most units (540) while earning
          only $11,831.22. Sorting by revenue and sorting by units tell two different stories.

      - type: exercise
        id: m06-l09-e2
        title: Revenue per supplier
        prompt: |
          For delivered orders, show each supplier's `name` as `supplier` and its `revenue` (rounded to 2
          decimals). Order lines of products **without a supplier** must not be lost: group them under the
          text `'Direct'`. Sort by revenue, highest first.
        starter: |
          SELECT COALESCE(s.name, 'Direct') AS supplier,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          ___ JOIN suppliers AS s
              ON ___
          WHERE o.status = 'delivered'
          GROUP BY ___
          ORDER BY revenue DESC;
        solution: |
          SELECT COALESCE(s.name, 'Direct') AS supplier,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          LEFT JOIN suppliers AS s
              ON s.supplier_id = p.supplier_id
          WHERE o.status = 'delivered'
          GROUP BY s.supplier_id, s.name
          ORDER BY revenue DESC;
        columnNames: true
        ordered: true
        hints:
          - Some products have no supplier. Which join keeps rows that find no partner?
          - "LEFT JOIN suppliers, then group by s.supplier_id and s.name; all the unsupplied rows fall into one NULL group."
          - "LEFT JOIN suppliers AS s ON s.supplier_id = p.supplier_id ... GROUP BY s.supplier_id, s.name"
        explanation: |
          Nine rows. Tanuki Goods leads with $88,929.01, and the 'Direct' group (two Books products sold
          without a supplier) is worth $6,119.85. With an INNER JOIN that $6,119.85 would have vanished from the
          report, with no error to warn you.
        difficulty: 2

      - type: read
        title: Joins change the grain
        md: |
          Here is the idea behind the classic join + aggregation bug. Every table has a **grain**: what one
          row represents.

          | table | one row is... |
          |---|---|
          | `customers` | one customer |
          | `orders` | one order |
          | `order_items` | one product line inside an order |
          | `payments` | one payment for an order |

          When you join to a table with a finer grain, the rows of the coarser table are **repeated**,
          once per matching row. This repetition is called **fan-out**. Customer 6 has 23 orders, but those
          orders contain 70 order lines. After `orders JOIN order_items`, each order row is repeated once
          per line.

          > [!ANALOGY]
          > Imagine a supermarket receipt that shows "Total paid: $40" at the top and lists 8 products below.
          > If you copy the total next to every product line and then add up the total column, you get
          > $320, not $40. The total belongs to the **receipt**, not to each line.

      - type: example
        title: Counting orders the wrong way
        md: |
          How many orders did customer 6 place? Let's count the joined rows, and count the *different*
          order ids, side by side.
        sql: |
          SELECT COUNT(*) AS rows_counted,
                 COUNT(DISTINCT o.order_id) AS real_orders
          FROM orders AS o
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.customer_id = 6;
        after: |
          `COUNT(*)` says **70**: it counted order *lines*. The true number of orders is **23**.
          `COUNT(DISTINCT o.order_id)` ignores repeats of the same order id, so it gives the right answer.
          Rule of thumb: after a join to a finer-grained table, count the **ids of the coarse table** with
          `COUNT(DISTINCT ...)`.

      - type: predict
        id: m06-l09-p1
        question: |
          Customer 14 placed 23 orders, and those orders contain 52 order lines in total. What does this
          return?
        sql: |
          SELECT COUNT(*)
          FROM orders AS o
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.customer_id = 14;
        options: ["23", "52", "75", "1"]
        answer: 1
        explanation: |
          After the join there is one row per order line, and `COUNT(*)` counts rows: 52. To count the orders
          you would need `COUNT(DISTINCT o.order_id)`, which returns 23.

      - type: exercise
        id: m06-l09-e3
        title: Fix the order count
        prompt: |
          This query is meant to show how many **orders** customers 10, 14 and 44 placed (column
          `orders`), but it counts order lines instead. Fix it. Keep the columns and sort by `customer_id`.
        starter: |
          SELECT c.customer_id,
                 c.first_name,
                 COUNT(*) AS orders
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id IN (10, 14, 44)
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 COUNT(DISTINCT o.order_id) AS orders
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id IN (10, 14, 44)
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - Run the starter. Customer 14 shows 52, but they placed fewer orders than that.
          - "Count the different order ids, not the joined rows."
          - "COUNT(DISTINCT o.order_id) AS orders"
        explanation: |
          The correct counts are 19, 23 and 23. The broken version gave 63, 52 and 43: the number of order
          lines. The query ran without errors and the numbers looked plausible, which is what makes
          fan-out dangerous.
        difficulty: 2

      - type: read
        title: Now with money, it gets worse
        md: |
          Counts are easy to fix with `DISTINCT`. **Sums** are the real danger, because a wrong total looks
          just as believable as a right one.

          > [!MISTAKE]
          > Joining two "many" tables to the same parent, for example `orders` to both `payments` **and**
          > `order_items`, and then summing a column from one of them. Each payment gets repeated once per
          > order line, so the payment total is multiplied.

          The payments in the shop really add up to **$263,983.37**. If you join them to `order_items` on
          the way (through `orders`), that same `SUM(amount)` jumps to **$835,686.01**: over three times too
          much. Let's watch it happen on one order.

      - type: example
        title: One payment, four copies
        md: |
          Order 17 was paid with a single payment of $128.95 and contains 4 order lines. Join all three
          tables and look at the rows.
        sql: |
          SELECT o.order_id,
                 py.amount,
                 oi.order_item_id
          FROM orders AS o
          JOIN payments AS py
              ON py.order_id = o.order_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.order_id = 17
          ORDER BY oi.order_item_id;
        after: |
          The same payment of 128.95 appears **four times**, once per order line. Add up the `amount`
          column and you get 4 x 128.95 = **515.80**, but the customer only paid 128.95. The `payments` row
          didn't change: the join simply copied it.

      - type: stepper
        title: Watch a total inflate
        md: |
          How much did customer 6 (Noor Haddad) actually pay? Run both stages and compare.
        stages:
          - label: Payments only
            md: |
              Join `orders` to `payments` and add up the amounts. 21 payment rows give the true total:
              $10,946.76.
            sql: |
              SELECT COUNT(*) AS rows_joined,
                     SUM(py.amount) AS total_paid
              FROM orders AS o
              JOIN payments AS py
                  ON py.order_id = o.order_id
              WHERE o.customer_id = 6;
          - label: Oops, add order_items
            md: |
              Add `JOIN order_items` "for completeness". The payments get copied once per order line: 60
              rows, and a total of **$39,709.13**, more than three and a half times too big. Nothing in the
              query looks wrong!
            sql: |
              SELECT COUNT(*) AS rows_joined,
                     SUM(py.amount) AS total_paid
              FROM orders AS o
              JOIN payments AS py
                  ON py.order_id = o.order_id
              JOIN order_items AS oi
                  ON oi.order_id = o.order_id
              WHERE o.customer_id = 6;

      - type: quiz
        id: m06-l09-q1
        question: |
          You want the total of `payments.amount` for each customer. Which join is most likely to give an
          **inflated** total?
        options:
          - customers -> orders -> payments
          - payments -> orders -> customers
          - customers -> orders -> payments, plus a join to order_items
          - payments on its own (no join at all)
        answer: 2
        explanation: |
          Each order has several order lines. Joining `order_items` copies every payment once per line, so the
          sum is multiplied. The first two options just walk the one-to-many path in two directions, and
          `payments` on its own can't fan out.

      - type: read
        title: How to fix a fan-out
        md: |
          Four ways to stay safe, from simplest to most powerful:

          1. **Join only what the question needs.** If you want payments per customer, don't touch
             `order_items`. Different measures can go in different queries.
          2. **Count with `COUNT(DISTINCT id)`** when you need to count rows of the coarser table.
          3. **Check your total** against a simple query on one table (we do this in a moment).
          4. **Aggregate first, join afterwards**: summarise each branch on its own, then join the small
             results. This is the proper fix when you need both measures in a single row. You'll learn the
             tools for it in modules 7 (subqueries) and 9 (CTEs).

          > [!WARNING]
          > `SUM(DISTINCT amount)` looks like a quick fix, but it is **not**. It removes repeated *values*,
          > not repeated *rows*. Two different payments of exactly $50 would be reduced to one.

      - type: example
        title: Why SUM(DISTINCT) is not a fix
        md: |
          Over the whole `payments` table, with no joins at all, compare the honest sum with `SUM(DISTINCT)`.
        sql: |
          SELECT SUM(amount) AS real_total,
                 SUM(DISTINCT amount) AS distinct_total,
                 COUNT(*) AS payments,
                 COUNT(DISTINCT amount) AS different_amounts
          FROM payments;
        after: |
          There are 778 payments but only 599 different amounts. `SUM(DISTINCT amount)` threw away every
          repeated amount and returned $240,715.20, about $23,000 less than the true $263,983.37. With a
          join in the mix it would be wrong **and** unrelated to the true figure.

      - type: exercise
        id: m06-l09-e4
        title: Customer scorecard
        prompt: |
          Build a scorecard of **delivered** orders for customers with **at least 12 delivered orders**.
          Show `customer_id`, `first_name`, `orders` (number of different delivered orders), `units` (sum
          of `quantity`) and `revenue` (sum of `quantity * unit_price * (1 - discount)`, rounded to 2
          decimals). Sort by `revenue`, highest first, then by `customer_id`.
        starter: |
          SELECT c.customer_id,
                 c.first_name,
                 COUNT(___) AS orders,
                 SUM(oi.quantity) AS units,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY c.customer_id, c.first_name
          HAVING ___
          ORDER BY revenue DESC, c.customer_id;
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 COUNT(DISTINCT o.order_id) AS orders,
                 SUM(oi.quantity) AS units,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY c.customer_id, c.first_name
          HAVING COUNT(DISTINCT o.order_id) >= 12
          ORDER BY revenue DESC, c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - "The orders count must ignore repeats caused by the join to order_items."
          - "COUNT(DISTINCT o.order_id) both in SELECT and in HAVING."
          - "HAVING COUNT(DISTINCT o.order_id) >= 12"
        explanation: |
          Ten customers qualify. Noor Haddad: 18 delivered orders, 62 units, $8,458.40. Here `SUM` is safe
          because only **one** many-side table (`order_items`) hangs below `orders`, and every figure we add
          up comes from that table. Only the order count needed `DISTINCT`.
        difficulty: 2

      - type: fill
        id: m06-l09-f1
        prompt: |
          Complete the query so it counts customer 14's real **orders**, not their order lines.
        template: |
          SELECT c.first_name,
                 COUNT(___ o.order_id) AS orders
          FROM customers AS c
          JOIN orders AS o
              ON o.customer_id = c.customer_id
          JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id = 14
          GROUP BY c.first_name;
        answers:
          - [DISTINCT]
        explanation: |
          `COUNT(DISTINCT o.order_id)` counts each order id once, however many order lines it has.

      - type: read
        title: The clean fix, a preview
        md: |
          Suppose you really do need **units and payments side by side** for each customer. The safe recipe
          is to summarise each branch separately, and join the two small summaries. Here it is for customer 6,
          using a *subquery in `FROM`* (a query inside brackets that acts like a temporary table). You'll
          learn this properly in module 7, so for now just run it and compare the numbers.

      - type: example
        title: Aggregate first, join afterwards (preview)
        md: |
          `i` holds one row per customer with their units; `pay` holds one row per customer with their
          payments. Joining two one-row-per-customer tables can't fan out.
        sql: |
          SELECT c.first_name,
                 i.units,
                 pay.paid
          FROM customers AS c
          JOIN (SELECT o.customer_id,
                       SUM(oi.quantity) AS units
                FROM orders AS o
                JOIN order_items AS oi
                    ON oi.order_id = o.order_id
                GROUP BY o.customer_id) AS i
              ON i.customer_id = c.customer_id
          JOIN (SELECT o.customer_id,
                       SUM(py.amount) AS paid
                FROM orders AS o
                JOIN payments AS py
                    ON py.order_id = o.order_id
                GROUP BY o.customer_id) AS pay
              ON pay.customer_id = c.customer_id
          WHERE c.customer_id = 6;
        after: |
          Noor bought 90 units and paid $10,946.76. That is the **true** payment total, the same one we got
          from the honest `payments`-only query, even though units and payments now sit side by side. Each
          branch was summed on its own before the join.

      - type: parsons
        id: m06-l09-o1
        prompt: |
          Put the lines in order to show how many units each category sold (all orders), most units first.
        lines:
          - SELECT cat.name AS category,
          - "       SUM(oi.quantity) AS units"
          - FROM order_items AS oi
          - JOIN products AS p
          - "    ON p.product_id = oi.product_id"
          - JOIN categories AS cat
          - "    ON cat.category_id = p.category_id"
          - GROUP BY cat.name
          - ORDER BY units DESC;
        distractors:
          - WHERE SUM(oi.quantity) > 100
        explanation: |
          Join first, then group. The distractor is the classic mistake: aggregate functions can't be used
          in `WHERE`, because rows are filtered before the groups exist. Group filters go in `HAVING`.

      - type: exercise
        id: m06-l09-e5
        title: Revenue, including customers with none
        prompt: |
          For customers with `customer_id` from 138 to 143 (`BETWEEN 138 AND 143`), show `customer_id`,
          `first_name` and `revenue`: the delivered revenue of each customer (rounded to 2 decimals), or
          **0** for customers who have no delivered orders. Every one of the six customers must appear.
          Sort by `customer_id`.
        starter: |
          SELECT c.customer_id,
                 c.first_name,
                 COALESCE(ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2), 0) AS revenue
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND ___
          LEFT JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id BETWEEN 138 AND 143
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id,
                 c.first_name,
                 COALESCE(ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2), 0) AS revenue
          FROM customers AS c
          LEFT JOIN orders AS o
              ON o.customer_id = c.customer_id
             AND o.status = 'delivered'
          LEFT JOIN order_items AS oi
              ON oi.order_id = o.order_id
          WHERE c.customer_id BETWEEN 138 AND 143
          GROUP BY c.customer_id, c.first_name
          ORDER BY c.customer_id;
        columnNames: true
        ordered: true
        hints:
          - "Remember the trap from the LEFT JOIN lesson: a WHERE on the right table's column undoes the LEFT JOIN."
          - "Put the status filter inside the ON of the orders join."
          - "ON o.customer_id = c.customer_id AND o.status = 'delivered'"
        explanation: |
          Customers 141, 142 and 143 never ordered and show 0. If the status test were in the `WHERE`, they
          would disappear. This exercise ties together the LEFT JOIN chain, the filter-in-ON rule,
          aggregation and `COALESCE`.
        difficulty: 3

      - type: read
        title: Always reconcile your total
        md: |
          Before you send a number to anyone, check it against a **simple** query that can't fan out. A
          good report on delivered revenue should match the one-table-plus-one-filter total below.

      - type: example
        title: The yardstick total
        md: |
          Delivered revenue, using only `order_items` and the status from `orders`.
        sql: |
          SELECT ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS total_revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          WHERE o.status = 'delivered';
        after: |
          **$229,443.50**. The three segments from exercise 1 add up to exactly this, so we trust that
          report. When you build a category or customer report, add up its rows and compare. If your
          report's total is bigger, hunt for a fan-out. If it is smaller, hunt for an INNER JOIN that
          dropped rows.

      - type: exercise
        id: m06-l09-e6
        title: Category report with reach
        prompt: |
          For delivered orders only, build a category report with these columns: `category` (the category
          name), `customers` (how many different customers bought from it), `orders` (how many different
          orders contain it) and `revenue` (rounded to 2 decimals). Sort by `revenue`, highest first.
        starter: |
          SELECT cat.name AS category,
                 COUNT(DISTINCT ___) AS customers,
                 COUNT(DISTINCT ___) AS orders,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS cat
              ON cat.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY cat.category_id, cat.name
          ORDER BY revenue DESC;
        solution: |
          SELECT cat.name AS category,
                 COUNT(DISTINCT o.customer_id) AS customers,
                 COUNT(DISTINCT o.order_id) AS orders,
                 ROUND(SUM(oi.quantity * oi.unit_price
                           * (1 - oi.discount)), 2) AS revenue
          FROM order_items AS oi
          JOIN orders AS o
              ON o.order_id = oi.order_id
          JOIN products AS p
              ON p.product_id = oi.product_id
          JOIN categories AS cat
              ON cat.category_id = p.category_id
          WHERE o.status = 'delivered'
          GROUP BY cat.category_id, cat.name
          ORDER BY revenue DESC;
        columnNames: true
        ordered: true
        hints:
          - "In this join, one customer or one order can appear on many rows of the same category. Which aggregate removes repeats?"
          - "COUNT(DISTINCT o.customer_id) and COUNT(DISTINCT o.order_id)."
          - "The SUM for revenue needs no DISTINCT: every order line is a different row, and each is added once."
        explanation: |
          Phones: 98 customers, 200 orders, $60,548.25. Books has the most customers (104) and orders (269) but
          earns only $11,831.22, a very different picture from phones. `DISTINCT` fixed the counts; the
          `SUM` stayed honest because it adds a column that belongs to the finest-grained table.
        difficulty: 3

    cheatsheet:
      - title: Join, then group
        sql: |
          SELECT c.segment,
                 SUM(oi.quantity * oi.unit_price) AS gross
          FROM customers AS c
          JOIN orders AS o ON o.customer_id = c.customer_id
          JOIN order_items AS oi ON oi.order_id = o.order_id
          GROUP BY c.segment;
        note: The JOIN brings the columns together; GROUP BY then collapses the rows into one per group.
      - title: Count the coarse table with DISTINCT
        sql: |
          SELECT c.customer_id,
                 COUNT(DISTINCT o.order_id) AS orders
          FROM customers AS c
          JOIN orders AS o ON o.customer_id = c.customer_id
          JOIN order_items AS oi ON oi.order_id = o.order_id
          GROUP BY c.customer_id;
        note: After joining a finer table, COUNT(*) counts lines. COUNT(DISTINCT id) counts the real orders.
      - title: Avoid the fan-out
        sql: |
          -- Don't JOIN payments AND order_items to the same orders
          -- and then SUM(payments.amount): every payment is copied
          -- once per order line. Sum each branch separately.
          SELECT SUM(amount) FROM payments;
        note: Join only the tables the question needs, and reconcile your total with a simple one-table query. SUM(DISTINCT) is not a fix.

testPool:
  # ---------------------------------------------------------------- l01 Why many tables?
  - type: quiz
    id: m06-t01
    lesson: m06-l01
    difficulty: 1
    question: |
      The `reviews` table has the columns `review_id`, `product_id`, `customer_id` and `rating`.
      Which of them are **foreign keys**? (Pick all that apply.)
    options: [review_id, product_id, customer_id, rating]
    answer: [1, 2]
    explanation: |
      `product_id` points to a row in `products` and `customer_id` points to a row in `customers`, so both
      are foreign keys. `review_id` is the primary key (it identifies the review itself), and `rating` is
      just a number from 1 to 5 that doesn't point anywhere.

  - type: exercise
    id: m06-t02
    lesson: m06-l01
    difficulty: 1
    prompt: |
      Order 80 was paid in two separate payments. Show the `payment_id`, `amount` and `method` of every
      payment for `order_id` 80. Sort by `payment_id`.
    starter: |
      SELECT payment_id, ___
      FROM payments
      WHERE ___
      ORDER BY payment_id;
    solution: |
      SELECT payment_id, amount, method
      FROM payments
      WHERE order_id = 80
      ORDER BY payment_id;
    ordered: true
    hints:
      - The payments are in the `payments` table. Which column tells you which order a payment belongs to?
      - "`order_id` in `payments` is a foreign key, so filter on it with WHERE."
      - "SELECT payment_id, amount, method FROM payments WHERE order_id = ___ ORDER BY payment_id;"
    explanation: |
      Two rows: payment 70 ($100.00 by gift card) and payment 71 ($132.96 by PayPal). The same `order_id` appears
      on both rows because `payments.order_id` is a foreign key: one order, many payments (one-to-many).

  - type: predict
    id: m06-t03
    lesson: m06-l01
    difficulty: 2
    question: |
      The `payments` table has 778 rows, and `order_id` in `payments` is a foreign key. What will this
      query show?
    sql: |
      SELECT COUNT(*) AS payments,
             COUNT(DISTINCT order_id) AS orders_paid
      FROM payments;
    options: ["778 and 778", "778 and 758", "758 and 778", "900 and 758"]
    answer: 1
    explanation: |
      There are 778 payment rows but only 758 different order ids: 20 orders were paid in two payments, so
      their `order_id` shows up twice. A primary key could never repeat like that. A foreign key can.

  # ---------------------------------------------------------------- l02 INNER JOIN
  - type: exercise
    id: m06-t04
    lesson: m06-l02
    difficulty: 1
    prompt: |
      Show the `review_id`, `rating` and the product `name` of every review with a rating of 1. Join
      `reviews` with `products`. Sort by `review_id`.
    starter: |
      SELECT review_id, rating, name
      FROM reviews
      JOIN products
          ON ___
      WHERE rating = 1
      ORDER BY review_id;
    solution: |
      SELECT review_id, rating, name
      FROM reviews
      JOIN products
          ON reviews.product_id = products.product_id
      WHERE rating = 1
      ORDER BY review_id;
    ordered: true
    hints:
      - Both tables have a `product_id` column. One is a foreign key, the other a primary key.
      - "ON reviews.product_id = products.product_id"
      - "JOIN products ON reviews.product_id = ___.product_id"
    explanation: |
      Five reviews have a single star: the Sourdough guide twice (reviews 39 and 178), Vitamin C Moisturizer,
      Air Fryer 5L and the Programmable Coffee Maker. The `ON` rule matches each review's foreign key with
      the primary key of the product it is about.

  - type: quiz
    id: m06-t05
    lesson: m06-l02
    difficulty: 1
    question: |
      You want to show each order line from `order_items` together with its product's name. Which `ON` rule
      connects the two tables correctly?
    options:
      - order_items.product_id = products.product_id
      - order_items.order_id = products.product_id
      - order_items.order_item_id = products.product_id
      - order_items.quantity = products.price
    answer: 0
    explanation: |
      Join a foreign key to the primary key it points to: `order_items.product_id` points to
      `products.product_id`. The other rules compare unrelated numbers. They would run without an error but
      glue the wrong rows together, which is much worse than an error.

  - type: parsons
    id: m06-t06
    lesson: m06-l02
    difficulty: 2
    prompt: |
      Put the lines in order to show the `payment_id`, `amount` and order `status` of every payment made
      with a gift card, sorted by `payment_id`. Two lines are decoys. Leave them out.
    lines:
      - SELECT payment_id, amount, status
      - FROM payments
      - JOIN orders
      - "    ON payments.order_id = orders.order_id"
      - WHERE method = 'gift_card'
      - ORDER BY payment_id;
    distractors:
      - "    ON payments.order_id = orders.customer_id"
      - WHERE orders.method = 'gift_card'
    explanation: |
      `JOIN ... ON` comes right after `FROM`, then `WHERE`, then `ORDER BY`. The first decoy joins a payment's
      order number to a customer number (wrong columns, wrong rows). The second would fail: `method` is a
      column of `payments`, not of `orders`.

  # ---------------------------------------------------------------- l03 Table aliases
  - type: fill
    id: m06-t07
    lesson: m06-l03
    difficulty: 1
    prompt: |
      Give the tables the aliases `r` (for `reviews`) and `p` (for `products`), then finish the join rule.
    template: |
      SELECT r.review_id, p.name, r.rating
      FROM reviews AS ___
      JOIN products AS ___
          ON r.product_id = ___.product_id
      WHERE r.rating = 1;
    answers:
      - ["r"]
      - ["p"]
      - ["p"]
    explanation: |
      `AS r` and `AS p` create the short names. Once they exist, every column is written with its alias:
      `r.product_id` comes from `reviews` and `p.product_id` from `products`.

  - type: exercise
    id: m06-t08
    lesson: m06-l03
    difficulty: 2
    prompt: |
      Using the aliases `py` for `payments` and `o` for `orders`, show `payment_id`, `order_id`, `amount`,
      `order_date` and `status` for every `bank_transfer` payment (column `method`) on an order placed on or
      after `'2024-12-01'`. Take `order_id` from `payments`. Sort by `payment_id`.

      The starter fails: read the error message first.
    starter: |
      SELECT py.payment_id,
             order_id,
