    sql: |
      SELECT SUM(py.amount) AS paid
      FROM orders AS o
      JOIN payments AS py
          ON py.order_id = o.order_id
      JOIN order_items AS oi
          ON oi.order_id = o.order_id
      WHERE o.order_id = 16;
    options: ["452.98", "905.96", "1358.94", "130.00"]
    answer: 1
    explanation: |
      After the joins there are 2 payments x 2 order lines = 4 rows, and each payment appears twice. The sum is
      2 x 452.98 = **905.96**: exactly double what the customer paid. Dropping the join to `order_items` brings
      back the honest 452.98.

  - type: quiz
    id: m06-t30
    lesson: m06-l09
    difficulty: 2
    question: |
      A colleague's report says the shop's delivered revenue is **$412,000**. You run a simple check on
      `order_items` and `orders` alone and get **$229,443.50**. What is the most likely cause?
    options:
      - "An extra join to a table with several rows per order repeated the order lines (fan-out)."
      - "An INNER JOIN dropped some of the rows."
      - "The report forgot ORDER BY."
      - "The report used GROUP BY instead of HAVING."
    answer: 0
    explanation: |
      A total that is **too big** points to fan-out: some row was repeated by a join, for example by also joining
      `payments` to the same orders. A total that is **too small** would point to the opposite problem, an
      `INNER JOIN` that lost rows. `ORDER BY` only changes the order and can't change a sum.

project:
  id: m06-proj
  title: ShopSmart Customer 360
  icon: "👥"
  dataset: shop
  md: |
    It's the first week of January 2025. Mia, the ShopSmart manager, has just hired a customer-success team
    and has one big wish.

    *"I want a **Customer 360**: one place that shows who our customers are, what they buy, what they pay and
    who is quietly drifting away. Every list must show real names, not id numbers. You know JOINs now, so I'm
    counting on you."*

    The dashboard has three sections, and each task is one query that feeds it:

    - **Section 1, the orders desk** (tasks 1 and 2): who ordered, and what is in the parcel.
    - **Section 2, money matters** (tasks 3 and 4): the best customers, and orders nobody paid for.
    - **Section 3, customer health** (tasks 5 to 8): silent customers, happiness, segments and customers who
      went quiet.

    **Ground rules**

    - The data runs up to `2024-12-31`. Use the fixed dates given in each task.
    - There is no "order total" column. A line is worth `quantity * unit_price * (1 - discount)`, and
      revenue means the sum of those lines.
    - Revenue figures count **delivered** orders only, unless the task says otherwise.

    > [!TIP]
    > Plan the route before you write: which tables hold the columns you need, and which keys connect them?
    > After each join, look at the row count. If it is bigger than you expected, a fan-out may be hiding.

    Skills you will use: `INNER JOIN`, `LEFT JOIN` anti-joins, joins across 3 or more tables, `GROUP BY`,
    `HAVING` and `COUNT(DISTINCT ...)`. Let's build the Customer 360!
  tasks:
    - type: exercise
      id: m06-proj-1
      title: "Section 1: the newest orders"
      prompt: |
        The support team starts every morning with the latest orders. Show `order_id`, `order_date`, `status`,
        the customer's `first_name` and `last_name`, and their `city` for every order placed on or after
        `'2024-12-29'`.

        Newest first (`order_date` descending); if two orders share a date, the higher `order_id` comes first.
      starter: |
        SELECT o.order_id,
               o.order_date,
               o.status,
               c.first_name,
               c.last_name,
               c.city
        FROM orders AS o
        JOIN customers AS c
            ON ___
        WHERE ___
        ORDER BY ___;
      solution: |
        SELECT o.order_id,
               o.order_date,
               o.status,
               c.first_name,
               c.last_name,
               c.city
        FROM orders AS o
        JOIN customers AS c
            ON o.customer_id = c.customer_id
        WHERE o.order_date >= '2024-12-29'
        ORDER BY o.order_date DESC, o.order_id DESC;
      ordered: true
      hints:
        - "Two tables: `orders` holds the order, `customers` holds the name and city. The foreign key is `customer_id`."
        - "ON o.customer_id = c.customer_id, then a WHERE on the order date and an ORDER BY with two sort keys."
        - "WHERE o.order_date >= '2024-12-29' ORDER BY o.order_date DESC, o.order_id ___"
      explanation: |
        Seven orders, from order 900 (Henry Thompson from Chicago, placed on the last day of the year and already
        shipped) down to order 894. The `ON` rule links each order to its customer through the foreign key, and the second sort key
        makes the order unambiguous when several orders share a date.
      difficulty: 1

    - type: exercise
      id: m06-proj-2
      title: "Section 1: what is in the parcel?"
      prompt: |
        Henry Thompson (order 900) emails to ask what exactly is in his parcel. Show the lines of
        **order 900** with these columns:

        - `product`: the product's name
        - `category`: the name of the product's category
        - `quantity`
        - `line_total`: `quantity * unit_price * (1 - discount)`, rounded to 2 decimals

        Most valuable line first.
      starter: |
        SELECT p.name AS product,
               cat.name AS category,
               oi.quantity,
               ROUND(oi.quantity * oi.unit_price
                     * (1 - oi.discount), 2) AS line_total
        FROM order_items AS oi
        JOIN products AS p
            ON ___
        JOIN categories AS cat
            ON ___
        WHERE oi.order_id = 900
        ORDER BY line_total DESC;
      solution: |
        SELECT p.name AS product,
               cat.name AS category,
               oi.quantity,
               ROUND(oi.quantity * oi.unit_price
                     * (1 - oi.discount), 2) AS line_total
        FROM order_items AS oi
        JOIN products AS p
            ON p.product_id = oi.product_id
        JOIN categories AS cat
            ON cat.category_id = p.category_id
        WHERE oi.order_id = 900
        ORDER BY line_total DESC;
      columnNames: true
      ordered: true
      hints:
        - "The order lines live in `order_items`. The product name is in `products`, and the category name is one step further, in `categories`."
        - "Join products on product_id, then categories on the category_id that `products` holds."
        - "JOIN categories AS cat ON cat.category_id = ___.category_id"
      explanation: |
        Four lines: a 10-inch Tablet Lite ($229.99), a Floor Lamp ($69.99), a Webcam ($49.99) and a Water Bottle
        ($24.99). The category lives two steps away from the order line (line, then product, then category), so
        `categories` can only be joined after `products`.
      difficulty: 2

    - type: exercise
      id: m06-proj-3
      title: "Section 2: our best customers"
      prompt: |
        Mia wants to thank the five customers who brought in the most money. Using **delivered** orders only,
        show `customer_id`, `first_name`, `last_name`, `orders` (how many different delivered orders) and
        `revenue` (rounded to 2 decimals). Show the top 5 by revenue, highest first.
      starter: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               COUNT(DISTINCT ___) AS orders,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        JOIN orders AS o
            ON o.customer_id = c.customer_id
        JOIN order_items AS oi
            ON ___
        WHERE ___
        GROUP BY ___
        ORDER BY revenue DESC
        LIMIT 5;
      solution: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               COUNT(DISTINCT o.order_id) AS orders,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        JOIN orders AS o
            ON o.customer_id = c.customer_id
        JOIN order_items AS oi
            ON oi.order_id = o.order_id
        WHERE o.status = 'delivered'
        GROUP BY c.customer_id, c.first_name, c.last_name
        ORDER BY revenue DESC
        LIMIT 5;
      columnNames: true
      ordered: true
      hints:
        - "Route: customers, orders, order_items. Join first, then group by customer."
        - "Revenue sums the order lines. The order count must ignore the repeats caused by joining to `order_items`: use COUNT(DISTINCT o.order_id)."
        - "WHERE o.status = 'delivered' GROUP BY c.customer_id, c.first_name, c.last_name"
      explanation: |
        Noor Haddad leads with $8,458.40 from 18 orders, followed by Seun Kamau ($7,227.87), Ingrid Cooper
        ($6,832.25), Isabella Cooper ($6,268.44) and Ella Cooper ($6,037.70). Three of the five share the last name
        Cooper, so grouping by `last_name` alone would have merged them: group by `customer_id` (plus the name
        columns you show). `COUNT(DISTINCT o.order_id)` counts orders, where `COUNT(*)` would have counted
        order lines.
      difficulty: 2

    - type: exercise
      id: m06-proj-4
      title: "Section 2: delivered but never paid"
      prompt: |
        Finance has noticed that some **delivered** orders have no payment at all. Show `order_id`,
        `order_date` and the customer's `first_name`, `last_name` and `email` for every delivered order that has
        **no row in `payments`**. Sort by `order_id`.
      starter: |
        SELECT o.order_id,
               o.order_date,
               c.first_name,
               c.last_name,
               c.email
        FROM orders AS o
        JOIN customers AS c
            ON ___
        LEFT JOIN payments AS py
            ON ___
        WHERE ___
        ORDER BY o.order_id;
      solution: |
        SELECT o.order_id,
               o.order_date,
               c.first_name,
               c.last_name,
               c.email
        FROM orders AS o
        JOIN customers AS c
            ON c.customer_id = o.customer_id
        LEFT JOIN payments AS py
            ON py.order_id = o.order_id
        WHERE o.status = 'delivered'
          AND py.payment_id IS NULL
        ORDER BY o.order_id;
      ordered: true
      hints:
        - "Every order has a customer, so an INNER JOIN to `customers` is fine. Payments may be missing, so that join must keep the orders without a match."
        - "LEFT JOIN payments, then keep the rows where a payment column is NULL (an anti-join), and filter on the status."
        - "WHERE o.status = 'delivered' AND py.payment_id IS ___"
      explanation: |
        Six orders: 681, 688, 692, 698, 782 and 797. The customers' emails are ready for the finance team to
        write to. This query mixes both kinds of join: an INNER JOIN where a match always exists, and a LEFT JOIN
        plus `IS NULL` to find the orders where it doesn't.
      difficulty: 2

    - type: exercise
      id: m06-proj-5
      title: "Section 3: the silent corporate customers"
      prompt: |
        The account managers want feedback from the **Corporate** customers (`segment = 'Corporate'`), starting
        with those who have **never written a review**. Show `customer_id`, `first_name`, `last_name` and
        `state`. Sort by `customer_id`.
      starter: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               c.state
        FROM customers AS c
        LEFT JOIN reviews AS r
            ON ___
        WHERE ___
        ORDER BY c.customer_id;
      solution: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               c.state
        FROM customers AS c
        LEFT JOIN reviews AS r
            ON r.customer_id = c.customer_id
        WHERE c.segment = 'Corporate'
          AND r.review_id IS NULL
        ORDER BY c.customer_id;
      ordered: true
      hints:
        - "This is an anti-join, like finding customers without orders, but this time the other table is `reviews`."
        - "LEFT JOIN reviews on customer_id, then look for r.review_id IS NULL. The segment test belongs to the customers, so it can go in WHERE."
        - "WHERE c.segment = 'Corporate' AND r.review_id IS ___"
      explanation: |
        Eleven Corporate customers have never reviewed anything, among them Daniel Morgan (FL) and Diya Rao (CA).
        The segment test is on the **left** table, so putting it in `WHERE` is safe. A test on the right table
        would have undone the LEFT JOIN.
      difficulty: 2

    - type: exercise
      id: m06-proj-6
      title: "Section 3: how happy are our shoppers?"
      prompt: |
        Show how customers rate each product category. For every category with **at least 25 reviews**, show
        `category` (the name), `reviews` (how many reviews its products received) and `avg_rating` (the average
        rating, rounded to 2 decimals). Sort by `avg_rating`, highest first, then by `category`.

        Use the category the product itself belongs to (`products.category_id`).
      starter: |
        SELECT cat.name AS category,
               COUNT(*) AS reviews,
               ROUND(AVG(r.rating), 2) AS avg_rating
        FROM reviews AS r
        JOIN products AS p
            ON ___
        JOIN categories AS cat
            ON ___
        GROUP BY ___
        HAVING ___
        ORDER BY avg_rating DESC, category;
      solution: |
        SELECT cat.name AS category,
               COUNT(*) AS reviews,
               ROUND(AVG(r.rating), 2) AS avg_rating
        FROM reviews AS r
        JOIN products AS p
            ON p.product_id = r.product_id
        JOIN categories AS cat
            ON cat.category_id = p.category_id
        GROUP BY cat.category_id, cat.name
        HAVING COUNT(*) >= 25
        ORDER BY avg_rating DESC, category;
      columnNames: true
      ordered: true
      hints:
        - "Route: reviews, then products (to find the category), then categories (to get its name)."
        - "Group by the category, count the reviews and average the ratings. A condition on a group goes in HAVING."
        - "GROUP BY cat.category_id, cat.name HAVING COUNT(*) >= ___"
      explanation: |
        Five categories qualify: Toys (4.33, 27 reviews), Phones (4.27, 44), Kitchen (4.12, 57), Peripherals
        (3.85, 39) and Books (3.82, 61). Books gets the most reviews but the lowest average, a nice example of
        why a count and an average tell different stories. `COUNT(*)` is safe here: every joined row is exactly
        one review.
      difficulty: 2

    - type: exercise
      id: m06-proj-7
      title: "Section 3: the segment scoreboard"
      prompt: |
        Build a scoreboard for the three customer `segment`s, counting **delivered** orders only. Show:

        - `segment`
        - `customers`: how many customers the segment has in total (even those without delivered orders)
        - `buyers`: how many of them have at least one delivered order
        - `orders`: how many different delivered orders
        - `revenue`: the delivered revenue, rounded to 2 decimals

        Highest revenue first.
      starter: |
        SELECT c.segment,
               COUNT(DISTINCT c.customer_id) AS customers,
               COUNT(DISTINCT o.customer_id) AS buyers,
               COUNT(DISTINCT ___) AS orders,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        LEFT JOIN orders AS o
            ON o.customer_id = c.customer_id
           AND ___
        LEFT JOIN order_items AS oi
            ON oi.order_id = o.order_id
        GROUP BY c.segment
        ORDER BY revenue DESC;
      solution: |
        SELECT c.segment,
               COUNT(DISTINCT c.customer_id) AS customers,
               COUNT(DISTINCT o.customer_id) AS buyers,
               COUNT(DISTINCT o.order_id) AS orders,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        LEFT JOIN orders AS o
            ON o.customer_id = c.customer_id
           AND o.status = 'delivered'
        LEFT JOIN order_items AS oi
            ON oi.order_id = o.order_id
        GROUP BY c.segment
        ORDER BY revenue DESC;
      columnNames: true
      ordered: true
      hints:
        - "Every customer must be counted, so start from `customers` with LEFT JOINs. Where should the 'delivered' test go so no customer disappears?"
        - "Put the status test inside the ON of the orders join. After the joins each customer and order is repeated, so count the ids with COUNT(DISTINCT ...)."
        - "COUNT(DISTINCT o.order_id) AS orders ... AND o.status = 'delivered'"
      explanation: |
        Consumer: 89 customers, 80 buyers, 396 orders, $142,528.77. Home Office: 28, 25, 133, $46,572.96. Corporate:
        33, 32, 121, $40,341.77. The orders add up to 650 and the revenue to $229,443.50, the shop's known
        delivered totals. That is your reconciliation check that nothing fanned out or got lost. Every `COUNT` of
        a customer or order id needs `DISTINCT`, because the joins repeat them once per order line.
      difficulty: 3

    - type: exercise
      id: m06-proj-8
      title: "Section 3: big spenders gone quiet"
      prompt: |
        The final list is the one Mia cares about most: valuable customers who may be drifting away. Find
        customers whose delivered revenue is **at least 1500** and whose most recent delivered order was
        **before `'2024-07-01'`**.

        Show `customer_id`, `first_name`, `last_name`, `last_order` (the date of their latest delivered order)
        and `revenue` (rounded to 2 decimals). Highest revenue first.
      starter: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               MAX(o.order_date) AS last_order,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        JOIN orders AS o
            ON o.customer_id = c.customer_id
        JOIN order_items AS oi
            ON oi.order_id = o.order_id
        WHERE o.status = 'delivered'
        GROUP BY c.customer_id, c.first_name, c.last_name
        HAVING ___
        ORDER BY revenue DESC;
      solution: |
        SELECT c.customer_id,
               c.first_name,
               c.last_name,
               MAX(o.order_date) AS last_order,
               ROUND(SUM(oi.quantity * oi.unit_price
                         * (1 - oi.discount)), 2) AS revenue
        FROM customers AS c
        JOIN orders AS o
            ON o.customer_id = c.customer_id
        JOIN order_items AS oi
            ON oi.order_id = o.order_id
        WHERE o.status = 'delivered'
        GROUP BY c.customer_id, c.first_name, c.last_name
        HAVING SUM(oi.quantity * oi.unit_price
                   * (1 - oi.discount)) >= 1500
           AND MAX(o.order_date) < '2024-07-01'
        ORDER BY revenue DESC;
      columnNames: true
      ordered: true
      hints:
        - "Both conditions are about whole customers (their total and their latest date), so they belong in HAVING, not WHERE."
        - "HAVING can use two aggregates joined with AND: one SUM and one MAX."
        - "HAVING SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) >= 1500 AND MAX(o.order_date) < ___"
      explanation: |
        Four customers: Camila Lopez (last delivered order 2024-05-25, $5,382.70), Pablo Dlamini (2023-12-07,
        $3,423.81), Anya Fischer (2023-09-02, $2,370.92) and Mina Choi (2024-06-02, $1,870.87). These are the
        people to win back first. `MAX(o.order_date)` is safe from fan-out, because repeating a date doesn't
        change the latest one, and the revenue `SUM` comes from the finest-grained table. Congratulations: you
        built a Customer 360 with joins!
      difficulty: 3
