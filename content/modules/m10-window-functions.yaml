  - type: exercise
    id: m10-t25
    lesson: m10-l05
    difficulty: 3
    prompt: |
      Engineering wants to know when its payroll first reached a milestone. Use the current Engineering employees
      (`dept_id` 2), ordered by `hire_date` and then `emp_id`, and build a running payroll with
      `SUM(salary) OVER (ORDER BY hire_date, emp_id)`. Show the first person in that order whose `running_payroll`
      is at least 1000000. Show `first_name`, `hire_date` and `running_payroll`.
    solution: |
      WITH running AS (
          SELECT
              first_name,
              hire_date,
              emp_id,
              SUM(salary) OVER (
                  ORDER BY hire_date, emp_id) AS running_payroll
          FROM employees
          WHERE dept_id = 2
            AND terminated_on IS NULL
      )
      SELECT first_name, hire_date, running_payroll
      FROM running
      WHERE running_payroll >= 1000000
      ORDER BY hire_date, emp_id
      LIMIT 1;
    ordered: true
    columnNames: true
    hints:
      - "A window cannot be used in WHERE, so calculate running_payroll in a CTE first."
      - "Keep the rows where running_payroll is at least 1000000, sort by hire_date and emp_id, then keep one row with LIMIT 1."
      - "WITH running AS (SELECT first_name, hire_date, emp_id, SUM(salary) OVER (ORDER BY hire_date, emp_id) AS running_payroll FROM employees WHERE dept_id = 2 AND terminated_on IS NULL) SELECT first_name, hire_date, running_payroll FROM running WHERE running_payroll >= ___ ORDER BY hire_date, emp_id LIMIT 1;"
    explanation: |
      Engineering's payroll passes one million when Arjun is hired on 2017-05-22, at 1131000.00 in total. Running
      payroll only grows, because salaries are never negative, so the first row over the line is the one you want.
      Adding emp_id to the sort keeps the answer fixed even if two people share a hire date.
  - type: predict
    id: m10-t26
    lesson: m10-l06
    difficulty: 2
    question: How many rows will this query return?
    sql: |
      SELECT first_name
      FROM (
          SELECT first_name,
                 LEAD(salary) OVER (ORDER BY salary) AS next_pay
          FROM employees
          WHERE dept_id = 6
            AND terminated_on IS NULL
      ) AS t
      WHERE next_pay IS NULL;
    options: ["0", "1", "4", "An error"]
    answer: 1
    explanation: |
      LEAD looks one row ahead in ascending salary order. The last row has no next row, so LEAD returns NULL there.
      Only the highest-paid HR employee, Valentina Flores (215000.00), has a NULL next_pay, so 1 row comes back.
  - type: exercise
    id: m10-t27
    lesson: m10-l06
    difficulty: 2
    dataset: shop
    prompt: |
      For the products in category 4 (`category_id` = 4), show `name`, `price` and `price_step`: how much more the
      product costs than the next-cheaper product in the same category. The cheapest product gets NULL. Sort by
      `price`, then by `product_id`.
    solution: |
      SELECT
          name,
          price,
          price - LAG(price) OVER (
              ORDER BY price, product_id) AS price_step
      FROM products
      WHERE category_id = 4
      ORDER BY price, product_id;
    ordered: true
    columnNames: true
    hints:
      - "LAG(price) returns the price of the row just above in the sort order, which is the next cheaper product."
      - "Sort the window by price, then product_id, exactly as the final ORDER BY does, so each row looks at the right neighbour."
      - "SELECT name, price, price - LAG(___) OVER (ORDER BY price, product_id) AS price_step FROM products WHERE category_id = 4 ORDER BY price, product_id;"
    explanation: |
      The Midnight Gardener (14.99) is the cheapest, so its price_step is NULL. Mindful Mornings Journal is 2.00 more
      than it, and from Quick & Easy Weeknight Dinners (24.99) upward each product is exactly 5.00 more than the one before.
  - type: quiz
    id: m10-t28
    lesson: m10-l06
    difficulty: 3
    question: For each order, you want the number of days until the same customer's **next** order. Which expression does that?
    options: ["LEAD(order_date) OVER (PARTITION BY customer_id ORDER BY order_date) - order_date", "LEAD(order_date) OVER (ORDER BY order_date) - order_date", "order_date - LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date)", "LEAD(order_date, 2) OVER (PARTITION BY customer_id ORDER BY order_date) - order_date"]
    answer: 0
    explanation: "PARTITION BY customer_id keeps each customer's orders apart, and LEAD looks one row ahead in date order. Subtracting one date from another gives a number of days. Option 2 mixes all customers together, option 3 looks backwards, and option 4 skips an order."
  - type: exercise
    id: m10-t29
    lesson: m10-l06
    difficulty: 3
    prompt: |
      For each employee, find the **largest single raise** they have ever received. A raise is a salary row minus the
      row before it for the same employee. Show only employees whose biggest raise is at least 20000.00. Show `emp_id`
      and `biggest_raise`, sorted by `biggest_raise` from highest to lowest, then by `emp_id`.
    solution: |
      WITH changes AS (
          SELECT
              emp_id,
              salary - LAG(salary) OVER (
                  PARTITION BY emp_id
                  ORDER BY effective_date
              ) AS raise
          FROM salary_history
      )
      SELECT emp_id, MAX(raise) AS biggest_raise
      FROM changes
      GROUP BY emp_id
      HAVING MAX(raise) >= 20000
      ORDER BY biggest_raise DESC, emp_id;
    ordered: true
    columnNames: true
    hints:
      - "First use LAG to put each salary next to the previous salary of the same employee, then subtract."
      - "MAX(raise) gives the biggest raise for each employee. The first salary row has no previous row, so its raise is NULL and MAX ignores it."
      - "WITH changes AS (SELECT emp_id, salary - LAG(salary) OVER (PARTITION BY ___ ORDER BY effective_date) AS raise FROM salary_history) SELECT emp_id, MAX(raise) AS biggest_raise FROM changes GROUP BY emp_id HAVING MAX(raise) >= 20000 ORDER BY biggest_raise DESC, emp_id;"
    explanation: |
      Six employees qualify. Employee 3 had the biggest single raise, 29500.00. Employees 2 and 13 both received
      21500.00, so emp_id decides their order. Anyone whose biggest raise is under 20000.00 is not listed. Note that
      PARTITION BY emp_id keeps each person's raises separate from everyone else's.
  - type: parsons
    id: m10-t30
    lesson: m10-l06
    difficulty: 3
    prompt: |
      Arrange the lines to show every salary row of employee 8 (`emp_id` = 8): the `effective_date`, the `salary`, and
      the `raise` compared with the row before it. Sort by `effective_date`.
    lines:
      - "SELECT effective_date, salary,"
      - "    salary - LAG(salary) OVER (ORDER BY effective_date) AS raise"
      - "FROM salary_history"
      - "WHERE emp_id = 8"
      - "ORDER BY effective_date;"
    distractors:
      - "GROUP BY emp_id"
    explanation: |
      The first row shows NULL for raise, because there is no earlier salary to compare with. Employee 8's biggest single
      raise is 15500.00, which is the 2016 change. GROUP BY would merge the rows, so it does not belong here.
project:
  id: m10-proj
  title: Salary & Sales Insights
  icon: "📊"
  dataset: company
  md: |
    It is the week before the Acme Corp board meeting. **Sofia** from HR has asked you to prepare the
    "Salary & Sales Insights" pack. She needs seven answers, and each one uses the window functions you learned
    in this module:

    1. What does Finance earn, next to the Finance average?
    2. Who in Sales is above the Sales team average?
    3. Who is the most senior person in Engineering?
    4. Who are the top three earners in each department?
    5. How has hiring grown, year by year?
    6. Which Sales people received the big raises?
    7. What does the one-page board summary look like?

    Run each query and compare your row count with the explanation. A window function keeps every row, so if
    a "one row per person" query (tasks 1 to 3) returns fewer rows than you expect, look for a missing `WHERE`
    or a `GROUP BY` that does not belong. Tasks 4 to 7 filter or summarise on purpose.

    > [!TIP]
    > A window function cannot go in `WHERE`. When you need to filter on its result, calculate it in a CTE
    > (`WITH ... AS (...)`) and filter in the outer query.
  tasks:
    - type: exercise
      id: m10-proj-1
      title: Finance pay next to the average
      difficulty: 1
      prompt: |
        Sofia starts with Finance. Show each **current** Finance employee's `first_name`, `last_name`, `salary` and
        `finance_avg`: the average Finance salary, rounded to 2 decimals and repeated on every row. Sort by `salary`
        from highest to lowest.
      solution: |
        SELECT
            first_name,
            last_name,
            salary,
            ROUND(AVG(salary) OVER (), 2) AS finance_avg
        FROM employees
        WHERE dept_id = 5
          AND terminated_on IS NULL
        ORDER BY salary DESC;
      ordered: true
      columnNames: true
      hints:
        - "The average is a window function. Use AVG(salary) with OVER () so that every row keeps its own line."
        - "The window only sees the rows left after WHERE, so filter to Finance and current staff first."
        - "SELECT first_name, last_name, salary, ROUND(AVG(salary) OVER (), 2) AS finance_avg FROM employees WHERE dept_id = 5 AND terminated_on IS NULL ORDER BY salary DESC;"
      explanation: |
        The five current Finance people average 128000.00, so finance_avg is 128000.00 on each row. Yusuf (240000.00) is
        at the top and Lily (78000.00) at the bottom. You still get five rows, because a window never squashes them.
    - type: exercise
      id: m10-proj-2
      title: Above or below the Sales team average
      difficulty: 2
      prompt: |
        For each **current** Sales employee (`dept_id` 3), show `first_name`, `salary`, `team_avg` (the Sales average
        salary, rounded to 2 decimals) and `position`. The position is `above` when the salary is higher than
        `team_avg`, and `at or below` otherwise. Sort by `salary` from highest to lowest, then by `first_name`.
      solution: |
        SELECT
            first_name,
            salary,
            ROUND(AVG(salary) OVER (
                PARTITION BY dept_id), 2) AS team_avg,
            CASE
                WHEN salary > AVG(salary) OVER (
                    PARTITION BY dept_id)
                    THEN 'above'
                ELSE 'at or below'
            END AS position
        FROM employees
        WHERE dept_id = 3
          AND terminated_on IS NULL
        ORDER BY salary DESC, first_name;
      ordered: true
      columnNames: true
      hints:
        - "Use AVG(salary) OVER (PARTITION BY dept_id). The PARTITION BY keeps the Sales average separate from other departments."
        - "A window function can be used inside a CASE expression, so you can compare each salary with the average in the same row."
        - "SELECT first_name, salary, ROUND(AVG(salary) OVER (PARTITION BY ___), 2) AS team_avg, CASE WHEN salary > AVG(salary) OVER (PARTITION BY ___) THEN 'above' ELSE 'at or below' END AS position FROM employees WHERE dept_id = 3 AND terminated_on IS NULL ORDER BY salary DESC, first_name;"
      explanation: |
        The Sales average is 125272.73. Amina (245000.00), James and Oscar (185000.00 each) are above it. The other
        eight people are at or below it. Sorting by first_name as well makes the two 185000.00 rows come out in a fixed order.
    - type: exercise
      id: m10-proj-3
      title: Seniority in Engineering
      difficulty: 2
      prompt: |
        Number the **current** Engineering employees (`dept_id` 2) by seniority: the earliest `hire_date` gets
        number 1. If two people were hired on the same day, the smaller `emp_id` gets the lower number. Show
        `first_name`, `last_name`, `hire_date` and `seniority`, sorted by `seniority`.
      solution: |
        SELECT
            first_name,
            last_name,
            hire_date,
            ROW_NUMBER() OVER (
                ORDER BY hire_date, emp_id) AS seniority
        FROM employees
        WHERE dept_id = 2
          AND terminated_on IS NULL
        ORDER BY seniority;
      ordered: true
      columnNames: true
      hints:
        - "ROW_NUMBER() numbers the rows 1, 2, 3 and so on, in the order given by its ORDER BY."
        - "Sort by hire_date first, then by emp_id so that the order is always the same."
        - "SELECT first_name, last_name, hire_date, ROW_NUMBER() OVER (ORDER BY hire_date, ___) AS seniority FROM employees WHERE dept_id = 2 AND terminated_on IS NULL ORDER BY seniority;"
      explanation: |
        There are 18 current Engineering people, so the numbers run from 1 to 18 with no gaps. Pierre Popov (hired
        2022-07-11) is number 17, and Paola Reyes (hired 2022-09-12) is number 18. Use ROW_NUMBER when you need a
        unique number for every row, even when dates are the same.
    - type: exercise
      id: m10-proj-4
      title: The top three earners in each department
      difficulty: 2
      prompt: |
        For each department with current employees, show the three best-paid current people. Rank them with
        `ROW_NUMBER()` by `salary` from highest to lowest, and break salary ties with the smaller `emp_id`. Show
        `dept_id`, `first_name`, `salary` and `pay_rank`, and keep only ranks 1 to 3. Sort by `dept_id`, then by `pay_rank`.
      solution: |
        WITH ranked AS (
            SELECT
                dept_id,
                first_name,
                salary,
                ROW_NUMBER() OVER (
                    PARTITION BY dept_id
                    ORDER BY salary DESC, emp_id
                ) AS pay_rank
            FROM employees
            WHERE dept_id IS NOT NULL
              AND terminated_on IS NULL
        )
        SELECT dept_id, first_name, salary, pay_rank
        FROM ranked
        WHERE pay_rank <= 3
        ORDER BY dept_id, pay_rank;
      ordered: true
      columnNames: true
      hints:
        - "Rank inside each department with ROW_NUMBER() and PARTITION BY dept_id, then keep only the top three."
        - "You cannot filter on pay_rank in the same SELECT, so wrap the ranking in a CTE first."
        - "WITH ranked AS (SELECT dept_id, first_name, salary, ROW_NUMBER() OVER (PARTITION BY ___ ORDER BY salary DESC, emp_id) AS pay_rank FROM employees WHERE dept_id IS NOT NULL AND terminated_on IS NULL) SELECT dept_id, first_name, salary, pay_rank FROM ranked WHERE pay_rank <= 3 ORDER BY dept_id, pay_rank;"
      explanation: |
        Seventeen rows come back. Executive has only two current people, so it has two rows, and the other five
        departments have three each. In Sales, James and Oscar both earn 185000.00. The smaller emp_id takes rank 2
        and the other takes rank 3, and both still make the top three.
    - type: exercise
      id: m10-proj-5
      title: Hiring, year by year
      difficulty: 2
      prompt: |
        Using all employees in the company (including people who have left), count how many were hired in each year.
        Show `hire_year`, `hires` (the count for that year) and `hires_so_far` (a running total from the first year to
        that year). Sort by `hire_year`.
      solution: |
        WITH yearly AS (
            SELECT
                EXTRACT(YEAR FROM hire_date)::int AS hire_year,
                COUNT(*) AS hires
            FROM employees
            GROUP BY hire_year
        )
        SELECT
            hire_year,
            hires,
            SUM(hires) OVER (ORDER BY hire_year) AS hires_so_far
        FROM yearly
        ORDER BY hire_year;
      ordered: true
      columnNames: true
      hints:
        - "Count the hires for each year first, with GROUP BY on the year. Then add a running total over those counts."
        - "SUM(hires) OVER (ORDER BY hire_year) adds each year's count to all the years before it."
        - "WITH yearly AS (SELECT EXTRACT(YEAR FROM hire_date)::int AS hire_year, COUNT(*) AS hires FROM employees GROUP BY hire_year) SELECT hire_year, hires, SUM(___) OVER (ORDER BY hire_year) AS hires_so_far FROM yearly ORDER BY hire_year;"
      explanation: |
        There are 13 hiring years, from 2012 to 2024. The running total ends at 55, which is every employee in the table.
        The biggest single year is 2019, with 7 hires. Notice that the running total is built on the yearly totals,
        not on the individual rows.
    - type: exercise
      id: m10-proj-6
      title: The big raises in Sales
      difficulty: 3
      prompt: |
        For each **current** Sales employee, find every raise of at least 12% compared with their previous salary row.
        The raise percentage is `(salary - previous salary) / previous salary * 100`, rounded to 1 decimal place, and
        shown as `raise_pct`. Show `first_name`, `effective_date` and `raise_pct`, sorted by `effective_date`, then by
        `first_name`.
      solution: |
        WITH changes AS (
            SELECT
                e.first_name,
                s.effective_date,
                s.salary,
                LAG(s.salary) OVER (
                    PARTITION BY s.emp_id
                    ORDER BY s.effective_date
                ) AS prev_salary
            FROM salary_history AS s
            JOIN employees AS e
                ON e.emp_id = s.emp_id
            WHERE e.dept_id = 3
              AND e.terminated_on IS NULL
        )
        SELECT
            first_name,
            effective_date,
            ROUND(100.0 * (salary - prev_salary)
                  / prev_salary, 1) AS raise_pct
        FROM changes
        WHERE prev_salary IS NOT NULL
          AND 100.0 * (salary - prev_salary) / prev_salary >= 12
        ORDER BY effective_date, first_name;
      ordered: true
      columnNames: true
      hints:
        - "LAG(salary) OVER (PARTITION BY emp_id ORDER BY effective_date) gives the previous salary of the same person."
        - "Compute the change in a CTE, then filter on the percentage in the outer query. The first row for each person has no previous salary."
        - "WITH changes AS (SELECT e.first_name, s.effective_date, s.salary, LAG(s.salary) OVER (PARTITION BY s.emp_id ORDER BY s.effective_date) AS prev_salary FROM salary_history AS s JOIN employees AS e ON e.emp_id = s.emp_id WHERE e.dept_id = 3 AND e.terminated_on IS NULL) SELECT first_name, effective_date, ROUND(100.0 * (salary - prev_salary) / prev_salary, 1) AS raise_pct FROM changes WHERE prev_salary IS NOT NULL AND 100.0 * (salary - prev_salary) / prev_salary >= 12 ORDER BY effective_date, first_name;"
      explanation: |
        Three raises are at least 12%. James gained 16.5% on 2018-07-12, and Arthur (14.8%) and Hana (14.9%) both
        received raises on 2019-04-01. Those two share a date, so first_name decides their order. The filter on
        raise_pct works here only because it sits in the outer query, after the window has been calculated.
    - type: exercise
      id: m10-proj-7
      title: The one-page board summary
      difficulty: 3
      prompt: |
        Build the board summary: one row per department with **current** staff (people with no department are
        left out). Show `dept_name`, `headcount` (the number of current people), `avg_salary` (rounded to 0
        decimals), `top_earner` (the first name of the best-paid person, with ties broken by the smaller
        `emp_id`) and `payroll_share` (the department's current payroll as a percentage of the combined current
        payroll of all these departments, rounded to 1 decimal). Sort by `payroll_share` from highest to lowest,
        then by `dept_name`.
      solution: |
        WITH by_dept AS (
            SELECT
                d.name AS dept_name,
                COUNT(*) AS headcount,
                ROUND(AVG(e.salary), 0) AS avg_salary,
                SUM(e.salary) AS payroll
            FROM employees AS e
            JOIN departments AS d
                ON d.dept_id = e.dept_id
            WHERE e.terminated_on IS NULL
            GROUP BY d.name
        ),
        top_paid AS (
            SELECT
                d.name AS dept_name,
                e.first_name AS top_earner,
                ROW_NUMBER() OVER (
                    PARTITION BY d.name
                    ORDER BY e.salary DESC, e.emp_id
                ) AS rn
            FROM employees AS e
            JOIN departments AS d
                ON d.dept_id = e.dept_id
            WHERE e.terminated_on IS NULL
        )
        SELECT
            b.dept_name,
            b.headcount,
            b.avg_salary,
            t.top_earner,
            ROUND(100.0 * b.payroll
                  / SUM(b.payroll) OVER (), 1) AS payroll_share
        FROM by_dept AS b
        JOIN top_paid AS t
            ON t.dept_name = b.dept_name
            AND t.rn = 1
        ORDER BY payroll_share DESC, b.dept_name;
      ordered: true
      columnNames: true
      hints:
        - "Build two CTEs: one with the headcount, average and total payroll per department, and one with the top earner per department (ROW_NUMBER = 1)."
        - "payroll_share divides each department's payroll by the total of all departments. SUM(payroll) OVER () gives that total on every row."
        - "WITH by_dept AS (...), top_paid AS (...) SELECT b.dept_name, b.headcount, b.avg_salary, t.top_earner, ROUND(100.0 * b.payroll / SUM(___) OVER (), 1) AS payroll_share FROM by_dept AS b JOIN top_paid AS t ON t.dept_name = b.dept_name AND t.rn = 1 ORDER BY payroll_share DESC, b.dept_name;"
      explanation: |
        Engineering is the biggest slice of the payroll, at 40.3%, with Thiago as the top earner. Sales is next at
        21.4%, led by Amina. The six shares add up to 100.1 instead of 100 because each one is rounded separately.
        This is the kind of one-page table you can build from a few window functions and a couple of CTEs.
