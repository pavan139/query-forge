      - "WITH ranked AS (SELECT first_name, salary, DENSE_RANK() OVER (ORDER BY ___ DESC) AS salary_level FROM employees WHERE dept_id = 3 AND terminated_on IS NULL) SELECT first_name, salary, salary_level FROM ranked WHERE salary_level <= 3 ORDER BY salary_level, first_name;"
    explanation: |
      Level 1 is Amina (245000.00). Level 2 is James and Oscar (185000.00), and level 3 is Arthur and Mei (118000.00).
