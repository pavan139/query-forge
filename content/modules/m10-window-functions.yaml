  - type: exercise
    id: m10-t19
    lesson: m10-l04
    difficulty: 3
    prompt: |
      For each department with **at least 4** current employees, show the most recently hired current employee.
      Show `dept_id`, `first_name`, `last_name` and `hire_date`, sorted by `dept_id`. If two people share a hire date,
      choose the one with the larger `emp_id`.
    solution: |
      WITH sized AS (
          SELECT
              dept_id,
              first_name,
              last_name,
              hire_date,
              emp_id,
              COUNT(*) OVER (PARTITION BY dept_id) AS dept_size,
              ROW_NUMBER() OVER (
                  PARTITION BY dept_id
                  ORDER BY hire_date DESC, emp_id DESC
              ) AS rn
          FROM employees
          WHERE terminated_on IS NULL
            AND dept_id IS NOT NULL
      )
      SELECT dept_id, first_name, last_name, hire_date
      FROM sized
      WHERE rn = 1
        AND dept_size >= 4
      ORDER BY dept_id;
    ordered: true
    columnNames: true
    hints:
      - "You need two window functions: one counts the department's people, and one numbers them from newest to oldest."
      - "A window cannot be used in WHERE. Calculate both in a CTE, then filter in the outer query."
      - "WITH sized AS (SELECT dept_id, first_name, last_name, hire_date, emp_id, COUNT(*) OVER (PARTITION BY dept_id) AS dept_size, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY hire_date DESC, emp_id DESC) AS rn FROM employees WHERE terminated_on IS NULL AND dept_id IS NOT NULL) SELECT dept_id, first_name, last_name, hire_date FROM sized WHERE rn = ___ AND dept_size >= 4 ORDER BY dept_id;"
    explanation: |
