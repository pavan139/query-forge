  - type: exercise
    id: m10-t05
    lesson: m10-l01
    difficulty: 3
    prompt: |
      For each department that has current employees, show its `name`, its `headcount` (the number of current
      employees in it) and `pct_of_staff`: that headcount as a percentage of **all** current employees who have a
      department, rounded to 1 decimal place. Sort by `name` from A to Z.
    solution: |
      SELECT
          d.name,
          COUNT(*) AS headcount,
          ROUND(100.0 * COUNT(*)
                / SUM(COUNT(*)) OVER (), 1) AS pct_of_staff
      FROM employees AS e
      JOIN departments AS d
          ON d.dept_id = e.dept_id
      WHERE e.terminated_on IS NULL
      GROUP BY d.name
      ORDER BY d.name;
    ordered: true
    columnNames: true
    hints:
      - "First count the current people in each department with GROUP BY. Then add a window over those counts."
      - "SUM(COUNT(*)) OVER () adds up all the group counts, so every department can divide by the same total."
      - "SELECT d.name, COUNT(*) AS headcount, ROUND(100.0 * COUNT(*) / SUM(___) OVER (), 1) AS pct_of_staff FROM employees AS e JOIN departments AS d ON d.dept_id = e.dept_id WHERE e.terminated_on IS NULL GROUP BY d.name ORDER BY d.name;"
    explanation: |
      Engineering has 18 of the 48 current employees who have a department, which is 37.5%. The two people with no
      department are left out by the JOIN. The six percentages add up to 100.0. A window can run over the rows
      that GROUP BY produced, which is why `SUM(COUNT(*)) OVER ()` works.
  - type: exercise
    id: m10-t06
    lesson: m10-l02
    difficulty: 1
    prompt: |
      For the current employees in departments 5 (Finance) and 6 (HR), show `first_name`, `dept_id`, `salary` and
      `dept_headcount`: the number of current employees in the same department. Sort by `dept_id`, then by
      `salary` from highest to lowest.
    solution: |
      SELECT
          first_name,
          dept_id,
          salary,
          COUNT(*) OVER (PARTITION BY dept_id) AS dept_headcount
      FROM employees
      WHERE dept_id IN (5, 6)
        AND terminated_on IS NULL
      ORDER BY dept_id, salary DESC;
    ordered: true
    columnNames: true
    hints:
      - "Keep every row, so do not use GROUP BY. Add one extra column that counts within each department."
      - "COUNT(*) OVER (PARTITION BY dept_id) restarts the count for each department."
      - "SELECT first_name, dept_id, salary, COUNT(*) OVER (PARTITION BY ___) AS dept_headcount FROM employees WHERE dept_id IN (5, 6) AND terminated_on IS NULL ORDER BY dept_id, salary DESC;"
    explanation: |
      Finance has 5 current people and HR has 4, so dept_headcount shows 5 on all five Finance rows and 4 on all
      four HR rows. `PARTITION BY` splits the rows into one group per department, and every row survives.
