  - type: exercise
    id: m10-t21
    lesson: m10-l05
    difficulty: 1
    dataset: shop
    prompt: |
      For ShopSmart orders with `status` = 'delivered' placed in 2023, show each month as `month` (the first day of
      the month, as a date), `delivered` (how many orders were delivered that month) and `running_delivered` (the
      running total from January up to that month). Sort by `month`.
    solution: |
      WITH monthly AS (
          SELECT
              DATE_TRUNC('month', order_date)::date AS month,
              COUNT(*) AS delivered
          FROM orders
          WHERE status = 'delivered'
            AND order_date >= '2023-01-01'
            AND order_date < '2024-01-01'
          GROUP BY month
      )
      SELECT
          month,
          delivered,
          SUM(delivered) OVER (ORDER BY month) AS running_delivered
      FROM monthly
      ORDER BY month;
    ordered: true
    columnNames: true
    hints:
      - "First count the delivered orders in each month with GROUP BY. Then add a running total over those counts."
      - "SUM(delivered) OVER (ORDER BY month) adds each month's count to every month before it."
      - "WITH monthly AS (SELECT DATE_TRUNC('month', order_date)::date AS month, COUNT(*) AS delivered FROM orders WHERE status = 'delivered' AND order_date >= '2023-01-01' AND order_date < '2024-01-01' GROUP BY month) SELECT month, delivered, SUM(___) OVER (ORDER BY month) AS running_delivered FROM monthly ORDER BY month;"
    explanation: |
      The running total grows from 10 in January to 231 in December, which is the year's full count of delivered orders.
      The two busiest months are November and December, with 37 each. Keeping the months in order is what makes the
      running total meaningful.
