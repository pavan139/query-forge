  - type: exercise
    id: m20-t20
    lesson: m20-l07
    difficulty: 2
    prompt: |
      Create a view named `v_supplier_products` with two columns, `supplier_name`
      and `products`. `products` is the number of products each supplier provides.

      Only suppliers with at least one product need to appear.
    solution: |
      CREATE VIEW v_supplier_products AS
      SELECT s.name AS supplier_name,
             COUNT(*) AS products
      FROM suppliers AS s
      JOIN products AS p
           ON p.supplier_id = s.supplier_id
      GROUP BY s.name;
    check: |
      SELECT supplier_name, products
      FROM v_supplier_products
      ORDER BY products DESC, supplier_name
      LIMIT 3;
    columnNames: true
    hints:
      - Use `CREATE VIEW v_supplier_products AS` and a `SELECT` with `GROUP BY`.
      - Join `suppliers` to `products` on `supplier_id`.
      - "...SELECT s.name AS supplier_name, COUNT(*) AS products FROM suppliers AS s JOIN products AS p ON p.supplier_id = s.supplier_id ___ s.name;"
    explanation: |
      The check reads the top three suppliers through the view: Jade River
      Manufacturing with 17 products, Kestrel Supply GmbH with 9 and Tanuki Goods Ltd.
      with 8.

  - type: quiz
    id: m20-t21
    lesson: m20-l07
    difficulty: 1
    question: "What does a view store in the database?"
    options:
      - "A copy of the rows, refreshed every night"
      - "A saved query, which runs again each time someone reads the view"
      - "A list of the users who can read the data"
      - "Only the names of the columns"
    answer: 1
    explanation: |
      A view saves the `SELECT`, not the data. Each read runs the query against the
      current tables, so the numbers are always up to date.

