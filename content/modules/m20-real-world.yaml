  - type: exercise
    id: m20-t07
    lesson: m20-l03
    difficulty: 2
    prompt: |
      How many orders contain **more than one** product line? Show one column,
      `multi_line_orders`, with one row.

      Count orders, not lines: an order with three lines counts once.
    starter: |
      SELECT COUNT(*) AS multi_line_orders
      FROM order_items
      WHERE quantity > 1;
    solution: |
      SELECT COUNT(*) AS multi_line_orders
      FROM (
          SELECT order_id
          FROM order_items
          GROUP BY order_id
          HAVING COUNT(*) > 1
      ) AS t;
    columnNames: true
    hints:
      - A line with `quantity > 1` is not the same as an order with more than one line.
      - Group the lines by `order_id`, then keep the groups with more than one line.
      - "SELECT order_id FROM order_items GROUP BY order_id HAVING COUNT(*) ___ 1;"
    explanation: |
      The starter counts lines that have a quantity above 1. The solution groups the
      lines by order and keeps the orders with more than one line. 683 orders have
      more than one product line.

  - type: quiz
    id: m20-t08
    lesson: m20-l03
    difficulty: 2
    question: "A LEFT JOIN from customers to orders adds WHERE o.status <> 'delivered'. What happens to a customer with no orders?"
    options:
      - "The customer stays, with NULL in the order columns"
      - "The customer is removed, because NULL <> 'delivered' is not TRUE"
      - "The customer is counted as zero delivered orders"
      - "The query stops with an error"
    answer: 1
    explanation: |
      A customer with no orders has NULL in `o.status`. The comparison with NULL is
      not TRUE, so the `WHERE` clause removes the row. The fix is to move the
      condition into the `ON` clause.

