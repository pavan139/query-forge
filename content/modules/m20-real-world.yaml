    lesson: m20-l06
    difficulty: 2
    question: "Two products cost 899.99 and both are ranked 4th. Which window function gives both rows rank 4 and then skips to 6 for the next product?"
    options:
      - "ROW_NUMBER()"
      - "RANK()"
      - "NTILE(4)"
      - "COUNT(*)"
    answer: 1
    explanation: |
      `RANK()` gives tied rows the same number and leaves a gap after them. `ROW_NUMBER()`
      would number the two rows 4 and 5, which hides the tie.

