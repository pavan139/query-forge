testPool:
  - type: quiz
    id: m20-t01
    lesson: m20-l01
    difficulty: 1
    question: "Which PostgreSQL function joins the values of a group into one text, separated by a comma?"
    options:
      - "GROUP_CONCAT()"
      - "string_agg()"
      - "CONCAT_GROUP()"
      - "TEXTJOIN()"
    answer: 1
    explanation: |
      `string_agg(value, ', ')` is PostgreSQL's group text join. `GROUP_CONCAT` is MySQL,
      `TEXTJOIN` is an Excel function, and `CONCAT_GROUP` does not exist.

  - type: exercise
    id: m20-t02
    lesson: m20-l01
    difficulty: 2
    prompt: |
      Show the `name` of every product whose name contains the word "lamp",
      whatever the capitals. Sort the rows by `name`.
    solution: |
      SELECT name
      FROM products
      WHERE name ILIKE '%lamp%'
      ORDER BY name;
    ordered: true
    columnNames: true
    hints:
      - Use a pattern that finds "lamp" anywhere in the name.
      - "`ILIKE` ignores capitals, and `%` matches any text."
      - "SELECT name FROM products WHERE name ___ '%lamp%' ORDER BY name;"
    explanation: |
      `ILIKE` finds "Floor Lamp" and "Headlamp" even though their capital letters
      differ from the pattern. With `LIKE` you would have to match the exact case.

  - type: predict
    id: m20-t03
    lesson: m20-l01
    difficulty: 2
    question: "How many rows does this PostgreSQL query return?"
    sql: |
      SELECT name
      FROM products
      WHERE name ILIKE 'lumio%';
    options: ["0", "2", "3", "An error"]
    answer: 1
    explanation: |
      `ILIKE` ignores capitals, so "Lumio" matches "lumio%". Two products start with
