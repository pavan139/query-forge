  - type: exercise
    id: m20-t25
    lesson: m20-l06
    difficulty: 3
    prompt: |
      For customers 1 to 10, show two columns: `customer_id` and `status`, where
      `status` is the status of their **most recent** order.

      Most recent means the latest `order_date`. If two orders share a date, the one
      with the higher `order_id` is more recent.

      Sort the rows by `customer_id`.
    solution: |
      SELECT customer_id,
             status
      FROM (
          SELECT customer_id,
                 status,
                 ROW_NUMBER() OVER (
                     PARTITION BY customer_id
                     ORDER BY order_date DESC, order_id DESC
                 ) AS rn
          FROM orders
          WHERE customer_id <= 10
      ) AS t
      WHERE rn = 1
      ORDER BY customer_id;
    ordered: true
    columnNames: true
    hints:
      - "Number each customer's orders with `ROW_NUMBER()`, newest first."
      - "`PARTITION BY customer_id` restarts the numbers for each customer."
      - "...ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date ___, order_id ___) AS rn ... WHERE rn = 1 ORDER BY customer_id;"
    explanation: |
      Customer 5 has a shipped order as the newest, and customer 9 has a cancelled
      one. The `order_id` tie-breaker makes the choice fixed even when two orders
      share a date.

