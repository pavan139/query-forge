id: m20
order: 20
title: "SQL in the Real World"
subtitle: Dialects, professional habits, debugging, warehouses and interviews
icon: "🌍"
level: expert
description: |
  You can write SQL now. This last module is about using it at work, where the
  hard parts are rarely the keywords. The database is not the one in the
  tutorial, a total is a few dollars off, and a report is needed by Monday.

  You will learn how the big databases differ, how professionals write and
  debug queries, how to test a result before anyone trusts it, how a data
  warehouse is built as a star schema, and how to approach an interview problem
  calmly. The module ends with a capstone project for ShopSmart, where you build
  an executive report from scratch.

  Everything runs on **PostgreSQL 18**. Where another database works differently,
  you will see it in a table and in short, labelled notes.
dataset: shop
lessons:
  - id: m20-l01
    title: "One language, many accents: SQL dialects"
    summary: Learn which parts of SQL are standard, which belong to PostgreSQL, and how to translate a query from another database.
    minutes: 30
    steps:
      - type: read
        title: The query that would not run
        md: |
          Your friend Sam is excited. He found a query online that shows the five
          most expensive products, and he pastes it into SQL Quest:

          ```sql
          SELECT TOP 5 name, price
          FROM products
          ORDER BY price DESC;
          ```

          A red error appears. Sam's idea was fine. The query was written for a
          different database, **Microsoft SQL Server**. The language is almost the
          same, but every database has small extras that the others do not share.

          > [!ANALOGY]
          > It is like British and American English. You understand each other, yet
          > "lift" and "elevator" mean the same thing. You only need to know which
          > word belongs to which place.

      - type: read
        title: One standard, many dialects
        md: |
          SQL is a standard, so the core is the same almost everywhere: `SELECT`,
          `FROM`, `WHERE`, `GROUP BY`, `JOIN` and `ORDER BY`. You already use them.

          Each product then adds its own **dialect**: extra keywords and functions.
          The differences show up in a few predictable places:

          - how you limit the number of rows (`LIMIT`, `TOP`, `FETCH FIRST`)
          - how you join text, and how you match text while ignoring capitals
          - date functions
          - automatic numbers for new rows, and true and false values
          - shortcuts that only one product has

          You will learn the PostgreSQL version of each one, and the matching words
          in other databases. The last step of this lesson is a translation table
          you can keep.

          > [!REAL-WORLD]
          > Analysts copy queries from forums and AI tools all the time. Before you
          > run one, check which database it was written for.

      - type: example
        title: "LIMIT: the PostgreSQL way"
        md: Ask for the five most expensive products. `LIMIT 5` goes at the very end of the query.
        sql: |
          SELECT name, price
          FROM products
          ORDER BY price DESC, name
          LIMIT 5;
        after: |
          You get five rows, the most expensive first. The `name` after `price DESC`
          is a **tie-breaker**: if two products cost the same, the one with the
          earlier name comes first. Without it, two products with the same price
          could swap places from one run to the next.

      - type: example
        title: TOP does not exist in PostgreSQL
        md: This is the query Sam pasted. PostgreSQL does not know the word `TOP`.
        sql: |
          SELECT TOP 5 name, price
          FROM products
          ORDER BY price DESC;
        expectError: true
        after: |
          PostgreSQL stops at the number `5` and reports a **syntax error**. That
          means the words are arranged in a way the database does not understand.

          The fix is to remove `TOP 5` and write `LIMIT 5` at the end of the query.

          > [!TIP]
          > Error messages point at the problem. "at or near "5"" tells you exactly
          > where PostgreSQL got confused.

      - type: read
        title: "The standard way: FETCH FIRST"
        md: |
          The SQL standard describes the same idea as `FETCH FIRST 5 ROWS ONLY`,
          placed at the end of the query. PostgreSQL understands it, and so does
          Oracle (version 12c and newer).

          `LIMIT` is shorter and very common in PostgreSQL, MySQL and SQLite. Pick
          one style for your team and stick to it. Never mix both in one query.

      - type: example
        title: The same query, standard style
        md: Here is Sam's query again, this time written with `FETCH FIRST`.
        sql: |
          SELECT name, price
          FROM products
          ORDER BY price DESC, name
          FETCH FIRST 5 ROWS ONLY;
        after: |
          The same five rows as before. Two spellings, one result.

      - type: read
        title: Joining text and matching capitals
        md: |
          To glue text pieces together, PostgreSQL uses two vertical bars, `||`.
          MySQL uses a function called `CONCAT()`, and SQL Server accepts `+` or
          `CONCAT()`.

          Watch out for `NULL`. In PostgreSQL, joining a text value with a `NULL`
          piece gives `NULL` for the whole result. You met `COALESCE` in the
          functions module, and it protects you from this.

          Matching text is another place where dialects differ. In PostgreSQL,
          `LIKE` is **case-sensitive**: `'desk'` and `'Desk'` are different. `ILIKE`
          ignores capitals. `ILIKE` is a PostgreSQL word, so other databases use a
          different spelling, as the translation table shows.

      - type: example
        title: LIKE is case-sensitive
        md: Look for products with the word "desk" in their name. Look closely at the lowercase pattern.
        sql: |
          SELECT name
          FROM products
          WHERE name LIKE '%desk%'
          ORDER BY name;
        after: |
          **Zero rows.** Every product name with "Desk" in it has a capital D, and
          `LIKE` does not match a lowercase `d` against a capital `D`. Change `LIKE`
          to `ILIKE` and three products appear.

          > [!MISTAKE]
          > Zero rows does not always mean "the data is empty". Check the capitals in
          > your pattern before you decide that nothing matches.

      - type: example
        title: "DISTINCT ON: the top row of each group"
        md: |
          Standard SQL has `DISTINCT`, which removes duplicate rows. PostgreSQL also
          has `DISTINCT ON (column)`, which keeps **one row for each value** of that
          column: the first row after your `ORDER BY`.

          Here it shows the most expensive product in every category.
        sql: |
          SELECT DISTINCT ON (category_id)
                 category_id, name, price
          FROM products
          ORDER BY category_id, price DESC, name;
        after: |
          You get one product for each category. The rows are sorted by
          `category_id`, then by price from highest to lowest, so the first row of
          each category is the most expensive one.

          Other databases do the same job with a window function such as
          `ROW_NUMBER()`, which you met in the window functions modules.

          > [!MISTAKE]
          > The first column in `ORDER BY` must be the same column as in
          > `DISTINCT ON`. If it is not, PostgreSQL reports an error.

      - type: example
        title: Auto-numbers and true/false
        md: |
          Two more differences you will meet often. This example creates its own
          small table on an empty database, so you can run it on its own.
        dataset: blank
        sql: |
          CREATE TABLE tags (
              tag_id    INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
              tag_name  TEXT NOT NULL,
              is_public BOOLEAN NOT NULL DEFAULT TRUE
          );

          INSERT INTO tags (tag_name, is_public)
          VALUES ('sql', TRUE), ('excel', FALSE), ('python', TRUE);

          SELECT tag_id, tag_name, is_public
          FROM tags
          ORDER BY tag_id;
        after: |
          `GENERATED ALWAYS AS IDENTITY` makes PostgreSQL number the rows 1, 2, 3
          for you, so you never type an id yourself. The older `SERIAL` spelling
          still works. MySQL calls the same idea `AUTO_INCREMENT`, and SQL Server
          uses `IDENTITY`.

          `BOOLEAN` holds `TRUE` or `FALSE`. MySQL stores booleans as small
          numbers, and SQLite stores them as 0 or 1.

      - type: read
        title: Your translation guide
        md: |
          When you translate a query, follow three steps:

          1. Find the word that looks foreign (`TOP`, `ROWNUM`, `+` for text, `GETDATE`).
          2. Look it up in the tables below.
          3. Run the result and read any error message. It points at the problem.

          **Limits, text and dates**

          | Task | PostgreSQL | MySQL | SQL Server | SQLite |
          |---|---|---|---|---|
          | First 5 rows | `LIMIT 5` at the end | `LIMIT 5` | `SELECT TOP 5 ...` | `LIMIT 5` |
          | Skip 10, then take 5 | `LIMIT 5 OFFSET 10` | `LIMIT 10, 5` | `ORDER BY ... OFFSET 10 ROWS FETCH NEXT 5 ROWS ONLY` | `LIMIT 5 OFFSET 10` |
          | Join text | `a \|\| b` | `CONCAT(a, b)` | `a + b` or `CONCAT(a, b)` | `a \|\| b` |
          | Match ignoring capitals | `ILIKE` | `LIKE` (usually ignores case) | `LIKE` (depends on collation) | `LIKE` (ignores case for English letters) |
          | Join text per group | `string_agg(x, ', ')` | `GROUP_CONCAT(x SEPARATOR ', ')` | `STRING_AGG(x, ', ')` (2017 and newer) | `group_concat(x, ', ')` |
          | Days between two dates | `date2 - date1` | `DATEDIFF(date2, date1)` | `DATEDIFF(day, date1, date2)` | `julianday(date2) - julianday(date1)` |

          **Numbers, ids and changes**

          | Task | PostgreSQL | MySQL | SQL Server | SQLite |
          |---|---|---|---|---|
          | Today's date | `CURRENT_DATE` | `CURDATE()` | `CAST(GETDATE() AS date)` | `date('now')` |
          | Auto-numbered id | `GENERATED ALWAYS AS IDENTITY` | `AUTO_INCREMENT` | `IDENTITY(1,1)` | `INTEGER PRIMARY KEY` |
          | True / false | `TRUE` / `FALSE` | `TRUE` / `FALSE` (stored as 1 / 0) | `BIT` (1 / 0) | stored as 1 / 0 |
          | Insert, or update if the key exists | `INSERT ... ON CONFLICT (id) DO UPDATE` | `INSERT ... ON DUPLICATE KEY UPDATE` | `MERGE` | `INSERT ... ON CONFLICT (id) DO UPDATE` |
          | First row per group | `DISTINCT ON (col)` | `ROW_NUMBER()` in a subquery | `ROW_NUMBER()` in a subquery | `ROW_NUMBER()` in a subquery |

          Some features belong to one product only. `QUALIFY` (filter on a window
          function result directly) exists in BigQuery and Snowflake, but not in
          PostgreSQL. In PostgreSQL you wrap the window function in a subquery or a
          CTE instead.

          > [!NOTE]
          > Syntax changes between versions, and the tables describe common cases.
          > When in doubt, check the documentation for the exact version you use.

      - type: quiz
        id: m20-l01-q1
        question: "Sam's query starts with SELECT TOP 5. Which PostgreSQL change gives the same five rows?"
        options:
          - "Replace TOP 5 with FETCH TOP 5"
          - "Remove TOP 5 and add LIMIT 5 at the end of the query"
          - "Replace TOP 5 with ROWNUM <= 5"
          - "Add SELECT FIRST 5 before FROM"
        answer: 1
        explanation: |
          `LIMIT 5` goes at the end of the query. `ROWNUM` is Oracle's older way of
          counting rows, and `FETCH TOP` and `SELECT FIRST` are not PostgreSQL.

      - type: quiz
        id: m20-l01-q2
        question: "Which of these queries run in PostgreSQL without any changes? Choose every correct one."
        options:
          - "SELECT name FROM products ORDER BY name LIMIT 3;"
          - "SELECT TOP 3 name FROM products ORDER BY name;"
          - "SELECT name FROM products ORDER BY name FETCH FIRST 3 ROWS ONLY;"
          - "SELECT name FROM products WHERE name ILIKE 'desk%' ORDER BY name;"
        answer: [0, 2, 3]
        explanation: |
          `TOP` is a SQL Server word. The other three use `LIMIT`, `FETCH FIRST`
          or `ILIKE`, which PostgreSQL understands.

      - type: predict
        id: m20-l01-p1
        question: "How many rows will this query return in PostgreSQL?"
        sql: |
          SELECT name
          FROM products
          WHERE name LIKE 'desk%';
        options: ["0", "1", "3", "An error"]
        answer: 0
        explanation: |
          `LIKE` is case-sensitive in PostgreSQL. Every product name that contains
          "desk" has a capital D, so a lowercase `desk%` matches nothing. With
          `ILIKE` the answer would be 1.

      - type: predict
        id: m20-l01-p2
        question: "What does this PostgreSQL query return?"
        sql: |
          SELECT 'Coffee' || NULL AS result;
        options: ["Coffee", "NULL", "Coffee NULL", "An error"]
        answer: 1
        explanation: |
          Joining text with `NULL` using `||` gives `NULL`. PostgreSQL's `concat()`
          function skips `NULL` pieces instead, so `concat('Coffee', NULL)` returns
          `Coffee`.

      - type: fill
        id: m20-l01-f1
        prompt: "Complete this PostgreSQL query so it returns the three most expensive products."
        template: |
          SELECT name, price
          FROM products
          ORDER BY price DESC
          ___ 3;
        answers:
          - ["LIMIT"]
        explanation: "PostgreSQL uses `LIMIT` at the end of the query. `TOP` would cause a syntax error here."

      - type: parsons
        id: m20-l01-o1
        prompt: "Put the lines in the right order to get the three most expensive products in PostgreSQL."
        lines:
          - SELECT name, price
          - FROM products
          - ORDER BY price DESC
          - LIMIT 3;
        distractors:
          - SELECT TOP 3 name, price

      - type: exercise
        id: m20-l01-e1
        title: The four cheapest
        prompt: |
          Show the `name` and `price` of the **4 cheapest** products. Sort them from
          cheapest to most expensive. If two products cost the same, sort them by
          `name`. Use `LIMIT`.
        starter: |
          SELECT name, price
          FROM products
          ORDER BY price, name;
        solution: |
          SELECT name, price
          FROM products
          ORDER BY price, name
          LIMIT 4;
        ordered: true
        hints:
          - Sort the products first, then keep only the first few rows.
          - LIMIT goes at the very end of the query.
          - "SELECT name, price FROM products ORDER BY price, ___ LIMIT ___;"
        explanation: |
          The starter sorts correctly but returns every product. Adding `LIMIT 4`
          keeps the first four rows. The name tie-breaker makes the order complete,
          so the same four rows appear every time.
        difficulty: 1

      - type: exercise
        id: m20-l01-e2
        title: Full names, ignoring capitals
        prompt: |
          Show the **full name** of every customer whose `last_name` starts with the
          letter **M**, whether it is written as a capital or a lowercase letter.

          Give the result one column called `full_name`. Build it from the
          `first_name`, a single space, and the `last_name`. Sort the rows by
          `full_name`.
        solution: |
          SELECT first_name || ' ' || last_name AS full_name
          FROM customers
          WHERE last_name ILIKE 'm%'
          ORDER BY full_name;
        ordered: true
        columnNames: true
        hints:
          - You need two things, joining text with `||` and matching the start of `last_name` while ignoring capitals.
          - Use `ILIKE` with a pattern that ends in `%`.
          - "SELECT first_name || ___ || last_name AS full_name FROM customers WHERE last_name ILIKE ___ ORDER BY ___;"
        explanation: |
          `ILIKE 'm%'` matches any last name that begins with M, whatever the
          capital letter. Do not forget the space inside `' '`. Without it, the first
          and last names run together.
        difficulty: 2

      - type: exercise
        id: m20-l01-e3
        title: The cheapest active product per category
        prompt: |
          For each category, show the **cheapest active product**. Use only products
          where `is_active` is true.

          Show `category_id`, `name` and `price`, sorted by `category_id`. If two
          products in one category cost the same, choose the one whose `name` comes
          first alphabetically.
        solution: |
          SELECT DISTINCT ON (category_id)
                 category_id, name, price
          FROM products
          WHERE is_active
          ORDER BY category_id, price, name;
        ordered: true
        columnNames: true
        hints:
          - Use DISTINCT ON (category_id) to keep one row for each category.
          - Sort by price from lowest to highest, then by name, so the first row is the cheapest.
          - "SELECT DISTINCT ON (___) category_id, name, price FROM products WHERE ___ ORDER BY ___, price, name;"
        explanation: |
          `DISTINCT ON` keeps the first row of each group, so the `ORDER BY` decides
          the winner. The first `ORDER BY` column has to match the `DISTINCT ON`
          column, or PostgreSQL reports an error.
        difficulty: 2

      - type: exercise
        id: m20-l01-e4
        title: The three newest orders, as one line each
        prompt: |
          Show the **3 newest orders**. Newest means the latest `order_date`. If two
          orders share a date, the one with the higher `order_id` is newer.

          For each order, show `order_id`, `order_date` and `items`. `items` is all of
          the order's product names joined into one text, separated by `', '` and
          sorted alphabetically by product name.

          Sort the result with the newest order first.
        solution: |
          SELECT o.order_id,
                 o.order_date,
                 string_agg(p.name, ', ' ORDER BY p.name) AS items
          FROM orders o
          JOIN order_items i ON i.order_id = o.order_id
          JOIN products p ON p.product_id = i.product_id
          GROUP BY o.order_id, o.order_date
          ORDER BY o.order_date DESC, o.order_id DESC
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Join the orders to their order lines, and then to the products.
          - "string_agg(name, ', ' ORDER BY name) joins one group's names into one text."
          - "...GROUP BY o.order_id, o.order_date ORDER BY o.order_date ___, o.order_id ___ LIMIT ___;"
        explanation: |
          `string_agg` is PostgreSQL's way to join the values of a group into one
          text. The `ORDER BY` inside it sorts the names. MySQL's `GROUP_CONCAT` and
          SQL Server's `STRING_AGG` do the same job with small changes, as the
          translation table showed.
        difficulty: 3

      - type: read
        title: Summary
        md: |
          - PostgreSQL uses `LIMIT`, `ILIKE`, `||`, `DISTINCT ON` and `string_agg`.
          - Other databases use `TOP`, `CONCAT`, `GROUP_CONCAT` and `DATEDIFF`, among others.
          - Translate one word at a time, and run the result. The error message tells you where to look.

    cheatsheet:
      - title: The first N rows (PostgreSQL)
        sql: |
          SELECT name, price
          FROM products
          ORDER BY price DESC, name
          LIMIT 5;
        note: "LIMIT goes at the end. FETCH FIRST 5 ROWS ONLY also works."
      - title: Match text, ignoring capitals
        sql: "WHERE name ILIKE '%desk%';"
        note: "LIKE is case-sensitive in PostgreSQL. ILIKE is not."
      - title: Join text
        sql: "SELECT first_name || ' ' || last_name AS full_name FROM customers;"
        note: "A NULL piece makes the whole result NULL. Use COALESCE to protect it."
      - title: Top row of each group
        sql: |
          SELECT DISTINCT ON (category_id) category_id, name, price
          FROM products
          ORDER BY category_id, price DESC, name;
        note: "The first ORDER BY column must match the DISTINCT ON column."

  - id: m20-l02
    title: "Write SQL your team can read"
    summary: Name, format, comment and order your queries so that a colleague, or you six months later, can understand them and trust the result.
    minutes: 30
    steps:
      - type: read
        title: The query that worked
        md: |
          Priya leads the analytics team at ShopSmart. She opens your query and sees
          a block of text that runs off the screen. The numbers are right, but she
          cannot tell what the query does without reading every word.

          Your query is not wrong. It is **hard to read**, and hard-to-read queries
          are hard to check, fix and hand over. Professional SQL is written for the
          next person, and that person is often you, six months later.

          > [!ANALOGY]
          > A recipe card only works if someone else can follow it. A good query is
          > like a recipe with clear steps, named ingredients and a note that says why
          > the lemon goes in.

      - type: read
        title: The messy version
        md: |
          This is the kind of query that works but is hard to check. Do not run it.
          Just notice what makes it difficult.

          ```sql
          select c.first_name,c.last_name,count(o.order_id) as n from customers c left join orders o on o.customer_id=c.customer_id where c.state='CA' group by c.first_name,c.last_name,c.customer_id order by n desc limit 5;
          ```

          Nothing is wrong with the words. The problem is the layout: everything is on
          one line, the column `n` says little, and the `ORDER BY` has no tie-breaker.

      - type: read
        title: Six habits of production SQL
        md: |
          Good teams agree on a few habits and apply them every time:

          1. **Keywords in CAPITALS**, and names in lowercase `snake_case`.
          2. **One clause per line**, with each column of a `SELECT` on its own line.
          3. **Clear names** for columns, and short, obvious table aliases.
          4. **Comments** that explain *why*, not *what*.
          5. **Name the columns you need.** Avoid `SELECT *` in finished queries.
          6. **A complete `ORDER BY`.** Add a tie-breaker so the order never changes.

          You will practise each habit in this lesson.

      - type: example
        title: The same query, written for a reader
        md: The same question as the messy version. Each clause has its own line.
        sql: |
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name,
                 COUNT(o.order_id) AS order_count
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          WHERE c.state = 'CA'
          GROUP BY c.customer_id, c.first_name, c.last_name
          ORDER BY order_count DESC, c.customer_id
          LIMIT 5;
        after: |
          Read it from top to bottom: which columns, from which table, joined to
          which orders, for which state, grouped how, sorted how, and how many rows.

          The `c.customer_id` at the end of `ORDER BY` is a **tie-breaker**. It decides
          the order when two customers have the same number of orders.

      - type: read
        title: Names that explain themselves
        md: |
          Avoid names such as `t1`, `x` or `tmp`. Use `snake_case` for multi-word
          names, and use an alias such as `customer_count` to name a result.

          ```sql
          SELECT state,
                 COUNT(*) AS customer_count
          FROM customers
          GROUP BY state
          ORDER BY customer_count DESC, state
          LIMIT 3;
          ```

          The column is called `customer_count`, so anyone reading the result knows
          what the number means. Without `AS`, PostgreSQL would name the column
          `count`, which says much less.

      - type: read
        title: Comments explain the why
        md: |
          A **comment** is text the database ignores. It is written for the people
          who read the query.

          - `-- text` ignores everything after the two dashes on that line.
          - `/* text */` ignores everything between the markers, even over several lines.

          Write comments that explain a decision, such as why a status is left out.
          A comment such as `-- select the name` adds nothing, because the SQL already
          says that.

      - type: example
        title: A comment that explains a decision
        md: Only delivered orders count as sales. The comment says why.
        sql: |
          -- Revenue counts delivered orders only. Cancelled and
          -- returned orders are left out on purpose.
          SELECT ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                 AS delivered_revenue
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          WHERE o.status = 'delivered';
        after: |
          One row with the total of all delivered orders, after each line's discount.
          PostgreSQL skips the comment lines completely, so they cost nothing when the
          query runs.

      - type: read
        title: Why avoid SELECT *?
        md: |
          `SELECT *` means "every column". It is handy when you explore a table for the
          first time. In a finished query it causes three problems:

          - The result changes when someone adds a column to the table.
          - You fetch data you never look at, which is slow on big tables.
          - In a join, two tables can have a column with the same name, and the result
            shows both, which is confusing.

          > [!REAL-WORLD]
          > Many teams have a rule against `SELECT *` in production code. A report that
          > suddenly shows a new column can break a dashboard that is shared with
          > managers.

      - type: example
        title: SELECT * in a join shows the same name twice
        md: Here `SELECT *` joins the category tree to itself. Look at the column names.
        sql: |
          SELECT *
          FROM categories AS parent
          JOIN categories AS child
               ON child.parent_id = parent.category_id
          ORDER BY child.category_id;
        after: |
          The result has `category_id`, `name` and `parent_id` **twice**, once for
          the parent and once for the child. Named columns, such as `parent.name` and
          `child.name`, would avoid the confusion.

      - type: example
        title: Ambiguous means "could be either"
        md: Now name the columns, but forget the table alias on `order_id`, which both tables have.
        sql: |
          SELECT order_id, o.status
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id;
        expectError: true
        after: |
          PostgreSQL cannot tell which `order_id` you mean, so it stops with
          `column reference "order_id" is ambiguous`. The fix is to write `o.order_id`.

          > [!MISTAKE]
          > A query can work on one table and fail after a join, when a second table
          > has a column with the same name. Put the table alias in front of any
          > column name that appears in more than one table.

      - type: read
        title: Same question, same answer
        md: |
          Imagine a report that lists the three most expensive products. On Monday
          the list is correct. On Tuesday a new price is added, two products cost the
          same, and the list shows them in a different order. Nobody changed the
          products, but the report changed.

          SQL promises no order unless you ask for one with `ORDER BY`. If two rows
          have the same sort value, the database may return them in either order. Add
          a **tie-breaker**: a unique column, such as an id, that gives every row a
          clear place. This is called **deterministic ordering**.

      - type: example
        title: A tie-breaker at the cut-off
        md: The four most expensive products. Two products cost 899.99, and they sit right at the cut-off.
        sql: |
          SELECT product_id, name, price
          FROM products
          ORDER BY price DESC, product_id
          LIMIT 4;
        after: |
          Product 1 is the fourth row, because its `product_id` is smaller than the
          id of the other 899.99 product. Each run gives the same four rows. Without
          `product_id`, the fourth place could go to either product.

      - type: read
        title: Name each step with a CTE
        md: |
          A **CTE** (a named query that starts with `WITH`, which you met in the CTE
          module) lets you name each step of a report. Read the steps from top to
          bottom, like a checklist: first choose the rows, then count them, then add
          names.

          Give each CTE a name that says what it holds, such as `delivered` or
          `customer_totals`. Separate the blocks with commas.

      - type: example
        title: A report in three named steps
        md: The five customers with the most delivered orders, with their names.
        sql: |
          WITH delivered AS (
              SELECT customer_id
              FROM orders
              WHERE status = 'delivered'
          ),
          customer_totals AS (
              SELECT customer_id,
                     COUNT(*) AS delivered_orders
              FROM delivered
              GROUP BY customer_id
          )
          SELECT c.first_name,
                 c.last_name,
                 t.delivered_orders
          FROM customer_totals AS t
          JOIN customers AS c
               ON c.customer_id = t.customer_id
          ORDER BY t.delivered_orders DESC, c.customer_id
          LIMIT 5;
        after: |
          `delivered` picks the rows, `customer_totals` counts them, and the last
          `SELECT` adds names and sorting. If the report looks wrong, you can run
          one step at a time to find where it goes wrong.

      - type: quiz
        id: m20-l02-q1
        question: "Which query follows the production habits best?"
        options:
          - "select * from orders where status='delivered'"
          - "SELECT order_id, order_date, status FROM orders WHERE status = 'delivered' ORDER BY order_date, order_id;"
          - "SELECT * FROM orders o, customers c WHERE o.customer_id = c.customer_id"
          - "SELECT order_id FROM orders ORDER BY order_date LIMIT 10"
        answer: 1
        explanation: |
          The second query names its columns, uses uppercase keywords, ends with a
          semicolon and sorts with a tie-breaker. The others use `SELECT *`, have
          no tie-breaker, or mix the old comma join with `SELECT *`.

      - type: predict
        id: m20-l02-p1
        question: "What is the name of the second column in the result of this query?"
        sql: |
          SELECT state, COUNT(*)
          FROM customers
          GROUP BY state
          ORDER BY state
          LIMIT 3;
        options: ["count", "COUNT(*)", "customers", "An error"]
        answer: 0
        explanation: |
          PostgreSQL names an unaliased `COUNT(*)` column `count`. Add `AS customer_count`
          to choose a name that explains the number.

      - type: fill
        id: m20-l02-f1
        prompt: "Complete the query. The CTE is named `delivered_orders`, and the final step counts its rows."
        template: |
          WITH ___ AS (
              SELECT order_id
              FROM orders
              WHERE status = 'delivered'
          )
          SELECT COUNT(*)
          FROM ___;
        answers:
          - ["delivered_orders"]
          - ["delivered_orders"]
        explanation: "A CTE is named right after `WITH`, and you use that same name in the `FROM` of the final step."

      - type: parsons
        id: m20-l02-o1
        prompt: "Put the lines in a clear order: the three customers with the most delivered orders."
        lines:
          - SELECT c.first_name, c.last_name, COUNT(*) AS delivered_orders
          - FROM customers AS c
          - JOIN orders AS o
          -      ON o.customer_id = c.customer_id
          - WHERE o.status = 'delivered'
          - GROUP BY c.customer_id, c.first_name, c.last_name
          - ORDER BY delivered_orders DESC, c.customer_id
          - LIMIT 3;
        distractors:
          - HAVING o.status = 'delivered'

      - type: exercise
        id: m20-l02-e1
        title: The five most expensive active products
        prompt: |
          Show `product_id`, `name` and `price` of the **5 most expensive products that
          are still for sale** (`is_active` is true).

          Sort them by `price` from highest to lowest. If two products have the same
          price, sort them by `product_id` from lowest to highest.
        solution: |
          SELECT product_id, name, price
          FROM products
          WHERE is_active
          ORDER BY price DESC, product_id
          LIMIT 5;
        ordered: true
        columnNames: true
        hints:
          - Filter the rows to active products first, then sort them.
          - Sort by price from highest to lowest, then by product_id as the tie-breaker.
          - "SELECT product_id, name, price FROM products WHERE ___ ORDER BY ___ DESC, ___ LIMIT ___;"
        explanation: |
          `WHERE is_active` keeps only the products still for sale, since the column
          is true or false. The `product_id` tie-breaker makes the order complete, so
          the two products costing 899.99 always appear in the same order.
        difficulty: 1

      - type: exercise
        id: m20-l02-e2
        title: The five most recent orders
        prompt: |
          Show `order_id`, `order_date` and `status` for the **5 most recent orders**.
          Newest means the latest `order_date`. If two orders share a date, the one
          with the higher `order_id` is newer.

          Show the newest order first.
        solution: |
          SELECT order_id, order_date, status
          FROM orders
          ORDER BY order_date DESC, order_id DESC
          LIMIT 5;
        ordered: true
        columnNames: true
        hints:
          - Sort the orders from newest to oldest, then take the first five.
          - Two orders share the date 2024-12-29. The higher `order_id` must come first.
          - "SELECT order_id, order_date, status FROM orders ORDER BY order_date ___, order_id ___ LIMIT ___;"
        explanation: |
          Listing the three columns by name keeps the result small and clear. The
          second column in `ORDER BY` breaks ties on the same date, so the five rows
          are always the same.
        difficulty: 1

      - type: exercise
        id: m20-l02-e3
        title: Customers who never ordered
        prompt: |
          Use a CTE named `buyers` that lists each `customer_id` found in `orders`,
          once per customer.

          Then show `customer_id`, `first_name` and `last_name` of every customer
          who is **not** in `buyers`. Sort the rows by `customer_id`.
        solution: |
          WITH buyers AS (
              SELECT DISTINCT customer_id
              FROM orders
          )
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name
          FROM customers AS c
          LEFT JOIN buyers AS b
                 ON b.customer_id = c.customer_id
          WHERE b.customer_id IS NULL
          ORDER BY c.customer_id;
        ordered: true
        columnNames: true
        hints:
          - "The CTE is `WITH buyers AS (SELECT DISTINCT customer_id FROM orders)`."
          - A LEFT JOIN keeps every customer. Customers without a match get NULL in the `buyers` columns.
          - "...LEFT JOIN buyers AS b ON b.customer_id = c.customer_id WHERE b.customer_id ___ NULL;"
        explanation: |
          Customers who never ordered have no row in `buyers`, so the LEFT JOIN gives
          them NULL. Keeping only the NULL rows finds them. Ten customers, numbered
          141 to 150, never ordered.
        difficulty: 2

      - type: exercise
        id: m20-l02-e4
        title: Top 3 customers in 2024, with a CTE
        prompt: |
          Use a CTE named `revenue_2024` that holds, for each `customer_id`, the total
          revenue of its **delivered** orders placed in **2024**. Use the line
          formula `quantity * unit_price * (1 - discount)`.

          Then show the **3 customers with the highest revenue**, with the columns
          `first_name`, `last_name` and `revenue`. Round `revenue` to 2 decimal
          places. Sort by revenue from highest to lowest, then by `customer_id`.
        solution: |
          WITH revenue_2024 AS (
              SELECT o.customer_id,
                     SUM(i.quantity * i.unit_price * (1 - i.discount)) AS revenue
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              WHERE o.status = 'delivered'
                AND o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
              GROUP BY o.customer_id
          )
          SELECT c.first_name,
                 c.last_name,
                 ROUND(r.revenue, 2) AS revenue
          FROM revenue_2024 AS r
          JOIN customers AS c
               ON c.customer_id = r.customer_id
          ORDER BY r.revenue DESC, c.customer_id
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Build the CTE first. It needs orders, order_items, the status and the 2024 dates.
          - Group the CTE by `customer_id`, and add up the line formula with SUM.
          - "...GROUP BY o.customer_id) SELECT c.first_name, c.last_name, ROUND(r.revenue, 2) AS revenue FROM revenue_2024 AS r JOIN customers AS c ON c.customer_id = r.customer_id ORDER BY ___ LIMIT ___;"
        explanation: |
          The CTE does the heavy lifting, and the final `SELECT` only adds names and
          sorting. Dates are written as a range (`>= 2024-01-01` and `< 2025-01-01`),
          which is the safe pattern for a whole year, even if the column later
          holds a time of day.
        difficulty: 2

      - type: exercise
        id: m20-l02-e5
        title: Clean up this query
        prompt: |
          The starter query works, but it breaks several habits: it uses `SELECT *`,
          it has no table aliases and no names for the columns.

          Rewrite it so it shows `order_item_id`, `order_id`, `product_name` and
          `quantity`, for order lines with a `quantity` of 3 or more. Get the
          product name from `products.name`, and rename it `product_name`.

          Sort by `quantity` from highest to lowest, then by `order_item_id`, and
          show the first 5 rows.
        starter: |
          select * from order_items i join products p on p.product_id = i.product_id where i.quantity >= 3 order by i.quantity desc limit 5;
        solution: |
          SELECT i.order_item_id,
                 i.order_id,
                 p.name AS product_name,
                 i.quantity
          FROM order_items AS i
          JOIN products AS p
               ON p.product_id = i.product_id
          WHERE i.quantity >= 3
          ORDER BY i.quantity DESC, i.order_item_id
          LIMIT 5;
        ordered: true
        columnNames: true
        hints:
          - Choose the four columns by name, and write `i.` or `p.` in front of each one.
          - "The name comes from `products`, so write `p.name AS product_name`."
          - "...ORDER BY i.quantity DESC, i.order_item_id LIMIT 5;"
        explanation: |
          The starter returns every column and gives no order to the rows with the
          same quantity. The solution keeps only the four columns the reader needs,
          and the `order_item_id` tie-breaker makes the five rows stable.
        difficulty: 3

    cheatsheet:
      - title: Readable layout
        sql: |
          SELECT c.customer_id,
                 c.first_name
          FROM customers AS c
          WHERE c.state = 'CA'
          ORDER BY c.customer_id
          LIMIT 5;
        note: "One clause per line. Name every column you need."
      - title: Name a result
        sql: "SELECT state, COUNT(*) AS customer_count FROM customers GROUP BY state;"
        note: "Without AS, the count column is called count."
      - title: Complete ORDER BY
        sql: "ORDER BY price DESC, product_id;"
        note: "Add a unique column as the tie-breaker so the order never changes."
      - title: Name each step with a CTE
        sql: |
          WITH delivered AS (
              SELECT customer_id
              FROM orders
              WHERE status = 'delivered'
          )
          SELECT COUNT(*) FROM delivered;
        note: "Each CTE is a named step. Use -- for a comment on one line."

  - id: m20-l03
    title: "Find the bug before it finds you: debugging queries"
    summary: Learn a calm routine for wrong numbers. Shrink the problem, count rows after each step, check what one row means, and handle NULL correctly.
    minutes: 35
    steps:
      - type: read
        title: A number that looks too big
        md: |
          Marcus is a finance analyst at ShopSmart. He compares your dashboard with
          the finance report and says: "Your revenue is higher than ours. Which one
          is right?"

          You could panic, or you could investigate. Investigating is detective work.
          You do not need to be a genius. You need a routine, and patience.

          > [!ANALOGY]
          > A mechanic who hears a strange noise does not replace the engine. They
          > listen, test one part at a time, and write down what each test shows.

      - type: read
        title: A debugging routine
        md: |
          Use these five steps whenever a number looks wrong:

          1. **Reproduce.** Run the query again and write down the number that looks wrong.
          2. **Shrink.** Pick one customer, one month or a few rows, and check them by hand.
          3. **Count.** Count the rows after each join and each filter.
          4. **Check the grain.** Ask: what does one row stand for?
          5. **Compare.** Check the total against a number from another source.

          The rest of this lesson practises each step.

      - type: stepper
        title: Count the rows after each step
        md: |
          Each stage adds one piece of the query. Click through the stages and watch
          the count. A sudden jump tells you where to look.
        stages:
          - label: Start with orders
            md: One row per order. Count them first, so you know the starting point.
            sql: |
              SELECT COUNT(*) AS row_count
              FROM orders;
          - label: Join the order lines
            md: Each order now has one row for each product line it contains. The count grows.
            sql: |
              SELECT COUNT(*) AS row_count
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id;
          - label: Keep delivered orders
            md: Add a filter, and count again.
            sql: |
              SELECT COUNT(*) AS row_count
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              WHERE o.status = 'delivered';
          - label: Count orders, not rows
            md: "COUNT(DISTINCT ...) counts each order once, however many lines it has."
            sql: |
              SELECT COUNT(DISTINCT o.order_id) AS order_count
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              WHERE o.status = 'delivered';

      - type: read
        title: What does one row mean?
        md: |
          The **grain** of a table is what one row stands for. The `orders` table has
          one row per order. The `order_items` table has one row per product line
          inside an order.

          When you join the two, the grain changes. Each row is now one product line,
          not one order. A query that counts rows after the join is counting lines.
          Always ask yourself: after this step, one row is one what?

      - type: example
        title: Lines are not orders
        md: Customer 6 has placed some orders. Count the orders, and count the rows after the join.
        sql: |
          SELECT COUNT(DISTINCT o.order_id) AS orders,
                 COUNT(*) AS rows_after_join
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          WHERE o.customer_id = 6;
        after: |
          Customer 6 placed 23 orders, but the join returns 70 rows. Each order is
          repeated once for every product line, and this repetition is called a
          **fan-out**. `COUNT(*)` counts the lines. `COUNT(DISTINCT o.order_id)`
          counts the orders.

          > [!MISTAKE]
          > If you add up an order's total after a join, the total of each order is
          > repeated once for every line. The revenue becomes too big.

      - type: example
        title: Two payments, one order
        md: Some orders are paid in two parts. Count the payment rows and the orders they belong to.
        sql: |
          SELECT COUNT(*) AS payment_rows,
                 COUNT(DISTINCT order_id) AS paid_orders
          FROM payments;
        after: |
          There are 778 payment rows, but only 758 different orders. Twenty orders
          were paid in two parts, often a gift card plus a card. When you join
          orders to payments, those twenty orders appear twice. Count the order
          totals only once, or count the payments separately.

      - type: read
        title: NULL is not a value
        md: |
          `NULL` means "unknown" or "missing". It is not a number, not a text and not
          an empty string. Because of that, `=` can never find it. The test
          `discount_code = NULL` is never TRUE, so the query returns nothing, and
          PostgreSQL does not warn you.

          To find missing values, write `IS NULL`. To find values that exist, write
          `IS NOT NULL`.

      - type: example
        title: The silent bug with = NULL
        md: How many orders have no discount code? Look carefully at the test.
        sql: |
          SELECT COUNT(*) AS without_code
          FROM orders
          WHERE discount_code = NULL;
        after: |
          The answer is **0**, and there is no error. Nothing equals NULL, so no row
          passes the filter. This kind of bug is silent, which makes it dangerous.
          The correct test is `WHERE discount_code IS NULL`, which you will write in
          an exercise.

      - type: example
        title: NOT IN and NULL in the same list
        md: Is the code `WELCOME99` different from every discount code in `orders`? Two versions of the check.
        sql: |
          SELECT 'WELCOME99' NOT IN (SELECT discount_code FROM orders)
                 AS with_null,
                 'WELCOME99' NOT IN (
                     SELECT discount_code
                     FROM orders
                     WHERE discount_code IS NOT NULL
                 ) AS without_null;
        after: |
          The first answer is `NULL`, not TRUE. Many orders have no discount code,
          so the list contains a NULL, and PostgreSQL cannot say for sure that
          `WELCOME99` is different from that unknown value. The second version removes
          the NULLs first, and the answer is `true`.

          > [!TIP]
          > When a list may contain NULL, a `NOT EXISTS` check (from the subqueries
          > module) is safer than `NOT IN`.

      - type: viz
        viz: join
        title: Where a WHERE clause quietly removes rows
        md: |
          Click **LEFT**. Chen appears with empty order columns. Now imagine a
          `WHERE` clause that asks for `status = 'delivered'`. Every row whose status
          is not delivered is removed, and Chen's empty row has no status at all.
        config:
          left: { name: customers, columns: [id, name], rows: [[1, Ana], [2, Ben], [3, Chen]] }
          right: { name: orders, columns: [order_id, customer_id, status], rows: [[10, 1, delivered], [11, 1, cancelled], [12, 2, cancelled]] }
          on: [id, customer_id]
          types: [left, inner]

      - type: example
        title: The LEFT JOIN that became an INNER JOIN
        md: Count all customers, and count the customers who have a delivered order. The total should be 150.
        sql: |
          SELECT COUNT(DISTINCT c.customer_id) AS customers
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          WHERE o.status = 'delivered';
        after: |
          The answer is 137, not 150. The `WHERE` clause runs after the join. A
          customer with no delivered order has NULL in `o.status`, and NULL is not
          `'delivered'`, so that customer is removed. The LEFT JOIN quietly behaved
          like an INNER JOIN.

          > [!MISTAKE]
          > A condition on the right-hand table belongs in the `ON` clause when you
          > use a LEFT JOIN, not in the `WHERE` clause.

      - type: example
        title: The same check, with the condition in ON
        md: Move the condition into the join.
        sql: |
          SELECT COUNT(DISTINCT c.customer_id) AS customers
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
                AND o.status = 'delivered';
        after: |
          Now the answer is 150. Every customer stays in the result, and only the
          delivered orders are matched to them. The 13 missing customers are the 10
          who never ordered, and 3 who have orders but none of them delivered.

      - type: quiz
        id: m20-l03-q1
        question: "Your join of orders (900 rows) to order_items returns 2,296 rows. What is the most likely reason?"
        options:
          - "The join has a typo, so the query is wrong"
          - "Each order has one to five product lines, so each order is repeated once per line"
          - "PostgreSQL counts the header row twice"
          - "The orders table has 1,396 duplicate rows"
        answer: 1
        explanation: |
          A join produces one row for each matching pair. Each order matches all of its
          product lines, so 2,296 rows is normal. The count is only a problem if you
          expected one row per order.

      - type: predict
        id: m20-l03-p1
        question: "How many rows does this query count?"
        sql: |
          SELECT COUNT(*) AS matches
          FROM customers
          WHERE 'WELCOME99' NOT IN (SELECT discount_code FROM orders);
        options: ["0", "150", "900", "An error"]
        answer: 0
        explanation: |
          The list contains NULL, so `NOT IN` gives NULL for every customer. The
          `WHERE` clause keeps only rows where the test is TRUE, so nothing passes
          and the count is 0.

      - type: predict
        id: m20-l03-p2
        question: "What does this query return?"
        sql: |
          SELECT COUNT(*) AS customer_rows,
                 COUNT(o.order_id) AS matched_orders
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          WHERE c.customer_id BETWEEN 141 AND 150;
        options: ["10 and 10", "10 and 0", "0 and 0", "An error"]
        answer: 1
        explanation: |
          Customers 141 to 150 never ordered. The LEFT JOIN keeps each of them once,
          with NULL in the order columns, so `COUNT(*)` counts 10 rows. `COUNT(o.order_id)`
          skips the NULLs, so it counts 0.

      - type: fill
        id: m20-l03-f1
        prompt: "Count the orders that have a discount code. Complete the test. Remember that NULL cannot be compared with `=`."
        template: |
          SELECT COUNT(*)
          FROM orders
          WHERE discount_code ___;
        answers:
          - ["IS NOT NULL"]
        explanation: "`IS NOT NULL` keeps the rows that have a value. The answer is 123 orders."

      - type: exercise
        id: m20-l03-e1
        title: Orders and lines for one customer
        prompt: |
          For `customer_id` 12, show two columns:

          - `orders`: the number of **different** orders
          - `order_lines`: the number of order lines (rows in `order_items`)
        solution: |
          SELECT COUNT(DISTINCT o.order_id) AS orders,
                 COUNT(*) AS order_lines
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          WHERE o.customer_id = 12;
        columnNames: true
        hints:
          - Join `orders` to `order_items`, then filter to customer 12.
          - Use `COUNT(DISTINCT o.order_id)` for the orders, and `COUNT(*)` for the lines.
          - "SELECT COUNT(DISTINCT o.___) AS orders, COUNT(___) AS order_lines FROM orders AS o JOIN order_items AS i ON i.order_id = o.order_id WHERE o.customer_id = 12;"
        explanation: |
          Customer 12 has 3 orders with 7 product lines between them. The `DISTINCT`
          keyword is what keeps the order count from being inflated by the join.
        difficulty: 1

      - type: exercise
        id: m20-l03-e2
        title: Payments and paid orders
        prompt: |
          From the `payments` table, show two columns:

          - `paid_orders`: the number of **different** orders that have a payment
          - `payment_rows`: the number of payment rows
        solution: |
          SELECT COUNT(DISTINCT order_id) AS paid_orders,
                 COUNT(*) AS payment_rows
          FROM payments;
        columnNames: true
        hints:
          - You do not need a join. Everything is in one table.
          - "`COUNT(DISTINCT order_id)` counts each order once."
          - "SELECT COUNT(DISTINCT ___) AS paid_orders, COUNT(___) AS payment_rows FROM payments;"
        explanation: |
          The two numbers differ because some orders have two payments. Asking for
          both numbers side by side is a quick way to check the grain of a table.
        difficulty: 1

      - type: exercise
        id: m20-l03-e3
        title: Fix the silent bug
        prompt: |
          The starter query should count the orders **without** a discount code, but
          it always returns 0. Fix it so the column `without_code` shows the right
          number.
        starter: |
          SELECT COUNT(*) AS without_code
          FROM orders
          WHERE discount_code = NULL;
        solution: |
          SELECT COUNT(*) AS without_code
          FROM orders
          WHERE discount_code IS NULL;
        columnNames: true
        hints:
          - Nothing can be compared with `=` when the value is NULL.
          - Use the NULL test that asks "is it missing?".
          - "WHERE discount_code ___ NULL;"
        explanation: |
          `IS NULL` finds the missing values. The result is 777, because only 123
          orders have a code and the rest are empty.
        difficulty: 2

      - type: exercise
        id: m20-l03-e4
        title: Keep every customer in the count
        prompt: |
          The starter counts customers who have a delivered order, but it
          reports only 137 customers and it hides the others. Fix it so the result
          has two columns:

          - `all_customers`: every customer, with or without orders
          - `with_delivered`: the customers who have at least one delivered order
        starter: |
          SELECT COUNT(DISTINCT c.customer_id) AS customers
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          WHERE o.status = 'delivered';
        solution: |
          SELECT COUNT(DISTINCT c.customer_id) AS all_customers,
                 COUNT(DISTINCT c.customer_id)
                     FILTER (WHERE o.status = 'delivered') AS with_delivered
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id;
        columnNames: true
        hints:
          - The `WHERE` clause removes the customers that you want to keep.
          - Remove the `WHERE` clause. Count all customers in the first column.
          - "Use COUNT(DISTINCT c.customer_id) FILTER (WHERE o.status = 'delivered') for the second column."
        explanation: |
          With no `WHERE` clause, every customer stays in the join. `FILTER` counts only
          the customers whose joined order is delivered. The result is 150 and 137.
        difficulty: 2

      - type: exercise
        id: m20-l03-e5
        title: Why is the revenue too big?
        prompt: |
          The starter below reports the revenue of delivered orders, but its answer is
          too big: it shows `234468.96`. Find the join that repeats the rows, and remove
          it.

          The result must have two columns:

          - `revenue`: the delivered revenue, rounded to 2 decimal places
          - `delivered_orders`: the number of **different** delivered orders
        starter: |
          SELECT ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          JOIN payments AS p
               ON p.order_id = o.order_id
          WHERE o.status = 'delivered';
        solution: |
          SELECT ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2) AS revenue,
                 COUNT(DISTINCT o.order_id) AS delivered_orders
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          WHERE o.status = 'delivered';
        columnNames: true
        hints:
          - Look at each JOIN. Which table has more than one row for each order?
          - The payments table has one or two rows for each order, so it repeats the order lines.
          - Remove the join to `payments`. The revenue comes from `order_items` only.
        explanation: |
          The join to `payments` repeats each order line once for every payment. An
          order with two payments has each of its lines counted twice. Without that
          join, each line is counted once. The correct revenue is 229443.50.
        difficulty: 3

      - type: read
        title: Summary
        md: |
          - Use the routine: reproduce, shrink, count, check the grain, compare.
          - After a join, one row may stand for a line, not an order. Count `DISTINCT` ids when you need orders.
          - `= NULL` never matches. Use `IS NULL` and `IS NOT NULL`.
          - A condition on the right-hand table of a LEFT JOIN belongs in `ON`.

    cheatsheet:
      - title: Count rows and distinct ids
        sql: |
          SELECT COUNT(*) AS row_count,
                 COUNT(DISTINCT o.order_id) AS order_count
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id;
        note: "If the two numbers differ, a join has repeated the orders."
      - title: Test for missing values
        sql: "WHERE discount_code IS NULL;"
        note: "Never write discount_code = NULL. It is never true."
      - title: Keep every row on the left
        sql: |
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
                AND o.status = 'delivered';
        note: "Put conditions on the right-hand table in ON, not in WHERE."
      - title: Look at a small sample
        sql: |
          SELECT *
          FROM orders
          WHERE customer_id = 6
          ORDER BY order_date, order_id
          LIMIT 5;
        note: "Shrink the problem to a few rows, and check them by hand."

  - id: m20-l04
    title: "Build a star: data warehousing"
    summary: Organise data the way analysts report on it. Learn fact and dimension tables, surrogate keys and slowly changing dimensions, and build a small star schema from the shop data.
    minutes: 40
    steps:
      - type: read
        title: Every report needs the same six joins
        md: |
          Priya asks for revenue by category, by state and by year. You write the
          query, and it works, but it joins six tables and you copy it again for every
          new question. When a column changes, you fix it in five places.

          A **data warehouse** solves this. It is a database built for reports, where
          the data is arranged once, in a shape that is easy to query. The most common
          shape is the **star schema**.

      - type: read
        title: Facts and dimensions
        md: |
          A star schema has two kinds of table.

          - A **fact table** records things that happened and holds numbers you can
            add up, such as `quantity` and `sales_amount`. Each row is one event. It
            is usually the largest table.
          - A **dimension table** describes the things around the facts: who, what,
            where and when. It holds names, categories and locations, and it has fewer
            rows.

          > [!ANALOGY]
          > A till receipt is a fact table: "2 apples, $3.00". The shop's product list
          > and the loyalty card details are the dimensions. They explain what an apple
          > is and who bought it.

      - type: read
        title: The shape of a star
        md: |
          The fact table sits in the middle, and the dimensions point at it, like the
          points of a star:

          ```text
                    dim_customer
                          |
             dim_product--fact_sales
          ```

          Every report starts from the fact table, then adds the dimensions it needs.
          That is why the report query is short: one fact table and a few simple joins.

      - type: read
        title: Choose the grain first
        md: |
          Before you build a fact table, write down its **grain** in one sentence. The
          grain says what one row stands for.

          For our sales fact table the grain is: **one row per order line**. Every
          column must fit that sentence. The order date belongs there, because each
          line has one. The product's category does not. It belongs to the product, so
          it goes in a dimension table.

      - type: example
        title: A dimension with a surrogate key
        md: |
          `dim_customer` holds one row per customer. The `customer_key` column is a
          number the warehouse makes up for each row, in customer order.
        sql: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 first_name,
                 last_name,
                 state
          FROM customers;

          SELECT customer_key, customer_id, first_name, last_name
          FROM dim_customer
          ORDER BY customer_key
          LIMIT 3;
        after: |
          `CREATE TABLE ... AS SELECT` builds a new table from a query. The result is
          a real table you can query like any other. `ROW_NUMBER() OVER (ORDER BY
          customer_id)` gives 1 to the first customer, 2 to the next, and so on.

      - type: read
        title: Why a new key?
        md: |
          A **surrogate key** is a key that the warehouse makes up, such as
          `customer_key` 1, 2, 3. The shop system already has a key, `customer_id`.
          Why do we need another one?

          Source systems change. An id can be reused, a second system can have its
          own ids, or a file can be reloaded with new numbers. If the fact table uses
          the warehouse's own key, the link between facts and dimensions is safe, and
          only the dimension needs a change.

      - type: example
        title: Flatten a dimension
        md: |
          `dim_product` copies the category name into each product. That way a report
          needs one join less.
        sql: |
          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 p.name AS product_name,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;

          SELECT product_key, product_name, category_name
          FROM dim_product
          ORDER BY product_key
          LIMIT 3;
        after: |
          Each product still has one row. The join to `categories` adds the category
          name to it. Storing a little repetition in a dimension is normal in a
          warehouse, because it makes every report simpler.

          > [!MISTAKE]
          > A dimension must have **one row per key**. If the join to a dimension can
          > return two rows for one product, every fact that points to it will be
          > repeated.

      - type: read
        title: Build the fact table
        md: |
          The fact table has one row for each order line. For each line, it looks up
          the two surrogate keys in the dimensions, and it keeps the numbers.

          The line amount is `quantity * unit_price * (1 - discount)`, the same formula
          you used in earlier modules. Storing it in the fact table means every report
          uses the same number.

          The next example builds the whole star in one script, and then answers a
          question with it.

      - type: example
        title: The whole star, and one report
        md: |
          Two dimensions, one fact table and a report that joins them. Each part
          is built in the same script, because every example starts from the
          original shop data.
        sql: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 state
          FROM customers;

          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;

          CREATE TABLE fact_sales AS
          SELECT i.order_item_id,
                 dc.customer_key,
                 dp.product_key,
                 o.order_date,
                 o.status AS order_status,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS sales_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          JOIN dim_customer AS dc
               ON dc.customer_id = o.customer_id
          JOIN dim_product AS dp
               ON dp.product_id = i.product_id;

          SELECT dp.category_name,
                 ROUND(SUM(f.sales_amount), 2) AS revenue
          FROM fact_sales AS f
          JOIN dim_product AS dp
               ON dp.product_key = f.product_key
          WHERE f.order_status = 'delivered'
            AND f.order_date >= '2024-01-01'
            AND f.order_date < '2025-01-01'
          GROUP BY dp.category_name
          ORDER BY revenue DESC, dp.category_name
          LIMIT 3;
        after: |
          The top three categories for delivered orders in 2024: Phones, Laptops and
          Kitchen. The report joins only one dimension, and the fact table already has
          the numbers and the order status.

          Notice that the report does not touch `orders`, `order_items` or `customers`
          at all. The warehouse did that work once.

      - type: quiz
        id: m20-l04-q1
        question: "In a star schema, which table is the fact table?"
        options:
          - "customers, because it lists the people"
          - "order_items, because each row is one measurable order line"
          - "categories, because it groups the products"
          - "dim_date, because it describes the calendar"
        answer: 1
        explanation: |
          The fact table records events with numbers you can add up. Each order line
          is one event. The others describe the facts, so they are dimensions.

      - type: predict
        id: m20-l04-p1
        question: "How many rows does this join return? Think about the grain of each table."
        sql: |
          SELECT COUNT(*)
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;
        options: ["14", "60", "74", "An error"]
        answer: 1
        explanation: |
          Each product has exactly one category, and each category row is matched
          once. The grain stays one row per product, so the result has 60 rows, not
          14 (the categories) and not 74 (the sum).

      - type: fill
        id: m20-l04-f1
        prompt: "Complete the query. The key must count 1, 2, 3 ... in supplier order."
        template: |
          SELECT ___ OVER (ORDER BY supplier_id) AS supplier_key,
                 supplier_id,
                 name AS supplier_name
          FROM suppliers;
        answers:
          - ["ROW_NUMBER()"]
        explanation: "`ROW_NUMBER()` numbers the rows in the order given by `ORDER BY`. Without an `ORDER BY`, the numbers could come out in any order."

      - type: read
        title: Dimensions change
        md: |
          Customers move. Products change category. A dimension whose values change
          over time is called a **slowly changing dimension**, or **SCD**. Two common
          ways to handle it:

          - **Type 1** overwrites the old value. It is simple, but the history is lost.
            After the update, every old report shows the new value.
          - **Type 2** keeps every version as its own row. Each row has `valid_from`,
            `valid_to` and `is_current` columns. History is kept, so a report for
            last year still shows the old city.

      - type: example
        title: SCD Type 1 overwrites the value
        md: Ana moves from Austin to Denver. Type 1 simply updates the row.
        dataset: blank
        sql: |
          CREATE TABLE dim_customer_t1 (
              customer_id INTEGER PRIMARY KEY,
              city        TEXT NOT NULL
          );

          INSERT INTO dim_customer_t1
          VALUES (1, 'Austin'), (2, 'Boston');

          UPDATE dim_customer_t1
          SET city = 'Denver'
          WHERE customer_id = 1;

          SELECT customer_id, city
          FROM dim_customer_t1
          ORDER BY customer_id;
        after: |
          Ana now lives in Denver, and the table is correct for today. But the fact
          that she lived in Austin has disappeared. Type 1 is right when history does
          not matter, such as fixing a typo in a name.

      - type: example
        title: SCD Type 2 keeps the history
        md: The same move, this time keeping both versions of Ana.
        dataset: blank
        sql: |
          CREATE TABLE dim_customer_t2 (
              customer_sk INTEGER GENERATED ALWAYS AS IDENTITY
                  PRIMARY KEY,
              customer_id INTEGER NOT NULL,
              city        TEXT NOT NULL,
              valid_from  DATE NOT NULL,
              valid_to    DATE NOT NULL,
              is_current  BOOLEAN NOT NULL
          );

          INSERT INTO dim_customer_t2
              (customer_id, city, valid_from, valid_to, is_current)
          VALUES (1, 'Austin', '2023-01-01', '9999-12-31', TRUE);

          UPDATE dim_customer_t2
          SET valid_to = '2024-02-29', is_current = FALSE
          WHERE customer_id = 1 AND is_current;

          INSERT INTO dim_customer_t2
              (customer_id, city, valid_from, valid_to, is_current)
          VALUES (1, 'Denver', '2024-03-01', '9999-12-31', TRUE);

          SELECT customer_id, city, valid_from, valid_to, is_current
          FROM dim_customer_t2
          ORDER BY valid_from;
        after: |
          Two rows now describe Ana. The Austin row ends on 2024-02-29, and the
          Denver row starts on 2024-03-01. `is_current` shows which row is current.
          The value `9999-12-31` is a common way to say "no end date yet".

          > [!REAL-WORLD]
          > Analysts use Type 2 for things that matter over time, such as the
          > customer's segment, the product's category or a store's manager.

      - type: quiz
        id: m20-l04-q2
        question: "A customer moves to a new city. Which approach is a Type 2 slowly changing dimension?"
        options:
          - "Overwrite the old city, so only the new value remains"
          - "Keep the old row, mark it as no longer current, and add a new row with the new city"
          - "Delete the customer and insert them again with a new name"
          - "Store the new city only in the fact table"
        answer: 1
        explanation: |
          Type 2 keeps every version as a row, with dates that show when each version
          was valid. Overwriting the value is Type 1.

      - type: exercise
        id: m20-l04-e1
        title: Build dim_customer
        prompt: |
          Create a table called `dim_customer` with the columns `customer_key`,
          `customer_id`, `first_name`, `last_name` and `state`, in that order.

          `customer_key` must be 1 for the customer with the lowest `customer_id`,
          2 for the next one, and so on. Use `ROW_NUMBER()`, numbered by `customer_id`.
        starter: |
          CREATE TABLE dim_customer AS
          SELECT customer_id
          FROM customers;
        solution: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 first_name,
                 last_name,
                 state
          FROM customers;
        check: |
          SELECT customer_key, customer_id, first_name, last_name, state
          FROM dim_customer
          WHERE customer_key <= 5
          ORDER BY customer_key;
        columnNames: true
        hints:
          - You need `CREATE TABLE dim_customer AS SELECT ...`, with the columns named in the prompt.
          - Add `ROW_NUMBER() OVER (ORDER BY customer_id) AS customer_key` as the first column.
          - "SELECT ROW_NUMBER() OVER (ORDER BY ___) AS customer_key, customer_id, first_name, last_name, state FROM customers;"
        explanation: |
          The table is created by the query, so the check reads the first five keys.
          The `ORDER BY customer_id` inside `OVER` decides which customer gets which
          number. It is separate from the order of the rows you see when you query
          the table, which needs its own `ORDER BY`.
        difficulty: 1

      - type: exercise
        id: m20-l04-e2
        title: Build dim_product
        prompt: |
          Create a table called `dim_product` with the columns `product_key`,
          `product_id`, `product_name` and `category_name`, in that order.

          `product_key` must be 1 for the product with the lowest `product_id`, 2 for
          the next one, and so on. Get the category name from `categories`.
        starter: |
          CREATE TABLE dim_product AS
          SELECT product_id
          FROM products;
        solution: |
          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 p.name AS product_name,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;
        check: |
          SELECT product_key, product_id, product_name, category_name
          FROM dim_product
          WHERE product_key <= 5
          ORDER BY product_key;
        columnNames: true
        hints:
          - Join `products` to `categories` on `category_id`, as in the example.
          - Use `p.name AS product_name` and `c.name AS category_name`, so the names are clear.
          - "...SELECT ROW_NUMBER() OVER (ORDER BY p.___) AS product_key, p.product_id ... FROM products AS p JOIN categories AS c ON c.category_id = p.category_id;"
        explanation: |
          A join to `categories` gives every product its category name. Because each
          product has one category, the table still has one row per product.
        difficulty: 1

      - type: exercise
        id: m20-l04-e3
        title: Build fact_sales
        prompt: |
          The tables `dim_customer` and `dim_product` already exist. They were built
          as in the example, so you can use them.

          Create a table called `fact_sales` with one row for each order line. Use
          these columns, in this order:

          - `order_item_id` from `order_items`
          - `customer_key` from `dim_customer`
          - `product_key` from `dim_product`
          - `order_date` from `orders`
          - `order_status` from `orders.status`
          - `quantity`
          - `sales_amount`, which is `quantity * unit_price * (1 - discount)`, with no rounding

          Join each line to its order, and then to both dimensions.
        setup: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 state
          FROM customers;

          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;
        solution: |
          CREATE TABLE fact_sales AS
          SELECT i.order_item_id,
                 dc.customer_key,
                 dp.product_key,
                 o.order_date,
                 o.status AS order_status,
                 i.quantity,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS sales_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          JOIN dim_customer AS dc
               ON dc.customer_id = o.customer_id
          JOIN dim_product AS dp
               ON dp.product_id = i.product_id;
        check: |
          SELECT COUNT(*) AS fact_rows,
                 COUNT(DISTINCT customer_key) AS customers,
                 ROUND(SUM(sales_amount), 2) AS total_amount
          FROM fact_sales;
        columnNames: true
        hints:
          - Start from `order_items`, because the fact has one row for each of its lines.
          - Join `orders` on `order_id`, then join `dim_customer` and `dim_product` for their keys.
          - "...FROM order_items AS i JOIN orders AS o ON o.order_id = i.order_id JOIN dim_customer AS dc ON dc.customer_id = o.customer_id ___ dim_product AS dp ON dp.product_id = i.product_id;"
        explanation: |
          The fact table keeps the 2,296 order lines, one row each. The check counts
          the rows, the customers and the total, so a join that repeats or loses
          lines is caught immediately.
        difficulty: 2

      - type: exercise
        id: m20-l04-e4
        title: Revenue by category, 2024
        prompt: |
          Use the tables `dim_product` and `fact_sales`. They already exist, because
          they were built in the exercise above.

          Show `category_name` and `revenue`. The `revenue` is the sum of
          `sales_amount` for **delivered** orders placed in **2024**, rounded to
          2 decimal places.

          Sort the rows by `revenue` from highest to lowest, then by `category_name`.
        setup: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 state
          FROM customers;

          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;

          CREATE TABLE fact_sales AS
          SELECT i.order_item_id,
                 dc.customer_key,
                 dp.product_key,
                 o.order_date,
                 o.status AS order_status,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS sales_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          JOIN dim_customer AS dc
               ON dc.customer_id = o.customer_id
          JOIN dim_product AS dp
               ON dp.product_id = i.product_id;
        solution: |
          SELECT dp.category_name,
                 ROUND(SUM(f.sales_amount), 2) AS revenue
          FROM fact_sales AS f
          JOIN dim_product AS dp
               ON dp.product_key = f.product_key
          WHERE f.order_status = 'delivered'
            AND f.order_date >= '2024-01-01'
            AND f.order_date < '2025-01-01'
          GROUP BY dp.category_name
          ORDER BY revenue DESC, dp.category_name;
        ordered: true
        columnNames: true
        hints:
          - Filter the fact table first, on `order_status` and on the 2024 dates.
          - Join to `dim_product` on `product_key`, and group by `category_name`.
          - "...FROM fact_sales AS f JOIN dim_product AS dp ON dp.product_key = f.product_key WHERE f.order_status = ___ GROUP BY dp.category_name ORDER BY ___ DESC, ___;"
        explanation: |
          Only the fact table and one dimension are needed, because the status and the
          date were copied into the fact table. Eleven categories sold delivered
          goods in 2024. Phones is first, with $39,650.34.
        difficulty: 2

      - type: exercise
        id: m20-l04-e5
        title: Top three states, with a star
        prompt: |
          Use `dim_customer` and `fact_sales`. They already exist, because they were
          built in the exercise above.

          For **delivered** orders placed in **2024**, show three columns:

          - `state`: the customer's state, from `dim_customer`
          - `customers`: the number of **different** customers (`customer_key`)
          - `revenue`: the sum of `sales_amount`, rounded to 2 decimal places

          Show the **3 states with the highest revenue**. Sort by `revenue` from
          highest to lowest, then by `state`.
        setup: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 state
          FROM customers;

          CREATE TABLE dim_product AS
          SELECT ROW_NUMBER() OVER (ORDER BY p.product_id)
                 AS product_key,
                 p.product_id,
                 c.name AS category_name
          FROM products AS p
          JOIN categories AS c
               ON c.category_id = p.category_id;

          CREATE TABLE fact_sales AS
          SELECT i.order_item_id,
                 dc.customer_key,
                 dp.product_key,
                 o.order_date,
                 o.status AS order_status,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS sales_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          JOIN dim_customer AS dc
               ON dc.customer_id = o.customer_id
          JOIN dim_product AS dp
               ON dp.product_id = i.product_id;
        solution: |
          SELECT dc.state,
                 COUNT(DISTINCT f.customer_key) AS customers,
                 ROUND(SUM(f.sales_amount), 2) AS revenue
          FROM fact_sales AS f
          JOIN dim_customer AS dc
               ON dc.customer_key = f.customer_key
          WHERE f.order_status = 'delivered'
            AND f.order_date >= '2024-01-01'
            AND f.order_date < '2025-01-01'
          GROUP BY dc.state
          ORDER BY revenue DESC, dc.state
          LIMIT 3;
        ordered: true
        columnNames: true
        hints:
          - Group the report by the state, which lives in `dim_customer`.
          - Count customers with `COUNT(DISTINCT f.customer_key)`, not `COUNT(*)`, so each customer counts once.
          - "...GROUP BY dc.state ORDER BY ___ DESC, ___ LIMIT ___;"
        explanation: |
          `COUNT(DISTINCT ...)` counts each customer once, even when a customer has many
          lines. Ordering by `state` after `revenue` makes the rows complete, and the
          third place (New York, $17,151.14) is not tied with the next state.
        difficulty: 3

      - type: exercise
        id: m20-l04-e6
        title: Keep Ana's history
        dataset: blank
        prompt: |
          Ana (`customer_id` 1) moved from Austin to Denver on **2024-03-01**. The
          table `dim_customer_t2` already has her Austin row, which starts on
          2023-01-01 and has no end yet.

          Keep her history, Type 2 style. Write two statements:

          1. Close the Austin row: set `valid_to` to `'2024-02-29'` and `is_current`
             to `FALSE`.
          2. Add a Denver row for customer 1 with `city` `'Denver'`, `valid_from`
             `'2024-03-01'`, `valid_to` `'9999-12-31'` and `is_current` `TRUE`.

          The starter below overwrites the city instead. That is Type 1, and it loses
          the Austin history.
        setup: |
          CREATE TABLE dim_customer_t2 (
              customer_sk INTEGER GENERATED ALWAYS AS IDENTITY
                  PRIMARY KEY,
              customer_id INTEGER NOT NULL,
              city        TEXT NOT NULL,
              valid_from  DATE NOT NULL,
              valid_to    DATE NOT NULL,
              is_current  BOOLEAN NOT NULL
          );

          INSERT INTO dim_customer_t2
              (customer_id, city, valid_from, valid_to, is_current)
          VALUES (1, 'Austin', '2023-01-01', '9999-12-31', TRUE);
        starter: |
          UPDATE dim_customer_t2
          SET city = 'Denver'
          WHERE customer_id = 1;
        solution: |
          UPDATE dim_customer_t2
          SET valid_to = '2024-02-29',
              is_current = FALSE
          WHERE customer_id = 1
            AND is_current;

          INSERT INTO dim_customer_t2
              (customer_id, city, valid_from, valid_to, is_current)
          VALUES (1, 'Denver', '2024-03-01', '9999-12-31', TRUE);
        check: |
          SELECT customer_id, city, valid_from, valid_to, is_current
          FROM dim_customer_t2
          ORDER BY valid_from;
        columnNames: true
        hints:
          - You need an UPDATE to close the old row, and an INSERT to add the new one.
          - "The old row is the one where `is_current` is still TRUE, so filter with `WHERE customer_id = 1 AND is_current`."
          - "UPDATE dim_customer_t2 SET valid_to = '2024-02-29', is_current = ___ WHERE customer_id = 1 AND is_current; INSERT INTO dim_customer_t2 (...) VALUES (1, 'Denver', ___, '9999-12-31', TRUE);"
        explanation: |
          Type 2 never overwrites history. It closes the old row with an end date and
          adds a new row with a start date. The check shows two rows, and the report
          for early 2024 can still find Ana in Austin.
        difficulty: 3

      - type: read
        title: Summary
        md: |
          - A star schema has one **fact table** of events with numbers, and **dimension tables** that describe them.
          - Decide the **grain** first. Write it in one sentence.
          - Use **surrogate keys** (`ROW_NUMBER()`) to link facts and dimensions.
          - **Type 1** overwrites a value. **Type 2** keeps every version with dates.

    cheatsheet:
      - title: Build a dimension table
        sql: |
          CREATE TABLE dim_customer AS
          SELECT ROW_NUMBER() OVER (ORDER BY customer_id)
                 AS customer_key,
                 customer_id,
                 state
          FROM customers;
        note: "CREATE TABLE ... AS SELECT builds a table from a query."
      - title: Star report
        sql: |
          SELECT dp.category_name,
                 ROUND(SUM(f.sales_amount), 2) AS revenue
          FROM fact_sales AS f
          JOIN dim_product AS dp
               ON dp.product_key = f.product_key
          GROUP BY dp.category_name;
        note: "One fact table, then one join for each dimension you need."
      - title: SCD Type 2, close and add
        sql: |
          UPDATE dim_customer_t2
          SET valid_to = '2024-02-29', is_current = FALSE
          WHERE customer_id = 1 AND is_current;

          INSERT INTO dim_customer_t2
              (customer_id, city, valid_from, valid_to, is_current)
          VALUES (1, 'Denver', '2024-03-01', '9999-12-31', TRUE);
        note: "Keep the old row, and add a new current row."

  - id: m20-l05
    title: "Trust, but verify: testing your queries"
    summary: A query that runs is not always a query that is right. Test NULLs, duplicates, ties and empty groups, and reconcile your totals against a second source.
    minutes: 35
    steps:
      - type: read
        title: It ran, so it must be right?
        md: |
          You are about to send the quarterly revenue to Priya. The query ran without
          an error, and the number looks sensible. Is it right?

          "No error" only means the query was valid SQL. It says nothing about whether
          the answer matches the business. Professional analysts test their results
          before anyone relies on them. They do it the way a scientist does: they look
          for a second way to get the same answer.

      - type: read
        title: A testing checklist
        md: |
          Before you trust a result, ask these five questions:

          1. **NULLs.** Do missing values change the count or the sum?
          2. **Duplicates.** Did a join repeat rows? Compare `COUNT(*)` with
             `COUNT(DISTINCT id)`.
          3. **Ties.** If two rows have the same value, does a `LIMIT` cut between them?
          4. **Empty groups.** What happens when nothing matches? Is the answer `0`
             or `NULL`?
          5. **Reconciliation.** Do two independent sources of the same total agree?

          The next examples test each of these in turn.

      - type: example
        title: Duplicates after a join
        md: Every customer is joined to their orders. How many rows, and how many customers?
        sql: |
          SELECT COUNT(*) AS joined_rows,
                 COUNT(DISTINCT c.customer_id) AS customers
          FROM customers AS c
          JOIN orders AS o
               ON o.customer_id = c.customer_id;
        after: |
          The join gives 900 rows, one for each order, but only 140 different
          customers. Both numbers are correct, and they measure different things. If
          your report says "customers" and shows 900, a test like this one catches the
          mistake.

      - type: example
        title: "Empty groups: no rows is not zero"
        md: What is the total price of products that cost less than zero? There are none.
        sql: |
          SELECT SUM(price) AS total,
                 COUNT(*) AS products
          FROM products
          WHERE price < 0;
        after: |
          The count is `0`, but the sum is `NULL`. `SUM` of no rows is not zero. It is
          unknown, which PostgreSQL shows as `NULL`. In a report, use
          `COALESCE(SUM(price), 0)` when you want to show a plain 0.

      - type: read
        title: Ties at the edge of a list
        md: |
          In the previous lesson you saw that a `LIMIT` needs a tie-breaker. The test
          is to look at the values right at the edge. Group the top prices and count
          how many products share each price.

      - type: example
        title: Who shares a price?
        md: Count the products at each high price.
        sql: |
          SELECT price,
                 COUNT(*) AS products
          FROM products
          WHERE price >= 800
          GROUP BY price
          ORDER BY price DESC;
        after: |
          Three prices belong to one product each. The price 899.99 belongs to two
          products. A `LIMIT 4` would cut between them, so the fourth place is a tie.
          Add a unique tie-breaker, such as `product_id`, or use `RANK()` as you will
          in the exercises.

      - type: example
        title: Reconcile payments with orders
        md: |
          The payments table and the order lines are two independent sources. For every
          order that has payments, the order total should equal the sum of its payments.
        sql: |
          WITH totals AS (
              SELECT o.order_id,
                     ROUND(SUM(i.quantity * i.unit_price
                               * (1 - i.discount)), 2) AS total
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              GROUP BY o.order_id
          ),
          paid AS (
              SELECT order_id,
                     SUM(amount) AS paid_amount
              FROM payments
              GROUP BY order_id
          )
          SELECT COUNT(*) AS paid_orders,
                 COUNT(*) FILTER (
                     WHERE p.paid_amount <> t.total
                 ) AS mismatches
          FROM totals AS t
          JOIN paid AS p
               ON p.order_id = t.order_id;
        after: |
          758 orders have payments, and none of them mismatches. Two independent
          calculations agree to the cent, and that agreement is what gives you
          confidence.

          `FILTER (WHERE ...)` counts only the rows that match the condition, here the
          orders that differ.

      - type: read
        title: A mismatch is a question
        md: |
          When two totals do not agree, do not panic and do not hide the difference.
          Ask what the difference means. In this database, 15 orders that were not
          cancelled have **no payment row at all**. They are still waiting to be paid,
          or the payment is missing. That is an important finding, and it is exactly
          what a reconciliation is meant to find.

          > [!MISTAKE]
          > Do not "fix" a test by removing the rows that fail it. First explain them.

      - type: quiz
        id: m20-l05-q1
        question: "Which pair of numbers tells you that a join repeated some rows?"
        options:
          - "COUNT(*) is larger than COUNT(DISTINCT id) for the same id"
          - "The query returns exactly 10 rows"
          - "The query has a LIMIT clause"
          - "The result has NULL in the first column"
        answer: 0
        explanation: |
          If `COUNT(*)` is bigger than the number of distinct ids, some ids appear
          more than once. That is the fingerprint of a repeating join.

      - type: predict
        id: m20-l05-p1
        question: "What does this query return?"
        sql: |
          SELECT SUM(price) AS total,
                 COUNT(*) AS products
          FROM products
          WHERE price < 0;
        options: ["0 and 0", "NULL and 0", "NULL and NULL", "An error"]
        answer: 1
        explanation: |
          `COUNT(*)` of no rows is 0, but `SUM` of no rows is NULL. This is one of the
          most common surprises in reports.

      - type: fill
        id: m20-l05-f1
        prompt: "Show 0 instead of NULL when there are no products with a negative price. Complete the query."
        template: |
          SELECT COALESCE(___, 0) AS total
          FROM products
          WHERE price < 0;
        answers:
          - ["SUM(price)"]
        explanation: "`COALESCE` returns the first value that is not NULL. The query returns one row with 0, instead of one row with NULL."

      - type: exercise
        id: m20-l05-e1
        title: Orders and customers
        prompt: |
          From the `orders` table, show two columns:

          - `orders`: the number of orders
          - `customers`: the number of **different** customers who placed them
        solution: |
          SELECT COUNT(*) AS orders,
                 COUNT(DISTINCT customer_id) AS customers
          FROM orders;
        columnNames: true
        hints:
          - "`COUNT(*)` counts rows. `COUNT(DISTINCT ...)` counts each value once."
          - Use `COUNT(DISTINCT customer_id)` for the second column.
          - "SELECT COUNT(___) AS orders, COUNT(DISTINCT ___) AS customers FROM orders;"
        explanation: |
          There are 900 orders, placed by 140 different customers. Comparing the two
          numbers is a quick way to see how many orders each customer places.
        difficulty: 1

      - type: exercise
        id: m20-l05-e2
        title: Customers with and without orders
        prompt: |
          Use `customers` and `orders`. Show two columns:

          - `with_orders`: the number of customers who have at least one order
          - `without_orders`: the number of customers who have no order

          Count each customer once.
        solution: |
          SELECT COUNT(DISTINCT c.customer_id)
                     FILTER (WHERE o.order_id IS NOT NULL)
                     AS with_orders,
                 COUNT(DISTINCT c.customer_id)
                     FILTER (WHERE o.order_id IS NULL)
                     AS without_orders
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id;
        columnNames: true
        hints:
          - A LEFT JOIN keeps the customers who have no orders. Their order columns are NULL.
          - "`FILTER (WHERE o.order_id IS NULL)` counts only the customers without a match."
          - "...COUNT(DISTINCT c.customer_id) FILTER (WHERE o.order_id ___ NULL) AS without_orders FROM customers AS c LEFT JOIN orders AS o ON ...;"
        explanation: |
          140 customers have at least one order, and 10 have none. The two counts add
          up to the 150 customers, which is a useful check of your query.
        difficulty: 1

      - type: exercise
        id: m20-l05-e3
        title: Zero, not NULL
        prompt: |
          For the customers with `customer_id` from 138 to 142, show two columns:

          - `customer_id`
          - `total_spent`: the total of their orders, rounded to 2 decimal places.
            A customer with no orders must show `0`, not `NULL`.

          Sort the rows by `customer_id`.
        starter: |
          SELECT c.customer_id,
                 ROUND(SUM(i.quantity * i.unit_price * (1 - i.discount)), 2)
                     AS total_spent
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          LEFT JOIN order_items AS i
                 ON i.order_id = o.order_id
          WHERE c.customer_id BETWEEN 138 AND 142
          GROUP BY c.customer_id
          ORDER BY c.customer_id;
        solution: |
          SELECT c.customer_id,
                 COALESCE(ROUND(SUM(i.quantity * i.unit_price
                                    * (1 - i.discount)), 2), 0)
                     AS total_spent
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          LEFT JOIN order_items AS i
                 ON i.order_id = o.order_id
          WHERE c.customer_id BETWEEN 138 AND 142
          GROUP BY c.customer_id
          ORDER BY c.customer_id;
        ordered: true
        columnNames: true
        hints:
          - The starter shows `NULL` for customers 141 and 142. Find out why.
          - Wrap the rounded sum in `COALESCE(..., 0)`.
          - "COALESCE(ROUND(SUM(...), 2), ___) AS total_spent"
        explanation: |
          Customers 141 and 142 have no order lines, so their sum is `NULL`. `COALESCE`
          replaces that `NULL` with 0. The other three customers keep their totals.
        difficulty: 2

      - type: exercise
        id: m20-l05-e4
        title: Do the two totals agree?
        prompt: |
          Reconcile the payments with the orders. Show two columns:

          - `payments_total`: the sum of **all** `amount` values in `payments`,
            rounded to 2 decimal places
          - `paid_order_total`: the sum of the **order totals** for orders that have at
            least one payment, rounded to 2 decimal places

          An order total is `quantity * unit_price * (1 - discount)`, summed over the
          order's lines. Round each order total to 2 decimal places before you add them.
        solution: |
          WITH totals AS (
              SELECT o.order_id,
                     ROUND(SUM(i.quantity * i.unit_price
                               * (1 - i.discount)), 2) AS total
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              GROUP BY o.order_id
          )
          SELECT ROUND((SELECT SUM(amount) FROM payments), 2)
                     AS payments_total,
                 ROUND(SUM(t.total), 2) AS paid_order_total
          FROM totals AS t
          WHERE t.order_id IN (SELECT order_id FROM payments);
        columnNames: true
        hints:
          - First build one row per order with its total, in a CTE.
          - Keep only the orders that appear in `payments`, using `WHERE order_id IN (...)`.
          - "Use ROUND(SUM(amount), 2) on payments to get the other total."
        explanation: |
          Both totals are 263,983.37, so the two sources agree. This is a reconciliation.
          If the numbers had differed, the next step would be to find the orders
          that caused the gap.
        difficulty: 2

      - type: exercise
        id: m20-l05-e5
        title: Orders that have no payment
        prompt: |
          Find the orders that are **not cancelled** and have **no** payment rows.

          Show four columns: `order_id`, `status`, `total` and `paid`. `total` is the
          order total, rounded to 2 decimal places. `paid` is the amount paid, with
          `0` when there is no payment.

          Sort the rows by `order_id`.
        solution: |
          WITH totals AS (
              SELECT o.order_id,
                     o.status,
                     ROUND(SUM(i.quantity * i.unit_price
                               * (1 - i.discount)), 2) AS total
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              GROUP BY o.order_id, o.status
          ),
          paid AS (
              SELECT order_id,
                     SUM(amount) AS paid_amount
              FROM payments
              GROUP BY order_id
          )
          SELECT t.order_id,
                 t.status,
                 t.total,
                 COALESCE(p.paid_amount, 0) AS paid
          FROM totals AS t
          LEFT JOIN paid AS p
                 ON p.order_id = t.order_id
          WHERE t.status <> 'cancelled'
            AND p.order_id IS NULL
          ORDER BY t.order_id;
        ordered: true
        columnNames: true
        hints:
          - Build one row per order with its total, and one row per paid order. Then compare them.
          - A LEFT JOIN from the totals to the payments leaves NULL where no payment exists.
          - "...WHERE t.status ___ 'cancelled' AND p.order_id IS ___ ORDER BY t.order_id;"
        explanation: |
          Fifteen orders are waiting for payment or have a missing payment row. The
          `COALESCE` makes the `paid` column show 0 for them. Finding these orders is the
          reconciliation step; the next step is to decide what they mean.
        difficulty: 3

      - type: exercise
        id: m20-l05-e6
        title: Top four prices, including ties
        prompt: |
          Show every product whose price is in the **top 4 prices**, counting ties.
          Use `RANK()` with the highest price first.

          Show four columns: `product_id`, `name`, `price` and `price_rank`.
          Sort the rows by `price_rank`, then by `product_id`.

          Two products share the fourth place, so the result has more than 4 rows.
        solution: |
          SELECT product_id,
                 name,
                 price,
                 price_rank
          FROM (
              SELECT product_id,
                     name,
                     price,
                     RANK() OVER (ORDER BY price DESC) AS price_rank
              FROM products
          ) AS ranked
          WHERE price_rank <= 4
          ORDER BY price_rank, product_id;
        ordered: true
        columnNames: true
        hints:
          - Put the `RANK()` in a subquery, then filter on the rank in the outer query.
          - "`RANK()` gives tied rows the same number, so both 899.99 products get 4."
          - "SELECT ... FROM (SELECT ..., RANK() OVER (ORDER BY price ___) AS price_rank FROM products) AS ranked WHERE price_rank <= 4 ORDER BY ___, ___;"
        explanation: |
          `RANK()` gives equal prices the same rank, so ties at the edge stay together.
          That is the honest answer to "the top 4 prices": five products. `ROW_NUMBER()`
          would have cut one of them, and it would have chosen one arbitrarily.
        difficulty: 3

    cheatsheet:
      - title: Rows versus distinct values
        sql: |
          SELECT COUNT(*) AS row_count,
                 COUNT(DISTINCT customer_id) AS customer_count
          FROM orders;
        note: "If the two numbers differ, some ids repeat."
      - title: Zero instead of NULL
        sql: "SELECT COALESCE(SUM(price), 0) AS total FROM products WHERE price < 0;"
        note: "SUM of no rows is NULL. COUNT of no rows is 0."
      - title: Count only the matching rows
        sql: |
          SELECT COUNT(*) FILTER (WHERE status = 'cancelled')
                 AS cancelled_orders
          FROM orders;
        note: "FILTER counts only the rows that match, in the same query as the other counts."
      - title: Keep ties in a top list
        sql: |
          SELECT *
          FROM (
              SELECT name, price,
                     RANK() OVER (ORDER BY price DESC) AS price_rank
              FROM products
          ) AS ranked
          WHERE price_rank <= 4;
        note: "RANK() keeps tied rows. ROW_NUMBER() would cut one of them."

  - id: m20-l06
    title: "The SQL interview playbook"
    summary: Learn a calm, repeatable way to solve an SQL interview problem out loud, then practise the classic questions, including the tie trap, top-N per group and "never happened".
    minutes: 40
    steps:
      - type: read
        title: The whiteboard moment
        md: |
          The interviewer smiles and says: "Write a query for the second highest value.
          Talk me through it." Your mind goes blank. You know the SQL words, but not
          where to start.

          That is normal. Interviewers are not testing whether you remember every
          keyword. They want to see how you think. A **playbook**, a set of steps you
          repeat every time, gives your mind something to hold on to.

      - type: read
        title: The six-step playbook
        md: |
          1. **Restate the question** in your own words, and say it out loud.
          2. **Clarify the grain and the output.** "One row per what? Which columns?
             In which order?"
          3. **Ask about edge cases.** Ties, NULLs, empty results, duplicates.
          4. **Sketch the output** on paper: the column names and two example rows.
          5. **Build step by step.** One table, then a filter, then a join, then a
             group, then the sort. Check each step before you add the next.
          6. **Test on a tiny example**, then explain the trade-offs you made.

          > [!ANALOGY]
          > Pilots run a checklist before every take-off, even when they have flown
          > a thousand times. The checklist is not for beginners. It stops the big
          > mistake when you are under pressure.

      - type: example
        title: The tie trap, part 1
        md: "The interviewer asks for the **second highest** quantity on an order line. You write `OFFSET 1`."
        sql: |
          SELECT quantity
          FROM order_items
          ORDER BY quantity DESC
          LIMIT 1 OFFSET 1;
        after: |
          The answer is `5`, which is the highest value, not the second. The second row
          is also a 5, because many order lines have a quantity of 5. `OFFSET 1` skips
          one **row**, not one **value**.

          > [!MISTAKE]
          > Whenever a question says "second", "third" or "Nth", ask whether the values
          > can repeat. If they can, `DISTINCT` must come first.

      - type: example
        title: The tie trap, part 2
        md: The fix is to remove the repeated values before you count places.
        sql: |
          SELECT DISTINCT quantity
          FROM order_items
          ORDER BY quantity DESC
          LIMIT 1 OFFSET 1;
        after: |
          Now the answer is `4`. `DISTINCT` keeps one row for each quantity, so
          `OFFSET 1` skips the top value and gives the second one. Say this out loud in
          an interview: "I need distinct values, because I am ranking values, not
          rows."

      - type: stepper
        title: The latest order per customer, step by step
        md: |
          The classic question: "For each customer, show their most recent order."
          Here we look at one customer, with 13 orders, so each step stays small.
          Click through the stages.
        stages:
          - label: Sort the orders
            md: Start with every order of customer 1, newest first. The order_id breaks ties on the same date.
            sql: |
              SELECT customer_id, order_id, order_date
              FROM orders
              WHERE customer_id = 1
              ORDER BY order_date DESC, order_id DESC;
          - label: Number them
            md: "ROW_NUMBER() gives 1 to the newest order of each customer, then 2, 3 and so on."
            sql: |
              SELECT customer_id, order_id, order_date,
                     ROW_NUMBER() OVER (
                         PARTITION BY customer_id
                         ORDER BY order_date DESC, order_id DESC
                     ) AS rn
              FROM orders
              WHERE customer_id = 1
              ORDER BY rn;
          - label: Keep number 1
            md: Wrap the numbering in a subquery, and keep the rows numbered 1.
            sql: |
              SELECT customer_id, order_id, order_date
              FROM (
                  SELECT customer_id, order_id, order_date,
                         ROW_NUMBER() OVER (
                             PARTITION BY customer_id
                             ORDER BY order_date DESC, order_id DESC
                         ) AS rn
                  FROM orders
                  WHERE customer_id = 1
              ) AS t
              WHERE rn = 1;

      - type: example
        title: "Products never sold: NOT EXISTS"
        md: "Which products have never appeared on an order line? Ask it in words first: no matching row exists."
        sql: |
          SELECT p.product_id,
                 p.name
          FROM products AS p
          WHERE NOT EXISTS (
              SELECT 1
              FROM order_items AS i
              WHERE i.product_id = p.product_id
          )
          ORDER BY p.product_id;
        after: |
          Five products have never been sold. `NOT EXISTS` reads almost like the
          question, which makes it easy to explain to an interviewer. It also works
          safely when the inner query can return NULL, unlike `NOT IN`.

      - type: read
        title: Practise the way you will be asked
        md: |
          In an interview, the same question appears in many forms. Practise the
          patterns, not the exact answers:

          - **Second highest, or the Nth:** `DISTINCT` plus `OFFSET`, or `DENSE_RANK()`.
          - **Top N per group:** `ROW_NUMBER()` with `PARTITION BY`, filtered in a subquery.
          - **Never happened:** `NOT EXISTS`, or a `LEFT JOIN` with `IS NULL`.
          - **Happened in both periods:** `INTERSECT`, or two `EXISTS`.
          - **Compared with an average:** a subquery that uses the group's own average.

      - type: quiz
        id: m20-l06-q1
        question: "The interviewer asks a question you do not understand yet. What is the best first move?"
        options:
          - "Start typing a query, and fix it when it fails"
          - "Restate the question and ask about the grain and the output"
          - "Write the most complicated query you know"
          - "Say nothing until the query is finished"
        answer: 1
        explanation: |
          Restating the question shows you understand it, and asking about the output
          prevents a wrong answer to the wrong question. Interviewers expect questions.

      - type: predict
        id: m20-l06-p1
        question: "What does this query return?"
        sql: |
          SELECT DISTINCT discount
          FROM order_items
          ORDER BY discount DESC
          LIMIT 1 OFFSET 2;
        options: ["0.20", "0.15", "0.10", "0.05"]
        answer: 2
        explanation: |
          The distinct discounts from highest to lowest are 0.20, 0.15, 0.10, 0.05 and
          0.00. `OFFSET 2` skips two of them, so the third value, 0.10, is returned.

      - type: fill
        id: m20-l06-f1
        prompt: "Complete the query. It keeps only the newest order of each customer 1 to 3."
        template: |
          SELECT customer_id, order_id, order_date
          FROM (
              SELECT customer_id, order_id, order_date,
                     ___ OVER (
                         PARTITION BY customer_id
                         ORDER BY order_date DESC, order_id DESC
                     ) AS rn
              FROM orders
              WHERE customer_id <= 3
          ) AS t
          WHERE rn = 1
          ORDER BY customer_id;
        answers:
          - ["ROW_NUMBER()"]
        explanation: "`ROW_NUMBER()` gives each row of a customer a number from 1 upwards. The `PARTITION BY` restarts the numbers for each customer, and `rn = 1` keeps the newest."

      - type: exercise
        id: m20-l06-e1
        title: The second highest discount
        prompt: |
          Find the **second highest discount** that appears in `order_items`.

          Show one column, `discount`, with one row. Count distinct discount values:
          the highest is the first distinct value, and you want the next one.
        solution: |
          SELECT DISTINCT discount
          FROM order_items
          ORDER BY discount DESC
          LIMIT 1 OFFSET 1;
        columnNames: true
        hints:
          - Think about the values, not the rows. Many lines share the same discount.
          - Use `DISTINCT` to keep one row for each discount.
          - "SELECT DISTINCT discount FROM order_items ORDER BY discount ___ LIMIT 1 OFFSET ___;"
        explanation: |
          The discounts are 0.20, 0.15, 0.10, 0.05 and 0.00. The second highest is 0.15.
          Without `DISTINCT`, the second row would still be 0.20, the same trap as in the
          example.
        difficulty: 1

      - type: exercise
        id: m20-l06-e2
        title: The top two products in each category
        prompt: |
          For each category, show its **two most expensive products**.

          Show four columns: `category_id`, `product_id`, `name` and `price`.

          If two products in a category have the same price, the one with the lower
          `product_id` ranks first. Sort the rows by `category_id`, then by `price` from
          highest to lowest, then by `product_id`.
        solution: |
          SELECT category_id,
                 product_id,
                 name,
                 price
          FROM (
              SELECT category_id,
                     product_id,
                     name,
                     price,
                     ROW_NUMBER() OVER (
                         PARTITION BY category_id
                         ORDER BY price DESC, product_id
                     ) AS rn
              FROM products
          ) AS t
          WHERE rn <= 2
          ORDER BY category_id, price DESC, product_id;
        ordered: true
        columnNames: true
        hints:
          - "Number the products in each category with `ROW_NUMBER()`, then keep the numbers 1 and 2."
          - "`PARTITION BY category_id` restarts the numbers for each category."
          - "...ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY price DESC, ___) AS rn ... WHERE rn <= ___ ORDER BY category_id, price DESC, ___;"
        explanation: |
          The tie-breaker `product_id` makes each category's top two products the same
          every time. Each of the 11 categories that has products shows two rows, so
          the result has 22 rows.
        difficulty: 2

      - type: exercise
        id: m20-l06-e3
        title: Customers who stopped ordering
        prompt: |
          Count the customers who placed at least one order in **2023**, but **no**
          order in **2024**.

          Show one column, `customers`, with one row. Use `NOT EXISTS` for the 2024
          check.
        solution: |
          SELECT COUNT(*) AS customers
          FROM customers AS c
          WHERE EXISTS (
                  SELECT 1
                  FROM orders AS o
                  WHERE o.customer_id = c.customer_id
                    AND o.order_date < '2024-01-01'
              )
            AND NOT EXISTS (
                  SELECT 1
                  FROM orders AS o
                  WHERE o.customer_id = c.customer_id
                    AND o.order_date >= '2024-01-01'
              );
        columnNames: true
        hints:
          - You need two checks for each customer. One says "ordered in 2023", the other says "not ordered in 2024".
          - Use `EXISTS` for the first check and `NOT EXISTS` for the second.
          - "WHERE EXISTS (SELECT 1 FROM orders AS o WHERE o.customer_id = c.customer_id AND o.order_date < ___) AND ___ EXISTS (...);"
        explanation: |
          Six customers bought in 2023 and did not buy again in 2024. Interviewers like
          this question because it is about business behaviour, and two `EXISTS`
          checks answer it directly.
        difficulty: 2

      - type: exercise
        id: m20-l06-e4
        title: Customers who ordered in both years
        prompt: |
          Count the customers who placed at least one order in **2023** and at least
          one order in **2024**.

          Show one column, `customers`, with one row. Use `INTERSECT` on two lists of
          `customer_id` values from `orders`.
        solution: |
          SELECT COUNT(*) AS customers
          FROM (
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2023-01-01'
                AND order_date < '2024-01-01'
              INTERSECT
              SELECT customer_id
              FROM orders
              WHERE order_date >= '2024-01-01'
                AND order_date < '2025-01-01'
          ) AS both_years;
        columnNames: true
        hints:
          - Build one list of customers for 2023, and one list for 2024.
          - "`INTERSECT` keeps only the values that appear in both lists."
          - "SELECT COUNT(*) AS customers FROM (SELECT customer_id FROM orders WHERE ... INTERSECT SELECT customer_id FROM orders WHERE ...) AS both_years;"
        explanation: |
          `INTERSECT` removes duplicates, so each customer is counted once. 85 customers
          ordered in both years. The previous exercise found 6 customers who ordered in
          2023 but not in 2024.
        difficulty: 2

      - type: exercise
        id: m20-l06-e5
        title: Products priced above their category average
        prompt: |
          Show the products whose `price` is **higher than the average price of their
          own category**. Compare each product with the average of its category only,
          not with all products.

          Show four columns: `product_id`, `name`, `category_id` and `price`. Sort the
          rows by `product_id`.
        solution: |
          SELECT p.product_id,
                 p.name,
                 p.category_id,
                 p.price
          FROM products AS p
          WHERE p.price > (
              SELECT AVG(q.price)
              FROM products AS q
              WHERE q.category_id = p.category_id
          )
          ORDER BY p.product_id;
        ordered: true
        columnNames: true
        hints:
          - The inner query calculates an average. Make it match the category of the outer product.
          - "`WHERE q.category_id = p.category_id` links the inner query to the current product."
          - "...WHERE p.price > (SELECT AVG(q.price) FROM products AS q WHERE q.___ = p.category_id) ORDER BY p.product_id;"
        explanation: |
          This is a **correlated subquery**: the inner query depends on the outer row.
          For each product it finds the average of that product's category. 24
          products are priced above their category's average.
        difficulty: 3

      - type: exercise
        id: m20-l06-e6
        title: Running total of 2024 revenue
        prompt: |
          For every month of **2024**, show the revenue of **delivered** orders
          (`status` is `'delivered'`).

          Show three columns:

          - `month`: the month as text in the form `YYYY-MM`, for example `2024-03`
          - `revenue`: the revenue of that month, rounded to 2 decimal places
          - `running_total`: the total of all months from January up to this month,
            calculated from the unrounded amounts and then rounded to 2 decimal places

          Each line's amount is `quantity * unit_price * (1 - discount)`. Sort the rows
          by `month`.
        solution: |
          WITH monthly AS (
              SELECT to_char(o.order_date, 'YYYY-MM') AS month,
                     SUM(i.quantity * i.unit_price
                         * (1 - i.discount)) AS raw_revenue
              FROM orders AS o
              JOIN order_items AS i
                   ON i.order_id = o.order_id
              WHERE o.status = 'delivered'
                AND o.order_date >= '2024-01-01'
                AND o.order_date < '2025-01-01'
              GROUP BY to_char(o.order_date, 'YYYY-MM')
          )
          SELECT month,
                 ROUND(raw_revenue, 2) AS revenue,
                 ROUND(SUM(raw_revenue) OVER (ORDER BY month), 2)
                     AS running_total
          FROM monthly
          ORDER BY month;
        ordered: true
        columnNames: true
        hints:
          - First group the delivered 2024 lines by month, in a CTE.
          - "Use `SUM(...) OVER (ORDER BY month)` for the running total, in the outer query."
          - "...SUM(raw_revenue) OVER (ORDER BY ___) ... FROM monthly ORDER BY ___;"
        explanation: |
          A window function with `ORDER BY` adds up every month so far. The running
          total ends at 145,872.38, which matches the total for 2024. The amounts are
          added before rounding, so the small cent differences do not build up.
        difficulty: 3

    cheatsheet:
      - title: Second highest value
        sql: |
          SELECT DISTINCT discount
          FROM order_items
          ORDER BY discount DESC
          LIMIT 1 OFFSET 1;
        note: "DISTINCT counts values, not rows, so OFFSET skips values."
      - title: Top N per group
        sql: |
          SELECT *
          FROM (
              SELECT category_id, name, price,
                     ROW_NUMBER() OVER (
                         PARTITION BY category_id
                         ORDER BY price DESC, product_id
                     ) AS rn
              FROM products
          ) AS t
          WHERE rn <= 2;
        note: "Filter the row numbers in an outer query, because WHERE runs before window functions."
      - title: Never happened
        sql: |
          SELECT p.product_id
          FROM products AS p
          WHERE NOT EXISTS (
              SELECT 1 FROM order_items AS i
              WHERE i.product_id = p.product_id
          );
        note: "Reads like the question. Safer than NOT IN when NULLs are possible."
      - title: Happened in both periods
        sql: |
          SELECT customer_id FROM orders WHERE order_date < '2024-01-01'
          INTERSECT
          SELECT customer_id FROM orders WHERE order_date >= '2024-01-01';
        note: "INTERSECT keeps the values found in both lists."

  - id: m20-l07
    title: "SQL beyond the database"
    summary: See where SQL goes after this course. Send queries from Python, give dashboards a saved view to read, and learn the ideas behind dbt and your next steps.
    minutes: 35
    steps:
      - type: read
        title: The query leaves the editor
        md: |
          Remember Sam, who pasted a query from the internet? Now he is building a
          monthly report for ShopSmart. He does not type queries into SQL Quest every
          month. He runs them from a Python script, and his dashboard reads the results
          from the database.

          SQL is the language that the database understands. The tools around it change,
          but the query stays the same. Most analysts meet SQL in four places:

          - **Application code**, such as a website that shows an order history
          - **Notebooks and scripts**, such as Python, to analyse and clean the data
          - **BI tools** (business intelligence), such as Tableau, Power BI, Looker or
            Metabase, which draw charts from queries
          - **Transformation tools**, such as dbt, which keep queries in files

      - type: read
        title: Python sends the query
        md: |
          Python connects to a database with a **driver**, a small library that knows
          how to talk to PostgreSQL. `psycopg` is a popular driver for PostgreSQL.

          The code below is shown to read, not to run. It does not run in SQL Quest.
          Look at the three steps: connect, send the SQL, and get the rows back.

          ```python
          # Example only. This does not run in SQL Quest.
          import psycopg

          with psycopg.connect("dbname=shop user=analyst") as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT state, COUNT(*) FROM customers GROUP BY state"
                  )
                  rows = cur.fetchall()
          ```

          The SQL inside the quotes is exactly what you have been writing. Python only
          carries it to the database and brings back the answer.

      - type: read
        title: "Values from Python: use placeholders"
        md: |
          Often the value of the query comes from a user or from another part of the
          program. For example, a report may ask for one state.

          Do **not** glue the text together:

          ```python
          # Unsafe. Do not do this. Example only.
          state = input("State? ")
          cur.execute(
              "SELECT COUNT(*) FROM customers WHERE state = '" + state + "'"
          )
          ```

          If someone types `CA' OR '1'='1`, the query changes meaning. This is called
          **SQL injection**. Instead, send the value as a separate parameter, marked
          with a placeholder such as `%s`:

          ```python
          # Safe. Example only.
          cur.execute(
              "SELECT COUNT(*) FROM customers WHERE state = %s",
              (state,),
          )
          ```

          The driver sends the value separately, so it is never read as SQL commands.

          > [!MISTAKE]
          > Placeholders are for values only. You cannot use one for a table or a
          > column name. Choose those names from a fixed list in your code.

      - type: example
        title: "The same idea inside SQL: a prepared query"
        md: |
          PostgreSQL has its own placeholder, `$1`. A `PREPARE` statement stores a query
          with a slot in it. `EXECUTE` fills the slot with a value. Drivers use the same
          idea behind the scenes.
        sql: |
          PREPARE state_count (text) AS
              SELECT COUNT(*) AS customers
              FROM customers
              WHERE state = $1;

          EXECUTE state_count ('CA');
        after: |
          36 customers live in California. Change `'CA'` to `'TX'` and you get the
          count for Texas, without changing the query. This is what the `%s` in Python
          does for you.

      - type: read
        title: "Pandas: let the database do the heavy work"
        md: |
          **pandas** is a Python library for tables. `pd.read_sql` runs a query and
          puts the result in a table called a **DataFrame**.

          ```python
          # Example only. This does not run in SQL Quest.
          import pandas as pd

          df = pd.read_sql(
              "SELECT state, COUNT(*) AS customers "
              "FROM customers GROUP BY state",
              conn,
          )
          print(df.head())
          ```

          > [!TIP]
          > Do the heavy work in SQL: joins, filters and sums. Then pull only the small
          > result into pandas. Downloading 2,296 order lines to add them up in Python
          > is slower than one `SUM` in the database.

      - type: example
        title: A saved query for dashboards
        md: |
          BI tools work best when the hard query is saved in the database under a
          simple name. A **view** is a saved `SELECT` that acts like a table. Each time
          someone reads the view, the database runs the query again, so the numbers are
          current.
        sql: |
          CREATE VIEW v_state_customers AS
          SELECT state,
                 COUNT(*) AS customers
          FROM customers
          GROUP BY state;

          SELECT state, customers
          FROM v_state_customers
          ORDER BY customers DESC, state
          LIMIT 3;
        after: |
          The dashboard only needs to read `v_state_customers`. It does not need to know
          about `GROUP BY`. The top three states are California (36), Texas (21) and New
          York (17).

          > [!REAL-WORLD]
          > Many teams create one view for each dashboard page. When a rule changes, such
          > as "cancelled orders are excluded", they change the view, and every chart
          > follows.

      - type: example
        title: Views can be built on views
        md: A second view reads from the first one. Every query has explicit column names.
        sql: |
          CREATE VIEW v_state_customers AS
          SELECT state,
                 COUNT(*) AS customers
          FROM customers
          GROUP BY state;

          CREATE VIEW v_big_states AS
          SELECT state,
                 customers
          FROM v_state_customers
          WHERE customers >= 15;

          SELECT state, customers
          FROM v_big_states
          ORDER BY customers DESC, state;
        after: |
          Four states have at least 15 customers: CA, TX, NY and WA. Each layer adds one
          rule with a clear name. A chart can use the top layer without repeating the
          rules underneath it.

      - type: read
        title: "dbt: queries in files"
        md: |
          **dbt** (data build tool) is a popular tool for analytics teams. Each SQL
          `SELECT` lives in its own file, called a **model**. A model can refer to other
          models by name, and dbt builds them in the right order.

          The file below is only an illustration of the idea. It is not runnable here.

          ```sql
          -- models/monthly_revenue.sql (illustration, dbt syntax)
          SELECT month,
                 SUM(line_amount) AS revenue
          FROM {{ ref('delivered_lines') }}
          GROUP BY month;
          ```

          The `{{ ref(...) }}` part is how dbt connects the models. Everything else is
          the SQL you already know. Version control, tests and documentation are added
          around those files.

      - type: read
        title: Where to go next
        md: |
          You now have the core of professional SQL. A practical path from here:

          1. **Practise on real questions.** Pick a question from your work and answer it
             with a query, a check and a short note.
          2. **Read query plans.** Use `EXPLAIN` to see how the database runs a query, as
             you did in the performance module.
          3. **Learn one BI tool** and build one chart from a view.
          4. **Learn Python with pandas**, or the tool your team already uses.
          5. **Learn data modelling.** The star schema from earlier is a good start.

          Keep the habits from this module: name your columns, add tie-breakers, test
          the totals, and write comments that explain why.

      - type: quiz
        id: m20-l07-q1
        question: "A Python script must put a user's text into a query. Which approach is safer?"
        options:
          - "Join the text to the SQL string with + or an f-string"
          - "Pass the text as a parameter and use a placeholder such as %s"
          - "Replace each quote with two quotes, then join the text"
          - "Put the whole query inside a comment"
        answer: 1
        explanation: |
          A placeholder sends the value separately, so the database never reads it as
          SQL. Joining text into the query can let a user change the query (SQL
          injection).

      - type: predict
        id: m20-l07-p1
        question: "How many rows does the final query return?"
        sql: |
          CREATE VIEW v_state_customers AS
          SELECT state,
                 COUNT(*) AS customers
          FROM customers
          GROUP BY state;

          SELECT COUNT(*) AS states
          FROM v_state_customers;
        options: ["12", "150", "140", "An error"]
        answer: 0
        explanation: |
          The view has one row per state, and the customers live in 12 states. The
          dashboard reads the view as a table with 12 rows, not 150 rows.

      - type: fill
        id: m20-l07-f1
        prompt: "Save this query as a view named `v_state_customers`. Complete the first line."
        template: |
          CREATE ___ v_state_customers AS
          SELECT state,
                 COUNT(*) AS customers
          FROM customers
          GROUP BY state;
        answers:
          - ["VIEW"]
        explanation: "`CREATE VIEW` saves the query under a name. After that, anyone can `SELECT` from `v_state_customers`."

      - type: exercise
        id: m20-l07-e1
        title: A view of customers per city
        prompt: |
          Create a view named `v_city_customers` with two columns, `city` and
          `customers`. `customers` is the number of customers in each city.

          The view must have one row per city.
        solution: |
          CREATE VIEW v_city_customers AS
          SELECT city,
                 COUNT(*) AS customers
          FROM customers
          GROUP BY city;
        check: |
          SELECT city, customers
          FROM v_city_customers
          ORDER BY customers DESC, city
          LIMIT 3;
        columnNames: true
        hints:
          - "The view is a `CREATE VIEW name AS` followed by a `SELECT`."
          - Group the customers by `city`, and count them with `COUNT(*)`.
          - "CREATE VIEW v_city_customers AS SELECT city, COUNT(*) AS customers FROM customers ___ city;"
        explanation: |
          The check reads the three largest cities through the view. Los Angeles has 24
          customers, New York 17 and Seattle 15. The view is saved, so the check (and
          any dashboard) reads it as a table.
        difficulty: 1

      - type: exercise
        id: m20-l07-e2
        title: One view of delivered order lines
        prompt: |
          Create a view named `v_delivered_lines`. It has one row for each order line
          that belongs to a **delivered** order. Its columns, in order, are:

          - `order_item_id`
          - `order_id`
          - `product_id`
          - `line_amount`: `quantity * unit_price * (1 - discount)`, with no rounding
        solution: |
          CREATE VIEW v_delivered_lines AS
          SELECT i.order_item_id,
                 i.order_id,
                 i.product_id,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS line_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          WHERE o.status = 'delivered';
        check: |
          SELECT COUNT(*) AS lines,
                 ROUND(SUM(line_amount), 2) AS total
          FROM v_delivered_lines;
        columnNames: true
        hints:
          - Join `order_items` to `orders`, so you can filter by status.
          - Filter with `WHERE o.status = 'delivered'`.
          - "...CREATE VIEW v_delivered_lines AS SELECT i.order_item_id, ... FROM order_items AS i JOIN orders AS o ON o.order_id = i.order_id ___ o.status = 'delivered';"
        explanation: |
          The view has 1,654 lines, and their total is 229,443.50, which matches the
          delivered revenue you calculated earlier. Other reports can now start from
          this view.
        difficulty: 2

      - type: exercise
        id: m20-l07-e3
        title: Top products from the view
        prompt: |
          The view `v_delivered_lines` already exists, because it was built in the
          exercise above. Use it as a dashboard would.

          Show the **4 products with the highest delivered revenue**. Show two columns,
          `product_id` and `revenue`, where `revenue` is the sum of `line_amount`,
          rounded to 2 decimal places.

          Sort by `revenue` from highest to lowest, then by `product_id`.
        setup: |
          CREATE VIEW v_delivered_lines AS
          SELECT i.order_item_id,
                 i.order_id,
                 i.product_id,
                 i.quantity * i.unit_price * (1 - i.discount)
                     AS line_amount
          FROM order_items AS i
          JOIN orders AS o
               ON o.order_id = i.order_id
          WHERE o.status = 'delivered';
        solution: |
          SELECT product_id,
                 ROUND(SUM(line_amount), 2) AS revenue
          FROM v_delivered_lines
          GROUP BY product_id
          ORDER BY revenue DESC, product_id
          LIMIT 4;
        ordered: true
        columnNames: true
        hints:
          - Group the view by `product_id`, then add up `line_amount`.
          - Sort by revenue from highest to lowest before you keep the top four.
          - "...FROM v_delivered_lines GROUP BY product_id ORDER BY ___ DESC, ___ LIMIT ___;"
        explanation: |
          The top product is 17, with $31,930.07. The fourth place (14, with $14,787.27)
          is clearly ahead of the fifth, so the list has no tie at the edge. The
          `product_id` tie-breaker keeps the order fixed anyway.
        difficulty: 2

      - type: exercise
        id: m20-l07-e4
        title: A monthly revenue view
        prompt: |
          Create a view named `v_monthly_revenue` with two columns, `month` and
          `revenue`:

          - `month`: the month of `order_date` as text in the form `YYYY-MM`
          - `revenue`: the revenue of **delivered** orders in that month, using the
            line formula `quantity * unit_price * (1 - discount)`, rounded to 2
            decimal places

          The view must have one row for each month that has delivered orders.
        solution: |
          CREATE VIEW v_monthly_revenue AS
          SELECT to_char(o.order_date, 'YYYY-MM') AS month,
                 ROUND(SUM(i.quantity * i.unit_price
                           * (1 - i.discount)), 2) AS revenue
          FROM orders AS o
          JOIN order_items AS i
               ON i.order_id = o.order_id
          WHERE o.status = 'delivered'
          GROUP BY to_char(o.order_date, 'YYYY-MM');
        check: |
          SELECT month, revenue
          FROM v_monthly_revenue
          WHERE month IN ('2023-01', '2024-12')
          ORDER BY month;
        columnNames: true
        hints:
          - "`to_char(order_date, 'YYYY-MM')` turns a date into text such as 2024-03."
          - Group by the same expression that you show as `month`.
          - "CREATE VIEW v_monthly_revenue AS SELECT to_char(o.order_date, 'YYYY-MM') AS month, ... GROUP BY ___;"
        explanation: |
          January 2023 delivered $5,117.59, and December 2024 delivered $23,367.47. A
          dashboard can now draw the whole time series from one small view.
        difficulty: 2

      - type: exercise
        id: m20-l07-e5
        title: A customer value view
        prompt: |
          Create a view named `v_customer_value` with four columns:
          `customer_id`, `first_name`, `last_name` and `delivered_revenue`.

          It must have **one row for every customer**, including customers who have
          no delivered orders. For them, `delivered_revenue` must be `0`. The other
          values are the sum of `quantity * unit_price * (1 - discount)` over their
          delivered order lines, rounded to 2 decimal places.
        solution: |
          CREATE VIEW v_customer_value AS
          SELECT c.customer_id,
                 c.first_name,
                 c.last_name,
                 COALESCE(ROUND(SUM(i.quantity * i.unit_price
                                    * (1 - i.discount)), 2), 0)
                     AS delivered_revenue
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
                AND o.status = 'delivered'
          LEFT JOIN order_items AS i
                 ON i.order_id = o.order_id
          GROUP BY c.customer_id, c.first_name, c.last_name;
        check: |
          SELECT customer_id, delivered_revenue
          FROM v_customer_value
          WHERE customer_id IN (6, 10, 141)
          ORDER BY customer_id;
        columnNames: true
        hints:
          - Start from `customers` and use LEFT JOINs, so no customer disappears.
          - Put the `status` condition in the `ON` clause of the join to `orders`.
          - "Wrap the rounded sum in COALESCE(..., 0) so customers with no orders show 0."
        explanation: |
          Customer 6 has $8,458.40 delivered, customer 10 has $7,227.87, and customer 141
          has no orders, so the view shows 0. The condition is in `ON`, which keeps
          every customer, the lesson from the debugging module.
        difficulty: 3

      - type: exercise
        id: m20-l07-e6
        title: The executive summary in one query
        prompt: |
          Write one query that returns **one row** with five columns:

          - `total_orders`: the number of orders
          - `delivered_orders`: the number of delivered orders
          - `delivered_revenue`: the revenue of delivered orders, rounded to 2 decimal
            places, using `quantity * unit_price * (1 - discount)`
          - `customers_who_ordered`: the number of different customers with at least one order
          - `customers_never_ordered`: the number of customers with no order

          You may use subqueries or CTEs. Do not use `SELECT *`.
        solution: |
          SELECT (SELECT COUNT(*) FROM orders) AS total_orders,
                 (SELECT COUNT(*) FROM orders
                  WHERE status = 'delivered') AS delivered_orders,
                 (SELECT ROUND(SUM(i.quantity * i.unit_price
                                   * (1 - i.discount)), 2)
                  FROM orders AS o
                  JOIN order_items AS i
                       ON i.order_id = o.order_id
                  WHERE o.status = 'delivered') AS delivered_revenue,
                 (SELECT COUNT(DISTINCT customer_id)
                  FROM orders) AS customers_who_ordered,
                 (SELECT COUNT(*) FROM customers)
                 - (SELECT COUNT(DISTINCT customer_id)
                    FROM orders) AS customers_never_ordered;
        columnNames: true
        hints:
          - Each number can be one small subquery in the `SELECT` list.
          - "Count customers who never ordered as all customers minus the customers who ordered."
          - "Start with `SELECT (SELECT COUNT(*) FROM orders) AS total_orders, ...` and add the other columns the same way."
        explanation: |
          This is the kind of query a dashboard tile runs: 900 orders, 650 delivered,
          revenue of $229,443.50, 140 customers who ordered and 10 who never did. Every
          number is a checked result from earlier lessons, brought together in one row.
        difficulty: 3

    cheatsheet:
      - title: Save a query as a view
        sql: |
          CREATE VIEW v_state_customers AS
          SELECT state, COUNT(*) AS customers
          FROM customers
          GROUP BY state;
        note: "A view is a saved SELECT. Reading it runs the query again."
      - title: A placeholder for a value
        sql: |
          PREPARE state_count (text) AS
              SELECT COUNT(*) FROM customers WHERE state = $1;
          EXECUTE state_count ('CA');
        note: "In Python, use %s and pass the value separately. Never join text into the SQL."
      - title: Keep every customer
        sql: |
          SELECT c.customer_id, COUNT(o.order_id) AS orders
          FROM customers AS c
          LEFT JOIN orders AS o
                 ON o.customer_id = c.customer_id
          GROUP BY c.customer_id;
        note: "LEFT JOIN keeps customers with no orders, and COUNT(column) gives 0 for them."

