  - type: exercise
    id: m20-t23
    lesson: m20-l07
    difficulty: 3
    prompt: |
      Create a view named `v_order_totals` with one row for each order and three
      columns: `order_id`, `customer_id` and `total`.

      `total` is the sum of the order's lines (`quantity * unit_price * (1 - discount)`),
      rounded to 2 decimal places **for each order**.
    solution: |
      CREATE VIEW v_order_totals AS
      SELECT o.order_id,
             o.customer_id,
             ROUND(SUM(i.quantity * i.unit_price
                       * (1 - i.discount)), 2) AS total
      FROM orders AS o
      JOIN order_items AS i
           ON i.order_id = o.order_id
      GROUP BY o.order_id, o.customer_id;
    check: |
      SELECT COUNT(*) AS orders,
             ROUND(SUM(total), 2) AS revenue
      FROM v_order_totals;
    columnNames: true
    hints:
      - Group the order lines by order. Each order must appear once in the view.
      - "`ROUND(SUM(...), 2)` rounds the total of one order."
      - "...FROM orders AS o JOIN order_items AS i ON i.order_id = o.order_id GROUP BY o.order_id, o.customer_id;"
    explanation: |
      The view has one row for each of the 900 orders. Rounding each order first gives
      a revenue of 314,851.15 for all orders together. Rounding only at the end would
      give a slightly different cent value.

  - type: fill
    id: m20-t24
    lesson: m20-l05
    difficulty: 1
    prompt: "Count the different states in the `customers` table. Complete the query."
    template: |
      SELECT ___(DISTINCT state) AS states
      FROM customers;
    answers:
      - ["COUNT"]
