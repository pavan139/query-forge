  - type: exercise
    id: m20-t04
    lesson: m20-l02
    difficulty: 2
    prompt: |
      Show the three suppliers with the most order lines in **delivered** orders.

      Show two columns: `supplier_name` and `delivered_lines`. `delivered_lines` is
      the number of `order_items` rows in delivered orders for that supplier's
      products.

      Sort by `delivered_lines` from highest to lowest, then by `supplier_name`.
    solution: |
      SELECT s.name AS supplier_name,
             COUNT(*) AS delivered_lines
      FROM order_items AS i
      JOIN orders AS o
           ON o.order_id = i.order_id
      JOIN products AS p
           ON p.product_id = i.product_id
      JOIN suppliers AS s
           ON s.supplier_id = p.supplier_id
      WHERE o.status = 'delivered'
      GROUP BY s.name
      ORDER BY delivered_lines DESC, supplier_name
      LIMIT 3;
    ordered: true
    columnNames: true
    hints:
      - Join the order lines to their orders, then to products, then to suppliers.
      - Keep only delivered orders, and group by the supplier's name.
      - "...WHERE o.status = ___ GROUP BY s.name ORDER BY delivered_lines ___, supplier_name LIMIT 3;"
    explanation: |
      Name every column, and give the sort a tie-breaker, so the three rows never
      change place. Jade River Manufacturing leads with 367 lines.

  - type: quiz
    id: m20-t05
    lesson: m20-l02
    difficulty: 1
    question: "What is the best reason to avoid SELECT * in a finished report?"
    options:
      - "It is slower to type than a list of columns"
      - "The result changes when someone adds a column to the table"
      - "PostgreSQL does not allow it in a view"
      - "It always returns NULL for the joined columns"
    answer: 1
    explanation: |
      A report that uses SELECT * shows every column, including new ones added later.
      Listing the columns keeps the result stable and easier to read.

  - type: predict
    id: m20-t06
    lesson: m20-l02
    difficulty: 2
    question: "What does this query return?"
    sql: |
      SELECT COUNT(DISTINCT city) AS cities
      FROM customers;
    options: ["12", "14", "150", "An error"]
    answer: 1
    explanation: |
      The customers live in 14 different cities. `DISTINCT` counts each city once,
