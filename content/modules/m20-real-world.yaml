  - type: exercise
    id: m20-t10
    lesson: m20-l04
    difficulty: 2
    prompt: |
      Create a table called `dim_supplier` with the columns `supplier_key`,
      `supplier_id`, `supplier_name` and `country`, in that order.

      `supplier_key` is 1 for the supplier with the lowest `supplier_id`, 2 for the
      next one, and so on. Number them with `ROW_NUMBER()`, by `supplier_id`.
    solution: |
      CREATE TABLE dim_supplier AS
      SELECT ROW_NUMBER() OVER (ORDER BY supplier_id) AS supplier_key,
             supplier_id,
             name AS supplier_name,
             country
      FROM suppliers;
    check: |
      SELECT supplier_key, supplier_id, supplier_name, country
      FROM dim_supplier
      WHERE supplier_key <= 3
      ORDER BY supplier_key;
    columnNames: true
    hints:
      - Use `CREATE TABLE dim_supplier AS SELECT ...`.
      - "Give the supplier name the alias `supplier_name`."
      - "SELECT ROW_NUMBER() OVER (ORDER BY ___) AS supplier_key, supplier_id, name AS supplier_name, country FROM suppliers;"
    explanation: |
      The check reads the first three keys. Build the dimension with the same pattern
      as `dim_customer`: a surrogate key from `ROW_NUMBER()`, plus the descriptive
      columns.

  - type: exercise
    id: m20-t11
    lesson: m20-l04
    difficulty: 3
    dataset: blank
    prompt: |
      Ben (`customer_id` 2) moved from Boston to Chicago on **2023-06-01**. The
      table `dim_customer_t2` already has his Boston row, which has no end yet.

      Keep his history, Type 2 style. Write two statements:

      1. Close the Boston row: set `valid_to` to `'2023-05-31'` and `is_current`
         to `FALSE`.
      2. Add a Chicago row for customer 2 with `valid_from` `'2023-06-01'`,
         `valid_to` `'9999-12-31'` and `is_current` `TRUE`.
    setup: |
      CREATE TABLE dim_customer_t2 (
          customer_sk INTEGER GENERATED ALWAYS AS IDENTITY
              PRIMARY KEY,
          customer_id INTEGER NOT NULL,
          city        TEXT NOT NULL,
          valid_from  DATE NOT NULL,
          valid_to    DATE NOT NULL,
          is_current  BOOLEAN NOT NULL
      );

      INSERT INTO dim_customer_t2
          (customer_id, city, valid_from, valid_to, is_current)
      VALUES (2, 'Boston', '2022-01-01', '9999-12-31', TRUE);
    solution: |
      UPDATE dim_customer_t2
      SET valid_to = '2023-05-31',
          is_current = FALSE
      WHERE customer_id = 2
        AND is_current;

      INSERT INTO dim_customer_t2
          (customer_id, city, valid_from, valid_to, is_current)
      VALUES (2, 'Chicago', '2023-06-01', '9999-12-31', TRUE);
    check: |
      SELECT customer_id, city, valid_from, valid_to, is_current
      FROM dim_customer_t2
      ORDER BY valid_from;
    columnNames: true
    hints:
      - Close the old row first, with an UPDATE, then add the new row with an INSERT.
      - "The old row is the one where `is_current` is still TRUE."
      - "UPDATE dim_customer_t2 SET valid_to = '2023-05-31', is_current = ___ WHERE customer_id = 2 AND is_current; INSERT ... VALUES (2, 'Chicago', '2023-06-01', '9999-12-31', TRUE);"
    explanation: |
      Type 2 closes the old row and adds a new one, so both cities remain in the
      history. A Type 1 update would have overwritten Boston and lost it.

  - type: quiz
    id: m20-t12
    lesson: m20-l04
    difficulty: 1
    question: "Which of these is best described as a dimension table?"
    options:
      - "payments: one row for each payment received"
      - "order_items: one row for each product inside an order"
      - "categories: one row for each product category, with its name"
      - "reviews: one row for each review written"
    answer: 2
    explanation: |
      A dimension describes things around the facts, such as a category's name. The
      other three record events with numbers, so they are fact tables.

  - type: exercise
    id: m20-t13
    lesson: m20-l05
    difficulty: 1
    prompt: |
      From the `orders` table, show three columns, with one row:

      - `total_orders`: the number of orders
      - `shipped_dates`: the number of orders with a `shipped_date`
      - `missing_dates`: the number of orders with no `shipped_date`
    solution: |
      SELECT COUNT(*) AS total_orders,
             COUNT(shipped_date) AS shipped_dates,
             COUNT(*) FILTER (WHERE shipped_date IS NULL)
                 AS missing_dates
      FROM orders;
    columnNames: true
    hints:
      - "`COUNT(column)` skips the NULL values."
      - "`COUNT(*) FILTER (WHERE shipped_date IS NULL)` counts only the missing dates."
      - "SELECT COUNT(*) AS total_orders, COUNT(___) AS shipped_dates ... FROM orders;"
    explanation: |
      900 orders in total, 766 with a shipped date, and 134 without. The three numbers
      must add up, which is a simple test you can always run.

