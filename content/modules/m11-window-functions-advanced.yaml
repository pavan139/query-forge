  - type: exercise
    id: m11-t06
    lesson: m11-l02
    difficulty: 2
    prompt: |
      For user 2, show the first 10 days of `daily_steps` in date order. Show these columns, in this order: `day`, `steps` and `steps_last_3_days`. The `steps_last_3_days` column is the total steps of that day plus the steps of the 2 calendar days before it. Use a `RANGE` frame with an interval, so the distance is counted in days. Days without a row count as zero.
    solution: |
      SELECT
          day,
          steps,
          SUM(steps) OVER (
              ORDER BY day
              RANGE BETWEEN INTERVAL '2 days' PRECEDING
                        AND CURRENT ROW
          ) AS steps_last_3_days
      FROM daily_steps
      WHERE user_id = 2
      ORDER BY day
      LIMIT 10;
    ordered: true
    columnNames: true
    hints:
      - Use `RANGE`, not `ROWS`. You want the distance in days, not in rows.
      - Inside the brackets write `ORDER BY day`, then `RANGE BETWEEN INTERVAL '2 days' PRECEDING AND CURRENT ROW`.
      - "SELECT day, steps, SUM(steps) OVER (ORDER BY day RANGE BETWEEN ___ PRECEDING AND CURRENT ROW) AS steps_last_3_days FROM daily_steps WHERE user_id = 2 ORDER BY day LIMIT 10;"
    explanation: |
      On 4 March the window covers 2, 3 and 4 March: 7,459 + 7,469 + 6,802 = 21,730. The 1 March row is more than two days earlier, so it is left out.

      On 14 March no earlier row falls within two days, so the value is just that day's 11,578 steps.

  - type: quiz
    id: m11-t07
    lesson: m11-l02
    difficulty: 2
    question: |
      Two rows have the same `ORDER BY` value. With the default frame, what does a running total on the **first** of them include?
    options:
      - "Only its own value"
      - "Its own value and the earlier rows, but not the other row with the same value"
      - "Its own value, the earlier rows and the other row with the same value"
      - "The total of the whole table"
    answer: 2
    explanation: |
      The default frame is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. Rows with the same `ORDER BY` value are called peers, and a RANGE frame always includes all peers of the current row. So the first of the two rows already contains the second one.

  - type: predict
    id: m11-t08
    lesson: m11-l02
    difficulty: 2
    question: |
      What is the value of `n` on the **first** row of this result?
    sql: |
      SELECT
          event_name,
          COUNT(*) OVER (ORDER BY event_name) AS n
      FROM events
      WHERE user_id = 3
      ORDER BY event_name;
    options: ["1", "3", "4", "0"]
    answer: 1
    explanation: |
      The three `app_open` rows have the same `ORDER BY` value, so they are peers. The default frame includes all peers, so every `app_open` row shows n = 3, not 1, 2 and 3.

  - type: fill
    id: m11-t09
    lesson: m11-l02
    difficulty: 2
    prompt: |
      Complete the frame so that each day shows the steps of that day plus the steps of the 2 calendar days before it.
    template: |
      SELECT
          day,
          steps,
          SUM(steps) OVER (
              ORDER BY day
              RANGE BETWEEN ___ PRECEDING
                        AND CURRENT ROW
          ) AS steps_last_3_days
      FROM daily_steps
      WHERE user_id = 2
      ORDER BY day
      LIMIT 10;
    answers:
      - ["INTERVAL '2 days'", "INTERVAL '2 day'"]
    explanation: |
      `INTERVAL '2 days'` measures the distance in dates, not rows. A day with no data does not change which days fall inside the window.

  - type: exercise
    id: m11-t10
    lesson: m11-l03
    difficulty: 1
    prompt: |
      Show each `language` once, with the title of its earliest film. The earliest film has the lowest `release_year`. If two films share the year, use the lower `movie_id`. Show these columns, in this order: `language` and `earliest_title`. Sort by `language`.
    solution: |
      SELECT DISTINCT
          language,
          FIRST_VALUE(title) OVER (
              PARTITION BY language
              ORDER BY release_year, movie_id
          ) AS earliest_title
      FROM movies
      ORDER BY language;
    ordered: true
    columnNames: true
    hints:
      - Use `FIRST_VALUE(title)` in a window that restarts for each language.
      - The window gives the same title on every film of a language, so `DISTINCT` keeps one row per language.
      - "SELECT DISTINCT language, FIRST_VALUE(title) OVER (PARTITION BY ___ ORDER BY ___, ___) AS earliest_title FROM movies ORDER BY language;"
    explanation: |
      Ten languages, one row each. For English the earliest film is The Long Way to Dawn. The window looks at every film of the language, and `DISTINCT` then removes the repeated rows.

  - type: quiz
    id: m11-t11
    lesson: m11-l03
    difficulty: 2
    question: |
      Using the default frame, what does `NTH_VALUE(title, 3) OVER (ORDER BY release_year, movie_id)` show on the **second** row of the table?
    options: ["The title of the first row", "The title of the third row", "NULL", "An error, because the frame is too small"]
    answer: 2
    explanation: |
      On the second row, the default frame contains only the first two rows. There is no third row yet, so `NTH_VALUE` returns NULL. A value appears from the third row onwards.

  - type: predict
    id: m11-t12
    lesson: m11-l03
    difficulty: 2
    question: |
      What is `next_year` on the movie with `movie_id` 3?
    sql: |
      SELECT
          movie_id,
          release_year,
          LAST_VALUE(release_year) OVER (
              ORDER BY movie_id
              ROWS BETWEEN CURRENT ROW
                       AND 1 FOLLOWING
          ) AS next_year
      FROM movies
      WHERE movie_id <= 3
      ORDER BY movie_id;
    options: ["1976", "1982", "1975", "NULL"]
    answer: 1
    explanation: |
      The frame of each row is the current row plus the next row, so the next row's year is shown. But `WHERE` keeps only movies 1 to 3 before the window runs. Movie 3 has no next row in that result, so its frame holds only itself, and `next_year` is its own release year, 1982.

  - type: fill
    id: m11-t13
    lesson: m11-l03
    difficulty: 2
    prompt: |
      Complete the frame so that every film released in 2020 or later shows the longest such film of its age rating. The films are ordered by `duration_min` and then `movie_id`, so the last row of each rating is its longest film.
    template: |
      SELECT
          title,
          age_rating,
          duration_min,
          LAST_VALUE(title) OVER (
              PARTITION BY age_rating
              ORDER BY duration_min, movie_id
              ROWS BETWEEN ___ AND ___
          ) AS longest_in_rating
      FROM movies
      WHERE release_year >= 2020
      ORDER BY age_rating, duration_min, movie_id;
    answers:
      - ["UNBOUNDED PRECEDING"]
      - ["UNBOUNDED FOLLOWING"]
    explanation: |
      `UNBOUNDED PRECEDING` starts the frame at the first row of the rating, and `UNBOUNDED FOLLOWING` ends it at the last row. The whole group is now visible, so `LAST_VALUE` returns the real last row.

  - type: exercise
    id: m11-t14
    lesson: m11-l04
    difficulty: 1
    prompt: |
      For each `age_rating`, find the 90th percentile of `duration_min`, rounded to 1 decimal. Use `PERCENTILE_CONT`. Show these columns, in this order: `age_rating` and `p90_minutes`. Sort by `age_rating`.
    solution: |
      SELECT
          age_rating,
          ROUND(
              PERCENTILE_CONT(0.9) WITHIN GROUP (
                  ORDER BY duration_min
              )::numeric,
              1
          ) AS p90_minutes
      FROM movies
      GROUP BY age_rating
      ORDER BY age_rating;
    ordered: true
    columnNames: true
    hints:
      - A percentile is a group summary, so use `GROUP BY age_rating` and no `OVER`.
      - The syntax is `PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY duration_min)`.
      - "SELECT age_rating, ROUND(PERCENTILE_CONT(___) WITHIN GROUP (ORDER BY ___)::numeric, 1) AS p90_minutes FROM movies GROUP BY ___ ORDER BY age_rating;"
    explanation: |
      About 90% of PG-13 films run for less than 140.7 minutes. The `::numeric` cast is needed, because `PERCENTILE_CONT` returns a double precision number, and PostgreSQL has no `ROUND(double, 1)` for it.

  - type: quiz
    id: m11-t15
    lesson: m11-l04
    difficulty: 1
    question: |
      What does `PERCENT_RANK()` return for the **smallest** value in a column?
    options: ["0", "1", "0.5", "NULL"]
    answer: 0
    explanation: |
      `PERCENT_RANK` is `(rank - 1) / (number of rows - 1)`. The smallest value has rank 1, so the result is 0. The largest value gets 1.

  - type: predict
    id: m11-t16
    lesson: m11-l04
    difficulty: 3
    question: |
      How many films end up in tile 1 of this result?
    sql: |
      SELECT
          tile,
          COUNT(*) AS films
      FROM (
          SELECT NTILE(3) OVER (ORDER BY movie_id) AS tile
          FROM movies
          WHERE movie_id <= 8
      ) t
      GROUP BY tile
      ORDER BY tile;
    options: ["2", "3", "4", "8"]
    answer: 1
    explanation: |
      Eight films are split into three tiles. When the rows do not divide evenly, the first tiles get the extra rows, so the sizes are 3, 3 and 2. Tile 1 holds three films.

  - type: fill
    id: m11-t17
    lesson: m11-l04
    difficulty: 2
    prompt: |
      Complete the query to find the median (the 50th percentile) of `box_office_musd`. Films with a NULL box office are ignored.
    template: |
      SELECT
          PERCENTILE_CONT(___) WITHIN GROUP (
              ORDER BY ___
          ) AS median_box_office
      FROM movies;
    answers:
      - ["0.5"]
      - ["box_office_musd"]
    explanation: |
      `PERCENTILE_CONT(0.5)` is the median. Its `ORDER BY` names the column to measure. The median box office is 106.7 million dollars, well below the average of 233.55, because a few huge hits pull the average up.

  - type: exercise
    id: m11-t18
    lesson: m11-l05
    difficulty: 1
    prompt: |
      For films released in 2020 or later, number the films within each `age_rating`, from the newest release to the oldest. Define one named window called `newest_first` in a `WINDOW` clause and use it with `ROW_NUMBER()`. Break ties in the release year with `movie_id`. Show these columns, in this order: `age_rating`, `title`, `release_year` and `pos`. Sort by `age_rating`, then `pos`.
    solution: |
      SELECT
          age_rating,
          title,
          release_year,
          ROW_NUMBER() OVER newest_first AS pos
      FROM movies
      WHERE release_year >= 2020
      WINDOW newest_first AS (
          PARTITION BY age_rating
          ORDER BY release_year DESC, movie_id
      )
      ORDER BY age_rating, pos;
    ordered: true
    columnNames: true
    hints:
      - Use `ROW_NUMBER()` with an `OVER` clause that names the window.
      - The `WINDOW` clause goes after `WHERE` and before `ORDER BY`, as `WINDOW newest_first AS (...)`.
      - "SELECT age_rating, title, release_year, ROW_NUMBER() OVER ___ AS pos FROM movies WHERE release_year >= 2020 WINDOW newest_first AS (PARTITION BY ___ ORDER BY ___ DESC, ___) ORDER BY age_rating, pos;"
    explanation: |
      Fifteen films. Each rating starts again at 1 with its newest film. Defining the window once means the partition and the sort order can never disagree between columns.

  - type: exercise
    id: m11-t19
    lesson: m11-l05
    difficulty: 3
    prompt: |
      For each `language` that has at least 3 films with a known budget, show its top 2 films by `budget_musd`. Ignore films with a NULL budget. If two films have the same budget, the lower `movie_id` comes first. Show these columns, in this order: `language`, `pos`, `title` and `budget_musd`, where `pos` is 1 for the top film and 2 for the runner-up. Sort by `language`, then `pos`.
    solution: |
      WITH ranked AS (
          SELECT
              language,
              title,
              budget_musd,
              ROW_NUMBER() OVER by_budget AS pos,
              COUNT(*) OVER (
                  PARTITION BY language
              ) AS n
          FROM movies
          WHERE budget_musd IS NOT NULL
          WINDOW by_budget AS (
              PARTITION BY language
              ORDER BY budget_musd DESC, movie_id
          )
      )
      SELECT
          language,
          pos,
          title,
          budget_musd
      FROM ranked
      WHERE n >= 3
        AND pos <= 2
      ORDER BY language, pos;
    ordered: true
    columnNames: true
    hints:
      - Number the films in a CTE, then filter in the outer query. Window functions cannot go in `WHERE`.
      - Count the films per language in the same CTE with `COUNT(*) OVER (PARTITION BY language)`, so the outer `WHERE` can check `n >= 3`.
      - "WITH ranked AS (SELECT language, title, budget_musd, ROW_NUMBER() OVER by_budget AS pos, COUNT(*) OVER (PARTITION BY ___) AS n FROM movies WHERE ___ IS NOT NULL WINDOW by_budget AS (PARTITION BY ___ ORDER BY ___ DESC, movie_id)) SELECT ... FROM ranked WHERE n >= 3 AND pos <= 2 ORDER BY language, pos;"
    explanation: |
      Only four languages qualify: English, French, German and Spanish. English has the biggest budget in the list, 293.0 million dollars for The Cloud Cobbler.

      The named window `by_budget` is defined once and used by `ROW_NUMBER()`. The count `n` sits in the same layer, so the outer `WHERE` can filter on it.

  - type: quiz
    id: m11-t20
    lesson: m11-l05
    difficulty: 2
    question: |
      Which order do the clauses appear in, in a `SELECT` that uses a `WINDOW` clause?
    options:
      - "WHERE, GROUP BY, HAVING, WINDOW, ORDER BY"
      - "WINDOW, WHERE, GROUP BY, HAVING, ORDER BY"
      - "WHERE, WINDOW, GROUP BY, HAVING, ORDER BY"
      - "WHERE, GROUP BY, WINDOW, ORDER BY, HAVING"
    answer: 0
    explanation: |
      `WINDOW` comes after `HAVING` and before `ORDER BY`. The other three orders put it in the wrong place, and PostgreSQL reports a syntax error for each of them.

  - type: parsons
    id: m11-t21
    lesson: m11-l05
    difficulty: 3
    prompt: |
      Put the lines in the right order to find the shortest film of each `age_rating`. Use a CTE to number the films inside each rating, then keep only number 1.
    lines:
      - WITH ranked AS (
      - SELECT title, age_rating, duration_min,
      - ROW_NUMBER() OVER (PARTITION BY age_rating ORDER BY duration_min, movie_id) AS pos
      - FROM movies)
      - SELECT title, age_rating, duration_min
      - FROM ranked
      - WHERE pos = 1
      - ORDER BY age_rating;
    distractors:
      - WHERE ROW_NUMBER() OVER (ORDER BY duration_min) = 1
    explanation: |
      The CTE comes first. The filter `pos = 1` can only see `pos` after it has been calculated in the layer before. The distractor cannot be used, because window functions are not allowed in `WHERE`.

  - type: exercise
    id: m11-t22
    lesson: m11-l06
    difficulty: 2
    prompt: |
      For accounts 1 to 5, show the balance after each account's last transaction. Use a running total of `amount` in time order (`txn_time`, then `txn_id`). Show these columns, in this order: `account_id` and `final_balance`. Sort by `account_id`.
    solution: |
      WITH running AS (
          SELECT
              account_id,
              txn_time,
              txn_id,
              SUM(amount) OVER (
                  PARTITION BY account_id
                  ORDER BY txn_time, txn_id
              ) AS balance,
              ROW_NUMBER() OVER (
                  PARTITION BY account_id
                  ORDER BY txn_time DESC, txn_id DESC
              ) AS last_pos
          FROM transactions
          WHERE account_id BETWEEN 1 AND 5
      )
      SELECT
          account_id,
          balance AS final_balance
      FROM running
      WHERE last_pos = 1
      ORDER BY account_id;
    ordered: true
    columnNames: true
    hints:
      - Calculate the running total in a CTE. Add a second window that numbers each account's transactions from the newest to the oldest.
      - In the outer query, keep only the row where that number is 1.
      - "WITH running AS (SELECT account_id, txn_time, txn_id, SUM(amount) OVER (PARTITION BY account_id ORDER BY ___, ___) AS balance, ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY txn_time DESC, ___ DESC) AS last_pos FROM transactions WHERE account_id BETWEEN 1 AND 5) SELECT account_id, balance AS final_balance FROM running WHERE last_pos = 1 ORDER BY account_id;"
    explanation: |
      Five rows. Account 3 finishes with the biggest balance, 33,301.71. The running total is worked out in the CTE, and the "last row" filter sits in the outer query.

  - type: exercise
    id: m11-t23
    lesson: m11-l06
    difficulty: 3
    prompt: |
      For the `travel` category of card payments, show each month's top merchant: the merchant with the highest card spending that month. Show these columns, in this order: `month_start`, `merchant`, `spent` (rounded to 2 decimals) and `pct` (its share of that month's travel spending, rounded to 1 decimal). Sort by `month_start`.
    solution: |
      WITH monthly AS (
          SELECT
              merchant,
              date_trunc('month', txn_time)::date AS month_start,
              ROUND(-SUM(amount), 2) AS spent
          FROM transactions
          WHERE txn_type = 'card_payment'
            AND category = 'travel'
          GROUP BY merchant,
                   date_trunc('month', txn_time)::date
      ),
      ranked AS (
          SELECT
              merchant,
              month_start,
              spent,
              RANK() OVER (
                  PARTITION BY month_start
                  ORDER BY spent DESC
              ) AS rnk,
              ROUND(
                  100 * spent
                  / SUM(spent)
                        OVER (PARTITION BY month_start),
                  1
              ) AS pct
          FROM monthly
      )
      SELECT
          month_start,
          merchant,
          spent,
          pct
      FROM ranked
      WHERE rnk = 1
      ORDER BY month_start;
    ordered: true
    columnNames: true
    hints:
      - Total each merchant per month in a CTE first.
      - In the next layer, rank the merchants inside each month and calculate each share with `SUM(spent) OVER (PARTITION BY month_start)`.
      - "WITH monthly AS (SELECT merchant, date_trunc('month', txn_time)::date AS month_start, ROUND(-SUM(amount), 2) AS spent FROM transactions WHERE txn_type = 'card_payment' AND category = 'travel' GROUP BY ___) ... SELECT ... FROM ranked WHERE rnk = 1 ORDER BY month_start;"
    explanation: |
      Twelve months, one top merchant each. In October, SkyHop Airlines took 47.0% of that month's travel spending. Each share is measured inside its own month, so the shares never add up across months.

  - type: exercise
    id: m11-t24
    lesson: m11-l06
    difficulty: 1
    prompt: |
      For account 4, show each transaction in time order (`txn_time`, then `txn_id`). Show these columns, in this order: `txn_time`, `amount` and `txns_so_far`. The `txns_so_far` column is how many of account 4's transactions have happened so far, counting this one.
    solution: |
      SELECT
          txn_time,
          amount,
          COUNT(*) OVER (
              ORDER BY txn_time, txn_id
          ) AS txns_so_far
      FROM transactions
      WHERE account_id = 4
      ORDER BY txn_time, txn_id;
    ordered: true
    columnNames: true
    hints:
      - A running count is a window `COUNT(*)` with an `ORDER BY` inside the brackets.
      - Filter to account 4 in `WHERE`, and put `ORDER BY txn_time, txn_id` inside `OVER (...)`.
      - "SELECT txn_time, amount, COUNT(*) OVER (ORDER BY ___, ___) AS txns_so_far FROM transactions WHERE account_id = ___ ORDER BY ___, ___;"
    explanation: |
      Account 4 has 21 transactions, so the last row shows 21. `WHERE` keeps only one account, so you do not need `PARTITION BY` here.

  - type: parsons
    id: m11-t25
    lesson: m11-l06
    difficulty: 2
    prompt: |
      Put the lines in the right order to show each month's card spending and how much it changed from the month before.
    lines:
      - WITH monthly AS (
      - SELECT date_trunc('month', txn_time)::date AS month_start,
      - ROUND(-SUM(amount), 2) AS spent
      - FROM transactions
      - WHERE txn_type = 'card_payment'
      - GROUP BY date_trunc('month', txn_time)::date)
      - SELECT month_start, spent,
      - spent - LAG(spent) OVER (ORDER BY month_start) AS change_vs_prev
      - FROM monthly
      - ORDER BY month_start;
    distractors:
      - HAVING LAG(spent) OVER (ORDER BY month_start) > 0
    explanation: |
      The totals come first, in the CTE. Then `LAG` reads the previous month's total. January has no earlier month, so its change is NULL.

      The distractor fails, because window functions are not allowed in `HAVING`.

project:
  id: m11-proj
  title: Streaming Trends
  icon: "📺"
  dataset: movies
  md: |
    FlickNest's content team meets every Monday with one question: *what is really trending, and is it growing?*

    You will answer it with the viewing log (`watch_history`), the catalog (`movies`) and the ratings. The seven tasks build on each other: first the monthly trend, then the most-watched films, then the rating leaders, and finally a hit list that combines everything.

    Each task says exactly which columns to show and in which order. Read them carefully.
  tasks:
    - type: exercise
      id: m11-proj-1
      title: Is viewing growing?
      difficulty: 1
      prompt: |
        Count the plays in each month of 2024, using `started_at`. Show these columns, in this order: `month_start` (the first day of the month), `plays` and `trend_3m`. The `trend_3m` column is the average of this month's plays and the two months before it, rounded to 1 decimal. For January and February, use only the months that exist. Sort by `month_start`.
      solution: |
        WITH monthly AS (
            SELECT
                date_trunc('month', started_at)::date AS month_start,
                COUNT(*) AS plays
            FROM watch_history
            GROUP BY date_trunc('month', started_at)::date
        )
        SELECT
            month_start,
            plays,
            ROUND(
                AVG(plays) OVER (
                    ORDER BY month_start
                    ROWS BETWEEN 2 PRECEDING
                             AND CURRENT ROW
                ),
                1
            ) AS trend_3m
        FROM monthly
        ORDER BY month_start;
      ordered: true
      columnNames: true
      hints:
        - Count the plays per month in a CTE first.
        - A 3-month average uses the frame `ROWS BETWEEN 2 PRECEDING AND CURRENT ROW`.
        - "WITH monthly AS (SELECT date_trunc('month', started_at)::date AS month_start, COUNT(*) AS plays FROM watch_history GROUP BY ___) SELECT month_start, plays, ROUND(AVG(plays) OVER (ORDER BY month_start ROWS BETWEEN ___ PRECEDING AND CURRENT ROW), 1) AS trend_3m FROM monthly ORDER BY month_start;"
      explanation: |
        Plays rose from 507 in March to 826 in June. The trend lags behind the raw numbers: June's trend is 691.3, not 826, because the average still includes April and May.

    - type: exercise
      id: m11-proj-2
      title: Which films carry the viewing?
      difficulty: 1
      prompt: |
        Find the five most-watched films: most plays first, then title A to Z. For each one show `title`, `plays` and `cumulative_pct`. The `cumulative_pct` column is the running share of **all** plays, from the first film down to this one, rounded to 1 decimal. Show the columns in that order.
      solution: |
        WITH film_plays AS (
            SELECT
                m.title,
                COUNT(*) AS plays
            FROM watch_history w
            JOIN movies m
                ON m.movie_id = w.movie_id
            GROUP BY m.movie_id, m.title
        )
        SELECT
            title,
            plays,
            ROUND(
                100 * SUM(plays) OVER (
                    ORDER BY plays DESC, title
                    ROWS BETWEEN UNBOUNDED PRECEDING
                             AND CURRENT ROW
                )
                / SUM(plays) OVER (),
                1
            ) AS cumulative_pct
        FROM film_plays
        ORDER BY plays DESC, title
        LIMIT 5;
      ordered: true
      columnNames: true
      hints:
        - Count the plays per film in a CTE. Join `watch_history` to `movies` to get the title.
        - For the running share, use `SUM(plays) OVER (ORDER BY plays DESC, title ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)`.
        - "... ROUND(100 * SUM(plays) OVER (ORDER BY ___ DESC, title ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / SUM(plays) OVER (), 1) AS cumulative_pct FROM film_plays ORDER BY plays DESC, title LIMIT 5;"
      explanation: |
        The top film, Rain Over Valparaiso, has 167 plays. That is 4.6% of all 3,654 plays. The top five films together account for 18.9%.

    - type: exercise
      id: m11-proj-3
      title: The best film of each decade
      difficulty: 2
      prompt: |
        Find the most-watched film of each release decade. A decade is the release year rounded down to the decade, so 1994 belongs to 1990. Count the plays per film. Within each decade, the film with the most plays comes first; if two films have the same number of plays, the title that comes first alphabetically wins. Show `decade`, `title` and `plays` for the first film of each decade, sorted by `decade`.
      solution: |
        WITH per_film AS (
            SELECT
                m.movie_id,
                m.title,
                (m.release_year / 10) * 10 AS decade,
                COUNT(*) AS plays
            FROM watch_history w
            JOIN movies m
                ON m.movie_id = w.movie_id
            GROUP BY m.movie_id, m.title, m.release_year
        ),
        ranked AS (
            SELECT
                decade,
                title,
                plays,
                ROW_NUMBER() OVER (
                    PARTITION BY decade
                    ORDER BY plays DESC, title
                ) AS pos
            FROM per_film
        )
        SELECT
            decade,
            title,
            plays
        FROM ranked
        WHERE pos = 1
        ORDER BY decade;
      ordered: true
      columnNames: true
      hints:
        - Count the plays per film in a CTE first. Keep the release year, because you need it for the decade.
        - Number the films inside each decade with `ROW_NUMBER()`, ordered by plays from highest to lowest and then by title. Keep number 1 in the outer query, because window functions cannot go in `WHERE`.
        - "WITH per_film AS (... ), ranked AS (SELECT decade, title, plays, ROW_NUMBER() OVER (PARTITION BY ___ ORDER BY plays DESC, ___) AS pos FROM per_film) SELECT decade, title, plays FROM ranked WHERE pos = 1 ORDER BY ___;"
      explanation: |
        Six decades, six winners. Rain Over Valparaiso, from the 2020s with 167 plays, is the most-watched film in the whole catalog. Integer division drops the decimals: 1994 / 10 gives 199, and 199 * 10 gives 1990.

    - type: exercise
      id: m11-proj-4
      title: Popularity quartiles
      difficulty: 2
      prompt: |
        Split the 109 films that have at least one play into four nearly equal-sized popularity groups (quartiles) with `NTILE(4)`. Order the films by plays from highest to lowest, then by title A to Z, so quartile 1 holds the most-watched films. For each quartile show `quartile`, `films` (how many films), `min_plays` and `max_plays`. Sort by `quartile`.
      solution: |
        WITH per_film AS (
            SELECT
                m.title,
                COUNT(*) AS plays
            FROM watch_history w
            JOIN movies m
                ON m.movie_id = w.movie_id
            GROUP BY m.movie_id, m.title
        ),
        quartiled AS (
            SELECT
                title,
                plays,
                NTILE(4) OVER (
                    ORDER BY plays DESC, title
                ) AS quartile
            FROM per_film
        )
        SELECT
            quartile,
            COUNT(*) AS films,
            MIN(plays) AS min_plays,
            MAX(plays) AS max_plays
        FROM quartiled
        GROUP BY quartile
        ORDER BY quartile;
      ordered: true
      columnNames: true
      hints:
        - Count the plays per film in a CTE, as in the last task.
        - "`NTILE(4) OVER (ORDER BY plays DESC, title)` puts each film into a group from 1 to 4."
        - In the outer query, group by `quartile` and use `COUNT(*)`, `MIN(plays)` and `MAX(plays)`.
      explanation: |
        When 109 films do not divide evenly by 4, NTILE gives the first group one extra film. Quartile 1 has 28 films, and its least-watched film still has 44 plays. The most-watched film of quartile 4 has only 13.

    - type: exercise
      id: m11-proj-5
      title: How long do people watch?
      difficulty: 2
      prompt: |
        For each `device`, find the median and the 90th percentile of `minutes_watched`. Round both to 1 decimal. Show `device`, `median_minutes` and `p90_minutes`, sorted by `device`.
      solution: |
        SELECT
            device,
            ROUND(
                PERCENTILE_CONT(0.5) WITHIN GROUP (
                    ORDER BY minutes_watched
                )::numeric,
                1
            ) AS median_minutes,
            ROUND(
                PERCENTILE_CONT(0.9) WITHIN GROUP (
                    ORDER BY minutes_watched
                )::numeric,
                1
            ) AS p90_minutes
        FROM watch_history
        GROUP BY device
        ORDER BY device;
      ordered: true
      columnNames: true
      hints:
        - Percentiles are group summaries, so use `GROUP BY device`.
        - The syntax is `PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY minutes_watched)`. Use 0.9 for the 90th percentile.
        - Wrap each one in `ROUND(... ::numeric, 1)` to get one decimal.
      explanation: |
        On TV the median play lasts 45.0 minutes. The 90th percentile is between 116.7 and 118.0 minutes on every device, so the longest tenth of plays looks alike everywhere.

    - type: exercise
      id: m11-proj-6
      title: Within reach of the best
      difficulty: 3
      prompt: |
        Only films with at least 5 ratings count. For each film, compute its average rating rounded to 2 decimals (`avg_stars`) and count its ratings (`n`). Group the films by release decade (1994 belongs to 1990). Within each decade, find the best average (`best_in_decade`). Keep only the films whose `avg_stars` is at least `best_in_decade - 0.20`, comparing the rounded averages. Show `decade`, `title`, `avg_stars`, `n` and `best_in_decade`, sorted by `decade`, then `avg_stars` from highest to lowest, then `title`.
      solution: |
        WITH rated AS (
            SELECT
                m.movie_id,
                m.title,
                (m.release_year / 10) * 10 AS decade,
                ROUND(AVG(r.stars), 2) AS avg_stars,
                COUNT(*) AS n
            FROM ratings r
            JOIN movies m
                ON m.movie_id = r.movie_id
            GROUP BY m.movie_id, m.title, m.release_year
            HAVING COUNT(*) >= 5
        ),
        best AS (
            SELECT
                decade,
                title,
                avg_stars,
                n,
                FIRST_VALUE(avg_stars) OVER (
                    PARTITION BY decade
                    ORDER BY avg_stars DESC, title
                ) AS best_in_decade
            FROM rated
        )
        SELECT
            decade,
            title,
            avg_stars,
            n,
            best_in_decade
        FROM best
        WHERE avg_stars >= best_in_decade - 0.20
        ORDER BY decade, avg_stars DESC, title;
      ordered: true
      columnNames: true
      hints:
        - Build the averages in a CTE first. Use `HAVING COUNT(*) >= 5` to keep only films with at least 5 ratings.
        - In the next layer, use `FIRST_VALUE(avg_stars) OVER (PARTITION BY decade ORDER BY avg_stars DESC, title)` to get the best average of each decade.
        - "... WHERE avg_stars >= best_in_decade - ___ ORDER BY decade, avg_stars DESC, title;"
      explanation: |
        Fourteen films qualify. In the 2020s the best average is 4.60 (Moonwalk Motel, from 5 ratings), so the cut-off is 4.40 and The Last Terraformer, at 4.42, stays on the list.

    - type: exercise
      id: m11-proj-7
      title: The hit list
      difficulty: 3
      prompt: |
        Build the hit list. Only films with at least 20 plays are in the race. Among those films, compute the `PERCENT_RANK()` of plays, rounded to 2 decimals, where 0 means least watched and 1 means most watched. Keep the films whose percent rank is 0.90 or more. Show `title`, `plays` and `pct_rank`, sorted by `plays` from highest to lowest, then `title`.
      solution: |
        WITH hits AS (
            SELECT
                m.title,
                COUNT(*) AS plays
            FROM watch_history w
            JOIN movies m
                ON m.movie_id = w.movie_id
            GROUP BY m.movie_id, m.title
            HAVING COUNT(*) >= 20
        ),
        scored AS (
            SELECT
                title,
                plays,
                ROUND(
                    PERCENT_RANK() OVER (ORDER BY plays)::numeric,
                    2
                ) AS pct_rank
            FROM hits
        )
        SELECT
            title,
            plays,
            pct_rank
        FROM scored
        WHERE pct_rank >= 0.9
        ORDER BY plays DESC, title;
      ordered: true
      columnNames: true
      hints:
        - Keep only films with at least 20 plays in a CTE, using `HAVING COUNT(*) >= 20`.
        - In the next layer, calculate `PERCENT_RANK() OVER (ORDER BY plays)`. It only sees the films in the first layer.
        - "... WHERE pct_rank >= ___ ORDER BY plays DESC, title;"
      explanation: |
        Seven films make the hit list. Rain Over Valparaiso is at 1.00, the top of the race. PERCENT_RANK counts only the 62 films with at least 20 plays, not the whole catalog.

