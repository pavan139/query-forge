glossary:
  - term: DDL (Data Definition Language)
    definition: The group of SQL commands that build and change the structure of a database, such as CREATE, ALTER and DROP. DDL changes the shape of tables, not the rows inside them (that work is DML).
    example: "CREATE TABLE plants (plant_id integer, name text);"
    module: m13

  - term: Constraint
    definition: A rule written into a table that the database checks every time a row is added or changed. A row that breaks a constraint is refused and nothing is saved.
    example: "price numeric(6,2) CHECK (price > 0)"
    module: m13

  - term: UNIQUE constraint
    definition: A rule that no two rows may hold the same value in the column (or combination of columns). A table can have many UNIQUE rules. Several rows may still hold NULL, because NULL means unknown.
    example: "email text UNIQUE"
    module: m13

  - term: NOT NULL constraint
    definition: A rule that a column must always have a value. An empty cell is refused.
    example: "name text NOT NULL"
    module: m13

  - term: CHECK constraint
    definition: A rule with a condition in brackets that every row must satisfy. If the condition is false for a row, the row is refused.
    example: "loyalty_points integer CHECK (loyalty_points >= 0)"
    module: m13

  - term: DEFAULT value
    definition: The value the database uses for a column when you leave that column out of an INSERT. A default does not refuse anything; it only fills the gap.
    example: "status text DEFAULT 'new'"
    module: m13

  - term: Referential action (ON DELETE)
    definition: The choice written on a foreign key that decides what happens to child rows when the parent row is deleted. The main choices are refusing the delete (the default), CASCADE (delete the children too) and SET NULL (clear the link).
    example: "customer_id integer REFERENCES customers (customer_id) ON DELETE CASCADE"
    module: m13

  - term: Normalization
    definition: The process of arranging tables so that each fact is stored in exactly one place. It removes repeated data and the update problems it causes. The steps are called the normal forms (1NF, 2NF and 3NF).
    example: "A sheet that repeats a customer's city on every order is split into a customers table and an orders table."
    module: m13

  - term: One-to-one relationship
    definition: A link where each row in one table matches at most one row in the other, and the reverse is also true. It is built by making the child's primary key also a foreign key.
    example: "library_cards.member_id is both the primary key and a foreign key to members.member_id."
    module: m13

  - term: Many-to-many relationship
    definition: A link where many rows in one table can match many rows in the other, such as books and authors. It needs a junction table with one row for each matching pair.
    example: "book_authors(book_id, author_id) with PRIMARY KEY (book_id, author_id)"
    module: m13

  - term: Identity column
    definition: An integer column that the database numbers automatically when you insert a row. GENERATED ALWAYS refuses values you type yourself; GENERATED BY DEFAULT allows them.
    example: "ticket_id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY"
    module: m13

  - term: Sequence
    definition: A counter stored in the database that hands out a new number each time it is asked with nextval(). Numbers never repeat, but they can skip when an insert fails.
    example: "CREATE SEQUENCE invoice_seq START WITH 100;  SELECT nextval('invoice_seq');"
    module: m13

  - term: Generated column
    definition: A column whose value is calculated by the database from other columns in the same row. You cannot type into it. STORED keeps the result saved with the row.
    example: "total numeric(8,2) GENERATED ALWAYS AS (qty * unit_price) STORED"
    module: m13

  - term: Schema
    definition: A named group of tables, like a folder. A table is written as schema.table, and the default schema of a new database is public.
    example: "CREATE SCHEMA library; CREATE TABLE library.books (book_id integer PRIMARY KEY, title text);"
    module: m13

  - term: Temporary table
    definition: A table created with CREATE TEMP TABLE. It is visible only to your current session and is removed automatically when you disconnect.
    example: "CREATE TEMP TABLE long_books AS SELECT title FROM books WHERE pages > 300;"
    module: m13
